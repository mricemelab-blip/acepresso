\u003e\u003ctd\u003e耐力运动员\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch5-s823\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：\u003c/p\u003e\n\u003cp\u003e• IFT模式三期：基础训练→健身训练→运动表现\u003c/p\u003e\n\u003cp\u003e• 第一期：无评估，建习惯，1区训练\u003c/p\u003e\n\u003cp\u003e• 第二期：测VT1，围绕阈值间歇，大多数人终点站\u003c/p\u003e\n\u003cp\u003e• 第三期：测VT2，极化训练（70/10/20），仅限耐力运动员\u003c/p\u003e\n\u003cp\u003e• 在特定的极化训练设计中，二区训练的占比通常较低，但并不意味着该区域没有训练价值\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e为什么说IFT第二期是&quot;大多数客户的终点站&quot;？什么情况下需要进阶到第三期？\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● 一期建习惯（无评估，Zone 1）\u003c/p\u003e\n\u003cp\u003e● 二期提耐力（VT1测试，阈值间歇）\u003c/p\u003e\n\u003cp\u003e● 三期专表现（VT2测试+极化训练70/10/10-20）\u003c/p\u003e\n\u003cp\u003e● 运动表现阶段中，二区的训练占比应服务于项目和周期目标\u003c/p\u003e\n\u003ch3 id=\"ch5-s837\"\u003e本章知识点总结与练习\u003c/h3\u003e\n\u003ch4 id=\"ch5-s838\"\u003e核心要义凝练\u003c/h4\u003e\n\u003cp\u003e1. 心血管循环：体循环（全身供氧）和肺循环（肺部充氧）构成闭合系统；心脏四腔室负责接收（心房）和泵血（心室）\u003c/p\u003e\n\u003cp\u003e2. 呼吸核心：膈肌是唯一对生命至关重要的骨骼肌；吸气下降、呼气上升，原理类似针管活塞\u003c/p\u003e\n\u003cp\u003e3. 氧气物流链：摄氧（肺+血红蛋白）→输氧（HR×SV）→用氧（线粒体），三环缺一不可\u003c/p\u003e\n\u003cp\u003e4. 适应机制：毛细血管↑、线粒体↑、糖原↑；渐进超负荷是核心原则；6个月达平台期\u003c/p\u003e\n\u003cp\u003e5. 环境安全：热衰竭（&lt;40℃）vs 中暑（≥40℃）；低温防血管收缩；高海拔首日禁训；规避污染\u003c/p\u003e\n\u003cp\u003e6. 大众指南：每周150/75分钟；FITTVP六大要素；六种强度判定\u003c/p\u003e\n\u003cp\u003e7. IFT三期：一期建习惯（RPE3-4）→二期提耐力（VT1）→三期专表现（VT2+极化）\u003c/p\u003e\n\u003ch4 id=\"ch5-s846\"\u003e思考与练习\u003c/h4\u003e\n\u003cp\u003e开放思考题：\u003c/p\u003e\n\u003cp\u003e综合本章内容，为一名久坐办公、想改善体能的40岁客户，设计一个从IFT第一期过渡到第二期的12周训练计划框架。\u003c/p\u003e\n\u003cp\u003e选择题：\u003c/p\u003e\n\u003cp\u003e关于IFT模式与心肺训练，以下说法正确的是？\u003c/p\u003e\n\u003cp\u003e- A. IFT三个阶段分别对应不同的训练强度和供能系统\u003c/p\u003e\n\u003cp\u003e- B. 靶心率计算需要知道最大心率和静息心率\u003c/p\u003e\n\u003cp\u003e- C. VT1是运动中呼吸开始急促的拐点\u003c/p\u003e\n\u003cp\u003e- D. 以上全部正确\u003c/p\u003e\n\u003cp\u003e选择题答案：D\u003c/p\u003e\n\u003cp\u003e解析：\u003c/p\u003e\n\u003cp\u003e• A正确：IFT三期对应脂肪供能→混合供能→糖酵解主导供能\u003c/p\u003e\n\u003cp\u003e• B正确：靶心率=（220-年龄-静息心率）×强度%+静息心率\u003c/p\u003e\n\u003cp\u003e• C正确：VT1是第一通气阈，呼吸开始显著增加\u003c/p\u003e\n\u003cp\u003e• D正确：以上全部正确\u003c/p\u003e\n\u003ch3 id=\"ch5-s861\"\u003e学员复习专用\u003c/h3\u003e\n\u003ch3 id=\"ch5-s862\"\u003e9 小结\u003c/h3\u003e\n\u003ch3 id=\"ch5-s863\"\u003e一、核心回顾\u003c/h3\u003e\n\u003cp\u003e本章核心：心肺训练的核心是改善人体携氧、输氧和摄取氧的整体能力，IFT模式通过三期进阶设计，从习惯养成到运动表现，循序渐进地提高心肺适能。\u003c/p\u003e\n\u003ch3 id=\"ch5-s865\"\u003e二、知识脉络图\u003c/h3\u003e\n\u003ch3 id=\"ch5-s866\"\u003e三、考前必背表\u003c/h3\u003e\n\u003cp\u003e表5-42\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e类别\u003c/th\u003e\u003cth\u003e必背内容\u003c/th\u003e\u003cth\u003e关键词\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e解剖\u003c/td\u003e\u003ctd\u003e心血管循环\u003c/td\u003e\u003ctd\u003e体循环+肺循环，左心室泵出、右心室泵向肺部\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e解剖\u003c/td\u003e\u003ctd\u003e呼吸核心\u003c/td\u003e\u003ctd\u003e膈肌=唯一对生命至关重要的骨骼肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e生理\u003c/td\u003e\u003ctd\u003e心输出量公式\u003c/td\u003e\u003ctd\u003eCO = HR × SV\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e生理\u003c/td\u003e\u003ctd\u003e氧气物流链\u003c/td\u003e\u003ctd\u003e摄氧→输氧→用氧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e适应\u003c/td\u003e\u003ctd\u003e三大适应\u003c/td\u003e\u003ctd\u003e毛细血管↑、线粒体↑、糖原↑\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e环境\u003c/td\u003e\u003ctd\u003e热衰竭vs中暑\u003c/td\u003e\u003ctd\u003e&lt;40℃/大汗 vs ≥40℃/无汗\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e环境\u003c/td\u003e\u003ctd\u003e补水标准\u003c/td\u003e\u003ctd\u003e前5-7ml/kg，后1.5L/kg\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e指南\u003c/td\u003e\u003ctd\u003e每周标准\u003c/td\u003e\u003ctd\u003e150分钟中等 或 75分钟高强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e指南\u003c/td\u003e\u003ctd\u003eFITTVP\u003c/td\u003e\u003ctd\u003e频强时类量进阶\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIFT\u003c/td\u003e\u003ctd\u003e三期核心\u003c/td\u003e\u003ctd\u003e一期RPE3-4，二期VT1，三期VT2+极化\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch5-s868\"\u003e四、自检清单\u003c/h3\u003e\n\u003cp\u003e表5-43\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e自检问题\u003c/th\u003e\u003cth\u003e掌握程度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003e能画出心血管体循环和肺循环的完整路径吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003e能解释为什么膈肌是唯一对生命至关重要的骨骼肌吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e能写出并解释心输出量公式吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003e能区分热衰竭和中暑的症状和处理方法吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e能计算储备心率和靶心率区间吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003e能解释VT1和VT2的生理意义吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e能区分IFT模式三个阶段的定位和适用人群吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003e能解释什么是&quot;极化训练中的中等强度区域&quot;现象吗？\u003c/td\u003e\u003ctd\u003e□完全 □部分 □不会\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch5-s870\"\u003e六、章末三件事\u003c/h3\u003e\n\u003cp\u003e表5-44\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e任务\u003c/th\u003e\u003cth\u003e具体行动\u003c/th\u0 03e1\u003c/td\u003e\u003ctd\u003e解剖学系统（骨骼/关节/肌肉）\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003e结缔组织\u003c/td\u003e\u003ctd\u003e★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e人类运动术语\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003e肌肉训练的益处\u003c/td\u003e\u003ctd\u003e★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e肌肉训练的生理适应（急性/长期）\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003e肌肉训练核心原则（渐进超负荷/专一性/可逆性/效果递减）+ 相关概念（个体差异/适应性）\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e肌肉训练变量和计划设计\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003e肌肉训练的组成部分\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s6\"\u003eACE 原教材第10章：肌肉训练，评估\u003c/h4\u003e\n\u003cp\u003e表6-2\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e知识点\u003c/th\u003e\u003cth\u003e重要程度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003e功能性评估（姿势/平衡/核心/柔韧性）\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003e动作评估（5种主要动作模式）\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e负荷/速度评估（肌肉耐力/力量/爆发力）\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eACE IFT模型肌肉训练阶段整合\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s8\"\u003e一、本章核心\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ACE IFT模型是ACE-CPT的核心框架：先评估客户功能，再按&quot;功能→动作→负荷&quot;三阶段递进训练，应根据评估结果选择起点，并在基础能力满足后再进阶。\u003c/p\u003e\n\u003cp\u003e记忆技巧：IFT模型就像盖楼： 先打地基（功能性），再砌墙（动作），最后装修加重量（负荷/速度）。地基出了问题，上层结构全部受影响。\u003c/p\u003e\n\u003ch4 id=\"ch6-s11\"\u003e二、核心板块速览表\u003c/h4\u003e\n\u003cp\u003e表6-3\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e板块名称\u003c/th\u003e\u003cth\u003e核心内容\u003c/th\u003e\u003cth\u003e关联评估\u003c/th\u003e\u003cth\u003e记忆关键词\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIFT阶段一：功能性训练\u003c/td\u003e\u003ctd\u003e姿势稳定性 + 动力链灵活性\u003c/td\u003e\u003ctd\u003e静态姿势、平衡、核心耐力、柔韧性\u003c/td\u003e\u003ctd\u003e&quot;站得稳+关节活&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIFT阶段二：动作训练\u003c/td\u003e\u003ctd\u003e5种动作模式 × 3个运动平面\u003c/td\u003e\u003ctd\u003e深蹲/单腿/推/拉/旋转评估\u003c/td\u003e\u003ctd\u003e&quot;屈单推拉旋&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIFT阶段三：负荷/速度训练\u003c/td\u003e\u003ctd\u003e肌肉耐力/力量/爆发力\u003c/td\u003e\u003ctd\u003e俯卧撑/1-RM/纵跳评估\u003c/td\u003e\u003ctd\u003e&quot;多次轻/少次重/快速发&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心评估指标\u003c/td\u003e\u003ctd\u003eMcGill比值、Y平衡\u003c/td\u003e\u003ctd\u003e背部健康预测、下肢损伤风险\u003c/td\u003e\u003ctd\u003e屈伸＜1 侧桥＜1±0.05 侧伸＜0.75\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s13\"\u003e三、必背关键数字表\u003c/h4\u003e\n\u003cp\u003e表6-4\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e数字\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e重要性\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e&lt; 1.0\u003c/td\u003e\u003ctd\u003eMcGill屈曲:伸展比正常上限\u003c/td\u003e\u003ctd\u003e★★★ 必背\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e0.95-1.05\u003c/td\u003e\u003ctd\u003eMcGill左右侧桥比正常范围\u003c/td\u003e\u003ctd\u003e★★★ 必背\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e&lt; 0.75\u003c/td\u003e\u003ctd\u003eMcGill侧桥:伸展比正常上限\u003c/td\u003e\u003ctd\u003e★★★ 必背\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e&gt; 4cm（或1.6英寸）\u003c/td\u003e\u003ctd\u003eY平衡测试前部方向下肢损伤风险阈值\u003c/td\u003e\u003ctd\u003e★★★ 必背\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e&gt; 2英寸\u003c/td\u003e\u003ctd\u003e深蹲评估中髋内收代偿的警示值\u003c/td\u003e\u003ctd\u003e★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e45°\u003c/td\u003e\u003ctd\u003e胸椎旋转正常活动度（双侧）\u003c/td\u003e\u003ctd\u003e★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e+5%\u003c/td\u003e\u003ctd\u003e双渐进式训练每次增加的重量比例\u003c/td\u003e\u003ctd\u003e★★\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s15\"\u003e四、名词缩写表\u003c/h4\u003e\n\u003cp\u003e表6-5\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e缩写\u003c/th\u003e\u003cth\u003e全称\u003c/th\u003e\u003cth\u003e中文含义\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIFT\u003c/td\u003e\u003ctd\u003eIntegrated Fitness Training\u003c/td\u003e\u003ctd\u003e整合式健身训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eROM\u003c/td\u003e\u003ctd\u003eRange of Motion\u003c/td\u003e\u003ctd\u003e关节活动范围/活动度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1-RM\u003c/td\u003e\u003ctd\u003eOne Repetition Maximum\u003c/td\u003e\u003ctd\u003e一次最大反复\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMcGill\u003c/td\u003e\u003ctd\u003eMcGill Core Endurance Tests\u003c/td\u003e\u003ctd\u003eMcGill核心耐力测试组合\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eKVA\u003c/td\u003e\u003ctd\u003eKnee Valgus Angle\u003c/td\u003e\u003ctd\u003e膝盖外翻角（膝盖内移）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eATP\u003c/td\u003e\u003ctd\u003eAdenosine Triphosphate\u003c/td\u003e\u003ctd\u003e三磷酸腺苷（能量物质）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePCr\u003c/td\u003e\u003ctd\u003ePhosphocreatine\u003c/td\u003e\u003ctd\u003e磷酸肌酸（能量物质）\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e[第9章：肌肉训练基础]\n         ↓\n   骨骼关节肌肉 → 结缔组织 → 运动术语 → 训练益处\n         ↓\n   急性/长期生理适应 → 训练原则 → 训练变量\n         ↓\n[第10章：肌肉训练评估]\n         ↓\n   功能性评估 → 动作评估 → 负荷/速度评估\n         ↓\n[IFT模型整合]\n         ↓\n   功能性训练 → 动作训练 → 负荷/速度训练\n         ↓\n   评估决定训练起点，不是反过来\u003c/p\u003e\n\u003ch4 id=\"ch6-s18\"\u003e七、预习思考与练习\u003c/h4\u003e\n\u003ch4 id=\"ch6-s19\"\u003e思考题\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ⚠️客户说自己&quot;有3年健身房经验，深蹲能蹲100公斤&quot;，坚持要跳过功能性训练和动作训练，直接进入负荷/速度训练阶段。作为私教，你会如何处理？请在预习时带着这个问题进入正文。\u003c/p\u003e\n\u003ch4 id=\"ch6-s21\"\u003e选择题\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 关于IFT模型，以下说法正确的是？\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● A. 有经验的客户可以直接从动作训练开始\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● B. 跳过前面的阶段可以节省时间，提高效率\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● C. 所有新客户都从功能性训练开始，不管经验水平\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● D. 负荷/速度训练是最重要的阶段，前面的可以忽略\u003c/p\u003e\n\u003ch3 id=\"ch6-s27\"\u003e正文部分\u003c/h3\u003e\n\u003ch3 id=\"ch6-s28\"\u003e1 解剖学系统\u003c/h3\u003e\n\u003ch4 id=\"ch6-s29\"\u003e系统概\u003c/h4\u003e\n\u003ch4 id=\"ch6-s30\"\u003e1.1 骨骼系统\u003c/h4\u003e\n\u003cp\u003e● 成人骨骼由206块骨头组成\u003c/p\u003e\n\u003cp\u003e● 骨骼的主要功能：支撑身体、保护内脏、提供杠杆系统、储存矿物质、产生血细胞\u003c/p\u003e\n\u003ch4 id=\"ch6-s33\"\u003e关节类型\u003c/h4\u003e\n\u003cp\u003e表6-6\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e关节类型\u003c/th\u003e\u003cth\u003e特点\u003c/th\u003e\u003cth\u003e举例\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e滑膜关节\u003c/td\u003e\u003ctd\u003e可动关节， 有关节囊和滑液\u003c/td\u003e\u003ctd\u003e肩关节、膝关节、髋关节\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e软骨关节\u003c/td\u003e\u003ctd\u003e活动受限，有软骨缓冲\u003c/td\u003e\u003ctd\u003e椎间盘、耻骨联合\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e纤维关节\u003c/td\u003e\u003ctd\u003e几乎不可动\u003c/td\u003e\u003ctd\u003e颅骨缝、胫腓关节\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s35\"\u003e1.2 神经系统\u003c/h4\u003e\n\u003cp\u003e神经系统接收感觉信息、组织运动输出，并通过运动单位募集和发放频率调节肌肉张力。肌肉训练初期的力量提升往往与神经系统适应密切相关。\u003c/p\u003e\n\u003ch4 id=\"ch6-s37\"\u003e1.3 肌肉系统\u003c/h4\u003e\n\u003cp\u003e● 骨骼肌（随意肌）：有横纹受意识控制\u003c/p\u003e\n\u003cp\u003e● 心肌：有横纹但不受意识控制，心脏特有\u003c/p\u003e\n\u003cp\u003e● 平滑肌（不随意肌）：无横纹，不受个体意识控制\u003c/p\u003e\n\u003ch3 id=\"ch6-s41\"\u003e2 结缔组织\u003c/h3\u003e\n\u003cp\u003e表6-7\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e组织类型\u003c/th\u003e\u003cth\u003e功能\u003c/th\u003e\u003cth\u003e位置\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌腱\u003c/td\u003e\u003ctd\u003e连接肌肉与骨骼， 传递力量\u003c/td\u003e\u003ctd\u003e肌肉两端\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e韧带\u003c/td\u003e\u003ctd\u003e连接骨与骨，稳定关节\u003c/td\u003e\u003ctd\u003e关节周围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e软骨\u003c/td\u003e\u003ctd\u003e减震、减少摩擦\u003c/td\u003e\u003ctd\u003e关节面、椎间盘\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e筋膜\u003c/td\u003e\u003ctd\u003e连接、包裹、 分离肌肉和器官\u003c/td\u003e\u003ctd\u003e全身\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e【教练提示】\u003c/p\u003e\n\u003cp\u003e场景：客户抱怨&quot;膝盖痛&quot;，但说拍了X光显示骨头没问题。\u003c/p\u003e\n\u003cp\u003e建议：可能是软骨磨损或韧带问题。软骨没有血管，营养靠关节滑液扩散。关节活动时滑液流动加快，扩散效率更高，所以适度活动反而有利于软骨健康。 这解释了为什么&quot;休息不动&quot;不是关节问题的最佳解决方案。\u003c/p\u003e\n\u003ch3 id=\"ch6-s46\"\u003e3 人类运动术语\u003c/h3\u003e\n\u003ch4 id=\"ch6-s47\"\u003e3.1 肌肉动作的类型\u003c/h4\u003e\n\u003cp\u003e表6-8\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e运动\u003c/th\u003e\u003cth\u003e定义\u003c/th\u003e\u003cth\u003e举例\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e屈曲（Flexion）\u003c/td\u003e\u003ctd\u003e减小关节角度\u003c/td\u003e\u003ctd\u003e弯曲肘关节、弯腰\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e伸展（Extension）\u003c/td\u003e\u003ctd\u003e增大关节角度\u003c/td\u003e\u003ctd\u003e伸直肘关节、站直\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e外展（Abduction）\u003c/td\u003e\u003ctd\u003e远离身体中线\u003c/td\u003e\u003ctd\u003e手臂侧举\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e内收（Adduction）\u003c/td\u003e\u003ctd\u003e靠近身体中线\u003c/td\u003e\u003ctd\u003e手臂放下\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e旋转（Rotation）\u003c/td\u003e\u003ctd\u003e绕骨长轴转动\u003c/td\u003e\u003ctd\u003e转头\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s49\"\u003e3.2 动力链运动\u003c/h4\u003e\n\u003cp\u003e表6-9\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e平面\u003c/th\u003e\u003cth\u003e分割方式\u003c/th\u003e\u003cth\u003e典型运动\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e矢状面\u003c/td\u003e\u003ctd\u003e前后分割\u003c/td\u003e\u003ctd\u003e屈曲/伸展\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e额状面\u003c/td\u003e\u003ctd\u003e左右分割\u003c/td\u003e\u003ctd\u003e外展/内收\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e水平面\u003c/td\u003e\u003ctd\u003e上下分割\u003c/td\u003e\u003ctd\u003e旋转\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 关节运动方向：\u003c/p\u003e\n\u003cp\u003e● 屈伸前后矢状面\u003c/p\u003e\n\u003cp\u003e● 展收左右额状面\u003c/p\u003e\n\u003cp\u003e● 旋转横切水平面\u003c/p\u003e\n\u003ch4 id=\"ch6-s56\"\u003e3.3 灵活性和稳定性\u003c/h4\u003e\n\u003cp\u003e人体动作需要某些环节提供足够活动度，同时需要其他环节提供稳定与控制。教练应根据客户的具体动作表现判断限制来源，不应将所有动作问题简化为“不够柔软”。\u003c/p\u003e\n\u003ch4 id=\"ch6-s58\"\u003e3.4 平衡和校准\u003c/h4\u003e\n\u003cp\u003e平衡是在支撑面上管理重心的能力；校准则是身体各节段之间的相对位置关系。两者会影响动作效率、负荷分配和训练技术。\u003c/p\u003e\n\u003ch3 id=\"ch6-s60\"\u003e4 肌肉训练的益处\u003c/h3\u003e\n\u003ch4 id=\"ch6-s61\"\u003e身体成分改善 身体成分\u003c/h4\u003e\n\u003cp\u003e● 增加肌肉质量、减少体脂肪，两者共同提高基础代谢率\u003c/p\u003e\n\u003ch4 id=\"ch6-s63\"\u003e骨骼健康\u003c/h4\u003e\n\u003cp\u003e● 增加骨密度\u003c/p\u003e\n\u003cp\u003e● 降低骨质疏松风险\u003c/p\u003e\n\u003ch4 id=\"ch6-s66\"\u003e代谢健康\u003c/h4\u003e\n\u003cp\u003e● 改善胰岛素敏感性\u003c/p\u003e\n\u003cp\u003e● 帮助血糖控制\u003c/p\u003e\n\u003cp\u003e● 改善血脂谱\u003c/p\u003e\n\u003cp\u003e● 降低慢性炎症水平\u003c/p\u003e\n\u003ch4 id=\"ch6-s71\"\u003e功能能力\u003c/h4\u003e\n\u003cp\u003e● 提高日常生活能力\u003c/p\u003e\n\u003cp\u003e● 改善平衡和稳定性\u003c/p\u003e\n\u003cp\u003e● 增强运动表现\u003c/p\u003e\n\u003ch4 id=\"ch6-s75\"\u003e心理健康\u003c/h4\u003e\n\u003cp\u003e● 减轻焦虑和抑郁\u003c/p\u003e\n\u003cp\u003e● 提高睡眠质量\u003c/p\u003e\n\u003cp\u003e● 改善自尊和自我形象\u003c/p\u003e\n\u003ch3 id=\"ch6-s79\"\u003e5 肌肉训练的生理适应：急性适应和长期适应\u003c/h3\u003e\n\u003ch4 id=\"ch6-s80\"\u003e急性适应（运动中）\u003c/h4\u003e\n\u003cp\u003e● 心率、血压、每搏输出量增加\u003c/p\u003e\n\u003cp\u003e● 肌肉血流量重新分配\u003c/p\u003e\n\u003cp\u003e● 能量物质消耗（ATP、PCr、糖原）\u003c/p\u003e\n\u003ch4 id=\"ch6-s84\"\u003e长期适应（训练后）\u003c/h4\u003e\n\u003cp\u003e● 肌纤维肥大（肌肉体积增加）\u003c/p\u003e\n\u003cp\u003e● 肌纤维增生（肌肉细胞数量增加，在人体中尚无定论，主流观点认为人类肌肉增长主要依靠肌纤维肥大而非增生）\u003c/p\u003e\n\u003cp\u003e● 神经适应（早期力量提升的主要来源，包括运动单位募集增加、放电频率提高等）\u003c/p\u003e\n\u003cp\u003e● 结缔组织强化（肌腱、韧带更坚韧）\u003c/p\u003e\n\u003cp\u003e● 骨密度增加\u003c/p\u003e\n\u003cp\u003e重要：训练初期的力量提升主要来自神经适应（神经系统更有效地募集、激活肌肉），而不是肌肉变大。肌纤维肥大通常需要更长时间才能显现。\u003c/p\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 早期力量提升来源：\u003c/p\u003e\n\u003cp\u003e● 初期力量↑ = 主要来自于神经适应\u003c/p\u003e\n\u003cp\u003e● 后期肌肉↑ = 肌纤维截面积增加，表现为肌肥大\u003c/p\u003e\n\u003cp\u003e● 【教练提示】\u003c/p\u003e\n\u003cp\u003e● 场景：客户抱怨&quot;练了一个月，肌肉没变大，是不是训练没效果？&quot;\u003c/p\u003e\n\u003cp\u003e● 建议：回应：肌肉外观并不是判断训练效果的唯一指标。训练初期的力量增长通常更多来自神经适应，即身体逐渐学会更有效地完成动作和调动相关运动单位。肌肉肥大通常需要持续、渐进的训练刺激，并受到训练量、营养、睡眠、恢复和个体差异的影响。\u003c/p\u003e\n\u003cp\u003e力量与肌肉肥大的发展会受训练史、神经适应、训练负荷与运动量、营养与恢复、年龄、性别及个体差异等多种因素共同影响。教练应记录客户的训练负荷、重复次数、动作质量和身体围度，综合判断训练进展，使用客户的实际反应调整计划，不宜以单一变量解释所有训练结果。\u003c/p\u003e\n\u003ch4 id=\"ch6-s99\"\u003e5.1 影响肌肉力量和肥大的因素\u003c/h4\u003e\n\u003ch3 id=\"ch6-s100\"\u003e6 肌肉训练原则\u003c/h3\u003e\n\u003cp\u003e表6-10\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e原则\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e实践要点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e渐进超负荷（Progressive Overload）\u003c/td\u003e\u003ctd\u003e随着身体产生适应，逐步提高训练刺激\u003c/td\u003e\u003ctd\u003e增加负重、重复次数、组数、动作难度、频率或减少休息间隔；避免同时大幅增加多个变量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e专一性（Specificity）\u003c/td\u003e\u003ctd\u003e身体产生的适应与所接受的训练刺激相关\u003c/td\u003e\u003ctd\u003e根据目标、动作模式、活动需求、速度、负荷和关节活动范围选择训练内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e可逆性（Reversibility）\u003c/td\u003e\u003ctd\u003e长期停止或显著减少训练后，训练适应可能逐渐减弱\u003c/td\u003e\u003ctd\u003e短期休息不等于退步；长期中断后应根据当前能力逐步恢复训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e效果递减（Diminishing Returns）\u003c/td\u003e\u003ctd\u003e随着训练水平提高，相同刺激产生的改善通常会减小\u003c/td\u003e\u003ctd\u003e初学者初期使用基础计划即可进步明显；训练经验丰富者需要更精细的计划调整和恢复管理\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 训练原则记忆口诀：&quot;超专可效个适&quot;\u003c/p\u003e\n\u003cp\u003e● 超（超负荷）= 不破不立\u003c/p\u003e\n\u003cp\u003e● 专（专一性）= 中挂都挂种豆得豆\u003c/p\u003e\n\u003cp\u003e● 可（可逆性）= 用进废退\u003c/p\u003e\n\u003cp\u003e● 效（效果递减）= 边际效益递减\u003c/p\u003e\n\u003cp\u003e● 【注意】个体差异和适应性是训练计划设计的相关概念，ACE教材核心训练原则为上四项。\u003c/p\u003e\n\u003ch4 id=\"ch6-s109\"\u003e6.1 进阶\u003c/h4\u003e\n\u003cp\u003e随着客户适应当前刺激，训练需求应循序渐进地调整。\u003c/p\u003e\n\u003ch4 id=\"ch6-s111\"\u003e6.2 专一性\u003c/h4\u003e\n\u003cp\u003e训练适应与实际训练的动作、负荷、速度和代谢需求密切相关。\u003c/p\u003e\n\u003ch4 id=\"ch6-s113\"\u003e6.3 超负荷\u003c/h4\u003e\n\u003cp\u003e要产生新的适应，训练刺激需适度高于客户当前已适应的水平。\u003c/p\u003e\n\u003ch4 id=\"ch6-s115\"\u003e6.4 可逆性\u003c/h4\u003e\n\u003cp\u003e训练刺激显著减少或停止后，已获得的适应可能逐渐减退。\u003c/p\u003e\n\u003ch4 id=\"ch6-s117\"\u003e6.5 效果递减\u003c/h4\u003e\n\u003cp\u003e随着体能水平提高，相同训练刺激所带来的额外改善通常会逐渐减少。\u003c/p\u003e\n\u003ch3 id=\"ch6-s119\"\u003e7 肌肉训练变量和计划设计\u003c/h3\u003e\n\u003cp\u003e表6-11\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e训练变量\u003c/th\u003e\u003cth\u003e定义\u003c/th\u003e\u003cth\u003e常见范围\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e负荷\u003c/td\u003e\u003ctd\u003e阻力重量\u003c/td\u003e\u003ctd\u003e1-RM的50%-100%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e重复次数（Reps）\u003c/td\u003e\u003ctd\u003e一次完整的动作\u003c/td\u003e\u003ctd\u003e1-20+次\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e组数（Sets）\u003c/td\u003e\u003ctd\u003e一组连续动作\u003c/td\u003e\u003ctd\u003e1-10+组\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e休息间隔\u003c/td\u003e\u003ctd\u003e组间恢复时间\u003c/td\u003e\u003ctd\u003e30秒-5分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e训练频率\u003c/td\u003e\u003ctd\u003e每周训练次数\u003c/td\u003e\u003ctd\u003e1-7次\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e训练量\u003c/td\u003e\u003ctd\u003e负荷×重复×组数\u003c/td\u003e\u003ctd\u003e综合计算\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s121\"\u003e7.1 需求评估\u003c/h4\u003e\n\u003cp\u003e根据客户目标、健康筛查、训练经验、动作能力和可用资源确定计划起点。\u003c/p\u003e\n\u003ch4 id=\"ch6-s123\"\u003e7.2 训练频率\u003c/h4\u003e\n\u003cp\u003e频率需与总运动量、训练经验、客户时间和恢复能力相匹配。\u003c/p\u003e\n\u003ch4 id=\"ch6-s125\"\u003e7.3 运动选择和顺序\u003c/h4\u003e\n\u003cp\u003e选择能够服务客户目标且可以安全执行的动作；通常优先安排需要较高技术、速度或多关节协调的动作。\u003c/p\u003e\n\u003ch4 id=\"ch6-s127\"\u003e7.4 训练量\u003c/h4\u003e\n\u003cp\u003e训练量综合反映组数、次数和负荷，应与目标及恢复状态一起调整。\u003c/p\u003e\n\u003ch4 id=\"ch6-s129\"\u003e7.5 训练强度\u003c/h4\u003e\n\u003cp\u003e强度可用相对于最大能力（1RM）的负荷、可完成次数和自感用力程度等方式表示。\u003c/p\u003e\n\u003ch4 id=\"ch6-s131\"\u003e7.6 训练节奏\u003c/h4\u003e\n\u003cp\u003e动作速度和离心、过渡、向心各阶段的时间会改变技术要求和肌肉受力时间。\u003c/p\u003e\n\u003ch4 id=\"ch6-s133\"\u003e7.7 休息间歇\u003c/h4\u003e\n\u003cp\u003e组间休息应根据训练目标、负荷、训练量和客户当前的恢复情况设置。\u003c/p\u003e\n\u003ch3 id=\"ch6-s135\"\u003e8 肌肉训练课程的组成部分\u003c/h3\u003e\n\u003cp\u003e表6-12\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e组成部分\u003c/th\u003e\u003cth\u003e内容\u003c/th\u003e\u003cth\u003e时间占比\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e热身\u003c/td\u003e\u003ctd\u003e有氧/动态拉伸/目标肌群激活\u003c/td\u003e\u003ctd\u003e5-10分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主体训练\u003c/td\u003e\u003ctd\u003e主要训练动作和计划\u003c/td\u003e\u003ctd\u003e20-45分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e冷身\u003c/td\u003e\u003ctd\u003e整理放松/静态拉伸\u003c/td\u003e\u003ctd\u003e5-10分钟\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s137\"\u003e8.1 热身活动\u003c/h4\u003e\n\u003cp\u003e通过全身性活动和与主训练相关的渐进练习，使客户过渡到训练状态。\u003c/p\u003e\n\u003ch4 id=\"ch6-s139\"\u003e8.2 体能训练\u003c/h4\u003e\n\u003cp\u003e根据评估结果和客户目标完成当日的主要肌肉训练内容，并持续监测动作质量与疲劳反应。\u003c/p\u003e\n\u003ch4 id=\"ch6-s141\"\u003e8.3 放松\u003c/h4\u003e\n\u003cp\u003e逐步降低活动强度，整理训练反馈，并根据客户的需要安排适当的恢复性活动。\u003c/p\u003e\n\u003ch3 id=\"ch6-s143\"\u003e9 ACE整合式健身训练模型：肌肉训练与评估\u003c/h3\u003e\n\u003ch3 id=\"ch6-s144\"\u003e模型总体架构\u003c/h3\u003e\n\u003cp\u003eACE整合式健身训练（ACE Integrated Fitness Training®, ACE IFT®）模型是整个ACE-CPT体系的核心框架。肌肉训练部分分为三个递进阶段：\u003c/p\u003e\n\u003cp\u003e负荷/速度训练（Load/Speed Training）  ← 第三阶段\n        ↑\n动作训练（Movement Training）         ← 第二阶段\n        ↑\n功能性训练（Functional Training）     ← 第一阶段\u003c/p\u003e\n\u003cp\u003e核心逻辑：先建立姿势稳定性和动力链灵活性（功能），再训练高效动作模式（动作），最后发展力量/爆发力/耐力（负荷/速度）。\u003c/p\u003e\n\u003cp\u003e不能跳步。 这是IFT模型最重要的原则： 跳过前面的阶段盲目追求力量和运动表现好比是拔苗助长。\u003c/p\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 「功能 → 动作 → 负荷」三级火箭：\u003c/p\u003e\n\u003cp\u003e● • 第一级（功能）：&quot;地基&quot;打好： 站得稳、关节灵活\u003c/p\u003e\n\u003cp\u003e● • 第二级（动作）：&quot;动作&quot;做好： 屈髋、单腿、推、拉、旋转\u003c/p\u003e\n\u003cp\u003e● • 第三级（负荷）：“上强度和速度”： 力量、耐力、爆发力\u003c/p\u003e\n\u003cp\u003e常见误区：把&quot;客户有经验&quot;等同于&quot;客户动作正确&quot;。经验不等于动作模式正确，很多资深训练者可能带着错误的动作模式练了很多年。\u003c/p\u003e\n\u003cp\u003e【思考】\u003c/p\u003e\n\u003cp\u003eIFT三阶段的核心逻辑在于 能力递进。 每一阶段都是在前一阶段建立的能力基础上叠加新要求。正所谓循序渐急，客户的训练起点和进阶应由评估结果与实际表现决定，不宜在基础能力未满足时过早增加负荷或速度要求。\u003c/p\u003e\n\u003ch4 id=\"ch6-s157\"\u003e9.1 功能训IFT练\u003c/h4\u003e\n\u003ch4 id=\"ch6-s158\"\u003e2.1 IFT抗阻第一期--功能训练 的训练重点\u003c/h4\u003e\n\u003cp\u003e● 改善姿势稳定性（Postural Stability）和动力链灵活性（Kinetic-Chain Mobility）\u003c/p\u003e\n\u003cp\u003e● 建立或重建关节功能\u003c/p\u003e\n\u003cp\u003e● 通过改善以下能力实现目标：\u003c/p\u003e\n\u003cp\u003e● 姿势稳定相关：核心功能（Core Function）、静态平衡（Static Balance）、动态平衡（Dynamic Balance）\u003c/p\u003e\n\u003cp\u003e● 关节功能相关：柔韧性（Flexibility）、肌肉耐力（Muscular Endurance）\u003c/p\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 功能性训练 = 站得稳 + 关节活：\u003c/p\u003e\n\u003cp\u003e● 站得稳 → 姿势稳定性 → 核心功能 + 静态平衡 + 动态平衡\u003c/p\u003e\n\u003cp\u003e● 关节活 → 动力链灵活性 → 柔韧性 + 关节活动度\u003c/p\u003e\n\u003ch4 id=\"ch6-s168\"\u003e2.2 对应评估\u003c/h4\u003e\n\u003cp\u003e图6-1\u003c/p\u003e\n\u003cp\u003e表6-13\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e评估类别\u003c/th\u003e\u003cth\u003e具体评估\u003c/th\u003e\u003cth\u003e目的\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e静态姿势评估\u003c/td\u003e\u003ctd\u003e直角规则（前面观/后面观/侧面观）\u003c/td\u003e\u003ctd\u003e发现姿势偏差和肌肉不平衡\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e姿势偏差识别\u003c/td\u003e\u003ctd\u003e表10-1至10-4：脊柱前凸/驼背/平背/摇摆背\u003c/td\u003e\u003ctd\u003e定位紧张/伸长的肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e歪斜评估\u003c/td\u003e\u003ctd\u003e①距下关节旋前/旋后 ②髋内收 ③骨盆倾斜 ④肩部姿势 ⑤头部姿势\u003c/td\u003e\u003ctd\u003e逐关节排查动力链问题\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e静态平衡\u003c/td\u003e\u003ctd\u003e单脚站立测试（睁眼/闭眼）\u003c/td\u003e\u003ctd\u003e评估跌倒风险、日常生活能力、下背痛风险\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e动态平衡\u003c/td\u003e\u003ctd\u003eY平衡测试\u003c/td\u003e\u003ctd\u003e评估双腿对称性，识别下肢损伤风险（前后差异&gt;4cm=高风险）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心耐力\u003c/td\u003e\u003ctd\u003eMcGill躯干肌肉耐力测试组合\u003c/td\u003e\u003ctd\u003e评估核心肌群平衡：屈曲/伸展比&lt;1.0，侧桥比0.95-1.05背痛风险指标\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e柔韧性\u003c/td\u003e\u003ctd\u003e托马斯试验（髋屈肌）/ 被动直腿抬高（腘绳肌）/ 肩部屈曲伸展\u003c/td\u003e\u003ctd\u003e评估关键肌群长度是否正常\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e表6-14\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e身体区域\u003c/th\u003e\u003cth\u003e姿势偏差\u003c/th\u003e\u003cth\u003e主要观察姿势\u003c/th\u003e\u003cth\u003e关节及身体排列\u003c/th\u003e\u003cth\u003e疑似紧张／缩短或活动过度的肌肉\u003c/th\u003e\u003cth\u003e疑似拉长／稳定不足或活动不足的肌肉\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e足与踝\u003c/td\u003e\u003ctd\u003e足内翻\u003c/td\u003e\u003ctd\u003e前面观、后面观\u003c/td\u003e\u003ctd\u003e足底向内；外侧足缘承重增加；跟骨可能内翻；常伴距下关节旋后、胫骨与股骨外旋\u003c/td\u003e\u003ctd\u003e胫骨前肌、胫骨后肌；腓肠肌和比目鱼肌可能限制踝背屈\u003c/td\u003e\u003ctd\u003e腓骨长肌、腓骨短肌及足踝外侧稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e足与踝\u003c/td\u003e\u003ctd\u003e足外翻\u003c/td\u003e\u003ctd\u003e前面观、后面观\u003c/td\u003e\u003ctd\u003e足底向外；内侧足缘承重增加；足弓可能下降；跟骨外翻；常伴距下关节旋前、胫骨与股骨内旋\u003c/td\u003e\u003ctd\u003e腓骨肌群；ACE还提示腓肠肌和比目鱼肌复合体的紧张可能影响跟骨位置和踝背屈\u003c/td\u003e\u003ctd\u003e胫骨后肌、足底内在肌及足踝内侧稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e膝关节\u003c/td\u003e\u003ctd\u003e膝超伸\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e膝关节超过中立伸展位置，膝后侧受压；重力作用线通常位于膝关节前方\u003c/td\u003e\u003ctd\u003e股四头肌、腓肠肌和比目鱼肌可能参与维持过伸姿势\u003c/td\u003e\u003ctd\u003e腘绳肌、腘肌及膝关节动态稳定肌群可能控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e髋与骨盆\u003c/td\u003e\u003ctd\u003e髋内收／髋上提\u003c/td\u003e\u003ctd\u003e后面观\u003c/td\u003e\u003ctd\u003e一侧髂嵴高于另一侧；上提侧股骨相对内收；躯干或骨盆可能发生侧移\u003c/td\u003e\u003ctd\u003e上提侧腰方肌、躯干侧屈肌或髋内收肌可能紧张，应进一步确认\u003c/td\u003e\u003ctd\u003e上提侧髋外展肌群，尤其臀中肌、臀小肌及外侧髋部稳定肌可能拉长或控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e骨盆\u003c/td\u003e\u003ctd\u003e骨盆前倾\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e髂前上棘向下、向前旋转；腰椎前凸通常增加\u003c/td\u003e\u003ctd\u003e髋关节屈肌、竖脊肌\u003c/td\u003e\u003ctd\u003e腘绳肌、腹直肌；臀肌和腹部稳定肌也可能控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e骨盆\u003c/td\u003e\u003ctd\u003e骨盆后倾\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e髂前上棘向上、向后旋转；腰椎前凸通常减小\u003c/td\u003e\u003ctd\u003e腹直肌、腘绳肌\u003c/td\u003e\u003ctd\u003e髋关节屈肌、竖脊肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e身体区域\u003c/td\u003e\u003ctd\u003e姿势偏差\u003c/td\u003e\u003ctd\u003e主要观察姿势\u003c/td\u003e\u003ctd\u003e关节及身体排列\u003c/td\u003e\u003ctd\u003e疑似紧张／缩短或活动过度的肌肉\u003c/td\u003e\u003ctd\u003e疑似拉长／稳定不足或活动不足的肌肉\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e脊柱\u003c/td\u003e\u003ctd\u003e脊柱前凸\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e腰椎前凸增加，通常伴骨盆前倾；髋关节可能保持屈曲趋势\u003c/td\u003e\u003ctd\u003e髋关节屈肌、腰椎伸肌／竖脊肌\u003c/td\u003e\u003ctd\u003e髋关节伸肌、腹直肌、腹外斜肌及腹部稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e脊柱\u003c/td\u003e\u003ctd\u003e脊柱后凸\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e胸椎后凸增加；肩部可能前伸或圆肩；头部可能前移\u003c/td\u003e\u003ctd\u003e胸部和前肩肌群、背阔肌、颈椎伸肌\u003c/td\u003e\u003ctd\u003e上背部伸肌、肩胛稳定肌群、颈椎屈肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e脊柱\u003c/td\u003e\u003ctd\u003e平背\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e腰椎前凸减小，骨盆通常后倾；胸椎曲线可能变平，头部可能前移\u003c/td\u003e\u003ctd\u003e腹直肌、上背部伸肌、颈椎伸肌、腘绳肌\u003c/td\u003e\u003ctd\u003e髂腰肌、腹内斜肌部分纤维、腰椎伸肌、颈椎屈肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e脊柱\u003c/td\u003e\u003ctd\u003e摇摆背\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e骨盆向前平移并后倾；髋关节过伸；胸椎后凸增加；躯干上部向后倾斜；头部可能前移\u003c/td\u003e\u003ctd\u003e腘绳肌、腹内斜肌上部纤维、部分腰椎伸肌和颈椎伸肌\u003c/td\u003e\u003ctd\u003e髂腰肌、腹外斜肌、上背部伸肌、颈椎屈肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e脊柱\u003c/td\u003e\u003ctd\u003e脊柱侧凸\u003c/td\u003e\u003ctd\u003e前面观、后面观\u003c/td\u003e\u003ctd\u003e脊柱在额状面出现侧向曲线，通常伴椎体旋转；肩、肩胛骨、腰线和骨盆可能不对称\u003c/td\u003e\u003ctd\u003e凹侧躯干侧屈肌、旋转肌及部分腰方肌可能缩短或活动过度\u003c/td\u003e\u003ctd\u003e凸侧躯干稳定肌可能拉长或控制不足；具体肌肉取决于侧凸方向和旋转情况\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e表6-15\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e身体区域\u003c/th\u003e\u003cth\u003e姿势偏差\u003c/th\u003e\u003cth\u003e主要观察姿势\u003c/th\u003e\u003cth\u003e关节及身体排列\u003c/th\u003e\u003cth\u003e疑似紧张／缩短或活动过度的肌肉\u003c/th\u003e\u003cth\u003e疑似拉长／稳定不足或活动不足的肌肉\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩部\u003c/td\u003e\u003ctd\u003e高低肩\u003c/td\u003e\u003ctd\u003e前面观、后面观\u003c/td\u003e\u003ctd\u003e一侧肩峰、锁骨或肩胛骨高于另一侧；肩胛骨可能伴随上提或下压\u003c/td\u003e\u003ctd\u003e高肩侧上斜方肌、肩胛提肌、菱形肌\u003c/td\u003e\u003ctd\u003e高肩侧下斜方肌和肩胛下压稳定肌可能不足；低肩侧情况需结合侧屈和负重习惯评估\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩关节\u003c/td\u003e\u003ctd\u003e肱骨内旋\u003c/td\u003e\u003ctd\u003e前面观\u003c/td\u003e\u003ctd\u003e手背明显朝前，肘窝不朝前；肱骨头内旋，可能伴圆肩\u003c/td\u003e\u003ctd\u003e胸大肌、背阔肌、肩胛下肌\u003c/td\u003e\u003ctd\u003e冈下肌、小圆肌等肩外旋肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩胛骨\u003c/td\u003e\u003ctd\u003e肩胛骨前伸\u003c/td\u003e\u003ctd\u003e后面观、侧面观\u003c/td\u003e\u003ctd\u003e肩胛骨向外、向前移动；肩胛骨内侧缘远离脊柱；常伴圆肩\u003c/td\u003e\u003ctd\u003e胸小肌、胸大肌等前侧胸肌群；部分个体可能伴前锯肌活动过度\u003c/td\u003e\u003ctd\u003e菱形肌、中斜方肌等肩胛后缩稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩胛骨\u003c/td\u003e\u003ctd\u003e翼状肩胛\u003c/td\u003e\u003ctd\u003e后面观\u003c/td\u003e\u003ctd\u003e肩胛骨内侧缘或下角明显离开胸廓，呈翼状突出\u003c/td\u003e\u003ctd\u003e不能单独根据翼状肩胛确定紧张肌；胸小肌紧张可能影响肩胛位置\u003c/td\u003e\u003ctd\u003eACE明确提示前锯肌可能拉长或稳定能力不足；也应评估下斜方肌和肩胛稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e头颈\u003c/td\u003e\u003ctd\u003e头部前引／头部前倾姿势\u003c/td\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e头部向前平移，耳垂位于肩锁关节前方；通常表现为上颈椎伸展、下颈椎相对屈曲\u003c/td\u003e\u003ctd\u003e颈椎伸肌、上斜方肌、肩胛提肌\u003c/td\u003e\u003ctd\u003e深层颈屈肌及颈椎前侧稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e【教练提示】\u003c/p\u003e\n\u003cp\u003eY平衡测试关键点：\u003c/p\u003e\n\u003cp\u003e● 测试前部（ANT）、后内侧（PM）、后外侧（PL）三个方向\u003c/p\u003e\n\u003cp\u003e● 计算双腿对称性差异\u003c/p\u003e\n\u003cp\u003e● ⚠ 前部差异&gt;4cm（1.6英寸）= 下肢损伤高风险\u003c/p\u003e\n\u003ch4 id=\"ch6-s178\"\u003e2.3 进阶条件\u003c/h4\u003e\n\u003cp\u003e● 客户在功能性评估中表现出良好的姿势稳定性和动力链灵活性\u003c/p\u003e\n\u003cp\u003e● 核心功能达标（McGill比值在正常范围内）\u003c/p\u003e\n\u003cp\u003e● 平衡能力达到年龄对应的正常水平\u003c/p\u003e\n\u003cp\u003e● 关键肌群柔韧性正常（无严重紧张限制动作）\u003c/p\u003e\n\u003ch4 id=\"ch6-s183\"\u003e2.4 对应人群\u003c/h4\u003e\n\u003cp\u003e● 久坐少动的新手客户\u003c/p\u003e\n\u003cp\u003e● 存在姿势偏差、肌肉不平衡的客户\u003c/p\u003e\n\u003cp\u003e● 需要建立基础核心稳定性的客户\u003c/p\u003e\n\u003cp\u003e● 老年人（重点：平衡+核心+柔韧性）\u003c/p\u003e\n\u003cp\u003e● 术后/伤后恢复期的客户（需医学许可后）\u003c/p\u003e\n\u003cp\u003e● 所有新客户均从功能性训练阶段开始\u003c/p\u003e\n\u003ch4 id=\"ch6-s190\"\u003e2.5 McGill核心耐力比值（必背重点）\u003c/h4\u003e\n\u003cp\u003e比值公式：\u003c/p\u003e\n\u003cp\u003e● 屈曲:伸展 &lt; 1.0（例：120s/150s = 0.80 ）\u003c/p\u003e\n\u003cp\u003e● 右侧桥:左侧桥 在 0.95-1.05 之间（例：88s/92s = 0.96 ）\u003c/p\u003e\n\u003cp\u003e● 侧桥(任一侧):伸展 &lt; 0.75（例：88s/150s = 0.59 ）\u003c/p\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 屈曲/伸展比 &lt; 1.0 → 屈肌不能比伸肌耐力强太多（伸肌是脊柱的主要稳定肌）\u003c/p\u003e\n\u003cp\u003e● 侧桥比 0.95-1.05 →（约等于1） 左右要近乎对称\u003c/p\u003e\n\u003cp\u003e● 侧桥/伸展 &lt; 0.75 → 侧向稳定肌耐力不应超过伸展肌耐力的75%。\u003c/p\u003e\n\u003cp\u003e● 【教练提示】\u003c/p\u003e\n\u003cp\u003e● 场景：客户McGill测试结果：屈肌耐力180秒，伸肌耐力100秒，屈伸比=1.80。\u003c/p\u003e\n\u003cp\u003e● 建议：这个比值明显超出正常范围（&gt;1.0）。说明他的&quot;腹肌&quot;（屈肌）比&quot;后背&quot;（伸肌）强太多。这种不平衡容易容易导致脊柱长期保持屈曲状态，从而导致下背痛。\u003c/p\u003e\n\u003cp\u003e● 【常见误区】：看到客户腹肌耐力强觉得很棒，继续加强核心屈曲训练。\u003c/p\u003e\n\u003cp\u003e● 【建议】：发现比值失衡，优先加强伸肌耐力训练。\u003c/p\u003e\n\u003cp\u003e● 常见误区：只关注客户&quot;能做什么&quot;，不关注&quot;肌肉平衡&quot;。\u003c/p\u003e\n\u003cp\u003e● 【思考】McGill测试评估的核心目标是脊柱稳定肌群的协调能力。下背部健康关键在肌肉力量的均衡。这解释了为什么很多常年训练&quot;腹肌发达&quot;的人容易腰痛，很多情况下这些训练者的肌肉力量呈现不均衡。\u003c/p\u003e\n\u003ch4 id=\"ch6-s206\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003eIFT1期的功能训练，会员的核心，及各关节稳定灵活的功能过关后，将为IFT2期的动作训练做好准备。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e● 一位客户Y平衡测试前部差异为6cm，说明什么？应该怎么调整训练计划？               ◦ 答案： 差异&gt;4cm，提示下肢损伤风险。需要加强髋外展肌群（臀中肌）和踝关节稳定性训练，暂缓进阶到动作训练阶段。\u003c/p\u003e\n\u003cp\u003e📚记忆小本：\u003c/p\u003e\n\u003cp\u003e● 功能性训练 = 站得稳 + 关节活\u003c/p\u003e\n\u003cp\u003e● 评估覆盖：姿势、平衡、核心耐力、柔韧性\u003c/p\u003e\n\u003cp\u003e● McGill比值：屈伸&lt;1.0，左右对称，侧桥&lt;75%（0.75）\u003c/p\u003e\n\u003ch4 id=\"ch6-s214\"\u003e9.2 动作训练\u003c/h4\u003e\n\u003ch4 id=\"ch6-s215\"\u003e3.1 训练重点\u003c/h4\u003e\n\u003cp\u003e● 在功能性训练建立的关节活动度（ROM）的 基础上，教导客户5种主要动作模式（5 Primary Movement Patterns）的高效执行\u003c/p\u003e\n\u003cp\u003e● 核心目标：在不影响姿势或关节稳定性的前提下，在所有三个运动平面有效地进行5种主要动作\u003c/p\u003e\n\u003cp\u003e● 训练侧重从&quot;能不能动&quot;升级为&quot;能不能正确地动&quot;\u003c/p\u003e\n\u003ch4 id=\"ch6-s219\"\u003e3.2 五种主要动作模式\u003c/h4\u003e\n\u003cp\u003e表6-16\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e动作模式\u003c/th\u003e\u003cth\u003e日常示例\u003c/th\u003e\u003cth\u003e训练示例\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e屈髋提起（Hinge/Hip Lift）屈髋提起/弯腰提起 （Bend and Lift / Hinge）\u003c/td\u003e\u003ctd\u003e坐椅子/从椅子上站起来/蹲下捡东西\u003c/td\u003e\u003ctd\u003e深蹲 （Squat Pattern)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单腿（Single-Leg）\u003c/td\u003e\u003ctd\u003e步行/上下楼梯/弓箭步\u003c/td\u003e\u003ctd\u003e高台阶跨步（Step-up）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e推（Push）\u003c/td\u003e\u003ctd\u003e推门/俯卧撑/过头推举\u003c/td\u003e\u003ctd\u003e俯卧撑稳定性 （Shoulder push stabilization)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e拉（Pull）\u003c/td\u003e\u003ctd\u003e拉车门/引体向上/划船\u003c/td\u003e\u003ctd\u003e站姿划船 (Standing Row)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e旋转（Rotation）\u003c/td\u003e\u003ctd\u003e系安全带/高尔夫挥杆/从侧方捡物\u003c/td\u003e\u003ctd\u003e胸椎灵活性旋转 (Thoracic spine mobility)\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 五种动作模式记忆口诀：\u003c/p\u003e\n\u003cp\u003e● &quot;屈单推拉旋&quot;： 弯腰捡东西是屈髋（屈），上下楼梯是单腿（单），推门是推（推），拉车门是拉（拉），转身是旋转（旋）。\u003c/p\u003e\n\u003cp\u003e● 【教练提示】\u003c/p\u003e\n\u003cp\u003e● 常见误区：认为&quot;训练动作&quot;和&quot;日常动作&quot;完全不同。\u003c/p\u003e\n\u003cp\u003e● ✓ 正确理解：5种动作模式都是从日常生活提炼出来的。训练动作是日常动作的&quot;标准化版本&quot;。客户学会正确的训练动作 = 学会更高效地完成日常动作。\u003c/p\u003e\n\u003ch4 id=\"ch6-s227\"\u003e3.3 三个运动平面\u003c/h4\u003e\n\u003cp\u003e表6-17\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e运动平面\u003c/th\u003e\u003cth\u003e定义\u003c/th\u003e\u003cth\u003e日常活动举例\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e矢状面\u003c/td\u003e\u003ctd\u003e将身体分为左右两半， 运动方向为前后（屈曲/伸展）\u003c/td\u003e\u003ctd\u003e走路（抬腿）、深蹲上下\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e额状面（冠状面）\u003c/td\u003e\u003ctd\u003e将身体分为前后两半， 运动方向为左右（外展/内收）\u003c/td\u003e\u003ctd\u003e侧向跨步、侧平举\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e水平面（横截面）\u003c/td\u003e\u003ctd\u003e将身体分为上下两半，运动方向为旋转\u003c/td\u003e\u003ctd\u003e转身、挥杆、 跑步时躯干扭转\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e思考：● 为什么要在三个运动平面内训练？\u003c/p\u003e\n\u003cp\u003e因为日常生活和运动很少只发生在单一平面内。真正的功能性训练需要让身体在所有平面上都能有效地运动和发力。\u003c/p\u003e\n\u003ch4 id=\"ch6-s231\"\u003e3.4 对应评估\u003c/h4\u003e\n\u003cp\u003e图6-2\u003c/p\u003e\n\u003cp\u003e表6-18\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e动作模式\u003c/th\u003e\u003cth\u003e评估方法\u003c/th\u003e\u003cth\u003e关键观察点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e屈髋提起\u003c/td\u003e\u003ctd\u003e深蹲模式（5-10次自然深蹲） （Squat Pattern)\u003c/td\u003e\u003ctd\u003e前面观：足旋前？膝内移？躯干偏移？ 侧面观：脚跟着地？臀肌/四头肌主导？大腿平行？ 腰/胸椎过度弯曲？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单腿\u003c/td\u003e\u003ctd\u003e高台阶跨步（Step-up）\u003c/td\u003e\u003ctd\u003e前面观：足稳定性？膝内扣？髋内收&gt;2英寸？ 侧面观：踝背屈不足？躯干前倾？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e推\u003c/td\u003e\u003ctd\u003e俯卧撑稳定性 （Shoulder push stabilization)\u003c/td\u003e\u003ctd\u003e侧面观：翼状肩胛？下背部下陷/过度伸展？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e拉\u003c/td\u003e\u003ctd\u003e站姿划船 (Standing Row)\u003c/td\u003e\u003ctd\u003e侧面观：腰部过伸？后面观：肩胛抬升/外展？头部前移？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e旋转\u003c/td\u003e\u003ctd\u003e胸椎灵活性旋转 (Thoracic spine mobility)\u003c/td\u003e\u003ctd\u003e躯干能否在双侧各实现45度旋转？是否存在双侧差异？\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e详细的五大动作 的评估\u003c/p\u003e\n\u003cp\u003e深蹲模式评估常见代偿表\u003c/p\u003e\n\u003cp\u003e表6-19\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e观察平面\u003c/th\u003e\u003cth\u003e部位\u003c/th\u003e\u003cth\u003e常见代偿\u003c/th\u003e\u003cth\u003e疑似过度活跃／紧张的肌肉或原因\u003c/th\u003e\u003cth\u003e疑似活动不足／拉长的肌肉\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e前面观\u003c/td\u003e\u003ctd\u003e足部\u003c/td\u003e\u003ctd\u003e踝关节向内塌陷、足部外翻或足部向外旋转\u003c/td\u003e\u003ctd\u003e比目鱼肌、腓肠肌外侧头、腓骨肌群\u003c/td\u003e\u003ctd\u003e腓肠肌内侧头、胫骨肌群及足踝稳定肌；臀中肌、臀大肌和部分髋部稳定肌也可能控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e前面观\u003c/td\u003e\u003ctd\u003e膝关节\u003c/td\u003e\u003ctd\u003e膝盖向内移动，即动态膝外翻\u003c/td\u003e\u003ctd\u003e髋内收肌群、阔筋膜张肌\u003c/td\u003e\u003ctd\u003e臀中肌、臀大肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e前面观\u003c/td\u003e\u003ctd\u003e躯干\u003c/td\u003e\u003ctd\u003e躯干向一侧偏移或旋转\u003c/td\u003e\u003ctd\u003e可能与单侧主导、关节负荷期下肢稳定性不足或肌肉不平衡有关\u003c/td\u003e\u003ctd\u003e单侧核心及髋部稳定肌群，需结合其他评估确认\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e足部\u003c/td\u003e\u003ctd\u003e脚跟无法保持接触地面\u003c/td\u003e\u003ctd\u003e比目鱼肌紧张；踝背屈不足\u003c/td\u003e\u003ctd\u003eACE原表没有为此列出固定的活动不足肌肉\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e髋与膝\u003c/td\u003e\u003ctd\u003e动作从膝关节开始，膝盖过早向前移动，呈“四头肌主导”\u003c/td\u003e\u003ctd\u003e股直肌及髋关节屈肌可能处于主导地位\u003c/td\u003e\u003ctd\u003e臀肌群活动不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e髋与膝\u003c/td\u003e\u003ctd\u003e无法使大腿顶部接近与地面平行\u003c/td\u003e\u003ctd\u003e比目鱼肌紧张可能限制踝背屈，使胫骨向前移动受限；也可能存在动作技术或关节活动度限制\u003c/td\u003e\u003ctd\u003e臀肌、下肢稳定肌可能控制不足，需进一步评估\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e膝后侧\u003c/td\u003e\u003ctd\u003e腘绳肌明显挤压小腿后侧\u003c/td\u003e\u003ctd\u003e不能单独归因于腘绳肌紧张，可能与下蹲深度、身体结构和动作策略有关\u003c/td\u003e\u003ctd\u003e肌力不足或动力学控制不良可能影响下蹲稳定性\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e腰椎\u003c/td\u003e\u003ctd\u003e背部过度拱起，即腰部主导\u003c/td\u003e\u003ctd\u003e髋关节屈肌、竖脊肌、背阔肌\u003c/td\u003e\u003ctd\u003e核心肌群、腹直肌、臀肌群、腘绳肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e躯干\u003c/td\u003e\u003ctd\u003e背部或躯干过度向前倾斜\u003c/td\u003e\u003ctd\u003e背阔肌、胸大肌、胸小肌；也可能与踝背屈不足、髋活动度或动作策略有关\u003c/td\u003e\u003ctd\u003e核心肌群、臀肌群、上背部伸肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e头颈\u003c/td\u003e\u003ctd\u003e头部向下\u003c/td\u003e\u003ctd\u003e髋关节和躯干屈曲程度增加；也可能是视觉或动作控制问题\u003c/td\u003e\u003ctd\u003e头颈中立位控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧面观\u003c/td\u003e\u003ctd\u003e头颈\u003c/td\u003e\u003ctd\u003e头部向上\u003c/td\u003e\u003ctd\u003e颈椎伸肌局部压迫和紧缩\u003c/td\u003e\u003ctd\u003e深层颈屈肌控制可能不足\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s237\"\u003e单腿模式评估——高台阶跨步\u003c/h4\u003e\n\u003cp\u003e评估时，客户以单腿支撑完成高台阶跨步。分别从正面和侧面观察足、膝、髋、骨盆、躯干及抬高腿的位置。\u003c/p\u003e\n\u003cp\u003e表6-20\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e主要观察部位\u003c/th\u003e\u003cth\u003e常见动作问题\u003c/th\u003e\u003cth\u003e疑似过度活跃或紧张的肌肉\u003c/th\u003e\u003cth\u003e疑似活动不足或稳定不足的肌肉\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e支撑足\u003c/td\u003e\u003ctd\u003e足部稳定性不足，足外旋、足弓下降或踝关节内翻／外翻\u003c/td\u003e\u003ctd\u003e比目鱼肌、外侧腓肠肌、腓骨肌群\u003c/td\u003e\u003ctd\u003e内侧腓肠肌、胫骨肌群、臀中肌、臀大肌；必要时检查股薄肌和缝匠肌的控制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e支撑膝\u003c/td\u003e\u003ctd\u003e膝关节向内移动，膝盖不能保持与第二脚趾方向一致\u003c/td\u003e\u003ctd\u003e髋内收肌群、阔筋膜张肌\u003c/td\u003e\u003ctd\u003e臀中肌、臀大肌及其他髋外展、外旋肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e支撑髋\u003c/td\u003e\u003ctd\u003e髋部向内移动超过约5.1厘米，或支撑腿明显内旋\u003c/td\u003e\u003ctd\u003e髋内收肌群、阔筋膜张肌、支撑腿髋内旋肌\u003c/td\u003e\u003ctd\u003e臀中肌、臀大肌、支撑腿髋外旋肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e骨盆\u003c/td\u003e\u003ctd\u003e对侧骨盆下沉、骨盆旋转或支撑侧髋部向外偏移\u003c/td\u003e\u003ctd\u003e支撑腿髋内收肌及可能限制骨盆控制的髋部肌群\u003c/td\u003e\u003ctd\u003e支撑侧臀中肌、臀大肌及躯干侧向稳定肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e躯干\u003c/td\u003e\u003ctd\u003e躯干侧倾、前倾或旋转\u003c/td\u003e\u003ctd\u003e不宜仅凭观察指定某一块紧张肌肉，应进一步检查髋部和躯干两侧的活动度\u003c/td\u003e\u003ctd\u003e核心稳定肌群、腹斜肌、臀中肌及其他骨盆稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e抬高腿\u003c/td\u003e\u003ctd\u003e抬高腿偏离矢状面，膝向内或向外移动\u003c/td\u003e\u003ctd\u003e抬高腿的髋内收肌、髋内旋肌或髋外旋肌，具体取决于偏移方向\u003c/td\u003e\u003ctd\u003e抬高腿相反方向的髋部控制肌群\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e抬高腿高度不足\u003c/td\u003e\u003ctd\u003e踝背屈不足、髋屈不足，或通过抬高骨盆代偿\u003c/td\u003e\u003ctd\u003e踝跖屈肌、抬高腿的髋伸肌；支撑腿髋屈肌也可能限制髋关节正常运动\u003c/td\u003e\u003ctd\u003e踝背屈肌、抬高腿髋屈肌、支撑腿髋伸肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腰椎和骨盆\u003c/td\u003e\u003ctd\u003e躯干前倾并伴骨盆前倾、腰椎伸展增加\u003c/td\u003e\u003ctd\u003e支撑腿髋屈肌、腰椎伸肌\u003c/td\u003e\u003ctd\u003e腹直肌、腹斜肌、臀肌及其他核心稳定肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腰椎和骨盆\u003c/td\u003e\u003ctd\u003e骨盆后倾或躯干过度屈曲\u003c/td\u003e\u003ctd\u003e腹直肌、髋伸肌\u003c/td\u003e\u003ctd\u003e支撑腿髋屈肌及躯干伸展稳定肌\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e观察要点：重点比较左右两侧。若只有一侧出现膝内移、骨盆下沉或躯干侧倾，应优先考虑两侧髋部力量、活动度或动作控制存在差异。\u003c/p\u003e\n\u003ch4 id=\"ch6-s241\"\u003e推动作评估——俯卧撑稳定性评估\u003c/h4\u003e\n\u003cp\u003e俯卧撑稳定性评估主要观察闭链推动作中肩胛骨能否稳定贴附于胸廓，以及躯干能否保持中立。\u003c/p\u003e\n\u003cp\u003e表6-21\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e主要观察部位\u003c/th\u003e\u003cth\u003e常见动作问题\u003c/th\u003e\u003cth\u003e疑似问题肌肉或原因\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩胛胸廓关节\u003c/td\u003e\u003ctd\u003e推起或下降过程中出现肩胛骨内侧缘、下角翘起，即翼状肩胛\u003c/td\u003e\u003ctd\u003e肩胛稳定肌不能有效固定肩胛骨，重点检查前锯肌、斜方肌、菱形肌和肩胛提肌之间的协同；胸椎过平也可能影响肩胛骨贴合\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩胛骨\u003c/td\u003e\u003ctd\u003e肩胛骨过度耸起或提前上提\u003c/td\u003e\u003ctd\u003e上斜方肌、肩胛提肌可能代偿；前锯肌及中、下斜方肌控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩关节\u003c/td\u003e\u003ctd\u003e肘部过度外展、肱骨头向前移动或肩部向前塌陷\u003c/td\u003e\u003ctd\u003e胸大肌、胸小肌、背阔肌等可能限制肩部位置；肩袖及肩胛稳定肌控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e躯干\u003c/td\u003e\u003ctd\u003e腰部下沉、腰椎过度伸展\u003c/td\u003e\u003ctd\u003e腹部和核心稳定肌群活动不足，不能抵抗腰椎伸展；髋屈肌或腰椎伸肌可能代偿\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e骨盆\u003c/td\u003e\u003ctd\u003e骨盆旋转、身体左右晃动\u003c/td\u003e\u003ctd\u003e腹斜肌、腹横肌、臀肌及躯干抗旋转能力不足\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e观察要点：俯卧撑评估的重点不是完成次数，而是肩胛骨是否稳定、头—胸椎—骨盆能否保持整体排列。\u003c/p\u003e\n\u003ch4 id=\"ch6-s245\"\u003e三、拉动作评估——站姿划船评估\u003c/h4\u003e\n\u003cp\u003e站姿划船评估用于观察拉动作中肩胛骨回缩、肩关节运动和躯干稳定之间的配合。\u003c/p\u003e\n\u003cp\u003e表6-22\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e主要观察部位\u003c/th\u003e\u003cth\u003e常见动作问题\u003c/th\u003e\u003cth\u003e疑似过度活跃或紧张的肌肉\u003c/th\u003e\u003cth\u003e疑似活动不足或稳定不足的肌肉\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腰椎\u003c/td\u003e\u003ctd\u003e拉动过程中腰椎过度伸展，以身体后仰代替肩关节和肩胛骨运动\u003c/td\u003e\u003ctd\u003e髋屈肌、脊柱伸肌\u003c/td\u003e\u003ctd\u003e核心肌群、腹直肌、臀肌、腘绳肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩胛骨\u003c/td\u003e\u003ctd\u003e拉动时耸肩，肩胛骨过度上提\u003c/td\u003e\u003ctd\u003e上斜方肌、肩胛提肌；菱形肌也可能参与不恰当的提肩代偿\u003c/td\u003e\u003ctd\u003e中斜方肌、下斜方肌及肩胛骨下压稳定肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e头颈部\u003c/td\u003e\u003ctd\u003e下巴前伸或头部向前、向后仰\u003c/td\u003e\u003ctd\u003e颈部伸肌、上斜方肌、肩胛提肌\u003c/td\u003e\u003ctd\u003e颈深屈肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩胛骨\u003c/td\u003e\u003ctd\u003e拉动结束时肩胛骨仍然外展，不能充分回缩\u003c/td\u003e\u003ctd\u003e前锯肌、肩前部肌群、上斜方肌可能占优势\u003c/td\u003e\u003ctd\u003e大、小菱形肌和中斜方肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩关节\u003c/td\u003e\u003ctd\u003e肱骨向前滑动、肩部内旋或肘部运动轨迹明显偏离\u003c/td\u003e\u003ctd\u003e胸大肌、胸小肌、背阔肌等可能限制肩关节位置\u003c/td\u003e\u003ctd\u003e肩袖外旋肌、后束三角肌及肩胛稳定肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e躯干\u003c/td\u003e\u003ctd\u003e身体旋转或左右移动\u003c/td\u003e\u003ctd\u003e一侧背阔肌、胸肌或躯干旋转肌可能占优势\u003c/td\u003e\u003ctd\u003e腹斜肌、多裂肌及其他抗旋转稳定肌群\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e观察要点：拉动作应主要由肩关节伸展和肩胛骨控制完成。如果客户必须耸肩、伸腰或前伸头部才能完成动作，说明负荷可能过大，或局部活动度与稳定性不足。\u003c/p\u003e\n\u003ch4 id=\"ch6-s249\"\u003e四、旋转评估——坐姿胸椎旋转\u003c/h4\u003e\n\u003cp\u003e客户跨坐在训练凳上，固定骨盆并保持躯干直立，分别向左、向右旋转。评估重点是胸椎旋转幅度及左右对称性。\u003c/p\u003e\n\u003cp\u003e表6-23\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e主要观察内容\u003c/th\u003e\u003cth\u003e常见动作问题\u003c/th\u003e\u003cth\u003e疑似问题肌肉或原因\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e旋转幅度\u003c/td\u003e\u003ctd\u003e在骨盆保持稳定的情况下，躯干不能完成约45°旋转\u003c/td\u003e\u003ctd\u003e可能存在胸椎活动度不足；应进一步检查腹内、外斜肌，多裂肌、回旋肌、胸椎伸肌以及背阔肌、胸肌对胸廓运动的影响\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e左右对称性\u003c/td\u003e\u003ctd\u003e左右旋转幅度存在明显差异\u003c/td\u003e\u003ctd\u003e可能与单侧优势、脊柱发育或长期姿势差异有关；需要比较两侧躯干旋转肌和髋旋转肌\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e骨盆\u003c/td\u003e\u003ctd\u003e骨盆跟随躯干旋转\u003c/td\u003e\u003ctd\u003e腹斜肌和深层核心肌群未能稳定骨盆；也可能以髋关节旋转代偿胸椎活动不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腰椎\u003c/td\u003e\u003ctd\u003e腰椎过度旋转或侧屈\u003c/td\u003e\u003ctd\u003e胸椎旋转受限，腰椎和骨盆代偿；躯干节段控制不足\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e胸廓\u003c/td\u003e\u003ctd\u003e旋转时身体侧倾、前屈或后仰\u003c/td\u003e\u003ctd\u003e胸椎侧屈、屈伸与旋转控制不协调；需进一步检查胸椎活动度及躯干两侧肌肉控制\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩部\u003c/td\u003e\u003ctd\u003e以肩关节前伸或手臂摆动增加旋转幅度\u003c/td\u003e\u003ctd\u003e胸椎活动不足，肩胛胸廓关节和盂肱关节参与代偿\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e头颈部\u003c/td\u003e\u003ctd\u003e头部先于躯干转动，或颈部过度旋转\u003c/td\u003e\u003ctd\u003e颈部旋转代偿胸椎活动不足；颈部深层稳定肌控制可能不足\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e评估说明：ACE原表主要根据旋转角度和左右差异判断胸椎活动情况，并未为旋转受限规定唯一的“紧张肌—无力肌”组合。因此，旋转评估发现异常后，应继续检查胸椎、肩胛带、骨盆和髋关节，不能仅凭动作表现指定某一块肌肉。\u003c/p\u003e\n\u003ch4 id=\"ch6-s253\"\u003e3.5 进阶条件\u003c/h4\u003e\n\u003cp\u003e● 客户在5种动作模式中均能控制良好地完成动作，无明显代偿\u003c/p\u003e\n\u003cp\u003e● 在深蹲中能控制下蹲阶段、保持膝关节正确对位\u003c/p\u003e\n\u003cp\u003e● 在Step-up（高台阶跨步） 中能保持髋部稳定、不过度内收\u003c/p\u003e\n\u003cp\u003e● 俯卧撑中无翼状肩胛或腰部下陷\u003c/p\u003e\n\u003cp\u003e● 站姿划船中无肩胛抬升或腰部过伸\u003c/p\u003e\n\u003cp\u003e● 胸椎旋转双侧对称且各达45°\u003c/p\u003e\n\u003ch4 id=\"ch6-s260\"\u003e3.6 对应人群\u003c/h4\u003e\n\u003cp\u003e● 已完成功能性训练阶段的客户\u003c/p\u003e\n\u003cp\u003e● 有一定运动基础但需要纠正动作模式的客户\u003c/p\u003e\n\u003cp\u003e● 准备开始负重训练的客户\u003c/p\u003e\n\u003cp\u003e● 想要提升日常动作效率的客户\u003c/p\u003e\n\u003cp\u003e思考\u003c/p\u003e\n\u003ch4 id=\"ch6-s266\"\u003e&quot;膝盖不超过脚趾&quot;误区\u003c/h4\u003e\n\u003cp\u003e● 这一说法不应被当作适用所有人的绝对规则\u003c/p\u003e\n\u003cp\u003e● 过度限制膝关节前移可将更多力矩转移至髋关节和躯干；应结合个体解剖、负荷和动作目标判断\u003c/p\u003e\n\u003cp\u003e● 正确做法：屈髋主导模式下（髋关节铰链），膝盖自然会随身体下沉前移\u003c/p\u003e\n\u003cp\u003e● 股骨较长的人在正确动作模式下，膝盖超过脚趾通常是安全的\u003c/p\u003e\n\u003cp\u003e● 【思考】\u003c/p\u003e\n\u003cp\u003e● 为什么一个过时的研究能流传这么久？因为它听起来&quot;符合常识&quot;。但身体不是简单机械，关节之间相互联动。过度限制一个关节的运动，必然导致其他关节代偿。IFT模型的逻辑正是基于这个原理： 先建立关节的稳定灵活性，在建立正确的动作模式，再安全地进行关节负荷训练。\u003c/p\u003e\n\u003ch4 id=\"ch6-s273\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e动作训练的核心要点：在各种姿势下都能正确移动，后续负重训练才有安全的动作基础。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e● 客户在俯卧撑评估中出现&quot;翼状肩胛&quot;（肩胛骨过度翘起）。你认为问题可能出在哪里？训练中应该如何改善？\u003c/p\u003e\n\u003cp\u003e● 答案：翼状肩胛提示前锯肌无力/胸小肌紧张 + 中下斜方肌激活不足。训练重点：松解紧张的肌肉（胸小肌）加强前锯肌（推墙俯卧撑、锯齿俯卧撑）和中下斜方肌（肩胛下沉练习）\u003c/p\u003e\n\u003cp\u003e📚记忆小本：\u003c/p\u003e\n\u003cp\u003e● 五种动作模式：屈单推拉旋\u003c/p\u003e\n\u003cp\u003e● 三个运动平面：矢状-前后、额状-左右、水平-旋转\u003c/p\u003e\n\u003cp\u003e● 评估原则：只观察不纠正，记录代偿\u003c/p\u003e\n\u003ch4 id=\"ch6-s282\"\u003e9.3 负荷/速度训练\u003c/h4\u003e\n\u003ch4 id=\"ch6-s283\"\u003e4.1 IFT三期 符合/速度\u003c/h4\u003e\n\u003ch4 id=\"ch6-s284\"\u003e训练重点\u003c/h4\u003e\n\u003cp\u003e● 在动作训练建立的高效动作模式基础上增加外部负荷和发展力量、爆发力和肌肉耐力\u003c/p\u003e\n\u003cp\u003e● 包含三个子方向：\u003c/p\u003e\n\u003cp\u003e● 肌肉耐力（Muscular Endurance）：次最大负荷、高重复次数\u003c/p\u003e\n\u003cp\u003e● 肌肉力量（Muscular Strength）：高负荷、低重复次数\u003c/p\u003e\n\u003cp\u003e● 肌肉爆发力（Muscular Power）：力×速度，快速产生力的能力\u003c/p\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 三个子方向的类比（不够精准，但可以帮助记忆）\u003c/p\u003e\n\u003cp\u003e● 肌肉耐力 --“举多少次”\u003c/p\u003e\n\u003cp\u003e● 肌肉力量 --“ 举多重”\u003c/p\u003e\n\u003cp\u003e● 肌肉爆发力--“举多快”\u003c/p\u003e\n\u003ch4 id=\"ch6-s295\"\u003e4.2 对应评估\u003c/h4\u003e\n\u003cp\u003e图6-3\u003c/p\u003e\n\u003cp\u003e表6-24\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e子方向\u003c/th\u003e\u003cth\u003eACE评估方法\u003c/th\u003e\u003cth\u003e记录与判定\u003c/th\u003e\u003cth\u003e适用条件及注意事项\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌肉耐力——上肢\u003c/td\u003e\u003ctd\u003e俯卧撑评估：根据客户能力采用标准俯卧撑或改良俯卧撑\u003c/td\u003e\u003ctd\u003e记录保持正确动作时连续完成的次数；可依据相应的年龄、性别参考标准评价\u003c/td\u003e\u003ctd\u003e出现腰椎下沉、头部前伸、肩胛骨明显翘起或动作幅度不足时，不再计入有效次数\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌肉耐力——下肢\u003c/td\u003e\u003ctd\u003e自重深蹲评估\u003c/td\u003e\u003ctd\u003e记录在规定动作标准下完成的有效次数，同时观察足、膝、髋和躯干排列\u003c/td\u003e\u003ctd\u003e不能只记录次数。若出现足部失稳、膝内移、躯干过度前倾或腰椎代偿，应终止测试或先改善动作质量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e最大肌肉力量——上肢\u003c/td\u003e\u003ctd\u003e1-RM卧推\u003c/td\u003e\u003ctd\u003e记录在正确动作技术下仅能完成1次的最大负荷\u003c/td\u003e\u003ctd\u003e适用于完成健康筛查、熟悉抗阻训练且能够保持正确动作的客户；需要保护者和规范的递增负荷程序\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e最大肌肉力量——下肢\u003c/td\u003e\u003ctd\u003e1-RM深蹲\u003c/td\u003e\u003ctd\u003e记录在正确动作技术下仅能完成1次的最大负荷\u003c/td\u003e\u003ctd\u003e适用于完成健康筛查、熟悉抗阻训练且能够保持正确动作的客户；需要保护者和规范的递增负荷程序\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e次最大肌肉力量\u003c/td\u003e\u003ctd\u003e多次重复测试估算1-RM，如选择能够规范完成数次但不能继续完成的负荷，再通过换算表或公式估算1-RM\u003c/td\u003e\u003ctd\u003e记录负荷和规范完成的重复次数，并采用统一方法估算1-RM\u003c/td\u003e\u003ctd\u003e适用于不宜或没有必要直接进行1-RM测试的客户；重复次数过多会降低估算最大力量的准确性\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e下肢爆发力\u003c/td\u003e\u003ctd\u003e纵跳评估\u003c/td\u003e\u003ctd\u003e记录站立摸高与跳跃摸高的差值；通常完成数次，取最佳有效成绩\u003c/td\u003e\u003ctd\u003e用于评估下肢垂直爆发力。客户应具备安全起跳和落地能力；存在下肢关节损伤、疼痛、平衡障碍或术后恢复问题者不宜测试\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s298\"\u003e4.3 1-RM评估重要规则（必背）\u003c/h4\u003e\n\u003cp\u003e图6-4\u003c/p\u003e\n\u003cp\u003e● 仅建议在IFT模型负荷/速度训练阶段进行\u003c/p\u003e\n\u003cp\u003e● 新手可能不熟悉器材、不了解自身能力，容易在最大极限前放弃\u003c/p\u003e\n\u003cp\u003e● 以下个体严禁进行1-RM评估：①高血压和/或血管疾病史；②骨科限制（骨折未愈合、严重骨质疏松）；③妊娠晚期；④未控制的代谢疾病；⑤急性损伤期\u003c/p\u003e\n\u003cp\u003e● 评估前需充分热身，但不要做长时间静态拉伸（会降低表现）\u003c/p\u003e\n\u003cp\u003e● 避免Valsalva动作（屏气）\u003c/p\u003e\n\u003cp\u003e● 理想通过3-5组达到1-RM，每组间休息2-5分钟\u003c/p\u003e\n\u003cp\u003e● 对于大多数客户，不需要1-RM作为基线， 记录训练中的渐进负荷提升即可\u003c/p\u003e\n\u003cp\u003e● 对于已稳定通过动作训练阶段、动作模式良好的客户，可在过渡期先使用次最大力量估测，不必等到完全进入负荷/速度训练阶段才评估力量水平。\u003c/p\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 1-RM禁忌清单：\u003c/p\u003e\n\u003cp\u003e● ❌ 新手（不熟悉器材+不了解自身能力）\u003c/p\u003e\n\u003cp\u003e● ❌ 高血压/血管疾病\u003c/p\u003e\n\u003cp\u003e● ❌  急性损伤期/骨科限制\u003c/p\u003e\n\u003cp\u003e● ❌ 未充分热身\u003c/p\u003e\n\u003cp\u003e● ❌ 2小时之内完成了高强度长时间的静态拉伸\u003c/p\u003e\n\u003cp\u003e● 口诀：「新高骨未拉伸」（新手/高血压/血管疾病/骨科限制/急性损伤/未充分热身/长时间静态拉伸后）\u003c/p\u003e\n\u003ch4 id=\"ch6-s316\"\u003e4.4 次最大力量估测法\u003c/h4\u003e\n\u003cp\u003e图6-5\u003c/p\u003e\n\u003cp\u003e● 深蹲/腿举系数表与卧推/胸推系数表\u003c/p\u003e\n\u003ch4 id=\"ch6-s319\"\u003e● 例：客户以160磅完成8次卧推 → 1-RM = 160 × 1.255 = 201磅\u003c/h4\u003e\n\u003ch4 id=\"ch6-s320\"\u003e4.6 对应人群\u003c/h4\u003e\n\u003cp\u003e● 动作模式已经良好控制、没有代偿的客户\u003c/p\u003e\n\u003cp\u003e● 想要发展肌肉力量、体积或爆发力的客户\u003c/p\u003e\n\u003cp\u003e● 运动员或对高级训练形式感兴趣的客户\u003c/p\u003e\n\u003cp\u003e● ⚠不适用于骨科限制或仍处于损伤恢复期的客户（爆发力评估禁忌）\u003c/p\u003e\n\u003cp\u003e【教练提示】\u003c/p\u003e\n\u003cp\u003e1-RM评估的替代方案：\u003c/p\u003e\n\u003cp\u003e1. 次最大力量估测（更安全）：让客户做8-12次，记录重量，查表估算1-RM\u003c/p\u003e\n\u003cp\u003e2. 记录渐进负荷：不需要1-RM数字，记录每次训练能完成的重量和次数，观察进步曲线\u003c/p\u003e\n\u003cp\u003e3. 对话式评估：问客户&quot;这个重量你还能再做几次&quot;，在&quot;还能做2-3次&quot;时停止\u003c/p\u003e\n\u003cp\u003e爆发力评估的禁忌：\u003c/p\u003e\n\u003cp\u003e● 骨质疏松客户（骨折风险高）\u003c/p\u003e\n\u003cp\u003e● 膝关节损伤未完全恢复\u003c/p\u003e\n\u003cp\u003e● 腰椎间盘突出\u003c/p\u003e\n\u003cp\u003e● 任何刚做完手术的部位\u003c/p\u003e\n\u003cp\u003e● 老年人（视情况）\u003c/p\u003e\n\u003cp\u003e【思考】\u003c/p\u003e\n\u003cp\u003e为什么1-RM评估有这么多限制？因为最大力量测试就是在挑战身体极限。挑战极限必然伴随风险： 关节压力、肌肉撕裂、心血管应激等。IFT模型的逻辑是：只有在前面两个阶段建立了足够的功能基础和动作控制能力，身体才能安全地承受这种压力。\u003c/p\u003e\n\u003ch4 id=\"ch6-s338\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e正确动作模式是安全负重的前提\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e● 有位客户之前是举重运动员，现在想重新开始训练。你认为他可以直接进入负荷/速度训练阶段吗？为什么？\u003c/p\u003e\n\u003cp\u003e● 答案：需要重新评估。即使是举重运动员，如果长时间没有训练，动作模式可能退化，且不了解当前身体状态。应先进行动作评估，确认5种动作模式无代偿后，再进入负荷/速度训练。\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● • 三个子方向：耐力-多次、力量-多重、爆发-多快\u003c/p\u003e\n\u003cp\u003e● • 1-RM禁忌：新高骨未拉伸（新手/高血压/骨科限制/急性损伤/未热身/静态拉伸后）\u003c/p\u003e\n\u003cp\u003e● • 次大力量估算：完成该次数所使用的负荷×对应系数＝估算1RM\u003c/p\u003e\n\u003cp\u003e● • 双渐进训练：先加次数，再加5%重量\u003c/p\u003e\n\u003ch4 id=\"ch6-s348\"\u003e9.4 三阶段整合\u003c/h4\u003e\n\u003ch4 id=\"ch6-s349\"\u003e5.1 IFT三阶段整合表\u003c/h4\u003e\n\u003cp\u003e表6-25\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e阶段一：功能性训练\u003c/th\u003e\u003cth\u003e阶段二：动作训练\u003c/th\u003e\u003cth\u003e阶段三：负荷/速度训练\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心目标\u003c/td\u003e\u003ctd\u003e建立姿势稳定性 + 动力链灵活性\u003c/td\u003e\u003ctd\u003e在3个平面内高效完成5种动作模式\u003c/td\u003e\u003ctd\u003e增加负荷，发展力量/爆发力/耐力\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e训练重点\u003c/td\u003e\u003ctd\u003e肌肉耐力、柔韧性、核心功能、静态/动态平衡\u003c/td\u003e\u003ctd\u003e5种动作模式的质量控制\u003c/td\u003e\u003ctd\u003e肌肉耐力、肌肉力量、肌肉爆发力\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5种动作模式\u003c/td\u003e\u003ctd\u003e不涉及（先打好基础）\u003c/td\u003e\u003ctd\u003e屈髋提起、单腿、推、拉、旋转\u003c/td\u003e\u003ctd\u003e在5种动作模式上叠加负荷/速度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e对应评估\u003c/td\u003e\u003ctd\u003e静态姿势评估（直角规则）、5大偏斜、 单脚站立、Y平衡、McGill核心耐力组合、托马斯试验、 被动直腿抬高、 肩部柔韧性\u003c/td\u003e\u003ctd\u003e深蹲模式评估 高台阶跨步评估 俯卧撑稳定性评估、站姿划船评估、 胸椎旋转评估\u003c/td\u003e\u003ctd\u003e俯卧撑耐力评估、自重深蹲耐力评估1-RM卧推/深蹲、次最大力量估测、纵跳评估\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e评估目的\u003c/td\u003e\u003ctd\u003e发现姿势偏差、 肌肉不平衡、 平衡缺陷、 柔韧性不足\u003c/td\u003e\u003ctd\u003e观察 动作控制能力、 代偿模式、 关节稳定性\u003c/td\u003e\u003ctd\u003e量化力量/耐力/爆发力水平，建立基线\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e进阶条件\u003c/td\u003e\u003ctd\u003e姿势稳定性良好、 核心功能达标、 平衡能力正常、 关键肌群柔韧性正常\u003c/td\u003e\u003ctd\u003e5种动作模式 均能无代偿完成、 深蹲控制良好、 推拉稳定、胸椎旋转对称\u003c/td\u003e\u003ctd\u003e持续渐进超负荷动作模式始终无代偿\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e对应人群\u003c/td\u003e\u003ctd\u003e所有新客户、久坐少动者、姿势偏差者、老年人、恢复期客户\u003c/td\u003e\u003ctd\u003e已完成功能性训练阶段者、需纠正动作模式者\u003c/td\u003e\u003ctd\u003e动作模式良好、想发展力量/爆发力者、运动员\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e阶段颜色\u003c/td\u003e\u003ctd\u003e黄色\u003c/td\u003e\u003ctd\u003e橙色\u003c/td\u003e\u003ctd\u003e红色\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心警示\u003c/td\u003e\u003ctd\u003e不能跳过！所有客户从这开始\u003c/td\u003e\u003ctd\u003e不能跳过！动作质量是负重的安全前提\u003c/td\u003e\u003ctd\u003e1-RM有损伤风险，新手不适合\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s351\"\u003e5.2 评估的层次逻辑\u003c/h4\u003e\n\u003cp\u003e功能性评估（能不能稳定站好？关节够不够灵活？）\n      ↓ 通过\n动作评估（能不能正确地完成5种动作？有无代偿？）\n      ↓ 通过\n负荷/速度评估（能举多重？能跳多高？能做多少次？）\u003c/p\u003e\n\u003cp\u003e📚记忆技巧\u003c/p\u003e\n\u003cp\u003e● 评估三问：\u003c/p\u003e\n\u003cp\u003e● 功能性评估看：每个关节的功能和核心\u003c/p\u003e\n\u003cp\u003e● 动作评估看：五大动作模式\u003c/p\u003e\n\u003cp\u003e● 负荷/速度评估看：多少次，多重，多快\u003c/p\u003e\n\u003cp\u003e● 【思考】\u003c/p\u003e\n\u003cp\u003e● 评估决定训练起点， 这是IFT模型最重要的原则。应先通过必要的评估了解客户当前的功能水平和动作模式，再决定训练起点。客户说&quot;我有经验&quot;不等于&quot;功能没问题&quot;。\u003c/p\u003e\n\u003ch3 id=\"ch6-s360\"\u003e本章知识点总结与练习\u003c/h3\u003e\n\u003ch4 id=\"ch6-s361\"\u003e核心要义凝练\u003c/h4\u003e\n\u003cp\u003e●  IFT三阶段 = 功能 → 动作 → 负荷，不能跳过前面的阶段\u003c/p\u003e\n\u003cp\u003e●  功能性训练 = 所有新客户的起点，评估姿势、平衡、核心、柔韧性\u003c/p\u003e\n\u003cp\u003e●  动作训练 = 5种动作模式（屈髋、单腿、推、拉、旋转）在3个运动平面（矢状、额状、水平）\u003c/p\u003e\n\u003cp\u003e●  负荷/速度训练 = 在正确动作上加重量/速度，分肌肉耐力、力量、爆发力三个方向\u003c/p\u003e\n\u003cp\u003e●  McGill比值是背部健康的重要指标：屈伸比&lt;1.0，侧桥对称（95%-105%），侧桥/伸展&lt;0.75\u003c/p\u003e\n\u003cp\u003e●  1-RM评估有严格禁忌：新手、高血压、血管疾病患者不能做\u003c/p\u003e\n\u003cp\u003e●  &quot;膝盖不过脚趾&quot;是误区：关键看膝盖是否内扣、髋关节是否先启动\u003c/p\u003e\n\u003ch4 id=\"ch6-s369\"\u003e思考与练习\u003c/h4\u003e\n\u003cp\u003e开放思考题：有位退役运动员，体检报告显示骨密度偏低，想重新开始力量训练。你会如何基于IFT模型为他设计训练方案？需要注意哪些特殊考量？\u003c/p\u003e\n\u003cp\u003e选择题：关于McGill核心耐力测试，以下说法正确的是？\u003c/p\u003e\n\u003cp\u003e•A. 屈曲/伸展比值&gt;1.0说明伸肌耐力优于屈肌\u003c/p\u003e\n\u003cp\u003e• B. 侧桥/伸展比≥0.75属于正常范围\u003c/p\u003e\n\u003cp\u003e• C. 左右侧桥比超出0.95-1.05范围提示侧向稳定失衡\u003c/p\u003e\n\u003cp\u003e• D. McGill测试主要评估的是肌肉力量而非肌肉耐力\u003c/p\u003e\n\u003ch3 id=\"ch6-s376\"\u003e学员复习专用\u003c/h3\u003e\n\u003ch3 id=\"ch6-s377\"\u003e10 小结\u003c/h3\u003e\n\u003ch3 id=\"ch6-s378\"\u003e一、核心回顾\u003c/h3\u003e\n\u003cp class=\"bullet\"\u003e• ACE IFT模型是ACE-CPT的核心框架：先评估客户功能，再按&quot;功能→动作→负荷&quot;三阶段递进训练，应根据评估结果选择起点，并在基础能力满足后再进阶。\u003c/p\u003e\n\u003ch3 id=\"ch6-s380\"\u003e二、知识脉络图\u003c/h3\u003e\n\u003ch3 id=\"ch6-s381\"\u003e三、考前必背表\u003c/h3\u003e\n\u003ch4 id=\"ch6-s382\"\u003e3.1 IFT三阶段核心对比\u003c/h4\u003e\n\u003cp\u003e表6-26\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e对比维度\u003c/th\u003e\u003cth\u003e功能性训练（黄色）\u003c/th\u003e\u003cth\u003e动作训练（橙色）\u003c/th\u003e\u003cth\u003e负荷/速度训练（红色）\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心问题\u003c/td\u003e\u003ctd\u003e&quot;能稳吗？&quot;\u003c/td\u003e\u003ctd\u003e&quot;动对吗？&quot;\u003c/td\u003e\u003ctd\u003e&quot;能多重？&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e训练重点\u003c/td\u003e\u003ctd\u003e稳定性+灵活性\u003c/td\u003e\u003ctd\u003e动作质量\u003c/td\u003e\u003ctd\u003e力量+耐力+爆发力\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e代表评估\u003c/td\u003e\u003ctd\u003eY平衡、McGill\u003c/td\u003e\u003ctd\u003e深蹲、俯卧撑\u003c/td\u003e\u003ctd\u003e1-RM、俯卧撑次数、纵跳摸高\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e进阶标志\u003c/td\u003e\u003ctd\u003e姿势稳定+核心达标\u003c/td\u003e\u003ctd\u003e5种动作无代偿\u003c/td\u003e\u003ctd\u003e持续渐进超负荷，无代偿\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s384\"\u003e3.2 五大动作模式记忆\u003c/h4\u003e\n\u003cp\u003e表6-27\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e口诀\u003c/th\u003e\u003cth\u003e对应动作\u003c/th\u003e\u003cth\u003e日常举例\u003c/th\u003e\u003cth\u003e评估观察\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e屈\u003c/td\u003e\u003ctd\u003e屈髋提起\u003c/td\u003e\u003ctd\u003e坐椅子/捡东西\u003c/td\u003e\u003ctd\u003e深蹲中髋关节启动？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e单\u003c/td\u003e\u003ctd\u003e单腿\u003c/td\u003e\u003ctd\u003e走路/上下楼梯\u003c/td\u003e\u003ctd\u003e高台阶跨步中髋内收？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e推\u003c/td\u003e\u003ctd\u003e推\u003c/td\u003e\u003ctd\u003e推门/俯卧撑\u003c/td\u003e\u003ctd\u003e翼状肩胛/腰部下陷？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e拉\u003c/td\u003e\u003ctd\u003e拉\u003c/td\u003e\u003ctd\u003e拉车门/划船\u003c/td\u003e\u003ctd\u003e肩胛抬升/腰部过伸？\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e旋\u003c/td\u003e\u003ctd\u003e旋转\u003c/td\u003e\u003ctd\u003e转身/挥杆\u003c/td\u003e\u003ctd\u003e双侧不对称？\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s386\"\u003e3.3 三个运动平面\u003c/h4\u003e\n\u003cp\u003e表6-28\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e平面\u003c/th\u003e\u003cth\u003e分割方式\u003c/th\u003e\u003cth\u003e包含运动\u003c/th\u003e\u003cth\u003e训练举例\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e矢状面\u003c/td\u003e\u003ctd\u003e左右分割\u003c/td\u003e\u003ctd\u003e屈伸\u003c/td\u003e\u003ctd\u003e深蹲、弓步\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e额状面\u003c/td\u003e\u003ctd\u003e前后分割\u003c/td\u003e\u003ctd\u003e展收\u003c/td\u003e\u003ctd\u003e侧平举、侧弓步\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e水平面\u003c/td\u003e\u003ctd\u003e上下分割\u003c/td\u003e\u003ctd\u003e旋转\u003c/td\u003e\u003ctd\u003e转身、划船旋转\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch6-s388\"\u003e3.4 McGill比值三兄弟\u003c/h4\u003e\n\u003cp\u003e表6-29\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e比值\u003c/th\u003e\u003cth\u003e公式\u003c/th\u003e\u003cth\u003e正常范围\u003c/th\u003e\u003cth\u003e异常提示\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e屈伸比\u003c/td\u003e\u003ctd\u003e屈曲时间÷伸展时间\u003c/td\u003e\u003ctd\u003e&lt; 1.0\u003c/td\u003e\u003ctd\u003e屈肌过强， 背部不稳\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧桥对称比\u003c/td\u003e\u003ctd\u003e左侧÷右侧\u003c/td\u003e\u003ctd\u003e0.95-1.05\u003c/td\u003e\u003ctd\u003e一侧髋外展肌弱\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e侧桥伸展比\u003c/td\u003e\u003ctd\u003e侧桥时间÷伸展时间\u003c/td\u003e\u003ctd\u003e&lt; 0.75\u003c/td\u003e\u003ctd\u003e侧桥强度异常\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch6-s390\"\u003e四、自检清单\u003c/h3\u003e\n\u003ch4 id=\"ch6-s391\"\u003e4.1 基础概念自检\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出IFT三阶段的名称和顺序\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能解释为什么不能跳过前面的阶段\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出5种主要动作模式的名称\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出3个运动平面的名称和分割方式\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能解释&quot;功能性训练&quot;和&quot;动作训练&quot;的区别\u003c/p\u003e\n\u003ch4 id=\"ch6-s397\"\u003e4.2 评估知识自检\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出功能性训练阶段的评估项目\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出动作训练阶段的评估项目\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出McGill比值的三个正常范围\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出Y平衡测试的下肢损伤风险阈值\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能说出1-RM评估的禁忌人群\u003c/p\u003e\n\u003ch4 id=\"ch6-s403\"\u003e4.3 应用能力自检\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能根据客户情况判断从哪个阶段开始\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能识别深蹲评估中的常见代偿模式\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能识别俯卧撑评估中的常见问题\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能解释&quot;膝盖不过脚趾&quot;为什么是误区\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能解释双渐进式训练的执行方法\u003c/p\u003e\n\u003ch3 id=\"ch6-s409\"\u003e六、章末三件事\u003c/h3\u003e\n\u003ch4 id=\"ch6-s410\"\u003e第一件事：记住核心框架\u003c/h4\u003e\n\u003cp\u003e今晚睡前，用5分钟回忆IFT三阶段：&quot;功能→动作→负荷&quot;，想想每阶段的评估项目和训练重点。\u003c/p\u003e\n\u003ch4 id=\"ch6-s412\"\u003e第二件事：背熟必背数字\u003c/h4\u003e\n\u003cp\u003e明天起床后，背诵以下数字：\u003c/p\u003e\n\u003cp\u003e● McGill屈伸比 &lt; 1.0\u003c/p\u003e\n\u003cp\u003e● McGill侧桥对称 0.95-1.05\u003c/p\u003e\n\u003cp\u003e● Y平衡差异 &gt; 4cm\u003c/p\u003e\n\u003cp\u003e● 胸椎旋转各45°\u003c/p\u003e\n\u003ch4 id=\"ch6-s418\"\u003e第三件事：完成自检清单\u003c/h4\u003e\n\u003cp\u003e对照自检清单，检验自己对第6章的掌握程度。有不确定的地方，返回正文段重新学习。\u003c/p\u003e\n\u003ch3 id=\"ch6-s420\"\u003e综合测验（答案）\u003c/h3\u003e\n\u003cp\u003eQ1：IFT模型的三个阶段是什么？按顺序排列。\u003c/p\u003e\n\u003cp\u003e功能性训练 → 动作训练 → 负荷/速度训练\u003c/p\u003e\n\u003cp\u003eQ2：5种主要动作模式是什么？\u003c/p\u003e\n\u003cp\u003e屈髋提起、单腿、推、拉、旋转\u003c/p\u003e\n\u003cp\u003eQ3：三个运动平面是什么？在每个平面中各举一个动作例子。\u003c/p\u003e\n\u003cp\u003e矢状面（深蹲上下）、额状面（侧平举）、水平面（旋转）\u003c/p\u003e\n\u003cp\u003eQ4：McGill核心耐力测试中，屈曲:伸展比的正常范围是多少？超过这个范围说明什么？\u003c/p\u003e\n\u003cp\u003e&lt;1.0。超过说明屈肌耐力相对强于伸肌，提示背部稳定性风险。\u003c/p\u003e\n\u003cp\u003eQ5：为什么1-RM评估不适合新手客户？（列出至少3个原因）\u003c/p\u003e\n\u003cp\u003e①仅适用于负荷/速度训练阶段；②新手不熟悉器材、不了解自身能力；③对高血压、心血管风险或其他需要医疗限制的客户，应先根据筛查结果和医疗建议判断是否适合进行1-RM评估；④有损伤风险。\u003c/p\u003e\n\u003cp\u003eQ6：深蹲中&quot;膝盖不超过脚趾&quot;的建议有什么问题？\u003c/p\u003e\n\u003cp\u003e“膝盖永远不能超过脚趾”不应被当作所有人的绝对规则。深蹲时膝关节和髋关节会共同承担力矩；过度限制膝关节前移可能将更多负荷转移到髋部和躯干。应根据个体解剖、活动度、负荷与动作目标评估蹲法。\u003c/p\u003e\n\u003cp\u003eQ7：Y平衡测试中，什么情况下提示下肢损伤风险？\u003c/p\u003e\n\u003cp\u003e前部方向对称性差异超过4厘米（1.6英寸）。\u003c/p\u003e\n\u003cp\u003eQ8：双渐进式训练方案是什么？如何执行？\u003c/p\u003e\n\u003cp\u003e先增加重复次数至目标次数，再增加5%重量，然后重复循环。\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ACEpresso结语：IFT模型是整个ACE-CPT体系的核心框架。记住一个原则：评估为训练起点和计划选择提供依据。完成必要的筛查与评估后，再结合客户目标制订训练计划。不应仅根据客户自述的训练经验判定起点，仍需根据筛查、评估与动作表现做出决定。 很多&quot;有经验&quot;的客户实际上带着错误的动作模式在训练。\u003c/p\u003e\n\u003cp\u003e慢性病客户注意事项\u003c/p\u003e\n\u003cp\u003e第     7章\u003c/p\u003e","sections":[{"title":"第6章 肌肉训练：基础、益处和计划设计","anchor":"ch6-s0"},{"title":"学员预习专用","anchor":"ch6-s2"},{"title":"正文部分","anchor":"ch6-s27"},{"title":"1 解剖学系统","anchor":"ch6-s28"},{"title":"2 结缔组织","anchor":"ch6-s41"},{"title":"3 人类运动术语","anchor":"ch6-s46"},{"title":"4 肌肉训练的益处","anchor":"ch6-s60"},{"title":"5 肌肉训练的生理适应：急性适应和长期适应","anchor":"ch6-s79"},{"title":"6 肌肉训练原则","anchor":"ch6-s100"},{"title":"7 肌肉训练变量和计划设计","anchor":"ch6-s119"},{"title":"8 肌肉训练课程的组成部分","anchor":"ch6-s135"},{"title":"9 ACE整合式健身训练模型：肌肉训练与评估","anchor":"ch6-s143"},{"title":"模型总体架构","anchor":"ch6-s144"},{"title":"本章知识点总结与练习","anchor":"ch6-s360"},{"title":"学员复习专用","anchor":"ch6-s376"},{"title":"10 小结","anchor":"ch6-s377"},{"title":"一、核心回顾","anchor":"ch6-s378"},{"title":"二、知识脉络图","anchor":"ch6-s380"},{"title":"三、考前必背表","anchor":"ch6-s381"},{"title":"四、自检清单","anchor":"ch6-s390"},{"title":"六、章末三件事","anchor":"ch6-s409"},{"title":"综合测验（答案）","anchor":"ch6-s420"}],"paragraphCount":440},"7":{"html":"\u003ch2 id=\"ch7-s0\"\u003eACE 教材第7章 · 慢性病客户注意事项\u003c/h2\u003e\n\u003cp\u003e本章节内容按&quot;核心机制→症状要点→运动改善模式→安全注意&quot;四段结构组织\u003c/p\u003e\n\u003ch3 id=\"ch7-s2\"\u003e跨疾病通用原则（所有疾病都适用的原则）\u003c/h3\u003e\n\u003ch4 id=\"ch7-s3\"\u003e医学许可与筛查\u003c/h4\u003e\n\u003cp\u003e● 所有慢性病客户开始运动前需获得医学许可\u003c/p\u003e\n\u003cp\u003e● 遵循ACE整合式Fitness训练模型的一般原则，根据疾病特点个性化调整\u003c/p\u003e\n\u003cp\u003e● 使用SOAP笔记记录客户进展（主观→客观→评估→计划）\u003c/p\u003e\n\u003ch4 id=\"ch7-s7\"\u003e运动处方通用框架\u003c/h4\u003e\n\u003cp\u003e● 心肺：FITT-VP（频率、强度、时间、类型、进阶、变化）\u003c/p\u003e\n\u003cp\u003e● 肌力：频率、强度、时间、类型、进阶\u003c/p\u003e\n\u003cp\u003e● 强度监控：HRR%、VO₂R%、RPE、VT1/VT2\u003c/p\u003e\n\u003ch4 id=\"ch7-s11\"\u003e多学科协作\u003c/h4\u003e\n\u003cp\u003e● 私人教练需与治疗医生、理疗师、注册营养师、心理健康专业人员保持沟通\u003c/p\u003e\n\u003cp\u003e● 多学科方法优于单一药物或单一干预\u003c/p\u003e\n\u003ch4 id=\"ch7-s14\"\u003e生活方式干预核心\u003c/h4\u003e\n\u003cp\u003e● 所有慢性病共同建议：适度（适量营养+热量+运动频率/强度/时间）\u003c/p\u003e\n\u003cp\u003e● 减重、增加身体活动、健康饮食、戒烟是共性初始策略\u003c/p\u003e\n\u003ch3 id=\"ch7-s17\"\u003e一、心脑血管疾病\u003c/h3\u003e\n\u003ch4 id=\"ch7-s18\"\u003e1.1 冠状动脉疾病（CAD）\u003c/h4\u003e\n\u003ch4 id=\"ch7-s19\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 动脉粥样硬化：血管壁炎症→脂质斑块沉积→管腔狭窄→心肌供血不足\u003c/p\u003e\n\u003cp\u003e● 心梗（MI）触发：脆弱斑块破裂→血栓形成→动脉完全堵塞\u003c/p\u003e\n\u003ch4 id=\"ch7-s22\"\u003e症状要点\u003c/h4\u003e\n\u003cp\u003e● 心绞痛（胸痛/胸闷，运动时加重）\u003c/p\u003e\n\u003cp\u003e● 呼吸困难\u003c/p\u003e\n\u003cp\u003e● 运动耐量下降\u003c/p\u003e\n\u003cp\u003e● 风险因素：家族史、高血压、血脂异常、糖尿病、吸烟、久坐、不良饮食\u003c/p\u003e\n\u003ch4 id=\"ch7-s27\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-1\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e低风险稳定客户处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：≥3天/周（最好5天+）；肌力：2-3天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：40-80% HRR，RPE 12-13，≤VT1；肌力：RPE 11-13\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e心肺：20-60分钟（含5-10分钟热身放松）；肌力：1-3组×10-15次，8-10个动作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：踏车、椭圆机、划船机、步行；肌力：小重量起始→逐渐过渡到器械\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s29\"\u003e安全红线\u003c/h4\u003e\n\u003cp\u003e● 必须获得医学许可后方可开始训练\u003c/p\u003e\n\u003cp\u003e● 终止运动的信号：心绞痛、呼吸困难、头晕、面色苍白、心率超目标\u003c/p\u003e\n\u003cp\u003e● 避免Valsalva动作（憋气）\u003c/p\u003e\n\u003cp\u003e● 低风险标准：住院过程无并发症、无缺血证据、功能能力&gt;7METs、射血分数&gt;50%\u003c/p\u003e\n\u003ch4 id=\"ch7-s34\"\u003e1.2 高血压\u003c/h4\u003e\n\u003cp\u003e图7-1\u003c/p\u003e\n\u003ch4 id=\"ch7-s36\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 原发性（90-95%）：病因不明，遗传+环境交互\u003c/p\u003e\n\u003cp\u003e● 继发性（5-10%）：肾脏疾病等可识别原因\u003c/p\u003e\n\u003cp\u003e● 关键可变风险因素：压力、体脂过多、钠摄入、酒精、久坐、睡眠不足（OSA）\u003c/p\u003e\n\u003ch4 id=\"ch7-s40\"\u003e诊断标准（2017 ACC/AHA）\u003c/h4\u003e\n\u003cp\u003e表7-2\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e分类\u003c/th\u003e\u003cth\u003e收缩压\u003c/th\u003e\u003cth\u003e舒张压\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e正常\u003c/td\u003e\u003ctd\u003e&lt;120\u003c/td\u003e\u003ctd\u003e&lt;80\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e偏高\u003c/td\u003e\u003ctd\u003e120-129\u003c/td\u003e\u003ctd\u003e&lt;80\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1期\u003c/td\u003e\u003ctd\u003e130-139\u003c/td\u003e\u003ctd\u003e80-89\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2期\u003c/td\u003e\u003ctd\u003e≥140\u003c/td\u003e\u003ctd\u003e≥90\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s42\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-3\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e大多数/所有天数\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e40-59% HRR，RPE 12-13，&lt;VT1（可舒适交谈）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e≥30分钟连续或累积（可分10分钟间歇）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e有节奏大肌群：步行、慢跑、骑车、游泳\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌力\u003c/td\u003e\u003ctd\u003e60-80% 1-RM，2-4组×8-12次，避免Valsalva\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s44\"\u003e关键数据\u003c/h4\u003e\n\u003cp\u003e● 单次运动后血压可降低5-7 mmHg，持续24小时\u003c/p\u003e\n\u003cp\u003e● 每周≥150分钟运动量降压效果最大\u003c/p\u003e\n\u003cp\u003e● 生活方式改变（DASH饮食+运动+减重）效果可媲美药物\u003c/p\u003e\n\u003ch4 id=\"ch7-s48\"\u003e安全注意\u003c/h4\u003e\n\u003cp\u003e● 服用β受体阻滞剂/钙通道阻滞剂者：用RPE监控强度，缓慢变换体位\u003c/p\u003e\n\u003cp\u003e● 服用利尿剂者：注意补液，防止脱水和运动后低血压\u003c/p\u003e\n\u003cp\u003e● 体位性低血压者：转介医疗专业人员评估用药\u003c/p\u003e\n\u003ch4 id=\"ch7-s52\"\u003e1.3 中风\u003c/h4\u003e\n\u003cp\u003e图7-2\u003c/p\u003e\n\u003ch4 id=\"ch7-s54\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 缺血性（~80%）：脑血管被血栓/斑块堵塞\u003c/p\u003e\n\u003cp\u003e● 出血性（~20%）：脑血管破裂\u003c/p\u003e\n\u003ch4 id=\"ch7-s57\"\u003e警示信号（FAST原则）\u003c/h4\u003e\n\u003cp\u003e● Face：面部突然下垂\u003c/p\u003e\n\u003cp\u003e● Arms：手臂突然无力\u003c/p\u003e\n\u003cp\u003e● Speech：说话困难/理解障碍\u003c/p\u003e\n\u003cp\u003e● Time：立即呼叫急救\u003c/p\u003e\n\u003ch4 id=\"ch7-s62\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-4\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：3-5天/周；肌力：2个非连续日\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：轻-中-剧烈均可，40-70% HRR或RPE 11-14；肌力：50-70% 1-RM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e心肺：20-60分钟，可分多轮；肌力：1-3组×8-15次\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：踏车、卧式踏步机、跑步机步行；肌力：器械优先（安全性高）\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s64\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● 运动可改善CVD风险因素（血压、血脂、胰岛素敏感性）\u003c/p\u003e\n\u003cp\u003e● 运动可改善平衡/协调/步态\u003c/p\u003e\n\u003cp\u003e● 即使中风后数年，运动仍能改善运动功能\u003c/p\u003e\n\u003cp\u003e● 运动指南应来自理疗师/职业治疗师\u003c/p\u003e\n\u003ch4 id=\"ch7-s69\"\u003e1.4 外周动脉疾病（PAD）\u003c/h4\u003e\n\u003cp\u003e图7-3\u003c/p\u003e\n\u003ch4 id=\"ch7-s71\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 下肢动脉粥样硬化→病变远端血流减少→缺血性跛行（运动性下肢疼痛）\u003c/p\u003e\n\u003cp\u003e● 最常见病变部位：腹主动脉/髂骨、股骨、腘动脉、胫骨动脉\u003c/p\u003e\n\u003ch4 id=\"ch7-s74\"\u003e症状要点\u003c/h4\u003e\n\u003cp\u003e● 跛行：行走一定距离后出现下肢钝痛/酸痛/痉挛\u003c/p\u003e\n\u003cp\u003e● 休息后缓解，再走再痛\u003c/p\u003e\n\u003cp\u003e● 重症者静息时也疼痛\u003c/p\u003e\n\u003ch4 id=\"ch7-s78\"\u003e运动改善模式（核心：间歇步行训练）\u003c/h4\u003e\n\u003cp\u003e表7-5\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e3-5天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e中等强度，以疼痛强度为准（非心率）；跛行疼痛量表3-4级（轻-中度）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e30-45分钟（不含休息），逐步至60分钟；12周为一周期\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e承重步行（间歇性）：走至中度疼痛→坐下休息→疼痛消失→继续\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s80\"\u003e关键机制\u003c/h4\u003e\n\u003cp\u003e● 步行产生缺血→刺激侧支循环形成+毛细血管/线粒体密度增加→氧气利用改善\u003c/p\u003e\n\u003cp\u003e● &quot;高强度&quot;在此语境指疼痛强度，非能量消耗\u003c/p\u003e\n\u003ch4 id=\"ch7-s83\"\u003e安全注意\u003c/h4\u003e\n\u003cp\u003e● 出现CAD症状（胸痛等）→立即停止，需医学评估\u003c/p\u003e\n\u003cp\u003e● 足部护理至关重要（尤其合并糖尿病者）\u003c/p\u003e\n\u003cp\u003e● 穿合适的鞋袜\u003c/p\u003e\n\u003ch3 id=\"ch7-s87\"\u003e二、代谢紊乱\u003c/h3\u003e\n\u003ch4 id=\"ch7-s88\"\u003e2.1 血脂异常\u003c/h4\u003e\n\u003ch4 id=\"ch7-s89\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e图7-4\u003c/p\u003e\n\u003cp\u003e● 脂质代谢紊乱：总胆固醇↑、LDL↑、TG↑、HDL↓ → 动脉粥样硬化\u003c/p\u003e\n\u003cp\u003e● 关键脂蛋白：\u003c/p\u003e\n\u003cp\u003e● LDL（&quot;坏&quot;胆固醇）：促进动脉粥样硬化\u003c/p\u003e\n\u003cp\u003e● HDL（&quot;好&quot;胆固醇）：运输脂质至肝脏排泄，与CAD负相关\u003c/p\u003e\n\u003cp\u003e● 非HDL胆固醇：HDL之外的总胆固醇，识别致动脉粥样硬化颗粒，优于LDL\u003c/p\u003e\n\u003cp\u003e● TG：独立风险因素，慢性升高→内皮功能障碍\u003c/p\u003e\n\u003ch4 id=\"ch7-s97\"\u003e诊断标准\u003c/h4\u003e\n\u003cp\u003e表7-6\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e指标\u003c/th\u003e\u003cth\u003e理想\u003c/th\u003e\u003cth\u003e边缘偏高\u003c/th\u003e\u003cth\u003e高\u003c/th\u003e\u003cth\u003e非常高\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLDL\u003c/td\u003e\u003ctd\u003e&lt;100\u003c/td\u003e\u003ctd\u003e130-159\u003c/td\u003e\u003ctd\u003e160-189\u003c/td\u003e\u003ctd\u003e≥190\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e总胆固醇\u003c/td\u003e\u003ctd\u003e&lt;200\u003c/td\u003e\u003ctd\u003e200-239\u003c/td\u003e\u003ctd\u003e≥240\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHDL\u003c/td\u003e\u003ctd\u003e≥60（高=保护性）\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003ctd\u003e&lt;40（低=风险）\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTG\u003c/td\u003e\u003ctd\u003e&lt;150\u003c/td\u003e\u003ctd\u003e150-199\u003c/td\u003e\
