03eQ5：定期运动 + 已知CVD + 无症状 的客户想做中等强度有氧，需要医学许可吗？\u003c/p\u003e\n\u003cp\u003e✅ 不需要。定期运动 + 有疾病但无症状 + 中等强度 = 不需要医学许可。只有高强度才需要。\u003c/p\u003e\n\u003cp\u003eQ6：降压药常见的额外风险是什么？在训练中如何应对？\u003c/p\u003e\n\u003cp\u003e✅ 体位性低血压。从坐/卧位快速站起时血压下降导致头晕。应对：地板动作后慢起。\u003c/p\u003e\n\u003cp\u003eQ7：运动前健康筛查的三个风险调节因素是什么？\u003c/p\u003e\n\u003cp\u003e✅ ①目前身体活动水平 ②是否确诊CVD/代谢/肾脏疾病或有相关体征/症状 ③期望运动强度\u003c/p\u003e\n\u003ch3 id=\"ch4-s509\"\u003e最终思考与练习\u003c/h3\u003e\n\u003cp\u003e开放思考题：\u003c/p\u003e\n\u003cp\u003e一位45岁客户，每周跑步3次、每次30分钟，体检发现高血压但无症状。他想开始力量训练。作为私教，你需要哪些信息？根据已知信息，你认为需要医学许可吗？\u003c/p\u003e\n\u003cp\u003e参考答案：\u003c/p\u003e\n\u003cp\u003e• 需要的信息：高血压严重程度、是否服药、药物类型、血压控制情况、家族病史等\u003c/p\u003e\n\u003cp\u003e• 根据已知信息：每周3次×30分钟满足定期运动定义；高血压是疾病但无症状；做力量训练强度通常为中等。需要判断是否为定期运动（过去3个月是否持续），如果满足则中等强度不需要许可，但建议获取医生许可以更好设计训练方案。\u003c/p\u003e\n\u003cp\u003e选择题：\u003c/p\u003e\n\u003cp\u003e以下哪项是本章最重要的学习目标？\u003c/p\u003e\n\u003cp\u003e• A. 记住所有药物对心率的影响\u003c/p\u003e\n\u003cp\u003e• B. 理解筛查算法的逻辑框架，能根据客户信息确定合适的下一步 ✅\u003c/p\u003e\n\u003cp\u003e• C. 背诵所有体征/症状列表\u003c/p\u003e\n\u003cp\u003e• D. 知道什么时候可以跳过筛查流程\u003c/p\u003e\n\u003cp\u003eACEpresso提示：本章是ACE-CPT安全执业的基础章节。筛查流程看似繁琐，但核心理念很清楚： 在安全的前提下，帮助更多人开始并维持运动。遇到具体案例时，先画三轴，再查算法，最后决定下一步动作。\u003c/p\u003e\n\u003cp\u003e心肺训练：生理机能、评估和计划\u003c/p\u003e\n\u003cp\u003e第      5章\u003c/p\u003e","sections":[{"title":"第4章 运动前健康筛查","anchor":"ch4-s0"},{"title":"学员预习专用","anchor":"ch4-s6"},{"title":"正文部分","anchor":"ch4-s27"},{"title":"1 运动的固有健康风险","anchor":"ch4-s28"},{"title":"2 运动前健康筛查","anchor":"ch4-s67"},{"title":"3 附加表格","anchor":"ch4-s337"},{"title":"4 药物","anchor":"ch4-s378"},{"title":"学员复习专用","anchor":"ch4-s461"},{"title":"5 小结","anchor":"ch4-s462"},{"title":"一、核心回顾","anchor":"ch4-s465"},{"title":"二、知识脉络","anchor":"ch4-s467"},{"title":"三、考前必背表","anchor":"ch4-s469"},{"title":"综合测验","anchor":"ch4-s494"},{"title":"最终思考与练习","anchor":"ch4-s509"}],"paragraphCount":524},"5":{"html":"\u003ch2 id=\"ch5-s0\"\u003e第5章 心肺训练：生理机能、评估和计划\u003c/h2\u003e\n\u003ch4 id=\"ch5-s1\"\u003e本章导读\u003c/h4\u003e\n\u003ch3 id=\"ch5-s2\"\u003e学员预习专用\u003c/h3\u003e\n\u003ch4 id=\"ch5-s3\"\u003e本章核心知识点（学习目标/必考清单）\u003c/h4\u003e\n\u003cp\u003e表5-1\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e核心知识点\u003c/th\u003e\u003cth\u003e掌握程度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003e心血管系统结构：体循环与肺循环路径\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003e心脏四腔室功能：左右心房/心室区别\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e呼吸系统核心：膈肌是唯一对生命至关重要的骨骼肌\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003e心肺生理三环节：摄氧→输氧→用氧\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e心输出量公式：HR × SV\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003e热衰竭与中暑的识别与急救\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e大众心肺指南：每周150/75分钟标准\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003eFITTVP原则六大要素\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e9\u003c/td\u003e\u003ctd\u003e六种强度判定方式\u003c/td\u003e\u003ctd\u003e★★☆\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e10\u003c/td\u003e\u003ctd\u003eIFT模式三期架构与适用人群\u003c/td\u003e\u003ctd\u003e★★★\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch5-s5\"\u003e一、本章核心\u003c/h4\u003e\n\u003cp\u003e本章核心：心肺训练的核心是改善人体携氧、输氧和摄取氧的整体能力，IFT模式通过三期进阶设计，从习惯养成到运动表现，循序渐进地提高心肺适能。\u003c/p\u003e\n\u003ch4 id=\"ch5-s7\"\u003e二、核心板块速览表\u003c/h4\u003e\n\u003cp\u003e表5-2\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e板块编号\u003c/th\u003e\u003cth\u003e板块名称\u003c/th\u003e\u003cth\u003e核心结论\u003c/th\u003e\u003cth\u003e页码参考\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5.1\u003c/td\u003e\u003ctd\u003e心肺训练解剖学基础\u003c/td\u003e\u003ctd\u003e心血管是闭合循环系统，呼吸以膈肌为核心\u003c/td\u003e\u003ctd\u003e§5.1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5.2\u003c/td\u003e\u003ctd\u003e心肺系统生理机能\u003c/td\u003e\u003ctd\u003e摄氧-输氧-用氧构成完整氧气物流链\u003c/td\u003e\u003ctd\u003e§5.2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5.3\u003c/td\u003e\u003ctd\u003e运动心肺适应机制\u003c/td\u003e\u003ctd\u003e渐进超负荷驱动毛细血管/线粒体/糖原适应性增长\u003c/td\u003e\u003ctd\u003e§5.3\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5.4\u003c/td\u003e\u003ctd\u003e环境与安全处置\u003c/td\u003e\u003ctd\u003e高温/低温/高海拔/污染各有风险与应对策略\u003c/td\u003e\u003ctd\u003e§5.4\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5.5\u003c/td\u003e\u003ctd\u003e大众心肺通用指南\u003c/td\u003e\u003ctd\u003e每周150/75分钟，FITTVP是计划设计核心框架\u003c/td\u003e\u003ctd\u003e§5.5\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5.6\u003c/td\u003e\u003ctd\u003eIFT模式三期架构\u003c/td\u003e\u003ctd\u003e第一期建习惯→第二期提升耐力→第三期专攻表现\u003c/td\u003e\u003ctd\u003e§5.6\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch5-s9\"\u003e三、必背关键数字表\u003c/h4\u003e\n\u003cp\u003e表5-3\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e数字\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e应用场景\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e220-年龄\u003c/td\u003e\u003ctd\u003e最大心率估算公式\u003c/td\u003e\u003ctd\u003e心率强度判定基础（存在±12BPM误差）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e60%~89%\u003c/td\u003e\u003ctd\u003e靶心率强度区间\u003c/td\u003e\u003ctd\u003e储备心率法计算训练目标心率\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e150/75\u003c/td\u003e\u003ctd\u003e每周心肺训练底线\u003c/td\u003e\u003ctd\u003e150分钟中等强度 或 75分钟高强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e30~60/20~60\u003c/td\u003e\u003ctd\u003e单次运动时长标准\u003c/td\u003e\u003ctd\u003e中等强度30-60分钟，高强度20-60分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e10%\u003c/td\u003e\u003ctd\u003e每周进阶增量上限\u003c/td\u003e\u003ctd\u003e训练进阶黄金法则\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e40℃\u003c/td\u003e\u003ctd\u003e中暑核心体温阈值\u003c/td\u003e\u003ctd\u003e区分热衰竭(&lt;40℃)与中暑(≥40℃)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e9~14天\u003c/td\u003e\u003ctd\u003e热适应期时长\u003c/td\u003e\u003ctd\u003e高温环境运动前准备\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5~7ml/kg\u003c/td\u003e\u003ctd\u003e运动前补水标准\u003c/td\u003e\u003ctd\u003e提前4小时补充\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1.5L/kg\u003c/td\u003e\u003ctd\u003e运动后补水标准\u003c/td\u003e\u003ctd\u003e每丢失1kg体重补充1.5L\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1500~2500m\u003c/td\u003e\u003ctd\u003e中高海拔范围\u003c/td\u003e\u003ctd\u003e高海拔运动风险分级\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2500~4300m\u003c/td\u003e\u003ctd\u003e高海拔范围\u003c/td\u003e\u003ctd\u003e抵达首日禁止训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e&lt;3MET\u003c/td\u003e\u003ctd\u003e低强度划分\u003c/td\u003e\u003ctd\u003e运动零食强度标准\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3~5.9MET\u003c/td\u003e\u003ctd\u003e中等强度划分\u003c/td\u003e\u003ctd\u003e稳态有氧训练区间\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e≥6MET\u003c/td\u003e\u003ctd\u003e高强度划分\u003c/td\u003e\u003ctd\u003e冲刺训练区间\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e70/10/20\u003c/td\u003e\u003ctd\u003eIFT第三期时间分配\u003c/td\u003e\u003ctd\u003e一区70-80%、二区&lt;10%、三区10-20%\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch5-s11\"\u003e四、名词缩写表\u003c/h4\u003e\n\u003cp\u003e表5-4\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e缩写\u003c/th\u003e\u003cth\u003e全称\u003c/th\u003e\u003cth\u003e中文含义\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHR\u003c/td\u003e\u003ctd\u003eHeart Rate\u003c/td\u003e\u003ctd\u003e心率\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSV\u003c/td\u003e\u003ctd\u003eStroke Volume\u003c/td\u003e\u003ctd\u003e每搏输出量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCO\u003c/td\u003e\u003ctd\u003eCardiac Output\u003c/td\u003e\u003ctd\u003e心输出量（HR × SV）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVT1\u003c/td\u003e\u003ctd\u003eFirst Ventilatory Threshold\u003c/td\u003e\u003ctd\u003e第一通气阈\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVT2\u003c/td\u003e\u003ctd\u003eSecond Ventilatory Threshold\u003c/td\u003e\u003ctd\u003e第二通气阈\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRPE\u003c/td\u003e\u003ctd\u003eRating of Perceived Exertion\u003c/td\u003e\u003ctd\u003e自觉用力程度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMET\u003c/td\u003e\u003ctd\u003eMetabolic Equivalent of Task\u003c/td\u003e\u003ctd\u003e代谢当量（梅托）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHIIT\u003c/td\u003e\u003ctd\u003eHigh-Intensity Interval Training\u003c/td\u003e\u003ctd\u003e高强度间歇训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIFT\u003c/td\u003e\u003ctd\u003eIntegrated Fitness Training\u003c/td\u003e\u003ctd\u003e综合体能训练模式\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVO₂max\u003c/td\u003e\u003ctd\u003eMaximum Oxygen Uptake\u003c/td\u003e\u003ctd\u003e最大摄氧量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVO₂R\u003c/td\u003e\u003ctd\u003eOxygen Uptake Reserve\u003c/td\u003e\u003ctd\u003e摄氧量储备\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eStep 1: 解剖基础（5.1）\n        ↓\n   心脏结构 → 循环路径 → 膈肌呼吸\n\nStep 2: 生理机能（5.2）\n        ↓\n   摄氧能力 → 输氧能力 → 用氧能力\n\nStep 3: 适应机制（5.3）\n        ↓\n   运动刺激 → 长期适应 → 渐进超负荷\n\nStep 4: 环境安全（5.4）\n        ↓\n   温度调节 → 热急症 → 低温/高海拔/污染\n\nStep 5: 大众指南（5.5）\n        ↓\n   FITTVP → 六种强度 → 运动零食\n\nStep 6: IFT模式（5.6）\n        ↓\n   第一期基础 → 第二期健身 → 第三期表现\u003c/p\u003e\n\u003ch4 id=\"ch5-s14\"\u003e七、思考与练习\u003c/h4\u003e\n\u003ch4 id=\"ch5-s15\"\u003e思考题\u003c/h4\u003e\n\u003cp\u003e一名35岁久坐办公客户，静息心率72BPM，计划开始心肺训练。根据储备心率法计算：\u003c/p\u003e\n\u003cp\u003e1. 其最大心率和储备心率各是多少？\u003c/p\u003e\n\u003cp\u003e2. 若目标强度为60%~80%，其靶心率区间是多少？\u003c/p\u003e\n\u003ch4 id=\"ch5-s19\"\u003e选择题\u003c/h4\u003e\n\u003cp\u003e关于心肺生理三环节，以下说法正确的是：\u003c/p\u003e\n\u003cp\u003eA. 摄氧能力是指氧气进入血液的能力，由肺部通气量和血红蛋白决定\u003c/p\u003e\n\u003cp\u003eB. 输氧能力取决于心输出量，计算公式为HR × SV\u003c/p\u003e\n\u003cp\u003eC. 用氧能力的关键因素是肌肉中线粒体的密度与体积\u003c/p\u003e\n\u003cp\u003eD. 以上全部正确\u003c/p\u003e\n\u003cp\u003e选择题答案：D\u003c/p\u003e\n\u003cp\u003e解析：\u003c/p\u003e\n\u003cp\u003e• A正确：摄氧能力=肺部通气量+血红蛋白\u003c/p\u003e\n\u003cp\u003e• B正确：心输出量=心率×每搏输出量\u003c/p\u003e\n\u003cp\u003e• C正确：组织用氧能力取决于线粒体密度与体积\u003c/p\u003e\n\u003cp\u003e• 三者构成完整氧气物流链，缺一不可\u003c/p\u003e\n\u003ch3 id=\"ch5-s31\"\u003e正文部分\u003c/h3\u003e\n\u003ch3 id=\"ch5-s32\"\u003e1 解剖学系统\u003c/h3\u003e\n\u003ch4 id=\"ch5-s33\"\u003e1.1 心血管系统\u003c/h4\u003e\n\u003ch4 id=\"ch5-s34\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e心血管循环系统为闭合循环系统，分为大循环与小循环，亦称为体循环和肺循环。大循环即体循环，是血液由心脏泵出流经全身的循环路径；小循环即肺循环，全身回流的静脉血汇入心脏后，依次流经右心房、右心室，再进入肺部。\u003c/p\u003e\n\u003cp\u003e心血管系统是一个精密的闭合循环系统，血液在这个封闭管道中永不停歇地流动。系统分为两条主要回路：\u003c/p\u003e\n\u003cp\u003e● 大循环（体循环）：血液从心脏出发，流经全身，再返回心脏\u003c/p\u003e\n\u003cp\u003e左心室 → 大动脉 → 小动脉 → 毛细血管(物质交换) → 静脉 → 右心房\u003c/p\u003e\n\u003cp\u003e● 小循环（肺循环）：血液从心脏出发，流经肺部，完成气体交换，再返回心脏\u003c/p\u003e\n\u003cp\u003e右心室-肺（交换气体）-左心房（继而进入左心室进入大循环）\u003c/p\u003e\n\u003cp\u003e血液在肺部完成气体交换，排出二氧化碳并重新充盈氧气后，回流至左心房，经二尖瓣进入左心室，再由左心室泵送至全身各处。\u003c/p\u003e\n\u003cp\u003e由心脏泵出的血液称为动脉血，回流至心脏的血液称为静脉血；\u003c/p\u003e\n\u003cp\u003e● 动脉血 ：动脉里的血（大部分为富氧血）\u003c/p\u003e\n\u003cp\u003e● 静脉血： 静脉里的血 （大部分为缺氧血）\u003c/p\u003e\n\u003cp\u003e例外是肺动脉（流的是缺氧血）和肺静脉（流的是富氧血）。\u003c/p\u003e\n\u003cp\u003e记忆技巧：记住&quot;动出静回&quot;\u003c/p\u003e\n\u003cp\u003e大循环中动脉流出的是富氧血，静脉流回的是缺氧血）。\u003c/p\u003e\n\u003cp\u003e小循环（肺循环）则相反：肺动脉流的是缺氧血，肺静脉流的是富氧血\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 想象血液是一场物流配送：\u003c/p\u003e\n\u003cp\u003e● 动脉是高速公路\u003c/p\u003e\n\u003cp\u003e● 小动脉是城市道路\u003c/p\u003e\n\u003cp\u003e● 毛细血管是最后100米配送点（真正的货物交换发生在这里）\u003c/p\u003e\n\u003cp\u003e● 静脉是返程物流通道\u003c/p\u003e\n\u003cp\u003e两大循环的核心对比：\u003c/p\u003e\n\u003cp\u003e表5-5\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e循环类型\u003c/th\u003e\u003cth\u003e别称\u003c/th\u003e\u003cth\u003e起点\u003c/th\u003e\u003cth\u003e终点\u003c/th\u003e\u003cth\u003e主要功能\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e大循环\u003c/td\u003e\u003ctd\u003e体循环\u003c/td\u003e\u003ctd\u003e左心室\u003c/td\u003e\u003ctd\u003e右心房\u003c/td\u003e\u003ctd\u003e全身供氧、营养输送\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e小循环\u003c/td\u003e\u003ctd\u003e肺循环\u003c/td\u003e\u003ctd\u003e右心室\u003c/td\u003e\u003ctd\u003e左心房\u003c/td\u003e\u003ctd\u003e肺部充氧、二氧化碳排出\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 记住&quot;左出右回&quot;：\u003c/p\u003e\n\u003cp\u003e● 左心室出发 → 全身跑一圈 → 右心房回来（大循环/体循环）\u003c/p\u003e\n\u003cp\u003e● 右心室出发 → 肺部跑一圈 → 左心房回来（小循环/肺循环）\u003c/p\u003e\n\u003cp\u003e肺循环的气体交换原理：\u003c/p\u003e\n\u003cp\u003e缺氧血到达肺部 → 释放CO₂ → 吸收O₂ → 富氧血返回心脏\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 肺部相当于氧气充气站：血液把&quot;废气&quot;卸载，留下&quot;新鲜氧气&quot;。\u003c/p\u003e\n\u003cp\u003e心脏解剖结构分为四个腔室，先以上下划分心房与心室，再以左右区分，分别为左心房、左心室、右心房、右心室。\u003c/p\u003e\n\u003cp\u003e图5-1\u003c/p\u003e\n\u003cp\u003e心脏四腔室空间定位：\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 上下结构：上方是&quot;接待室&quot;（心房），下方是&quot;发货部&quot;（心室）\u003c/p\u003e\n\u003cp\u003e● 左右结构：左心负责全身供氧，右心负责肺部充氧\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;上房下室，左富右贫&quot;\u003c/p\u003e\n\u003cp\u003e人体血液输出均由心室完成，全身回流血液先汇入心房，再流入心室。\u003c/p\u003e\n\u003cp\u003e记忆技巧：心脏是单向阀门系统：血液必须按&quot;心房→心室&quot;的顺序流动，绝不能倒流。心房是&quot;中转站&quot;，心室是&quot;发动机&quot;。\u003c/p\u003e\n\u003cp\u003e左心室泵出的动脉血，从左心室出发为起点，流经全身毛细血管完成物质交换后回流；回流后的缺氧静脉血先汇入右心房，经三尖瓣流入右心室。\u003c/p\u003e\n\u003ch4 id=\"ch5-s75\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：\u003c/p\u003e\n\u003cp\u003e• 心血管系统是闭合循环，分为体循环（大循环）和肺循环（小循环）\u003c/p\u003e\n\u003cp\u003e• 心脏四腔室功能：上方心房接收血液，下方心室泵出血液\u003c/p\u003e\n\u003cp\u003e• 左心系统服务全身供氧，右心系统服务肺部充氧\u003c/p\u003e\n\u003cp\u003e• 动脉血≠动脉血管里的血，而是含氧量高的血\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e血液从左心室出发，流经全身后回到心脏，依次经过哪些结构？\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● 大循环：左心室→全身→右心房\u003c/p\u003e\n\u003cp\u003e● 小循环：右心室→肺部→左心房\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;左出右回，环环相扣&quot;\u003c/p\u003e\n\u003cp\u003e● 血流方向：心房→心室→动脉，单向不逆流\u003c/p\u003e\n\u003ch4 id=\"ch5-s88\"\u003e1.2 呼吸系统\u003c/h4\u003e\n\u003ch4 id=\"ch5-s89\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e呼吸系统由鼻腔、咽、喉、气管、支气管和肺共同组成。\u003c/p\u003e\n\u003cp\u003e呼吸系统器官层级：\u003c/p\u003e\n\u003cp\u003e鼻腔 → 咽 → 喉 → 气管 → 支气管 → 细支气管 → 肺泡\u003c/p\u003e\n\u003cp\u003e图5-2\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 记住这条&quot;呼吸道&quot;就像一棵倒挂的树：\u003c/p\u003e\n\u003cp\u003e● 树干是气管\u003c/p\u003e\n\u003cp\u003e● 树枝是支气管\u003c/p\u003e\n\u003cp\u003e● 树叶是肺泡（气体交换的真正场所）\u003c/p\u003e\n\u003cp\u003e● 树根是鼻腔（空气过滤加温的第一站）\u003c/p\u003e\n\u003cp\u003e需掌握核心重点：人体最主要的吸气肌为膈肌，膈肌也是全身骨骼肌中唯一维持生命所需要的 的骨骼肌；其余常规骨骼肌均非维持生命必需，仅有膈肌具备不可替代的生命基础功能。\u003c/p\u003e\n\u003cp\u003e膈肌的独特地位：\u003c/p\u003e\n\u003cp\u003e● 膈肌是呼吸的主发动机，● 其他骨骼肌（如肱二头肌、股四头肌）&quot;罢工&quot;人还能活\u003c/p\u003e\n\u003cp\u003e● 膈肌一旦停止工作≈生命终止\u003c/p\u003e\n\u003cp\u003e● 这就是为什么呼吸训练对健康至关重要\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;膈肌是唯一，没有之一&quot;\u003c/p\u003e\n\u003cp\u003e● 类比：膈肌是呼吸系统的&quot;心脏&quot;，其他肌肉都是&quot;辅助员工&quot;\u003c/p\u003e\n\u003cp\u003e吸气时膈肌下降，呼气时膈肌上升；膈肌在胸腔内的运动原理，可类比针管活塞的启闭运动。\u003c/p\u003e\n\u003cp\u003e膈肌运动原理：\u003c/p\u003e\n\u003cp\u003e【吸气】\n膈肌下降 → 胸腔容积增大 → 气压降低 → 空气被&quot;吸入&quot;\n原理类似：注射器活塞向外拉 → 气体被吸入\n\n【呼气】\n膈肌上升 → 胸腔容积减小 → 气压升高 → 气体被&quot;挤出&quot;\n原理类似：注射器活塞向内推 → 气体被挤出\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● • 口诀：&quot;膈肌下行好进气，膈肌上行来吐气&quot;\u003c/p\u003e\n\u003cp\u003e● • 类比：膈肌就像注射器的活塞，下拉抽药、上推给药\u003c/p\u003e\n\u003ch4 id=\"ch5-s114\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：\u003c/p\u003e\n\u003cp\u003e• 呼吸系统核心是膈肌——唯一对生命至关重要的骨骼肌\u003c/p\u003e\n\u003cp\u003e• 膈肌下降→胸腔扩大→吸气；膈肌上升→胸腔缩小→呼气\u003c/p\u003e\n\u003cp\u003e• 类比针管活塞：下拉吸气、上推呼气\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e为什么说膈肌是&quot;唯一对生命至关重要的骨骼肌&quot;？其他肌肉为什么不是？\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● 呼吸系统：鼻腔→咽→喉→气管→支气管→肺\u003c/p\u003e\n\u003cp\u003e● 膈肌：呼吸主肌、生命的唯一、活塞运动\u003c/p\u003e\n\u003ch3 id=\"ch5-s124\"\u003e2 心肺系统的生理机能\u003c/h3\u003e\n\u003cp\u003e心肺生理机能可归纳为三大核心过程：摄氧能力、输氧能力、用氧能力。\u003c/p\u003e\n\u003cp\u003e● 第一和第三个均为&quot;摄氧能力&quot;，完整过程为携氧、氧输送与组织氧摄取\u003c/p\u003e\n\u003cp\u003e● 氧气物流链三环节应为：摄氧(Intake)→输氧(Delivery)→用氧(Usage)\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;一摄二输三用，氧气跑完全程&quot;\u003c/p\u003e\n\u003cp\u003e● 类比：摄氧是&quot;进货&quot;，输氧是&quot;物流&quot;，用氧是&quot;消费&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s131\"\u003e2.1 携氧能力\u003c/h4\u003e\n\u003ch4 id=\"ch5-s132\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e摄氧能力由肺部通气量与血液血红蛋白两大要素构成。\u003c/p\u003e\n\u003cp\u003e摄氧能力的两大支柱：\u003c/p\u003e\n\u003cp\u003e表5-6\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e要素\u003c/th\u003e\u003cth\u003e负责器官\u003c/th\u003e\u003cth\u003e功能\u003c/th\u003e\u003cth\u003e影响因素\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肺部通气量\u003c/td\u003e\u003ctd\u003e肺、呼吸道\u003c/td\u003e\u003ctd\u003e空气进入血液的入口\u003c/td\u003e\u003ctd\u003e呼吸道疾病、肺部疾病\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e血红蛋白\u003c/td\u003e\u003ctd\u003e血液\u003c/td\u003e\u003ctd\u003e氧气运输载体\u003c/td\u003e\u003ctd\u003e贫血、血红蛋白偏低\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 类比：摄氧就像电商进货\u003c/p\u003e\n\u003cp\u003e● 肺部通气量 = 平台流量（有多少货能进来）\u003c/p\u003e\n\u003cp\u003e● 血红蛋白 = 配送车辆（有多少车能运货）\u003c/p\u003e\n\u003cp\u003e● 肺部通气量 = 平台流量（有多少货能进来）；血红蛋白 = 配送车辆（有多少车能运货）\u003c/p\u003e\n\u003cp\u003e若存在肺部或呼吸道疾病，肺部血氧含量会下降，直接导致运动能力降低。\u003c/p\u003e\n\u003cp\u003e第一道关卡断裂：\u003c/p\u003e\n\u003cp\u003e呼吸道/肺部疾病 → 氧气进不去 → 运动能力下降\u003c/p\u003e\n\u003cp\u003e记忆技巧：肺部是氧气进入人体的&quot;安检口&quot;，安检口关闭，再好的心脏也白搭。\u003c/p\u003e\n\u003cp\u003e运动强度过高时，血液二氧化碳浓度升高、氧气供应不足，会迫使运动者即刻停止运动，产生明显缺氧憋闷感。\u003c/p\u003e\n\u003cp\u003e急性缺氧反应：\u003c/p\u003e\n\u003cp\u003e● 运动强度超过摄氧极限\u003c/p\u003e\n\u003cp\u003e● 氧气供不应求\u003c/p\u003e\n\u003cp\u003e● CO₂堆积\u003c/p\u003e\n\u003cp\u003e● 身体强制&quot;停机保护&quot;\u003c/p\u003e\n\u003cp\u003e血红蛋白浓度偏低或贫血人群，摄氧能力会受到限制，运动中极易产生疲劳感；运动时骨骼肌酸度上升、局部氧浓度下降，疲劳反应会更加明显。\u003c/p\u003e\n\u003cp\u003e贫血对运动的影响：\u003c/p\u003e\n\u003cp\u003e表5-7\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e状态\u003c/th\u003e\u003cth\u003e摄氧能力\u003c/th\u003e\u003cth\u003e运动表现\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e正常血红蛋白\u003c/td\u003e\u003ctd\u003e正常\u003c/td\u003e\u003ctd\u003e良好\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e贫血/血红蛋白低\u003c/td\u003e\u003ctd\u003e受限\u003c/td\u003e\u003ctd\u003e疲劳、易喘\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 血红蛋白 = 氧气的&quot;快递小哥&quot;\u003c/p\u003e\n\u003cp\u003e● 小哥数量不够，再近的路也送不完货\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户抱怨运动时特别容易疲劳\u003c/p\u003e\n\u003cp\u003e• 错误做法：认为是客户意志力不足\u003c/p\u003e\n\u003cp\u003e• 正确做法：建议体检排查贫血或血红蛋白问题\u003c/p\u003e\n\u003cp\u003e• 常见误区：忽视生理因素对运动能力的限制\u003c/p\u003e\n\u003ch4 id=\"ch5-s162\"\u003e2.2 氧输送\u003c/h4\u003e\n\u003cp\u003e图5-3\u003c/p\u003e\n\u003ch4 id=\"ch5-s164\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e输氧能力核心公式：\u003c/p\u003e\n\u003cp\u003e心输出量 = 心率（HR）× 每搏输出量（SV）\u003c/p\u003e\n\u003cp\u003e即每分钟心脏总泵血量，由心率与单次心跳泵血量共同决定。\u003c/p\u003e\n\u003cp\u003e心输出量公式：\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;心跳快×每次多 = 泵血多多&quot;\u003c/p\u003e\n\u003cp\u003e● 类比：心输出量 = 奶茶店每分钟卖出的杯数 = 客人数量(HR) × 每人买几杯(SV)\u003c/p\u003e\n\u003cp\u003e心脏功能越强、每搏输出量越高，同等负荷下心率越低；若每搏输出量下降，心率会代偿性升高，以此保证全身组织血液与养分的稳定供应。\u003c/p\u003e\n\u003cp\u003e心脏的代偿机制：\u003c/p\u003e\n\u003cp\u003e表5-8\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e心脏状态\u003c/th\u003e\u003cth\u003eSV（每搏量）\u003c/th\u003e\u003cth\u003eHR（心率）\u003c/th\u003e\u003cth\u003eCO（总泵血）\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e训练有素\u003c/td\u003e\u003ctd\u003e高\u003c/td\u003e\u003ctd\u003e低\u003c/td\u003e\u003ctd\u003e正常\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e心脏较弱\u003c/td\u003e\u003ctd\u003e低\u003c/td\u003e\u003ctd\u003e高\u003c/td\u003e\u003ctd\u003e正常\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 训练有素的心脏 = 大排量发动机，每次喷油多，转速可以低\u003c/p\u003e\n\u003cp\u003e● 较弱的心脏 = 小排量发动机，必须高转速才能维持动力\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;SV高则HR低，训练让心脏更省力&quot;\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：向客户解释为什么运动员心率低\u003c/p\u003e\n\u003cp\u003e• 错误做法：说&quot;运动员心脏有问题&quot;\u003c/p\u003e\n\u003cp\u003e• 正确做法：解释&quot;运动员心脏泵血效率高，安静时不需要跳那么快&quot;\u003c/p\u003e\n\u003cp\u003e• 常见误区：客户看到体检报告窦性心率过低会担心，其实这可能是心脏健康的信号\u003c/p\u003e\n\u003ch4 id=\"ch5-s184\"\u003e2.3 氧摄取\u003c/h4\u003e\n\u003ch4 id=\"ch5-s185\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e组织用氧能力，是身体组织利用氧气合成ATP供能的能力。\u003c/p\u003e\n\u003cp\u003eATP——细胞的能量货币：\u003c/p\u003e\n\u003cp\u003e葡萄糖 + 氧气 → 线粒体燃烧 → ATP（能量） + CO₂ + H₂O\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● ATP = 细胞的&quot;充电宝&quot;\u003c/p\u003e\n\u003cp\u003e● 线粒体 = 充电宝的&quot;发电机&quot;\u003c/p\u003e\n\u003cp\u003e● 有氧代谢 = 最稳定的发电模式（虽然功率不是最高）\u003c/p\u003e\n\u003cp\u003e影响该能力最关键的因素为：线粒体的密度与体积。\u003c/p\u003e\n\u003cp\u003e线粒体的核心地位：\u003c/p\u003e\n\u003cp\u003e表5-9\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e因素\u003c/th\u003e\u003cth\u003e作用\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e线粒体密度\u003c/td\u003e\u003ctd\u003e单位肌肉内线粒体数量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e线粒体体积\u003c/td\u003e\u003ctd\u003e每个线粒体的大小\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e综合效果\u003c/td\u003e\u003ctd\u003e有氧氧化供能能力的上限\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 线粒体 = 细胞的&quot;微型发电厂&quot;\u003c/p\u003e\n\u003cp\u003e● 发电厂数量多、规模大 → 供电能力强\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;线粒体多又大，有氧耐力顶呱呱&quot;\u003c/p\u003e\n\u003cp\u003e● 核心结论：线粒体的密度与体积是影响组织氧摄取和有氧代谢能力的重要因素\u003c/p\u003e\n\u003ch4 id=\"ch5-s201\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：\u003c/p\u003e\n\u003cp\u003e• 心肺生理三环节：摄氧→输氧→用氧，构成完整氧气物流链\u003c/p\u003e\n\u003cp\u003e• 摄氧能力：肺部+血红蛋白决定氧气进入量\u003c/p\u003e\n\u003cp\u003e• 输氧能力：心输出量=HR×SV，训练提升SV降低HR\u003c/p\u003e\n\u003cp\u003e• 用氧能力：线粒体密度与体积决定有氧供能上限\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e为什么马拉松运动员的静息心率通常比普通人低？\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● 心输出量 = HR × SV\u003c/p\u003e\n\u003cp\u003e● 训练使SV↑，所以HR↓（代偿机制）\u003c/p\u003e\n\u003cp\u003e● 线粒体 = 细胞的微型发电厂\u003c/p\u003e\n\u003cp\u003e● 线粒体密度决定有氧耐力上限\u003c/p\u003e\n\u003ch3 id=\"ch5-s214\"\u003e3 急性和慢性心肺运动的生理适应\u003c/h3\u003e\n\u003ch4 id=\"ch5-s215\"\u003e3.1 肌肉系统\u003c/h4\u003e\n\u003cp\u003e长期心肺训练可增加活动肌群的毛细血管密度，促进线粒体的数量、密度与功能改善，并提高肌糖原储备和利用氧的能力。\u003c/p\u003e\n\u003ch4 id=\"ch5-s217\"\u003e3.2 心血管系统\u003c/h4\u003e\n\u003cp\u003e急性运动时，心率、每搏输出量和心输出量随工作需求变化。长期训练可使心脏泵血效率提高，并改善活动肌群的血流与氧输送能力。\u003c/p\u003e\n\u003ch4 id=\"ch5-s219\"\u003e3.3 呼吸系统\u003c/h4\u003e\n\u003cp\u003e运动时，通气量会随代谢需求上升。心肺适能提高后，客户在相同亚极量工作负荷下往往能以更经济的呼吸反应完成运动。\u003c/p\u003e\n\u003ch4 id=\"ch5-s221\"\u003e3.4 提高心肺适能所需时间\u003c/h4\u003e\n\u003cp\u003e训练适应通常在初期改善较快，随着体能提高，改善速率可能逐渐减慢。进程取决于起始体能、训练刺激、恢复、健康状态和个体差异，不应把某一时间点当作所有人的固定平台期。\u003c/p\u003e\n\u003ch4 id=\"ch5-s223\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e正式进入ACE IFT模式前，需掌握运动的身体适应原理。\u003c/p\u003e\n\u003cp\u003e适应原理是训练科学的基础：不了解身体如何适应，就无法设计有效训练计划。\u003c/p\u003e\n\u003cp\u003e运动学中&quot;适应&quot;定义：身体受到运动刺激后，产生的结构性与功能性改变，分为短期适应与长期适应。\u003c/p\u003e\n\u003cp\u003e适应的时间维度：\u003c/p\u003e\n\u003cp\u003e表5-10\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e类型\u003c/th\u003e\u003cth\u003e时间线\u003c/th\u003e\u003cth\u003e特点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e短期适应\u003c/td\u003e\u003ctd\u003e即刻~数小时\u003c/td\u003e\u003ctd\u003e可逆，停止训练即消失\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e长期适应\u003c/td\u003e\u003ctd\u003e数周~数月\u003c/td\u003e\u003ctd\u003e结构改变，需要持续刺激维持\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 短期适应 = 临时抱佛脚，考完就忘\u003c/p\u003e\n\u003cp\u003e● 长期适应 = 真正学会的知识，刻进骨子里\u003c/p\u003e\n\u003cp\u003e图5-4\u003c/p\u003e\n\u003cp\u003e初次开展运动，心肺系统即刻产生适应性变化；最大摄氧量随运动负荷增加逐步提升，持续训练训练最初数月改善较快，随后改善速率可能逐渐减慢。\u003c/p\u003e\n\u003cp\u003e适应的时间曲线：\u003c/p\u003e\n\u003cp\u003e最大摄氧量\n     ↑\n     │      ╭───────── plateau (平台期)\n     │     ╱\n     │    ╱\n     │   ╱\n     │  ╱\n     │ ╱\n     │╱\n     └────────────────────────→ 时间\n          6个月左右达到平台期（个体差异较大，体能基础越好提升越慢）\u003c/p\u003e\n\u003cp\u003e同时身体会出现良性适应：毛细血管密度提升、线粒体密度与体积增大、肌肉糖原储存能力增强。\u003c/p\u003e\n\u003cp\u003e三大适应性改变：\u003c/p\u003e\n\u003cp\u003e表5-11\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e适应类型\u003c/th\u003e\u003cth\u003e具体变化\u003c/th\u003e\u003cth\u003e训练效果\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e毛细血管密度\u003c/td\u003e\u003ctd\u003e密度增加\u003c/td\u003e\u003ctd\u003e氧气交换效率增加\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e线粒体\u003c/td\u003e\u003ctd\u003e数量↑ + 体积↑（发电厂扩建）\u003c/td\u003e\u003ctd\u003e氧化供能效率增强\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e糖原储存\u003c/td\u003e\u003ctd\u003e肌肉糖原库更大（油箱变大）\u003c/td\u003e\u003ctd\u003e运动表现，耐力提升\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 毛细血管↑ = 物流网点加密\u003c/p\u003e\n\u003cp\u003e● 线粒体↑ = 发电厂扩容\u003c/p\u003e\n\u003cp\u003e● 糖原↑ = 油箱加大\u003c/p\u003e\n\u003ch4 id=\"ch5-s243\"\u003e3.5 稳态和间歇性运动的生理适应\u003c/h4\u003e\n\u003cp\u003e稳态训练和高强度间歇训练都可用于改善心肺适能，但所需恢复、耐受性和适用人群不同。应先根据客户的健康筛查、当前体能和训练经验选择方式，再循序渐进地提高刺激。\u003c/p\u003e\n\u003cp\u003eHIIT vs 稳态训练：\u003c/p\u003e\n\u003cp\u003e表5-12\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e训练类型\u003c/th\u003e\u003cth\u003e效果\u003c/th\u003e\u003cth\u003e适用人群\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHIIT\u003c/td\u003e\u003ctd\u003e效率高、省时间\u003c/td\u003e\u003ctd\u003e体能良好者\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e稳态有氧\u003c/td\u003e\u003ctd\u003e稳定、安全\u003c/td\u003e\u003ctd\u003e所有人，尤其体弱/慢病\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● HIIT = 加倍浓缩咖啡，效果猛但需谨慎\u003c/p\u003e\n\u003cp\u003e● 稳态 =牛奶咖啡，稳定温和\u003c/p\u003e\n\u003cp\u003e&quot;HIIT虽好，新手别急，安全第一&quot;\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：为体弱客户设计训练\u003c/p\u003e\n\u003cp\u003e• 错误做法：推荐HIIT作为首选\u003c/p\u003e\n\u003cp\u003e• 正确做法：从稳态有氧开始，逐步评估后再考虑HIIT\u003c/p\u003e\n\u003cp\u003e• 常见误区：HIIT风靡不代表适合所有人\u003c/p\u003e\n\u003cp\u003e所有心肺及体能训练，必须遵循渐进超负荷原则，需循序渐进提升训练强度，不可长期维持同一负荷，亦不可骤然加量。\u003c/p\u003e\n\u003cp\u003e渐进超负荷原则：\u003c/p\u003e\n\u003cp\u003e表5-13\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e原则\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e渐进\u003c/td\u003e\u003ctd\u003e逐步增加，不可一步到位\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e超负荷\u003c/td\u003e\u003ctd\u003e强度略高于当前耐受水平\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e禁忌\u003c/td\u003e\u003ctd\u003e不可长期同一负荷（平台期）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e禁忌\u003c/td\u003e\u003ctd\u003e不可骤然加量（受伤风险）\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch5-s259\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：\u003c/p\u003e\n\u003cp\u003e• 适应是身体对运动刺激的结构性/功能性改变\u003c/p\u003e\n\u003cp\u003e• 长期适应包括：毛细血管↑、线粒体↑、糖原↑\u003c/p\u003e\n\u003cp\u003e• 渐进超负荷是心肺训练的核心原则\u003c/p\u003e\n\u003cp\u003e• 6个月左右达到训练适应平台期（个体差异较大）\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e为什么不能长期保持同一训练强度？\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● 适应 = 新刺激 → 新改变\u003c/p\u003e\n\u003cp\u003e● 无新刺激 = 无新适应 = 停止进步\u003c/p\u003e\n\u003cp\u003e● 10%法则：进阶幅度应保守，10%可作为部分情境下的参考上限，但不是适用所有客户的固定规则\u003c/p\u003e\n\u003cp\u003e● 三大适应：毛细血管↑、线粒体↑、糖原↑\u003c/p\u003e\n\u003cp\u003e● 渐进超负荷是核心原则\u003c/p\u003e\n\u003cp\u003e● 10%法则：进阶幅度应保守，10%可作为部分情境下的参考上限，但不是适用所有客户的固定规则\u003c/p\u003e\n\u003ch3 id=\"ch5-s274\"\u003e4 运动时的环境因素\u003c/h3\u003e\n\u003ch4 id=\"ch5-s275\"\u003e4.1 在高温下运动健身\u003c/h4\u003e\n\u003ch4 id=\"ch5-s276\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e运动中骨骼肌收缩会产生大量热量，身体需依靠体温调节系统维持稳态。\u003c/p\u003e\n\u003cp\u003e产热与散热平衡：\u003c/p\u003e\n\u003cp\u003e骨骼肌收缩 → 大量热量产生 → 体温升高\n                            ↓\n                    体温调节系统 → 散热\u003c/p\u003e\n\u003cp\u003e记忆技巧：运动时身体是&quot;高性能引擎&quot;，必须配套&quot;散热系统&quot;才能正常运行。\u003c/p\u003e\n\u003cp\u003e人体体温调节中枢位于大脑下丘脑；中枢感受器检测到体温升高后，下丘脑发出调节指令，使外周血管与皮肤小动脉扩张，向体表输送更多热量，同时激活小汗腺分泌汗液，通过散热途径带走体内余热。\u003c/p\u003e\n\u003cp\u003e图5-5\u003c/p\u003e\n\u003cp\u003e体温调节机制：\u003c/p\u003e\n\u003cp\u003e体温升高 → 下丘脑检测到 → 下丘脑发出指令\n                              ↓\n              ┌───────────────┼───────────────┐\n              ↓               ↓               ↓\n        外周血管扩张    皮肤小动脉扩张     汗腺分泌\n              ↓               ↓               ↓\n        更多热量输送体表   热量散发      汗液蒸发散热\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 下丘脑 = 体温的&quot;中央空调遥控器&quot;\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;热了多散热，冷了少散热，全靠下丘脑&quot;\u003c/p\u003e\n\u003cp\u003e人体热量散失有四种形式：辐射、传导、对流、蒸发。\u003c/p\u003e\n\u003cp\u003e三种散热方式：\u003c/p\u003e\n\u003cp\u003e图5-6\u003c/p\u003e\n\u003cp\u003e表5-14\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e方式\u003c/th\u003e\u003cth\u003e原理\u003c/th\u003e\u003cth\u003e日常例子\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e辐射\u003c/td\u003e\u003ctd\u003e红外线形式传递，无需物理接触\u003c/td\u003e\u003ctd\u003e太阳照射、烤火取暖\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e传导\u003c/td\u003e\u003ctd\u003e物理接触，热量由高温向低温传递\u003c/td\u003e\u003ctd\u003e冰敷、触摸冷物体\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e对流\u003c/td\u003e\u003ctd\u003e依托空气/水流传递热量\u003c/td\u003e\u003ctd\u003e风吹凉快、游泳\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 辐射 = &quot;隔空传功&quot;（无需接触）\u003c/p\u003e\n\u003cp\u003e● 传导 = &quot;贴身传输&quot;（必须接触）\u003c/p\u003e\n\u003cp\u003e● 对流 = &quot;介质传输&quot;（风/水作为媒介）\u003c/p\u003e\n\u003cp\u003e● 蒸发 = &quot;出汗降温&quot;（液态→气态带走热量，运动时主要散热方式）\u003c/p\u003e\n\u003cp\u003e热量传导至皮肤表面后，可通过蒸发散热；汗液聚集足够热量后汽化变为水蒸气，进一步降低体表温度。\u003c/p\u003e\n\u003cp\u003e蒸发散热原理：\u003c/p\u003e\n\u003cp\u003e汗液分泌 → 吸收体表热量 → 汽化(液→气) → 带走热量 → 降温\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 汗液 = 人体的&quot;天然空调&quot;，出汗即启动制冷模式\u003c/p\u003e\n\u003cp\u003e● 出汗 = 启动空调制冷模式\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;汗水一蒸发，热量全跑光&quot;\u003c/p\u003e\n\u003cp\u003e运动中体温过高，会显著加重心脏负荷、降低运动表现，甚至引发安全风险。因此运动环境需保持凉爽、通风、氧气充足。\u003c/p\u003e\n\u003cp\u003e高温运动的双重风险：\u003c/p\u003e\n\u003cp\u003e表5-15\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e风险\u003c/th\u003e\u003cth\u003e后果\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e心脏负荷↑\u003c/td\u003e\u003ctd\u003e心率代偿性升高，可能超出安全范围\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e运动表现↓\u003c/td\u003e\u003ctd\u003e疲劳提前、力量下降\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e安全风险\u003c/td\u003e\u003ctd\u003e严重时可危及生命\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 高温运动 = 给发动机同时加压又加热\u003c/p\u003e\n\u003cp\u003e● 危险等级极高\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：夏季户外训练\u003c/p\u003e\n\u003cp\u003e• 错误做法：忽视环境温度，坚持原计划训练\u003c/p\u003e\n\u003cp\u003e• 正确做法：选择凉爽时段、注重通风补水\u003c/p\u003e\n\u003cp\u003e• 常见误区：室内有空调就安全？湿度也是重要因素\u003c/p\u003e\n\u003ch4 id=\"ch5-s315\"\u003e高温相关疾病的识别与处理\u003c/h4\u003e\n\u003ch4 id=\"ch5-s316\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e高温环境下体温异常升高，会引发两类高危急症：热衰竭、中暑，二者均需立即就医处置。\u003c/p\u003e\n\u003cp\u003e高温急症的两大类型：\u003c/p\u003e\n\u003cp\u003e表5-16\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e类型\u003c/th\u003e\u003cth\u003e核心体温\u003c/th\u003e\u003cth\u003e危险性\u003c/th\u003e\u003cth\u003e紧急程度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e热衰竭\u003c/td\u003e\u003ctd\u003e&lt; 40℃\u003c/td\u003e\u003ctd\u003e高\u003c/td\u003e\u003ctd\u003e需立即处置+就医\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e中暑\u003c/td\u003e\u003ctd\u003e≥ 40℃\u003c/td\u003e\u003ctd\u003e极高\u003c/td\u003e\u003ctd\u003e危及生命+必须就医\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;衰竭40下，中暑40上&quot;\u003c/p\u003e\n\u003cp\u003e● 40℃ = 生命警戒线\u003c/p\u003e\n\u003cp\u003e● 热衰竭：体温升高但低于40℃，表现为大汗、面色苍白、皮肤湿冷；\u003c/p\u003e\n\u003cp\u003e● 中暑：核心体温超40℃，表现为身体高热无汗、皮肤干燥潮红。\u003c/p\u003e\n\u003cp\u003e热衰竭 vs 中暑 鉴别表：\u003c/p\u003e\n\u003cp\u003e表5-17\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e症状\u003c/th\u003e\u003cth\u003e热衰竭\u003c/th\u003e\u003cth\u003e中暑\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心体温\u003c/td\u003e\u003ctd\u003e&lt; 40℃\u003c/td\u003e\u003ctd\u003e≥ 40℃\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e出汗\u003c/td\u003e\u003ctd\u003e大汗淋漓\u003c/td\u003e\u003ctd\u003e无汗（高热无汗）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e皮肤\u003c/td\u003e\u003ctd\u003e湿冷、苍白\u003c/td\u003e\u003ctd\u003e干燥、潮红\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e意识\u003c/td\u003e\u003ctd\u003e可能清醒\u003c/td\u003e\u003ctd\u003e可能意识障碍\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e处理\u003c/td\u003e\u003ctd\u003e降温+补液\u003c/td\u003e\u003ctd\u003e立即物理降温+急救\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 热衰竭 = &quot;出汗过多+水分流失&quot; → 皮肤湿冷\u003c/p\u003e\n\u003cp\u003e● 中暑 = &quot;散热系统崩溃&quot; → 无汗、干燥、高热\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;热衰竭会出汗，中暑反而干&quot;\u003c/p\u003e\n\u003cp\u003e现场急救流程：\u003c/p\u003e\n\u003cp\u003e1. 立即转移至阴凉通风处；\u003c/p\u003e\n\u003cp\u003e2. 热衰竭：抬高下肢，适量补充水分电解质；\u003c/p\u003e\n\u003cp\u003e3. 中暑：脱去多余衣物，用湿毛巾、冰袋、风扇等全力物理降温；\u003c/p\u003e\n\u003cp\u003e4. 无论热衰竭还是中暑，现场急救同时必须拨打急救电话。\u003c/p\u003e\n\u003cp\u003e高温急症急救流程：\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 热衰竭处理：补液为主（水分流失）\u003c/p\u003e\n\u003cp\u003e● 中暑处理：降温为主（散热崩溃）\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;衰竭补液，中暑降温，两者都打120&quot;\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：训练中客户出现中暑迹象\u003c/p\u003e\n\u003cp\u003e• 错误做法：让客户继续运动&quot;出出汗就好了&quot;\u003c/p\u003e\n\u003cp\u003e• 正确做法：立即停止训练，按流程急救\u003c/p\u003e\n\u003cp\u003e• 常见误区：以为降温就是给头部冰敷，应该全身降温\u003c/p\u003e\n\u003cp\u003e高温运动预防原则：\u003c/p\u003e\n\u003cp\u003e1. 高温环境运动前，设置9～14天热适应期；\u003c/p\u003e\n\u003cp\u003e2. 穿着透气通风运动服饰；\u003c/p\u003e\n\u003cp\u003e3. 遵循科学补水方案。\u003c/p\u003e\n\u003cp\u003e高温运动三大防线：\u003c/p\u003e\n\u003cp\u003e表5-18\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e防线\u003c/th\u003e\u003cth\u003e具体措施\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e热适应\u003c/td\u003e\u003ctd\u003e运动前9-14天热适应训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e装备\u003c/td\u003e\u003ctd\u003e透气、通风、浅色服装\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e补水\u003c/td\u003e\u003ctd\u003e运动前/中/后科学补水\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;热适应要9到14天，穿透气补水分&quot;\u003c/p\u003e\n\u003cp\u003e运动补水标准：\u003c/p\u003e\n\u003cp\u003e1. 运动前至少4小时：每公斤体重补充5～7ml水分；\u003c/p\u003e\n\u003cp\u003e2. 运动中：依据实时体重流失量分次补水；\u003c/p\u003e\n\u003cp\u003e3. 运动后：每丢失1kg体重，补充1.5L水分。\u003c/p\u003e\n\u003cp\u003e科学补水时间表：\u003c/p\u003e\n\u003cp\u003e表5-19\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e时机\u003c/th\u003e\u003cth\u003e补水量\u003c/th\u003e\u003cth\u003e原则\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e运动前4小时\u003c/td\u003e\u003ctd\u003e5-7ml/kg\u003c/td\u003e\u003ctd\u003e提前储备\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e运动中\u003c/td\u003e\u003ctd\u003e视体重流失\u003c/td\u003e\u003ctd\u003e分次少量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e运动后\u003c/td\u003e\u003ctd\u003e1.5L/kg\u003c/td\u003e\u003ctd\u003e重度回血\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 运动前 = &quot;提前给油箱加油&quot;\u003c/p\u003e\n\u003cp\u003e● 运动中 = &quot;边跑边补，别等没油&quot;\u003c/p\u003e\n\u003cp\u003e● 运动后 = &quot;满油箱才安全&quot;\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;前5-7ml、中分次、后1.5L&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s365\"\u003e4.2 在低温下运动健身\u003c/h4\u003e\n\u003ch4 id=\"ch5-s366\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e空气与水是主要寒冷刺激源；低温会引发血管收缩，升高外周血管阻力与血压，对高血压、心脏病人群风险较高。\u003c/p\u003e\n\u003cp\u003e低温对心血管的影响：\u003c/p\u003e\n\u003cp\u003e低温 → 血管收缩 → 外周阻力↑ → 血压↑ → 心脏负荷↑\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 低温 = 血管&quot;热胀冷缩&quot;\u003c/p\u003e\n\u003cp\u003e● 收缩的血管 = 更窄的通道 = 更高血压\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：寒冷天气户外运动\u003c/p\u003e\n\u003cp\u003e• 错误做法：忽略低温对高血压/心脏病人群的风险\u003c/p\u003e\n\u003cp\u003e• 正确做法：评估客户病史，寒冷天气减少户外训练\u003c/p\u003e\n\u003cp\u003e• 常见误区：以为室内运动就不需要注意温度\u003c/p\u003e\n\u003cp\u003e运动后体表带汗，会加速身体热量散失，极易受凉，该风险多见于户外运动，常规室内健身房影响较小。\u003c/p\u003e\n\u003cp\u003e出汗后受凉风险：\u003c/p\u003e\n\u003cp\u003e表5-20\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e环境\u003c/th\u003e\u003cth\u003e风险\u003c/th\u003e\u003cth\u003e应对\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e户外\u003c/td\u003e\u003ctd\u003e高（汗水带走大量热量）\u003c/td\u003e\u003ctd\u003e及时擦干、保暖\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e室内\u003c/td\u003e\u003ctd\u003e低\u003c/td\u003e\u003ctd\u003e正常即可\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 汗水 = 移动的&quot;散热器&quot;\u003c/p\u003e\n\u003cp\u003e● 运动后带汗在冷风中 = 持续失温\u003c/p\u003e\n\u003ch4 id=\"ch5-s384\"\u003e4.3 在高海拔地区运动健身\u003c/h4\u003e\n\u003ch4 id=\"ch5-s385\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e海拔分级标准：\u003c/p\u003e\n\u003cp\u003e● 中高海拔：1500～2500m\u003c/p\u003e\n\u003cp\u003e● 高海拔：2500～4300m\u003c/p\u003e\n\u003cp\u003e海拔分级表：\u003c/p\u003e\n\u003cp\u003e表5-21\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e分级\u003c/th\u003e\u003cth\u003e海拔范围\u003c/th\u003e\u003cth\u003e风险等级\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e中高海拔\u003c/td\u003e\u003ctd\u003e1500-2500m\u003c/td\u003e\u003ctd\u003e中等\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e高海拔\u003c/td\u003e\u003ctd\u003e2500-4300m\u003c/td\u003e\u003ctd\u003e高\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;1500到2500中高，2500以上算高危&quot;\u003c/p\u003e\n\u003cp\u003e高海拔易诱发高原反应，训练遵循原则：\u003c/p\u003e\n\u003cp\u003e1. 抵达高海拔首日，不安排任何训练；\u003c/p\u003e\n\u003cp\u003e2. 适当延长热身与放松整理时长；\u003c/p\u003e\n\u003cp\u003e3. 全程密切监测身体不适反应。\u003c/p\u003e\n\u003cp\u003e高海拔运动三原则：\u003c/p\u003e\n\u003cp\u003e表5-22\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e原则\u003c/th\u003e\u003cth\u003e具体做法\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e首日休息\u003c/td\u003e\u003ctd\u003e抵达当天绝对禁止训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e延长热身\u003c/td\u003e\u003ctd\u003e热身+放松时间加倍\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e监测反应\u003c/td\u003e\u003ctd\u003e密切观察不适症状\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;首日休息保平安，热身延长防意外&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s401\"\u003e4.4 在空气污染环境运动健身\u003c/h4\u003e\n\u003ch4 id=\"ch5-s402\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e空气污染可诱发心血管人群心肌缺血、心绞痛发作；可诱发哮喘人群气道炎症与病情急性发作。\u003c/p\u003e\n\u003cp\u003e空气污染的双重威胁：\u003c/p\u003e\n\u003cp\u003e表5-23\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e人群\u003c/th\u003e\u003cth\u003e风险\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e心血管人群\u003c/td\u003e\u003ctd\u003e心肌缺血、心绞痛\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e哮喘人群\u003c/td\u003e\u003ctd\u003e气道炎症、急性发作\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 污染空气 = 呼吸系统的&quot;毒药&quot;\u003c/p\u003e\n\u003cp\u003e● 心肺问题人群 = 高危易感人群\u003c/p\u003e\n\u003cp\u003e需特别注意室内隐蔽污染：室内溜冰场丙烷燃料制冰机，易残留高浓度污染物，即便室内运动，也需关注空气质量，规避污染环境训练。\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;室内不等于安全，空气质量要关注&quot;\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：为客户选择训练场所\u003c/p\u003e\n\u003cp\u003e• 错误做法：只关注健身房设备，忽视空气质量\u003c/p\u003e\n\u003cp\u003e• 正确做法：检查通风系统，避免污染环境\u003c/p\u003e\n\u003cp\u003e• 常见误区：认为室内=安全，室外=危险\u003c/p\u003e\n\u003ch4 id=\"ch5-s417\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：\u003c/p\u003e\n\u003cp\u003e• 环境因素（温度、海拔、污染）直接影响心肺运动安全\u003c/p\u003e\n\u003cp\u003e• 高温防中暑（热衰竭&lt;40℃ vs 中暑≥40℃）\u003c/p\u003e\n\u003cp\u003e• 低温防血管收缩，高血压/心脏病人群风险高\u003c/p\u003e\n\u003cp\u003e• 高海拔首日必须休息，9-14天热适应\u003c/p\u003e\n\u003cp\u003e• 空气污染对心肺疾病人群威胁极大\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e客户在高温环境下运动时出现大汗、面色苍白、皮肤湿冷，应如何判断和处理？\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● 热衰竭：&lt;40℃、大汗、湿冷 → 补液+降温+120\u003c/p\u003e\n\u003cp\u003e● 中暑：≥40℃、无汗、干燥 → 全力降温+120\u003c/p\u003e\n\u003cp\u003e● 高海拔首日：禁止训练\u003c/p\u003e\n\u003cp\u003e● 低温：防血管收缩，高血压/心脏病人群风险高\u003c/p\u003e\n\u003cp\u003e● 运动补水：运动前前5-7ml/kg，运动后根据减少的体重补水，每减少1kg体重，补充1.5L\u003c/p\u003e\n\u003ch3 id=\"ch5-s432\"\u003e5 出于健康和健身目的的心肺运动一般指南\u003c/h3\u003e\n\u003ch4 id=\"ch5-s433\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e首先第一部分，先讲大众心肺运动通用指南，这套指南专门针对18-64岁成年人，先记两个核心重点知识点：\u003c/p\u003e\n\u003cp\u003e1. 每周至少完成150分钟中等强度心肺训练，才能对身体健康产生明确益处；\u003c/p\u003e\n\u003cp\u003e2. 坚持身体活动带来的健康收益，远大于运动受伤、突发风险的可能性。\u003c/p\u003e\n\u003cp\u003e两大核心结论：&quot;每周150分钟，动比不动强&quot;\u003c/p\u003e\n\u003cp\u003e表5-24\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e结论\u003c/th\u003e\u003cth\u003e核心信息\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e最低标准\u003c/td\u003e\u003ctd\u003e每周150分钟中等强度（底线）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e收益对比\u003c/td\u003e\u003ctd\u003e运动收益 &gt;&gt; 运动风险\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e很多人会有顾虑：平时久坐不动，突然开始运动，会不会出现猝死、受伤的情况？其实不必因此拒绝所有运动。依据2018年美国居民身体活动指南（美国公共卫生与公众服务部发布），可以帮助客户更客观地理解运动的获益与风险。\u003c/p\u003e\n\u003ch4 id=\"ch5-s440\"\u003e一、心肺运动具体建议\u003c/h4\u003e\n\u003ch4 id=\"ch5-s441\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e1. 任何活动量，都比完全不运动要好；尽量减少每日久坐时长，把碎片化活动均匀分布在一整天当中。\u003c/p\u003e\n\u003cp\u003e运动理念：\u003c/p\u003e\n\u003cp\u003e● 动一点比不动强\u003c/p\u003e\n\u003cp\u003e● 碎片化活动积少成多\u003c/p\u003e\n\u003cp\u003e● 均匀分布全天，避免长时间久坐\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;动总比坐强，碎片也能量&quot;\u003c/p\u003e\n\u003cp\u003e2. 每周运动标准：\u003c/p\u003e\n\u003cp\u003e● 150~300分钟中等强度心肺训练；\u003c/p\u003e\n\u003cp\u003e● 或75~150分钟高强度心肺训练；\u003c/p\u003e\n\u003cp\u003e● 也可以中等+高强度两者结合；\u003c/p\u003e\n\u003cp\u003e若运动总量超出以上标准，还能获得额外健康收益。\u003c/p\u003e\n\u003cp\u003e每周运动标准表：\u003c/p\u003e\n\u003cp\u003e表5-25\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e强度\u003c/th\u003e\u003cth\u003e时间范围\u003c/th\u003e\u003cth\u003e特点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e中等强度\u003c/td\u003e\u003ctd\u003e150-300分钟\u003c/td\u003e\u003ctd\u003e门槛低、易坚持\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e高强度\u003c/td\u003e\u003ctd\u003e75-150分钟\u003c/td\u003e\u003ctd\u003e效率高、需体能\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e混合强度\u003c/td\u003e\u003ctd\u003e灵活组合\u003c/td\u003e\u003ctd\u003e最灵活\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e超标\u003c/td\u003e\u003ctd\u003e更多\u003c/td\u003e\u003ctd\u003e额外收益\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 中等强度 = 150-300分钟\u003c/p\u003e\n\u003cp\u003e● 高强度 = 75-150分钟\u003c/p\u003e\n\u003cp\u003e● 换算关系：1分钟高强度 ≈ 2分钟中等强度\u003c/p\u003e\n\u003cp\u003e3. 每周至少安排2天，进行覆盖全身主要肌群的力量强化训练。\u003c/p\u003e\n\u003cp\u003e力量训练要求：\u003c/p\u003e\n\u003cp\u003e表5-26\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e要求\u003c/th\u003e\u003cth\u003e具体\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e每周≥2天\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e覆盖\u003c/td\u003e\u003ctd\u003e全身主要肌群\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 心肺训练 + 力量训练 = 完整健身方案\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;心肺每周150，力量两日起&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s466\"\u003e二、心肺训练核心框架：FITTVP原则\u003c/h4\u003e\n\u003ch4 id=\"ch5-s467\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e分别代表：F频率、I强度、T时长、T运动类型、V运动量、P进阶。\u003c/p\u003e\n\u003cp\u003e图5-7\u003c/p\u003e\n\u003cp\u003eFITTVP六大要素：\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;频强时类量进阶，七字真言记心间&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s473\"\u003e5.1 频率\u003c/h4\u003e\n\u003cp\u003e● 每周≥5天中等强度运动；\u003c/p\u003e\n\u003cp\u003e● 或每周≥3天高强度运动；\u003c/p\u003e\n\u003cp\u003e● 也可3~5天进行中高强度混合训练。\u003c/p\u003e\n\u003cp\u003e运动频率标准：\u003c/p\u003e\n\u003cp\u003e表5-27\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e强度\u003c/th\u003e\u003cth\u003e最低频率\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e中等强度\u003c/td\u003e\u003ctd\u003e≥5天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e高强度\u003c/td\u003e\u003ctd\u003e≥3天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e混合\u003c/td\u003e\u003ctd\u003e3-5天/周\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;中等5天起，高强3天行&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s481\"\u003e5.3 持续时间\u003c/h4\u003e\n\u003cp\u003e● 普通成年人：每天30~60分钟中等强度，或20~60分钟高强度；\u003c/p\u003e\n\u003cp\u003e● 起步运动量：每周500~1000 MET-min（代谢当量·分钟），日常步数先达到每天≥2000步，循序渐进进阶到每天≥7000步，健康价值极高；\u003c/p\u003e\n\u003cp\u003e● 单次运动建议持续10分钟以上；零基础、体能偏弱人群，从小于10分钟的短时运动开始，也有健康获益，只要动起来就比久坐好；\u003c/p\u003e\n\u003cp\u003e● 运动进阶必须循序渐进，不可贸然加量。\u003c/p\u003e\n\u003cp\u003e运动时长标准：\u003c/p\u003e\n\u003cp\u003e表5-28\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e人群\u003c/th\u003e\u003cth\u003e单次时长\u003c/th\u003e\u003cth\u003e强度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e普通成人\u003c/td\u003e\u003ctd\u003e30-60分钟\u003c/td\u003e\u003ctd\u003e中等\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e普通成人\u003c/td\u003e\u003ctd\u003e20-60分钟\u003c/td\u003e\u003ctd\u003e高强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e零基础\u003c/td\u003e\u003ctd\u003e&lt;10分钟\u003c/td\u003e\u003ctd\u003e安全为前提\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e表5-29\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e步数目标\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2000步/天\u003c/td\u003e\u003ctd\u003e起步目标\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7000步/天\u003c/td\u003e\u003ctd\u003e高健康价值目标\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;中等3060，高强2060，零基础动就够&quot;\u003c/p\u003e\n\u003cp\u003e● 步数口诀：&quot;起步2000，健康7000&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s492\"\u003e5.2 强度\u003c/h4\u003e\n\u003ch4 id=\"ch5-s493\"\u003e3.1 心率判定\u003c/h4\u003e\n\u003cp\u003e传统公式：最大心率=220-年龄，这个公式存在±12BPM误差，精准度不高，后续会给到更精准的估算公式。\u003c/p\u003e\n\u003cp\u003e● 储备心率：最大心率 − 静息心率；\u003c/p\u003e\n\u003cp\u003e● 靶心率（目标心率）：储备心率×目标强度（如60%） + 静息心率；\u003c/p\u003e\n\u003cp\u003e按照60%~89%的强度区间，就能算出个人训练的目标心率区间。\u003c/p\u003e\n\u003cp\u003e心率相关公式：\u003c/p\u003e\n\u003cp\u003e1. 最大心率估算公式\u003c/p\u003e\n\u003cp\u003e传统公式：最大心率（MHR）= 220 - 年龄 （误差±12BPM）\nTanaka公式①：最大心率（MHR）= 208 - 0.7 × 年龄 （Tanaka公式，误差±7-8BPM）\nGellish公式②：最大心率（MHR）= 207 - 0.7 × 年龄 （Gellish公式，适用于常运动人群）\u003c/p\u003e\n\u003cp\u003e三个公式对比：220-年龄简单好记但误差大；Tanaka公式和Gellish公式都是基于人群数据建立的最大心率估算方法。所有年龄预测公式都存在个体误差，应使用ACE指定的方法，并结合RPE、谈话测试和客户的实际反应判断强度。\u003c/p\u003e\n\u003cp\u003e2. 储备心率与靶心率公式\u003c/p\u003e\n\u003cp\u003e储备心率（HRR）= 最大心率 - 静息心率\n靶心率 = 储备心率 × 目标强度% + 静息心率\u003c/p\u003e\n\u003cp\u003e示例计算（35岁，静息心率72BPM）：\u003c/p\u003e\n\u003cp\u003e表5-30\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e公式\u003c/th\u003e\u003cth\u003e最大心率\u003c/th\u003e\u003cth\u003e储备心率\u003c/th\u003e\u003cth\u003e60%强度靶心率\u003c/th\u003e\u003cth\u003e80%强度靶心率\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e传统220-年龄\u003c/td\u003e\u003ctd\u003e185 BPM\u003c/td\u003e\u003ctd\u003e113 BPM\u003c/td\u003e\u003ctd\u003e140 BPM\u003c/td\u003e\u003ctd\u003e162 BPM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTanaka公式\u003c/td\u003e\u003ctd\u003e183.5 BPM\u003c/td\u003e\u003ctd\u003e111.5 BPM\u003c/td\u003e\u003ctd\u003e139 BPM\u003c/td\u003e\u003ctd\u003e161 BPM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGellish公式\u003c/td\u003e\u003ctd\u003e182.5 BPM\u003c/td\u003e\u003ctd\u003e110.5 BPM\u003c/td\u003e\u003ctd\u003e138 BPM\u003c/td\u003e\u003ctd\u003e160 BPM\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;220减年龄，储备心率减静息，目标心率加回去&quot;\u003c/p\u003e\n\u003cp\u003e● 类比：靶心率 = 保险箱密码，需要三步计算\u003c/p\u003e\n\u003cp\u003e● 靶心率计算：\u003c/p\u003e\n\u003cp\u003e● ①计算最大心率\u003c/p\u003e\n\u003cp\u003e● ②最大心率-静息心率=储备心率\u003c/p\u003e\n\u003cp\u003e● ③储备心率×强度%+静息心率=靶心率\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：为客户计算靶心率\u003c/p\u003e\n\u003cp\u003e• 错误做法：直接用&quot;220-年龄&quot;作为靶心率上限\u003c/p\u003e\n\u003cp\u003e• 正确做法：使用储备心率法，考虑静息心率差异\u003c/p\u003e\n\u003cp\u003e• 常见误区：忽视±12BPM误差，靶心率应该是区间而非固定值\u003c/p\u003e\n\u003ch4 id=\"ch5-s518\"\u003e3.2 RPE 自觉用力程度\u003c/h4\u003e\n\u003cp\u003e图5-8\u003c/p\u003e\n\u003cp\u003e分两种量表：\u003c/p\u003e\n\u003cp\u003e1. 经典博格量表 6~20分：数值×10可近似对应当下心率，6分对应静息、20分对应极限心率，但需要对照心率参考，繁琐且不够精准；\u003c/p\u003e\n\u003cp\u003e2. 0~10分量表：0分完全不吃力，10分力竭极限。\u003c/p\u003e\n\u003cp\u003eRPE量表对比：\u003c/p\u003e\n\u003cp\u003e表5-31\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e量表\u003c/th\u003e\u003cth\u003e范围\u003c/th\u003e\u003cth\u003e低强度\u003c/th\u003e\u003cth\u003e中等强度\u003c/th\u003e\u003cth\u003e高强度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e博格6-20\u003c/td\u003e\u003ctd\u003e6-20\u003c/td\u003e\u003ctd\u003e9-11\u003c/td\u003e\u003ctd\u003e12-13\u003c/td\u003e\u003ctd\u003e14-20\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e0-10\u003c/td\u003e\u003ctd\u003e0-10\u003c/td\u003e\u003ctd\u003e3-4\u003c/td\u003e\u003ctd\u003e5-6\u003c/td\u003e\u003ctd\u003e7-10\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003eRPE的局限性：\u003c/p\u003e\n\u003cp\u003e新手容易低估运动强度；力量训练爱好者容易只关注肌肉酸胀，忽略呼吸频率，同样会低估心肺强度；部分肌肉发达人群做骑行、爬坡时，腿部无明显发力感，但呼吸已超负荷，极易误判强度。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户说&quot;RPE只有6，很轻松&quot;\u003c/p\u003e\n\u003cp\u003e• 错误做法：完全相信RPE，不做调整\u003c/p\u003e\n\u003cp\u003e• 正确做法：结合谈话测试、心率综合判断\u003c/p\u003e\n\u003cp\u003e• 常见误区：把RPE当作唯一标准\u003c/p\u003e\n\u003ch4 id=\"ch5-s532\"\u003e3.3 VO₂Max最大摄氧量 &amp; 摄氧量储备\u003c/h4\u003e\n\u003cp\u003e摄氧量储备和心率储备逻辑一致；最大摄氧量可专业测试估算，但跑步机、扶手助力类器械测试结果误差较大。\u003c/p\u003e\n\u003cp\u003e专业测试注意（需与主人确认）：\u003c/p\u003e\n\u003cp\u003e● 最大摄氧量需要专业设备测量\u003c/p\u003e\n\u003cp\u003e● 跑步机测试误差较大\u003c/p\u003e\n\u003cp\u003e● 扶手助力会虚高结果\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● VO₂max = 心肺功能的&quot;马力&quot;指标\u003c/p\u003e\n\u003ch4 id=\"ch5-s540\"\u003e3.4 MET 代谢当量（梅托）\u003c/h4\u003e\n\u003cp\u003e图5-9\u003c/p\u003e\n\u003cp\u003e1MET = 人体完全静息状态下的氧气消耗量。\u003c/p\u003e\n\u003cp\u003e强度划分标准：\u003c/p\u003e\n\u003cp\u003e● ＜3MET：低强度；\u003c/p\u003e\n\u003cp\u003e● 3~5.9MET：中等强度；\u003c/p\u003e\n\u003cp\u003e● ≥6MET：高强度。\u003c/p\u003e\n\u003cp\u003eMET强度分级：\u003c/p\u003e\n\u003cp\u003e表5-32\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003eMET值\u003c/th\u003e\u003cth\u003e强度\u003c/th\u003e\u003cth\u003e举例\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e&lt;3\u003c/td\u003e\u003ctd\u003e低强度\u003c/td\u003e\u003ctd\u003e慢走、站立\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3-5.9\u003c/td\u003e\u003ctd\u003e中等强度\u003c/td\u003e\u003ctd\u003e快走、骑行\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e≥6\u003c/td\u003e\u003ctd\u003e高强度\u003c/td\u003e\u003ctd\u003e跑步、游泳\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● MET = 静息代谢的倍数\u003c/p\u003e\n\u003cp\u003e● 3MET = 3倍静息代谢\u003c/p\u003e\n\u003cp\u003e● &quot;3以下是低，3到6中等，6以上高强度&quot;\u003c/p\u003e\n\u003cp\u003eMET实用价值：\u003c/p\u003e\n\u003cp\u003e可以对照表格替换运动方式，比如没时间跑步机快走（5MET），可以用修剪草坪、搬运木材、打网球、羽毛球、投篮等同等MET值的活动替代。\u003c/p\u003e\n\u003cp\u003e同时可通过MET精准计算热量消耗：体重(kg)×MET值×3.5×时间（分钟），换算氧气消耗后，除以1000（从毫升换成升）再乘以系数5，即可得出卡路里消耗；健身房有氧器械显示的MET值，可直接用来给会员计算热量。\u003c/p\u003e\n\u003cp\u003e图5-10\u003c/p\u003e\n\u003cp\u003eMET热量计算公式：\u003c/p\u003e\n\u003cp\u003e热量消耗（kcal）≈ MET × 3.5 × 体重（kg）÷ 200 × 时间（分钟）\u003c/p\u003e\n\u003cp\u003e示例：\u003c/p\u003e\n\u003cp\u003e● 70kg客户，快走30分钟（5MET）\u003c/p\u003e\n\u003cp\u003e5 × 3.5 × 70 ÷200 ×30\n= 183.75 kcal\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：“MET乘体重乘时间，再乘0.0175。”\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户没时间跑步\u003c/p\u003e\n\u003cp\u003e• 错误做法：坚持必须跑步\u003c/p\u003e\n\u003cp\u003e• 正确做法：用同等MET值的活动替代（如修剪草坪、打网球）\u003c/p\u003e\n\u003cp\u003e• 常见误区：忽略MET替代原则\u003c/p\u003e\n\u003ch4 id=\"ch5-s569\"\u003e3.5 换气阈值 VT1、VT2\u003c/h4\u003e\n\u003cp\u003e是运动强度的两个关键转折点，划分三个训练区间：\u003c/p\u003e\n\u003cp\u003e● 低于VT1：低强度，脂肪主导供能，体内酸性物质堆积少，呼吸平稳；\u003c/p\u003e\n\u003cp\u003e● VT1~VT2：中高强度，糖分开始大量参与供能，代谢酸性物质逐渐堆积，呼吸微微急促；\u003c/p\u003e\n\u003cp\u003e● 高于VT2：极高强度，酸性物质堆积速度远超身体清除速度，呼吸急促、喘不上气。\u003c/p\u003e\n\u003cp\u003e也是IFT训练模式三区划分的核心依据。\u003c/p\u003e\n\u003cp\u003eVT1/VT2三区间模型：\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 帮助理解：&quot;VT1以下是轻松区，VT1-VT2是延展区，VT2以上是“恐慌区\u003c/p\u003e\n\u003ch4 id=\"ch5-s578\"\u003e三、运动强度的6种判定方式（综合表格）\u003c/h4\u003e\n\u003cp\u003e表5-33\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e强度指标\u003c/th\u003e\u003cth\u003e第1区（低度）\u003c/th\u003e\u003cth\u003e第2区（中度）\u003c/th\u003e\u003cth\u003e第3区（高度/接近极限/极限）\u003c/th\u003e\u003cth\u003e优点/限制\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e代谢指标：VT1 和 VT2（HR 相对于 VT1 和 VT2）\u003c/td\u003e\u003ctd\u003e低于 VT1（HR &lt; VT1）\u003c/td\u003e\u003ctd\u003eVT1 至略低于 VT2（HR ≥VT1 至 &lt; VT2）\u003c/td\u003e\u003ctd\u003eVT2 及以上（HR ≥VT2）\u003c/td\u003e\u003ctd\u003e• 基于 VT1 和 VT2 测量值 • 理想情况下，在实验室利用代谢车和血乳酸测量 VT1 和 VT2 • 现场评估相对易于进行，仅需要极少设备，并可提供精确的相应 VT1 和 VT2 HR • 通过利用代谢指标制定计划，可进行个性化计划制定\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e谈话测试\u003c/td\u003e\u003ctd\u003e可以舒适地谈话；可以说话但不可以唱歌\u003c/td\u003e\u003ctd\u003e不确定谈话时是否舒适；暂停呼吸才能说出几个词\u003c/td\u003e\u003ctd\u003e绝对不能舒适地谈话\u003c/td\u003e\u003ctd\u003e• 基于对增加的运动强度的生理适应所致的实际通气变化 • 实际测量非常容易 • 无需设备 • 可以轻松地教给客户 • 可进行个性化计划制定\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRPE（术语）\u003c/td\u003e\u003ctd\u003e极弱至轻松\u003c/td\u003e\u003ctd\u003e&quot;中等&quot;至&quot;有点费力&quot;\u003c/td\u003e\u003ctd\u003e&quot;费力&quot;至&quot;非常费力&quot;\u003c/td\u003e\u003ctd\u003e&quot;非常费力至极其费力至极限&quot; • 良好的主观强度指标 • 与谈话测试、代谢指标和 %V̇O₂max 测量值的相关性良好 • 易于教给客户\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRPE（0 至 10 分量表）\u003c/td\u003e\u003ctd\u003e0.5 至 2\u003c/td\u003e\u003ctd\u003e3 至 4\u003c/td\u003e\u003ctd\u003e5 至 6\u003c/td\u003e\u003ctd\u003e7 至 10 • 良好的主观强度指标 • 与谈话测试、代谢指标和 %V̇O₂max 测量值的相关性良好 • 0 至 10 分量表易于教给客户\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRPE（6 至 20 分量表）\u003c/td\u003e\u003ctd\u003e9 至 11\u003c/td\u003e\u003ctd\u003e12 至 13\u003c/td\u003e\u003ctd\u003e14 至 17\u003c/td\u003e\u003ctd\u003e≥18 • 良好的主观强度指标 • 与谈话测试、代谢指标和 %V̇O₂max 测量值的相关性良好 • 6 至 20 分量表不如 0 至 10 分量表易于教给客户 • 注释：RPE 为 20 表示最大力度，不可持续进行此训练强度。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e%V̇O₂R\u003c/td\u003e\u003ctd\u003e30 至 39%\u003c/td\u003e\u003ctd\u003e40 至 59%\u003c/td\u003e\u003ctd\u003e60 至 89%\u003c/td\u003e\u003ctd\u003e≥90% • 需要 V̇O₂max 测量值，以最精确地制定计划 • 由于评估设备较为昂贵，因此不切实际 • 使用 V̇O₂max 预测值或 MHR 预测值导致误差增加 • 计划制定的相对百分比基于人群，而不是特定于个人\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e%HRR\u003c/td\u003e\u003ctd\u003e30 至 39%\u003c/td\u003e\u003ctd\u003e40 至 59%\u003c/td\u003e\u003ctd\u003e60 至 89%\u003c/td\u003e\u003ctd\u003e≥90% • 需要 MHR 和 RHR 测量值，以最精确地制定计划 • 对绝大多数教练和客户来说，MHR 测量都不切实际 • 相对于严格的 %MHR，使用 RHR 会增加计划制定的个性化 • 使用 MHR 预测值可能会引入较大的误差；误差大小取决于所使用的具体公式 • 计划制定的相对百分比基于人群，而不是特定于个人\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e%MHR\u003c/td\u003e\u003ctd\u003e57 至 63%\u003c/td\u003e\u003ctd\u003e64 至 76%\u003c/td\u003e\u003ctd\u003e77 至 95%\u003c/td\u003e\u003ctd\u003e≥96% • 需要 MHR 测量值，以精确地制定计划 • 对绝大多数教练和客户来说，MHR 测量都不切实际 • 使用 MHR 预测值可能会引入较大的误差；误差大小取决于所使用的具体公式 • 不包括 RHR，如 %HRR 中使用的那样 • 计划制定的相对百分比基于人群，而不是特定于个人\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMET\u003c/td\u003e\u003ctd\u003e2 至 2.9\u003c/td\u003e\u003ctd\u003e3 至 5.9\u003c/td\u003e\u003ctd\u003e6 至 8.7\u003c/td\u003e\u003ctd\u003e≥8.8 • 需要 V̇O₂max 测量值，以最精确地制定计划 • 与基于 V̇O₂max 的其他强度指标相比，更易于用于计划制定 • 由于对给定活动的 MET 和/或得出 MET 估计值的设备的了解而使计划制定受限 • 用于计划制定的相对 MET 范围是基于人群的范围，而不是特定于个人的范围（例如，先前久坐少动的客户最初可能感觉 5-MET 活动为剧烈运动）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e%V̇O₂max\u003c/td\u003e\u003ctd\u003e37 至 45%\u003c/td\u003e\u003ctd\u003e46 至 63%\u003c/td\u003e\u003ctd\u003e64 至 90%\u003c/td\u003e\u003ctd\u003e≥91% • 参见 %V̇O₂R • 实际测量是个性化的，并非基于预测\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch5-s580\"\u003e四、大众心肺训练时长&amp;核心原则\u003c/h4\u003e\n\u003ch4 id=\"ch5-s581\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e1. 永远遵循：练就比不练好；以客户自身需求、体能耐受度、运动可持续性为核心，不一刀切；\u003c/p\u003e\n\u003cp\u003e2. 运动量可一次性完成、分段完成、累计完成，均有健康价值；\u003c/p\u003e\n\u003cp\u003e3. 热量消耗标准：每周消耗1000大卡，即可改善血压、胆固醇等基础健康指标；每周≥2000大卡，健康收益翻倍；\u003c/p\u003e\n\u003cp\u003e4. 进阶增量原则：每周总运动时长，最多在上周基础上增加10%，切忌激进加量；\u003c/p\u003e\n\u003cp\u003e5. 高强度循环训练、间歇训练，均可计入每日/每周心肺活动总量。\u003c/p\u003e\n\u003cp\u003e心肺训练五大原则：\u003c/p\u003e\n\u003cp\u003e表5-34\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e原则\u003c/th\u003e\u003cth\u003e核心内容\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e态度原则\u003c/td\u003e\u003ctd\u003e练比不练好，个性化不一刀切\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e累积原则\u003c/td\u003e\u003ctd\u003e一次性/分段/累计均可\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e热量原则\u003c/td\u003e\u003ctd\u003e1000大卡/周=基础收益，2000大卡/周=翻倍收益\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e进阶原则\u003c/td\u003e\u003ctd\u003e每周增量≤10%\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e计数原则\u003c/td\u003e\u003ctd\u003eHIIT/循环可计入总量\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;练就好、累积算、热量翻、10%增、HIIT算&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s591\"\u003e5.4 类型\u003c/h4\u003e\n\u003ch4 id=\"ch5-s592\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e只要满足大肌群参与、有节奏、可持续数分钟以上，都属于心肺训练：\u003c/p\u003e\n\u003cp\u003e1. 常规类：走路、跑步、骑行、划船、游泳、爬楼梯、椭圆机；\u003c/p\u003e\n\u003cp\u003e2. 球类：网球、羽毛球（单打跑动更多，心肺训练效果优于双打）；\u003c/p\u003e\n\u003cp\u003e3. 器械类：跑步机、滑雪机、划船机、椭圆机；注意：跑步机倚靠扶手会让器械消耗估值高于实际，数据有偏差；\u003c/p\u003e\n\u003cp\u003e4. 循环训练：多站点轮换训练（如Kinrox模式），调动不同肌群，训练效率高；\u003c/p\u003e\n\u003cp\u003e5. 户外类：健步走、滑雪、攀岩、徒步等。\u003c/p\u003e\n\u003cp\u003e心肺训练类型图鉴：\u003c/p\u003e\n\u003cp\u003e表5-35\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e类型\u003c/th\u003e\u003cth\u003e代表运动\u003c/th\u003e\u003cth\u003e注意事项\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e常规类\u003c/td\u003e\u003ctd\u003e走路/跑步/骑行/游泳\u003c/td\u003e\u003ctd\u003e最基础、易坚持\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e球类\u003c/td\u003e\u003ctd\u003e网球/羽毛球\u003c/td\u003e\u003ctd\u003e单打比双打效果好\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e器械类\u003c/td\u003e\u003ctd\u003e跑步机/划船机/椭圆机\u003c/td\u003e\u003ctd\u003e莫倚扶手，数据才准\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e循环训练\u003c/td\u003e\u003ctd\u003eKinrox等\u003c/td\u003e\u003ctd\u003e效率高\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e户外类\u003c/td\u003e\u003ctd\u003e健步走/滑雪/攀岩\u003c/td\u003e\u003ctd\u003e注意环境安全\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;大肌群有节奏能持续，都是心肺训练&quot;\u003c/p\u003e\n\u003cp\u003e● 跑步机避坑：扶手是数据刺客\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户在跑步机上扶着扶手跑步\u003c/p\u003e\n\u003cp\u003e• 错误做法：不纠正，让客户以为消耗很高\u003c/p\u003e\n\u003cp\u003e• 正确做法：提醒松开扶手，手臂自然摆动\u003c/p\u003e\n\u003cp\u003e• 常见误区：跑步机数据显示的消耗可能虚高\u003c/p\u003e\n\u003ch4 id=\"ch5-s609\"\u003e5.5 运动进阶\u003c/h4\u003e\n\u003cp\u003e图5-11\u003c/p\u003e\n\u003ch4 id=\"ch5-s611\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e1. 超负荷原则（不破不立）：想要身体产生适应和改变，训练强度需略高于当前体能耐受水平；\u003c/p\u003e\n\u003cp\u003e2. 专项性原则（种瓜得瓜）：训练内容和训练强度和赛事需求必须匹配，\u003c/p\u003e\n\u003cp\u003e3. 进阶节奏：前4~6周按每周10%增量；养成习惯后，可调整频率、强度，加入间歇训练、法特雷克训练、循环训练等模式。\u003c/p\u003e\n\u003cp\u003e三大进阶原则：\u003c/p\u003e\n\u003cp\u003e表5-36\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e原则\u003c/th\u003e\u003cth\u003e核心理念\u003c/th\u003e\u003cth\u003e口诀\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e超负荷\u003c/td\u003e\u003ctd\u003e强度略高才能适应\u003c/td\u003e\u003ctd\u003e不破不立\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e专项性\u003c/td\u003e\u003ctd\u003e训练内容匹配目标\u003c/td\u003e\u003ctd\u003e种瓜得瓜\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e进阶节奏\u003c/td\u003e\u003ctd\u003e10%增量，循序渐进\u003c/td\u003e\u003ctd\u003e稳扎稳打\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 超负荷口诀：&quot;不破不立&quot;\u003c/p\u003e\n\u003cp\u003e● 专项性口诀：&quot;种瓜得瓜，种豆得豆，连啥补啥&quot;\u003c/p\u003e\n\u003cp\u003e● 10%法则：&quot;进阶幅度应保守，10%可作为部分情境下的参考上限，但不是适用所有客户的固定规则&quot;\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户急于求成要加量\u003c/p\u003e\n\u003cp\u003e• 错误做法：满足客户要求，快速加量\u003c/p\u003e\n\u003cp\u003e• 正确做法：坚持10%法则，解释渐进超负荷的重要性\u003c/p\u003e\n\u003cp\u003e• 常见误区：认为&quot;练得越多越好&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s626\"\u003e5.6 减少久坐时间的FITT\u003c/h4\u003e\n\u003ch4 id=\"ch5-s627\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e积极的“沙发土豆”仍然是土豆---很多人日常有规律运动，但依旧长期久坐，代谢风险依然很高。\u003c/p\u003e\n\u003cp\u003e久坐的危害：\u003c/p\u003e\n\u003cp\u003e● 即使每天运动1小时\u003c/p\u003e\n\u003cp\u003e● 剩余时间久坐\u003c/p\u003e\n\u003cp\u003e● 代谢风险依然很高\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 类比：每天锻炼1小时，就像每天集中一小时对爱人表达“我爱你”——抵消不了其余时间的冷漠\u003c/p\u003e\n\u003cp\u003e建议每1~2小时中断一次久坐，起身活动5~10分钟；\u003c/p\u003e\n\u003cp\u003e低强度活动即可（＜3MET、低于VT1强度）：慢走、拉伸、原地小跑、简单活动；\u003c/p\u003e\n\u003cp\u003e小技巧：刻意走远路上厕所、工位简单拉伸、接水时原地轻度小跑；\u003c/p\u003e\n\u003cp\u003e规律打断久坐，能大幅降低代谢类疾病风险。\u003c/p\u003e\n\u003cp\u003e运动零食处方：\u003c/p\u003e\n\u003cp\u003e表5-37\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e参数\u003c/th\u003e\u003cth\u003e标准\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e每1-2小时一次\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时长\u003c/td\u003e\u003ctd\u003e5-10分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e&lt;3MET，低于VT1\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;1-2小时动5分，强度要低&quot;\u003c/p\u003e\n\u003cp\u003e● 积分制：走远路上厕所=1分，拉伸=1分，接水小跑=1分\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：上班族客户久坐工作\u003c/p\u003e\n\u003cp\u003e• 错误做法：只强调每天运动1小时\u003c/p\u003e\n\u003cp\u003e• 正确做法：推广&quot;运动零食&quot;概念，打破久坐\u003c/p\u003e\n\u003cp\u003e• 常见误区：认为运动只有&quot;正餐&quot;才算运动\u003c/p\u003e\n\u003ch4 id=\"ch5-s649\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：\u003c/p\u003e\n\u003cp\u003e• 大众心肺指南：每周150分钟中等强度或75分钟高强度\u003c/p\u003e\n\u003cp\u003e• FITTVP是心肺训练计划设计的六大要素\u003c/p\u003e\n\u003cp\u003e• 六种强度判定方式各有优劣，需综合使用\u003c/p\u003e\n\u003cp\u003e• 短时、分散的低强度活动是打断久坐的实用方式\u003c/p\u003e\n\u003cp\u003e• 10%可作为某些情境下的保守进阶参考，实际调整应依据客户反应\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e一名40岁客户静息心率70BPM，使用储备心率法计算其60%~80%强度的靶心率区间。\u003c/p\u003e\n\u003cp\u003e计算步骤参考：\u003c/p\u003e\n\u003cp\u003e1. 计算最大心率 (MHR)\u003c/p\u003e\n\u003cp\u003e公式：使用Gellish 公式：206.9−(0.67×年龄)\u003c/p\u003e\n\u003cp\u003e计算：206.9−(0.67×40)=206.9−26.8=180.1≈180 BPM\u003c/p\u003e\n\u003cp\u003e2. 计算储备心率 (HRR)\u003c/p\u003e\n\u003cp\u003e公式：最大心率 (MHR)−静息心率 (RHR)\u003c/p\u003e\n\u003cp\u003e计算：180−70=110 BPM\u003c/p\u003e\n\u003cp\u003e3.计算靶心率 (THR) 区间\u003c/p\u003e\n\u003cp\u003e公式：靶心率=(储备心率×强度%)+静息心率\u003c/p\u003e\n\u003cp\u003e下限 (60% 强度)：(110×60%)+70=66+70=136 BPM\u003c/p\u003e\n\u003cp\u003e上限 (80% 强度)：(110×80%)+70=88+70=158 BPM\u003c/p\u003e\n\u003cp\u003e该客户 60%~80% 强度的靶心率区间为 136 - 158 BPM\u003c/p\u003e\n\u003cp\u003e记忆小本：\u003c/p\u003e\n\u003cp\u003e● FITTVP：频强时类量进阶\u003c/p\u003e\n\u003cp\u003e● 靶心率：220-年龄-静息心率，再乘强度加回静息\u003c/p\u003e\n\u003cp\u003e● VT1/VT2：区分三区训练强度\u003c/p\u003e\n\u003cp\u003e● 运动零食：每1-2小时动5-10分钟\u003c/p\u003e\n\u003ch3 id=\"ch5-s675\"\u003e6 心肺适能评估\u003c/h3\u003e\n\u003cp\u003e心肺适能评估用于了解客户当前的有氧工作能力，为运动强度选择、计划起点和后续复测提供依据。评估前必须先完成运动前健康筛查，并根据客户的健康状态、体能水平、运动经验和评估目的选择合适方法。\u003c/p\u003e\n\u003ch4 id=\"ch5-s677\"\u003e6.1 亚极量评估\u003c/h4\u003e\n\u003cp\u003e亚极量评估不要求客户达到最大运动能力，而是通过特定的亚极量工作负荷，结合心率、自感用力度、谈话反应和完成情况，估计客户的心肺适能。评估过程中应持续观察客户反应；如出现胸部不适、明显头晕、异常呼吸困难或其他警示体征与症状，应终止评估并按相应程序处理。\u003c/p\u003e\n\u003ch4 id=\"ch5-s679\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e亚极量评估的价值在于用可控的负荷了解客户的心肺反应，而不是追求力竭。评估结果应与筛查信息、客户目标和实际运动表现一起解读。\u003c/p\u003e\n\u003ch3 id=\"ch5-s681\"\u003e7 心肺锻炼课程模块\u003c/h3\u003e\n\u003cp\u003e一次完整的心肺锻炼课程通常由热身、调节阶段和放松三部分组成。三个模块共同服务于安全、训练效果和课程连续性，不应只关注中间的主训练部分。\u003c/p\u003e\n\u003ch4 id=\"ch5-s683\"\u003e7.1 热身活动\u003c/h4\u003e\n\u003cp\u003e热身通过低到中等强度的渐进活动，逐步提高心率、通气量、体温和局部血流，使客户从静息状态平稳过渡到调节阶段。热身的形式应与后续训练相衔接，时间和进阶速度根据环境、训练强度和客户状态调整。\u003c/p\u003e\n\u003ch4 id=\"ch5-s685\"\u003e7.2 调节阶段\u003c/h4\u003e\n\u003cp\u003e调节阶段是心肺训练的主要工作部分。教练根据客户当前所处的IFT阶段，按FITT-VP原则设定频率、强度、持续时间、类型、运动量和进阶，并在训练中结合心率、RPE、谈话测试及客户的动作与症状反应进行监测。\u003c/p\u003e\n\u003ch4 id=\"ch5-s687\"\u003e7.3 放松\u003c/h4\u003e\n\u003cp\u003e放松阶段将运动强度逐步降低，让心率、血压、呼吸和静脉回流平稳恢复。不宜在高强度运动后突然完全停止，尤其要关注服用降压药、容易头晕或存在体位性低血压风险的客户。\u003c/p\u003e\n\u003ch4 id=\"ch5-s689\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e热身负责逐步进入训练，调节阶段承担主要训练刺激，放松负责平稳恢复。这三部分应根据客户和训练情境统一设计。\u003c/p\u003e\n\u003ch3 id=\"ch5-s691\"\u003e8 ACE整合式健身训练模型：心肺训练\u003c/h3\u003e\n\u003ch3 id=\"ch5-s692\"\u003e模型概述\u003c/h3\u003e\n\u003ch4 id=\"ch5-s693\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003eIFT模式依据VT1、VT2阈值，划分为第一区、第二区、第三区。\u003c/p\u003e\n\u003cp\u003eIFT三区架构：\u003c/p\u003e\n\u003cp\u003eIFT模式共分三期，每一期分别对应专属训练区域、训练强度标准，同时明确是否需要进阶及进行相应评估。\u003c/p\u003e\n\u003cp\u003eIFT三期总览：\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e期数\u003c/th\u003e\u003cth\u003e名称\u003c/th\u003e\u003cth\u003e核心定位\u003c/th\u003e\u003cth\u003e进阶条件\u003c/th\u003e\u003cth\u003e运动类型\u003c/th\u003e\u003cth\u003e评估\u003c/th\u003e\u003cth\u003e强度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第一期\u003c/td\u003e\u003ctd\u003e基础训练\u003c/td\u003e\u003ctd\u003e建立习惯\u003c/td\u003e\u003ctd\u003e可以连续至少20分钟1区稳态有氧运动\u003c/td\u003e\u003ctd\u003e稳态\u003c/td\u003e\u003ctd\u003e无需评估\u003c/td\u003e\u003ctd\u003eRPE3-4 小于vt1\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第二期\u003c/td\u003e\u003ctd\u003e健身训练（可终生停留）\u003c/td\u003e\u003ctd\u003e提升耐力\u003c/td\u003e\u003ctd\u003e可终生停留，有耐力项目赛事需求的人才需要进阶\u003c/td\u003e\u003ctd\u003e间歇\u003c/td\u003e\u003ctd\u003eVT1\u003c/td\u003e\u003ctd\u003e在等于或略高于vt1（2区）和小于vt1（1区）做间歇\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e第三期\u003c/td\u003e\u003ctd\u003e运动表现（长时间耐力项目赛事需求的人群）\u003c/td\u003e\u003ctd\u003e专项竞技\u003c/td\u003e\u003ctd\u003e无\u003c/td\u003e\u003ctd\u003e间歇\u003c/td\u003e\u003ctd\u003eVT2\u003c/td\u003e\u003ctd\u003e70%‑80% 的时间处于 ＜VT1（1区）； ＜10% 的时间处于 VT1~VT2（2区）； 10%‑20% 的时间处于 ≥VT2（3区）\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e表5-38\u003c/p\u003e\n\u003cp\u003e关于减脂，很多学习者对心肺训练都存在一定误解，首先IFT模式是用于改善健康直到增加运动表现，并没有哪一期是单独服务于减脂的，只要热量消耗大于摄入，任何一期都可以实现减脂。\u003c/p\u003e\n\u003cp\u003e重要澄清：\u003c/p\u003e\n\u003cp\u003e● IFT没有&quot;减脂专属期&quot;\u003c/p\u003e\n\u003cp\u003e● 任何一期只要热量消耗&gt;摄入，都能减脂\u003c/p\u003e\n\u003cp\u003e● 减脂的核心是热量差，不是训练类型\u003c/p\u003e\n\u003cp\u003e第二，IFT心肺训练的运动表现是基于长时间耐力项目中有短暂冲刺和加速的需求。如皮划艇，马拉松，铁人三项等项目。如果单纯的冲刺，加速，属于IFT肌肉训练第三阶段。\u003c/p\u003e\n\u003cp\u003e运动表现定义澄清：\u003c/p\u003e\n\u003cp\u003e● IFT的运动表现特指：包含短暂冲刺的长时间耐力项目\u003c/p\u003e\n\u003cp\u003e● 例如：马拉松、铁人三项、皮划艇\u003c/p\u003e\n\u003cp\u003e● 不包括：单纯短跑/爆发力（属于抗阻训练范畴）\u003c/p\u003e\n\u003ch4 id=\"ch5-s709\"\u003e8.1 基础训练\u003c/h4\u003e\n\u003cp\u003e图5-12\u003c/p\u003e\n\u003ch4 id=\"ch5-s711\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e1. 阶段核心定位\u003c/p\u003e\n\u003cp\u003e本阶段核心为养成中低强度运动习惯、改善基础健康，无需提前评估体能，可直接开始训练。\u003c/p\u003e\n\u003cp\u003e第一期定位：\u003c/p\u003e\n\u003cp\u003e● 无需提前评估体能，可直接开始\u003c/p\u003e\n\u003cp\u003e● 核心：养成中低强度运动习惯\u003c/p\u003e\n\u003cp\u003e● 目标：改善基础健康\u003c/p\u003e\n\u003cp\u003e● 训练区间：100% Zone 1（低于VT1）\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;基础训练阶段不要求先完成运动表现评估，先把习惯立&quot;\u003c/p\u003e\n\u003cp\u003e2. 进阶判定标准\u003c/p\u003e\n\u003cp\u003e学员能够连续运动至少分钟，即可满足本阶段进阶基础条件。\u003c/p\u003e\n\u003cp\u003e第一期进阶条件：\u003c/p\u003e\n\u003cp\u003e● 标准：连续运动至少20分钟\u003c/p\u003e\n\u003cp\u003e● 无需考虑速度、强度\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;一期过关卡，30分钟不歇&quot;\u003c/p\u003e\n\u003cp\u003e3. 阶段价值意义\u003c/p\u003e\n\u003cp\u003e本阶段入门门槛低，简单易执行，既能帮助人群改善身体健康状态，也更容易长期坚持、维持运动习惯。\u003c/p\u003e\n\u003cp\u003e第一期价值：\u003c/p\u003e\n\u003cp\u003e● 入门门槛低，无需体能基础\u003c/p\u003e\n\u003cp\u003e● 简单易执行，操作成本小\u003c/p\u003e\n\u003cp\u003e● 更容易长期坚持，维持运动习惯\u003c/p\u003e\n\u003cp\u003e● 收益/风险比极高（适合多数已完成筛查且能安全开始运动的人群）\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 类比：第一期是健身的&quot;新手村&quot;，安全、简单、练级\u003c/p\u003e\n\u003cp\u003e4. 理论支撑\u003c/p\u003e\n\u003cp\u003e运动训练中格外重视低强度基础性训练。卡沃南（Karvonen, 1957）提出基于心率储备的靶心率计算方法，观察到强度低于50% HRR（约60% MHR）的训练难以产生显著训练效果，明确了有效训练的强度范围。\u003c/p\u003e\n\u003cp\u003e结合现代习惯养成理论，如《原子习惯》中微习惯建立逻辑：微小且易执行的行动，更易养成长期稳定习惯，这也是教练制定基础训练计划的核心依据。\u003c/p\u003e\n\u003cp\u003e图5-13\u003c/p\u003e\n\u003cp\u003e5. 训练计划设定\u003c/p\u003e\n\u003cp\u003e1. 初始训练频次：每周仅需运动2-3次，每次时长10-15分钟。\u003c/p\u003e\n\u003cp\u003e2. 进阶硬性条件：每周坚持3-5次运动，每次运动时长20分钟及以上，稳定持续即可进阶。\u003c/p\u003e\n\u003cp\u003e3. 负荷进阶原则：每一次训练进阶，负荷提升幅度不应超过10%。\u003c/p\u003e\n\u003cp\u003e4. 阶段停留周期：因人而异，部分人群仅需停留两周，体能基础较弱者可停留六周以上，以个人实际体能状况为准。\u003c/p\u003e\n\u003cp\u003e5. 主观用力等级：本阶段RPE控制在3-4级。\u003c/p\u003e\n\u003cp\u003e第一期训练参数：\u003c/p\u003e\n\u003cp\u003e表5-39\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e参数\u003c/th\u003e\u003cth\u003e初始值\u003c/th\u003e\u003cth\u003e进阶值\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e2-3次/周\u003c/td\u003e\u003ctd\u003e3-5次/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时长\u003c/td\u003e\u003ctd\u003e10-15分钟\u003c/td\u003e\u003ctd\u003e20+分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRPE\u003c/td\u003e\u003ctd\u003e3-4级\u003c/td\u003e\u003ctd\u003e-\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e进阶增量\u003c/td\u003e\u003ctd\u003e-\u003c/td\u003e\u003ctd\u003e≤10%\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch5-s749\"\u003e8.2 健身训练\u003c/h4\u003e\n\u003cp\u003e图5-14\u003c/p\u003e\n\u003ch4 id=\"ch5-s751\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e入门条件：\u003c/p\u003e\n\u003cp\u003e● 必须通过VT1测试\u003c/p\u003e\n\u003cp\u003e● 教练需掌握测试方法\u003c/p\u003e\n\u003cp\u003e进入本阶段首要核心：完成VT1第一通气阈测试，人体在该阈值下会出现明显生理拐点，所有专业教练必须熟练掌握VT1测试方法。\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;二期第一关，VT1测试先&quot;\u003c/p\u003e\n\u003cp\u003e2. 训练核心逻辑\u003c/p\u003e\n\u003cp\u003e本阶段训练以VT1阈值为核心，开展区间间歇训练，训练强度围绕高于VT1、略低于VT1交替进行。\u003c/p\u003e\n\u003cp\u003e第二期训练逻辑：\u003c/p\u003e\n\u003cp\u003e● 以VT1为核心参照点，训练强度围绕VT1上下波动\u003c/p\u003e\n\u003cp\u003e● 采用间歇训练模式（略高于/略低于VT1交替）\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;二期围绕VT1，上下波动做间歇&quot;\u003c/p\u003e\n\u003cp\u003e3. 阶段适用人群\u003c/p\u003e\n\u003cp\u003e本阶段是绝大多数运动人群终身停留的训练阶段。\u003c/p\u003e\n\u003cp\u003e第二期适用性：\u003c/p\u003e\n\u003cp\u003e● 适用人群：绝大多数人\u003c/p\u003e\n\u003cp\u003e● 定位：终身训练阶段\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;健身训练阶段能满足大多数客户长期改善心肺适能的需要&quot;\u003c/p\u003e\n\u003cp\u003e4. 进阶准入条件\u003c/p\u003e\n\u003cp\u003e仅针对长时间耐力项目有竞技需求、竞赛参赛需求的客户，可进一步进阶至运动表现阶段。\u003c/p\u003e\n\u003cp\u003e第二期进阶条件：\u003c/p\u003e\n\u003cp\u003e● 有长时间耐力项目竞技需求\u003c/p\u003e\n\u003cp\u003e● 需要比赛/竞赛\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;二期进阶看需求，耐力竞赛才进三&quot;\u003c/p\u003e\n\u003cp\u003e5. 概念区分说明\u003c/p\u003e\n\u003cp\u003e本体系中的运动表现定义，区别于日常泛化的运动表现概念；特指长时间耐力项目的比赛与竞技需求人群。\u003c/p\u003e\n\u003cp\u003e例：短跑项目不属于本阶段范畴，短跑归属于抗阻训练第三期；本阶段适配耐力项目中存在短暂爆发力需求的人群。\u003c/p\u003e\n\u003cp\u003e重要区分：\u003c/p\u003e\n\u003cp\u003e● 短跑 = 抗阻训练第三期（爆发力）\u003c/p\u003e\n\u003cp\u003e● 马拉松/铁三 = IFT第三期（耐力表现）\u003c/p\u003e\n\u003ch4 id=\"ch5-s785\"\u003e8.3 运动表现训练\u003c/h4\u003e\n\u003cp\u003e图5-15\u003c/p\u003e\n\u003ch4 id=\"ch5-s787\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e进入第三期门槛：\u003c/p\u003e\n\u003cp\u003e● 必须通过VT2测试\u003c/p\u003e\n\u003cp\u003e● 教练需掌握测试方法\u003c/p\u003e\n\u003cp\u003e进入本阶段需完成VT2第二通气阈测试，教练需熟练掌握VT2测试逻辑与判定标准。\u003c/p\u003e\n\u003cp\u003e2. 训练时间区间占比\u003c/p\u003e\n\u003cp\u003e● 70%-80% 训练时间：一区训练（强度低于VT1）\u003c/p\u003e\n\u003cp\u003e● 不足10% 训练时间：二区训练\u003c/p\u003e\n\u003cp\u003e● 10%-20% 训练时间：三区训练\u003c/p\u003e\n\u003cp\u003e第三期极化训练比例：\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 核心思想：高质量高强度训练+大量低强度恢复\u003c/p\u003e\n\u003cp\u003e3. 区间训练底层原理\u003c/p\u003e\n\u003cp\u003e1. 训练阈值高于VT1，可有效刺激提升VT1能力；\u003c/p\u003e\n\u003cp\u003e2. 训练阈值高于VT2，可有效刺激提升VT2能力；\u003c/p\u003e\n\u003cp\u003e3. 运动表现阶段训练核心目标为三区高强度训练，强度需突破VT2。\u003c/p\u003e\n\u003cp\u003e4. 在运动表现阶段的极化训练设计中，教练通常将大部分训练时间安排在一区，并保留少量高质量三区训练。二区训练量较低是这种特定模型的结构特征，不代表二区训练对所有客户都没有价值。\u003c/p\u003e\n\u003cp\u003e训练区间与适应效果：\u003c/p\u003e\n\u003cp\u003e表5-40\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e训练区间\u003c/th\u003e\u003cth\u003e阈值要求\u003c/th\u003e\u003cth\u003e适应效果\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e一区\u003c/td\u003e\u003ctd\u003e&lt;VT1\u003c/td\u003e\u003ctd\u003e恢复、低强度基础\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e二区\u003c/td\u003e\u003ctd\u003eVT1~VT2\u003c/td\u003e\u003ctd\u003e极化训练中的中等强度区域（效率低）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e三区\u003c/td\u003e\u003ctd\u003e&gt;VT2\u003c/td\u003e\u003ctd\u003e提升运动表现\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 极化训练中的中等强度区域口诀：&quot;二区黑洞坑人狠，累得像三区，效果在二区&quot;\u003c/p\u003e\n\u003cp\u003e5. 阶段适配人群\u003c/p\u003e\n\u003cp\u003e仅适用于耐力项目中需要反复提速、反复加速冲刺的人群；单纯特定爆发力需求的训练，本质归属于肌肉抗阻训练，不纳入本阶段。\u003c/p\u003e\n\u003cp\u003e第三期适配人群：\u003c/p\u003e\n\u003cp\u003e● 长时间耐力项目\u003c/p\u003e\n\u003cp\u003e● 需要反复冲刺/加速的竞技人群\u003c/p\u003e\n\u003cp\u003e● 注意：单纯爆发力需求属于抗阻训练范畴，不纳入本阶段\u003c/p\u003e\n\u003cp\u003e6. 训练注意事项\u003c/p\u003e\n\u003cp\u003e本阶段训练强度高、负荷大，计划设计过程中需重点防范过度训练综合症，合理分配整体训练压力，同步配套科学恢复方案，训练与恢复并重。\u003c/p\u003e\n\u003cp\u003e第三期安全要点：\u003c/p\u003e\n\u003cp\u003e● 重点防范过度训练综合症，合理分配整体训练压力\u003c/p\u003e\n\u003cp\u003e● 训练与恢复并重，同步配套科学恢复方案\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：&quot;三期强度大，过度训练要防它&quot;\u003c/p\u003e\n\u003ch4 id=\"ch5-s821\"\u003e三期对比总结\u003c/h4\u003e\n\u003cp\u003e表5-41\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e第一期：基础训练\u003c/th\u003e\u003cth\u003e第二期：健身训练\u003c/th\u003e\u003cth\u003e第三期：运动表现\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心定位\u003c/td\u003e\u003ctd\u003e建立习惯\u003c/td\u003e\u003ctd\u003e提升有氧耐力\u003c/td\u003e\u003ctd\u003e专项竞技\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e前置评估\u003c/td\u003e\u003ctd\u003e无需评估\u003c/td\u003e\u003ctd\u003eVT1测试\u003c/td\u003e\u003ctd\u003eVT2测试\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e主要供能\u003c/td\u003e\u003ctd\u003e脂肪为主\u003c/td\u003e\u003ctd\u003e糖+脂肪混合\u003c/td\u003e\u003ctd\u003e糖+磷酸原\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e训练强度\u003c/td\u003e\u003ctd\u003eRPE 3-4级\u003c/td\u003e\u003ctd\u003eVT1附近波动\u003c/td\u003e\u003ctd\u003e突破VT2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e训练模式\u003c/td\u003e\u003ctd\u003e稳态有氧\u003c/td\u003e\u003ctd\u003e阈值间歇\u003c/td\u003e\u003ctd\u003e极化训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度分配\u003c/td\u003e\u003ctd\u003e100%一区\u003c/td\u003e\u003ctd\u003e以一区为主\u003c/td\u003e\u003ctd\u003e70/10/20\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e进阶标准\u003c/td\u003e\u003ctd\u003e连续20-30分钟\u003c/td\u003e\u003ctd\u003e耐力竞技需求\u003c/td\u003e\u003ctd\u003e预防过度训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e负荷原则\u003c/td\u003e\u003ctd\u003e≤10%增量\u003c/td\u003e\u003ctd\u003e围绕VT1\u003c/td\u003e\u003ctd\u003e突破VT2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e适用人群\u003c/td\u003e\u003ctd\u003e所有人\u003c/td\u003e\u003ctd\u003e大多数人\u003c/td
