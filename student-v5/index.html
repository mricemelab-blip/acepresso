c/p\u003e\n\u003cp\u003e改变并非简单的线性过程。客户可能向前进展、停留，也可能退回早期阶段。教练应通过开放式提问和倾听识别客户当前阶段，再选择与其准备程度相匹配的干预策略。\u003c/p\u003e\n\u003cp\u003e举例：不同阶段的进阶目标与干预方式：\u003c/p\u003e\n\u003cp\u003e● 思考前阶段→思考阶段：核心目标是让客户认知运动的好处，建立运动想法\u003c/p\u003e\n\u003cp\u003e● 准备阶段→行动阶段：核心目标是帮客户掌握持续运动的基本技能，扫除运动障碍\u003c/p\u003e\n\u003cp\u003e● 行动阶段→维持阶段：核心目标是增加社会支持、提高自我效能，防止客户退训\u003c/p\u003e\n\u003cp\u003e改变过程分为认知过程和行为过程：\u003c/p\u003e\n\u003cp\u003e表2-6\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e阶段\u003c/th\u003e\u003cth\u003e核心特质\u003c/th\u003e\u003cth\u003e核心目标\u003c/th\u003e\u003cth\u003e场景化干预策略（私教 / 运动场景）\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e思考前阶段\u003c/td\u003e\u003ctd\u003e没意识到问题 / 低估问题，认为 &quot;我不需要运动&quot;\u003c/td\u003e\u003ctd\u003e唤醒改变意识，让学员开始考虑改变\u003c/td\u003e\u003ctd\u003e1. 用低压力沟通传递事实：&quot;很多和你同年龄、同久坐习惯的客户，3 个月规律运动后腰颈不适都有改善，你要不要了解下？&quot;&lt;br/&gt;2. 不推销课程，只提供 1-2 条低成本信息（比如办公室拉伸图、10 分钟居家动作），降低抵触&lt;br/&gt;3. 探索学员的个人价值（比如想陪孩子打球、想改善睡眠），关联运动的好处\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e思考阶段\u003c/td\u003e\u003ctd\u003e知道自己需要运动，但纠结利弊、怕麻烦，计划 &quot;6 个月内再说&quot;\u003c/td\u003e\u003ctd\u003e降低改变顾虑，强化改变动机\u003c/td\u003e\u003ctd\u003e1. 帮学员梳理 &quot;运动 vs 不运动&quot; 的具体利弊，比如 &quot;每周 3 次 30 分钟快走，和不运动比，1 年后心肺功能差多少？&quot;&lt;br/&gt;2. 提供超简单的行动选项，比如 &quot;先从每周 1 次、15 分钟散步开始，试试水？&quot;&lt;br/&gt;3. 用真实案例强化积极预期：&quot;之前有个客户和你一样，从每周 1 次开始，3 个月就爱上了运动&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e准备阶段\u003c/td\u003e\u003ctd\u003e有想法、偶尔运动，想尝试规律训练\u003c/td\u003e\u003ctd\u003e建立信心，制定可执行的第一步计划\u003c/td\u003e\u003ctd\u003e1. 帮学员拆解目标：不喊 &quot;每周练 3 次&quot;，而是定 &quot;每周 2 次，每次 20 分钟，从自重深蹲 + 拉伸开始&quot;&lt;br/&gt;2. 识别障碍并解决：比如 &quot;你下班晚，那我们把训练时间定在周末上午 + 周三晚上，19 点开始？&quot;&lt;br/&gt;3. 帮学员建立支持系统：比如拉他进同节奏的训练群，或和朋友约好一起打卡\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e行动阶段\u003c/td\u003e\u003ctd\u003e规律运动＜6 个月，习惯未稳定，易反弹\u003c/td\u003e\u003ctd\u003e固化新习惯，应对倒退风险\u003c/td\u003e\u003ctd\u003e1. 用行为矫正策略：比如把训练日设成固定时间，训练前 1 小时发提醒，训练后立刻给正向反馈&lt;br/&gt;2. 帮学员建立 &quot;倒退预案&quot;：比如 &quot;这周加班没时间练，允许你只做 10 分钟拉伸，不算失败&quot;&lt;br/&gt;3. 建立自我监督：比如打卡表、训练日志，每周复盘 1 次，及时调整计划\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e维持阶段\u003c/td\u003e\u003ctd\u003e规律运动≥6 个月，有动力但怕厌倦\u003c/td\u003e\u003ctd\u003e巩固长期习惯，避免倦怠与反复\u003c/td\u003e\u003ctd\u003e1. 调整训练计划，加入趣味元素：比如把跑步换成骑行、徒步，或尝试新的动作组合&lt;br/&gt;2. 强化内在动机：引导学员关注 &quot;运动后精力变好、睡眠改善&quot; 等内在感受，而非只盯体重数字&lt;br/&gt;3. 帮学员建立 &quot;终身运动&quot; 的思维，比如教他如何根据工作、生活变化调整训练节奏\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e技巧策略：每个阶段的下一阶段，是当前阶段的&quot;改变&quot;目标：即了解下一阶段的特点，就可以基本清楚本阶段改变过程的手段。\u003c/p\u003e\n\u003cp\u003e改变过程又分为认知过程和行为过程，是推动阶段进阶的两大抓手：\u003c/p\u003e\n\u003cp\u003e认知过程（思想层面改变）\u003c/p\u003e\n\u003cp\u003e核心是扭转客户的认知，从思想上认可运动：包括改变自我认知、重燃运动动力、意识到自身行为能影响家人、树立健康运动的自我形象等。（注：「和志同道合的运动人群建立联系」对应「辅助性关系」，属于行为过程，已移至行为过程部分）\u003c/p\u003e\n\u003cp\u003e行为过程（行动层面改变）\u003c/p\u003e\n\u003cp\u003e核心是用实际行动替换旧的不健康习惯：比如用户外散步、健康午餐替代周末喝酒放松；搭建社会支持体系，让家人监督监督；设置个性化奖励，达成目标后奖励自己等，具体方法如下：\u003c/p\u003e\n\u003cp\u003e表2-7\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e改变过程\u003c/th\u003e\u003cth\u003e理论定义 (Cognitive/Behavioral Processes)\u003c/th\u003e\u003cth\u003e机制解读 (Mechanistic Interpretation)\u003c/th\u003e\u003cth\u003e实践案例 (Practical Application)\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e意识提高\u003c/td\u003e\u003ctd\u003e增加关于不健康行为原因、后果及补救措施的各类信息摄入。\u003c/td\u003e\u003ctd\u003e认知重组： 通过获取高质量证据（如流行病学数据），打破&quot;知识盲区&quot;，削弱对旧习惯的认知偏见。\u003c/td\u003e\u003ctd\u003e向客户讲解关于&quot;久坐行为与全因死亡率相关性&quot;的Meta分析文献。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e情感唤起\u003c/td\u003e\u003ctd\u003e对不健康行为带来的负面后果产生深刻的情感体验，并由决定改变带来的宽慰感驱动。\u003c/td\u003e\u003ctd\u003e情感驱动： 利用情绪（如恐惧或希望）作为行动催化剂，将抽象的健康风险具象化为个体的情绪波动。\u003c/td\u003e\u003ctd\u003e客户在体检报告中看到高血糖指标后产生的焦虑，通过建立训练计划将其转化为&quot;行动即缓解&quot;的动力。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e自我重新评价\u003c/td\u003e\u003ctd\u003e对自我形象进行认知和情感上的评估，衡量旧习惯与个人核心价值观之间的冲突。\u003c/td\u003e\u003ctd\u003e身份认同重塑： 评估&quot;不健康的自我&quot;与&quot;理想化的自我&quot;之间的差距，触发身份转变的内在动机。\u003c/td\u003e\u003ctd\u003e客户意识到&quot;目前的肥胖状态与我作为职业管理者的精明、自律形象不符&quot;，从而确立改变意志。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e环境重新评价\u003c/td\u003e\u003ctd\u003e评估个人行为对社会环境（尤其是人际关系）产生的正面或负面影响。\u003c/td\u003e\u003ctd\u003e社会责任感知： 将行为后果从个体扩展到系统，利用社会联结感增强改变的道德义务感。\u003c/td\u003e\u003ctd\u003e父亲意识到自己的吸烟或缺乏运动习惯正在给孩子传递负面的生活方式范式。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e自我解放\u003c/td\u003e\u003ctd\u003e相信自己具备改变的能力，并做出坚定的改变承诺（意志力）。\u003c/td\u003e\u003ctd\u003e自我效能与自主选择： 确认个体具备改变的代理权（Agency），通过公开承诺增加背弃成本。\u003c/td\u003e\u003ctd\u003e训练营学员在开营仪式上签署《健康行为契约》，并在社交平台公布为期12周的训练目标。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e辅助性关系\u003c/td\u003e\u003ctd\u003e利用社会支持系统获取信任、关心和接纳，辅助行为坚持。\u003c/td\u003e\u003ctd\u003e外部杠杆效应： 构建防御性的社会网络，通过情感支持和技术指导降低维持新行为的认知负荷。\u003c/td\u003e\u003ctd\u003e建立&quot;1对1导师制&quot;或&quot;运动小组&quot;，利用教练的专业支持和同伴的归属感减少训练流失率。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e反向调节\u003c/td\u003e\u003ctd\u003e学习用健康的行为、思考方式来替代原有的不健康习惯。\u003c/td\u003e\u003ctd\u003e习惯替代： 基于经典条件反射理论，通过建立新的神经通路来竞争并覆盖旧有的条件反射。\u003c/td\u003e\u003ctd\u003e用周末和家人一起做饭露营替代外出饮酒聚餐。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强化管理\u003c/td\u003e\u003ctd\u003e针对健康行为的进步给予正向奖励，或减少对不健康行为的强化。\u003c/td\u003e\u003ctd\u003e结果预期调节： 利用操作性条件反射原理，通过即时反馈机制（内源性或外源性）固化目标行为。\u003c/td\u003e\u003ctd\u003e达成月度减脂目标后奖励自己一套专业训练装备，或记录训练后的多巴胺分泌带来的心理愉悦感。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e刺激控制\u003c/td\u003e\u003ctd\u003e移除诱发旧习惯的提示物，并增加能触发新行为的视觉或环境提示。\u003c/td\u003e\u003ctd\u003e环境预设（Nudging）： 改变微观环境中的选择架构，降低做出正确决策所需的认知能量损耗。\u003c/td\u003e\u003ctd\u003e睡觉前将运动服放在床头；卸载手机内的外卖APP，将健身应用放在首屏醒目位置。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e社会解放\u003c/td\u003e\u003ctd\u003e意识到社会规范和环境机会正在向支持健康行为的方向转变。\u003c/td\u003e\u003ctd\u003e社会常模同化： 利用宏观环境的变革（政策、文化）来降低个体改变的社会阻力。\u003c/td\u003e\u003ctd\u003e意识到公司健身房的建立或城市慢行步道的完善，利用这些公共设施让运动变得触手可及。\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch2-s201\"\u003e自我效能（TTM第三部分，改变的核心信念）\u003c/h4\u003e\n\u003cp\u003e图2-8\u003c/p\u003e\n\u003cp\u003e定义：自我效能就是一个人对自己能成功完成某项健康任务的信念，它和行为改变是双向影响的关系。自我效能决定是否参与运动，参与运动的经历又会反过来影响自我效能，二者互为因果。\u003c/p\u003e\n\u003cp\u003e自我效能的6个来源（影响信念的关键因素，来源：ACE 6th Ed, p.78, Warner等, 2014; Bandura, 1997）：\u003c/p\u003e\n\u003cp\u003e① 过往经验（既往运动经历，对自我效能影响最大）\u003c/p\u003e\n\u003cp\u003e② 替代性经验（看到和自己相似的人成功运动，提升信心）\u003c/p\u003e\n\u003cp\u003e③ 口头说服（业界大咖、专业人士的鼓励与引导）\u003c/p\u003e\n\u003cp\u003e④ 生理评价（自身身体疲劳度、身体状态）\u003c/p\u003e\n\u003cp\u003e⑤ 情感/情绪评价（运动时的情绪是积极还是焦虑沮丧）\u003c/p\u003e\n\u003cp\u003e⑥ 想象经验（预想坚持运动后全新的自己，激发信念）\u003c/p\u003e\n\u003cp\u003e教练的核心作用：优秀的教练不应注重在教学中展示自己的优秀，而应该聚焦挖掘客户潜能、提升客户的能力与信心，强化客户的自我主体意识和自我觉察。自我效能低的客户，容易选轻松任务、轻易放弃，因此提升自我效能是教练的核心工作之一。\u003c/p\u003e\n\u003ch4 id=\"ch2-s212\"\u003e四、决策平衡（TTM第四部分，改变的利弊权衡）\u003c/h4\u003e\n\u003cp\u003e定义：客户决定是否运动，核心是权衡这件事的利与弊，利大于弊才会主动改变，且决策平衡是动态变化的过程。\u003c/p\u003e\n\u003cp\u003e不同阶段的利弊认知：\u003c/p\u003e\n\u003cp\u003e● 思考前、思考阶段客户：通常认为运动的弊大于利，所以迟迟不开始\u003c/p\u003e\n\u003cp\u003e● 行动、维持阶段客户：普遍认为运动的利大于弊，所以能坚持\u003c/p\u003e\n\u003cp\u003e教练的实操方法：\u003c/p\u003e\n\u003cp\u003e① 用开放式提问、积极倾听，了解客户心中的运动自觉收益（好处）和自觉损失（坏处），不急于给答案、不嘲讽客户\u003c/p\u003e\n\u003cp\u003e② 帮客户放大运动收益，同时最大程度降低自觉损失\u003c/p\u003e\n\u003cp\u003e③ 结合短期+长期益处引导客户，既着眼当下改变，也放眼未来效果，避免只强调长期益处打击客户积极性（该技巧会在第四章动机性访谈中重点运用）\u003c/p\u003e\n\u003cp\u003e表2-8\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e与接受期望行为相关的自觉收益\u003c/th\u003e\u003cth\u003e与接受期望行为相关的自觉损失\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1. _____\u003c/td\u003e\u003ctd\u003e1. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2. _____\u003c/td\u003e\u003ctd\u003e2. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3. _____\u003c/td\u003e\u003ctd\u003e3. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4. _____\u003c/td\u003e\u003ctd\u003e4. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e最大程度增加获得收益的可能性的策略\u003c/td\u003e\u003ctd\u003e最大程度降低遭受自觉损失的可能性的策略\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1. _____\u003c/td\u003e\u003ctd\u003e1. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2. _____\u003c/td\u003e\u003ctd\u003e2. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3. _____\u003c/td\u003e\u003ctd\u003e3. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4. _____\u003c/td\u003e\u003ctd\u003e4. _____\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e与接受期望行为相关的自觉收益\u003c/td\u003e\u003ctd\u003e与接受期望行为相关的自觉损失\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1. 肩颈 / 腰背酸痛明显缓解，久坐后僵硬感减轻\u003c/td\u003e\u003ctd\u003e1. 每周需要安排 3 个固定时段，挤占部分休闲 / 刷手机时间\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2. 体脂率下降，腰围减少 2-3cm，裤子更合身\u003c/td\u003e\u003ctd\u003e2. 初期训练后肌肉酸痛，影响次日上下楼 / 搬东西等日常活动\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3. 入睡时间缩短，夜间翻身减少，早上起床不疲惫\u003c/td\u003e\u003ctd\u003e3. 需要购买基础运动装备 / 私教课程，产生一定花费\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4. 下午犯困情况减少，工作 / 学习精力更集中\u003c/td\u003e\u003ctd\u003e4. 可能因加班 / 出差 / 聚会中断计划，产生 &quot;半途而废&quot; 的挫败感\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e最大程度增加获得收益的可能性的策略\u003c/td\u003e\u003ctd\u003e最大程度降低遭受自觉损失的可能性的策略\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1. 每次训练固定安排 10 分钟肩颈 / 腰背针对性放松训练\u003c/td\u003e\u003ctd\u003e1. 优先选择早起 30 分钟或午休时段训练，不占用晚上休息时间\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2. 搭配每日 1500-1800ml 饮水 + 减少高糖零食，放大减脂效果\u003c/td\u003e\u003ctd\u003e2. 训练后安排 5 分钟泡沫轴放松 + 静态拉伸，缓解延迟性肌肉酸痛\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3. 每周日复盘睡眠质量，用手机睡眠 APP 记录，可视化改善效果\u003c/td\u003e\u003ctd\u003e3. 先从平价自重训练 / 团课入手，或利用居家无器械训练降低成本\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4. 训练日当天安排 1 次 10 分钟短休息 + 轻度活动，提升下午精力\u003c/td\u003e\u003ctd\u003e4. 制定 &quot;容错计划&quot;：每周允许 1 次临时调整，中断后次日恢复即可，不算失败\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e总结\u003c/p\u003e\n\u003cp\u003eTTM行为改变跨理论模型的四大要点环环相扣，是教练指导客户运动行为改变的核心逻辑：先通过5个改变阶段定位客户现状，再用认知+行为的改变过程帮客户稳步进阶，通过六大来源提升客户的自我效能信念，最后优化决策平衡让客户认可运动利大于弊，最终帮客户从无运动想法，一步步实现长期维持运动的目标\u003c/p\u003e\n\u003cp\u003e💡关键思考\u003c/p\u003e\n\u003cp\u003eTTM 四个部分是一条完整的诊断—干预链：改变阶段告诉你&quot;客户在哪里&quot;，改变过程告诉你&quot;怎么推他走&quot;，自我效能告诉你&quot;他信不信自己能走&quot;，决策平衡告诉你&quot;他觉得值不值走&quot;。四个部分缺一不可。只看阶段不看效能，可能推不动；只看效能不看决策平衡，客户觉得&quot;我能但我不值&quot;。教练的任务是四个维度同时评估、同步干预。\u003c/p\u003e\n\u003cp\u003e✍️小节回顾与练习第二部分：跨理论模型（TTM）\u003c/p\u003e\n\u003cp\u003e基本原理\u003c/p\u003e\n\u003cp\u003e● 改变阶段是诊断工具：用&quot;想法 + 行动&quot;两个维度定位客户当前位置，是所有干预的起点。\u003c/p\u003e\n\u003cp\u003e● 阶段匹配：教练应先识别客户当前的改变阶段，再选择与其准备程度相匹配的干预策略，并对停留或倒退保持预期。\u003c/p\u003e\n\u003cp\u003e● 自我效能是动力开关：过往经验是自我效能最强的来源，提升自我效能是教练的核心工作之一。\u003c/p\u003e\n\u003cp\u003e● 决策平衡是变化的：思考前/思考阶段客户认为弊大于利，行动/维持阶段客户认为利大于弊。\u003c/p\u003e\n\u003cp\u003e互动考题\u003c/p\u003e\n\u003cp\u003eQ：一名客户已经每周运动 3 次、持续了 4 个月，但最近因出差中断了两周，担心自己&quot;前功尽弃&quot;。根据 TTM，该客户当前最可能处于哪个阶段？\u003c/p\u003e\n\u003cp\u003eA. 思考阶段\u003c/p\u003e\n\u003cp\u003eB. 准备阶段\u003c/p\u003e\n\u003cp\u003eC. 行动阶段\u003c/p\u003e\n\u003cp\u003eD. 维持阶段\u003c/p\u003e\n\u003cp\u003e答案：C\u003c/p\u003e\n\u003cp\u003e📚记忆小本：重点知识点\u003c/p\u003e\n\u003cp\u003e● TTM 五阶段：思考前（无想法无行动）→ 思考（有想法无行动，6 个月内）→ 准备（有想法不定期行动）→ 行动（规律 &lt; 6 月）→ 维持（规律 ≥ 6 月）\u003c/p\u003e\n\u003cp\u003e● 改变过程两大抓手：认知过程（思想层面改变）+ 行为过程（行动层面改变）\u003c/p\u003e\n\u003cp\u003e● 自我效能 6 来源：过往经验（影响最大）/ 替代性经验 / 口头说服 / 生理评价 / 情感评价 / 想象经验\u003c/p\u003e\n\u003cp\u003e● 决策平衡动态变化：思考前/思考阶段  弊 &gt; 利；行动/维持阶段  利 &gt; 弊\u003c/p\u003e\n\u003cp\u003e● 改变通常是循环而非直线的；干预策略应与客户当前阶段相匹配\u003c/p\u003e\n\u003ch3 id=\"ch2-s245\"\u003e2 行为改变的原理\u003c/h3\u003e\n\u003ch4 id=\"ch2-s246\"\u003e总述\u003c/h4\u003e\n\u003cp\u003e本部分核心讲解行为改变的底层原理，\u003c/p\u003e\n\u003cp\u003e很多专业教练能长期坚持运动，很难理解从不运动到开始运动的客户面临的巨大困难与挑战，这也体现出前一章行为改变理论模型的重要性。运用这些理论模型的核心价值，是把运动当作一项复杂的健康行为养成过程，而非简单的动作训练，需要教练依托科学原理，持续为客户提供行为指导，逐步扶持客户完成行为改变。这部分原理主要分为操作性条件反射（含先行条件）、认知与行为（非理性想法、目标设定、自我监测）两大核心内容。\u003c/p\u003e\n\u003ch4 id=\"ch2-s249\"\u003e分述\u003c/h4\u003e\n\u003ch4 id=\"ch2-s250\"\u003e2.1 操作性条件反射\u003c/h4\u003e\n\u003cp\u003e核心逻辑\u003c/p\u003e\n\u003cp\u003e后果影响行为，一件事做完之后的结果，会直接决定一个人是否会再次做出这个行为，这是操作性条件反射的核心。\u003c/p\u003e\n\u003cp\u003e图2-9\u003c/p\u003e\n\u003cp\u003e四种核心类型\u003c/p\u003e\n\u003cp\u003e表2-9\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e类型\u003c/th\u003e\u003cth\u003e细分\u003c/th\u003e\u003cth\u003e核心原理\u003c/th\u003e\u003cth\u003e典型举例\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强化类（行为再次发生概率提升）\u003c/td\u003e\u003ctd\u003e正强化\u003c/td\u003e\u003ctd\u003e行为后增加喜爱的正向刺激，促使行为重复\u003c/td\u003e\u003ctd\u003e客户坚持训练，教练及时给予肯定、鼓励\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e负强化\u003c/td\u003e\u003ctd\u003e行为后消除厌恶的负面刺激，促使行为重复\u003c/td\u003e\u003ctd\u003e坚持运动后，身体不适、体检异常指标得到改善\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e弱化类（行为再次发生概率降低）\u003c/td\u003e\u003ctd\u003e消退\u003c/td\u003e\u003ctd\u003e行为后不再提供期望的正向刺激，行为再次发生概率下降\u003c/td\u003e\u003ctd\u003e客户坚持到店训练，教练完全忽视该行为，从不表扬\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e惩罚\u003c/td\u003e\u003ctd\u003e行为后施加厌恶的负面刺激，行为再次发生概率大幅降低\u003c/td\u003e\u003ctd\u003e客户正常到场训练，却因动作质量不佳或饮食管理未达到要求被批评、指责\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e强化类（行为再次发生的概率提升）\u003c/p\u003e\n\u003cp\u003e● 正强化：行为发生后，增加客户喜欢的正向刺激，让客户感到愉悦，行为会重复发生。\u003c/p\u003e\n\u003cp\u003e● 负强化：&quot;负&quot;是减号的意思，并非负面，指行为发生后，消除了客户不喜欢的厌恶刺激，结果让客户满意，行为也会重复发生。比如坚持运动后，体检异常指标改善、身体脂肪减少，就是典型的负强化。\u003c/p\u003e\n\u003cp\u003e弱化类（行为再次发生的概率降低）：\u003c/p\u003e\n\u003cp\u003e● 消退：行为发生后，没有出现客户想要的正向刺激，行为发生概率降低。比如新客户坚持来健身房，教练却从未表扬，忽略&quot;到场运动&quot;这个核心行为，属于消退，会降低客户再来的意愿。\u003c/p\u003e\n\u003cp\u003e● 惩罚：行为发生后，出现了客户不想要的厌恶刺激，行为发生概率大幅降低。比如客户坚持到场却被当众批评，就是惩罚+消退的双重负面效果。\u003c/p\u003e\n\u003cp\u003e🤔思考题\u003c/p\u003e\n\u003cp\u003e场景：客户迟到、穿拖鞋和宽松衣物来健身房，\u003c/p\u003e\n\u003cp\u003e作为教练的你将如何应对\u003c/p\u003e\n\u003cp\u003e提示：应对方式方式会决定客户下次是否依旧如此；想要减少这类不当行为，可通过消退（去掉阳性刺激）或合理的&quot;惩罚&quot;（增加厌恶刺激）实现。\u003c/p\u003e\n\u003cp\u003e📚 记忆技巧\u003c/p\u003e\n\u003cp\u003e记忆提示：强化让行为变多，弱化让行为变少\u003c/p\u003e\n\u003cp\u003e● 强化 = 让行为重复\u003c/p\u003e\n\u003cp\u003e● 正强化 = 加好东西（口头表扬、鼓励）\u003c/p\u003e\n\u003cp\u003e● 负强化 = 减坏东西（解除痛苦、消除不适）\u003c/p\u003e\n\u003cp\u003e● 弱化 = 让行为减少\u003c/p\u003e\n\u003cp\u003e● 消退 = 不给好东西\u003c/p\u003e\n\u003cp\u003e● 惩罚 = 加坏东西\u003c/p\u003e\n\u003cp\u003e要点：正向刺激是&quot;胡萝卜&quot;，厌恶刺激是&quot;大棒&quot;——。\u003c/p\u003e\n\u003cp\u003e🎯 教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：客户完成了一次训练，你想强化他的行为\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：&quot;这次表现不错&quot;（太笼统）\u003c/p\u003e\n\u003cp\u003e✅ 正确做法——：真正实践中有效的增加正向刺激和去掉厌恶刺激的手段\u003c/p\u003e\n\u003cp\u003e即时反馈：训练结束当场肯定，而不是下次见面才说（正向刺激，正强化）\u003c/p\u003e\n\u003cp\u003e具体化：&quot;你今天的深蹲控制比上周稳多了，核心收紧的感觉找到了&quot;（增加正向刺激，正强化）\u003c/p\u003e\n\u003cp\u003e关联价值：把表现和客户的个人目标联系起来——。&quot;你坚持训练，上周说的腰背不适是不是缓解了？&quot;（去掉厌恶刺激，负强化）\u003c/p\u003e\n\u003cp\u003e视觉化：记录进步（训练日志、体测数据、照片对比），让客户看到自己的改变（增加正向刺激，正强化）\u003c/p\u003e\n\u003cp\u003e❌常见误区：把&quot;自认为的严格&quot;和&quot;为他好&quot;用做了消退和惩罚。客户按时来上课，也努力在学习，你却对这些行为毫无反应（消退）只盯着他某个动作没做好，不断的批评（惩罚），这就是消退+惩罚的“王炸”——，会打击客户的到场意愿。\u003c/p\u003e\n\u003cp\u003e先行条件（前因）与刺激控制\u003c/p\u003e\n\u003cp\u003e先行条件是行为出现之前的刺激因素，也就是&quot;前因&quot;，前因诱发行为的方式被称为刺激控制，是行为矫正的重要工具。比如锻炼前设闹钟、写训练笔记、手机设屏保、车内放置运动服，这些前因都能有效触发客户的运动行为。\u003c/p\u003e\n\u003cp\u003e💡关键思考\u003c/p\u003e\n\u003cp\u003e操作性条件反射的核心启示是：教练要少用惩罚、多用强化。惩罚看似有效，但会产生两个问题：一是让客户把训练与负面体验绑定（消退 + 惩罚叠加），二是客户可能&quot;表面服从、实际逃避&quot;。好的教练永远优先用正强化（即时、具体、关联价值），只在涉及安全的底线问题上才用惩罚逻辑。这也是第一章&quot;消除风险 &gt; 告知风险&quot;原则在行为层面的延伸。\u003c/p\u003e\n\u003ch4 id=\"ch2-s288\"\u003e2.2 认知与行为\u003c/h4\u003e\n\u003cp\u003e一个人的行为（个体行为）会受自身看法直接影响，因此认知层面的引导是行为改变的关键，主要包含以下内容：\u003c/p\u003e\n\u003cp\u003e取代非理性想法\u003c/p\u003e\n\u003cp\u003e大多数人都存在不同程度的认知扭曲，比如极端思想（要么不做、要么做最好）、以偏概全（吃一块巧克力就彻底放纵）、责备他人（加班没管好饮食都怪老板）、固有偏见（女生天生力气小不用练力量）、忽视健康（高血压多年觉得无所谓）等，这些认知扭曲会阻碍客户建立健康的思维方式。\u003c/p\u003e\n\u003cp\u003e教练不要直接指责客户认知扭曲（这不礼貌也不专业），而是通过开放式提问，和客户共同思考，引导客户自行意识到自身的非理性状态，逐步建立健康认知。\u003c/p\u003e\n\u003cp\u003e表2-10\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e类别\u003c/th\u003e\u003cth\u003e名称\u003c/th\u003e\u003cth\u003e核心定义（一句话版）\u003c/th\u003e\u003cth\u003e典型例子\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e极端化思维\u003c/td\u003e\u003ctd\u003e极端思想（非黑即白）\u003c/td\u003e\u003ctd\u003e把事情看成 &quot;要么完美、要么彻底失败&quot;，没有中间地带\u003c/td\u003e\u003ctd\u003e&quot;我吃了一块饼干，节食就毁了，干脆把整包都吃了&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e变形镜\u003c/td\u003e\u003ctd\u003e放大化（灾难化）/ 最小化\u003c/td\u003e\u003ctd\u003e要么把小事灾难化放大，要么把严重问题刻意淡化\u003c/td\u003e\u003ctd\u003e&quot;不喝几杯酒，压力根本缓解不了&quot; / &quot;高血压没什么大不了，我没感觉&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e片面化思维\u003c/td\u003e\u003ctd\u003e以偏概全\u003c/td\u003e\u003ctd\u003e用单次 / 局部事件，概括出 &quot;永远、总是&quot; 的绝对结论\u003c/td\u003e\u003ctd\u003e&quot;从来没有好事发生在我身上&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e&quot;透视眼&quot;和&quot;千里眼&quot;\u003c/td\u003e\u003ctd\u003e妄下结论\u003c/td\u003e\u003ctd\u003e无依据地猜别人想法（读心），或武断预判坏结果（占卜）\u003c/td\u003e\u003ctd\u003e&quot;我家人觉得我跑不完 5 公里&quot; / &quot;就算瘦了几斤，也一定会反弹&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e标签化 /\u003c/td\u003e\u003ctd\u003e贴标签\u003c/td\u003e\u003ctd\u003e用一件事，给自己 / 他人贴永久性负面标签\u003c/td\u003e\u003ctd\u003e&quot;我总忘带运动鞋，真是个白痴&quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e归因偏差\u003c/td\u003e\u003ctd\u003e自责 / 责备他人\u003c/td\u003e\u003ctd\u003e要么把所有错揽在自己身上，要么把问题全推给别人\u003c/td\u003e\u003ctd\u003e&quot;都是我的错&quot; / &quot;老板催我工作，我压力大才抽烟，都是她的错&quot;\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e极：极端思想（非黑即白）\u003c/p\u003e\n\u003cp\u003e放：放大 / 灾难化 + 最小化\u003c/p\u003e\n\u003cp\u003e偏：以偏概全\u003c/p\u003e\n\u003cp\u003e断：妄下断论（读心 + 占卜）\u003c/p\u003e\n\u003cp\u003e标：贴标签\u003c/p\u003e\n\u003cp\u003e责：自责/ 责备他人\u003c/p\u003e\n\u003cp\u003e📚 记忆技巧\u003c/p\u003e\n\u003cp\u003e记忆提示：认知扭曲六兄弟——：极、放、偏、断、标、责\u003c/p\u003e\n\u003cp\u003e● 想象这六个认知扭曲是一个犯罪团伙：\u003c/p\u003e\n\u003cp\u003e● 极端思想：要么最好，要么最差，没有中间地带\u003c/p\u003e\n\u003cp\u003e● 放大/灾难化：把小事变大，或把大事缩小\u003c/p\u003e\n\u003cp\u003e● 偏以概全：用一次失败否定全部\u003c/p\u003e\n\u003cp\u003e● 断妄下结论：读心术（猜别人怎么想）和占卜术（预言坏事）\u003c/p\u003e\n\u003cp\u003e● 标贴标签：给自己贴负面永久标签\u003c/p\u003e\n\u003cp\u003e● 责责备他人：都是别人的错\u003c/p\u003e\n\u003cp\u003e要点：遇到&quot;全或无&quot;、&quot;永远/从不&quot;的句式，就要警惕可能是认知扭曲在作祟。\u003c/p\u003e\n\u003cp\u003e🎯 教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：客户说：&quot;我昨晚没忍住吃了一顿火锅，我这周的努力全白费了，我果然不适合健身。&quot;这属于哪种认知扭曲？\u003c/p\u003e\n\u003cp\u003eA. 妄下结论\u003c/p\u003e\n\u003cp\u003eB. 极端思想（非黑即白）\u003c/p\u003e\n\u003cp\u003eC. 贴标签\u003c/p\u003e\n\u003cp\u003eD. 环境重新评价\u003c/p\u003e\n\u003cp\u003e答案：B\u003c/p\u003e\n\u003cp\u003e拓展一下，遇到以上问题，作为教练的你将如何应对呢？\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：直接反驳：&quot;一顿火锅不会长胖的&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e不要否定情绪：先共情：&quot;能感觉到你对自己要求很高&quot;\u003c/p\u003e\n\u003cp\u003e用提问引导：问&quot;一顿火锅真的等于全毁吗？你能帮我算算热量吗？&quot;\u003c/p\u003e\n\u003cp\u003e重建认知：引导客户意识到这是&quot;极端思想&quot;：&quot;吃了一顿不代表整个计划失败，明天正常吃回来就好&quot;\u003c/p\u003e\n\u003cp\u003e设定弹性规则：提前告诉客户&quot;允许自己每周有1次&#x27;欺骗餐&#x27;，这不算失控，而是人性&quot;\u003c/p\u003e\n\u003cp\u003e常见误区：教练急于纠正客户的认知扭曲，结果变成说教，客户防御心理更强。记住：引导比纠正更有效。\u003c/p\u003e\n\u003cp\u003e目标设定\u003c/p\u003e\n\u003cp\u003e目标设定是目前应用最广泛、最直接的行为改变策略，但多数人设定目标后很快放弃，核心是方法错误。教练在目标设定中需遵循三个要点：\u003c/p\u003e\n\u003cp\u003e● 目标必须由教练和客户共同制定，教练可提供制定目标所需的信息，但不能替代客户做决定\u003c/p\u003e\n\u003cp\u003e● 目标遵循SMART原则（第四章详细讲解）；\u003c/p\u003e\n\u003cp\u003e● 教练全程辅导客户完成目标设定，帮助其掌握制定有效目标的方法。\u003c/p\u003e\n\u003cp\u003e📚 记忆技巧\u003c/p\u003e\n\u003cp\u003e记忆提示：目标设定三步走——：共同定、SMART、持续陪\u003c/p\u003e\n\u003cp\u003e● 共同定：目标不是你给客户拍脑袋定的，是你们一起商量的\u003c/p\u003e\n\u003cp\u003e● SMART：具体、可测量、可达成、相关、有时限\u003c/p\u003e\n\u003cp\u003e● 持续陪：设定只是开始，辅导完成才是教练的价值\u003c/p\u003e\n\u003cp\u003e要点：目标不是定完就结束，定目标只是开始，陪客户完成才是本事。\u003c/p\u003e\n\u003cp\u003e🎯 教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：客户说&quot;我要减肥，三个月瘦20斤&quot;\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：直接接受这个目标，开始制定计划\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e63. 先问&quot;为什么&quot;：减肥是为了什么？找到更深层的动机（穿得下婚礼礼服/体检指标正常/陪孩子跑步不喘）\u003c/p\u003e\n\u003cp\u003e64. 拆解成过程目标：定&quot;每周3次训练，每次50分钟&quot;。过程目标比结果目标更能坚持\u003c/p\u003e\n\u003cp\u003e65. SMART化：20斤太多，分解成每月约1.5-2公斤更现实\u003c/p\u003e\n\u003cp\u003e66. 设置检查点：每周复盘一次，根据进展调整\u003c/p\u003e\n\u003cp\u003e67. 庆祝小胜：达成阶段性目标就庆祝，不等最后\u003c/p\u003e\n\u003cp\u003e🥵 常见误区：目标太大、太远，客户看不到进步就放弃了。把大目标拆成小里程碑，让客户持续有成就感。\u003c/p\u003e\n\u003cp\u003e自我监测\u003c/p\u003e\n\u003cp\u003e自我监测属于自我调节的认知过程，反映一个人对自身想法、感受的评价，以及如何用这些信息影响目标和行为，通俗来说就是自律的核心部分，包含自我控制、抵制冲动行为，做出符合自身愿景与价值观的选择。\u003c/p\u003e\n\u003cp\u003e行为改变靠的是科学方法。教练不要通过说教解决客户问题，而是用开放式问题辅助客户自我监测，让客户清晰自身进度、意识到潜在障碍，主动调整计划，提升自我认知。\u003c/p\u003e\n\u003cp\u003e📚 记忆技巧\u003c/p\u003e\n\u003cp\u003e记忆提示：自我监测三步骤——：记录、对比、调整\u003c/p\u003e\n\u003cp\u003e● 记录：把训练、饮食、睡眠、体重等数据写下来\u003c/p\u003e\n\u003cp\u003e● 对比：和上周、上个月对比，看看进步在哪里\u003c/p\u003e\n\u003cp\u003e● 调整：根据数据调整下一阶段的计划\u003c/p\u003e\n\u003cp\u003e要点：没有记录的进步都是感觉，有记录的进步才是证据。\u003c/p\u003e\n\u003cp\u003e🎯 教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：客户说&quot;我感觉没什么进步&quot;\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：&quot;你要坚持，时间会证明一切&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e翻出记录：把客户之前的数据（训练日志、体测报告、训练视频）调出来\u003c/p\u003e\n\u003cp\u003e量化进步：说&quot;你的深蹲重量从40公斤提到50公斤，这就是10公斤的进步&quot;\u003c/p\u003e\n\u003cp\u003e引导自我监测：问&quot;你自己觉得，和刚来的时候比，有什么不一样？&quot;\u003c/p\u003e\n\u003cp\u003e制造可视反馈：定期拍照、量围度、测体成分，让客户看到肉眼可见的改变\u003c/p\u003e\n\u003cp\u003e常见误区：教练替客户监测，而不让客户学会自己监测。\u003c/p\u003e\n\u003cp\u003e好的教练是让自己&quot;失业&quot;，让客户自己能管自己，建立自我主体性。\u003c/p\u003e\n\u003cp\u003e看到这里，作为教练和准教练的你们或许会有疑问：那我岂不是要失业了？我们可以用心理学中的&quot;脚手架理论&quot;（Scaffolding Theory）来帮助你理解：随着学员能力的提升，脚手架必须主动拆除，否则就会阻碍主体性的发展。拆除脚手架不代表建筑工人的失业，而是意味着一座新建筑或者一个阶段的工程的落成，工人可以开始下一阶段和更多新的工程的开始，直至完成教练生涯更多的摩天大楼的建造。\u003c/p\u003e\n\u003cp\u003e不要追求&quot;学员对我的依赖&quot;，要转换为追求“学员的自我成就感”乃至&quot;行业对我的专业口碑&quot;。当一个教练能不断让新手&quot;毕业&quot;并成为能够自我管理的高水平训练者时，他的专业声誉会带来更多的源头活水，根本无需担心失业。好的教练目标是让客户实现自我管理，而非持续依赖教练。客户能独立时，恰恰说明你的专业能力。\u003c/p\u003e\n\u003cp\u003e总结\u003c/p\u003e\n\u003cp\u003e行为改变原理的核心在两层：底层是操作性条件反射塑造行为，上层是认知干预纠正偏差。目标设定和自我监测是可操作的干预抓手。\u003c/p\u003e\n\u003cp\u003e✍小节回顾与练习第三部分：行为改变的原理\u003c/p\u003e\n\u003cp\u003e基本原理\u003c/p\u003e\n\u003cp\u003e● 行为是被后果塑造的：强化让行为增多，弱化让行为减少。教练要少用惩罚、多用强化。\u003c/p\u003e\n\u003cp\u003e● 认知扭曲是行为改变的隐形障碍：教练要引导而非指责，通过开放式提问让客户自行觉察。\u003c/p\u003e\n\u003cp\u003e● 行为改变靠科学而非意志力：目标设定（共同制定 + SMART + 全程辅导）和自我监测（记录 → 对比 → 调整）是可操作的干预抓手。\u003c/p\u003e\n\u003cp\u003e记忆小本：重点知识点\u003c/p\u003e\n\u003cp\u003e● 四种操作性条件反射：正强化（加好）/ 负强化（减坏）/ 消退（不给好）/ 惩罚（加坏）\u003c/p\u003e\n\u003cp\u003e● 认知扭曲六类口诀：极（极端思想）/ 放（放大化 + 最小化）/ 偏（以偏概全）/ 断（妄下结论）/ 标（贴标签）/ 责（自责 / 责备他人）\u003c/p\u003e\n\u003cp\u003e● 目标设定三要点：共同制定 + SMART 原则 + 全程辅导\u003c/p\u003e\n\u003cp\u003e● 自我监测 = 自律核心：自我控制 + 抵制冲动 + 做出符合愿景的选择\u003c/p\u003e\n\u003cp\u003e● 刺激控制：用前因（闹钟/运动服/屏保）诱发运动行为\u003c/p\u003e\n\u003cp\u003e💡章节小节\u003c/p\u003e\n\u003ch4 id=\"ch2-s381\"\u003e行为改变的原理 (Principles)\u003c/h4\u003e\n\u003cp\u003e核心要义凝练\u003c/p\u003e\n\u003cp\u003e行为是被后果塑造的。该板块基于行为主义心理学的硬核逻辑，强调环境前因与反馈结果的调控。\u003c/p\u003e\n\u003cp\u003e● 操作性条件反射：\u003c/p\u003e\n\u003cp\u003e○ 强化：旨在增加行为概率（正强化加奖励，负强化撤厌恶）。\u003c/p\u003e\n\u003cp\u003e○ 弱化：旨在降低行为概率（消退是撤奖励，惩罚是加厌恶）。\u003c/p\u003e\n\u003cp\u003e● 认知干预：识别并重构&quot;非理性想法&quot;（如非黑即白的极端思想、以偏概全的归因偏差），利用刺激控制（前因管理）降低行为启动的认知损耗。\u003c/p\u003e\n\u003cp\u003e思考与练习\u003c/p\u003e\n\u003cp\u003e● 思考题：客户坚持训练一个月后，发现长期的偏头痛消失了。从操作性条件反射角度看，这属于哪种机制？为什么这种机制比单纯的口头表扬更能促进长期依从性？\u003c/p\u003e\n\u003ch3 id=\"ch2-s390\"\u003e3 身体活动与坚持\u003c/h3\u003e\n\u003ch4 id=\"ch2-s391\"\u003e总述\u003c/h4\u003e\n\u003cp\u003e我们要明白一个核心事实：让人开始运动很简单，让人长期坚持运动，才是最难的事。\u003c/p\u003e\n\u003cp\u003e绝大多数客户，心里都清楚规律训练、坚持运动对身体有益，甚至很多人会反复尝试运动，但最终都无法长期坚持。\u003c/p\u003e\n\u003cp\u003e所以，一名专业私人教练的核心能力，不只是会排训练动作、带客户完成单次训练，更要依靠沟通能力、行为改变知识、科学的计划设计能力，制定全面且适配的运动方案。\u003c/p\u003e\n\u003cp\u003e既要让客户收获健康、身材变好，还要提升运动过程中的体验感、愉悦感与成就感。\u003c/p\u003e\n\u003cp\u003e我们的工作重心，不能只放在「让客户开始运动」「关注初期训练积极性」，更要聚焦如何让客户长久坚持运动。\u003c/p\u003e\n\u003cp\u003e决定一个人能否长期坚持运动，一共有三个关键因素：\u003c/p\u003e\n\u003cp\u003e1. 个人特质（主观因素）\u003c/p\u003e\n\u003cp\u003e2. 环境因素（客观因素）\u003c/p\u003e\n\u003cp\u003e3. 身体活动因素（训练方案本身）\u003c/p\u003e\n\u003ch4 id=\"ch2-s401\"\u003e分述\u003c/h4\u003e\n\u003ch4 id=\"ch2-s402\"\u003e3.1 个人特质\u003c/h4\u003e\n\u003cp\u003e指客户自身自带的个人特点，分为五大类：\u003c/p\u003e\n\u003cp\u003e1. 人口统计变量\u003c/p\u003e\n\u003cp\u003e图2-10\u003c/p\u003e\n\u003cp\u003e包含年龄、受教育程度、收入情况等个人基础条件。\u003c/p\u003e\n\u003cp\u003e研究表明：年龄和运动坚持度几乎没有关系；整体来看，男性运动坚持度普遍高于女性，但该规律不能套用在每一个个体身上。\u003c/p\u003e\n\u003cp\u003e2. 健康状况\u003c/p\u003e\n\u003cp\u003e患有慢性病、身体基础偏弱的人群，运动时长、运动坚持度，普遍低于身体健康的普通人群。\u003c/p\u003e\n\u003cp\u003e3. 运动史（核心重点）\u003c/p\u003e\n\u003cp\u003e运动史是影响个人特质当中最重要的变量。\u003c/p\u003e\n\u003cp\u003e教练必须了解客户过往的运动经历、运动基础，同时掌握客户的运动喜好。贴合客户喜好去设计训练，才能大幅提升参与感和坚持度。\u003c/p\u003e\n\u003cp\u003e4. 心理特质\u003c/p\u003e\n\u003cp\u003e图2-11\u003c/p\u003e\n\u003cp\u003e人的情绪、想法，会直接影响运动坚持度。\u003c/p\u003e\n\u003cp\u003e压力越大、长期抑郁、易怒的人，运动坚持度越差；\u003c/p\u003e\n\u003cp\u003e如果客户本身不喜欢当下的训练计划，也会主动放弃运动。\u003c/p\u003e\n\u003cp\u003e因此，教练必须和客户共同制定训练方案，打造愉悦、可持续、贴合自身生活方式的训练模式，这就是非常关键的运动依从性。\u003c/p\u003e\n\u003cp\u003e5. 认知、态度与信念\u003c/p\u003e\n\u003cp\u003e每个人对运动的理解、看法、信念完全不同。\u003c/p\u003e\n\u003cp\u003e自我健康认知差、缺乏健康信念的人，很难长期坚持运动；\u003c/p\u003e\n\u003cp\u003e如果客户只为‘减重’“变美”单一目标运动，一旦遇到减脂平台期，就会瞬间丧失动力、放弃训练。\u003c/p\u003e\n\u003cp\u003e所以教练要引导客户建立长期健康思维，树立终身运动的认知，不局限于短期身材目标。\u003c/p\u003e\n\u003cp\u003e💡 记忆技巧\u003c/p\u003e\n\u003cp\u003e口诀：个人特质三问：过去怎样？现在怎样？想要啥？\u003c/p\u003e\n\u003cp\u003e● 过去：运动史是最强的预测因子\u003c/p\u003e\n\u003cp\u003e● 现在：心理状态、认知态度\u003c/p\u003e\n\u003cp\u003e● 将来：个人目标与动机\u003c/p\u003e\n\u003cp\u003e一句话记牢：了解一个人过去怎么运动，比问他&quot;你想要什么&quot;更能预测他将来会不会坚持。\u003c/p\u003e\n\u003cp\u003e教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：新客户第一次见面，评估个人特质\u003c/p\u003e\n\u003cp\u003e✓ 标准问诊流程：\u003c/p\u003e\n\u003cp\u003e90. 运动史：&quot;你以前有运动习惯吗？做过什么运动？为什么停了？&quot;\u003c/p\u003e\n\u003cp\u003e91. 健康状况：&quot;有没有慢性病、旧伤、体检异常？&quot;\u003c/p\u003e\n\u003cp\u003e92. 心理状态：&quot;最近压力大吗？睡眠怎么样？&quot;\u003c/p\u003e\n\u003cp\u003e93. 动机来源：&quot;你为什么现在决定开始运动？&quot;\u003c/p\u003e\n\u003cp\u003e94. 障碍预判：&quot;你觉得开始运动最大的困难是什么？&quot;\u003c/p\u003e\n\u003cp\u003e常见误区：只问目标，不问过去。很多人会说&quot;我要减肥&quot;，但如果你知道他过去尝试过3次都放弃了，你应该更关注&quot;是什么让你放弃了&quot;而不是&quot;这次你要减多少&quot;。\u003c/p\u003e\n\u003ch4 id=\"ch2-s439\"\u003e3.2 环境因素\u003c/h4\u003e\n\u003cp\u003e可以通俗理解为：天时、地利、人和。\u003c/p\u003e\n\u003cp\u003e1. 天时：时间因素\u003c/p\u003e\n\u003cp\u003e「没有时间」是客户放弃运动、无法坚持的最常见原因。\u003c/p\u003e\n\u003cp\u003e教练要结合客户的空余时间，灵活安排课程，适当设计短时高效的训练；同时和客户沟通，挖掘一天当中可利用的碎片运动时间。\u003c/p\u003e\n\u003cp\u003e2. 地利：设施便利性\u003c/p\u003e\n\u003cp\u003e运动场地、健身设施越方便到达，客户的运动坚持度就越高。\u003c/p\u003e\n\u003cp\u003e3. 人和：社会支持\u003c/p\u003e\n\u003cp\u003e家人、朋友的正向鼓励与陪伴，是坚持运动的重要助力。\u003c/p\u003e\n\u003cp\u003e其中，伴侣、配偶的支持，是维持运动计划最可靠的因素；如果家人可以一起参与运动，坚持效果会大幅提升。\u003c/p\u003e\n\u003cp\u003e若客户缺乏身边人的支持，教练需要主动为客户搭建运动社交、社群氛围，制造正向的社会支持网络。\u003c/p\u003e\n\u003cp\u003e📚 记忆技巧\u003c/p\u003e\n\u003cp\u003e● 有时间：天时\u003c/p\u003e\n\u003cp\u003e● 有地方：地利（设施便利）\u003c/p\u003e\n\u003cp\u003e● 有人陪：人和（社会支持）\u003c/p\u003e\n\u003cp\u003e要点：再强的意志力也扛不住&quot;没时间、设施远、没人陪&quot;三连击。\u003c/p\u003e\n\u003cp\u003e🎯 教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：客户说&quot;最近太忙了，实在没时间运动&quot;\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：&quot;你要挤时间！鲁迅说过时间像海绵里的水&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e1.不要否定：客户确实可能很忙，先认可\u003c/p\u003e\n\u003cp\u003e2.挖掘碎片时间：问&quot;你每天通勤多久？午休有多长？晚上孩子睡觉后你有时间吗？&quot;\u003c/p\u003e\n\u003cp\u003e3. 降低门槛：说&quot;每天10分钟的训练要不要尝试一下？&quot;\u003c/p\u003e\n\u003cp\u003e4. 改变环境：如果客户总说忙，帮他把运动环境搬到最近的地方。在家练比去健身房更容易坚持\u003c/p\u003e\n\u003cp\u003e社会支持与承诺：可邀请客户与可信任的亲友共同约定训练时间或进度检查方式。这类安排应以支持和鼓励为主，避免羞辱性惩罚或过度施压。\u003c/p\u003e\n\u003cp\u003e常见误区：认为&quot;没时间&quot;是借口。实际上很多客户是真的忙。教练不应拆穿借口，要帮客户找到他真正能用的时间窗口。\u003c/p\u003e\n\u003cp\u003e📚 记忆技巧\u003c/p\u003e\n\u003cp\u003e记忆提示：社会支持三层次——：家人、朋友、团队\u003c/p\u003e\n\u003cp\u003e● 核心层：家人/伴侣（最可靠的坚持因素）\u003c/p\u003e\n\u003cp\u003e● 中间层：朋友、同事（陪伴和监督）\u003c/p\u003e\n\u003cp\u003e● 外围层：教练、团队（专业支持和社群归属）\u003c/p\u003e\n\u003cp\u003e要点：一个人走得快，一群人走得远——。运动这件事，社交元素越多，坚持越久。\u003c/p\u003e\n\u003cp\u003e🎯 教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：客户说&quot;家人不支持我健身，说我浪费时间&quot;\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：&quot;他们不懂，你坚持自己的&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e86. 理解立场：先问&quot;他们担心的是什么？&quot;：可能是怕你受伤、花钱、没时间陪家人\u003c/p\u003e\n\u003cp\u003e87. 关联家人利益：帮客户找到运动的&quot;家庭价值&quot;：&quot;你精力好了，陪孩子更有耐心；你体态好了，一家人拍照都好看&quot;\u003c/p\u003e\n\u003cp\u003e88. 邀请参与：能不能带家人一起？哪怕只是周末散步\u003c/p\u003e\n\u003cp\u003e89. 建立替代支持：如果家人真的不支持，帮客户在健身房或线上找到支持社群\u003c/p\u003e\n\u003cp\u003e常见误区：把家人当敌人。教练不应挑拨客户和家庭的关系，要帮客户找到运动和家庭利益的结合点。\u003c/p\u003e\n\u003ch4 id=\"ch2-s480\"\u003e3.3 身体活动因素\u003c/h4\u003e\n\u003cp\u003e也就是我们给到客户的训练计划内容，核心包含两大关键点：\u003c/p\u003e\n\u003cp\u003e1. 训练强度\u003c/p\u003e\n\u003cp\u003e很多教练固有认知：新手只能做低强度训练。\u003c/p\u003e\n\u003cp\u003e研究提示，部分参与者对间歇性较高强度训练的愉悦感和时间效率评价较高；近年来HYROX等高强度体能赛事的火热也反映了这一点，但这类反应存在明显个体差异，不能据此认为较高强度训练适合所有初学者。\u003c/p\u003e\n\u003cp\u003e与中等强度持续训练相比，高强度间歇训练在某些研究中对心血管代谢和身体成分指标呈现相近或较好的效果。训练方式应依据健康筛查、体适能水平、偏好、恢复能力和风险进行选择，不应把任何单一强度模式视为通用方案。\u003c/p\u003e\n\u003cp\u003e初期客户应依据筛查结果、当前能力和训练反应循序渐进。如适合加入较高强度间歇内容，应逐步调整工作时间、恢复时间和总训练量。\u003c/p\u003e\n\u003cp\u003e2. 运动损伤\u003c/p\u003e\n\u003cp\u003e运动损伤是可能中断训练、降低运动坚持度的重要因素。\u003c/p\u003e\n\u003cp\u003e运动损伤会干扰正常训练，并可能降低运动坚持度。因此，计划设计应重视负荷管理、恢复和及时调整。\u003c/p\u003e\n\u003cp\u003e因此训练计划必须遵循循序渐进原则，科学进阶、合理负荷，规避损伤风险。\u003c/p\u003e\n\u003cp\u003e📚 记忆技巧\u003c/p\u003e\n\u003cp\u003e记忆提示：训练刺激要与客户能力和目标匹配，同时通过循序渐进和恢复管理降低损伤风险。\u003c/p\u003e\n\u003cp\u003e● 强度要与客户目标、能力、偏好和恢复状态相匹配\u003c/p\u003e\n\u003cp\u003e● 损伤防控：通过筛查、技术指导、负荷进阶和恢复管理维持训练连续性\u003c/p\u003e\n\u003cp\u003e要点：训练方案好不好，看客户愿不愿意明天还来。\u003c/p\u003e\n\u003cp\u003e🎯 教练小Tips\u003c/p\u003e\n\u003cp\u003e场景：客户抱怨&quot;训练太累了，我坚持不下来&quot;\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：&quot;坚持就是胜利！&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e1. 区分疲劳和无聊：客户可能只是&quot;无聊&quot;。如果是无聊，换换训练形式\u003c/p\u003e\n\u003cp\u003e2. 调整强度：训练强度过大，或客户无法恢复时，适当降低强度，增加恢复时间\u003c/p\u003e\n\u003cp\u003e3. 增加变化：每周换一个训练主题（力量日、有氧日、灵活性日），让训练有新鲜感\u003c/p\u003e\n\u003cp\u003e4. 设定小目标：每次训练要求&quot;完成今天的30分钟&quot;，不要求&quot;坚持一辈子&quot;\u003c/p\u003e\n\u003cp\u003e5. 关注恢复：疲劳感太强可能是睡眠、营养没跟上，帮客户找原因而不是逼他继续\u003c/p\u003e\n\u003cp\u003e常见误区：将过度疲劳或强烈不适视为训练有效的证据。有效的计划应当安全、符合目标，并且能够长期执行。\u003c/p\u003e\n\u003ch4 id=\"ch2-s506\"\u003e3.4 计划设计\u003c/h4\u003e\n\u003cp\u003e设计运动计划时，应将客户的个人特质、环境条件和对身体活动的反应综合起来。\u003c/p\u003e\n\u003cp\u003e结合客户的个人特质、生活环境、空余时间、运动经验、消费顾虑、场地便利性、个人喜好等全部条件，设计安全、有效、适配的专属方案。\u003c/p\u003e\n\u003cp\u003e✍️小节回顾与练习第四部分：身体活动与坚持\u003c/p\u003e\n\u003cp\u003e基本原理\u003c/p\u003e\n\u003cp\u003e● 运动坚持受多种因素共同影响，包括过往运动经历等个人特质、社会支持和设施可及性等环境条件，以及训练强度、体验和损伤风险等计划因素。\u003c/p\u003e\n\u003cp\u003e● 年龄与坚持度无显著相关性，运动史是关键。了解客户&quot;过去怎么运动&quot;比&quot;现在想减多少&quot;更能预测未来。\u003c/p\u003e\n\u003cp\u003e● 配偶 / 伴侣的支持是维持运动计划最可靠的因素，教练要善用而非对抗家庭关系。\u003c/p\u003e\n\u003cp\u003e互动考题\u003c/p\u003e\n\u003cp\u003eQ：在环境因素中，以下哪项被认为是维持运动计划最可靠、最强力的支持来源？\u003c/p\u003e\n\u003cp\u003eA. 专业的健身器材\u003c/p\u003e\n\u003cp\u003eB. 手机 APP 的打卡提醒\u003c/p\u003e\n\u003cp\u003eC. 伴侣或配偶的支持\u003c/p\u003e\n\u003cp\u003eD. 丰厚的减脂奖金\u003c/p\u003e\n\u003cp\u003e答案：C\u003c/p\u003e\n\u003cp\u003e📚记忆小本：重点知识点\u003c/p\u003e\n\u003cp\u003e● 个人特质五类：人口统计变量 / 健康状况 / 运动史（最重要）/ 心理特质 / 认知态度信念\u003c/p\u003e\n\u003cp\u003e● 环境三要素：时间（天时）/ 设施便利性（地利）/ 社会支持（人和）\u003c/p\u003e\n\u003cp\u003e● 训练方案两关键：训练强度 / 运动损伤防控\u003c/p\u003e\n\u003cp\u003e● 运动史 = 个人特质中最重要的变量\u003c/p\u003e\n\u003cp\u003e● 配偶支持 = 维持运动计划最可靠的因素\u003c/p\u003e\n\u003cp\u003e● HIIT与中等强度持续训练都可以作为计划选项；具体选择应依据筛查、能力、偏好、目标和恢复状态。\u003c/p\u003e\n\u003cp\u003e💡章节小节\u003c/p\u003e\n\u003cp\u003e核心要义凝练\u003c/p\u003e\n\u003cp\u003e坚持依赖的是系统性变量的优化。\u003c/p\u003e\n\u003cp\u003e● 个人特质：运动史是预测未来坚持度的最强变量（过去练得好，未来更易坚持）；年龄与坚持度无显著相关性。\u003c/p\u003e\n\u003cp\u003e● 环境因素：时间（没时间是最常见的理由），社会支持（尤其是配偶）和设施便利性。\u003c/p\u003e\n\u003cp\u003e● 身体活动因素：强度、愉悦感、偏好、时间效率和损伤风险都会影响坚持。HIIT对部分客户可能具有吸引力，但不是通用选择。\u003c/p\u003e\n\u003cp\u003e思考与练习\u003c/p\u003e\n\u003cp\u003e● 思考题：为什么&quot;只为了减重&quot;而来的客户，在遇到平台期时最容易退训？请从个人特质中的&quot;认知与态度&quot;维度进行分析。\u003c/p\u003e\n\u003cp\u003e● 损伤风险管理是维持训练连续性的重要条件\u003c/p\u003e\n\u003ch3 id=\"ch2-s537\"\u003e学员复习专用\u003c/h3\u003e\n\u003ch4 id=\"ch2-s538\"\u003e本章收口总结\u003c/h4\u003e\n\u003ch4 id=\"ch2-s539\"\u003e本章核心回顾\u003c/h4\u003e\n\u003cp\u003e行为改变依赖的是科学的方法论（三大模型）、底层原理（操作性条件反射 + 认知干预）和系统性变量优化（个人 / 环境 / 训练），三者缺一不可。\u003c/p\u003e\n\u003ch4 id=\"ch2-s541\"\u003e知识结构\u003c/h4\u003e\n\u003cp\u003e表2-11\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e板块\u003c/th\u003e\u003cth\u003e核心内容\u003c/th\u003e\u003cth\u003e关键考点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1. 行为理论模型\u003c/td\u003e\u003ctd\u003eHBM：威胁 + 益处 &gt; 障碍 = 改变\u003c/td\u003e\u003ctd\u003eHBM 两大变量 / SDT 三需求 / TTM 五阶段四部分\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2. 行为改变原理\u003c/td\u003e\u003ctd\u003e行为被后果塑造，认知扭曲是隐形障碍\u003c/td\u003e\u003ctd\u003e四种操作性条件反射 / 认知扭曲六类 / 目标设定 / 自我监测\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3. 身体活动与坚持\u003c/td\u003e\u003ctd\u003e坚持靠系统优化，不靠意志力\u003c/td\u003e\u003ctd\u003e运动史最强预测 / 配偶最可靠 / 强度 + 损伤防控\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e每一站的逻辑是：有行为问题 → 需要理论模型指导 → 还要懂底层原理 → 最后落实到坚持因素的系统优化。\u003c/p\u003e\n\u003ch4 id=\"ch2-s544\"\u003e重点内容\u003c/h4\u003e\n\u003cp\u003e表2-12\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e#\u003c/th\u003e\u003cth\u003e考点\u003c/th\u003e\u003cth\u003e必背内容\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003eHBM 两大变量\u003c/td\u003e\u003ctd\u003e健康威胁性（自觉罹患性 + 自觉严重性）+ 健康行为益处与障碍（自觉益处 + 自觉障碍）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003eSDT 三种需求\u003c/td\u003e\u003ctd\u003e能力感知 + 自主性 + 社群性（归属感）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003eTTM 五阶段\u003c/td\u003e\u003ctd\u003e思考前（无想法无行动）→ 思考（有想法无行动，6 月内）→ 准备（有想法不定期行动）→ 行动（规律 &lt; 6 月）→ 维持（规律 ≥ 6 月）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003e自我效能 6 来源\u003c/td\u003e\u003ctd\u003e过往经验（影响最大）/ 替代性经验 / 口头说服 / 生理评价 / 情感评价 / 想象经验\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e四种操作性条件反射\u003c/td\u003e\u003ctd\u003e正强化（加好）/ 负强化（减坏）/ 消退（不给好）/ 惩罚（加坏）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003e认知扭曲 6 类型\u003c/td\u003e\u003ctd\u003e极（极端思想）/ 放（放大化 + 最小化）/ 偏（以偏概全）/ 断（妄下结论）/ 标（贴标签）/ 责（自责 / 责备他人）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e坚持运动 3 因素\u003c/td\u003e\u003ctd\u003e个人特质 / 环境因素 / 身体活动因素\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003e运动坚持最强预测变量\u003c/td\u003e\u003ctd\u003e运动史\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e9\u003c/td\u003e\u003ctd\u003e最可靠社会支持来源\u003c/td\u003e\u003ctd\u003e伴侣 / 配偶\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch2-s546\"\u003e行为改变评估自检清单\u003c/h4\u003e\n\u003cp\u003e· ☐ 客户当前处于 TTM 的哪个阶段（用&quot;想法 + 行动&quot;判断）\u003c/p\u003e\n\u003cp\u003e· ☐ 客户的健康信念模型画像：自觉罹患性 / 严重性 / 益处 / 障碍各是什么\u003c/p\u003e\n\u003cp\u003e· ☐ 客户的动机类型：自主动机为主还是受控动机为主\u003c/p\u003e\n\u003cp\u003e· ☐ 客户的自我效能水平如何，最强的来源是哪个\u003c/p\u003e\n\u003cp\u003e· ☐ 客户的运动史如何，过去有没有长期坚持过\u003c/p\u003e\n\u003cp\u003e· ☐ 客户有没有配偶 / 家人的社会支持\u003c/p\u003e\n\u003cp\u003e· ☐ 客户有没有认知扭曲的迹象（极端思想 / 以偏概全 / 等）\u003c/p\u003e\n\u003cp\u003e· ☐ 客户的训练强度偏好和损伤风险\u003c/p\u003e\n\u003cp\u003e· ☐ 决策平衡：客户觉得运动的利是否大于弊\u003c/p\u003e\n\u003cp\u003e任何一项不清楚，初次面谈时重点挖掘。\u003c/p\u003e\n\u003ch4 id=\"ch2-s557\"\u003e知识衔接\u003c/h4\u003e\n\u003cp\u003e下一章将进入有效沟通、目标设定和教学技巧。本章的行为理论模型将成为后续沟通和计划工作的理论基础：教练需要通过开放式提问了解客户的决策平衡，并以支持自主性的方式协助客户设定目标。\u003c/p\u003e\n\u003ch4 id=\"ch2-s559\"\u003e章末复习\u003c/h4\u003e\n\u003cp\u003e1. 翻回本章开头【本章核心知识点】，看三大板块、6 个关键数字、5 个缩写能否独立默写。\u003c/p\u003e\n\u003cp\u003e2. 把 TTM 五阶段和认知扭曲六类口诀合上书复述一遍，错的项回到正文重看。\u003c/p\u003e\n\u003cp\u003e3. 把行为改变评估自检清单复制到自己的教练工具包里，每个新客户初次面谈时使用。\u003c/p\u003e\n\u003cp\u003e有效的沟通、目标设定和教学技巧\u003c/p\u003e\n\u003cp\u003e第       3章\u003c/p\u003e","sections":[{"title":"第2章 行为改变的基础","anchor":"ch2-s0"},{"title":"学员预习专用","anchor":"ch2-s1"},{"title":"正文部分","anchor":"ch2-s23"},{"title":"1 行为理论模型","anchor":"ch2-s53"},{"title":"2 行为改变的原理","anchor":"ch2-s245"},{"title":"3 身体活动与坚持","anchor":"ch2-s390"},{"title":"学员复习专用","anchor":"ch2-s537"}],"paragraphCount":565},"3":{"html":"\u003ch2 id=\"ch3-s0\"\u003e第3章 有效的沟通、目标设定和教学技巧\u003c/h2\u003e\n\u003ch3 id=\"ch3-s1\"\u003e学员预习专用\u003c/h3\u003e\n\u003ch4 id=\"ch3-s2\"\u003e本章内容\u003c/h4\u003e\n\u003ch4 id=\"ch3-s3\"\u003e学习目标\u003c/h4\u003e\n\u003cp\u003e1. 理解教练与客户四大合作阶段的递进逻辑\u003c/p\u003e\n\u003cp\u003e2. 掌握每个阶段的核心任务与沟通技能要求\u003c/p\u003e\n\u003cp\u003e3. 学会运用同理心建立默契关系\u003c/p\u003e\n\u003cp\u003e4. 掌握积极倾听与动机式访谈技巧\u003c/p\u003e\n\u003cp\u003e5. 熟练运用SMART原则设定目标\u003c/p\u003e\n\u003cp\u003e6. 理解学习三阶段与三类型，提升教学效果\u003c/p\u003e\n\u003ch4 id=\"ch3-s10\"\u003e重点内容\u003c/h4\u003e\n\u003cp\u003e● ✅ 四大阶段名称与顺序：建立默契 → 探讨 → 计划 → 行动\u003c/p\u003e\n\u003cp\u003e● ✅ 同理心定义：设身处地为客户着想，换位思考\u003c/p\u003e\n\u003cp\u003e● ✅ 动机式访谈四项核心精神：合作、接纳、关怀与唤出\u003c/p\u003e\n\u003cp\u003e● ✅ OARS四大技巧：开放式问题、肯定认可、印证式倾听、内容总结\u003c/p\u003e\n\u003cp\u003e● ✅ SMART原则：具体、可测量、可实现、相关、有时限\u003c/p\u003e\n\u003cp\u003e● ✅ 学习三阶段：认知阶段、联想阶段、自主阶段\u003c/p\u003e\n\u003cp\u003e● ✅ 学习三类型：视觉型、听觉型、动觉型\u003c/p\u003e\n\u003cp\u003e● ✅ 三明治法则：先肯定→再纠错→后鼓励\u003c/p\u003e\n\u003ch4 id=\"ch3-s19\"\u003e本章核心\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 教练与客户的合作如同学会一首舞曲——从建立默契的初次相识，到探讨信息的深入了解，到计划方案的协同共创，再到行动阶段的教学落地，四个阶段循序渐进、环环相扣，默契关系贯穿始终。\u003c/p\u003e\n\u003ch4 id=\"ch3-s21\"\u003e本章知识结构\u003c/h4\u003e\n\u003cp\u003e表3-1\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e阶段\u003c/th\u003e\u003cth\u003e关键字\u003c/th\u003e\u003cth\u003e核心任务\u003c/th\u003e\u003cth\u003e沟通技能要求\u003c/th\u003e\u003cth\u003e阶段产出\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e建立默契\u003c/td\u003e\u003ctd\u003e信任\u003c/td\u003e\u003ctd\u003e建立双向信任与理解\u003c/td\u003e\u003ctd\u003e同理心、文化素养、非语言沟通\u003c/td\u003e\u003ctd\u003e客户愿意继续合作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e探讨阶段\u003c/td\u003e\u003ctd\u003e倾听\u003c/td\u003e\u003ctd\u003e收集客户信息\u003c/td\u003e\u003ctd\u003e积极倾听、动机式访谈\u003c/td\u003e\u003ctd\u003e完整的健康史问卷\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e计划阶段\u003c/td\u003e\u003ctd\u003e合作\u003c/td\u003e\u003ctd\u003e共同制定训练方案\u003c/td\u003e\u003ctd\u003e目标设定、SMART原则\u003c/td\u003e\u003ctd\u003e个性化训练计划\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e行动阶段\u003c/td\u003e\u003ctd\u003e教学\u003c/td\u003e\u003ctd\u003e执行训练方案\u003c/td\u003e\u003ctd\u003e教学技巧、反馈技能\u003c/td\u003e\u003ctd\u003e客户掌握动作技能\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch3-s23\"\u003e关键数字\u003c/h4\u003e\n\u003cp\u003e表3-2\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e数字\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e应用场景\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003e四大合作阶段\u003c/td\u003e\u003ctd\u003e本章核心框架\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e三种学习类型\u003c/td\u003e\u003ctd\u003e视觉型、听觉型、动觉型\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e三个学习阶段\u003c/td\u003e\u003ctd\u003e认知阶段、联想阶段、自主阶段\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eOARS四大技巧\u003c/td\u003e\u003ctd\u003e开放式问题、肯定认可、印证式倾听、内容总结\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eMI四大要素\u003c/td\u003e\u003ctd\u003e协作、认同、同情、唤出\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003eSMART原则五要素\u003c/td\u003e\u003ctd\u003e具体、可测量、可实现、相关、有时限\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch3-s25\"\u003e名词与缩写\u003c/h4\u003e\n\u003cp\u003e表3-3\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e缩写\u003c/th\u003e\u003cth\u003e全称\u003c/th\u003e\u003cth\u003e中文含义\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMI\u003c/td\u003e\u003ctd\u003eMotivational Interviewing\u003c/td\u003e\u003ctd\u003e动机式访谈\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOARS\u003c/td\u003e\u003ctd\u003eOpen questions, Affirmations, Reflections, Summaries\u003c/td\u003e\u003ctd\u003e开放式问题、肯定认可、印证式倾听、内容总结\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSMART\u003c/td\u003e\u003ctd\u003eSpecific, Measurable, Attainable, Relevant, Time-bound\u003c/td\u003e\u003ctd\u003e目标设定五原则\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTTM\u003c/td\u003e\u003ctd\u003eTranstheoretical Model\u003c/td\u003e\u003ctd\u003e跨理论模型/行为改变阶段模型\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch3-s27\"\u003e一图速记\u003c/h4\u003e\n\u003cp\u003e图3-1\u003c/p\u003e\n\u003ch4 id=\"ch3-s29\"\u003e学习路线\u003c/h4\u003e\n\u003cp\u003e第一步：理解框架 → 四大阶段的递进关系\n                ↓\n第二步：掌握第一阶段 → 建立默契（同理心、文化素养、非语言沟通）\n                ↓\n第三步：深入第二阶段 → 探讨阶段（积极倾听、动机式访谈）\n                ↓\n第四步：实战第三阶段 → 计划阶段（SMART原则、目标设定）\n                ↓\n第五步：落地第四阶段 → 行动阶段（教学技巧、反馈方法）\n                ↓\n第六步：综合运用 → 四个阶段的连贯与协同\u003c/p\u003e\n\u003ch4 id=\"ch3-s31\"\u003e思考与练习\u003c/h4\u003e\n\u003ch4 id=\"ch3-s32\"\u003e思考题\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 一位新客户第一次来到健身房，表达出&quot;我对运动一窍不通，怕被人笑话&quot;的顾虑。请思考：你应该处于哪个合作阶段？运用本章学习的哪些技能来应对？\u003c/p\u003e\n\u003ch4 id=\"ch3-s34\"\u003e选择题\u003c/h4\u003e\n\u003cp\u003eQ：以下关于四大合作阶段的描述，正确的是？\u003c/p\u003e\n\u003cp\u003eA. 四个阶段是有助于组织合作过程的框架，实际工作中可根据客户情况往返调整\u003c/p\u003e\n\u003cp\u003eB. 建立默契只发生在初次见面，之后就不重要了\u003c/p\u003e\n\u003cp\u003eC. 探讨阶段的核心是倾听和收集信息\u003c/p\u003e\n\u003cp\u003eD. 计划阶段可以由教练单方面制定，客户只需执行\u003c/p\u003e\n\u003cp\u003e答案：C\u003c/p\u003e\n\u003ch3 id=\"ch3-s41\"\u003e正文部分\u003c/h3\u003e\n\u003ch4 id=\"ch3-s42\"\u003e章节总述\u003c/h4\u003e\n\u003cp\u003eACE教材第四章核心内容，聚焦私人教练与客户合作的四大关系阶段。学习本章内容，能够帮助教练清晰判定与客户当下所处的合作阶段，并依据阶段核心要求，完成对应工作内容，匹配专属沟通方式与服务逻辑。\u003c/p\u003e\n\u003cp\u003e教练与客户的四大合作阶段依次为：建立默契、探讨、计划、行动。\u003c/p\u003e\n\u003cp\u003e该相处逻辑适用于所有人际交往，如同日常交友、相亲、恋爱的相处规律。\u003c/p\u003e\n\u003cp\u003e• 建立默契：合作初期，教练与客户初次相识的阶段；\u003c/p\u003e\n\u003cp\u003e● 探讨阶段：制定训练计划之前，全面采集客户个人信息的阶段；\u003c/p\u003e\n\u003cp\u003e● 计划阶段：正式开展训练前，定制专属运动方案的筹备阶段；\u003c/p\u003e\n\u003cp\u003e● 行动阶段：训练方案落地执行，开展实操教学的阶段。（详见下表）\u003c/p\u003e\n\u003cp\u003e四个阶段对于教练的沟通技能要求各有差异：\u003c/p\u003e\n\u003cp\u003e1. 建立默契阶段：核心为理解与信任；\u003c/p\u003e\n\u003cp\u003e2. 探讨阶段：核心为主动倾听，全面收集信息；\u003c/p\u003e\n\u003cp\u003e3. 计划阶段：核心为双向合作，共同制定训练方案；\u003c/p\u003e\n\u003cp\u003e4. 行动阶段：核心为教学技能，高效开展实操指导。\u003c/p\u003e\n\u003cp\u003e且默契关系并非只存在于初期，会全程贯穿探讨、计划、行动三大后续阶段，是长期合作的基础。\u003c/p\u003e\n\u003cp\u003e图3-2\u003c/p\u003e\n\u003ch4 id=\"ch3-s57\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：默契贯穿始终，探讨收集信息，计划共创方案，行动教学落地\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：四大阶段就像追对象的四个阶段：先是互相有好感（建立默契），然后深入了解对方（探讨），接着规划未来（计划），最后步入正轨（行动）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：默契是贯穿整个合作关系的&quot;氧气&quot;，需要持续供给\u003c/p\u003e\n\u003ch4 id=\"ch3-s63\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：向新学员介绍四大阶段\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;我们今天先填个表，然后我给你做个计划，之后开始训练&quot;\u003c/p\u003e\n\u003cp\u003e• 冷漠地按流程走，不解释原因\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• &quot;我会先和你聊聊，了解你的想法和顾虑，然后我们一起制定适合你的训练方案，最后开始实际练习&quot;\u003c/p\u003e\n\u003cp\u003e• 让客户了解整个合作流程，建立预期\u003c/p\u003e\n\u003ch3 id=\"ch3-s71\"\u003e1 建立默契关系阶段\u003c/h3\u003e\n\u003cp\u003e关键字：贯穿教学关系始终的信任与理解\u003c/p\u003e\n\u003ch4 id=\"ch3-s73\"\u003e一、默契关系核心定义\u003c/h4\u003e\n\u003cp\u003e默契关系，是私人教练主动与客户搭建起来的双向信任与理解，是一切训练合作的前提与根基。\u003c/p\u003e\n\u003ch4 id=\"ch3-s75\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：默契是根基，信任是桥梁，理解是钥匙\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：默契关系就像建筑的地基（看不见但最重要，决定了上层建筑能盖多高）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：没有默契，所有的专业技能都是空中楼阁\u003c/p\u003e\n\u003ch4 id=\"ch3-s79\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：初次与客户见面\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 直接开始讲解专业知识、展示自己多厉害\u003c/p\u003e\n\u003cp\u003e• 表现得像在完成销售任务\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 先花5分钟聊聊客户为什么来、有什么顾虑\u003c/p\u003e\n\u003cp\u003e• 表现出对客户的真诚兴趣\u003c/p\u003e\n\u003ch4 id=\"ch3-s87\"\u003e二、建立默契的核心：同理心\u003c/h4\u003e\n\u003cp\u003e同理心区别于同情心，同理心是教练能够站在客户角度理解其想法、感受和经历，并以此调整沟通方式。\u003c/p\u003e\n\u003cp\u003e教练永远无法百分之百体会客户的真实感受，但只要愿意站在客户视角共情，就能快速拉近关系，建立良好沟通基础。\u003c/p\u003e\n\u003cp\u003e现实中，教练常常难以理解：为何客户无法坚持运动，连简单的基础动作都难以完成。可通过自我类比实现共情：每个人都有不擅长的领域，如同教练会因为&quot;坚持运动&quot;而难以理解学员的无法坚持，但是教练们可以回忆和假想一下自己学习英语，高等数学，所体验到的困难和难以长期坚持，面对老师觉得轻而易举自己却觉得难如天书的语法知识、微积分 方程式，理解困难、学习吃力的感受，或许更能理解普通会员在学习运动、掌握动作、克服身体短板时的难处与压力。\u003c/p\u003e\n\u003ch4 id=\"ch3-s91\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：同情站着看，同理蹲下来\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：同情心是&quot;我在岸上看溺水的人&quot;，同理心是&quot;我跳进水里感受水的温度&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：同理心不是&quot;我理解你&quot;，而是&quot;我想象我在你的处境中&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s95\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：客户抱怨动作太难想放弃\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;这动作很简单啊，你怎么学不会？&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;你不努力怎么会有效果？&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• &quot;我能理解这个动作确实有难度，让我回忆一下我当初学这个动作时的感受……&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;我当初学高等数学时也是这种感觉，我懂你的挫折感。我们可以把它拆解成更小的步骤。&quot;\u003c/p\u003e\n\u003cp\u003e常见误区：\u003c/p\u003e\n\u003cp\u003e• ⚠️把同理心当成同情心（居高临下的&quot;我理解你&quot;）\u003c/p\u003e\n\u003cp\u003e• ⚠️过度共情，变成在说自己（&quot;我当年也是这样的&quot;）\u003c/p\u003e\n\u003cp\u003e• ⚠️假装理解，实际在想着怎么给建议\u003c/p\u003e\n\u003ch4 id=\"ch3-s107\"\u003e💡 关键思考\u003c/h4\u003e\n\u003cp\u003e为何同理心如此困难？\u003c/p\u003e\n\u003cp\u003e教练作为运动专家，在专业领域具有&quot;知识诅咒&quot;——我们的大脑已经自动化处理运动信息，而客户的大脑还在挣扎于最基础的动作。当教练说&quot;深蹲时重心在足中点&quot;，客户听到的是&quot;恐惧、关节脆响、怕练粗腿&quot;。我们难以跳出自己的视角去理解他人。\u003c/p\u003e\n\u003cp\u003e教练的突破方法：\u003c/p\u003e\n\u003cp\u003e1. 强制自己停顿3秒，用&quot;如果我是刚加完班、体能很差的人……&quot;来模拟客户视角\u003c/p\u003e\n\u003cp\u003e2. 主动确认：&quot;听起来你现在担心的是……对吗？&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s113\"\u003e1.1 建立默契关系的核心要素\u003c/h4\u003e\n\u003cp\u003e图3-3\u003c/p\u003e\n\u003ch4 id=\"ch3-s115\"\u003e1.1.1 文化素养\u003c/h4\u003e\n\u003cp\u003e文化素养不等同于学历，其核心定义为：拥有与不同年龄、性别、种族、民族、体型、社会经济状况、教育背景、运动能力、身体素质的人群，建立信任、高效沟通的综合能力。\u003c/p\u003e\n\u003cp\u003e多数人会本能倾向于和自身相似、观念契合的人交流，而专业私人教练，必须具备和各类差异化客户沟通相处的能力。\u003c/p\u003e\n\u003cp\u003e注意：年龄最不影响坚持度\u003c/p\u003e\n\u003cp\u003e● 实操要求：主动花时间了解客户的信仰、处事态度、价值观；\u003c/p\u003e\n\u003cp\u003e● 核心禁忌：摒弃主观偏见与刻板印象；\u003c/p\u003e\n\u003cp\u003e● 常见刻板偏见举例：默认老年人身体虚弱、肥胖人群懒惰、口音较重人群素养偏低、协调性差的学员学习能力弱、沟通方式不同的客户难以相处等；\u003c/p\u003e\n\u003cp\u003e● 负面影响：一旦被刻板印象与主观预判束缚，便无法客观了解客户，难以制定合理训练方案，直接阻碍默契关系建立。\u003c/p\u003e\n\u003ch4 id=\"ch3-s123\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：文化素养不是学历，是与谁都能聊得来的能力\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：文化素养就像调味料（能让不同的&quot;食材&quot;变成美味的&quot;菜肴&quot;）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：能和你认为&quot;最难搞&quot;的客户打交道，才是真正的专业\u003c/p\u003e\n\u003ch4 id=\"ch3-s129\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：面对不同类型的客户\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 对年长客户：&quot;您这个年纪，能动一动就很好了&quot;\u003c/p\u003e\n\u003cp\u003e• 对肥胖客户：&quot;您就是吃太多动太少&quot;\u003c/p\u003e\n\u003cp\u003e• 对年轻客户：&quot;年轻人恢复快，可以加大强度&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 了解每位客户的个人价值观和目标，而不是套用刻板印象\u003c/p\u003e\n\u003cp\u003e• 主动询问：&quot;您对这次训练的期望是什么？有什么特别关心的吗？&quot;\u003c/p\u003e\n\u003cp\u003e刻板印象自检清单：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ &quot;年纪大的客户学不会新动作&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ &quot;胖客户都是因为懒&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ &quot;女性客户不需要练力量&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ &quot;年轻客户恢复快，可以加大强度&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ &quot;有运动基础的客户不需要详细讲解&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s144\"\u003e1.1.2 第一印象\u003c/h4\u003e\n\u003cp\u003e第一印象是默契关系的开端，也是初次合作的关键契机。\u003c/p\u003e\n\u003cp\u003e教练在初次接触客户时，展现出专业的职业素养、礼貌尊重的处事态度、清晰流畅的沟通能力，能够提升客户的舒适感与好感度，为长期合作奠定基础。\u003c/p\u003e\n\u003ch4 id=\"ch3-s147\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：第一印象只有一次机会，错过了就是错过了\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：第一印象就像书的封面（决定别人有没有兴趣翻开内容）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：专业形象是信任的&quot;入门票&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s153\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e第一印象检查清单：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 仪容仪表干净整洁\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 准时到达约定的会面地点\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 主动自我介绍，态度热情但不油腻\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 眼神交流自然，避免飘忽或紧盯\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 语速适中，避免太快显得急躁\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 倾听时身体微微前倾，表现出专注\u003c/p\u003e\n\u003ch4 id=\"ch3-s161\"\u003e1.1.3 言语和非言语沟通\u003c/h4\u003e\n\u003cp\u003e沟通分为语言沟通与非语言沟通两大板块，在表达情绪、态度和建立关系时，非语言沟通会显著影响客户对教练的感受。\u003c/p\u003e\n\u003cp\u003e● 语言沟通：仅指代语言文字本身的内容；\u003c/p\u003e\n\u003cp\u003e● 非语言沟通：包含声音质量、眼神交流、面部表情、手势动作、身体姿态与位置。\u003c/p\u003e\n\u003ch4 id=\"ch3-s165\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：说什么不重要，怎么说才重要（在表达情感和态度时，非语言信号的影响力远超语言内容）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：非语言沟通就像音乐的伴奏（歌词一样，伴奏不同，感觉完全不同）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：客户记住的是你说话时的样子，比你说了什么更关键\u003c/p\u003e\n\u003cp\u003e（1）声音质量\u003c/p\u003e\n\u003cp\u003e声音质量属于非语言沟通范畴，交谈时音量需适中，避免过高或过低；等流行不适配教练职业场景的发声习惯。\u003c/p\u003e\n\u003cp\u003e教练可通过录音、录像、双人模拟对话的方式，反复练习，优化自身发声与表达状态。\u003c/p\u003e\n\u003ch4 id=\"ch3-s174\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：声音是教练的&quot;乐器&quot;，需要调校才能演奏出好听的曲子\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：教练的声音质量就像餐厅的背景音乐（太吵让人烦躁，太轻让人听不清）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：清晰、友善、稳定的音量是你的&quot;标准配置&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s178\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：日常与客户沟通\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 声音过高显得有攻击性，或过低显得没自信\u003c/p\u003e\n\u003cp\u003e• 语速过快，客户跟不上你的节奏\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 保持适中的音量，比正常对话稍大一点\u003c/p\u003e\n\u003cp\u003e• 语速适中，给客户消化信息的时间\u003c/p\u003e\n\u003cp\u003e• 练习方法：录下自己与客户的对话，回听并改进\u003c/p\u003e\n\u003cp\u003e（2）眼神交流\u003c/p\u003e\n\u003cp\u003e与客户沟通时，保持直视、温和友好，避免直勾勾紧盯对方；全程专心专注、心无旁骛，正视交流对象。\u003c/p\u003e\n\u003ch4 id=\"ch3-s189\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：眼神是心灵的窗户，别把你的窗户关上了\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：眼神交流就像跳舞（需要你来我往，而不是一方盯着另一方）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：温和的注视=尊重+关注；直勾勾的盯视=压力+不适\u003c/p\u003e\n\u003ch4 id=\"ch3-s193\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：倾听客户表达时\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 眼神飘忽，看向别处或看手机\u003c/p\u003e\n\u003cp\u003e• 直勾勾盯着客户，让对方感到压力\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 保持自然的眉眼微笑，温和注视\u003c/p\u003e\n\u003cp\u003e• 偶尔点头，表示在认真倾听\u003c/p\u003e\n\u003cp\u003e（3）面部表情\u003c/p\u003e\n\u003cp\u003e保持真诚自然的面部状态，拒绝刻意假笑、假意礼貌。客户能够敏锐察觉虚假的态度，真诚是沟通的核心关键。\u003c/p\u003e\n\u003ch4 id=\"ch3-s203\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：假笑可以骗人三分钟，骗不了一辈子\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：面部表情是教练的&quot;情绪翻译器&quot;（翻译得真不真，客户感受得到）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：真诚的表情比完美的表演更有力量\u003c/p\u003e\n\u003ch4 id=\"ch3-s207\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：面对客户的不同情绪表达\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 客户沮丧时，自己表情轻松\u003c/p\u003e\n\u003cp\u003e• 客户兴奋时，自己面无表情\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 让自己的表情与客户的情绪产生共鸣\u003c/p\u003e\n\u003cp\u003e• 真诚地表达关心和支持\u003c/p\u003e\n\u003cp\u003e（4）手势动作\u003c/p\u003e\n\u003cp\u003e倾听客户表达时，双手保持相对静止，避免随意摆动肢体、摇晃身体、指指点点等失礼行为。\u003c/p\u003e\n\u003ch4 id=\"ch3-s217\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：手势太多=不自信，手势适当=有活力，完全没有=太僵硬\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：手势就像说话时的&quot;标点符号&quot;（适当停顿有力量，太多反而干扰理解）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：倾听时，双手静止；表达时，手势辅助\u003c/p\u003e\n\u003ch4 id=\"ch3-s221\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：与客户对话中\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 双手乱动，显得紧张\u003c/p\u003e\n\u003cp\u003e• 用手指点客户，显得有攻击性\u003c/p\u003e\n\u003cp\u003e• 交叉双臂，显得有防备\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 双手自然放松在身体两侧或放在桌上\u003c/p\u003e\n\u003cp\u003e• 适度使用手势辅助表达\u003c/p\u003e\n\u003cp\u003e• 倾听时保持双手相对静止\u003c/p\u003e\n\u003cp\u003e（5）身体姿态\u003c/p\u003e\n\u003cp\u003e杜绝含胸驼背，该姿态容易传递出疲惫、厌烦的负面情绪；避免双手叉腰、身体僵硬，易产生挑衅感与距离感。\u003c/p\u003e\n\u003cp\u003e日常沟通保持开放、舒展的身体姿态，也可适度模仿客户的肢体姿态，营造轻松舒适的交流氛围。\u003c/p\u003e\n\u003cp\u003e表3-4\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e肢体语言\u003c/th\u003e\u003cth\u003e潜在意义\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e双臂交叉\u003c/td\u003e\u003ctd\u003e愤怒、反抗或无兴趣（除非客户的确觉得冷）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e脚尖指向门的方向、频繁看表\u003c/td\u003e\u003ctd\u003e感到无聊或急于离开\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e咬嘴唇\u003c/td\u003e\u003ctd\u003e紧张或不安\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e把指关节弄响\u003c/td\u003e\u003ctd\u003e安慰性习惯动作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e使用屏障物（比如手提袋、背包或公文包）\u003c/td\u003e\u003ctd\u003e个人空间被侵犯\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch3-s235\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：身体是情绪的扩音器（驼背放大疲惫，舒展放大自信）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：身体姿态就像你的&quot;个人品牌logo&quot;（站立姿势代表你的专业形象）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：开放舒展=欢迎靠近，封闭僵硬=请保持距离\u003c/p\u003e\n\u003ch4 id=\"ch3-s239\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：初次见面的站姿/坐姿\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 含胸驼背，显得疲惫\u003c/p\u003e\n\u003cp\u003e• 双手叉腰，显得有攻击性\u003c/p\u003e\n\u003cp\u003e• 身体后仰，显得傲慢\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 站立时双脚与肩同宽，重心稳定\u003c/p\u003e\n\u003cp\u003e• 坐姿时背部挺直但不僵硬\u003c/p\u003e\n\u003cp\u003e• 适度模仿客户的姿态（镜像效应），拉近距离\u003c/p\u003e\n\u003ch4 id=\"ch3-s249\"\u003e1.1.4 专业界限\u003c/h4\u003e\n\u003cp\u003e教练与客户之间必须保持清晰的边界感，维持纯粹的职业合作关系。\u003c/p\u003e\n\u003cp\u003e● 关系禁忌与核心原则：若与客户发展为亲密好友、恋爱关系，会丧失教学客观性，无法开展标准化专业指导；若双方产生恋爱关系，需立即终止教学合作；尽责不私，人际关系越亲近，越难维持训练教学的秩序与专业性。\u003c/p\u003e\n\u003cp\u003e● 私下沟通边界：尊重客户个人习惯，区分客户偏好，适配文字、语音、微信、邮件等不同沟通方式，全程保持职业分寸。\u003c/p\u003e\n\u003ch4 id=\"ch3-s253\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：专业界限就像&quot;球场边线&quot;（踩线一时爽，越位就麻烦）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：教练和客户的关系就像医生和病人（太熟了就难&quot;下刀&quot;了）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：保持专业距离不是冷漠，是为了让教学更客观\u003c/p\u003e\n\u003ch4 id=\"ch3-s257\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：与客户发展出超出工作关系的感觉时\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 假装没发现，继续正常教学\u003c/p\u003e\n\u003cp\u003e• 觉得客户&quot;应该不会吧&quot;，回避处理\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 如果感觉不对劲，及时与店长或主管沟通\u003c/p\u003e\n\u003cp\u003e• 必要时转介绍给其他教练\u003c/p\u003e\n\u003cp\u003e• 记住：恋爱关系必须立即终止合作\u003c/p\u003e\n\u003cp\u003e日常边界检查：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 与客户的沟通保持职业化\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 不在非工作时间频繁联系客户\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 不在社交媒体上与客户过于亲密互动\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 了解健身房关于师生关系的规定\u003c/p\u003e\n\u003ch4 id=\"ch3-s271\"\u003e1.2 与难以合作的客户打交道\u003c/h4\u003e\n\u003cp\u003e图3-4\u003c/p\u003e\n\u003ch4 id=\"ch3-s273\"\u003e1. 困难客户核心成因\u003c/h4\u003e\n\u003cp\u003e沟通不顺畅、配合度低、抵触情绪强的困难客户，大多源于过往负面经历：曾有运动受伤史、糟糕的健身体验，因此对运动训练、私人教练存在固有偏见，初期信任度不足。\u003c/p\u003e\n\u003ch4 id=\"ch3-s275\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：困难客户不是&quot;难搞&quot;，而是&quot;有故事&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：困难客户就像受过伤的小动物（不是不想靠近你，是曾经被伤害过）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：客户的抵触背后，往往藏着恐惧和伤痛\u003c/p\u003e\n\u003ch4 id=\"ch3-s279\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：面对不配合的客户\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;你怎么这么不配合？&quot;\u003c/p\u003e\n\u003cp\u003e• 表现出不耐烦或沮丧\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 理解抵触背后可能有过去的负面经历\u003c/p\u003e\n\u003cp\u003e• 保持耐心，给客户适应的时间\u003c/p\u003e\n\u003cp\u003e• 用专业能力一点点建立信任\u003c/p\u003e\n\u003ch4 id=\"ch3-s288\"\u003e2. 核心应对原则\u003c/h4\u003e\n\u003cp\u003e全程保持同理心，持续输出专业能力，耐心接纳客户的抵触情绪。\u003c/p\u003e\n\u003ch4 id=\"ch3-s290\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：同理心+专业能力+耐心=困难客户的解药\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：面对困难客户，你的气场决定客户的反应\u003c/p\u003e\n\u003ch4 id=\"ch3-s293\"\u003e3. 落地解决方法\u003c/h4\u003e\n\u003cp\u003e1. 精准提问引导：主动询问客户抵触的核心卡点、想要深入了解的内容；\u003c/p\u003e\n\u003cp\u003e2. 挖掘核心诉求：探寻客户对运动的真实看法，了解其心中运动的阻碍、运动的优势与顾虑；\u003c/p\u003e\n\u003cp\u003e3. 专业客观解答：依托专业知识，针对性解答客户的疑问与担忧；\u003c/p\u003e\n\u003cp\u003e4. 强化客户信任：分享同类问题客户的成功改善案例，即替代经验；结合自身专业资质、从业背景，提升客户自我效能，逐步建立信任。\u003c/p\u003e\n\u003ch4 id=\"ch3-s298\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：问清楚→挖诉求→答专业→建信任\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 类比：这四个步骤就像&quot;解锁手机&quot;（一步步输入密码，才能打开心门）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：没有建立信任之前，所有的专业建议都是空话\u003c/p\u003e\n\u003ch4 id=\"ch3-s302\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：客户表示&quot;我以前也请过私教，没什么用&quot;\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;那是那个教练不行，我不一样&quot;\u003c/p\u003e\n\u003cp\u003e• 立刻开始证明自己的能力\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• &quot;能理解，您之前一定有不愉快的经历。能和我说说是什么问题吗？&quot;\u003c/p\u003e\n\u003cp\u003e• 了解客户的过去经历，再针对性地展示你能提供的不同价值\u003c/p\u003e\n\u003ch4 id=\"ch3-s310\"\u003e4. 阶段禁忌\u003c/h4\u003e\n\u003cp\u003e在默契建立阶段，严肃说教、强行纠正客户观念、争辩反驳都毫无意义。教练需放下偏见，以了解、倾听、接纳为核心，客观看待客户的所有想法与顾虑。\u003c/p\u003e\n\u003ch4 id=\"ch3-s312\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：建立默契阶段（少说多听，像个记者而不是老师）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：在这个阶段，你的首要任务是&quot;听&quot;，而不是&quot;教&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s315\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e阶段禁忌清单：\u003c/p\u003e\n\u003cp\u003e❌ 避免行为：\u003c/p\u003e\n\u003cp\u003e• 严肃说教：&quot;你应该……&quot;\u003c/p\u003e\n\u003cp\u003e• 强行纠正：&quot;你的想法不对……&quot;\u003c/p\u003e\n\u003cp\u003e• 争辩反驳：&quot;不是这样的……&quot;\u003c/p\u003e\n\u003cp\u003e• 急于给建议\u003c/p\u003e\n\u003cp\u003e✓ 正确态度：\u003c/p\u003e\n\u003cp\u003e• 了解 &gt; 纠正\u003c/p\u003e\n\u003cp\u003e• 倾听 &gt; 说服\u003c/p\u003e\n\u003cp\u003e• 接纳 &gt; 评判\u003c/p\u003e\n\u003cp\u003e• 引导 &gt; 强迫\u003c/p\u003e\n\u003ch4 id=\"ch3-s327\"\u003e✍️小节回顾 | 第一阶段：建立默契关系\u003c/h4\u003e\n\u003ch4 id=\"ch3-s328\"\u003e基本原理\u003c/h4\u003e\n\u003cp\u003e建立默契是整个合作关系的前提。教练需运用同理心理解客户，以专业形象赢得信任，以真诚态度建立连接。注意警惕刻板印象、保持专业界限、耐心应对困难客户。\u003c/p\u003e\n\u003ch4 id=\"ch3-s330\"\u003e互动考题\u003c/h4\u003e\n\u003cp\u003eQ：一位客户说&quot;我之前请的私教总是推销课程，我不太相信你们了&quot;，你应该怎么回应？\u003c/p\u003e\n\u003cp\u003e参考答案：\u003c/p\u003e\n\u003cp\u003e• 首先共情：&quot;我能理解您的顾虑，被推销的感觉确实不舒服&quot;\u003c/p\u003e\n\u003cp\u003e• 然后了解：&quot;能告诉我之前是什么情况吗？&quot;\u003c/p\u003e\n\u003cp\u003e• 最后展示不同：&quot;我在这里会专注帮您解决问题，而不是推销课程&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s336\"\u003e记忆小本\u003c/h4\u003e\n\u003cp\u003e表3-5\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e要素\u003c/th\u003e\u003cth\u003e关键词\u003c/th\u003e\u003cth\u003e一句话\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e核心\u003c/td\u003e\u003ctd\u003e同理心\u003c/td\u003e\u003ctd\u003e设身处地，不是居高临下\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e素养\u003c/td\u003e\u003ctd\u003e文化素养\u003c/td\u003e\u003ctd\u003e能与任何人建立信任\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e形象\u003c/td\u003e\u003ctd\u003e第一印象\u003c/td\u003e\u003ctd\u003e专业、礼貌、清晰\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e沟通\u003c/td\u003e\u003ctd\u003e非语言\u003c/td\u003e\u003ctd\u003e在情感态度传递场景中，非语言信号影响显著\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e界限\u003c/td\u003e\u003ctd\u003e专业边界\u003c/td\u003e\u003ctd\u003e恋爱关系立即终止\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch3-s338\"\u003e2 探讨阶段\u003c/h3\u003e\n\u003cp\u003e关键字&quot;听&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s340\"\u003e本板块主题：探讨阶段\u003c/h4\u003e\n\u003cp\u003e探讨阶段的定义：这是私人教练与客户初步接触后，收集客户隐私信息（医疗、健康、运动史等）、了解客户内心见解、建立深入默契关系的基石阶段。\u003c/p\u003e\n\u003cp\u003e重点内容：\u003c/p\u003e\n\u003cp\u003e1. 听什么：收集信息\u003c/p\u003e\n\u003cp\u003e2. 怎么听：积极倾听技巧\u003c/p\u003e\n\u003cp\u003e3. 怎么交谈：动机式访谈 (Motivational Interviewing, MI) 的要素与技巧\u003c/p\u003e\n\u003cp\u003e4. 困难时刻如何交谈：会员交谈中透露出个人困境时的交谈技巧\u003c/p\u003e\n\u003cp\u003e唯有让客户建立安全感，主动提供有效信息，才能为后续个性化训练计划制定，提供极大支撑与便利。\u003c/p\u003e\n\u003ch4 id=\"ch3-s348\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：探讨阶段的核心在于&quot;听&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：探讨阶段就像医生问诊（问得越清楚，诊断越准确）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：在这个阶段，教练的嘴要&quot;懒&quot;，耳朵要&quot;勤&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s352\"\u003e2.1 收集信息\u003c/h4\u003e\n\u003cp\u003e明确倾听的核心内容，由教练指导客户填写生活方式与健康史问卷，全方位梳理客户信息。\u003c/p\u003e\n\u003cp\u003e图3-5\u003c/p\u003e\n\u003cp\u003e图3-6\u003c/p\u003e\n\u003cp\u003e图3-7\u003c/p\u003e\n\u003ch4 id=\"ch3-s357\"\u003e通过结合表格我们需要了解如下信息\u003c/h4\u003e\n\u003ch4 id=\"ch3-s358\"\u003e1. 当下现状\u003c/h4\u003e\n\u003cp\u003e了解客户目前的健康状态、体能水平；个人运动喜好与排斥项，以及选择运动、抗拒运动的底层原因。\u003c/p\u003e\n\u003ch4 id=\"ch3-s360\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：了解现状是&quot;拍照&quot;，拍下客户现在的样子\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ●\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：不知道客户现在在哪，怎么带他去想去的地方？\u003c/p\u003e\n\u003ch4 id=\"ch3-s364\"\u003e2. 过往经历\u003c/h4\u003e\n\u003cp\u003e梳理客户过往运动史，区分能够助力长期坚持运动的正向因素，以及阻碍运动执行的负面因素，过往运动计划中可坚持或失败的原因；明确有效执行部分与失效问题所在\u003c/p\u003e\n\u003ch4 id=\"ch3-s366\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：了解过去是&quot;查地图&quot;，看客户走过哪些路、哪些路上有坑\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：重复过去的成功，避免过去的失败\u003c/p\u003e\n\u003ch4 id=\"ch3-s369\"\u003e3. 运动好恶\u003c/h4\u003e\n\u003cp\u003e掌握客户运动习惯偏好，如晨间运动或晚间运动、独自训练或结伴训练以此深度理解客户个体特质。\u003c/p\u003e\n\u003ch4 id=\"ch3-s371\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：了解好恶是&quot;配钥匙&quot;，找到打开客户心门的正确钥匙\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：让客户做喜欢的事，更容易坚持\u003c/p\u003e\n\u003ch4 id=\"ch3-s374\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：收集信息时的提问技巧\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;你平时运动吗？&quot;（简单的是非问，无法获取深度信息）\u003c/p\u003e\n\u003cp\u003e• &quot;你有没有病史？&quot;（冰冷的问法，让客户有压力）\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 开放式问题：&quot;你能和我聊聊你对运动的看法吗？&quot;\u003c/p\u003e\n\u003cp\u003e• 先建立安全感：&quot;我问你这些问题，是为了更好地帮助你，这些信息我们会保密的&quot;\u003c/p\u003e\n\u003cp\u003e• 追问细节：&quot;你提到之前尝试过运动，能说说那次经历吗？是什么让你停止的？&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s383\"\u003e2.2 积极倾听\u003c/h4\u003e\n\u003cp\u003e积极倾听是教练必备核心能力，贯穿客户沟通全流程。\u003c/p\u003e\n\u003ch4 id=\"ch3-s385\"\u003e1. 基础环境要求\u003c/h4\u003e\n\u003cp\u003e沟通环境保持安静、私密，营造舒适的交流氛围。\u003c/p\u003e\n\u003ch4 id=\"ch3-s387\"\u003e2. 核心心态要求\u003c/h4\u003e\n\u003cp\u003e全程保持同理心，换位思考，深入了解客户全貌，为后续给出合理有效建议打下基础。\u003c/p\u003e\n\u003ch4 id=\"ch3-s389\"\u003e3. 行业普遍短板\u003c/h4\u003e\n\u003cp\u003e多数私人教练未接受过系统沟通训练，普遍存在表达欲过强、随意打断客户表述的问题。而积极倾听，需要高度专注力与专业沟通技巧。\u003c/p\u003e\n\u003ch4 id=\"ch3-s391\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：积极倾听 = 全神贯注 + 不打断 + 记重点\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：积极倾听就像&quot;调频&quot;（调到客户的频道，才能接收到他的信号）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：听是为了理解，不是为了准备回应\u003c/p\u003e\n\u003ch4 id=\"ch3-s395\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：客户在说话时\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 客户还没说完就插嘴：&quot;你说的我懂……&quot;\u003c/p\u003e\n\u003cp\u003e• 眼神飘忽，在想下一句怎么回\u003c/p\u003e\n\u003cp\u003e• 假装在听，实际上在刷手机\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 保持眼神接触，微微点头\u003c/p\u003e\n\u003cp\u003e• 记录关键信息（不是用手机，是用脑子或笔记本）\u003c/p\u003e\n\u003cp\u003e• 等客户说完再回应\u003c/p\u003e\n\u003cp\u003e• 安静，真诚，避免&quot;爹&quot;味\u003c/p\u003e\n\u003ch4 id=\"ch3-s406\"\u003e4. 积极倾听行为准则\u003c/h4\u003e\n\u003cp\u003e切勿假装倾听，刻意敷衍会被客户察觉，既会遗漏关键信息，也会降低客户信任；不要提前构思回话内容，更不要思绪游离、精神涣散。\u003c/p\u003e\n\u003cp\u003e我们要将自己定位为专业的信息收集者，围绕前文梳理的倾听核心内容，主动引导客户表达，系统梳理、整合有效信息。\u003c/p\u003e\n\u003ch4 id=\"ch3-s409\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：假装倾听三秒钟，客户能感受十分钟\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：真诚是最好的倾听技巧\u003c/p\u003e\n\u003ch4 id=\"ch3-s412\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e积极倾听检查清单：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 手机静音或放在一边\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 身体面向客户，微微前倾\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 不打断客户\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 用点头、&quot;嗯&quot;等反馈表示在听\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 客户说完后，复述确认关键信息\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 不提前构思回话\u003c/p\u003e\n\u003ch4 id=\"ch3-s420\"\u003e2.3 动机式访谈\u003c/h4\u003e\n\u003cp\u003e日常沟通中，常有一类客户：因家人、医生催促被动运动，自身运动意愿薄弱，对于是否开启训练充满矛盾。即便清楚运动的各项益处，依旧难以付诸行动。\u003c/p\u003e\n\u003cp\u003e面对此类人群，不能强硬催促、单向说服，这时就需要用到动机式访谈。\u003c/p\u003e\n\u003cp\u003e动机式访谈最初专为成瘾行为矫正、心理干预场景设计，适用于人们面临高难度、高挑战的行为改变场景，完全适配健身教练的工作场景，且与行为改变模型TTM中思考阶段高度契合。\u003c/p\u003e\n\u003ch4 id=\"ch3-s424\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：动机式访谈 = 引导，不是说服\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：动机式访谈就像“点燃火种”，帮助客户发现自身改变动力。\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：让人改变的永远是他自己的动机，而非外部的道理\u003c/p\u003e\n\u003ch4 id=\"ch3-s428\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：面对犹豫不决的客户\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;你应该运动，对身体好&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;你看你这体重，不运动怎么行&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;我这是为你好，你怎么不听&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• &quot;运动对你来说意味着什么？&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;你身边有没有通过运动改变很大的人？&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;如果有一天你开始运动了，你希望自己的生活有什么不同？&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s438\"\u003e（一）动机式访谈核心逻辑\u003c/h4\u003e\n\u003cp\u003e传统沟通模式中，教练如同手握方向盘，直接告知客户该做什么、怎么做，属于指令式沟通；但真正能长久践行的选择，往往是自我主观决定的结果。他人强行要求的事，很难长期坚持；\u003c/p\u003e\n\u003cp\u003e动机式访谈为引导式沟通，不直接灌输结论、下达指令，依托默契的信任关系，通过鼓励、支持与正向协助，循序渐进引导客户自主思考。\u003c/p\u003e\n\u003cp\u003e我们可以思考：动机式访谈的核心理念：对抗式沟通、强硬说教、道德绑架、专制灌输，大多毫无作用。健身教练普遍缺乏该板块专业学习，也是日常客户沟通中普遍缺失的关键能力。\u003c/p\u003e\n\u003ch4 id=\"ch3-s442\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：指令式 = 推车，推一下动一下；引导式 = 铺路，让客户自己跑起来\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：强推无效，引导才有效\u003c/p\u003e\n\u003ch4 id=\"ch3-s445\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e无效预警：别成为你最讨厌的人\u003c/p\u003e\n\u003cp\u003e❌ 禁用方式：\u003c/p\u003e\n\u003cp\u003e• 对抗式沟通：&quot;你不运动就会怎样怎样&quot;\u003c/p\u003e\n\u003cp\u003e• 强硬说教：&quot;你应该/必须/不得不&quot;\u003c/p\u003e\n\u003cp\u003e• 道德绑架：&quot;你都花了钱，不练对不起谁&quot;\u003c/p\u003e\n\u003cp\u003e• 专制灌输：&quot;听我的没错&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确方式：\u003c/p\u003e\n\u003cp\u003e• 提问引导\u003c/p\u003e\n\u003cp\u003e• 协作解决\u003c/p\u003e\n\u003cp\u003e• 肯定支持\u003c/p\u003e\n\u003ch4 id=\"ch3-s456\"\u003e（二）动机式访谈核心框架\u003c/h4\u003e\n\u003ch4 id=\"ch3-s457\"\u003e1. 四项核心精神：合作、接纳、关怀与唤出\u003c/h4\u003e\n\u003cp\u003e● 协作：教练与客户是双向共舞的合作关系。客户是训练计划的最终执行者，必须全程参与方案制定与沟通。一旦客户丧失主体意识，完全依赖教练，不仅沟通效率低下，教学推进也会举步维艰。\u003c/p\u003e\n\u003cp\u003e● 接纳：教练保持同理心与尊重，承认客户的个体差异和自主选择，不以自己的价值观评判或强迫客户。\u003c/p\u003e\n\u003cp\u003e● 关怀（compassion）：以客户的福祉为出发点，理解其处境和困难，避免把教练本人的价值观强加给客户。这里的compassion强调积极关怀，不等同于居高临下的怜悯。\u003c/p\u003e\n\u003cp\u003e● 唤出：引导客户自主说出改变的想法与诉求，而非直接告知答案、强行灌输理念。过度指点与说教，只会引发抵触心理。\u003c/p\u003e\n\u003cp\u003e图3-8\u003c/p\u003e\n\u003ch4 id=\"ch3-s463\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：合作是共同工作，接纳是尊重自主选择，关怀是以客户福祉为先，唤出是引导客户说出自己的改变理由。\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：四大要素就像&quot;四轮驱动&quot;（四个轮子一起转，车才能跑起来）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：动机式访谈以合作、接纳、关怀和唤出为基础，通过沟通帮助客户明确自己的改变理由与方向。\u003c/p\u003e\n\u003ch4 id=\"ch3-s467\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e四大要素自检：\u003c/p\u003e\n\u003cp\u003e协作检查：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我是在问问题让客户思考，不是在给答案\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 客户有参与对话，不是只听我说\u003c/p\u003e\n\u003cp\u003e认同检查：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我尊重客户的价值观和选择\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我没有评判客户的犹豫\u003c/p\u003e\n\u003cp\u003e同情检查：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我站在客户的角度思考\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我没有把自己的想法强加给客户\u003c/p\u003e\n\u003cp\u003e唤出检查：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 改变的想法来自客户自己\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我没有直接告诉客户应该怎么做\u003c/p\u003e\n\u003ch4 id=\"ch3-s481\"\u003e2. 四大核心技巧：OARS\u003c/h4\u003e\n\u003cp\u003e即开放式问题(Open questions)、肯定认可(Affirmations)、印证式倾听(Reflections)、内容总结(Summaries)。\u003c/p\u003e\n\u003cp\u003e● 开放式问题：不设置简单是非类问答，提问需要引导客户输出详细内容，从中挖掘高价值信息。\u003c/p\u003e\n\u003ch4 id=\"ch3-s484\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：开放式问题 = 问答题，封闭式问题 = 是非题\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：开放式问题是&quot;打开的门&quot;，封闭式问题是&quot;关上的门&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：多问&quot;什么&quot;和&quot;怎么&quot;，少问&quot;是不是&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s488\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e开放式 vs 封闭式对比：\u003c/p\u003e\n\u003cp\u003e❌ 封闭式（避免）：\u003c/p\u003e\n\u003cp\u003e• &quot;你今天感觉怎么样？&quot;（是/否回答）\u003c/p\u003e\n\u003cp\u003e• &quot;你有运动习惯吗？&quot;（是/否回答）\u003c/p\u003e\n\u003cp\u003e• &quot;你确定要开始训练吗？&quot;（是/否回答）\u003c/p\u003e\n\u003cp\u003e✓ 开放式（推荐）：\u003c/p\u003e\n\u003cp\u003e• &quot;你今天感觉怎么样？能和我多说说吗？&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;你能告诉我你之前尝试运动时的经历吗？&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;对于开始训练，你心里在想什么？&quot;\u003c/p\u003e\n\u003cp\u003e● 肯定认可：关注客户行为的积极面，给予正向肯定。摒弃&quot;打着为你好&quot;的打压式沟通，避免负面否定，保护客户自我认同感。\u003c/p\u003e\n\u003ch4 id=\"ch3-s499\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：肯定认可 = 给客户&quot;加油&quot;，不是&quot;泼冷水&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：客户需要被鼓励，不被否定\u003c/p\u003e\n\u003ch4 id=\"ch3-s502\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：客户分享了尝试运动但失败的经历\u003c/p\u003e\n\u003cp\u003e❌ 错误回应：\u003c/p\u003e\n\u003cp\u003e• &quot;那你为什么没坚持下来？&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;失败了你还想再试？&quot;\u003c/p\u003e\n\u003cp\u003e✓ 正确回应：\u003c/p\u003e\n\u003cp\u003e• &quot;我注意到你之前有尝试过，这说明你有想要改变的心&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;你已经迈出了第一步，这需要勇气&quot;\u003c/p\u003e\n\u003cp\u003e● 印证式倾听：单一连续提问会形成审讯感，容易引发反感。提问后，及时复述、梳理、确认客户的表述内容，让客户感受到被理解、被尊重。\u003c/p\u003e\n\u003ch4 id=\"ch3-s511\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：印证式倾听 = &quot;我听到了+我理解了&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：印证式倾听就像&quot;回声&quot;（你说，我重复确认）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：复述让客户感到&quot;你真的在听&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s515\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e印证式倾听话术示例：\u003c/p\u003e\n\u003cp\u003e客户说：&quot;我之前请过私教，但感觉他总是很忙，每次课都匆匆忙忙的，我问的问题也没时间回答……&quot;\u003c/p\u003e\n\u003cp\u003e印证回应：&quot;听起来，你之前有过一次不太愉快的私教体验（教练太忙，没有给你足够的关注和解答。这让你对教练有了更高的期待，也更谨慎了）。对吗？&quot;\u003c/p\u003e\n\u003cp\u003e● 内容总结：沟通尾声，整合多段印证内容，对整场对话信息进行归纳梳理，统一核心共识。\u003c/p\u003e\n\u003ch4 id=\"ch3-s520\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：总结 = 收尾 + 确认 + 共识\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：好的总结让客户感觉&quot;被理解了&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s523\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e总结话术示例：\u003c/p\u003e\n\u003cp\u003e&quot;让我们来梳理一下今天聊的内容：你之前有过不愉快的私教经历，所以现在更看重教练的关注度；你希望在减重的同时，不影响日常工作；你每天早上有时间运动，但担心强度太大。坚持方面你之前失败过，主要是因为目标太激进。我们今天的发现，对你接下来制定计划会有帮助。&quot;\u003c/p\u003e\n\u003cp\u003e图3-9\u003c/p\u003e\n\u003cp\u003e图3-10\u003c/p\u003e\n\u003ch4 id=\"ch3-s528\"\u003e（三）动机式访谈执行步骤\u003c/h4\u003e\n\u003cp\u003e第一步，建立默契与信任关系；\u003c/p\u003e\n\u003cp\u003e第二步，逐步引导客户锁定一个或多个改变目标；\u003c/p\u003e\n\u003cp\u003e第三步，深度诱发动机，激发客户自主改变的内在意愿，引导客户主动表达改变需求；\u003c/p\u003e\n\u003cp\u003e第四步，结合诉求，共同制定专属执行计划。\u003c/p\u003e\n\u003ch4 id=\"ch3-s533\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：MI四步 = 建信任→定目标→诱动机→定计划\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：动机源于客户自身，教练的作用是唤出\u003c/p\u003e\n\u003ch4 id=\"ch3-s536\"\u003e（四）访谈核心价值与教练认知\u003c/h4\u003e\n\u003cp\u003e动机式访谈是教练的高阶必备技能，能够让客户获得尊重感。很多教练习惯直接输出专业知识、给出训练建议，看似高效，实则欲速则不达。\u003c/p\u003e\n\u003cp\u003e单纯分享专业知识，是沟通中的&quot;偷懒行为&quot;。合格的教练，需要刻意克制自我表达欲与分享欲，耐心引导会员自主表达诉求、梳理想法，帮助客户重塑主体意识，这也是推动客户长期坚持改变的关键。因此，教练需主动深耕学习沟通技巧。\u003c/p\u003e\n\u003ch4 id=\"ch3-s539\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：给答案 = 偷懒，引导思考 = 专业\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：最省事的教练，是最无效的教练\u003c/p\u003e\n\u003ch4 id=\"ch3-s542\"\u003e2.4 对难以处理的披露的回应\u003c/h4\u003e\n\u003cp\u003e沟通中可能出现伤病、人生变故、情绪困扰或其他难以处理的披露。教练应在同理回应的同时判断信息是否涉及即时安全、医疗或心理健康风险，并按执业范围采取相应措施。\u003c/p\u003e\n\u003ch4 id=\"ch3-s544\"\u003e1. 同理回应：专注倾听，反映客户的感受和重点，不以好奇心追问无关细节。若涉及即时危险、自伤他伤风险或需要专业评估的问题，应优先采取安全措施并转介。\u003c/h4\u003e\n\u003ch4 id=\"ch3-s545\"\u003e2. 确认下一步：在客户愿意且安全风险已得到妥善处理的前提下，再将沟通平稳带回运动目标。超出教练执业范围的问题应由合资格专业人员接手。\u003c/h4\u003e\n\u003cp\u003e补充转介原则：若客户存在严重基础疾病、重大医学隐患、重度情绪问题、饮食失调、抑郁症等特殊情况，教练不可擅自干预，需及时做好专业转介，规避风险。\u003c/p\u003e\n\u003ch4 id=\"ch3-s547\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：负面信息处理 = 共情+简短+转话题+必要时转介\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：教练是健身专家，不是心理医生\u003c/p\u003e\n\u003ch4 id=\"ch3-s550\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e负面信息应对话术：\u003c/p\u003e\n\u003cp\u003e客户说：&quot;我最近离婚了，真的没心情运动……&quot;\u003c/p\u003e\n\u003cp\u003e❌ 错误回应：\u003c/p\u003e\n\u003cp\u003e• &quot;那更要运动啊，运动能改善心情！&quot;\u003c/p\u003e\n\u003cp\u003e• &quot;我理解你，我也有这种情况……&quot;（变成在说你自己）\u003c/p\u003e\n\u003cp\u003e• &quot;那你今天先休息吧&quot;（过度照顾，放任客户逃避）\u003c/p\u003e\n\u003cp\u003e✓ 正确回应：\u003c/p\u003e\n\u003cp\u003e• &quot;我能理解这种感受一定很不容易……（共情停顿）如果你愿意的话，我们可以先从很轻松的内容开始，不用给自己太大压力。你觉得呢？&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s559\"\u003e💡 关键思考\u003c/h4\u003e\n\u003cp\u003e为何动机式访谈对教练如此困难？\u003c/p\u003e\n\u003cp\u003e教练具备专业知识，因此很容易直接给出答案。然而，单向说教可能引发抵触，也不利于客户建立自主动机。动机式访谈强调唤出客户自身的改变语句，再在获得允许后提供相关信息或建议。\u003c/p\u003e\n\u003cp\u003e教练的突破方法：\u003c/p\u003e\n\u003cp\u003e1. 刻意练习&quot;闭嘴&quot;：问完问题后，忍住不给建议\u003c/p\u003e\n\u003cp\u003e2. 把&quot;给建议&quot;改成&quot;问问题&quot;\u003c/p\u003e\n\u003cp\u003e3. 记住：客户的改变动机，是他自己的，不是你给的\u003c/p\u003e\n\u003ch4 id=\"ch3-s566\"\u003e✍️小节回顾 | 第二阶段：探讨阶段\u003c/h4\u003e\n\u003ch4 id=\"ch3-s567\"\u003e基本原理\u003c/h4\u003e\n\u003cp\u003e探讨阶段的核心是&quot;听&quot;和&quot;引导&quot;。教练通过积极倾听收集信息，通过动机式访谈引导客户自主思考和表达。改变的动力来自客户内心，教练负责激发而非推动。\u003c/p\u003e\n\u003ch4 id=\"ch3-s569\"\u003e互动考题\u003c/h4\u003e\n\u003cp\u003eQ：一位客户说&quot;我知道运动好，但是我就是懒得动&quot;，请使用动机式访谈技巧设计一段沟通。\u003c/p\u003e\n\u003cp\u003e参考答案：\u003c/p\u003e\n\u003cp\u003e• 开放式问题：&quot;你能和我说说&#x27;懒得动&#x27;具体是什么感觉吗？&quot;\u003c/p\u003e\n\u003cp\u003e• 肯定：&quot;我注意到你其实知道运动好，这说明你对健康是有关注的&quot;\u003c/p\u003e\n\u003cp\u003e• 印证倾听：&quot;听起来，你不是不想运动，而是找不到动力，对吗？&quot;\u003c/p\u003e\n\u003cp\u003e• 唤出：&quot;如果有一天你开始想动了，你希望生活会有什么不同？&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s576\"\u003e记忆小本\u003c/h4\u003e\n\u003cp\u003e表3-6\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e概念\u003c/th\u003e\u003cth\u003e关键词\u003c/th\u003e\u003cth\u003e一句话\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e积极倾听\u003c/td\u003e\u003ctd\u003e专注+不打断\u003c/td\u003e\u003ctd\u003e假装倾听会被识破\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e动机式访谈\u003c/td\u003e\u003ctd\u003e引导+协作\u003c/td\u003e\u003ctd\u003e动机源于客户自身，教练负责唤出\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOARS\u003c/td\u003e\u003ctd\u003e问+肯+听+总\u003c/td\u003e\u003ctd\u003e开放式、肯定、印证、总结\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMI四要素\u003c/td\u003e\u003ctd\u003e协作、认同、同情、唤出\u003c/td\u003e\u003ctd\u003e四轮驱动缺一不可\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e负面信息\u003c/td\u003e\u003ctd\u003e共情+转话题\u003c/td\u003e\u003ctd\u003e教练不是心理医生\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch3-s578\"\u003e3 计划阶段\u003c/h3\u003e\n\u003cp\u003e完成信息采集后，正式进入计划阶段，此时客户即将准备开启训练。\u003c/p\u003e\n\u003cp\u003e本阶段核心为双向合作，教练不可单方面制定训练方案，需与客户充分沟通、协同配合，结合客户的身体基础、目标诉求、接受程度，共同定制个性化、可落地、适配性强的运动训练计划，保障计划的合理性与执行性。\u003c/p\u003e\n\u003cp\u003e计划阶段是承上启下的关键阶段，衔接前期沟通准备与后期正式行动。在这一阶段，教练可发挥更积极的作用，但积极性需建立在持续倾听、主动获取客户意见、与客户共同设计计划的基础上。核心要求是，计划需由教练与客户协同完成，以此提升客户的计划坚持度，为后续行动落地奠定基础。\u003c/p\u003e\n\u003ch4 id=\"ch3-s582\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：计划阶段 = 双向共舞，不是独角戏\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：计划就像婚礼策划（新郎新娘一起定，不能只有一方说了算）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：客户参与制定的计划，才是客户愿意执行的计划\u003c/p\u003e\n\u003ch4 id=\"ch3-s586\"\u003e计划阶段的核心步骤\u003c/h4\u003e\n\u003cp\u003e计划阶段主要包含四个核心步骤，依次为：设定目标、讨论备选方案、制定计划、评估计划。各步骤环环相扣，需结合客户实际情况灵活推进。\u003c/p\u003e\n\u003cp\u003e图3-11\u003c/p\u003e\n\u003ch4 id=\"ch3-s589\"\u003e3.1 设定目标\u003c/h4\u003e\n\u003cp\u003e设定目标是行为改变的核心过程，也是所有计划的核心组成部分，直接影响客户的行动动力与坚持度。设定目标需遵循以下五个核心要点：\u003c/p\u003e\n\u003cp\u003e1. 避免目标过多，聚焦核心目标，避免多目标分散精力，影响执行效果；\u003c/p\u003e\n\u003cp\u003e2. 避免设定负向目标，以正向引导为主，引导客户树立积极的行动导向；\u003c/p\u003e\n\u003cp\u003e3. 短期目标与长期目标相结合，让客户在每次锻炼中都能实现短期小目标，积累成功体验，逐步向长期目标推进；\u003c/p\u003e\n\u003cp\u003e4. 引导客户主动参与目标设定，充分尊重客户意愿，最大化实现理想效果；\u003c/p\u003e\n\u003cp\u003e5. 定期重审目标，这是提升客户坚持度的关键，目标需根据客户实际情况动态调整，确保其合理性与可行性。\u003c/p\u003e\n\u003ch4 id=\"ch3-s596\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：目标设定五要点：不多、不丧、长短合、双方定、定期审\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：好目标是灯塔，照亮方向；坏目标是枷锁，压垮动力\u003c/p\u003e\n\u003ch4 id=\"ch3-s599\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：帮助客户设定目标\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;你的目标是什么？减重？好，那就每天跑步1小时&quot;\u003c/p\u003e\n\u003cp\u003e• 设定的目标太多，一次性全压给客户\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 问清楚背后的原因：&quot;减重是为了什么？是为了健康，还是为了穿衣服好看？&quot;\u003c/p\u003e\n\u003cp\u003e• 一次聚焦1-2个核心目标\u003c/p\u003e\n\u003cp\u003e• 设定正向目标：&quot;每周完成3次30分钟的中等强度运动&quot;而不是&quot;不要偷懒&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s608\"\u003e目标设定理论\u003c/h4\u003e\n\u003cp\u003e一个有效的目标能带来好的4个正向结果\u003c/p\u003e\n\u003cp\u003e心理学家Advanelok与Gary Lanthom的研究表明，有效的目标设定通过四个核心机制提高个体的行为，这为教练开展目标设定工作提供了理论支撑：\u003c/p\u003e\n\u003cp\u003e1. 引导注意力：目标能让个体在特定时期聚焦核心任务，并预留固定时间用于与训练相关的活动，避免精力分散；\u003c/p\u003e\n\u003cp
