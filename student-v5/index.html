ext":"许静有2型糖尿病，近半年运动不规律，药物信息此前不完整；又报告最近走路时脚部感觉异常，情况未经医生评估。","objective":"跨特殊客户章节识别风险，分清教练能做的记录、调整和医疗协作。","questions":[{"quote":"“我觉得血糖控制得还可以，能不能不用告诉医生我最近脚有点麻？”","ask":"如何回应新的感觉异常与既有糖尿病背景？","guide":"不诊断麻木原因；糖尿病伴新发足部感觉改变需要医疗评估，暂停可能增加足部风险的训练。","rubric":"识别新症状｜不自行诊断｜及时医疗协作与训练暂停/调整","model":"“脚部新的麻木值得尽快让医生评估。我不能判断原因，在明确建议前先不安排可能加重足部负担的运动。”"},{"quote":"“我才46岁，又不是老人，为什么你要考虑我的身体状况这么多？”","ask":"如何说明训练个体化依据，而不使用年龄刻板印象？","guide":"训练依据实际功能、疾病状况、运动经验与目标；年龄本身不能替代评估。","rubric":"避免年龄标签｜说明个体因素｜尊重客户选择","model":"“我们看的是每个人当前的活动能力、健康情况和目标。你的情况需要确认一些具体信息，和‘年龄大不大’没有直接对应关系。”"},{"quote":"“如果只是运动时脚不舒服，是不是换双鞋就行？”","ask":"教练应如何处理可能的肌骨与感觉症状，并解释鞋具建议的界限？","guide":"新发麻木不能被鞋具替代诊断；教练可以记录触发情况，尽快建议评估。","rubric":"不只凭鞋具处理｜记录位置/时间/诱因｜说明转介和后续沟通","model":"“鞋子舒不舒服值得记录，但不能据此解释脚麻。我们先记录什么时候出现、在哪个部位，建议就医确认，再决定如何恢复运动安排。”"}],"carry":"许静尚不能进入以步行负荷进阶为主的常规方案；等待医疗评估信息。","safety":"新发感觉异常及可能并发症需及时专业评估，不能以课程案例替代医疗诊断。"},{"day":20,"client":"C03","chapter":"Ch1–9","source":"第1–9章｜综合Workbook与独立案例分析","context":"陈岚的案例始终存在一个前提：只有医生明确允许某种运动及强度，教练才能依该范围设计活动。现在学员需要提交完整“条件化”计划。","objective":"提交同时包含风险边界、行为策略、条件化处方、监测和停止标准的综合方案。","questions":[{"quote":"“你能把我的计划直接做成三个月的吗？我不想每周都问医生。”","ask":"写出方案中哪些部分可以先规划，哪些必须等待医疗信息更新。","guide":"可以规划随访结构和目标，不可自行扩张未明确的医学许可范围。","rubric":"区别可计划与条件依赖｜明确复核时间｜不替代医疗随访","model":"“我们可以先列目标、记录方式和阶段复盘节点；实际训练类型与强度必须在医生明确建议及你的症状变化范围内确定。”"},{"quote":"“我觉得自己越来越有信心了，为什么还要记录每次训练？”","ask":"解释监测记录在安全、进阶和自我效能上的不同作用。","guide":"记录不仅检查完成量，还让客户看到稳定进步，捕捉不适与调整需要。","rubric":"提出至少三类记录｜与客户目标关联｜保留客观趋势","model":"“记录活动时间和主观强度帮助我们调整训练；记录症状和恢复帮助安全判断；完成次数也能让你看到自己建立习惯的过程。”"},{"quote":"“如果某天又不舒服了，我是继续练到习惯，还是先停？”","ask":"写出清晰的停止与转介原则，以及如何向组长报告。","guide":"胸部不适等警示症状应停止活动并寻求及时医疗帮助；急性严重症状需急救。","rubric":"明确停止阈值｜区分紧急处理｜报告事实不作诊断","model":"“出现胸部不适等异常反应应立即停止并寻求医疗评估；若是严重或持续胸痛、气促、晕厥等应呼叫急救。记录时间和活动情境，及时通知负责人员。”"}],"carry":"本次综合作业交组长批改；正确的条件化方案不等于医学批准。","safety":""},{"day":21,"client":"C02","chapter":"Ch1–9","source":"综合复习｜专业判断、沟通与后续计划","context":"周航完成三周案例练习。他希望把结营计划发给新客户，同时反思肩部不适、训练进阶和成绩承诺的处理。","objective":"对三周决策进行复盘，写出下一阶段可检验的学习目标。","questions":[{"quote":"“开始时我只想加重量，现在我知道恢复也重要，你觉得我进步在哪？”","ask":"总结他的认识变化，提出可测量的后续训练指标。","guide":"区分知识认识、执行能力与实际训练成绩。","rubric":"指出行为认知变化｜列出可追踪指标｜不夸大效果","model":"“你开始关注训练日志、动作质量和恢复，这为科学调整提供了依据。下一阶段继续跟踪计划完成率、相同条件下的表现和恢复反应。”"},{"quote":"“肩膀如果还不舒服，我能不能自己给它诊断一下再练？”","ask":"重申Ch1与Ch9的职业边界，并写出安全下一步。","guide":"教练无法进行病因诊断，持续不适应由合资格专业人员评估，训练按建议调整。","rubric":"跨章节联系执业边界和肌骨症状｜及时转介｜记录调整","model":"“持续肩部不适需要专业评估；我们先暂停诱发不适的高负荷动作，记录诱发因素，之后根据结果调整训练。”"},{"quote":"“我想让你对下一期的学生说说这个课程到底学到了什么。”","ask":"用一个真实的决策链总结本次案例，不得用空泛口号。","guide":"完整流程应为：目标和边界→行为阶段与沟通→筛查→处方→监测调整。","rubric":"明确顺序｜提供至少一个案例证据｜承认未解决的不确定性","model":"“我们从不能保证某个成绩开始，先弄清目标和风险；通过记录发现训练量与恢复不匹配，再调整进阶。肩部不适原因仍未明，需要专业评估。”"}],"carry":"结营报告应保留尚未解决的问题和后续学习/医疗协作任务。","safety":""}]};
</script>
<script>
(() => {
'use strict';
const DAYS=window.ACEP_V5.days, CARDS=window.ACEP_V5.cards, BOOK=window.ACEP_V5.book;
const SCENES=window.ACEP_V5.scenes, CLIENTS=window.ACEP_V5.clients;
const sceneByDay=Object.fromEntries(SCENES.map(s=>[s.day,s]));
const clientById=Object.fromEntries(CLIENTS.map(c=>[c.id,c]));
const $=(q,root=document)=>root.querySelector(q);
const root=$('#root');
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeJSON=o=>JSON.stringify(o).replace(/</g,'\\u003c').replace(/>/g,'\\u003e');
const pad=n=>String(n).padStart(2,'0');
const taskLabels=['理解今日学习目标','阅读指定教材','完成课程 / 小组活动','完成10张复习卡','完成今日客户情境','学习笔记与任务收尾'];
const taskDescriptions=['确认今天要解决的专业问题','教材按需展开，避免全文挤满首页','记录一次真正的学习活动或组内讨论','逐张回答，保留需要再复习的内容','逐题分析客户原话，提交组长评核包','保存个人总结，生成ACEpresso学习卡'];
const taskIds=['goal','read','activity','cards','case','notes'];
const demoKey=name=>'acepresso_v5_student_'+name.trim().toLowerCase();
let name='',data={},route='today',day=1,activeStep='goal',cardIndex=0,flipped=false,caseIndex=0,currentChapter=1,openBook=false;
const blank=()=>({goals:{},read:{},activity:{},activityConfirmed:{},ratings:{},answers:{},submitted:{},notes:{},noteConfirmed:{},reviews:{},exported:{},lastDay:1,groupNotes:{}});
function hydrate(){let saved=null;try{saved=JSON.parse(localStorage.getItem(demoKey(name))||'null')}catch{}data=Object.assign(blank(),saved||{});for(const k of Object.keys(blank())) if(typeof blank()[k]==='object' && !data[k])data[k]={};day=Math.max(1,Math.min(21,Number(data.lastDay)||1));activeStep=nextStep(day);}
function persist(){data.lastDay=day;try{localStorage.setItem(demoKey(name),JSON.stringify(data))}catch(e){console.warn('本机保存空间不足',e)}}
function dayInfo(n){return DAYS[n-1]}
function scene(n){return sceneByDay[n]}
function ratings(n){return data.ratings[n]||{}}
function answers(n){return data.answers[n]||{}}
function done(n,id){switch(id){case 'goal':return !!data.goals[n];case 'read':return !!data.read[n];case 'activity':return !!data.activityConfirmed[n] && String(data.activity[n]||'').trim().length>=20;case 'cards':return Object.keys(ratings(n)).length>=10;case 'case':return !!data.submitted[n];case 'notes':return !!data.noteConfirmed[n] && String(data.notes[n]||'').trim().length>=30;default:return false}}
function nDone(n){return taskIds.filter(t=>done(n,t)).length}
function dayComplete(n){return nDone(n)===6}
function nextStep(n){return taskIds.find(x=>!done(n,x))||'notes'}
function completedDays(){return DAYS.filter(d=>dayComplete(d.day)).length}
function notify(msg){const old=$('.notice-toast');if(old)old.remove();let d=document.createElement('div');d.className='notice-toast';d.textContent=msg;Object.assign(d.style,{position:'fixed',zIndex:50,right:'18px',bottom:'18px',background:'#20211f',color:'white',padding:'12px 17px',borderRadius:'10px',maxWidth:'310px',boxShadow:'0 8px 28px #0005'});document.body.append(d);setTimeout(()=>d.remove(),2900)}
function downloadFile(name,content,type='text/plain;charset=utf-8'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1200)}
function openDay(n,step){day=n;activeStep=step||nextStep(n);cardIndex=0;caseIndex=0;flipped=false;openBook=false;currentChapter=chaptersForDay(n)[0]||1;route='today';persist();render();window.scrollTo({top:0,behavior:'smooth'});}
function goto(which){route=which;render();window.scrollTo({top:0,behavior:'smooth'});}
function currentPageLabel(){return ({today:'今日学习',path:'21天学习路径',group:'我的学习小组',portfolio:'我的学习档案'})[route]}
function commonHeader(){const finished=completedDays();$('#studentName').textContent=name;$('#topLabel').textContent=currentPageLabel();$('#side-progress-text').textContent=finished+' / 21 天完成';$('#side-progress-fill').style.width=(finished/21*100)+'%';document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===route));$('#sidebar').classList.remove('open');}
function taskStatus(n,t){return done(n,t)?'已完成':activeStep===t?'正在进行':'待完成'}
function chaptersForDay(n){const str=String(dayInfo(n).chapters||'');const range=str.match(/Ch(\d+)\s*[–—-]\s*(?:Ch)?(\d+)/i);if(range){const a=+range[1],b=+range[2];return Array.from({length:Math.min(9,b-a+1)},(_,i)=>a+i)}const nums=[...str.matchAll(/Ch(\d+)/gi)].map(m=>+m[1]);return nums.length?nums:[1]}
function bookTitle(ch){return ({1:'教练角色与执业范围',2:'行为改变与TTM',3:'沟通、目标与教学',4:'运动前健康筛查',5:'心肺生理与计划',6:'肌肉训练与IFT',7:'慢性病客户',8:'生命阶段',9:'肌肉骨骼状况'})[ch]}
function render(){commonHeader();root.innerHTML=route==='today'?renderToday():route==='path'?renderPath():route==='group'?renderGroup():renderPortfolio()}
function renderToday(){const d=dayInfo(day),sc=scene(day),complete=nDone(day),pct=Math.round(complete/6*100);
 const list=taskIds.map((id,i)=>{const status=taskStatus(day,id),isActive=activeStep===id;return `<article class="task ${done(day,id)?'done':''} ${isActive?'current':''}" id="task-${id}"><button type="button" class="task-head" data-action="openStep" data-step="${id}" aria-expanded="${isActive}"><span class="circle">${done(day,id)?'✓':pad(i+1)}</span><div><div class="task-title">${taskLabels[i]}</div><div class="task-sub">${taskDescriptions[i]}</div></div><span class="task-spacer"></span><span class="state-label">${status}</span><span class="chevron">${isActive?'⌃':'⌄'}</span></button>${isActive?`<div class="task-body"><div class="inner">${renderStep(id,d,sc)}</div></div>`:''}</article>`}).join('');
 return `<div class="breadcrumb">ACEPRESSO <span>／</span> WEEK ${pad(d.week)} <span>／</span> DAY ${pad(day)}</div><section class="hero"><div class="eyebrow">TODAY'S LEARNING / ${escapeHTML(d.type)}</div><h1>Day ${pad(day)} <span style="color:#b9b4ab">/</span> ${escapeHTML(d.title.replace(/^Ch\d+[–—\d]*[｜|]?/,''))}</h1><p class="hero-sub">${escapeHTML(d.goal||d.focus)}</p><div class="hero-meta"><span class="pill">教材 ${escapeHTML(d.chapters)}</span><span class="pill">${escapeHTML(d.type)}日</span><span class="pill">${complete===6?'今日任务全部完成':'下一步：'+taskLabels[taskIds.indexOf(nextStep(day))]}</span></div><div class="progressbar" aria-label="今日进度 ${pct}%"><div class="progressfill" style="width:${pct}%"></div></div><div class="hero-foot"><div><strong>${complete} / 6 项完成</strong><p>按照任务从上往下完成即可；资料随任务打开。</p></div><div class="actionrow" style="margin:0"><button class="btn btn-outline btn-small" data-action="switchDay" data-day="${Math.max(day-1,1)}" ${day===1?'disabled':''}>上一天</button><button class="btn btn-main btn-small" data-action="switchDay" data-day="${Math.min(day+1,21)}" ${day===21?'disabled':''}>下一天 →</button></div></div></section><h2 class="section-title">今日六步任务</h2><div class="tasks">${list}</div>${dayComplete(day)?renderAchievement(day):''}<section class="aux"><details><summary>补充学习资源 · 九章教材索引和复习记录（按需展开）</summary><div class="panel"><div class="small muted" style="margin-bottom:12px">这些是辅助资源，当前任务已包含对应教材和复习卡。</div>${Array.from({length:9},(_,i)=>`<button class="btn btn-outline btn-small" style="margin:3px" data-action="openBookAux" data-ch="${i+1}">Ch${i+1} ${bookTitle(i+1)}</button>`).join('')}<div id="auxbook"></div></div></details></section><div class="footer">3HFIT EDUCATION · ACEPRESSO / 21-DAY LEARNING COHORT · 模拟案例教学，正式批改以课程团队为准</div>`}
function renderStep(id,d,sc){switch(id){
 case 'goal':return `<h3>今天要学会作出什么判断？</h3><p>${escapeHTML(d.goal||d.focus)}</p><div class="info"><strong>今日学习顺序</strong><p class="small" style="margin:6px 0">阅读指定教材 → 学习或小组活动 → 10张提取复习卡 → 完成客户判断 → 整理并提交</p><div class="small muted">${escapeHTML(d.keypoint||'把课堂原理应用在客户情境中，并说明判断边界。')}</div></div><button class="btn btn-main" data-action="confirmGoal">我已了解今天的目标，开始学习 →</button>`;
 case 'read':{const chs=chaptersForDay(d.day);return `<h3>阅读指定教材</h3><p>今天对应 <strong>${escapeHTML(d.chapters)}</strong>。打开教材可以阅读原有章节正文；先看本日学习目标，再找与案例有关的概念。${chs.length>3?'综合复习日可以只复查自己薄弱的章节。':''}</p><div class="tabs">${chs.map(c=>`<button class="tab ${c===currentChapter?'on':''}" data-action="setChapter" data-ch="${c}">Ch${c}　${bookTitle(c)}</button>`).join('')}</div><button class="btn btn-outline" data-action="toggleBook">${openBook?'收起章节教材':'在本页展开 Ch'+currentChapter+' 正文'}</button>${openBook?`<div class="chapter-frame" style="margin-top:14px">${BOOK[String(currentChapter)]?.html||'<p>该章节暂不可用。</p>'}</div>`:''}<div class="info small">请在真正完成阅读后确认。系统记录自我确认的阅读进度，不假装自动检测阅读理解。</div><button class="btn btn-main" data-action="markRead">我已完成今天的教材阅读 ✓</button>`}
 case 'activity':{const title=d.type==='直播'?'课程学习记录':d.type==='小组'?'小组学习与讨论记录':'本周Workbook阶段作业';const label=d.type==='直播'?'记录本场直播或自主学习中最重要的一条解释，以及你仍有的疑问。':d.type==='小组'?'记录组员讨论的分歧、各自的判断依据和形成的共识。':'写下本周已经完成的实践成果、仍需要修订的地方和下一步。';return `<h3>${title}</h3><p>${escapeHTML(label)}</p><div class="info"><div class="mini-heading">课程安排</div><strong>${escapeHTML(d.title)}</strong><p class="small muted" style="margin:7px 0 0">${escapeHTML(d.focus||'')}</p></div><label class="field-label" for="activityInput">我的学习／讨论记录</label><textarea class="input text-area" id="activityInput" data-field="activity" placeholder="我今天学到……；我需要进一步核实……；下一步我准备……">${escapeHTML(data.activity[day]||'')}</textarea><div class="actionrow"><button class="btn btn-main" data-action="saveActivity">保存本次记录并完成任务</button><span class="hint">至少20个字符 · 本机保存；小组共享功能尚未上线</span></div>`}
 case 'cards':return renderCards(d);
 case 'case':return renderCase(d,sc);
 case 'notes':return `<h3>今天的学习笔记</h3><p>用自己的语言写出一个你会运用在真实客户身上的判断，注明边界和仍需核实的地方。</p><label for="noteInput" class="field-label">我的今日总结</label><textarea class="input text-area" id="noteInput" data-field="notes" placeholder="今日最重要的概念……；我会怎样向客户解释……；一个还不确定的问题……">${escapeHTML(data.notes[day]||'')}</textarea><div class="actionrow"><button class="btn btn-main" data-action="saveNote">保存笔记并完成任务</button><button class="btn btn-outline" data-action="downloadNotes">下载今天的笔记</button></div><div class="info small"><strong>提交说明：</strong>今天的客户作业会生成带评分标准的批改包；正式云端提交尚未接入。这里先提供“下载并发送给组长”的可用方式，不能把本机保存误标成老师已收到。</div>${data.submitted[day]?`<div class="actionrow"><button class="btn btn-red" data-action="exportReview">下载 Day ${pad(day)} 组长批改包</button><span class="hint">${data.exported[day]?'本机已生成文件，请自行发送组长':'尚未生成批改文件'}</span></div>`:''}${renderReview(day)}`;
 }}
function renderCards(d){const deck=CARDS[String(d.day)]||[],r=ratings(day);const count=Object.keys(r).length;const i=Math.max(0,Math.min(cardIndex,deck.length-1));const c=deck[i]||{};return `<h3>十张教材复习卡</h3><p class="small muted">按教材章节制作。翻开答案后判断“已掌握”或“需要复习”，两种选择都会保存练习记录。</p><div class="steps">${deck.map((x,j)=>`<span class="step ${r[j]?'ready':''}" title="卡片${j+1}"></span>`).join('')}</div><div class="deck-wrap"><div class="deck-count">CARD ${pad(i+1)} / ${pad(deck.length)} · 已作答 ${count}/10</div><div class="deck-text">${escapeHTML(c.front||'')}</div>${flipped?`<div class="deck-answer">${escapeHTML(c.back||'')}</div><div class="hint">教材对应：${escapeHTML(c.source||d.chapters)}</div>`:`<button class="btn btn-outline" data-action="flipCard">查看答案</button>`}</div><div class="actionrow between"><div class="actionrow" style="margin:0"><button class="btn btn-outline btn-small" data-action="prevCard" ${i===0?'disabled':''}>← 上一张</button><button class="btn btn-outline btn-small" data-action="nextCard" ${i===deck.length-1?'disabled':''}>下一张 →</button></div>${flipped?`<div class="actionrow" style="margin:0"><button class="btn btn-outline btn-small" data-action="rateCard" data-rating="review">仍需复习</button><button class="btn btn-main btn-small" data-action="rateCard" data-rating="known">已掌握 ✓</button></div>`:''}</div><div class="small muted">${count===10?'十张卡已完成本轮复习。你仍可回看标记“需要复习”的卡。':`已掌握 ${Object.values(r).filter(x=>x==='known').length} 张，待复习 ${Object.values(r).filter(x=>x==='review').length} 张。`}</div>`}
function renderCase(d,s){const client=clientById[s.client],submitted=!!data.submitted[day], a=answers(day), k=Math.max(0,Math.min(caseIndex,2)), q=s.questions[k],filled=Object.values(a).filter(x=>String(x||'').trim().length>=35).length,history=SCENES.filter(x=>x.client===s.client&&x.day<day);
return `<div class="case-head"><div><div class="eyebrow">CASE WORKSHOP / ${escapeHTML(s.chapter)}</div><h3 style="margin:7px 0 4px">${escapeHTML(client.name)} · 第 ${history.length+1} 次出现</h3></div><span class="pill">3道情境题 / 组长批改</span></div><p class="case-source">教材：${escapeHTML(s.source)}</p><div class="info"><strong>本日新增资料</strong><p class="small" style="margin:7px 0 0">${escapeHTML(s.context)}</p></div>${history.length?`<details><summary class="small" style="cursor:pointer;color:var(--green);font-weight:740">回顾 ${client.name} 过去 ${history.length} 次案例信息</summary><ul class="small">${history.map(x=>`<li>Day ${pad(x.day)}：${escapeHTML(x.carry||x.objective)}</li>`).join('')}</ul></details>`:''}<div class="mini-heading" style="margin-top:18px">学员今天应达到的决策能力</div><p>${escapeHTML(s.objective)}</p>${s.safety?`<div class="info warn"><strong>风险提示</strong><p style="margin:5px 0" class="small">${escapeHTML(s.safety)}</p></div>`:''}<div class="tabs">${s.questions.map((item,j)=>`<button class="tab ${j===k?'on':''}" data-action="caseQuestion" data-i="${j}">情境 ${j+1} ${a[j]&&String(a[j]).trim().length>=35?'✓':''}</button>`).join('')}</div><div class="panel" style="margin:10px 0"><div class="eyebrow">CLIENT SAYS / 情境 ${k+1}</div><blockquote class="quote">${escapeHTML(q.quote)}</blockquote><div class="question">${escapeHTML(q.ask)}</div><div class="guide"><strong>答题结构指引（不直接给答案）</strong><p style="margin:7px 0 0">① 已知事实与未知问题　② 教材概念及理由　③ 你对客户说的话　④ 下一步行动与转介边界</p></div><div class="info small"><strong>本题关注：</strong>${escapeHTML(q.guide)}</div><label class="field-label" for="caseInput">我的专业判断和具体话术</label><textarea class="input text-area case-answer" id="caseInput" data-field="case" placeholder="已知事实：……\n尚需确认：……\n依据课程：……\n我会对客户说：‘……’\n下一步：……">${escapeHTML(a[k]||'')}</textarea><div class="hint">每题独立作答，至少35个字符；内容自动本机保存。</div>${submitted?`<details class="sample"><summary style="cursor:pointer;font-weight:750">已提交 · 展开本题参考分析和组长评分要点</summary><p><strong>分析依据：</strong>${escapeHTML(q.guide)}</p><p><strong>可参考的话术：</strong>${escapeHTML(q.model)}</p><div class="criteria"><strong>组长逐项检查：</strong>${escapeHTML(q.rubric.split('｜').join(' / '))}</div></details>`:''}</div><div class="actionrow between"><button class="btn btn-outline" data-action="caseQuestion" data-i="${Math.max(0,k-1)}" ${k===0?'disabled':''}>← 上一题</button>${k<2?`<button class="btn btn-main" data-action="caseQuestion" data-i="${k+1}">下一题 →</button>`:`<button class="btn btn-red" data-action="submitCase" ${submitted?'disabled':''}>${submitted?'案例已完成，等待组长评核':'提交本日3题案例分析'}</button>`}</div>${submitted?`<div class="review-status"><strong>已完成本机提交记录，尚未发送给组长</strong><p class="small" style="margin:5px 0">请下载包含三题回答和逐项评分标准的批改包，通过班级指定渠道交给组长。等线上系统接入后，才能实现自动送达。</p><button class="btn btn-main btn-small" data-action="exportReview">下载组长批改包</button></div>${renderReview(day)}`:`<p class="small muted" style="margin-top:15px">已写完整 ${filled}/3 题。三题必须分别写出客户行动和沟通内容。</p>`}<div class="small muted" style="margin-top:15px;border-top:1px solid var(--edge);padding-top:12px">本次案例记录：${escapeHTML(s.carry||'请保留今天的事实和未解决问题，供下一次案例使用。')}</div>`}
function renderReview(n){const r=data.reviews[n];if(!r)return '';return `<div class="review-status ${r.status==='pass'?'pass':''}"><strong>组长反馈：${r.status==='pass'?'通过':'需修改'}　·　${r.score}/15分</strong><p class="small" style="margin:5px 0">${escapeHTML(r.feedback||'暂无评语')}</p><p class="hint">反馈来自本机导入的组长批改文件；请以班级正式记录为准。</p></div>`}
function renderAchievement(n){const r=ratings(n),known=Object.values(r).filter(v=>v==='known').length,rv=data.reviews[n];return `<section class="panel" style="margin-top:22px"><div class="eyebrow">DAY ${pad(n)} · STUDY COMPLETED</div><h2>今日学习卡已生成</h2><p>你已完成今天六项学习任务。案例作业的组长批改是独立流程，尚未经过组长审核不会显示“已通过”。</p><div class="learning-card"><div class="eyebrow" style="color:#cbd2c5">3HFIT EDUCATION</div><h3>ACEpresso.</h3><div class="light">DAY ${pad(n)} / 21 · ${escapeHTML(name)}</div><div class="card-grade">${nDone(n)}/6</div><div>${escapeHTML(dayInfo(n).title)}</div><hr style="border:0;border-top:1px solid #666;margin:15px 0"><div class="light small">10张复习卡 · 已掌握 ${known}　/　待复习 ${10-known}</div><div class="light small" style="margin-top:5px">案例评核：${rv?(rv.status==='pass'?'已通过':'需修改'):'等待组长批改'}</div></div><div class="actionrow"><button class="btn btn-main" data-action="downloadCard">保存ACEpresso学习卡 PNG</button><button class="btn btn-outline" data-action="exportReview">下载组长批改包</button></div></section>`}
function renderPath(){return `<div class="breadcrumb">ACEPRESSO / 21 DAYS</div><section class="hero"><div class="eyebrow">LEARNING ROADMAP</div><h1>21天学习路径</h1><p class="hero-sub">每天只有一个入口：打开当天的六项学习任务。完成的日期将显示绿色标记；未完成的可随时返回。</p></section>${[1,2,3].map(w=>`<section class="path-week"><h2 class="section-title">第${w}周 · ${['职业边界 / 行为改变 / 沟通','健康筛查 / 心肺训练','抗阻训练 / 综合客户案例'][w-1]}</h2><div class="path-list">${DAYS.filter(x=>x.week===w).map(d=>`<button class="daytile ${d.day===day?'selected':''}" data-action="switchDay" data-day="${d.day}"><strong>${pad(d.day)}</strong><span>${escapeHTML(d.title.split('｜').at(-1))}</span><em>${dayComplete(d.day)?'✓ 完成':nDone(d.day)?`${nDone(d.day)}/6`:'待开始'}</em></button>`).join('')}</div></section>`).join('')}<div class="footer">学习资料根据每天的任务逐步呈现，教材全文也可在当天任务中查阅。</div>`}
function renderGroup(){const groupDays=DAYS.filter(d=>d.type==='小组');return `<div class="breadcrumb">ACEPRESSO / GROUP LEARNING</div><section class="hero"><div class="eyebrow">SMALL GROUP / 4–6 PEOPLE</div><h1>我的学习小组</h1><p class="hero-sub">组长组织讨论、收取指定案例和Workbook。这里显示小组任务与批改流程；真实跨学员共享尚需云端系统。</p></section><div class="panel"><h2>组长如何收到我的作业？</h2><p>完成每日案例 → 下载当天组长批改包 → 按班级通知方式发送给组长 → 组长打开批改包给分数和反馈 → 将反馈JSON文件发回学员 → 学员导入学习档案。</p><div class="info warn small">当前演示版不会自动上传任何个人信息，也不会让其他成员直接看到你的答案。请勿在体验版填写真实客户身份或健康资料。</div><div class="actionrow"><button class="btn btn-main" data-action="switchDay" data-day="${day}">回到今天的任务</button></div></div><h2 class="section-title">六次固定小组学习</h2><div class="simplelist">${groupDays.map(d=>`<button data-action="switchDay" data-day="${d.day}"><strong>Day ${pad(d.day)} · ${escapeHTML(d.title)}</strong><div class="muted small">${escapeHTML(d.focus||d.goal)}　/　当前${nDone(d.day)}/6项完成</div></button>`).join('')}</div><div class="footer">所有真实批改和跨设备同步功能，待上线正式账号系统后启用。</div>`}
function renderPortfolio(){const n=completedDays(),sub=SCENES.filter(s=>data.submitted[s.day]);return `<div class="breadcrumb">ACEPRESSO / MY RECORD</div><section class="hero"><div class="eyebrow">PERSONAL LEARNING RECORD</div><h1>我的学习档案</h1><p class="hero-sub">你完成过的任务、个人笔记、客户情境答案和组长反馈会记录在这里。</p><div class="hero-meta"><span class="pill">已完成 ${n}/21 天</span><span class="pill">已提交 ${sub.length}/21 份案例</span><span class="pill">已导入 ${Object.keys(data.reviews).length} 份批改意见</span></div><div class="progressbar"><div class="progressfill" style="width:${n/21*100}%"></div></div></section><div class="panel"><h2>学习记录备份与批改反馈</h2><p class="small muted">更换浏览器、清除缓存之前，先导出备份。组长提供的JSON批改文件可以在这里导入。</p><div class="actionrow"><button class="btn btn-main" data-action="backup">导出全部学习记录 JSON</button><label class="btn btn-outline" for="backupInput">导入学习记录</label><input id="backupInput" type="file" accept=".json,application/json" class="hidden"><label class="btn btn-outline" for="reviewInput">导入组长批改文件</label><input id="reviewInput" type="file" accept=".json,application/json" class="hidden"></div></div><h2 class="section-title">每日学习档案</h2><div class="simplelist">${DAYS.map(d=>`<button data-action="switchDay" data-day="${d.day}"><strong>Day ${pad(d.day)} · ${escapeHTML(d.title)}</strong><div class="muted small">${nDone(d.day)}/6项完成 · ${data.submitted[d.day]?'案例已作答':'案例未提交'} · ${data.reviews[d.day]?(data.reviews[d.day].status==='pass'?'组长已通过':'组长要求修改'):'暂无组长反馈'}</div>${data.notes[d.day]?`<div class="small" style="margin-top:7px">笔记：${escapeHTML(data.notes[d.day].slice(0,85))}${data.notes[d.day].length>85?'…':''}</div>`:''}</button>`).join('')}</div><div class="footer">当前记录保存在本机浏览器，并非正式在线学习档案。</div>`}
function generateReviewerPacket(n){const s=scene(n),p=answers(n),payload={kind:'acepresso-submission-v5',student:name,day:n,chapter:s.chapter,source:s.source,context:s.context,title:dayInfo(n).title,submitted_at:new Date().toISOString(),items:s.questions.map((q,i)=>({question:q.ask,quote:q.quote,response:p[i]||'',rubric:q.rubric,model:q.model}))};const inp=safeJSON(payload);return `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACEpresso Day ${n} 组长批改</title><style>body{font:15px/1.75 system-ui,'Microsoft YaHei',sans-serif;max-width:850px;padding:20px;margin:0 auto;background:#f5f4ee;color:#272727}h1{font:800 39px Georgia;color:#ba2530}section{background:#fff;padding:19px;margin:14px 0;border:1px solid #ddd;border-radius:11px}blockquote{border-left:4px solid #ba2530;padding:12px 15px;background:#f4f2ec;margin:10px 0}textarea,select{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #bbb;border-radius:6px;font:inherit}textarea{min-height:95px}button{padding:12px 18px;background:#242421;color:white;border:0;border-radius:7px;font:inherit;cursor:pointer}small{color:#666}</style></head><body><div style="font-weight:900;color:#39754e">3HFIT EDUCATION</div><h1>ACEpresso.</h1><h2>Day ${pad(n)} · 组长批改工作单</h2><div id="student"></div><div id="tasks"></div><section><h3>总体评语</h3><label>批改结果<select id="status"><option value="revise">需修改</option><option value="pass">通过</option></select></label><p><label>组长评语<textarea id="feedback" placeholder="指出可取之处、需要修订的专业判断和下一步学习建议"></textarea></label></p><button id="save">下载评分反馈 JSON，发还学员</button><p><small>批改工作单仅在当前浏览器运行；本文件不会自动上传任何答案或评分。</small></p></section><script>const p=${inp};const esc=x=>String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));document.querySelector('#student').innerHTML='<p><b>学员：</b>'+esc(p.student)+'　<b>教材：</b>'+esc(p.source)+'</p><p>'+esc(p.context)+'</p>';document.querySelector('#tasks').innerHTML=p.items.map((q,i)=>'<section><h3>第'+(i+1)+'题</h3><blockquote>'+esc(q.quote)+'</blockquote><b>'+esc(q.question)+'</b><p><b>学员回答：</b>'+esc(q.response)+'</p><details><summary>展开组长参考要点</summary><p>'+esc(q.rubric)+'</p><p>'+esc(q.model)+'</p></details><label>本题得分（0–5）<select class="grade" data-i="'+i+'">'+Array.from({length:6},(_,v)=>'<option value="'+v+'" '+(v===3?'selected':'')+'>'+v+' 分</option>').join('')+'</select></label></section>').join('');document.querySelector('#save').addEventListener('click',()=>{const scores=[...document.querySelectorAll('.grade')].map(x=>Number(x.value));const review={kind:'acepresso-review-v5',student:p.student,day:p.day,status:document.querySelector('#status').value,score:scores.reduce((a,b)=>a+b,0),scores,feedback:document.querySelector('#feedback').value,reviewed_at:new Date().toISOString()};const b=new Blob([JSON.stringify(review,null,2)],{type:'application/json'});const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ACEpresso_Day${pad(n)}_组长反馈.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)});<\/script></body></html>`}
function buildLearningCard(n){const canvas=document.createElement('canvas');canvas.width=1080;canvas.height=1280;const c=canvas.getContext('2d');c.fillStyle='#222320';c.fillRect(0,0,1080,1280);c.fillStyle='#5dc980';c.font='bold 46px Arial';c.fillText('3HFIT EDUCATION',76,105);c.strokeStyle='#636861';c.beginPath();c.moveTo(76,155);c.lineTo(1000,155);c.stroke();c.fillStyle='#ef6b74';c.font='bold 112px Georgia';c.fillText('ACEpresso.',70,295);c.fillStyle='#fff';c.font='bold 42px Arial';c.fillText('DAY '+pad(n)+' / 21',76,398);c.font='34px Arial';c.fillText(name.slice(0,16),76,476);c.font='bold 140px Georgia';c.fillStyle='#9ce0aa';c.fillText('6 / 6',76,690);c.fillStyle='#fff';c.font='bold 32px Arial';c.fillText('TODAY COMPLETED',76,755);const t=dayInfo(n).title;c.font='30px Arial';c.fillText(t.slice(0,23),76,842);if(t.length>23)c.fillText(t.slice(23,45),76,894);const r=ratings(n),known=Object.values(r).filter(x=>x==='known').length;c.fillStyle='#cbd3c8';c.font='30px Arial';c.fillText('10 CARDS · KNOWN '+known+' / REVIEW '+(10-known),76,994);c.fillText('CASE REVIEW: '+(data.reviews[n]?(data.reviews[n].status==='pass'?'PASSED':'REVISE'):'PENDING'),76,1045);c.strokeStyle='#5e6a5c';c.beginPath();c.moveTo(76,1130);c.lineTo(1000,1130);c.stroke();c.font='24px Arial';c.fillText('PERSONAL LEARNING RECORD · ACEPRESSO V5',76,1192);canvas.toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ACEpresso_Day'+pad(n)+'_学习卡.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png')}
function finish(id){activeStep=nextStep(day);render();const el=$('#task-'+activeStep);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});notify('本项已完成 · 已进入下一项任务');}
function onClick(e){const btn=e.target.closest('[data-action]');if(!btn)return;const act=btn.dataset.action;let n=day;switch(act){
 case 'openStep':activeStep=btn.dataset.step;openBook=false;flipped=false;render();break;
 case 'confirmGoal':data.goals[n]=true;persist();finish('goal');break;
 case 'markRead':data.read[n]=true;persist();finish('read');break;
 case 'toggleBook':openBook=!openBook;render();break;
 case 'setChapter':currentChapter=Number(btn.dataset.ch);openBook=true;render();break;
 case 'saveActivity':if(String(data.activity[n]||'').trim().length<20){notify('请先写下至少20个字符的学习或讨论记录');return;}data.activityConfirmed[n]=true;persist();finish('activity');break;
 case 'flipCard':flipped=true;render();break;
 case 'prevCard':cardIndex=Math.max(0,cardIndex-1);flipped=false;render();break;
 case 'nextCard':cardIndex=Math.min(9,cardIndex+1);flipped=false;render();break;
 case 'rateCard':{if(!flipped){notify('请先查看答案');return;}if(!data.ratings[n])data.ratings[n]={};data.ratings[n][cardIndex]=btn.dataset.rating;persist();if(done(n,'cards')){activeStep=nextStep(n);caseIndex=0;render();notify('十张复习卡已完成，已经打开客户案例任务。');}else{if(cardIndex<9)cardIndex++;flipped=false;render();}break;}
 case 'caseQuestion':caseIndex=Number(btn.dataset.i);render();break;
 case 'submitCase':{const a=answers(n);const bad=scene(n).questions.findIndex((q,i)=>String(a[i]||'').trim().length<35);if(bad>=0){caseIndex=bad;render();notify('第'+(bad+1)+'题还没有完整回答，请至少填写35个字符');return;}data.submitted[n]={at:new Date().toISOString()};persist();finish('case');break;}
 case 'saveNote':if(String(data.notes[n]||'').trim().length<30){notify('请写下至少30个字符的学习总结');return;}data.noteConfirmed[n]=true;persist();finish('notes');break;
 case 'downloadNotes':downloadFile('ACEpresso_Day'+pad(n)+'_我的笔记.txt',(data.notes[n]||''));break;
 case 'exportReview':if(!data.submitted[n]){notify('请先完成案例三道题');return;}data.exported[n]=true;persist();downloadFile('ACEpresso_Day'+pad(n)+'_组长批改包.html',generateReviewerPacket(n),'text/html;charset=utf-8');render();break;
 case 'downloadCard':if(!dayComplete(n)){notify('今天六项任务尚未完成');return;}buildLearningCard(n);break;
 case 'switchDay':openDay(Number(btn.dataset.day));break;
 case 'openBookAux':{const ch=Number(btn.dataset.ch);const panel=$('#auxbook');if(panel){panel.innerHTML='<div class="chapter-frame" style="margin-top:15px">'+(BOOK[String(ch)]?.html||'<p>章节内容暂不可用</p>')+'</div>';panel.scrollIntoView({behavior:'smooth',block:'start'})}break;}
 case 'backup':downloadFile('ACEpresso_学习档案_'+name+'.json',JSON.stringify({format:'acepresso-v5-backup',student:name,data,exported_at:new Date().toISOString()},null,2),'application/json');break;
 }}
function onInput(e){const t=e.target;if(!t.dataset.field)return;switch(t.dataset.field){case 'activity':data.activity[day]=t.value;data.activityConfirmed[day]=false;break;case 'case':{if(!data.answers[day])data.answers[day]={};data.answers[day][caseIndex]=t.value; if(data.submitted[day]){delete data.submitted[day];delete data.reviews[day];}break;}case 'notes':data.notes[day]=t.value;data.noteConfirmed[day]=false;break;}persist()}
async function onFiles(e){const input=e.target;if(!['backupInput','reviewInput'].includes(input.id)||!input.files?.[0])return;try{const obj=JSON.parse(await input.files[0].text());if(input.id==='backupInput'){if(obj.format!=='acepresso-v5-backup'||obj.student!==name||!obj.data)throw Error('不是当前学员的V5学习备份');if(!confirm('将用备份文件覆盖当前学员的本机进度，确定继续吗？'))return;data=Object.assign(blank(),obj.data);persist();render();notify('学习记录已恢复');}else{if(obj.kind!=='acepresso-review-v5'||obj.student!==name||!(obj.day>=1&&obj.day<=21)||!['pass','revise'].includes(obj.status)||!Number.isFinite(Number(obj.score)))throw Error('批改文件格式或学员姓名不匹配');data.reviews[obj.day]={status:obj.status,score:Number(obj.score),feedback:String(obj.feedback||''),scores:obj.scores,reviewed_at:obj.reviewed_at};persist();render();notify('Day '+obj.day+' 组长反馈已导入');}}catch(err){notify('导入失败：'+err.message)}finally{input.value=''}}
root.addEventListener('click',onClick);root.addEventListener('input',onInput);root.addEventListener('change',onFiles);
document.querySelectorAll('[data-page]').forEach(btn=>btn.addEventListener('click',()=>goto(btn.dataset.page)));
$('#mobileNav').addEventListener('click',()=>$('#sidebar').classList.toggle('open'));
$('#switchUser').addEventListener('click',()=>{$('#app').classList.add('hidden');$('#login').classList.remove('hidden');$('#nickname').value=name});
function login(){const v=$('#nickname').value.trim();if(!v){notify('请输入昵称');return;}name=v;hydrate();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');goto('today');}
$('#loginBtn').addEventListener('click',login);$('#nickname').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
})();

</script>
</body></html>
