\u003e2. 激发动力：具有适度挑战性的目标，短期内可有效激发个体的努力程度，提升行动积极性；\u003c/p\u003e\n\u003cp\u003e3. 提升坚持度：明确的目标能让个体在追求目标的过程中保持更久的行动力，减少半途而废的情况；\u003c/p\u003e\n\u003cp\u003e4. 促进策略优化：目标会驱动客户主动探索实现目标的有效策略与方法，提升目标达成效率。\u003c/p\u003e\n\u003ch4 id=\"ch3-s615\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：目标四作用：引注意力、激动力、提坚持、促优化\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：目标就像GPS（没它不知道往哪走，有它才知道每一步对不对）\u003c/p\u003e\n\u003ch4 id=\"ch3-s618\"\u003e个体差异\u003c/h4\u003e\n\u003cp\u003e个体差异会影响目标作用的发挥效果。在与客户设定目标时，需重点关注以下五类个体差异，确保目标设定的针对性：\u003c/p\u003e\n\u003cp\u003e1. 目标投入度：客户对目标的投入程度越高，目标的激励作用越显著（可结合第二章自我决定理论理解）；\u003c/p\u003e\n\u003cp\u003e2. 目标重要性：客户认为目标越重要，其受到的激励效果越强，行动的主动性也越高；\u003c/p\u003e\n\u003cp\u003e3. 自我效能：即个体对自身能否达成目标的信念度，信念度越高，个体的坚持性越强，目标的激励作用越明显；\u003c/p\u003e\n\u003cp\u003e4. 反馈机制：能及时获取目标进展反馈的客户，更易持续追求目标，因此私教在训练期间，可通过定期检查进度、借助穿戴设备等方式，帮助客户实现自我监控；\u003c/p\u003e\n\u003cp\u003e5. 任务复杂性：任务难度越高，客户越需要多元策略支撑，此时教练可与客户协作，同时建立过程目标与结果目标（又称成绩目标），实现目标设定的科学性与艺术性结合。\u003c/p\u003e\n\u003ch4 id=\"ch3-s625\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：个体差异五维度：投入度、重要感、自我效、反馈、任务难\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：同样的目标，对不同人的激励效果不同\u003c/p\u003e\n\u003ch4 id=\"ch3-s628\"\u003e目标设定的核心原则：SMART原则\u003c/h4\u003e\n\u003cp\u003eSMART原则是目标设定的核心原则，包含五个维度，即具体（Specific）、可测量（Measurable）、可实现（Attainable）、相关（Relevant）、有时限（Time-bound），具体要求如下：\u003c/p\u003e\n\u003cp\u003e1. 具体性：目标需清晰明确，避免模糊化表述，例如避免&quot;明年成为更好的人&quot;这类无法落地的目标，需明确具体行为与方向；\u003c/p\u003e\n\u003cp\u003e2. 可测量性：目标需可追踪、可量化，便于判断进展情况，需注意，衣服尺寸因品牌、款式标准不同，不属于可测量指标；\u003c/p\u003e\n\u003cp\u003e3. 可实现性：目标需贴合现实，确保在客户能力范围内可达成，避免设定过高或过低的目标；\u003c/p\u003e\n\u003cp\u003e4. 相关性：目标需与客户的个人兴趣、实际需求及自身能力高度相关，避免出现&quot;教练苦心制定计划，客户却不愿执行&quot;的情况，核心原因往往是计划与客户需求脱节；\u003c/p\u003e\n\u003cp\u003e5. 时限性：目标需明确预计完成期限，为定期监测进展提供依据，避免无时限目标导致执行拖沓。\u003c/p\u003e\n\u003ch4 id=\"ch3-s635\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：SMART原则（S具体、M可测、A可实现、R相关、T有时限\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：SMART目标就像精确的导航（起点、终点、路线、时间都清清楚楚）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：模糊目标=许愿，SMART目标=承诺\u003c/p\u003e\n\u003ch4 id=\"ch3-s639\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003eSMART目标示例：\u003c/p\u003e\n\u003cp\u003e❌ 模糊目标：\u003c/p\u003e\n\u003cp\u003e• &quot;我要变瘦一点&quot;（不具体、不可测量）\u003c/p\u003e\n\u003cp\u003e• &quot;我想更有力量&quot;（模糊）\u003c/p\u003e\n\u003cp\u003e• &quot;我尽量多运动&quot;（没有时限）\u003c/p\u003e\n\u003cp\u003e• &quot;我要变得健康&quot;（无法衡量）\u003c/p\u003e\n\u003cp\u003e✓ SMART目标：\u003c/p\u003e\n\u003cp\u003eSpecific：减重5kg\u003c/p\u003e\n\u003cp\u003eMeasurable：体重变化\u003c/p\u003e\n\u003cp\u003eAttainable：12周合理\u003c/p\u003e\n\u003cp\u003eRelevant：符合客户目标\u003c/p\u003e\n\u003cp\u003eTime-bound：12周\u003c/p\u003e\n\u003cp\u003e• &quot;未来12周，通过每周3次力量训练，使体重下降5kg。&quot;（具体、可测量、有时限、符合客户目标、可实现）\u003c/p\u003e\n\u003cp\u003e• &quot;12周后能够完成连续10个标准俯卧撑&quot;（具体、可测量、可实现、有时限）\u003c/p\u003e\n\u003cp\u003e【注意】 衣服尺寸不属于可测量指标！\u003c/p\u003e\n\u003ch4 id=\"ch3-s655\"\u003e【实践建议】\u003c/h4\u003e\n\u003cp\u003e初期目标可适度保守，尤其在与客户合作初期、客户处于行为改变的早期阶段。远大目标虽能鼓舞人心，但一旦遭遇挫折，易让客户产生失望情绪，因此，让客户在目标推进过程中持续获得&quot;获得感&quot;至关重要。同时，需结合过程目标与结果目标：过程目标聚焦客户的具体行动，例如每周完成150分钟有氧训练、每天10分钟身体活动度改善；结果目标聚焦行动带来的实际成果，例如减脂重量、力量提升幅度，两者结合可全面保障目标落地。\u003c/p\u003e\n\u003ch4 id=\"ch3-s657\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：过程目标=做行为，结果目标=看成果，两个都要有\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：没有过程目标，结果目标就是空谈\u003c/p\u003e\n\u003cp\u003e表3-7\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e身体素质指标\u003c/th\u003e\u003cth\u003e目标设定注意事项\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e心理健康指标\u003c/td\u003e\u003ctd\u003e运动后，客户在心情、精力水平和睡眠质量方面发生显著改善，且压力感和烦躁感有所降低。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e静息心率\u003c/td\u003e\u003ctd\u003e许多私人教练会要求客户测量静息心率，作为早上第一件事或在晚上睡觉前进行。没有运动经验的客户经过数月锻炼后静息心率通常会有所降低。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e给定次最大锻炼负荷期间的心率\u003c/td\u003e\u003ctd\u003e进行心肺运动的客户在一台设备上以标准锻炼负荷进行与适应能力测试期间所做的运动类型相似的运动时，其运动心率也有可能下降。客户每次进行测试时，次最大负荷必须保持一致。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌肉力量和耐力\u003c/td\u003e\u003ctd\u003e在运动计划的前几个月，肌肉力量和耐力的增加速度相当快。客户所用阻力强度或所进行重复次数的增加易于测量。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e步行测试\u003c/td\u003e\u003ctd\u003e如果客户数周以来一直将步行作为运动计划的一部分，那么利用某类计时步行测试来衡量身体素质改善通常会得到积极的结果。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e柔韧性\u003c/td\u003e\u003ctd\u003e柔韧性提高速度非常缓慢，并且只有在运动计划包括定期拉伸或关节活动度锻炼时才应将柔韧性包括在评估中。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e平衡\u003c/td\u003e\u003ctd\u003e平衡测量结果的最大改善出现在参加某种平衡训练计划的成年人中，这些训练计划越来越受欢迎，特别是在老年人中。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e技能水平\u003c/td\u003e\u003ctd\u003e参加需要技能的活动（例如，攀岩、网球和高尔夫）的客户将会很高兴看到他们的运动技能水平有所提高。技能提高可通过运动技能测试或活动/比赛表现来衡量。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e静息血压、血脂水平或血糖水平等医疗指标\u003c/td\u003e\u003ctd\u003e如果上述任一项是客户运动计划的重点，则客户应按照医护人员制定的时间定期接受这些测量。这些变量可能受到许多其他因素的影响，包括饮食或体重变化，而且在评估运动结果时应将这些因素考虑在内。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e体重\u003c/td\u003e\u003ctd\u003e体重易于测量，但不是身体组成变化的良好指标。即使身体组成发生积极变化，体重也可能保持不变；或者由于水合作用的变化，体重可能会发生几磅或几千克的变化。不过，减重计划中超重几磅或几千克的客户可能会观察到体重下降。客户应进行慢速且持续的减重计划，这种计划更有可能长期维持减重效果。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e体型大小\u003c/td\u003e\u003ctd\u003e目标是减重几磅的客户体重可能不会有太大变化。身体组成变化（脂肪减少肌肉量增加）仍可导致体型变化。由于瘦组织的密度较大，所占空间要小于脂肪组织。许多人会因为裙腰或裤腰变宽松而感到高兴。许多私人教练鼓励客户观察衣服合身度的变化。\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e身体组成\u003c/td\u003e\u003ctd\u003e如果测量身体组成，应始终使用相同的测试。一些私人教练记录胸围或皮褶厚度，但不预测身体组成。这些测量值的变化可指示脂肪减少或肌肉大小增加。\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch3-s661\"\u003e3.2 产生想法并讨论选择\u003c/h4\u003e\n\u003cp\u003e明确目标后，教练进入与客户讨论想法、筛选备选方案的环节，这个阶段的核心原则是：每位客户的最终目标应是长期坚持运动，而非单纯激发短期运动热情。\u003c/p\u003e\n\u003cp\u003e在第二章中我们提出：时间不足是客户退出运动最常见原因之一。若客户有因时间问题退出运动的过往经历，教练应引导其接受适度的运动计划：若客户设定的目标过于宏大，需投入大量时间与精力才能实现，结合其过往经历，需对目标进行合理调整与管理。相较于&quot;宏大但无法执行&quot;的计划，经过科学调整的计划更具可靠性与长效性。\u003c/p\u003e\n\u003cp\u003e计划设计需结合客户合作周期，体现差异化：若客户仅计划短期合作，运动计划应设计得简洁易懂、便于客户独立执行；若为长期维护，计划可适当复杂化，提升针对性与持续性。\u003c/p\u003e\n\u003cp\u003e因此，教练需根据客户的购买需求与训练需求，灵活制定差异化的训练计划与目标。\u003c/p\u003e\n\u003cp\u003e在与客户共同制定评估方案时，应鼓励客户自主判断计划的可行性，重点考量时间分配的合理性。待双方充分讨论、达成共识后，进入计划制定环节。\u003c/p\u003e\n\u003ch4 id=\"ch3-s667\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：备选方案 = 给选择，不是给命令\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：客户参与选择的方案，才会认真执行\u003c/p\u003e\n\u003ch4 id=\"ch3-s670\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：讨论训练方案选项\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;你的计划是这样的：每周一三五训练……&quot;\u003c/p\u003e\n\u003cp\u003e• 不给客户选择的机会\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• &quot;我们可以有两个方案：方案A是每周3次，适合时间充裕的你；方案B是每周2次，适合你工作较忙的时候。你觉得哪个更适合？&quot;\u003c/p\u003e\n\u003cp\u003e• 鼓励客户说出顾虑：&quot;你之前说过时间是个问题，那你觉得哪个方案更现实？&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s678\"\u003e3.3 制订计划\u003c/h4\u003e\n\u003cp\u003e制定计划是计划阶段的核心执行环节，需遵循两大核心要点，确保计划的可行性与客户的接受度：\u003c/p\u003e\n\u003cp\u003e一是保障客户的自主权，客户最了解自身的目标、需求与运动偏好，计划制定需充分尊重客户意愿，双方达成一致后，可将计划形成书面形式，增强仪式感与执行力，便于后续落地与监测；\u003c/p\u003e\n\u003cp\u003e二是帮助客户做好运动准备，教练可提供针对性建议，例如训练时的着装、所需装备，譬如：未来两周的主要训练区域，该区域固定器械的使用方法、场地礼仪及良好训练习惯等。这些建议能帮助客户快速适应健身环境，减少陌生感与尴尬感。健身房对教练而言是熟悉场景，但对新人而言，可能存在尴尬甚至畏惧心理，因此，帮助客户熟悉环境、提供关键指导，是提升客户体验、保障计划执行的重要环节。\u003c/p\u003e\n\u003ch4 id=\"ch3-s682\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：计划两要点（给自主权，帮做热身）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：书面计划更有仪式感，也更容易执行\u003c/p\u003e\n\u003ch4 id=\"ch3-s685\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：帮助客户做好运动准备\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• 假设客户知道健身房怎么用\u003c/p\u003e\n\u003cp\u003e• 直接开始训练，不管客户是否准备好\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• &quot;我们先花10分钟熟悉一下器械，你会感觉更自在&quot;\u003c/p\u003e\n\u003cp\u003e• 介绍训练区域的使用方法\u003c/p\u003e\n\u003cp\u003e• 说明基本的健身房礼仪\u003c/p\u003e\n\u003ch4 id=\"ch3-s694\"\u003e3.4 评估运动计划\u003c/h4\u003e\n\u003cp\u003e计划制定后，并非一成不变，需在课程开展期间定期评估、动态调整，确保计划贴合客户实际情况，保障目标落地。\u003c/p\u003e\n\u003cp\u003e评估核心是判断目标进展速度（过快或过慢），并根据评估结果及时调整训练计划。若客户的计划坚持度下降，需及时排查原因（如目标难度过高、时间分配不合理等）并优化计划。评估重点主要包括两个方面：\u003c/p\u003e\n\u003cp\u003e1. 计划的挑战性：判断目标设定过高或过低，确保挑战性与客户能力匹配，既不过于轻松导致动力不足，也不过于困难导致挫折感；\u003c/p\u003e\n\u003cp\u003e2. 客户的坚持度：针对坚持度过低的情况，精准定位原因并解决，例如调整目标难度、优化时间分配、强化正向激励等。\u003c/p\u003e\n\u003ch4 id=\"ch3-s699\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：计划写在沙子上，需要随时调整\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：定期评估是计划成功的保障\u003c/p\u003e\n\u003ch4 id=\"ch3-s702\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e评估计划话术：\u003c/p\u003e\n\u003cp\u003e&quot;我们已经执行了两周计划，我想和你一起回顾一下进展。你觉得这个强度怎么样？有没有觉得太累或者太轻松？&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s705\"\u003e💡 关键思考\u003c/h4\u003e\n\u003cp\u003e为何双向合作比单方面制定更有效？\u003c/p\u003e\n\u003cp\u003e1. 承诺一致性：人们更愿意执行自己参与制定的计划\u003c/p\u003e\n\u003cp\u003e2. 信息完整性：客户了解自己的实际情况，教练了解专业知识，两者结合才完整\u003c/p\u003e\n\u003cp\u003e3. 责任感：当客户参与制定计划，他会觉得自己对计划有责任，而不是&quot;教练强加的&quot;\u003c/p\u003e\n\u003cp\u003e4. 适配性提升：客户能预判时间、精力等现实约束，帮助教练制定更贴合实际的方案\u003c/p\u003e\n\u003ch4 id=\"ch3-s711\"\u003e✍️小节回顾 | 第三阶段：计划阶段\u003c/h4\u003e\n\u003ch4 id=\"ch3-s712\"\u003e基本原理\u003c/h4\u003e\n\u003cp\u003e计划阶段的核心是&quot;双向合作&quot;。教练角色为引导者和专业顾问，非命令者。SMART原则是目标设定标准，需让客户参与目标设定，使计划成为双方共识。\u003c/p\u003e\n\u003ch4 id=\"ch3-s714\"\u003e互动考题\u003c/h4\u003e\n\u003cp\u003eQ：一位客户说&quot;我的目标是一年瘦50斤，每周只能训练2次，每次1小时&quot;，请分析这个目标的SMART原则适用情况，并帮助客户优化目标设定。\u003c/p\u003e\n\u003cp\u003e参考答案：\u003c/p\u003e\n\u003cp\u003e• 分析：&quot;目标具体但时间紧，需要拆分&quot;\u003c/p\u003e\n\u003cp\u003e• 优化后：&quot;3个月减掉10斤，每周2次训练，每次1小时，包含力量训练和有氧训练。第一个月目标是适应训练节奏，第二个月逐步增加强度。&quot;\u003c/p\u003e\n\u003ch4 id=\"ch3-s719\"\u003e记忆小本\u003c/h4\u003e\n\u003cp\u003e表3-8\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e概念\u003c/th\u003e\u003cth\u003e关键词\u003c/th\u003e\u003cth\u003e一句话\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e目标设定\u003c/td\u003e\u003ctd\u003e五要点\u003c/td\u003e\u003ctd\u003e不多、不丧、长短合、双方定、定期审\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSMART原则\u003c/td\u003e\u003ctd\u003e五维度\u003c/td\u003e\u003ctd\u003e具体、可测、可实现、相关、时限\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e过程目标\u003c/td\u003e\u003ctd\u003e做行为\u003c/td\u003e\u003ctd\u003e每周3次，每次30分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e结果目标\u003c/td\u003e\u003ctd\u003e看成果\u003c/td\u003e\u003ctd\u003e3个月减10斤\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e评估计划\u003c/td\u003e\u003ctd\u003e调难度、提坚持\u003c/td\u003e\u003ctd\u003e计划不是死的，要动态调整\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch3-s721\"\u003e4 行动阶段\u003c/h3\u003e\n\u003cp\u003e行动阶段是训练方案落地执行的最终环节。\u003c/p\u003e\n\u003cp\u003e本阶段核心重点为教学技能，专业的教育学能力、动作讲解能力、动作纠错能力、训练引导能力至关重要。教练需依靠标准化教学技巧，指导客户正确完成训练动作，规避运动损伤，循序渐进推进训练目标落地。\u003c/p\u003e\n\u003ch4 id=\"ch3-s724\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：行动阶段 = 教+学+练\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：行动阶段就像教练的&quot;主战场&quot;（所有前期的铺垫，都是为了这一刻）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：教学技能是教练吃饭的本事，必须扎实\u003c/p\u003e\n\u003ch4 id=\"ch3-s728\"\u003e4.1 自我监测\u003c/h4\u003e\n\u003ch4 id=\"ch3-s729\"\u003e自我监测\u003c/h4\u003e\n\u003cp\u003e自我监测是行动阶段的核心任务之一，也是支持行为改变的最有效方式之一，尤其适用于解决坚持运动、改善饮食这两大世界级难题。教练需引导客户建立完善的自我监测体系，具体可通过以下方式推进：\u003c/p\u003e\n\u003cp\u003e1. 监测工具与内容：引导客户借助手机应用、专属App或小程序，全面记录训练相关信息，包括抗阻训练的重复次数、强度，心肺训练的时间、强度、心率等核心指标；同时，善用AI工具，不仅实现数字记录，当下教练更要学习通过AI进行数据化分析，帮助客户清晰掌握自身训练进展。\u003c/p\u003e\n\u003cp\u003e2. 自我监测的核心价值：一方面，能够显著提高客户的自我意识，强化其行动主体性，让客户更清晰地感知自身变化；另一方面，可强化教练与客户之间的沟通，每次教练询问、交流监测记录时，都是开启有效讨论、了解客户需求、优化训练方案的重要契机。\u003c/p\u003e\n\u003ch4 id=\"ch3-s733\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：自我监测 = 让自己看见自己的进步\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：看得见的进步，才是持续的动力\u003c/p\u003e\n\u003ch4 id=\"ch3-s736\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：引导客户建立自我监测习惯\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;你回家自己练就行，不用记录&quot;\u003c/p\u003e\n\u003cp\u003e• 认为记录是客户自己的事\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• 推荐适合的App或小程序\u003c/p\u003e\n\u003cp\u003e• 定期回顾监测数据\u003c/p\u003e\n\u003cp\u003e• 用数据帮助客户看到进步\u003c/p\u003e\n\u003ch4 id=\"ch3-s745\"\u003e4.2 有效的教学技巧\u003c/h4\u003e\n\u003cp\u003e行动阶段中，教练的核心职责之一是向客户传授运动技能、讲解健康知识，需掌握科学有效的教学技巧，确保客户能够正确掌握动作、规范使用器械，同时提升学习效率与行动坚持度。教学过程可分为&quot;学&quot;与&quot;教&quot;两个维度，具体要求如下：\u003c/p\u003e\n\u003cp\u003e图3-12\u003c/p\u003e\n\u003ch4 id=\"ch3-s748\"\u003e学习的三个阶段\u003c/h4\u003e\n\u003cp\u003eFitts &amp; Posner（1967）提出，个体学习运动技能的过程通常分为三个阶段，教练需根据不同阶段的特点调整教学策略，具体如下：\u003c/p\u003e\n\u003cp\u003e1. 认知阶段（Cognitive stage）：此阶段客户的动作表现为不协调、不流畅，对动作要领的理解较为模糊。教练需采用&quot;整体讲解、逐步示范、独立实践&quot;的教学方式，做到言传身教，同时给予客户充足的练习时间。此阶段是教练最费心的阶段，需遵循KISS原则（Keep It Simple and Short，即简洁明了原则），避免教授过多、过复杂的内容，防止给客户造成负担。\u003c/p\u003e\n\u003cp\u003e2. 联想阶段（Associative stage）：此阶段客户已能完成大部分正确动作，仅存在少量细节偏差。教练的核心任务是提供具体、精准、定向的反馈，避免过量反馈造成客户混乱，重点针对动作偏差进行纠正，帮助客户逐步完善动作技能。\u003c/p\u003e\n\u003cp\u003e3. 自主阶段：此阶段客户已能流畅、自然、正确地运用各类运动技能。教练的反馈需从外部反馈转向内部反馈，角色从&quot;教学者&quot;转变为&quot;观察者&quot;，同时准备引入新的运动技能，引导客户持续提升。\u003c/p\u003e\n\u003cp\u003e【注意】 该模型存在一定局限性，不适用于运动员或复杂运动技巧（如滑雪等）的教学。整体而言，这三个阶段可理解为客户从&quot;运动小白&quot;到&quot;熟练掌握技能&quot;的成长过程，教练的教学重点需逐步从详细指导转向定向监督。\u003c/p\u003e\n\u003ch4 id=\"ch3-s754\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：学习三阶段：认知期（手忙脚乱）、联想期（逐步稳定）、自主期（形成习惯）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：学习就像学骑自行车（先是摇摇晃晃，然后慢慢稳定，最后不用想就会骑）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：不同阶段用不同的教法，不能一套方法用到底\u003c/p\u003e\n\u003ch4 id=\"ch3-s758\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e阶段判断与策略：\u003c/p\u003e\n\u003cp\u003e认知阶段（判断）：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 动作不协调\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 需要看着示范\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 记不住动作顺序\u003c/p\u003e\n\u003cp\u003e策略：多示范、多讲解、多练习、遵循KISS原则（简洁明了）\u003c/p\u003e\n\u003cp\u003e联想阶段（判断）：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 动作基本正确\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 只有细节问题\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能独立完成\u003c/p\u003e\n\u003cp\u003e策略：定向反馈、纠正细节、避免过量反馈\u003c/p\u003e\n\u003cp\u003e自主阶段（判断）：\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 动作流畅自然\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 能自己发现问题\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 注意力可放在其他事上\u003c/p\u003e\n\u003cp\u003e策略：观察者角色、引入新技能、准备进阶\u003c/p\u003e\n\u003ch4 id=\"ch3-s775\"\u003e学习三阶段对照表\u003c/h4\u003e\n\u003cp\u003e表3-9\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e学习阶段\u003c/th\u003e\u003cth\u003e客户表现\u003c/th\u003e\u003cth\u003e教练策略\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e认知阶段（认知定向阶段）\u003c/td\u003e\u003ctd\u003e动作不协调、不流畅，对动作要领理解模糊\u003c/td\u003e\u003ctd\u003e1. 采用&quot;整体讲解、逐步示范、独立实践&quot;方式，做到言传身教；2. 给予充足练习时间；3. 遵循KISS原则（简洁明了），避免教授过多过复杂内容\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e联想阶段\u003c/td\u003e\u003ctd\u003e大部分动作正确，仅存在少量细节偏差\u003c/td\u003e\u003ctd\u003e提供具体、精准、定向的反馈，重点纠正动作偏差，避免过量反馈造成混乱\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e自主阶段\u003c/td\u003e\u003ctd\u003e能流畅、自然、正确地运用各类运动技能\u003c/td\u003e\u003ctd\u003e1. 反馈从外部转向内部；2. 角色从&quot;教学者&quot;转变为&quot;观察者&quot;；3. 准备引入新的运动技能\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch3-s777\"\u003e5.1.2.2 学习的三种方式\u003c/h4\u003e\n\u003cp\u003e教学中可以结合视觉示范、言语说明和身体实践三种信息通道。客户可能对某种方式表现出偏好，但不应被固定地归类为单一“学习类型”。教练应依据学习任务和客户的实际反应，灵活组合多种教学方式：\u003c/p\u003e\n\u003cp\u003e1. 视觉型客户：这类客户善于观察，常反馈&quot;我看清楚了&quot;&quot;我没看清楚&quot;。针对此类客户，教练的核心策略是&quot;做给他看&quot;，通过规范的动作示范，让客户直观掌握动作要领。\u003c/p\u003e\n\u003cp\u003e2. 听觉型客户：这类客户喜欢倾听，常反馈&quot;我听到了&quot;&quot;我没听到&quot;。针对此类客户，教练的核心策略是&quot;说给他听&quot;，通过清晰、细致的语言讲解，传递动作要领与健康知识。\u003c/p\u003e\n\u003cp\u003e3. 身体实践：通过分解动作、反复练习、外部提示和客户自身感受，帮助客户理解动作。若需使用触觉提示，必须先征得客户明确同意，说明目的和接触位置，并遵守专业界限。\u003c/p\u003e\n\u003ch4 id=\"ch3-s782\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：视觉型：看；听觉型：听；动觉型：摸\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：学习就像吃饭（有人喜欢看菜单，有人喜欢听介绍，有人喜欢先尝一口）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：了解客户的学习类型，让教学事半功倍\u003c/p\u003e\n\u003ch4 id=\"ch3-s786\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e快速判断学习类型：\u003c/p\u003e\n\u003cp\u003e• 问&quot;你之前是怎么学的？&quot;\u003c/p\u003e\n\u003cp\u003e• 观察客户最先问什么：&quot;怎么做？&quot;vs&quot;为什么？&quot;vs直接动手试\u003c/p\u003e\n\u003cp\u003e针对性教学：\u003c/p\u003e\n\u003cp\u003e• 视觉型：多示范，少说话\u003c/p\u003e\n\u003cp\u003e• 听觉型：多讲解，多解释\u003c/p\u003e\n\u003cp\u003e• 动觉型：多给机会实操，手把手引导\u003c/p\u003e\n\u003ch4 id=\"ch3-s794\"\u003e学习三类型对照表\u003c/h4\u003e\n\u003cp\u003e表3-10\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e学习类型\u003c/th\u003e\u003cth\u003e客户表现\u003c/th\u003e\u003cth\u003e教练策略\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e视觉型\u003c/td\u003e\u003ctd\u003e善于观察，常反馈&quot;我看清楚了&quot;&quot;我没看清楚&quot;\u003c/td\u003e\u003ctd\u003e&quot;做给他看&quot;，通过规范的动作示范，让客户直观掌握动作要领\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e听觉型\u003c/td\u003e\u003ctd\u003e喜欢倾听，常反馈&quot;我听到了&quot;&quot;我没听到&quot;\u003c/td\u003e\u003ctd\u003e&quot;说给他听&quot;，通过清晰、细致的语言讲解，传递动作要领与健康知识\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e动觉型\u003c/td\u003e\u003ctd\u003e喜欢触摸、实操，常反馈&quot;我感觉到了&quot;&quot;我感觉不到&quot;\u003c/td\u003e\u003ctd\u003e&quot;手把手指导&quot;，通过手把手教学，让客户在实操中感知动作细节与发力方式\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch3-s796\"\u003e核心教学技巧\u003c/h4\u003e\n\u003cp\u003e结合认知阶段的教学要求，教练需掌握以下核心教学技巧，确保教学效果与安全性：\u003c/p\u003e\n\u003cp\u003e1. 言传身教，强调练习：&quot;言传&quot;&quot;身教&quot;是教练的核心职责，而&quot;练习&quot;的主体是客户。教练需明确告知客户，运动技能并非天生，天赋仅影响学习兴趣与基础技能掌握速度，真正的技能提升、成为专家，需要日复一日的持续练习。\u003c/p\u003e\n\u003ch4 id=\"ch3-s799\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：教练言传身教，客户勤加练习\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：技能的提升靠的是练习，不是天赋\u003c/p\u003e\n\u003cp\u003e1. 讲解清晰，兼顾&quot;是什么、为什么、怎么做&quot;：引入新动作、新技能时，讲解需缓慢、清晰，向客户明确说明&quot;做什么&quot;（动作目标）、&quot;为什么做&quot;（训练意义）、&quot;怎么做&quot;（动作要领），同时重点强调如何有效执行、如何预防损伤。\u003c/p\u003e\n\u003ch4 id=\"ch3-s803\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：讲动作 = 是什么（目标）+ 为什么（意义）+ 怎么做（要领）+ 怎么做对（避免损伤）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：讲清楚，才能做明白\u003c/p\u003e\n\u003cp\u003e1. 先整体后细节，避免细节过载：讲解动作时，优先描述动作的整体目标，再逐步补充细节，避免一开始就堆砌大量细节让客户产生困惑。例如，讲解椭圆机使用时，首先强调&quot;以平滑、稳定的速度移动&quot;，再逐步讲解发力细节，而非一开始就强调脚趾抓地、核心绷紧等细节（此类教学方式并非错误，而是效率较低）。\u003c/p\u003e\n\u003ch4 id=\"ch3-s807\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：先整体后细节，先框架后填充\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：细节是加分项，不是开场白\u003c/p\u003e\n\u003ch4 id=\"ch3-s810\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e场景：教授新动作\u003c/p\u003e\n\u003cp\u003e❌ 错误做法：\u003c/p\u003e\n\u003cp\u003e• &quot;首先脚平行与肩同宽，然后屈髋屈膝，膝盖朝向脚尖，核心收紧，脊椎中立……&quot;\u003c/p\u003e\n\u003cp\u003e• 一次性灌输大量细节\u003c/p\u003e\n\u003cp\u003e✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e• &quot;先试着做一个完整的深蹲，不用担心细节&quot;\u003c/p\u003e\n\u003cp\u003e• 观察后：&quot;整体不错，现在我们来调整一个关键点：膝盖朝向脚尖方向&quot;\u003c/p\u003e\n\u003cp\u003e1. 优先强调安全与高效细节：教授动作时，需优先讲解与安全性、目标达成相关的细节，简洁明了地告知客户如何避免损伤、如何高效达成训练目标。例如，高位下拉时，提醒客户避免颈后下拉，减少肩部损伤风险；硬拉时，强调腰部保持相对中立位，预防腰部损伤。\u003c/p\u003e\n\u003ch4 id=\"ch3-s819\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：安全第一，效率第二\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：错误的细节可以慢慢改，受伤了就全完了\u003c/p\u003e\n\u003cp\u003e1. 提供充足实践机会：讲解与示范完成后，需为客户提供集中的训练机会，教练全程观察，及时提供有用的反馈，帮助客户在实践中巩固动作技能。\u003c/p\u003e\n\u003ch4 id=\"ch3-s823\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：听一遍会忘，做三遍才熟\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：实践出真知\u003c/p\u003e\n\u003cp\u003e【实操建议】 核心教学技巧的运用需结合客户学习阶段与学习偏好，例如对视觉型客户，可多增加动作示范频次；对动觉型客户，可提前预留实操时间，避免单纯理论讲解，提升教学针对性。\u003c/p\u003e\n\u003ch4 id=\"ch3-s827\"\u003e5.1.2.4 反馈的分类与应用\u003c/h4\u003e\n\u003cp\u003e向客户提供反馈是教练的核心任务之一，缺乏反馈会显著降低客户的行动坚持度。反馈主要分为内部反馈与外部反馈，两者协同作用，共同提升客户的训练效果与坚持度：\u003c/p\u003e\n\u003cp\u003e1. 反馈的分类：外部反馈是教练提供给客户的相关信息，包括强化、纠错与鼓励；内部反馈是客户自身通过听觉、触觉等感觉系统获得的体验与感知。需注意，外部反馈虽能提供直接指导，但决定客户长期坚持度的始终是内部反馈（这与内在动力、外在动力的原理一致，向内的自我感知能更有效地强化客户的行动主体性，提升坚持度，可结合第二章自我决定理论理解）。\u003c/p\u003e\n\u003ch4 id=\"ch3-s830\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：外部反馈 = 教练给的，内部反馈 = 客户自己感觉到的\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：最终让客户靠自己的感觉走，而不是一直靠教练的口哨\u003c/p\u003e\n\u003cp\u003e外部反馈的有效应用：三明治法则：为提升外部反馈的效果，可采用&quot;三明治法则&quot;，具体流程为：首先，强化客户的良好表现；其次，针对性地纠正客户的动作偏差；最后，激励客户持续练习。将纠错这一相对负面的反馈放在强化与鼓励之间，可减少客户的抵触情绪，提升反馈的接受度。\u003c/p\u003e\n\u003cp\u003e图3-13\u003c/p\u003e\n\u003ch4 id=\"ch3-s835\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：三明治法则 = 上层（肯定）+ 中层（纠错）+ 下层（鼓励）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ● 类比：就像三明治（两片面包夹着肉，好吃又健康）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：批评要包着表扬说\u003c/p\u003e\n\u003ch4 id=\"ch3-s839\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e三明治法则话术示例：\u003c/p\u003e\n\u003cp\u003e&quot;首先，你今天的深蹲整体节奏很好，保持得很稳定（肯定）。其次，我注意到你下蹲时膝盖有点内扣，这是需要注意的，下次注意膝盖朝向脚尖（纠错）。继续保持这个状态，你会越来越好的（鼓励）！&quot;\u003c/p\u003e\n\u003cp\u003e1. 纠错的核心要点：一是优先纠正最严重的错误，此类错误通常与动作安全性、动作顺序相关（如动作起始阶段的错误），需第一时间纠正，避免损伤发生；二是采用积极反馈替代消极反馈，例如用&quot;记住保持呼吸&quot;替代&quot;不要憋气&quot;；三是如需与客户进行身体接触纠正动作，需提前征得客户同意。\u003c/p\u003e\n\u003ch4 id=\"ch3-s843\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：纠错三要点（先抓安全、用正向说、接触要同意）\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：纠错是为了帮助，不是为了批评\u003c/p\u003e\n\u003ch4 id=\"ch3-s846\"\u003e🎯 教练小Tips\u003c/h4\u003e\n\u003cp\u003e积极反馈替代消极反馈：\u003c/p\u003e\n\u003cp\u003e❌ 消极：&quot;不要弓背&quot;\u003c/p\u003e\n\u003cp\u003e✓ 积极：&quot;记住挺直胸部&quot;\u003c/p\u003e\n\u003cp\u003e❌ 消极：&quot;别耸肩&quot;\u003c/p\u003e\n\u003cp\u003e✓ 积极：&quot;放松肩膀，让它们自然下垂&quot;\u003c/p\u003e\n\u003cp\u003e❌ 消极：&quot;不要憋气&quot;\u003c/p\u003e\n\u003cp\u003e✓ 积极：&quot;在推起时呼气&quot;\u003c/p\u003e\n\u003cp\u003e【实操建议】 反馈需控制频率，避免在客户实操过程中频繁打断，可在客户完成一组动作后，集中给出1-2个核心反馈，优先肯定良好表现，再针对性纠错，减少客户抵触情绪。\u003c/p\u003e\n\u003ch4 id=\"ch3-s855\"\u003e5.1.3 树立榜样\u003c/h4\u003e\n\u003cp\u003e教练自身的行为表现是影响客户行动的重要因素，树立良好的健康榜样，能显著提升教练的可信度，同时增强客户的行动信心与动力，具体要求如下：\u003c/p\u003e\n\u003cp\u003e1. 践行健康生活方式：教练自身需保持积极的训练态度与健康的生活习惯，若教练自身消极对待训练、有抽烟、酗酒等不良习惯，会大幅削弱榜样作用，影响客户的信任度与行动意愿。\u003c/p\u003e\n\u003ch4 id=\"ch3-s858\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：教练自己都做不到，凭什么让客户做？\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：榜样的力量是无声的，但效果是巨大的\u003c/p\u003e\n\u003cp\u003e1. 强化客户的自我效能：教练的榜样行为能为客户提供&quot;替代性经验&quot;（可结合自我效能相关理论理解），让客户意识到&quot;教练工作繁忙、压力大，仍能坚持训练，自己也可以做到&quot;，从而增强行动信心。反之，若教练声称&quot;自己没时间训练&quot;，会让客户质疑&quot;自己再忙也能挤出时间训练&quot;的可行性，丧失行动动力。\u003c/p\u003e\n\u003ch4 id=\"ch3-s862\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：教练的状态 = 客户的信心值\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：你是客户的&quot;可能性证明&quot;\u003c/p\u003e\n\u003cp\u003e1. 传递积极的运动理念：教练需传递&quot;运动是为了提升舒适感、减轻压力、改善身体状态&quot;的积极理念，而非单纯为了保持身材而进行过量运动或导致饮食失调。通过自身践行，让客户感受到运动的多元益处，而非仅关注力量提升、体脂减少。\u003c/p\u003e\n\u003ch4 id=\"ch3-s866\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：运动是为了更好的生活，不是为了痛苦地活着\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：让客户享受运动，而不是忍受运动\u003c/p\u003e\n\u003cp\u003e【实操建议】 教练可在日常沟通中，自然分享自身的运动体验与健康收获，避免刻意说教，让客户潜移默化接受积极的运动理念，增强榜样的感染力。\u003c/p\u003e\n\u003ch4 id=\"ch3-s870\"\u003e5.1.4 行为合约\u003c/h4\u003e\n\u003cp\u003e行为合约是一种著名的行为矫正策略，可用于辅助客户开启行动，具体实施要点如下：\u003c/p\u003e\n\u003cp\u003e1. 合约核心：与客户签订行为合约，明确约定训练目标、执行计划，同时设置合理的奖励机制，当客户达成约定目标时，给予相应奖励。\u003c/p\u003e\n\u003ch4 id=\"ch3-s873\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：行为合约 = 承诺 + 奖励\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：让承诺看得见，让奖励摸得着\u003c/p\u003e\n\u003cp\u003e1. 注意事项：外在激励（合约奖励）可有效帮助客户启动运动，但研究表明，长期坚持运动的人，核心动力来自内在激励。因此，行为合约更适用于刚开始训练的客户，帮助其建立行动习惯；同时，合约中的目标设定不宜过高（可回顾前文目标设定的相关要求），奖励需贴合客户的个人需求，确保对客户具有实际意义。\u003c/p\u003e\n\u003ch4 id=\"ch3-s877\"\u003e📚 记忆技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 记忆提示：行为合约是&quot;启动器&quot;，不是&quot;永动机&quot;\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 要点：奖励是引子，内在动力才是根本\u003c/p\u003e\n\u003ch4 id=\"ch3-s880\"\u003e行为合约范本\u003c/h4\u003e\n\u003cp\u003e行为合约范本 (时间) (频率)_ (运动量) 本人有多大信心会这样做?--分为1至10级,1表示完全没有信心,10表示完 全有信心) 如果截至_本人成功完成了这一积极生活方式的改变,本人会奖励自己 如果本人未能成功完成这一积极生活方式的改变,将失去这种奖励。 本人, ,已审阅了该合约并且本人同意在 与 讨论完成或未完成该 健康行为改善过程中的体验。 签名(客户): 签名(私人教练):)\u003c/p\u003e\n\u003cp\u003e【实操建议】 行为合约可采用书面形式，明确双方权利与约定，奖励可选择非物质奖励（如运动计划优化、额外指导时间），避免过度依赖物质奖励，逐步引导客户建立内在动力。\u003c/p\u003e\n\u003ch4 id=\"ch3-s883\"\u003e💡 关键思考\u003c/h4\u003e\n\u003cp\u003e为何教学技能是教练的核心能力？\u003c/p\u003e\n\u003cp\u003e不管前面三个阶段做得多好，如果在行动阶段无法有效教学，客户学不会动作、产生挫败感、坚持不下去，一切努力都会白费。教学技能是教练&quot;最后一公里&quot;的能力，决定了客户能否真正从训练中获益。\u003c/p\u003e\n\u003ch4 id=\"ch3-s886\"\u003e✍️小节回顾 | 第四阶段：行动阶段\u003c/h4\u003e\n\u003ch4 id=\"ch3-s887\"\u003e基本原理\u003c/h4\u003e\n\u003cp\u003e行动阶段的核心是&quot;教学&quot;。教练需理解学习三阶段和三类型，采用差异化教学策略。反馈遵循三明治法则，同时引导客户建立自我监测能力。教练自身也是教学工具，榜样力量影响客户的信心和坚持度。\u003c/p\u003e\n\u003ch4 id=\"ch3-s889\"\u003e互动考题\u003c/h4\u003e\n\u003cp\u003eQ：一位客户在认知阶段总是记不住动作细节，作为教练你会如何调整教学策略？\u003c/p\u003e\n\u003cp\u003e参考答案：\u003c/p\u003e\n\u003cp\u003e• 判断原因：是视觉型？听觉型？还是动觉型？\u003c/p\u003e\n\u003cp\u003e• 视觉型：增加示范次数，让客户多看\u003c/p\u003e\n\u003cp\u003e• 听觉型：换一种讲解方式，用不同的比喻\u003c/p\u003e\n\u003cp\u003e• 动觉型：手把手引导，让客户多感受\u003c/p\u003e\n\u003ch4 id=\"ch3-s896\"\u003e记忆小本\u003c/h4\u003e\n\u003cp\u003e表3-11\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e概念\u003c/th\u003e\u003cth\u003e关键词\u003c/th\u003e\u003cth\u003e一句话\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e学习三阶段\u003c/td\u003e\u003ctd\u003e认知、联想、自主\u003c/td\u003e\u003ctd\u003e不同阶段，不同策略\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e学习三类型\u003c/td\u003e\u003ctd\u003e视觉、听觉、动觉\u003c/td\u003e\u003ctd\u003e因材施教\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e三明治法则\u003c/td\u003e\u003ctd\u003e肯定+纠错+鼓励\u003c/td\u003e\u003ctd\u003e批评要包着表扬说\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e自我监测\u003c/td\u003e\u003ctd\u003e记录+反馈\u003c/td\u003e\u003ctd\u003e让进步看得见\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e行为合约\u003c/td\u003e\u003ctd\u003e承诺+奖励\u003c/td\u003e\u003ctd\u003e启动器不是永动机\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch3-s898\"\u003e本章总结\u003c/h3\u003e\n\u003ch3 id=\"ch3-s899\"\u003e本章核心回顾\u003c/h3\u003e\n\u003cp class=\"bullet\"\u003e• 回顾本章：默契是关系的起点，倾听是桥梁，合作是方法，教学是落地。四个阶段的核心技能环环相扣，缺一不可。\u003c/p\u003e\n\u003ch3 id=\"ch3-s901\"\u003e知识脉络图\u003c/h3\u003e\n\u003cp\u003e图3-14\u003c/p\u003e\n\u003ch3 id=\"ch3-s903\"\u003e重点内容表\u003c/h3\u003e\n\u003cp\u003e表3-12\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e阶段\u003c/th\u003e\u003cth\u003e核心任务\u003c/th\u003e\u003cth\u003e关键词\u003c/th\u003e\u003cth\u003e必背要点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e建立默契\u003c/td\u003e\u003ctd\u003e信任\u003c/td\u003e\u003ctd\u003e同理心\u003c/td\u003e\u003ctd\u003e同理心 vs 同情心；文化素养不是学历；情感态度传递中非语言信号影响显著；专业界限不可逾越\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e探讨阶段\u003c/td\u003e\u003ctd\u003e倾听\u003c/td\u003e\u003ctd\u003e动机式访谈\u003c/td\u003e\u003ctd\u003eMI四要素（协作、认同、同情、唤出）；OARS四技巧；开放式问题&gt;封闭式问题\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e计划阶段\u003c/td\u003e\u003ctd\u003e合作\u003c/td\u003e\u003ctd\u003eSMART原则\u003c/td\u003e\u003ctd\u003e五要素缺一不可；过程目标+结果目标；双向合作提升坚持度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e行动阶段\u003c/td\u003e\u003ctd\u003e教学\u003c/td\u003e\u003ctd\u003e三明治法则\u003c/td\u003e\u003ctd\u003e学习三阶段（认知→联想→自主）；学习三类型（视觉→听觉→动觉）；反馈控制频率\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch3-s905\"\u003e四、自检清单\u003c/h3\u003e\n\u003ch4 id=\"ch3-s906\"\u003e建立默契阶段自检\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我能用同理心理解客户的感受\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我没有刻板印象地对待客户\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我的仪容仪表、肢体语言传递出专业形象\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我与客户保持了适当的职业界限\u003c/p\u003e\n\u003ch4 id=\"ch3-s911\"\u003e探讨阶段自检\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我在倾听而不是在给建议\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我使用开放式问题收集信息\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我运用了动机式访谈的OARS技巧\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我处理好了客户的负面信息披露\u003c/p\u003e\n\u003ch4 id=\"ch3-s916\"\u003e计划阶段自检\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我帮助客户设定了SMART目标\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我让客户参与了计划制定\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我设定了过程目标和结果目标\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我安排了定期评估计划\u003c/p\u003e\n\u003ch4 id=\"ch3-s921\"\u003e行动阶段自检\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我能判断客户处于哪个学习阶段\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我能判断客户属于哪种学习类型\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我使用了三明治法则给反馈\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我引导客户建立了自我监测习惯\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• ☐ 我以身作则树立了健康榜样\u003c/p\u003e\n\u003ch3 id=\"ch3-s927\"\u003e知识衔接\u003c/h3\u003e\n\u003cp\u003e第五章将聚焦健康评估与运动测试。在建立合作关系的基础上，我们需要对客户进行全面的健康评估，了解客户的身体状况，为制定安全有效的训练计划提供依据。\u003c/p\u003e\n\u003cp\u003e预告问题：\u003c/p\u003e\n\u003cp\u003e1. 为什么要进行健康评估？评估哪些内容？\u003c/p\u003e\n\u003cp\u003e2. PAR-Q问卷的作用是什么？\u003c/p\u003e\n\u003cp\u003e3. 如何进行基础体能测试？\u003c/p\u003e\n\u003ch3 id=\"ch3-s933\"\u003e章末复习\u003c/h3\u003e\n\u003ch4 id=\"ch3-s934\"\u003e第一件事：复述四大阶段\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 用2分钟时间，向身边人（甚至对着镜子）复述教练与客户四大合作阶段：建立默契→探讨→计划→行动，以及每个阶段的核心要点。\u003c/p\u003e\n\u003ch4 id=\"ch3-s936\"\u003e第二件事：练习一个技巧\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 选择一个你不太擅长的技巧（如动机式访谈、三明治法则），设计一个具体场景，在下一周的工作中刻意练习。\u003c/p\u003e\n\u003ch4 id=\"ch3-s938\"\u003e第三件事：记录一个案例\u003c/h4\u003e\n\u003cp class=\"bullet\"\u003e• 回忆你最近一次与客户的沟通，判断处于哪个阶段？使用了哪些技巧？效果如何？有哪些可以改进的地方？\u003c/p\u003e\n\u003ch3 id=\"ch3-s940\"\u003e全章小结\u003c/h3\u003e\n\u003ch3 id=\"ch3-s941\"\u003e核心要义凝练\u003c/h3\u003e\n\u003cp\u003e1. 四大阶段是框架：建立默契、探讨、计划、行动，循序渐进、环环相扣\u003c/p\u003e\n\u003cp\u003e2. 默契是地基：贯穿四个阶段，是一切合作的基础\u003c/p\u003e\n\u003cp\u003e3. 探讨靠耳朵：倾听比说话更重要，动机式访谈是必备技能\u003c/p\u003e\n\u003cp\u003e4. 计划靠合作：SMART目标是标准，双向参与是关键\u003c/p\u003e\n\u003cp\u003e5. 行动靠教学：学习有规律，教学有技巧，反馈有方法\u003c/p\u003e\n\u003ch3 id=\"ch3-s947\"\u003e全章核心概念速查表\u003c/h3\u003e\n\u003cp\u003e表3-13\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e概念\u003c/th\u003e\u003cth\u003e核心要点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e建立默契\u003c/td\u003e\u003ctd\u003e同理心、文化素养、第一印象、非语言沟通、专业边界\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e探讨阶段\u003c/td\u003e\u003ctd\u003e积极倾听、动机式访谈、OARS技巧、四要素（协作、认同、同情、唤出）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e计划阶段\u003c/td\u003e\u003ctd\u003eSMART原则、过程目标与结果目标、双向合作\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e行动阶段\u003c/td\u003e\u003ctd\u003e学习三阶段、学习三类型、三明治法则、自我监测、行为合约\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch3-s949\"\u003e常见误区汇总\u003c/h3\u003e\n\u003ch4 id=\"ch3-s950\"\u003e动机式访谈的常见误区\u003c/h4\u003e\n\u003cp\u003e1. 问太多：问一句就开始说教，没有耐心等客户回答\u003c/p\u003e\n\u003cp\u003e2. 否定客户：&quot;你这个想法不对……&quot;\u003c/p\u003e\n\u003cp\u003e3. 直接给答案：&quot;你应该这样做……&quot;\u003c/p\u003e\n\u003cp\u003e4. 过度共情：&quot;我理解你，我也有这种情况&quot;（变成在说你自己的事）\u003c/p\u003e\n\u003cp\u003e5. 审讯式提问：&quot;你上周训练了几次？每天几点睡？吃了什么？&quot;（变成审问）\u003c/p\u003e\n\u003ch4 id=\"ch3-s956\"\u003e建立默契的常见误区\u003c/h4\u003e\n\u003cp\u003e1. 急于给建议：还没了解清楚就开始&quot;指导&quot;\u003c/p\u003e\n\u003cp\u003e2. 刻板印象：用固有观念判断客户\u003c/p\u003e\n\u003cp\u003e3. 忽视非语言沟通：只关注说了什么，不关注怎么说的\u003c/p\u003e\n\u003cp\u003e4. 关系越界：和客户发展出超出职业范围的关系\u003c/p\u003e\n\u003ch4 id=\"ch3-s961\"\u003e计划阶段的常见误区\u003c/h4\u003e\n\u003cp\u003e1. 教练单方面制定：不征求客户意见\u003c/p\u003e\n\u003cp\u003e2. 目标不SMART：模糊、不可测量\u003c/p\u003e\n\u003cp\u003e3. 忽视客户反馈：计划制定后不再调整\u003c/p\u003e\n\u003ch4 id=\"ch3-s965\"\u003e行动阶段的常见误区\u003c/h4\u003e\n\u003cp\u003e1. 一套方法用到底：不区分学习阶段和类型\u003c/p\u003e\n\u003cp\u003e2. 反馈过多或过少：要么频繁打断，要么从不反馈\u003c/p\u003e\n\u003cp\u003e3. 忽视自我监测：不引导客户记录进展\u003c/p\u003e\n\u003ch4 id=\"ch3-s969\"\u003e思考与练习\u003c/h4\u003e\n\u003ch4 id=\"ch3-s970\"\u003e思考题\u003c/h4\u003e\n\u003cp\u003e思考题1：一位50岁的女性客户第一次来健身房，她说&quot;我这种年纪的人来健身房，会不会被人笑话？&quot;请设计你的回应话术，体现同理心和文化素养。\u003c/p\u003e\n\u003cp\u003e思考题2：一位客户说&quot;我知道运动好，但是我就是懒得动&quot;，请使用动机式访谈技巧设计一段沟通，引导客户自己说出想要改变的原因。\u003c/p\u003e\n\u003cp\u003e思考题3：一位客户在认知阶段总是记不住动作细节，作为教练你会如何调整教学策略？请结合学习三阶段和学习类型来设计。\u003c/p\u003e\n\u003ch4 id=\"ch3-s974\"\u003e选择题\u003c/h4\u003e\n\u003cp\u003eQ1：以下关于四大合作阶段的描述，正确的是？\u003c/p\u003e\n\u003cp\u003eA. 四个阶段是有助于组织合作过程的框架，实际工作中可根据客户情况往返调整\u003c/p\u003e\n\u003cp\u003eB. 建立默契只发生在初次见面，之后就不重要了\u003c/p\u003e\n\u003cp\u003eC. 探讨阶段的核心是倾听和收集信息\u003c/p\u003e\n\u003cp\u003eD. 计划阶段可以由教练单方面制定，客户只需执行\u003c/p\u003e\n\u003cp\u003e答案：B、C\u003c/p\u003e\n\u003cp\u003eQ2：以下哪项不属于OARS技巧？\u003c/p\u003e\n\u003cp\u003eA. 开放式问题\u003c/p\u003e\n\u003cp\u003eB. 指令式沟通\u003c/p\u003e\n\u003cp\u003eC. 印证式倾听\u003c/p\u003e\n\u003cp\u003eD. 内容总结\u003c/p\u003e\n\u003cp\u003e答案：B\u003c/p\u003e\n\u003cp\u003eQ3：以下哪种反馈方式最符合&quot;三明治法则&quot;？\u003c/p\u003e\n\u003cp\u003eA. &quot;你这个动作完全错了，应该是这样……&quot;\u003c/p\u003e\n\u003cp\u003eB. &quot;首先，你上周的训练完成得很好；其次，这个动作的下背部下沉需要注意；最后，继续保持这个节奏。&quot;\u003c/p\u003e\n\u003cp\u003eC. &quot;你做得不错，但你还是不会。&quot;\u003c/p\u003e\n\u003cp\u003eD. &quot;我不管你怎么练，你开心就好。&quot;\u003c/p\u003e\n\u003cp\u003e答案：B\u003c/p\u003e\n\u003cp\u003eQ4：以下哪个目标最符合SMART原则？\u003c/p\u003e\n\u003cp\u003eA. &quot;我想减肥，越多越好&quot;\u003c/p\u003e\n\u003cp\u003eB. &quot;3个月减掉15斤，每周训练3次，每次45分钟&quot;\u003c/p\u003e\n\u003cp\u003eC. &quot;我想变得更健康&quot;\u003c/p\u003e\n\u003cp\u003eD. &quot;减到满意为止&quot;\u003c/p\u003e\n\u003cp\u003e答案：B\u003c/p\u003e\n\u003cp\u003eQ5：关于学习三阶段的描述，正确的是？\u003c/p\u003e\n\u003cp\u003eA. 认知阶段客户应该少练习，多观察\u003c/p\u003e\n\u003cp\u003eB. 联想阶段仍需要反馈，但应随技能改善逐步减少不必要的频率\u003c/p\u003e\n\u003cp\u003eC. 自主阶段教练的角色是观察者\u003c/p\u003e\n\u003cp\u003eD. 三个阶段是线性发展的，所有客户都完全遵循\u003c/p\u003e\n\u003cp\u003e答案：B、C\u003c/p\u003e\n\u003cp class=\"bullet\"\u003e• 第3章完。进入下一章前，请回顾四个合作阶段的核心要点：阶段框架用于组织合作过程，默契关系贯穿始终，教学技巧支持客户将计划付诸行动。\u003c/p\u003e\n\u003cp\u003e运动前健康筛查\u003c/p\u003e\n\u003cp\u003e第     4章\u003c/p\u003e","sections":[{"title":"第3章 有效的沟通、目标设定和教学技巧","anchor":"ch3-s0"},{"title":"学员预习专用","anchor":"ch3-s1"},{"title":"正文部分","anchor":"ch3-s41"},{"title":"1 建立默契关系阶段","anchor":"ch3-s71"},{"title":"2 探讨阶段","anchor":"ch3-s338"},{"title":"3 计划阶段","anchor":"ch3-s578"},{"title":"4 行动阶段","anchor":"ch3-s721"},{"title":"本章总结","anchor":"ch3-s898"},{"title":"本章核心回顾","anchor":"ch3-s899"},{"title":"知识脉络图","anchor":"ch3-s901"},{"title":"重点内容表","anchor":"ch3-s903"},{"title":"四、自检清单","anchor":"ch3-s905"},{"title":"知识衔接","anchor":"ch3-s927"},{"title":"章末复习","anchor":"ch3-s933"},{"title":"全章小结","anchor":"ch3-s940"},{"title":"核心要义凝练","anchor":"ch3-s941"},{"title":"全章核心概念速查表","anchor":"ch3-s947"},{"title":"常见误区汇总","anchor":"ch3-s949"}],"paragraphCount":1008},"4":{"html":"\u003ch2 id=\"ch4-s0\"\u003e第4章 运动前健康筛查\u003c/h2\u003e\n\u003cp\u003e基于《面向运动专业人员的私教训练指南》第5章整理，面向ACE-CPT备考学员。\u003c/p\u003e\n\u003cp\u003eACEpresso说明：本教辅严格遵循三段结构：预习段（课前快速定位）→ 正文段（逐节精讲+记忆技巧+教练小Tips）→ 复习段（课后高效复盘）。\u003c/p\u003e\n\u003ch4 id=\"ch4-s3\"\u003e本章导读\u003c/h4\u003e\n\u003cp\u003e本章帮助你理解运动前健康筛查的目的、流程和执业边界，并掌握常用筛查工具、附加表格以及药物可能对运动反应产生的影响。\u003c/p\u003e\n\u003cp\u003e学习时请始终围绕四项信息进行判断：客户是否定期运动、是否存在已知心血管、代谢或肾脏疾病、是否有相关体征或症状，以及计划进行的运动强度。\u003c/p\u003e\n\u003ch3 id=\"ch4-s6\"\u003e学员预习专用\u003c/h3\u003e\n\u003ch4 id=\"ch4-s7\"\u003e本章核心知识点（学习目标/必考清单）\u003c/h4\u003e\n\u003cp\u003e表4-1\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e序号\u003c/th\u003e\u003cth\u003e核心知识点\u003c/th\u003e\u003cth\u003e重要程度\u003c/th\u003e\u003cth\u003e备注\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e1\u003c/td\u003e\u003ctd\u003e运动的固有健康风险与风险三角\u003c/td\u003e\u003ctd\u003e⭐⭐⭐\u003c/td\u003e\u003ctd\u003e选择题/案例分析高频\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e2\u003c/td\u003e\u003ctd\u003eACSM运动前筛查算法（三轴决策）\u003c/td\u003e\u003ctd\u003e⭐⭐⭐⭐⭐\u003c/td\u003e\u003ctd\u003e核心重点，必考\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3\u003c/td\u003e\u003ctd\u003e运动前健康筛查问卷（图4-1）三步法\u003c/td\u003e\u003ctd\u003e⭐⭐⭐⭐\u003c/td\u003e\u003ctd\u003e选择题高频\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e4\u003c/td\u003e\u003ctd\u003eACE ABC沟通法\u003c/td\u003e\u003ctd\u003e⭐⭐⭐\u003c/td\u003e\u003ctd\u003e实践应用\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e抗阻训练筛查要求\u003c/td\u003e\u003ctd\u003e⭐⭐\u003c/td\u003e\u003ctd\u003e理解即可\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e6\u003c/td\u003e\u003ctd\u003ePAR-Q+三色判定\u003c/td\u003e\u003ctd\u003e⭐⭐⭐⭐\u003c/td\u003e\u003ctd\u003e选择题高频\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003eAACVPR风险分层（临床环境）\u003c/td\u003e\u003ctd\u003e⭐⭐\u003c/td\u003e\u003ctd\u003e了解差异\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003e附加表格体系\u003c/td\u003e\u003ctd\u003e⭐⭐\u003c/td\u003e\u003ctd\u003e了解流程\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e9\u003c/td\u003e\u003ctd\u003e药物对心率的影响（β-阻滞剂、利尿剂等）\u003c/td\u003e\u003ctd\u003e⭐⭐⭐⭐\u003c/td\u003e\u003ctd\u003e高频考点\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch4-s9\"\u003e一、本章核心\u003c/h4\u003e\n\u003cp\u003e运动前健康筛查的核心目的：识别谁需要先看医生，确保在安全的前提下帮助更多人开始并维持运动。\u003c/p\u003e\n\u003ch4 id=\"ch4-s11\"\u003e二、核心板块速览表\u003c/h4\u003e\n\u003cp\u003e表4-2\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e模块\u003c/th\u003e\u003cth\u003e内容\u003c/th\u003e\u003cth\u003e核心逻辑\u003c/th\u003e\u003cth\u003e记住一句话\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块1\u003c/td\u003e\u003ctd\u003e运动的固有健康风险\u003c/td\u003e\u003ctd\u003e风险来自&quot;不习惯+已患病+接近极限&quot;组合\u003c/td\u003e\u003ctd\u003e运动整体有益，但需筛查\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块2\u003c/td\u003e\u003ctd\u003eACSM筛查算法\u003c/td\u003e\u003ctd\u003e三轴决策：运动×疾病×症状\u003c/td\u003e\u003ctd\u003e相关体征或症状会触发医学许可流程 （定期+有疾病无症状+中强度：可考虑免除）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块3\u003c/td\u003e\u003ctd\u003e参前问卷\u003c/td\u003e\u003ctd\u003e三步走：症状→活动→疾病\u003c/td\u003e\u003ctd\u003e第一步阳性直接停\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块4\u003c/td\u003e\u003ctd\u003eACE ABC沟通法\u003c/td\u003e\u003ctd\u003e问需求→解障碍→一起干\u003c/td\u003e\u003ctd\u003e医学许可不是拒绝\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块5\u003c/td\u003e\u003ctd\u003e抗阻训练筛查\u003c/td\u003e\u003ctd\u003e证据不足，风险较低\u003c/td\u003e\u003ctd\u003e通用筛查仍要做\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块6\u003c/td\u003e\u003ctd\u003ePAR-Q+\u003c/td\u003e\u003ctd\u003e三色判定：绿/红/黄\u003c/td\u003e\u003ctd\u003e减少不必要障碍\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块7\u003c/td\u003e\u003ctd\u003e临床环境筛查\u003c/td\u003e\u003ctd\u003e比通用更深\u003c/td\u003e\u003ctd\u003e心脏康复用AACVPR\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块8\u003c/td\u003e\u003ctd\u003e附加表格\u003c/td\u003e\u003ctd\u003e四表一审核\u003c/td\u003e\u003ctd\u003e法律文件需律师审核\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e模块9\u003c/td\u003e\u003ctd\u003e药物对心率影响\u003c/td\u003e\u003ctd\u003eβ阻心低换RPE/利尿脱水多补水\u003c/td\u003e\u003ctd\u003e降压药防体位低\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch4-s13\"\u003e三、必背关键数字表\u003c/h4\u003e\n\u003cp\u003e表4-3\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e数字/阈值\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e考试提示\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e3个月\u003c/td\u003e\u003ctd\u003e「定期运动」定义的时间窗口\u003c/td\u003e\u003ctd\u003e必须是过去3个月内的活动记录\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e每周≥3天\u003c/td\u003e\u003ctd\u003e「定期运动」的频率要求\u003c/td\u003e\u003ctd\u003e少于3天=不定期运动\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e每次≥30分钟\u003c/td\u003e\u003ctd\u003e「定期运动」的时长要求\u003c/td\u003e\u003ctd\u003e单次至少30分钟\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e中等强度\u003c/td\u003e\u003ctd\u003e「定期运动」的强度要求\u003c/td\u003e\u003ctd\u003e40-59% HRR / RPE 12-13\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e≥60% HRR\u003c/td\u003e\u003ctd\u003e高强度阈值\u003c/td\u003e\u003ctd\u003e高强度=需要更多许可\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e每周150分钟\u003c/td\u003e\u003ctd\u003e健康活动目标（PAR-Q+绿色建议）\u003c/td\u003e\u003ctd\u003e目标值，非起始要求\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e发烧（体温升高）\u003c/td\u003e\u003ctd\u003e发烧阈值（PAR-Q+黄色判定）\u003c/td\u003e\u003ctd\u003e暂时性健康问题需延迟增加活动\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch4-s15\"\u003e四、名词缩写表\u003c/h4\u003e\n\u003cp\u003e表4-4\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e缩写\u003c/th\u003e\u003cth\u003e全称\u003c/th\u003e\u003cth\u003e中文含义\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eACSM\u003c/td\u003e\u003ctd\u003eAmerican College of Sports Medicine\u003c/td\u003e\u003ctd\u003e美国运动医学会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCVD\u003c/td\u003e\u003ctd\u003eCardiovascular Disease\u003c/td\u003e\u003ctd\u003e心血管疾病\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAMI\u003c/td\u003e\u003ctd\u003eAcute Myocardial Infarction\u003c/td\u003e\u003ctd\u003e急性心肌梗死\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSCD\u003c/td\u003e\u003ctd\u003eSudden Cardiac Death\u003c/td\u003e\u003ctd\u003e心源性猝死\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHRR\u003c/td\u003e\u003ctd\u003eHeart Rate Reserve\u003c/td\u003e\u003ctd\u003e心率储备\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVO₂R\u003c/td\u003e\u003ctd\u003eOxygen Uptake Reserve\u003c/td\u003e\u003ctd\u003e摄氧量储备\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRPE\u003c/td\u003e\u003ctd\u003eRating of Perceived Exertion\u003c/td\u003e\u003ctd\u003e自感用力度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMET\u003c/td\u003e\u003ctd\u003eMetabolic Equivalent of Task\u003c/td\u003e\u003ctd\u003e代谢当量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePAR-Q+\u003c/td\u003e\u003ctd\u003ePhysical Activity Readiness Questionnaire-Plus\u003c/td\u003e\u003ctd\u003e身体活动准备程度问卷（增强版）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAACVPR\u003c/td\u003e\u003ctd\u003eAmerican Association of Cardiovascular and Pulmonary Rehabilitation\u003c/td\u003e\u003ctd\u003e美国心血管和肺康复协会\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eβ-阻滞剂\u003c/td\u003e\u003ctd\u003eBeta-blocker\u003c/td\u003e\u003ctd\u003eβ-肾上腺素能受体阻滞剂\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eARB\u003c/td\u003e\u003ctd\u003eAngiotensin Receptor Blocker\u003c/td\u003e\u003ctd\u003e血管紧张素受体拮抗剂\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCCB\u003c/td\u003e\u003ctd\u003eCalcium Channel Blocker\u003c/td\u003e\u003ctd\u003e钙通道阻滞剂\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eACE抑制剂\u003c/td\u003e\u003ctd\u003eACE Inhibitor\u003c/td\u003e\u003ctd\u003e血管紧张素转换酶抑制剂\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNSAID\u003c/td\u003e\u003ctd\u003eNonsteroidal Anti-Inflammatory Drug\u003c/td\u003e\u003ctd\u003e非甾体抗炎药\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCOPD\u003c/td\u003e\u003ctd\u003eChronic Obstructive Pulmonary Disease\u003c/td\u003e\u003ctd\u003e慢性阻塞性肺疾病\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch4-s17\"\u003e预习思考与练习\u003c/h4\u003e\n\u003cp\u003e思考题（预习时思考，听课后验证）：\u003c/p\u003e\n\u003cp\u003e有位客户说自己&quot;完全健康&quot;，但问卷里勾了&quot;偶尔头晕&quot;。他坚持说自己只是睡眠不足。作为教练，你应该怎么处理？医学许可和&quot;不信任客户&quot;有什么区别？\u003c/p\u003e\n\u003cp\u003e选择题（预习时尝试作答）：\u003c/p\u003e\n\u003cp\u003e关于&quot;定期运动&quot;的定义，以下哪项是正确的？\u003c/p\u003e\n\u003cp\u003e- A. 过去1个月每周跑2次，每次20分钟\u003c/p\u003e\n\u003cp\u003e- B. 过去3个月每周游泳3次，每次45分钟\u003c/p\u003e\n\u003cp\u003e- C. 每天走路上班，加起来超过30分钟\u003c/p\u003e\n\u003cp\u003e- D. 每周打1次羽毛球，每次2小时\u003c/p\u003e\n\u003cp\u003e参考答案见正文模块2\u003c/p\u003e\n\u003ch3 id=\"ch4-s27\"\u003e正文部分\u003c/h3\u003e\n\u003ch3 id=\"ch4-s28\"\u003e1 运动的固有健康风险\u003c/h3\u003e\n\u003ch4 id=\"ch4-s29\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e● 规律运动降低心血管疾病(CVD)、肺部疾病、代谢性疾病、某些癌症、焦虑抑郁和过早死亡风险\u003c/p\u003e\n\u003cp\u003e● 但运动存在固有风险：对健康个体，中等强度运动不会引发心血管或肌肉骨骼危险事件\u003c/p\u003e\n\u003cp\u003e● 风险升高的三类人群：①运动习惯不佳 ②已患病个体（已诊断CVD/代谢/肾脏疾病）③计划进行接近极限强度运动的个体\u003c/p\u003e\n\u003cp\u003e● 有潜在CVD的个体进行不习惯的剧烈身体活动时，运动相关的急性心肌梗死(AMI)和心源性猝死(SCD)风险最高\u003c/p\u003e\n\u003cp\u003e● 无症状个体即使高强度运动，心血管不良事件风险仍极低\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e记忆提示：不习惯运动、已患相关疾病与突然进行接近极限的活动同时出现时，急性心血管事件的风险最值得警惕。这个“风险三角”用于帮助理解风险来源，不代替正式筛查。\u003c/p\u003e\n\u003cp\u003e理解类比：火灾风险会随燃料、氧气和点火源的组合而改变。同样，运动风险也取决于客户状态与运动暴露的组合，不能只根据某一项信息作出结论。\u003c/p\u003e\n\u003cp\u003e● • • 补充理解：风险最高的场景 = 有潜在CVD + 突然进行不习惯的剧烈运动（如久坐多年的中年人突然参加篮球比赛）。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：第一次见新客户，他精力充沛地说&quot;我准备好了，给我上强度！&quot;\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：热情响应，立刻安排高强度训练跳过筛查。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：先筛查问卷了解情况。把筛查当成&quot;给他一个安全运动的环境&quot;，而不是&quot;刁难他&quot;。\u003c/p\u003e\n\u003cp\u003e• 常见误区：把筛查当成对客户健康的质疑。其实筛查是标准流程，保护双方。\u003c/p\u003e\n\u003cp\u003e💡 关键思考：\u003c/p\u003e\n\u003cp\u003e风险≠不运动。核心逻辑是：运动有益，但不习惯的剧烈运动对已患病/有症状个体确实危险。 筛查的目标是识别谁需要先看医生。\u003c/p\u003e\n\u003ch4 id=\"ch4-s46\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：运动整体有益，但&quot;不习惯的剧烈运动 + 已患病/有症状个体&quot;这个组合确实存在风险。 筛查用于识别风险，不用于拒绝客户。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e运动相关心血管事件风险最高的人群是？\u003c/p\u003e\n\u003cp\u003e● A. 长期规律运动的无症状个体\u003c/p\u003e\n\u003cp\u003e● B. 有潜在CVD、进行不习惯剧烈运动的个体 ✅\u003c/p\u003e\n\u003cp\u003e● C. 每周运动5次的健康个体\u003c/p\u003e\n\u003cp\u003e记忆小本：风险三角——不习惯+已患病+接近极限，三者齐备才高危。\u003c/p\u003e\n\u003ch4 id=\"ch4-s54\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ 运动整体有益，但存在固有风险，风险主要来自&quot;不习惯的剧烈运动 + 已患病/有症状个体&quot;这个组合\u003c/p\u003e\n\u003cp\u003e● ✅ 规律运动的无症状个体，即使高强度，心血管事件风险也很低\u003c/p\u003e\n\u003cp\u003e● ✅ 筛查的核心目的是识别高风险人群\u003c/p\u003e\n\u003cp\u003e● ✅ 风险三角 = 不习惯 + 已患病 + 接近极限，三者齐备时风险最高\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：有位客户说他每天遛狗30分钟，问这算不算&quot;定期运动&quot;。从风险角度看，你认为这能降低他的运动风险吗？为什么？\u003c/p\u003e\n\u003cp\u003e选择题：关于运动的固有风险，以下说法正确的是？\u003c/p\u003e\n\u003cp\u003e• A. 只要运动就有风险，最好不运动\u003c/p\u003e\n\u003cp\u003e• B. 无症状个体高强度运动风险也很低 ✅\u003c/p\u003e\n\u003cp\u003e• C. 有CVD但无症状的人做任何运动都危险\u003c/p\u003e\n\u003cp\u003e• D. 风险三角中&quot;接近极限&quot;是最重要的因素\u003c/p\u003e\n\u003ch3 id=\"ch4-s67\"\u003e2 运动前健康筛查\u003c/h3\u003e\n\u003ch4 id=\"ch4-s68\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e筛查基于三个风险调节因素：（注：本节基于ACSM 2018更新版筛查算法，与2014版相比有重大变化）：\u003c/p\u003e\n\u003cp\u003e1. 个人目前身体活动水平\u003c/p\u003e\n\u003cp\u003e2. 是否确诊CVD/代谢/肾脏疾病，或有无相关体征/症状\u003c/p\u003e\n\u003cp\u003e3. 期望运动强度\u003c/p\u003e\n\u003cp\u003e「定期运动」的定义：\u003c/p\u003e\n\u003cp\u003e过去3个月内，每周至少3天，至少30分钟有计划、有组织的中等强度身体活动\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● • 口诀：「3-3-30」= 3个月，每周3天，每天30分钟。\u003c/p\u003e\n\u003cp\u003e● • 类比：类比&quot;定期存款&quot;：有固定&quot;存款记录&quot;才能享受更低&quot;利率&quot;（筛查门槛）。\u003c/p\u003e\n\u003cp\u003e● • 一句话记牢：定期运动是客户的&quot;信用记录&quot;，有记录者门槛更低。\u003c/p\u003e\n\u003cp\u003e筛查算法—— 不参加定期运动的人：\u003c/p\u003e\n\u003cp\u003e注：以下表格中&quot;疾病&quot;特指CVD（心血管疾病）、代谢性疾病和肾脏疾病三类\u003c/p\u003e\n\u003cp\u003e表4-5\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e条件\u003c/th\u003e\u003cth\u003e是否需要医学许可\u003c/th\u003e\u003cth\u003e建议运动强度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e无CVD/代谢/肾脏疾病 + 无体征/症状\u003c/td\u003e\u003ctd\u003e不需要\u003c/td\u003e\u003ctd\u003e轻度→中等→逐步提高到高强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已知患有CVD/代谢/肾脏疾病但无症状\u003c/td\u003e\u003ctd\u003e需要\u003c/td\u003e\u003ctd\u003e轻度→中等→根据许可逐步提高\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e有CVD/代谢/肾脏疾病的体征/症状（不论疾病状态）\u003c/td\u003e\u003ctd\u003e需要\u003c/td\u003e\u003ctd\u003e先获许可，再轻度→中等→逐步提高\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e筛查算法—— 参加定期运动的人：\u003c/p\u003e\n\u003cp\u003e表4-6\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e条件\u003c/th\u003e\u003cth\u003e是否需要医学许可\u003c/th\u003e\u003cth\u003e建议运动强度\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e无CVD/代谢/肾脏疾病 + 无体征/症状\u003c/td\u003e\u003ctd\u003e不需要\u003c/td\u003e\u003ctd\u003e继续中等或高强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e已知患有CVD/代谢/肾脏疾病但无症状\u003c/td\u003e\u003ctd\u003e中等强度不需要；高强度需要\u003c/td\u003e\u003ctd\u003e中等强度继续；获许可后逐步提高到可接受强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e有CVD/代谢/肾脏疾病的体征/症状（不论疾病状态）\u003c/td\u003e\u003ctd\u003e中断运动，需要医学许可\u003c/td\u003e\u003ctd\u003e获许可后继续\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e●  口诀：「症状是老大，有病看强度，无病随便动」。症状永远第一，有病看强度，无病直接放行。\u003c/p\u003e\n\u003cp\u003e●  类比： 定期运动者相当于拿到了&quot;通行证&quot;，同等条件下比不定期运动者多了&quot;中等强度自由行&quot;这一项权益。\u003c/p\u003e\n\u003cp\u003e● 考试提示：定期运动+有疾病无症状+中等强度=可考虑免除许可，这是定期运动的&quot;福利&quot;。注意ACSM原文用的是&quot;may consider&quot;（可考虑），不是&quot;不需要&quot;。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户勾选了&quot;运动时偶尔胸闷&quot;，但他说&quot;可能是我吃太饱了&quot;。\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：跟客户辩论他的症状原因，试图判断是否&quot;真的&quot;需要许可。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：不要诊断，转介优先。&quot;这种情况我们需要医生确认一下，排除心脏方面的顾虑，对你对我都是保护。&quot;症状触发许可，不需要你判断真假。\u003c/p\u003e\n\u003cp\u003e• 常见误区：把&quot;不需要医学许可&quot;误解为&quot;不需要筛查问卷&quot;。所有客户都要填问卷，结果决定后续动作。\u003c/p\u003e\n\u003cp\u003e需警惕的体征/症状（必背）：\u003c/p\u003e\n\u003cp\u003e● 可能因心肌缺血导致的胸、颈、颌、手臂等部位疼痛/不适\u003c/p\u003e\n\u003cp\u003e● 休息或轻度用力时呼吸急促（呼吸困难）\u003c/p\u003e\n\u003cp\u003e● 端坐呼吸 / 阵发性夜间呼吸困难\u003c/p\u003e\n\u003cp\u003e● 眩晕或晕厥\u003c/p\u003e\n\u003cp\u003e● 踝水肿\u003c/p\u003e\n\u003cp\u003e● 心悸或心动过速\u003c/p\u003e\n\u003cp\u003e● 间歇性跛行\u003c/p\u003e\n\u003cp\u003e● 已知的心杂音\u003c/p\u003e\n\u003cp\u003e● 日常活动时异常疲劳或呼吸急促\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「胸颈颌臂疼、呼吸休息急、晕眩踝肿悸、跛行杂音疲」——首字连成记忆链。\u003c/p\u003e\n\u003cp\u003e理解类比：体征或症状像仪表盘上的警示灯，它不能告诉教练具体故障是什么，却提醒教练暂缓或中断运动，并按筛查流程获得医学许可。\u003c/p\u003e\n\u003cp\u003e● 一句话记牢：心脏缺血样疼痛+呼吸困难+晕眩 = 立刻停，三大红灯。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户说&quot;我爬楼梯有点喘，这是不是正常？&quot;\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：凭经验判断&quot;应该没事&quot;，继续训练。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：将&quot;喘&quot;记录下来，结合其他症状综合判断。如果休息时也喘，或日常活动就喘，这是危险信号。\u003c/p\u003e\n\u003cp\u003e• 常见误区：认为客户年轻就&quot;肯定没事&quot;。任何年龄段出现这些症状都需要认真对待。\u003c/p\u003e\n\u003cp\u003e运动强度分级（注释6-8）：\u003c/p\u003e\n\u003cp\u003e表4-7\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e强度\u003c/th\u003e\u003cth\u003e%HRR / %VO₂R\u003c/th\u003e\u003cth\u003eMET\u003c/th\u003e\u003cth\u003eRPE\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e低\u003c/td\u003e\u003ctd\u003e&lt;40%\u003c/td\u003e\u003ctd\u003e2-2.9\u003c/td\u003e\u003ctd\u003e9-11\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e中\u003c/td\u003e\u003ctd\u003e40-59%\u003c/td\u003e\u003ctd\u003e3-5.9\u003c/td\u003e\u003ctd\u003e12-13\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e高\u003c/td\u003e\u003ctd\u003e≥60%\u003c/td\u003e\u003ctd\u003e≥6\u003c/td\u003e\u003ctd\u003e14-17\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「低39中59高60」——记住三个关键百分数。\u003c/p\u003e\n\u003cp\u003e● 类比：强度好比烧水火力：低火（&lt;40%）不沸腾，中火（40-59%）慢炖，高火（≥60%）快煮。\u003c/p\u003e\n\u003cp\u003e● 一句话记牢：RPE 12-13 = 中等强度 = 说话测试能说句子但不能唱歌。\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003eACSM筛查算法是一个三叉决策树，两个入口（不定期 vs 定期运动），三个出口（无需许可 / 需要许可 / 中断+需要许可）。关键区分点：\u003c/p\u003e\n\u003cp\u003e• 「有无疾病」和「有无症状」是两件事 ，有症状不论疾病状态都要医学许可• 定期运动者比不定期运动者门槛低：同是有疾病但无症状，定期运动者做中等强度 可考虑免除（ACSM原文&quot;may consider&quot;）许可\u003c/p\u003e\n\u003cp\u003e• 「体征/症状」是最强的触发器 ，不管有没有疾病、有没有在运动，有症状就停\u003c/p\u003e\n\u003ch4 id=\"ch4-s122\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：筛查算法 = 运动史（定期/不定期）× 疾病状态（有/无）× 体征/症状（有/无）。 症状是&quot;总开关&quot;，有症状即触发许可。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003eQ1：一位客户每周散步2天、每次15分钟，患有2型糖尿病但无症状。根据筛查算法，需要医学许可吗？\u003c/p\u003e\n\u003cp\u003e✅ 需要。她不满足「定期运动」定义（至少3月/每周3天/每次30分钟中等强度），且有代谢性疾病，需要医学许可。\u003c/p\u003e\n\u003cp\u003eQ2：一位客户过去6个月每周跑步4天、每次40分钟，有高血压但控制良好、无症状，想做中等强度有氧。需要医学许可吗？\u003c/p\u003e\n\u003cp\u003e❌ 可考虑免除。定期运动 + 有疾病但无症状 + 中等强度 = ACSM建议可考虑免除医学许可（原文&quot;may consider&quot;）。\u003c/p\u003e\n\u003cp\u003eQ3：定期运动的客户，已知患有CVD但无症状，想做高强度有氧运动，过去12个月体征/症状没有变化。需要医学许可吗？\u003c/p\u003e\n\u003cp\u003e✅ 需要。定期运动 + 有CVD + 无症状 + 高强度 = 建议获得医学许可。\u003c/p\u003e\n\u003cp\u003e记忆小本：「运动 × 疾病 × 症状」三轴 → 症状 &gt; 疾病 &gt; 运动史\u003c/p\u003e\n\u003ch4 id=\"ch4-s132\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ ACSM筛查算法是三轴决策：运动史（定期/不定期）× 疾病状态（有/无）× 体征/症状（有/无）\u003c/p\u003e\n\u003cp\u003e● ✅ 三个触发医学许可的情况：不定期+有疾病、不定期+有症状、定期+有症状+高强度\u003c/p\u003e\n\u003cp\u003e● ✅ 症状是最强触发器，有症状不论疾病状态和运动史，都要医学许可\u003c/p\u003e\n\u003cp\u003e● ✅ 定期运动者门槛更低：同样有疾病无症状，定期运动者中等强度考虑免除许可（ACSM原文&quot;may consider&quot;）\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：有位定期跑步的客户说自己&quot;完全健康&quot;，但问卷里勾了&quot;偶尔头晕&quot;。他坚持说自己只是睡眠不足。你会怎么处理？为什么？\u003c/p\u003e\n\u003cp\u003e选择题：关于&quot;定期运动&quot;的定义，以下哪项是正确的？\u003c/p\u003e\n\u003cp\u003e• A. 过去1个月每周跑2次，每次20分钟\u003c/p\u003e\n\u003cp\u003e• B. 过去3个月每周游泳3次，每次45分钟 ✅\u003c/p\u003e\n\u003cp\u003e• C. 每天走路上班，加起来超过30分钟\u003c/p\u003e\n\u003cp\u003e• D. 每周打1次羽毛球，每次2小时\u003c/p\u003e\n\u003ch4 id=\"ch4-s145\"\u003e运动前健康筛查问卷\u003c/h4\u003e\n\u003cp\u003e图4-1\u003c/p\u003e\n\u003ch4 id=\"ch4-s147\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e● 问卷分3步：①症状（6项）→ ②目前活动（是否定期运动）→ ③身体状况（9项疾病勾选）\u003c/p\u003e\n\u003cp\u003e● 第1步有任何勾选 = 停止，需医学许可\u003c/p\u003e\n\u003cp\u003e● 第2步：是否满足定期运动定义\u003c/p\u003e\n\u003cp\u003e● 第3步：心脏病发作/心脏手术/起搏器/心脏瓣膜疾病/心力衰竭/心脏移植/先天性心脏病/糖尿病/肾脏疾病\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「三步走：先问症状（停），再问运动（定性），最后问病（定位）」\u003c/p\u003e\n\u003cp\u003e● 类比： 好比医院分诊台：先问哪里疼（症状），再问运动史（活动），最后做检查（疾病）。\u003c/p\u003e\n\u003cp\u003e● 补充：问卷中第1步的6项症状对应ACSM列出的劳累性体征/症状，与图4-1注释4一致。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户在第1步全部勾&quot;否&quot;，第2步勾&quot;否&quot;（不定期运动），第3步勾了&quot;糖尿病&quot;。\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：松一口气，觉得至少症状没问题了，直接开始训练。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：确认他需要医学许可。用ABC沟通法，温和地解释为什么，同时鼓励他保持目前的活动水平。\u003c/p\u003e\n\u003cp\u003e• 常见误区：跳过问卷直接开始训练。问卷是标准流程，跟客户健不健康没关系。\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003e参前问卷三步对应筛查算法三个关键信息：症状触发许可（第一步）、运动史调节门槛（第二步）、疾病状态决定强度限制（第三步）。三步环环相扣，缺一不可。\u003c/p\u003e\n\u003ch4 id=\"ch4-s163\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：问卷是标准化信息收集工具，三步对应算法三个输入。第一步阳性就停止，后两步决定许可级别。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e问卷第1步全部没有勾选，第2步客户回答&quot;否&quot;（不定期运动），第3步勾选了糖尿病。 此时 怎么做？\u003c/p\u003e\n\u003cp\u003e✅ 根据筛查算法：不定期运动 + 有代谢性疾病（糖尿病）+ 无症状 = 需要医学许可。建议轻度至中等强度运动，根据许可逐步提高。\u003c/p\u003e\n\u003cp\u003e记忆小本：症状→活动→疾病，三步走，一步阳就停。\u003c/p\u003e\n\u003ch4 id=\"ch4-s169\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ 参前问卷三步走：症状→活动→疾病，第一步阳性直接停\u003c/p\u003e\n\u003cp\u003e● ✅ 三步对应筛查算法的三个关键信息：症状触发许可、运动史调节门槛、疾病状态决定强度限制\u003c/p\u003e\n\u003cp\u003e● ✅ 问卷是标准流程，不是&quot;审查&quot;  ， 所有客户都要填\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：如果客户第1步全否、第2步定期、第3步无疾病，你认为可以直接安排高强度训练吗？还需要注意什么？\u003c/p\u003e\n\u003cp\u003e选择题：参前问卷第3步（身体状况）包含以下哪项？\u003c/p\u003e\n\u003cp\u003e• A. 饮食失调\u003c/p\u003e\n\u003cp\u003e• B. 膝关节疼痛\u003c/p\u003e\n\u003cp\u003e• C. 糖尿病 ✅\u003c/p\u003e\n\u003cp\u003e• D. 抑郁症\u003c/p\u003e\n\u003ch4 id=\"ch4-s181\"\u003e筛查结果的沟通\u003c/h4\u003e\n\u003ch4 id=\"ch4-s182\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e当筛查结果指向需要医学许可时，用ACE ABC Approach（而非面试式）与客户沟通：\u003c/p\u003e\n\u003cp\u003e● A — 提问（Ask）：开放性问题了解客户目标与需求\u003c/p\u003e\n\u003cp\u003e● B — 打破障碍（Break Barriers）：发现阻碍客户参与计划的潜在问题\u003c/p\u003e\n\u003cp\u003e● C — 协作（Collaborate）：共同努力实现目标\u003c/p\u003e\n\u003cp\u003e关键原则：\u003c/p\u003e\n\u003cp\u003e● 医学许可不是拒绝帮助，是为了提供正确的帮助\u003c/p\u003e\n\u003cp\u003e● 不能让医学许可要求成为运动的障碍\u003c/p\u003e\n\u003cp\u003e● 客户获医生签字同意后再开始正式训练\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：ABC = Ask需求 → Break障碍 → Collaborate协作\u003c/p\u003e\n\u003cp\u003e● 类比： 沟通的定位是&quot;邀请&quot;而非&quot;通知&quot;，和客户一起解决问题。好比教练和客户组队完成健康挑战，医学许可是路上的补给站，不是终点线。\u003c/p\u003e\n\u003cp\u003e● 补充：ACE教材原文用ABC Approach描述这一对话式沟通流程，强调&quot;类似对话而非面试&quot;。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户听到&quot;需要医学许可&quot;后脸色变了，说&quot;医生肯定说不要运动&quot;。\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：直接说&quot;那你去看医生吧&quot;，结束对话。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：\u003c/p\u003e\n\u003cp\u003e1.  解释这是为了让他更安全地运动\u003c/p\u003e\n\u003cp\u003e2. 提供医学许可表格模板，上面写清楚你计划的运动类型，让医生有据可依\u003c/p\u003e\n\u003cp\u003e3. 告诉他，即使在等待许可期间，也可以从低强度的活动开始（走路、拉伸等）\u003c/p\u003e\n\u003cp\u003e• 常见误区：把医学许可当成&quot;甩锅&quot;工具。医学许可是保护客户安全的手段，不是你推卸责任的借口。\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003e医学许可是起点，不是终点。 核心心态：把客户当队友，把医生当顾问。等待许可期间可以保持低强度活动，避免&quot;全有或全无&quot;的思维。\u003c/p\u003e\n\u003ch4 id=\"ch4-s205\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：ABC沟通法是&quot;邀请&quot;而非&quot;通知&quot;。 医学许可的目的是提供正确的帮助。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e客户说&quot;我这么健康，为什么要我看医生？&quot;你怎么回应？\u003c/p\u003e\n\u003cp\u003e参考：不是怀疑您的健康，而是为了确保我们的计划对您是安全有效的。您的医生最了解您的糖尿病控制情况，有了他的建议，我能为您设计更好的方案。\u003c/p\u003e\n\u003cp\u003e记忆小本：ABC = 问需求→解障碍→一起干，医学许可不是拒绝。\u003c/p\u003e\n\u003ch4 id=\"ch4-s211\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ ABC沟通法 = 提问（了解目标）→ 打破障碍（发现问题）→ 协作（共同解决）\u003c/p\u003e\n\u003cp\u003e● ✅ 医学许可是&quot;为了提供正确的帮助&quot;，不是&quot;拒绝帮助&quot;\u003c/p\u003e\n\u003cp\u003e● ✅ 许可等待期间可以鼓励客户做低强度活动，保持 momentum\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：有位客户需要医学许可但拖延不去看医生，理由是&quot;太忙了&quot;。你会如何用ABC法和他沟通？\u003c/p\u003e\n\u003cp\u003e选择题：以下哪种回应最符合ABC沟通法的精神？\u003c/p\u003e\n\u003cp\u003e• A. &quot;不看不行，这是规定。&quot;\u003c/p\u003e\n\u003cp\u003e• B. &quot;我理解您忙，不过我们可以在等待期间先从低强度开始，同时预约医生。&quot; ✅\u003c/p\u003e\n\u003cp\u003e• C. &quot;那就算了，等您有时间再说。&quot;\u003c/p\u003e\n\u003cp\u003e• D. &quot;您不去看医生的话，出了问题我不负责。&quot;\u003c/p\u003e\n\u003ch4 id=\"ch4-s223\"\u003e2.1 抗阻训练\u003c/h4\u003e\n\u003ch4 id=\"ch4-s224\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e● 目前尚没有充分证据证实低到中等强度抗阻训练需要进行正式的预先筛查（ACSM, 2018）\u003c/p\u003e\n\u003cp\u003e● 关于这个话题的现有资料有限，但并发症风险似乎较低\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「抗阻训练 = 证据不足，风险较低」\u003c/p\u003e\n\u003cp\u003e理解要点：“暂无足够证据支持额外筛查”不等于“无需筛查”。所有客户仍应完成通用的运动前健康筛查。\u003c/p\u003e\n\u003cp\u003e● 补充：ACSM 2018原文措辞为&quot;currently there is insufficient evidence&quot;，注意&quot;证据不足&quot;≠&quot;不需要&quot;。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户说&quot;我只做力量训练，不做有氧，应该不用填那些表格吧？&quot;\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：同意跳过筛查，认为力量训练不需要了解健康状况。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：解释&quot;力量训练本身风险不高，但为了全面了解您的身体状况，标准筛查还是要做的。通用筛查是所有客户都要做的，这是另一回事。&quot;\u003c/p\u003e\n\u003cp\u003e• 常见误区：认为抗阻训练筛查宽松就完全不做筛查。记住：通用筛查（模块2）是所有客户都要做的。\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003e&quot;不额外要求筛查&quot;和&quot;不需要筛查&quot;是两回事。抗阻训练筛查宽松是因其固有风险低，通用健康筛查仍适用于所有客户。\u003c/p\u003e\n\u003ch4 id=\"ch4-s238\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：低到中等强度抗阻训练的并发症风险较低，目前证据不足以支持额外筛查要求。但通用运动前健康筛查（ACSM算法）仍适用于所有客户。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e客户只想做抗阻训练，不需要做运动前健康筛查吗？\u003c/p\u003e\n\u003cp\u003e❌ 仍需要。抗阻训练不额外要求筛查，但通用的运动前健康筛查（ACSM算法）仍适用。\u003c/p\u003e\n\u003cp\u003e记忆小本：抗阻筛查宽松 ≠ 不做通用筛查，两者不是一回事。\u003c/p\u003e\n\u003ch4 id=\"ch4-s244\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ 低到中等强度抗阻训练的并发症风险较低，目前证据不足以支持额外筛查要求\u003c/p\u003e\n\u003cp\u003e● ✅ 但这不等于&quot;不需要筛查&quot;  ， 通用运动前健康筛查（ACSM算法）仍适用于所有客户\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：有位客户完全不想填筛查问卷，说&quot;我只做哑铃推举，又不是跑马拉松&quot;。你如何说服他？\u003c/p\u003e\n\u003cp\u003e选择题：关于抗阻训练筛查，以下说法正确的是？\u003c/p\u003e\n\u003cp\u003e• A. 抗阻训练客户完全不需要任何筛查\u003c/p\u003e\n\u003cp\u003e• B. 抗阻训练不额外要求筛查，但通用筛查仍要做 ✅\u003c/p\u003e\n\u003cp\u003e• C. 力量训练客户可以跳过PAR-Q+\u003c/p\u003e\n\u003cp\u003e• D. 抗阻训练风险很高，必须医学许可\u003c/p\u003e\n\u003ch4 id=\"ch4-s255\"\u003e2.2 自我筛查\u003c/h4\u003e\n\u003cp\u003e图4-2\u003c/p\u003e\n\u003cp\u003e图4-3\u003c/p\u003e\n\u003cp\u003e图4-4\u003c/p\u003e\n\u003cp\u003e图4-5\u003c/p\u003e\n\u003cp\u003e图4-6\u003c/p\u003e\n\u003ch4 id=\"ch4-s261\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e● PAR-Q+ = 身体活动准备程度问卷(Physical Activity Readiness Questionnaire-Plus)\u003c/p\u003e\n\u003cp\u003e● 既是客户的自我筛查工具，又是私教获取更多信息的额外筛查要素\u003c/p\u003e\n\u003cp\u003e● 编制目的：减少不必要的运动障碍（循证方式）\u003c/p\u003e\n\u003cp\u003e● 分4页：第1页7个一般健康问题 → 第2-3页后续深入问题（按疾病类别分支）→ 第4页结果判定\u003c/p\u003e\n\u003cp\u003ePAR-Q+三色判定：\u003c/p\u003e\n\u003cp\u003e表4-8\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e结果\u003c/th\u003e\u003cth\u003e含义\u003c/th\u003e\u003cth\u003e行动\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e绿色（全否）\u003c/td\u003e\u003ctd\u003e可以进行更多身体活动\u003c/td\u003e\u003ctd\u003e建议慢慢开始，逐步加强，目标每周150分钟中等强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e红色（有是）\u003c/td\u003e\u003ctd\u003e需进一步评估\u003c/td\u003e\u003ctd\u003e完成ePARmed-X+和/或咨询运动专业人员\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e黄色（延迟）\u003c/td\u003e\u003ctd\u003e暂时不宜增加活动\u003c/td\u003e\u003ctd\u003e感冒/发烧→等好转；怀孕→告知医生； 暂时性健康问题→先咨询医生\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「绿 = 放行 / 红 = 深入 / 黄 = 等等」\u003c/p\u003e\n\u003cp\u003e● 类比：类比交通信号灯：绿灯直接走，红灯需要等信号，黄灯观察路况再决定。\u003c/p\u003e\n\u003cp\u003e● 补充：PAR-Q+由加拿大开发，定期更新（当前版本2020），可在www.eparmedx.com获取。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户PAR-Q+结果全绿，兴奋地问&quot;我可以开始做HIIT了吗？&quot;\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：立刻安排高强度训练。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法： 先肯定他的运动基础，问卷全绿说明他可以安全地开始运动。但也要提醒：&quot;您现在可以开始了，但建议从低强度逐步增加，给身体适应时间。每周150分钟中等强度是目标，不是一周就要达到。&quot;\u003c/p\u003e\n\u003cp\u003e• PAR-Q+使用提醒：\u003c/p\u003e\n\u003cp\u003e◦ 客户健康状况变化时要重新填写\u003c/p\u003e\n\u003cp\u003e◦ 全绿不等于&quot;零风险&quot;  ， 这只是说明目前不需要进一步评估\u003c/p\u003e\n\u003cp\u003e◦ PAR-Q+不能替代医学检查\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003ePAR-Q+的设计哲学是&quot;默认安全，例外排除&quot;，假设大多数人是安全的，只排除明确有问题的少数人。 这与ACSM筛查算法&quot;默认谨慎，逐级审查&quot;的哲学形成互补。\u003c/p\u003e\n\u003ch4 id=\"ch4-s282\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：PAR-Q+ = 减少不必要的运动障碍，三色判定对应不同行动级别。绿=默认安全，红=需要专业介入，黄=暂时等待。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003ePAR-Q+的设计目的是什么？\u003c/p\u003e\n\u003cp\u003eA. 尽可能多地筛查出潜在问题\u003c/p\u003e\n\u003cp\u003eB. 减少不必要的运动障碍 ✅\u003c/p\u003e\n\u003cp\u003eC. 替代医学检查\u003c/p\u003e\n\u003cp\u003e记忆小本：PAR-Q+ = 绿灯放行，红灯深入，黄灯等待。\u003c/p\u003e\n\u003ch4 id=\"ch4-s290\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ PAR-Q+设计理念是&quot;减少不必要的运动障碍&quot;，大多数人是安全的\u003c/p\u003e\n\u003cp\u003e● ✅ 三色判定：绿=直接开始 / 红=进一步评估 / 黄=暂时等等\u003c/p\u003e\n\u003cp\u003e● ✅ PAR-Q+不能替代医学检查，需要定期更新\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：PAR-Q+全绿的客户，在运动中出现不适，应该怎么处理？这说明PAR-Q+有什么局限性？\u003c/p\u003e\n\u003cp\u003e选择题：以下哪种情况应该判定为PAR-Q+的&quot;黄色&quot;（延迟）？\u003c/p\u003e\n\u003cp\u003e• A. 客户有高血压病史\u003c/p\u003e\n\u003cp\u003e• B. 客户最近感冒发烧 ✅（  暂时性健康问题触发黄色判定）\u003c/p\u003e\n\u003cp\u003e• C. 客户曾做过心脏手术\u003c/p\u003e\n\u003cp\u003e• D. 客户正在服用降压药\u003c/p\u003e\n\u003ch4 id=\"ch4-s302\"\u003e2.3 心脏康复与健康机构中的患者\u003c/h4\u003e\n\u003ch4 id=\"ch4-s303\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e● 在心脏康复等临床环境中，应使用比通用筛查更深入的工具\u003c/p\u003e\n\u003cp\u003e● 建议使用AACVPR（美国心血管和肺康复协会）的风险分层标准\u003c/p\u003e\n\u003cp\u003e● 必须让客户的私人医生注意任何提示冠状动脉疾病的体征或症状\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「临床环境 = 更深筛查」\u003c/p\u003e\n\u003cp\u003e理解类比：通用健身环境与心脏康复环境就像不同级别的医疗场景，服务对象、专业团队和风险管理深度不同，因而需要匹配相应的筛查与风险分层工具。\u003c/p\u003e\n\u003cp\u003e●补充：AACVPR分层基于运动能力（MET水平）、左室射血分数（LVEF）、心律失常类型等多维度评估。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：你在一个心脏康复中心工作，有客户刚做完心脏支架手术想来训练。\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：使用普通健身房的筛查流程。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：使用AACVPR风险分层标准，并且客户的私人医生必须参与。未经医生明确许可，不能开始任何正式训练。\u003c/p\u003e\n\u003cp\u003e表4-9\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e场景\u003c/th\u003e\u003cth\u003e筛查工具\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e普通健身房\u003c/td\u003e\u003ctd\u003eACSM算法 + PAR-Q+\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e心脏康复中心\u003c/td\u003e\u003ctd\u003eAACVPR风险分层（更深 ，基于运动能力、心功能、心律失常等多维度）\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e● 常见误区：混淆普通健身房和临床环境的筛查标准。临床环境需要更深的评估。\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003e筛查深度与风险环境匹配。普通场所用通用工具，高风险场所用专业工具。 筛查深度匹配风险环境即可。\u003c/p\u003e\n\u003ch4 id=\"ch4-s319\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：临床环境（心脏康复等）需要比通用筛查更深入的工具。AACVPR比ACSM算法更专业、更严格。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e在心脏康复机构工作的私教，应该使用哪种筛查工具？\u003c/p\u003e\n\u003cp\u003e✅ AACVPR风险分层标准（比通用筛查更深入）。\u003c/p\u003e\n\u003cp\u003e记忆小本：临床环境筛查更深，普通健身房用ACSM，心脏康复用AACVPR。\u003c/p\u003e\n\u003ch4 id=\"ch4-s325\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ 临床环境（心脏康复等）需要比通用筛查更深入的工具\u003c/p\u003e\n\u003cp\u003e● ✅ 普通健身房用ACSM算法+PAR-Q+，心脏康复机构用AACVPR风险分层\u003c/p\u003e\n\u003cp\u003e● ✅ 临床环境中的任何异常体征/症状都必须通报客户医生\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：普通健身房私教接到一位刚出院的心脏病患者，应该怎么处理？\u003c/p\u003e\n\u003cp\u003e选择题：关于心脏康复机构的筛查，以下说法正确的是？\u003c/p\u003e\n\u003cp\u003e• A. 只需要普通的PAR-Q+就够了\u003c/p\u003e\n\u003cp\u003e• B. 需要使用AACVPR风险分层标准，比通用筛查更深入 ✅\u003c/p\u003e\n\u003cp\u003e• C. 心脏康复机构不需要筛查\u003c/p\u003e\n\u003cp\u003e• D. 心脏康复客户不需要医生参与\u003c/p\u003e\n\u003ch3 id=\"ch4-s337\"\u003e3 附加表格\u003c/h3\u003e\n\u003ch4 id=\"ch4-s338\"\u003e核心知识\u003c/h4\u003e\n\u003cp\u003e筛查完成后、客户获批可运动，还需要以下表格：\u003c/p\u003e\n\u003cp\u003e1. 参与协议\u003c/p\u003e\n\u003cp\u003e2. 知情同意书/&quot;风险承担&quot;表格\u003c/p\u003e\n\u003cp\u003e3. 生活方式和健康史问卷\u003c/p\u003e\n\u003cp\u003e● 收集：过往/当前运动信息、药物和补充剂、近期疾病或损伤、手术和损伤史、家族病史、生活方式（营养/压力/工作/睡眠）\u003c/p\u003e\n\u003cp\u003e4. 医学许可表格\u003c/p\u003e\n\u003cp\u003e● 客户医生签署，说明运动类型/频率/持续时间/强度\u003c/p\u003e\n\u003cp\u003e● 标注药物对运动能力或心率反应的影响\u003c/p\u003e\n\u003cp\u003e● 医生确定建议或限制\u003c/p\u003e\n\u003cp\u003e法律提醒： 所有表格需当地法律专业人士审核\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「四表一审核」= 参与协议 + 知情同意书 + 健康史问卷 + 就医授权书 → 律师审核后使用\u003c/p\u003e\n\u003cp\u003e● 类比： 好比入职前的全套体检：筛查是&quot;体检&quot;，这些表格是&quot;入职材料&quot;，法律审核是&quot;HR确认&quot;。\u003c/p\u003e\n\u003cp\u003e● 补充：医学许可表格须由客户医生签署，偏离授权书内容需重新获得医生批准。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户抱怨&quot;又要填表格，太麻烦了&quot;。\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：直接说&quot;这是规定，必须填&quot;。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：把表格当成&quot;给他自己看的健康档案&quot;来介绍。告诉他：&quot;这些信息帮我更了解您，比如您提到的睡眠问题、家族病史，都可能影响训练计划的设计。表格是为您服务的，不是为难您。&quot;\u003c/p\u003e\n\u003cp\u003e• 医学许可表格的关键信息：运动类型/频率/持续时间/强度；药物对运动能力的影响；医生的建议或限制。\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003e四张表格构建完整的法律保护链。筛查是&quot;技术关&quot;，文件是&quot;法律关&quot;，两关都过才能正式开展训练。\u003c/p\u003e\n\u003ch4 id=\"ch4-s360\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：四表一审核 = 技术筛查完成后 + 法律文件保障 = 完整的服务启动流程。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003e医学许可表格需要谁签署？包含什么关键信息？\u003c/p\u003e\n\u003cp\u003e✅ 客户的私人医生签署。包含：运动类型/频率/持续时间/强度；药物对运动能力/心率的影响；医生的建议或限制。\u003c/p\u003e\n\u003cp\u003e记忆小本：四表：参与协议+知情同意+健康史+就医授权 → 律师审核\u003c/p\u003e\n\u003ch4 id=\"ch4-s366\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ 筛查通过后还需要四个表格：参与协议、知情同意书、生活方式和健康史问卷、医学许可表格\u003c/p\u003e\n\u003cp\u003e● ✅ 医学许可表格是客户医生签署的文件，说明运动方案和药物影响\u003c/p\u003e\n\u003cp\u003e● ✅ 所有表格需当地法律专业人士审核后才能使用\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：如果客户拒绝签署知情同意书，你会怎么处理？\u003c/p\u003e\n\u003cp\u003e选择题：医学许可表格中不需要包含以下哪项？\u003c/p\u003e\n\u003cp\u003e• A. 运动类型和强度\u003c/p\u003e\n\u003cp\u003e• B. 客户医保卡号码 ✅\u003c/p\u003e\n\u003cp\u003e• C. 药物对运动能力的影响\u003c/p\u003e\n\u003cp\u003e• D. 医生的建议或限制\u003c/p\u003e\n\u003ch3 id=\"ch4-s378\"\u003e4 药物\u003c/h3\u003e\n\u003ch4 id=\"ch4-s379\"\u003e核心知识\u003c/h4\u003e\n\u003ch4 id=\"ch4-s380\"\u003e4.1 降压药\u003c/h4\u003e\n\u003cp\u003e● 心脏 → 降低收缩力\u003c/p\u003e\n\u003cp\u003e● 周围血管 → 扩张增加血流\u003c/p\u003e\n\u003cp\u003e● 大脑 → 减少交感神经兴奋\u003c/p\u003e\n\u003cp\u003e● 肾脏 → 排出更多液体减少血容量\u003c/p\u003e\n\u003cp\u003e关键药物速查表（表4-1精简版）：\u003c/p\u003e\n\u003cp\u003e表4-10\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e药物\u003c/th\u003e\u003cth\u003e静息心率\u003c/th\u003e\u003cth\u003e运动心率\u003c/th\u003e\u003cth\u003e运动能力\u003c/th\u003e\u003cth\u003e关键考点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eβ-阻滞剂\u003c/td\u003e\u003ctd\u003e↓\u003c/td\u003e\u003ctd\u003e↓\u003c/td\u003e\u003ctd\u003e↓（急性/慢性）；VO₂max：急性↓/慢性训练后可改善\u003c/td\u003e\u003ctd\u003e剂量相关；需改用RPE/说话测试定强度\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eARB + CCB\u003c/td\u003e\u003ctd\u003e↓或⇄\u003c/td\u003e\u003ctd\u003e↓或⇄\u003c/td\u003e\u003ctd\u003e⇄\u003c/td\u003e\u003ctd\u003e个体差异大\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e其他降压药\u003c/td\u003e\u003ctd\u003e不定\u003c/td\u003e\u003ctd\u003e不定\u003c/td\u003e\u003ctd\u003e通常⇄\u003c/td\u003e\u003ctd\u003e多种联用，反应可变\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e抗组胺药\u003c/td\u003e\u003ctd\u003e⇄（部分第一代抗组胺药可致心率↑）\u003c/td\u003e\u003ctd\u003e⇄\u003c/td\u003e\u003ctd\u003e⇄\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e抗抑郁/抗焦虑药\u003c/td\u003e\u003ctd\u003e↑或⇄\u003c/td\u003e\u003ctd\u003e↑或⇄\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e兴奋剂\u003c/td\u003e\u003ctd\u003e↑\u003c/td\u003e\u003ctd\u003e↑\u003c/td\u003e\u003ctd\u003e↑或⇄\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e咖啡因\u003c/td\u003e\u003ctd\u003e↑\u003c/td\u003e\u003ctd\u003e↑或⇄\u003c/td\u003e\u003ctd\u003e↑耐久性\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e支气管扩张剂\u003c/td\u003e\u003ctd\u003e⇄\u003c/td\u003e\u003ctd\u003e⇄\u003c/td\u003e\u003ctd\u003e⇄（COPD患者↑或⇄）\u003c/td\u003e\u003ctd\u003e对受支气管痉挛限制者↑运动能力\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e酒精\u003c/td\u003e\u003ctd\u003e⇄\u003c/td\u003e\u003ctd\u003e⇄\u003c/td\u003e\u003ctd\u003e↓\u003c/td\u003e\u003ctd\u003e受酒精影响时禁止运动\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e尼古丁替代疗法\u003c/td\u003e\u003ctd\u003e↑\u003c/td\u003e\u003ctd\u003e↑\u003c/td\u003e\u003ctd\u003e⇄或↓\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNSAID\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003ctd\u003e⇄或↑\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「β阻心低换RPE / 利尿脱水多补水 补电解质 / 降压药防体位低」\u003c/p\u003e\n\u003cp\u003e记忆提示：β-阻滞剂会降低心率反应；利尿剂可影响水合与电解质平衡；多种降压药可能导致体位性低血压。\u003c/p\u003e\n\u003cp\u003e●  一句话记牢：β-阻滞剂、利尿剂、降压药是三大高频考点，其他药物了解即可。\u003c/p\u003e\n\u003cp\u003eβ-阻滞剂（最高频考点）：\u003c/p\u003e\n\u003cp\u003e● 阻断β-肾上腺素能受体 → 限制交感神经刺激 → 降低静息/运动/最大心率\u003c/p\u003e\n\u003cp\u003e● 常规年龄预测心率法可能不再适用；应根据医疗建议，结合RPE或谈话测试确定运动强度\u003c/p\u003e\n\u003cp\u003e● 剂量相关反应\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e记忆提示：β-阻滞剂会降低静息、运动及最大心率，因此不宜直接套用常规年龄预测靶心率，应根据医疗建议，结合自感用力度或谈话测试判断强度。\u003c/p\u003e\n\u003cp\u003e● 类比：好比汽车被限速器锁住，发动机本身没问题，但油门信号被阻断，心率上不去。\u003c/p\u003e\n\u003cp\u003e● 补充：使用β-阻滞剂时，推荐RPE 12-13或说话测试（运动中能说话即为中等强度）。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户在吃β-阻滞剂，你问他运动时心率到多少了。\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：用220-年龄计算靶心率，期望他达到某个数字。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：了解药物名称、剂量和服用时间，遵循医疗建议，并结合RPE或谈话测试判断强度，不直接套用常规年龄预测靶心率。\u003c/p\u003e\n\u003cp\u003e• 常见误区：不知道β-阻滞剂客户的心率上限会被&quot;降低&quot;，盲目追求数字。\u003c/p\u003e\n\u003cp\u003eACE抑制剂：\u003c/p\u003e\n\u003cp\u003e● 不影响心率，但降低静息和运动血压\u003c/p\u003e\n\u003cp\u003e利尿剂：\u003c/p\u003e\n\u003cp\u003e● 不主要影响心率\u003c/p\u003e\n\u003cp\u003e● 导致水分和电解质失衡 → 低钾血症→室性心律失常风险↑，运动中尤其危险 ，可能引发危险性心律不齐\u003c/p\u003e\n\u003cp\u003e● 损害水合状态 → 降低血容量 → 可能脱水\u003c/p\u003e\n\u003cp\u003e● 运动前/中/后需充足液体摄入，温暖潮湿环境更需注意\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e记忆提示：利尿剂会增加水分和电解质排出，应留意水合状态，并遵循医生针对液体和电解质摄入的建议。\u003c/p\u003e\n\u003cp\u003e● 类比：好比夏天空调排水管，一直在排水，不及时加水就会干涸。\u003c/p\u003e\n\u003cp\u003e● 补充：利尿剂导致低钾血症是考试高频点，低钾可导致室性心律失常，运动中尤其危险。\u003c/p\u003e\n\u003cp\u003e教练小Tips：\u003c/p\u003e\n\u003cp\u003e• 场景：客户服用利尿剂，在炎热夏天户外训练。\u003c/p\u003e\n\u003cp\u003e• ❌ 错误做法：只关注训练强度，不关注补水。\u003c/p\u003e\n\u003cp\u003e• ✓ 正确做法：训练前、中、后关注客户的水合状态，在温暖潮湿的环境中更需谨慎；液体或电解质摄入量应遵循客户医生的建议，不由教练给出统一处方。\u003c/p\u003e\n\u003ch4 id=\"ch4-s419\"\u003e4.2 支气管扩张剂\u003c/h4\u003e\n\u003cp\u003e● 对受支气管痉挛限制者增加运动能力\u003c/p\u003e\n\u003cp\u003e● 对静息和运动心率/血压影响很小\u003c/p\u003e\n\u003ch4 id=\"ch4-s422\"\u003e4.3 感冒药\u003c/h4\u003e\n\u003cp\u003e● 减充血剂 = 拟交感神经 → 血管收缩 → ↑血压 ↑心率\u003c/p\u003e\n\u003cp\u003e● 抗组胺药 → 对心率/血压无直接作用，但可能引起困倦\u003c/p\u003e\n\u003cp\u003e● 大多数感冒药是两者组合，剂量低，对运动能力影响极小\u003c/p\u003e\n\u003cp\u003e降压药的额外注意事项：\u003c/p\u003e\n\u003cp\u003e● 许多降压药可能导致体位性低血压(Orthostatic Hypotension) 表现为从坐/卧位快速站起时头晕\u003c/p\u003e\n\u003cp\u003e● 客户在地板上做腹部练习后不要站起太快\u003c/p\u003e\n\u003cp\u003e记忆技巧：\u003c/p\u003e\n\u003cp\u003e● 口诀：「降压药做完地板动作，站起来要慢三秒」\u003c/p\u003e\n\u003cp\u003e● 类比：好比蹲久了突然站起来会头晕，降压药会让这种情况更容易发生。\u003c/p\u003e\n\u003cp\u003e● 补充：ACE教材表4-1注释中明确指出&quot;许多降压药可能会导致体位性低血压&quot;，这是考试常见干扰项。\u003c/p\u003e\n\u003cp\u003e⚠️执业边界提醒：教练的职责是筛查和转介，不是诊断。不能建议客户增减药物、不能解读医学检查结果、不能在客户出现急性症状时继续训练。\u003c/p\u003e\n\u003cp\u003e关键思考：\u003c/p\u003e\n\u003cp\u003e药物模块的核心是理解药物如何改变心率对运动的响应。两条逻辑线：\u003c/p\u003e\n\u003cp\u003e1. β-阻滞剂线：心率被压低 → 传统心率区间法失效 → 必须换工具（RPE/说话测试）\u003c/p\u003e\n\u003cp\u003e2. 利尿剂线：水分/电解质失衡 → 脱水风险 → 补水是关键\u003c/p\u003e\n\u003ch4 id=\"ch4-s438\"\u003e知识点总结\u003c/h4\u003e\n\u003cp\u003e核心逻辑：β-阻滞剂线（心率反应受到影响→RPE）和利尿剂线（脱水风险→补水）是两大核心逻辑。\u003c/p\u003e\n\u003cp\u003e互动考题：\u003c/p\u003e\n\u003cp\u003eQ1：服用β-阻滞剂的客户，用什么确定运动强度？\u003c/p\u003e\n\u003cp\u003e✅ RPE（自感用力度）或说话测试。心率指标因药物影响而不可靠。\u003c/p\u003e\n\u003cp\u003eQ2：服用利尿剂的客户，需要特别注意什么？\u003c/p\u003e\n\u003cp\u003e✅ 水合状态。利尿剂增加水分和电解质排出，可能导致脱水、电解质失衡、心律不齐。运动前/中/后需充足液体摄入。\u003c/p\u003e\n\u003cp\u003eQ3：服用降压药的客户从地板上做完腹部练习后，教练应该提醒什么？\u003c/p\u003e\n\u003cp\u003e✅ 慢慢站起来。许多降压药可导致体位性低血压，快速站起可能头晕。\u003c/p\u003e\n\u003cp\u003e记忆小本：β阻心低换RPE / 利尿脱水多补水 / 降压药防体位低\u003c/p\u003e\n\u003ch4 id=\"ch4-s448\"\u003e练习与应用\u003c/h4\u003e\n\u003cp\u003e核心要义凝练：\u003c/p\u003e\n\u003cp\u003e● ✅ β-阻滞剂降低心率 → 常规年龄预测心率法可能不再适用 → 必须改用RPE或说话测试确定强度\u003c/p\u003e\n\u003cp\u003e● ✅ 利尿剂导致水分/电解质流失 → 脱水风险 → 训练前/中/后补水是重点\u003c/p\u003e\n\u003cp\u003e● ✅ 降压药可能引起体位性低血压 → 地板动作后慢站\u003c/p\u003e\n\u003cp\u003e● ✅ 支气管扩张剂对COPD/哮喘患者可能提升运动能力\u003c/p\u003e\n\u003cp\u003e思考与练习：\u003c/p\u003e\n\u003cp\u003e开放思考题：有位客户说&quot;我吃降压药5年了，血压控制得很好，我感觉自己可以像正常人一样训练&quot;。你怎么看？\u003c/p\u003e\n\u003cp\u003e选择题：关于β-阻滞剂客户的运动强度确定，以下说法正确的是？\u003c/p\u003e\n\u003cp\u003e• A. 用220-年龄计算靶心率\u003c/p\u003e\n\u003cp\u003e• B. 用心率储备（HRR）法计算\u003c/p\u003e\n\u003cp\u003e• C. 改用RPE或说话测试 ✅\u003c/p\u003e\n\u003cp\u003e• D. 直接用客户感觉来定\u003c/p\u003e\n\u003ch3 id=\"ch4-s461\"\u003e学员复习专用\u003c/h3\u003e\n\u003ch3 id=\"ch4-s462\"\u003e5 小结\u003c/h3\u003e\n\u003cp\u003e本模块帮助你高效复盘本章内容，检验学习效果，为考试做准备。\u003c/p\u003e\n\u003cp\u003e建议完成正文学习后，用复习段做自我检测。\u003c/p\u003e\n\u003ch3 id=\"ch4-s465\"\u003e一、核心回顾\u003c/h3\u003e\n\u003cp\u003e运动前健康筛查的核心目的：识别谁需要先看医生，确保在安全的前提下帮助更多人开始并维持运动。\u003c/p\u003e\n\u003ch3 id=\"ch4-s467\"\u003e二、知识脉络\u003c/h3\u003e\n\u003cp\u003e详细脉络：\u003c/p\u003e\n\u003ch3 id=\"ch4-s469\"\u003e三、考前必背表\u003c/h3\u003e\n\u003cp\u003e表4-11\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e类别\u003c/th\u003e\u003cth\u003e必背内容\u003c/th\u003e\u003cth\u003e记忆口诀\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e定期运动定义\u003c/td\u003e\u003ctd\u003e过去3个月 + 每周≥3天 + 每次≥30分钟 + 中等强度\u003c/td\u003e\u003ctd\u003e3-3-30\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e风险三角\u003c/td\u003e\u003ctd\u003e不习惯 + 已患病 + 接近极限\u003c/td\u003e\u003ctd\u003e三者齐备才高危\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e症状优先级\u003c/td\u003e\u003ctd\u003e症状 &gt; 疾病 &gt; 运动史\u003c/td\u003e\u003ctd\u003e症状永远是老大\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e医学许可触发\u003c/td\u003e\u003ctd\u003e不定期+有疾病；不定期+有症状；定期+有症状+高强度\u003c/td\u003e\u003ctd\u003e三种情况要许可 （定期+有疾病无症状+中等强度：可考虑免除）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePAR-Q+三色\u003c/td\u003e\u003ctd\u003e绿=放行 / 红=深入 / 黄=等等\u003c/td\u003e\u003ctd\u003e交通信号灯\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eβ-阻滞剂应对\u003c/td\u003e\u003ctd\u003e心率反应受到影响，改用RPE或说话测试\u003c/td\u003e\u003ctd\u003eβ阻心低换RPE\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e利尿剂应对\u003c/td\u003e\u003ctd\u003e补水，补水，补水\u003c/td\u003e\u003ctd\u003e利尿脱水多补水\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e降压药注意\u003c/td\u003e\u003ctd\u003e体位性低血压，地板动作后慢站\u003c/td\u003e\u003ctd\u003e降压药防体位低\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e心脏康复筛查\u003c/td\u003e\u003ctd\u003eAACVPR风险分层\u003c/td\u003e\u003ctd\u003e临床环境更深\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e四表一审核\u003c/td\u003e\u003ctd\u003e参与协议+知情同意+健康史+就医授权→律师\u003c/td\u003e\u003ctd\u003e法律文件要审核\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch4-s471\"\u003e四、自检清单\u003c/h4\u003e\n\u003cp\u003e完成本章学习后，你可以对照以下清单自我检测：\u003c/p\u003e\n\u003cp\u003e□ 我能解释为什么要进行运动前健康筛查\u003c/p\u003e\n\u003cp\u003e□ 我能说出&quot;定期运动&quot;的精确定义（3个条件）\u003c/p\u003e\n\u003cp\u003e□ 我能画出ACSM筛查算法的三轴决策树\u003c/p\u003e\n\u003cp\u003e□ 我能判断任何给定情况下是否需要医学许可\u003c/p\u003e\n\u003cp\u003e□ 我能解释为什么&quot;症状&quot;是触发许可的最强信号\u003c/p\u003e\n\u003cp\u003e□ 我能用ABC沟通法解释医学许可的必要性\u003c/p\u003e\n\u003cp\u003e□ 我能说明PAR-Q+的三色判定及对应行动\u003c/p\u003e\n\u003cp\u003e□ 我能解释PAR-Q+的设计理念\u003c/p\u003e\n\u003cp\u003e□ 我能说明β-阻滞剂客户为什么不能用靶心率\u003c/p\u003e\n\u003cp\u003e□ 我能说明利尿剂客户需要特别注意什么\u003c/p\u003e\n\u003cp\u003e□ 我能说出降压药的体位性低血压风险及应对\u003c/p\u003e\n\u003cp\u003e□ 我能列举筛查后需要的四张表格\u003c/p\u003e\n\u003ch4 id=\"ch4-s485\"\u003e六、章末三件事\u003c/h4\u003e\n\u003cp\u003e完成本章学习后，请确保完成以下三件事：\u003c/p\u003e\n\u003cp\u003e1️⃣ 理解一件事\u003c/p\u003e\n\u003cp\u003e筛查的核心目的是 识别谁需要先看医生，确保在安全的前提下帮助更多人开始并维持运动。\u003c/p\u003e\n\u003cp\u003e2️⃣ 记住一个公式\u003c/p\u003e\n\u003cp\u003eACSM筛查算法 = 运动史（定期/不定期）× 疾病状态（有/无）× 体征/症状（有/无）\u003c/p\u003e\n\u003cp\u003e核心原则：症状 &gt; 疾病 &gt; 运动史\u003c/p\u003e\n\u003cp\u003e3️⃣ 带走一个口诀\u003c/p\u003e\n\u003cp\u003eβ阻心低换RPE / 利尿脱水多补水 / 降压药防体位低\u003c/p\u003e\n\u003ch3 id=\"ch4-s494\"\u003e综合测验\u003c/h3\u003e\n\u003cp\u003eQ1：筛查算法中，哪个因素是触发医学许可最强的信号？\u003c/p\u003e\n\u003cp\u003e✅ 体征/症状。不论疾病状态和运动水平，有症状就需要医学许可。\u003c/p\u003e\n\u003cp\u003eQ2：「定期运动」的精确定义是？\u003c/p\u003e\n\u003cp\u003e✅ 过去3个月内，每周至少3天，至少30分钟有计划、有组织的中等强度身体活动。\u003c/p\u003e\n\u003cp\u003eQ3：PAR-Q+的核心设计目的是什么？\u003c/p\u003e\n\u003cp\u003e✅ 减少不必要的运动障碍（用循证方式让大多数人安全地开始运动）。\u003c/p\u003e\n\u003cp\u003eQ4：服用β-阻滞剂的客户，为什么不宜直接套用常规年龄预测心率确定运动强度？应该改用什么？\u003c/p\u003e\n\u003cp\u003e✅ β-阻滞剂降低静息/运动/最大心率，使心率指标不可靠。改用RPE（自感用力度）或说话测试。\u003c/p\u003e\n\u003cp\u0
