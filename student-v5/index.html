u003ctd\u003e200-499\u003c/td\u003e\u003ctd\u003e≥500\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s99\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-7\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：≥5天（最大化热量消耗）；肌力：2-3天\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：40-75% HRR，低于/等于/高于VT1但&lt;VT2；肌力：50-85% 1-RM（力量）或&lt;50%（耐力）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e心肺：30-60分钟（减重建议50-60分钟）；肌力：2-4组×8-12次（力量）或12-20次（耐力）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：有节奏大肌群；肌力：器械/自由重量/体重\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s101\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● LDL：单纯运动对LDL改善不一致，需结合减重\u003c/p\u003e\n\u003cp\u003e● HDL：心肺适能提高→HDL普遍增高；减脂可使HDL增高更多\u003c/p\u003e\n\u003cp\u003e● TG：心肺训练最有效（TG可作燃料）；肌力训练无效\u003c/p\u003e\n\u003cp\u003e● 运动量阈值：每周250-300分钟，消耗~2000千卡→多数成年人可降低体重/体脂\u003c/p\u003e\n\u003cp\u003e● 餐后脂血症（PPL）：单次中等强度运动30-60分钟→TG降低持续12-36小时→建议至少隔天运动一次\u003c/p\u003e\n\u003ch4 id=\"ch7-s107\"\u003e2.2 糖尿病\u003c/h4\u003e\n\u003cp\u003e图7-5\u003c/p\u003e\n\u003ch4 id=\"ch7-s109\"\u003e1型糖尿病\u003c/h4\u003e\n\u003ch4 id=\"ch7-s110\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 自身免疫攻击胰岛β细胞→胰岛素绝对缺乏\u003c/p\u003e\n\u003cp\u003e● 需注射/泵入胰岛素调节血糖\u003c/p\u003e\n\u003cp\u003e● 血糖控制=饮食+运动+胰岛素三者的时间/量协调\u003c/p\u003e\n\u003ch4 id=\"ch7-s114\"\u003e运动注意\u003c/h4\u003e\n\u003cp\u003e● 运动前减少胰岛素剂量\u003c/p\u003e\n\u003cp\u003e● 运动前/中摄取易吸收碳水化合物\u003c/p\u003e\n\u003cp\u003e● 运动中/后调整胰岛素泵输注量\u003c/p\u003e\n\u003cp\u003e● 胰岛素水平高→运动时/后低血糖风险\u003c/p\u003e\n\u003cp\u003e● 胰岛素水平低→高血糖+酮症风险\u003c/p\u003e\n\u003ch4 id=\"ch7-s120\"\u003e2型糖尿病（&gt;90%患者）\u003c/h4\u003e\n\u003ch4 id=\"ch7-s121\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 胰岛素抵抗（细胞对胰岛素不敏感）+ β细胞相对不足→高血糖\u003c/p\u003e\n\u003cp\u003e● 与久坐、热量过剩、肥胖（尤其内脏脂肪）高度相关\u003c/p\u003e\n\u003cp\u003e● 内脏脂肪→轻度炎症→胰岛素抵抗→糖尿病/代谢综合征\u003c/p\u003e\n\u003ch4 id=\"ch7-s125\"\u003e症状要点\u003c/h4\u003e\n\u003cp\u003e● 多饮、多尿、多食、体重下降（典型但未必要全部出现）\u003c/p\u003e\n\u003cp\u003e● 长期并发症：心脏、血管、肾脏、眼睛、足部、神经、肌肉骨骼\u003c/p\u003e\n\u003ch4 id=\"ch7-s128\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-8\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：3-7天（避免连续2天不运动！）；肌力：≥2个非连续日（最好3天）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e中等：40-59% HRR，&lt;VT1；剧烈：60-89% HRR，VT1至&lt;VT2\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e1型：150分钟中等/75分钟剧烈；2型：150分钟中等\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌力\u003c/td\u003e\u003ctd\u003e50-85% 1-RM，1-3组×8-10次（所有大肌群，8-10个动作，接近疲劳）\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s130\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● 不可连续2天不运动：运动对胰岛素敏感性的影响24-48小时后消失\u003c/p\u003e\n\u003cp\u003e● 心肺+肌力结合→肌肉保持更高胰岛素敏感性→更好血糖控制\u003c/p\u003e\n\u003cp\u003e● 减重5-7%即可逆转胰岛素抵抗（与全身性炎症减少有关）\u003c/p\u003e\n\u003cp\u003e● 碳水对血糖影响最大→饭后1小时血糖最高，2小时后开始下降\u003c/p\u003e\n\u003cp\u003e● 碳水化合物类型重要：单糖→血糖快速峰值；复合碳水→释放更慢\u003c/p\u003e\n\u003ch4 id=\"ch7-s136\"\u003e安全注意\u003c/h4\u003e\n\u003cp\u003e● 1型：运动前后监测血糖，调整胰岛素和碳水摄入\u003c/p\u003e\n\u003cp\u003e● 2型：注意低血糖症状（出汗、颤抖、头晕、意识模糊）\u003c/p\u003e\n\u003ch4 id=\"ch7-s139\"\u003e2.3 代谢综合征（MetS）\u003c/h4\u003e\n\u003cp\u003e图7-6\u003c/p\u003e\n\u003ch4 id=\"ch7-s141\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 不是单一疾病，是一组增加心脏病/糖尿病/中风风险的代谢异常簇集\u003c/p\u003e\n\u003cp\u003e● 诊断标准（出现≥3项）：\u003c/p\u003e\n\u003cp\u003e1. 腰围↑：男≥102cm，女≥88cm\u003c/p\u003e\n\u003cp\u003e2. TG≥150 mg/dL（或药物治疗）\u003c/p\u003e\n\u003cp\u003e3. HDL↓：男&lt;40 mg/dL，女&lt;50 mg/dL（或药物治疗）\u003c/p\u003e\n\u003cp\u003e4. 血压≥130/85 mmHg（或药物治疗）\u003c/p\u003e\n\u003cp\u003e5. 空腹血糖≥100 mg/dL（或药物治疗）\u003c/p\u003e\n\u003ch4 id=\"ch7-s149\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-9\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：≥5天（最大化热量消耗）；肌力：≥2天（最好3天）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：40-59% HRR，RPE 12-13，&lt;VT1；肌力：50-85% 1-RM\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e心肺：30-60分钟（减重建议50-60分钟）；肌力：1-3组×8-10次\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：有节奏大肌群；肌力：所有大肌群\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s151\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● 主要目标是减重（尤其减少内脏脂肪）\u003c/p\u003e\n\u003cp\u003e● 运动计划参照肥胖症指南设计\u003c/p\u003e\n\u003cp\u003e● 需同时评估CAD、高血压、血脂异常等共存风险因素\u003c/p\u003e\n\u003cp\u003e● 持续性运动和间歇性运动均可\u003c/p\u003e\n\u003ch3 id=\"ch7-s156\"\u003e三、肺部疾病\u003c/h3\u003e\n\u003ch4 id=\"ch7-s157\"\u003e3.1 哮喘（运动诱发性支气管收缩 EIB）\u003c/h4\u003e\n\u003cp\u003e图7-7\u003c/p\u003e\n\u003ch4 id=\"ch7-s159\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 呼吸道慢性炎症→对各种刺激因素过度反应→支气管平滑肌收缩+黏膜肿胀+黏液分泌↑→气道狭窄\u003c/p\u003e\n\u003cp\u003e● 运动诱发机制：大量干冷空气进入呼吸道→呼吸道水分丢失→支气管收缩物质释放\u003c/p\u003e\n\u003cp\u003e● 80%哮喘患者运动时/后发作（EIB）\u003c/p\u003e\n\u003ch4 id=\"ch7-s163\"\u003e症状要点\u003c/h4\u003e\n\u003cp\u003e● 喘息、呼吸困难、胸闷、咳嗽（尤其夜间/清晨）\u003c/p\u003e\n\u003cp\u003e● EIB特征：中-剧烈强度运动后呼吸道暂时变窄\u003c/p\u003e\n\u003cp\u003e● 症状在运动后5-10分钟达峰，持续20-30分钟\u003c/p\u003e\n\u003cp\u003e● 部分人运动后2-12小时出现延迟反应\u003c/p\u003e\n\u003ch4 id=\"ch7-s168\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-10\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：3-5天/周；肌力：≥2天（最好3天）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：起始&lt;VT1（40-59% HRR），1个月后进阶至60-70%；RPE 12-13\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e逐步至30-40分钟/次\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：步行、跑步、骑车、无氯泳池游泳；肌力：50-85% 1-RM\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s170\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● 10-15分钟热身（含剧烈/间歇运动）→诱导不应期→减弱EIB反应\u003c/p\u003e\n\u003cp\u003e● 约50% EIB者有2小时不应期（期间再次运动不发作或发作减弱）\u003c/p\u003e\n\u003cp\u003e● 运动调节→减少相同任务所需通气量→呼吸道干燥减少\u003c/p\u003e\n\u003cp\u003e● 哮喘最佳反应时间：上午中间至晚些时候\u003c/p\u003e\n\u003ch4 id=\"ch7-s175\"\u003e安全注意\u003c/h4\u003e\n\u003cp\u003e● 随身携带急救药物（支气管扩张剂）\u003c/p\u003e\n\u003cp\u003e● 运动前预防性使用药物（遵医嘱）\u003c/p\u003e\n\u003cp\u003e● 运动前/中/后充分饮水\u003c/p\u003e\n\u003cp\u003e● 避免触发因素：极热/极冷、花粉高峰、空气污染\u003c/p\u003e\n\u003cp\u003e● 低温环境可佩戴口罩保持吸入空气温暖湿润\u003c/p\u003e\n\u003cp\u003e● 密切观察哮喘发作早期体征→症状加重→降低强度→终止课程\u003c/p\u003e\n\u003cp\u003e● 药物无效→启动急救系统\u003c/p\u003e\n\u003ch3 id=\"ch7-s183\"\u003e四、其他慢性病\u003c/h3\u003e\n\u003ch4 id=\"ch7-s184\"\u003e4.1 癌症\u003c/h4\u003e\n\u003ch4 id=\"ch7-s185\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 正常细胞DNA受损→突变→细胞不受控增殖\u003c/p\u003e\n\u003cp\u003e● 约30%癌症死亡与5大行为/饮食风险相关：BMI高、蔬果不足、久坐、吸烟、饮酒\u003c/p\u003e\n\u003cp\u003e● 癌症幸存者三阶段：治疗期→康复后生活→晚期/临终\u003c/p\u003e\n\u003ch4 id=\"ch7-s189\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-11\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：3-5天/周；肌力：2-3天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：中等（40-59% HRR，RPE 12-13），可进阶至剧烈；肌力：从&lt;30% 1-RM起始，~5%递增\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e心肺：75分钟剧烈或150分钟中等/周；肌力：≥1组×8-12次\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：步行、骑车等大肌群长时间有节奏活动；肌力：自由重量+器械+承重功能任务\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s191\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● 运动可改善：焦虑/抑郁、疲劳、恶心、身体功能、生活质量\u003c/p\u003e\n\u003cp\u003e● 运动可维持肌肉量、肌肉力量/耐力、心肺适能、柔韧性\u003c/p\u003e\n\u003cp\u003e● 运动可降低心脏病、骨质疏松症、糖尿病风险\u003c/p\u003e\n\u003cp\u003e● 化疗/放疗患者可能出现贫血→降低运动强度\u003c/p\u003e\n\u003cp\u003e● 骨骼完整性受损→减少负重和高强度举重\u003c/p\u003e\n\u003ch4 id=\"ch7-s197\"\u003e安全注意\u003c/h4\u003e\n\u003cp\u003e● 运动计划个体化：癌症类型、治疗方案、当前健康状态\u003c/p\u003e\n\u003cp\u003e● 建议转介肿瘤专科注册营养师\u003c/p\u003e\n\u003ch4 id=\"ch7-s200\"\u003e4.2 骨质疏松症\u003c/h4\u003e\n\u003cp\u003e图7-8\u003c/p\u003e\n\u003cp\u003e图7-9\u003c/p\u003e\n\u003ch4 id=\"ch7-s203\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 骨量低+骨微结构破坏→骨骼脆弱→骨折风险↑\u003c/p\u003e\n\u003cp\u003e● 定义：BMD低于年轻成人平均值2.5个标准差以上\u003c/p\u003e\n\u003cp\u003e● 骨量减少：BMD低于平均值1.0-2.5个标准差\u003c/p\u003e\n\u003cp\u003e● 最常见骨折部位：髋关节、脊椎、前臂远端\u003c/p\u003e\n\u003cp\u003e● 90%+髋骨折由跌倒引起\u003c/p\u003e\n\u003ch4 id=\"ch7-s209\"\u003e风险因素\u003c/h4\u003e\n\u003cp\u003e● 不可控：遗传、女性、白种人/亚洲人、绝经后\u003c/p\u003e\n\u003cp\u003e● 可控：生殖激素、钙/维生素D摄入、身体活动、吸烟、酒精\u003c/p\u003e\n\u003ch4 id=\"ch7-s212\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-12\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：4-5天/周；肌力：1-2天→进阶至2-3天\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：中等（40-59% HRR）；肌力：调整至最后2次重复有挑战性，高强度者可受益\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e心肺：20分钟→进阶至30-60分钟；肌力：1组×8-12次→2周后增至2组\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：负重大肌群（步行、爬楼梯）；肌力：骨骼负荷力运动+平衡/步态/功能性站姿运动\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s214\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● 物理应力→骨骼微变形→刺激骨沉积→骨量/强度↑\u003c/p\u003e\n\u003cp\u003e● 经常运动→BMD↑、跌倒/骨折风险↓\u003c/p\u003e\n\u003ch4 id=\"ch7-s217\"\u003e安全红线\u003c/h4\u003e\n\u003cp\u003e● 避免：脊柱过度前屈、扭转、压迫动作→增加脊椎骨折风险\u003c/p\u003e\n\u003cp\u003e● 推荐：躯干伸展+腹部稳定运动\u003c/p\u003e\n\u003cp\u003e● 避免：光滑表面、绊倒危险环境、快速震动动作\u003c/p\u003e\n\u003cp\u003e● 肌力训练+负重+冲击运动（跳跃）对刺激骨量最有效\u003c/p\u003e\n\u003cp\u003e● 强调平衡训练：躯干、髋部、下肢肌肉力量\u003c/p\u003e\n\u003ch4 id=\"ch7-s223\"\u003e4.3 关节炎\u003c/h4\u003e\n\u003cp\u003e图7-10\u003c/p\u003e\n\u003ch4 id=\"ch7-s225\"\u003e骨关节炎（OA）\u003c/h4\u003e\n\u003ch4 id=\"ch7-s226\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 关节软骨退化（过度使用/创伤/肥胖/年龄）→软骨磨损→骨端直接摩擦→疼痛+炎症\u003c/p\u003e\n\u003cp\u003e● 最常受累关节：颈椎/腰椎、髋、膝、手指末端关节\u003c/p\u003e\n\u003cp\u003e● 美国致残主要原因\u003c/p\u003e\n\u003ch4 id=\"ch7-s230\"\u003e症状要点\u003c/h4\u003e\n\u003cp\u003e● 运动时疼痛（随时间/强度加重）\u003c/p\u003e\n\u003cp\u003e● 局部僵硬（尤其晨起/久坐后）\u003c/p\u003e\n\u003cp\u003e● 关节肿胀、灵活性下降\u003c/p\u003e\n\u003cp\u003e● 骨刺/软骨碎片脱落→炎症→进一步软骨损伤\u003c/p\u003e\n\u003ch4 id=\"ch7-s235\"\u003e类风湿关节炎（RA）\u003c/h4\u003e\n\u003ch4 id=\"ch7-s236\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 自身免疫性疾病：滑膜组织炎症→关节软骨/骨骼磨损→关节变形\u003c/p\u003e\n\u003cp\u003e● 全身性疾病：除关节外，还影响皮肤、眼睛、肺、心脏、血管\u003c/p\u003e\n\u003cp\u003e● 分解代谢特性→肌肉减少（必须增强受累关节周围肌肉）\u003c/p\u003e\n\u003ch4 id=\"ch7-s240\"\u003e运动改善模式\u003c/h4\u003e\n\u003cp\u003e表7-13\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e处方\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e心肺：3-5天/周；肌力：2-3天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e心肺：中等（40-59% HRR）至剧烈（≥60% HRR）；身体状况差者30-39% HRR\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e≥150分钟/周低-中强度，或75分钟剧烈，或组合\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e心肺：低冲击有节奏大肌群（步行、骑车、游泳）；肌力：50-80% 1-RM，2-4组×8-12次，无痛ROM内运动\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch7-s242\"\u003e关键要点\u003c/h4\u003e\n\u003cp\u003e● 运动+减重是控制OA最佳方法（尤其超重/肥胖者）\u003c/p\u003e\n\u003cp\u003e● 运动可改善：心肺适能、肌力/耐力、关节灵活性、疲劳、日常生活功能\u003c/p\u003e\n\u003cp\u003e● RA：等长运动优先，避免关节负荷过大\u003c/p\u003e\n\u003cp\u003e● RA：低冲击、有限ROM、温水运动、发作期避免运动可能有益\u003c/p\u003e\n\u003ch4 id=\"ch7-s247\"\u003e安全注意\u003c/h4\u003e\n\u003cp\u003e● OA：下肢关节炎不建议跑步等高冲击运动\u003c/p\u003e\n\u003cp\u003e● RA：根据功能限制和基础心肺适能调整计划\u003c/p\u003e\n\u003cp\u003e● 所有动作在无痛范围内进行\u003c/p\u003e\n\u003cp\u003e表7-14\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003e各疾病关键记忆点总结\u003c/th\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e表7-15\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e疾病/状况\u003c/th\u003e\u003cth\u003e关键记忆点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e冠状动脉疾病（CAD）\u003c/td\u003e\u003ctd\u003e避免Valsalva动作（憋气用力）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e高血压\u003c/td\u003e\u003ctd\u003e记住三个阈值：120（正常上限）、130（1期起点）、140（2期起点）；生活方式改变可避免药物\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e中风\u003c/td\u003e\u003ctd\u003e无特殊上下肢区分限制，重点在功能恢复（平衡/协调/步态）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e外周动脉疾病（PAD）\u003c/td\u003e\u003ctd\u003e以疼痛强度为准（非运动强度）——走至中等疼痛（跛行量表3-4级）→休息→继续\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e糖尿病\u003c/td\u003e\u003ctd\u003e运动前减少胰岛素剂量；不可连续2天不运动（胰岛素敏感性24-48h后消失）；运动中注意低血糖症状\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e代谢综合征\u003c/td\u003e\u003ctd\u003e诊断标准：出现≥3项（腰围↑、TG≥150、HDL↓、血压≥130/85、空腹血糖≥100）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e哮喘\u003c/td\u003e\u003ctd\u003e最佳运动时间：上午中间至晚些时候；保持吸入空气温暖湿润；随身携带急救药物\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e骨质疏松症\u003c/td\u003e\u003ctd\u003e肌力训练+负重+冲击运动（跳跃）；高强度会受益\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e骨关节炎\u003c/td\u003e\u003ctd\u003e避免疼痛范围外运动；避免高冲击和扭转动作\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e各个生命阶段的运动注意事项\u003c/p\u003e\n\u003cp\u003e第     8章\u003c/p\u003e","sections":[{"title":"ACE 教材第7章 · 慢性病客户注意事项","anchor":"ch7-s0"},{"title":"跨疾病通用原则（所有疾病都适用的原则）","anchor":"ch7-s2"},{"title":"一、心脑血管疾病","anchor":"ch7-s17"},{"title":"二、代谢紊乱","anchor":"ch7-s87"},{"title":"三、肺部疾病","anchor":"ch7-s156"},{"title":"四、其他慢性病","anchor":"ch7-s183"}],"paragraphCount":255},"8":{"html":"\u003ch2 id=\"ch8-s0\"\u003eACE 教材第8章 · 各个生命阶段的运动注意事项\u003c/h2\u003e\n\u003cp\u003e本章节按&quot;核心机制/背景→运动指南（FITT）→安全注意&quot;结构组织\u003c/p\u003e\n\u003ch3 id=\"ch8-s2\"\u003e跨人群通用原则\u003c/h3\u003e\n\u003ch4 id=\"ch8-s3\"\u003e医学许可与筛查\u003c/h4\u003e\n\u003cp\u003e● 所有特殊人群开始运动前需获得医学许可（尤其合并慢性病者）\u003c/p\u003e\n\u003cp\u003e● 使用PARmed-X等筛查工具进行运动前健康评估\u003c/p\u003e\n\u003cp\u003e● 慢性病患者需与医师沟通，了解运动禁忌症和限制\u003c/p\u003e\n\u003ch4 id=\"ch8-s7\"\u003e运动处方通用框架\u003c/h4\u003e\n\u003cp\u003e● 心肺：FITT-VP（频率、强度、时间、类型、进阶、变化）\u003c/p\u003e\n\u003cp\u003e● 肌力：频率、强度、时间、类型\u003c/p\u003e\n\u003cp\u003e● 强度监控：谈话测试、RPE、VT1/VT2——不同人群适用不同监控方式\u003c/p\u003e\n\u003ch4 id=\"ch8-s11\"\u003eACE IFT模型适用性\u003c/h4\u003e\n\u003cp\u003e● 三大人群均可使用ACE整合式健身训练模型\u003c/p\u003e\n\u003cp\u003e● 需根据人群特点调整评估方式和计划设计\u003c/p\u003e\n\u003cp\u003e● 评估本身不必与成年人完全区分，但需注意趣味性和安全性\u003c/p\u003e\n\u003ch4 id=\"ch8-s15\"\u003e行为改变与社会支持\u003c/h4\u003e\n\u003cp\u003e● ACE Mover Method + ABC Approach适用于所有人群\u003c/p\u003e\n\u003cp\u003e● 社会支持是坚持运动的关键因素（家庭参与、同伴鼓励）\u003c/p\u003e\n\u003cp\u003e● 运动计划设计应考虑个人目标、能量波动和日常限制\u003c/p\u003e\n\u003ch3 id=\"ch8-s19\"\u003e一、青少年\u003c/h3\u003e\n\u003cp\u003e图8-1\u003c/p\u003e\n\u003ch4 id=\"ch8-s21\"\u003e1.1 背景与现状\u003c/h4\u003e\n\u003ch4 id=\"ch8-s22\"\u003e核心问题\u003c/h4\u003e\n\u003cp\u003e● 仅20-26%的美国青少年达到身体活动推荐水平（2018年报告卡评分D-）\u003c/p\u003e\n\u003cp\u003e● 全球青少年身体活动和久坐行为平均得分均为D\u003c/p\u003e\n\u003cp\u003e● 活动水平随年龄增长而下降：16-19岁仅5%达标\u003c/p\u003e\n\u003cp\u003e● 女孩活动参与度显著低于男孩\u003c/p\u003e\n\u003cp\u003e● 原因：学校体育要求降低、屏幕时间增加（45%高中年龄青少年每日&gt;3小时）、社区安全性不足\u003c/p\u003e\n\u003ch4 id=\"ch8-s28\"\u003e缺乏活动的后果\u003c/h4\u003e\n\u003cp\u003e● 儿童期肥胖、高血压、2型糖尿病、骨质疏松症、动脉粥样硬化\u003c/p\u003e\n\u003cp\u003e● 久坐习惯延续至成年→形成代际恶性循环（父母不运动→子女不运动可能性高6倍）\u003c/p\u003e\n\u003ch4 id=\"ch8-s31\"\u003e身体素养（Physical Literacy）\u003c/h4\u003e\n\u003cp\u003e● 定义：进行身体活动的能力、信心和意愿\u003c/p\u003e\n\u003cp\u003e● 核心目标：帮助孩子掌握跑、跳、平衡等基本运动能力\u003c/p\u003e\n\u003cp\u003e● 策略：将提高身体素养作为家庭运动计划基础，强调努力而非成绩\u003c/p\u003e\n\u003ch4 id=\"ch8-s35\"\u003e1.2 青少年运动指南\u003c/h4\u003e\n\u003ch4 id=\"ch8-s36\"\u003e核心原则\u003c/h4\u003e\n\u003cp\u003e● 每天总计≥60分钟中等至高强度身体活动\u003c/p\u003e\n\u003cp\u003e● 包含心肺活动 + 适合年龄的肌肉强化 + 骨骼强化运动\u003c/p\u003e\n\u003cp\u003e● 每周累积总量比单一组成部分（频率/强度/持续时间）更重要\u003c/p\u003e\n\u003cp\u003e● 骨骼强化对青少年尤为重要——骨量最大增长发生在青春期前和青春期\u003c/p\u003e\n\u003ch4 id=\"ch8-s41\"\u003e肌肉训练的安全性与有效性\u003c/h4\u003e\n\u003cp\u003e● 误区澄清：青春期前儿童可安全进行肌肉训练（在适当监督下）\u003c/p\u003e\n\u003cp\u003e● 无证据显示适当监督的渐进式肌肉训练会导致生长迟缓或骨骼损伤\u003c/p\u003e\n\u003cp\u003e● 研究数据：10个月简单肌肉训练使9岁女孩骨密度增幅达对照组4倍（6.2% vs 1.4%）\u003c/p\u003e\n\u003cp\u003e● 肌肉训练损伤风险记录优于其他体育活动\u003c/p\u003e\n\u003ch4 id=\"ch8-s46\"\u003eFITT建议\u003c/h4\u003e\n\u003cp\u003e表8-1\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e有氧\u003c/th\u003e\u003cth\u003e抗阻\u003c/th\u003e\u003cth\u003e骨骼强化\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e每天\u003c/td\u003e\u003ctd\u003e≥3天/周\u003c/td\u003e\u003ctd\u003e≥3天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e大多数为中等强度（HR和呼吸明显增加）至高强度（HR和呼吸大幅增加），高强度每周≥3天\u003c/td\u003e\u003ctd\u003e次极量重复8-15次，达到中度疲劳\u003c/td\u003e\u003ctd\u003eN/A\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e作为每天≥60分钟运动的一部分\u003c/td\u003e\u003ctd\u003e作为每天≥60分钟运动的一部分\u003c/td\u003e\u003ctd\u003e作为每天≥60分钟运动的一部分\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e适合年龄的愉悦活动：跑步、游泳、骑车、跳舞、足球、篮球、网球\u003c/td\u003e\u003ctd\u003e非结构化（爬树、拔河、 在运动场设备上攀爬）或结构化（自重/阻力带/器械）\u003c/td\u003e\u003ctd\u003e跑步、跳绳、篮球、网球、抗阻训练、跳格子\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch8-s48\"\u003e1.3 安全注意\u003c/h4\u003e\n\u003ch4 id=\"ch8-s49\"\u003e肌肉训练安全指南\u003c/h4\u003e\n\u003cp\u003e● 始终对儿童进行适当监督，采用正确技术\u003c/p\u003e\n\u003cp\u003e● 传统健身器材可能不适合孩子的杠杆臂——优先选择自由调节重量器材或自重运动\u003c/p\u003e\n\u003cp\u003e● 切勿鼓励单纯的大重量托举或爆发性动作\u003c/p\u003e\n\u003cp\u003e● 教导正确呼吸方式（避免Valsalva）\u003c/p\u003e\n\u003cp\u003e● 鼓励运动前/中/后充分饮水\u003c/p\u003e\n\u003cp\u003e● 告诉孩子感到疲劳/乏力/不适/痛苦时立即沟通\u003c/p\u003e\n\u003ch4 id=\"ch8-s56\"\u003e极端环境防护\u003c/h4\u003e\n\u003cp\u003e● 高温风险因素：体表面积/质量比高、出汗能力弱、运动经济性低\u003c/p\u003e\n\u003cp\u003e● 极冷风险：脱水、低温症、冻伤——保持补水和分层穿衣\u003c/p\u003e\n\u003cp\u003e● 冷空气湿度低→加重哮喘/运动诱发性支气管痉挛\u003c/p\u003e\n\u003cp\u003e● 关注气象部门高温/寒冷警告，必要时移至室内\u003c/p\u003e\n\u003cp\u003e● 佩戴护具的运动更需注意热相关疾病\u003c/p\u003e\n\u003ch4 id=\"ch8-s62\"\u003e过劳性损伤与体育专业化\u003c/h4\u003e\n\u003cp\u003e● 全年单一运动→重复性发力→过劳性损伤风险↑\u003c/p\u003e\n\u003cp\u003e● 多样化体育活动增强本体感受、多维力量、敏捷性、速度\u003c/p\u003e\n\u003cp\u003e● 遵循周期化原则——职业运动员不会全年不断比赛，青少年也应如此\u003c/p\u003e\n\u003cp\u003e● 运动必须适合年龄、强度适当\u003c/p\u003e\n\u003ch4 id=\"ch8-s67\"\u003e🔑 青少年关键记忆点\u003c/h4\u003e\n\u003cp\u003e● 每天≥60分钟；骨骼强化特别重要（骨量增长窗口期）\u003c/p\u003e\n\u003cp\u003e● 肌肉训练安全（有监督）；避免大重量和爆发力\u003c/p\u003e\n\u003cp\u003e● 避免体育专业化和过劳性损伤；遵循周期化\u003c/p\u003e\n\u003cp\u003e● 高温/极冷环境需特殊防护\u003c/p\u003e\n\u003ch3 id=\"ch8-s72\"\u003e二、孕期与产后女性\u003c/h3\u003e\n\u003ch4 id=\"ch8-s73\"\u003e2.1 孕期\u003c/h4\u003e\n\u003cp\u003e图8-2\u003c/p\u003e\n\u003ch4 id=\"ch8-s75\"\u003e生理变化\u003c/h4\u003e\n\u003ch4 id=\"ch8-s76\"\u003e身体结构与重心\u003c/h4\u003e\n\u003cp\u003e● 建议增重：25-35磅（11.4-15.9kg），孕前体重不同则建议不同\u003c/p\u003e\n\u003cp\u003e● 腹围增长→背部、骨盆、髋部、腿部承受额外压力\u003c/p\u003e\n\u003cp\u003e● 重心向上向前移→影响平衡和协调性\u003c/p\u003e\n\u003cp\u003e● 孕前通过深蹲、弓步、硬举增强腿后侧和躯干力量，为增重做准备\u003c/p\u003e\n\u003ch4 id=\"ch8-s81\"\u003e激素变化\u003c/h4\u003e\n\u003cp\u003e● 松弛素↑→骨盆增大（利于分娩）但所有关节松弛度增加→旧伤复发风险/关节不稳\u003c/p\u003e\n\u003cp\u003e● 需要力量和稳定训练增加身体稳定性\u003c/p\u003e\n\u003cp\u003e● 恶心和疲劳（妊娠早期最常见，但任何阶段都可能发生）\u003c/p\u003e\n\u003ch4 id=\"ch8-s85\"\u003e心血管变化\u003c/h4\u003e\n\u003cp\u003e● 心力储备（静息与最大心脏功能之差）减小\u003c/p\u003e\n\u003cp\u003e● 心率、血容量、心搏量、心输出量↑（孕早期即开始）\u003c/p\u003e\n\u003cp\u003e● 短暂中等强度运动后可能感觉喘不过气→增加休息时间\u003c/p\u003e\n\u003cp\u003e● 避免静止姿势（如仰卧），因可导致静脉回流减少和低血压\u003c/p\u003e\n\u003ch4 id=\"ch8-s90\"\u003e体温调节\u003c/h4\u003e\n\u003cp\u003e● 散热能力略有提高（皮肤血流↑+潮气量↑）\u003c/p\u003e\n\u003cp\u003e● 运动前必须知晓环境温度\u003c/p\u003e\n\u003cp\u003e● 环境温度/湿度升高→显著影响散热→可能导致高热症\u003c/p\u003e\n\u003cp\u003e● 尚无运动相关高热症引起胚胎/胎儿畸形的报告\u003c/p\u003e\n\u003ch4 id=\"ch8-s95\"\u003e运动指南\u003c/h4\u003e\n\u003ch4 id=\"ch8-s96\"\u003e核心建议\u003c/h4\u003e\n\u003cp\u003e● 每周≥150分钟中等强度有氧运动，至少3天\u003c/p\u003e\n\u003cp\u003e● 不论产前运动经历如何，孕期在医师指导下运动都有益且安全（ACOG 2015）\u003c/p\u003e\n\u003cp\u003e● 运动可降低：先兆子痫、妊娠期糖尿病、剖腹产、下背痛、焦虑、恶心、胃灼热、失眠、腿痛性痉挛发生率\u003c/p\u003e\n\u003cp\u003e● 孕前喜爱运动者：可继续原有计划（安全运动强度上限尚未确定）\u003c/p\u003e\n\u003cp\u003e● 孕前不爱运动者：缓慢开始，进阶至中等强度（可能需从&lt;10分钟间歇性运动起步）\u003c/p\u003e\n\u003ch4 id=\"ch8-s102\"\u003e强度监控\u003c/h4\u003e\n\u003cp\u003e● 谈话测试优于心率监控\u003c/p\u003e\n\u003cp\u003e● 结果&lt;VT1 = 中等强度\u003c/p\u003e\n\u003cp\u003e● 中等强度：MET 3-5.9，RPE 12-13（6-20量表）\u003c/p\u003e\n\u003cp\u003e● 高强度（MET≥6，RPE 14-17）仅适合孕前已运动或想要提高健康水平的女性\u003c/p\u003e\n\u003ch4 id=\"ch8-s107\"\u003eFITT建议\u003c/h4\u003e\n\u003cp\u003e表8-2\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e有氧\u003c/th\u003e\u003cth\u003e抗阻\u003c/th\u003e\u003cth\u003e柔韧性\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e&gt;3-5天/周\u003c/td\u003e\u003ctd\u003e不连续的2-3天/周\u003c/td\u003e\u003ctd\u003e&gt;2-3天/周（每天最有效）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e中等（MET 3-5.9，RPE 12-13）；高强度适合孕前已运动者\u003c/td\u003e\u003ctd\u003e次极量重复8-10次或12-15次，中度疲劳\u003c/td\u003e\u003ctd\u003e拉伸至紧缩感或轻微不适\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e每天≥30分钟，每周≥150分钟中等或≥75分钟高强度\u003c/td\u003e\u003ctd\u003e初学者1组；中高级2-3组\u003c/td\u003e\u003ctd\u003e静态拉伸保持10-30秒\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e负重和非负重均可：徒步、团体运动、游泳（水中运动减轻腰腿压力）\u003c/td\u003e\u003ctd\u003e器械、自由重量、自重：坐姿推胸、哑铃、弓步\u003c/td\u003e\u003ctd\u003e静态和动态柔韧性运动，每个肌群\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch8-s109\"\u003e安全注意\u003c/h4\u003e\n\u003ch4 id=\"ch8-s110\"\u003e绝对禁忌——终止运动的警示性体征\u003c/h4\u003e\n\u003cp\u003e● 阴道出血\u003c/p\u003e\n\u003cp\u003e● 宫缩阵痛\u003c/p\u003e\n\u003cp\u003e● 羊水泄露\u003c/p\u003e\n\u003cp\u003e● 用力前呼吸困难\u003c/p\u003e\n\u003cp\u003e● 眩晕或感到昏晕\u003c/p\u003e\n\u003cp\u003e● 头疼\u003c/p\u003e\n\u003cp\u003e● 胸痛\u003c/p\u003e\n\u003cp\u003e● 影响平衡的肌无力\u003c/p\u003e\n\u003cp\u003e● 小腿疼痛或肿胀\u003c/p\u003e\n\u003ch4 id=\"ch8-s120\"\u003e运动禁忌与避免事项\u003c/h4\u003e\n\u003cp\u003e● 避免高风险/可能腹部创伤的运动（接触性项目、滑雪、冲浪）\u003c/p\u003e\n\u003cp\u003e● 避免极端高温环境（如热瑜伽）\u003c/p\u003e\n\u003cp\u003e● 避免长时间仰卧姿势\u003c/p\u003e\n\u003cp\u003e● 某些运动可能需要调整或与产科护理者讨论（慢跑、球拍运动等）\u003c/p\u003e\n\u003ch4 id=\"ch8-s125\"\u003e营养与补水\u003c/h4\u003e\n\u003cp\u003e● 运动前后充分补水\u003c/p\u003e\n\u003cp\u003e● 运动前吃小零食避免低血糖（尤其中等强度&gt;45分钟时）\u003c/p\u003e\n\u003cp\u003e● 平衡热量摄入\u003c/p\u003e\n\u003ch4 id=\"ch8-s129\"\u003e腹直肌分离（Diastasis Recti）\u003c/h4\u003e\n\u003cp\u003e● 腹直肌两肌腹分离，可达1-2英寸（2.5-5.1cm）\u003c/p\u003e\n\u003cp\u003e● 孕期发病率高达45%，产后12个月仍达33%\u003c/p\u003e\n\u003cp\u003e● 孕前和孕期运动可减少35%发病率\u003c/p\u003e\n\u003cp\u003e● 推荐运动：腹横肌等长收缩、姿势肌和腹部力量训练\u003c/p\u003e\n\u003cp\u003e● 注意评估腹直肌分离情况后再设计核心训练\u003c/p\u003e\n\u003ch4 id=\"ch8-s135\"\u003e2.2 产后\u003c/h4\u003e\n\u003cp\u003e图8-3\u003c/p\u003e\n\u003ch4 id=\"ch8-s137\"\u003e核心要点\u003c/h4\u003e\n\u003ch4 id=\"ch8-s138\"\u003e恢复原则\u003c/h4\u003e\n\u003cp\u003e● 分娩体验因人而异，产后激素水平继续变化\u003c/p\u003e\n\u003cp\u003e● 疲劳常见（激素变化+身体需求+睡眠中断）\u003c/p\u003e\n\u003cp\u003e● 产后贫血常见→与生活质量下降、认知能力减弱、情绪不稳/抑郁相关\u003c/p\u003e\n\u003cp\u003e● 剖腹产需额外恢复时间（开刀手术）\u003c/p\u003e\n\u003cp\u003e● 流产和死产的悲痛支持：25%妊娠以流产告终，1%死产\u003c/p\u003e\n\u003ch4 id=\"ch8-s144\"\u003e运动恢复指南\u003c/h4\u003e\n\u003cp\u003e● 产后几天/几周内，根据医生建议逐渐增加运动量\u003c/p\u003e\n\u003cp\u003e● 慢慢开始：先增加持续时间和频率，再增加强度\u003c/p\u003e\n\u003cp\u003e● ACOG建议每日20-30分钟（步行+简单主要肌群强化）\u003c/p\u003e\n\u003cp\u003e● 异常疼痛（尤其外阴切开术/剖腹产后）→停止运动并咨询医师\u003c/p\u003e\n\u003cp\u003e● 比正常月经更重的鲜红阴道流血→停止运动并就医\u003c/p\u003e\n\u003cp\u003e● 目标：9-12个月回到孕前运动强度水平\u003c/p\u003e\n\u003ch4 id=\"ch8-s151\"\u003e哺乳期注意\u003c/h4\u003e\n\u003cp\u003e● 热量和营养需求增加→需同时满足运动和母乳需求\u003c/p\u003e\n\u003cp\u003e● 充分饮水\u003c/p\u003e\n\u003cp\u003e● 长时间抱孩子→头部前倾和圆肩风险↑\u003c/p\u003e\n\u003cp\u003e● 计划设计应包括：后背与后肩运动（坐姿划船）+ 前肩和胸肌拉伸\u003c/p\u003e\n\u003ch4 id=\"ch8-s156\"\u003e计划设计重点\u003c/h4\u003e\n\u003cp\u003e● 考虑剖腹产伤口愈合或腹直肌分离情况\u003c/p\u003e\n\u003cp\u003e● 增加躯干力量和稳定性运动\u003c/p\u003e\n\u003cp\u003e● 制定简单的10分钟可完成运动计划（照顾孩子时间有限）\u003c/p\u003e\n\u003cp\u003e● 鼓励多散步（可带孩子一起）\u003c/p\u003e\n\u003ch4 id=\"ch8-s161\"\u003e🔑 孕期与产后关键记忆点\u003c/h4\u003e\n\u003cp\u003e● 孕期：每周≥150分钟中等强度，谈话测试监控（&lt;VT1）\u003c/p\u003e\n\u003cp\u003e● 孕期：避免仰卧、高温环境、接触性运动\u003c/p\u003e\n\u003cp\u003e● 孕期：警示性体征9项（见上方清单）\u003c/p\u003e\n\u003cp\u003e● 松弛素影响所有关节→关节不稳风险↑\u003c/p\u003e\n\u003cp\u003e● 腹直肌分离：孕期发病率45%，运动可减少35%\u003c/p\u003e\n\u003cp\u003e● 产后：慢慢开始，9-12个月回到孕前水平\u003c/p\u003e\n\u003cp\u003e● 产后：关注哺乳期营养补水+圆肩/头部前倾\u003c/p\u003e\n\u003ch3 id=\"ch8-s169\"\u003e三、老年人\u003c/h3\u003e\n\u003cp\u003e图8-4\u003c/p\u003e\n\u003ch4 id=\"ch8-s171\"\u003e3.1 衰老的结构性变化\u003c/h4\u003e\n\u003ch4 id=\"ch8-s172\"\u003e肌肉骨骼系统\u003c/h4\u003e\n\u003cp\u003e● 肌肉质量↓→力量和耐力↓（生活方式变化+神经肌肉功能减弱）\u003c/p\u003e\n\u003cp\u003e● 骨骼更脆弱多孔→骨折风险↑\u003c/p\u003e\n\u003cp\u003e● 钙损失→骨量下降（负重和肌肉训练可维持）\u003c/p\u003e\n\u003cp\u003e● 约20%髋骨折老年人死于相关并发症\u003c/p\u003e\n\u003cp\u003e● 瘦体组织↓ + 体脂↑ + 基础代谢率↓\u003c/p\u003e\n\u003ch4 id=\"ch8-s178\"\u003e平衡与稳定性\u003c/h4\u003e\n\u003cp\u003e● 三大平衡系统均受衰老负面影响：\u003c/p\u003e\n\u003cp\u003e● 视觉系统（最主要的本体感受输入通道）→衰退\u003c/p\u003e\n\u003cp\u003e● 前庭系统（头部空间位置信息）→功能下降\u003c/p\u003e\n\u003cp\u003e● 躯体感觉系统（肌肉/关节本体感受器、皮肤/压力感受器）→功能下降\u003c/p\u003e\n\u003cp\u003e● 平衡和协调性↓→跌倒和相关损伤风险↑\u003c/p\u003e\n\u003ch4 id=\"ch8-s184\"\u003e认知与心理健康\u003c/h4\u003e\n\u003cp\u003e● 认知能力下降→平衡能力、注意力、专注力下降\u003c/p\u003e\n\u003cp\u003e● 抑郁症和焦虑症风险↑\u003c/p\u003e\n\u003cp\u003e● 失去家人朋友→社会化程度↓\u003c/p\u003e\n\u003cp\u003e● 身体活动可预防和减缓认知能力衰退（50岁以上人群，无论初始认知状态）\u003c/p\u003e\n\u003cp\u003e● 运动为老年人提供社交机会和挑战/目标\u003c/p\u003e\n\u003ch4 id=\"ch8-s190\"\u003e3.2 老年人运动指南\u003c/h4\u003e\n\u003ch4 id=\"ch8-s191\"\u003e核心建议\u003c/h4\u003e\n\u003cp\u003e● 每周150-300分钟中等强度 或 75-150分钟高强度 或 两者结合\u003c/p\u003e\n\u003cp\u003e● 最好将时间分散开\u003c/p\u003e\n\u003cp\u003e● 多做身体活动可获得额外益处——做些运动总比不做的好\u003c/p\u003e\n\u003cp\u003e● 缺乏定期运动计划时：一天中多动少坐\u003c/p\u003e\n\u003cp\u003e● 每周≥2次肌力训练（主要肌群），维持或增加力量和耐力\u003c/p\u003e\n\u003cp\u003e● 平衡训练必须纳入运动计划→提高本体感受，降低跌倒风险\u003c/p\u003e\n\u003ch4 id=\"ch8-s198\"\u003eFITT建议\u003c/h4\u003e\n\u003cp\u003e表8-3\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e维度\u003c/th\u003e\u003cth\u003e有氧\u003c/th\u003e\u003cth\u003e抗阻\u003c/th\u003e\u003cth\u003e柔韧性\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e频率\u003c/td\u003e\u003ctd\u003e中等：&gt;5天/周；高等：&gt;3天/周；结合：3-5天/周\u003c/td\u003e\u003ctd\u003e≥2天/周\u003c/td\u003e\u003ctd\u003e&gt;2天/周\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e强度\u003c/td\u003e\u003ctd\u003e0-10量表：中等5-6，高等7-8\u003c/td\u003e\u003ctd\u003e初学者低强度（40-50% 1-RM）→逐渐过渡至中高等（60-80% 1-RM）；或0-10量表中等(5-6)至高等(7-8)\u003c/td\u003e\u003ctd\u003e拉伸至紧缩感或轻微不适\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e时间\u003c/td\u003e\u003ctd\u003e中等30-60分钟/天；高等20-30分钟/天；可多次累计（每次≥10分钟）\u003c/td\u003e\u003ctd\u003e8-10个动作，1-3组×8-12次\u003c/td\u003e\u003ctd\u003e保持30-60秒\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e类型\u003c/td\u003e\u003ctd\u003e不带来过多压力的运动：散步；负重困难者选水上运动/固定式自行车\u003c/td\u003e\u003ctd\u003e渐进式训练、负重健美操、爬楼梯\u003c/td\u003e\u003ctd\u003e慢速静态拉伸，每个肌群\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch8-s200\"\u003e3.3 安全注意与计划设计\u003c/h4\u003e\n\u003ch4 id=\"ch8-s201\"\u003e评估调整\u003c/h4\u003e\n\u003cp\u003e● 关节炎在65岁以上人群中发病率49.6%——极常见\u003c/p\u003e\n\u003cp\u003e● 评估顺序建议：先做姿势和柔韧性评估→再调整运动评估\u003c/p\u003e\n\u003cp\u003e● 膝关节炎客户可能不适合自重深蹲→可改用坐下/站起测试\u003c/p\u003e\n\u003cp\u003e● 平衡评估：安全第一，单脚站立优于Y平衡测试\u003c/p\u003e\n\u003cp\u003e● 初始可借助墙壁/门框等外部稳定装置→进阶到拐杖/手杖→最终无外力支持\u003c/p\u003e\n\u003ch4 id=\"ch8-s207\"\u003e计划设计重点\u003c/h4\u003e\n\u003cp\u003e● 热身更重要（胶原含量↓+缔结组织弹性↓）→减少受伤风险\u003c/p\u003e\n\u003cp\u003e● 放松时间用于静态拉伸（肌肉紧张妨碍灵活性/ADL时）\u003c/p\u003e\n\u003cp\u003e● 平衡运动应在课程早期引入——此时力量最高、专注度最高、受伤风险最低\u003c/p\u003e\n\u003cp\u003e● 重点放在功能训练上\u003c/p\u003e\n\u003cp\u003e● 考虑客户能否正常俯身和起身（按摩床/椅可能有用）\u003c/p\u003e\n\u003cp\u003e● 负重运动首选（在承受范围内）→强化骨骼\u003c/p\u003e\n\u003cp\u003e● 固定式/卧式自行车：低中心栏方便上下\u003c/p\u003e\n\u003cp\u003e● 不要为客户设限——激发冒险精神和成就感\u003c/p\u003e\n\u003cp\u003e● 慢慢增加持续时间和运动量\u003c/p\u003e\n\u003ch4 id=\"ch8-s217\"\u003e🔑 老年人关键记忆点\u003c/h4\u003e\n\u003cp\u003e● 150-300分钟中等强度/周；平衡训练必须纳入\u003c/p\u003e\n\u003cp\u003e● 20%髋骨折老年人死于并发症；负重运动强化骨骼\u003c/p\u003e\n\u003cp\u003e● 关节炎发病率49.6%（65岁以上）——先评估姿势和柔韧性\u003c/p\u003e\n\u003cp\u003e● 热身比以往更重要（胶原↓、弹性↓）\u003c/p\u003e\n\u003cp\u003e● 平衡训练放在课程早期（专注度最高时）\u003c/p\u003e\n\u003cp\u003e● 运动可预防认知衰退、改善心理健康\u003c/p\u003e\n\u003ch3 id=\"ch8-s224\"\u003e各人群关键记忆点总结\u003c/h3\u003e\n\u003cp\u003e表8-4\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e人群\u003c/th\u003e\u003cth\u003e关键记忆点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e青少年·活动量\u003c/td\u003e\u003ctd\u003e每天≥60分钟中等至高强度；骨骼强化在青春期前/青春期尤为重要（骨量增长窗口期）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e青少年·肌肉训练\u003c/td\u003e\u003ctd\u003e安全（有监督时）；避免大重量和爆发力；优先自重/阻力带\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e青少年·风险\u003c/td\u003e\u003ctd\u003e避免体育专业化和过劳性损伤；遵循周期化；高温/极冷环境特殊防护\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e孕期·运动量\u003c/td\u003e\u003ctd\u003e每周≥150分钟中等强度，至少3天；谈话测试监控（&lt;VT1）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e孕期·禁忌\u003c/td\u003e\u003ctd\u003e避免仰卧、高温环境、接触性/高跌落风险运动；注意9项警示性体征\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e孕期·激素\u003c/td\u003e\u003ctd\u003e松弛素↑→所有关节松弛→关节不稳；力量和稳定训练对抗\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e孕期·腹直肌分离\u003c/td\u003e\u003ctd\u003e孕期发病率45%；运动可减少35%；推荐腹横肌等长收缩\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e产后·恢复\u003c/td\u003e\u003ctd\u003e慢慢开始，9-12个月回到孕前水平；剖腹产需额外恢复时间\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e产后·注意\u003c/td\u003e\u003ctd\u003e哺乳期需更多热量/水分；关注圆肩/头部前倾；加入后背和后肩运动\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e老年人·运动量\u003c/td\u003e\u003ctd\u003e150-300分钟中等强度/周；平衡训练必须纳入；≥2次/周肌力训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e老年人·骨骼\u003c/td\u003e\u003ctd\u003e20%髋骨折老年人死于并发症；负重运动在承受范围内强化骨骼\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e老年人·关节炎\u003c/td\u003e\u003ctd\u003e65岁以上发病率49.6%；先评估姿势和柔韧性，再调整运动评估\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e老年人·计划设计\u003c/td\u003e\u003ctd\u003e热身比以往更重要；平衡训练放在课程早期；重点放在功能训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e老年人·认知\u003c/td\u003e\u003ctd\u003e运动可预防和减缓认知衰退，改善心理健康，提供社交机会\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e肌肉骨骼异常客户的注意事项\u003c/p\u003e\n\u003cp\u003e第       9章\u003c/p\u003e","sections":[{"title":"ACE 教材第8章 · 各个生命阶段的运动注意事项","anchor":"ch8-s0"},{"title":"跨人群通用原则","anchor":"ch8-s2"},{"title":"一、青少年","anchor":"ch8-s19"},{"title":"二、孕期与产后女性","anchor":"ch8-s72"},{"title":"三、老年人","anchor":"ch8-s169"},{"title":"各人群关键记忆点总结","anchor":"ch8-s224"}],"paragraphCount":228},"9":{"html":"\u003ch2 id=\"ch9-s0\"\u003eACE 教材第9章 · 肌肉骨骼异常客户的注意事项 · 重点总结\u003c/h2\u003e\n\u003cp\u003e本章节按&quot;核心机制→症状要点→课程设计/安全注意&quot;结构组织\u003c/p\u003e\n\u003ch3 id=\"ch9-s2\"\u003e跨病症通用原则\u003c/h3\u003e\n\u003ch4 id=\"ch9-s3\"\u003e执业范围\u003c/h4\u003e\n\u003cp\u003e● 私人教练的职责是运动评估，不是损伤评估/诊断\u003c/p\u003e\n\u003cp\u003e● 客户出现疼痛或受伤，必须转介给医疗保健专业人员\u003c/p\u003e\n\u003cp\u003e● 与医生/理疗师保持沟通，获取运动限制和恢复方案\u003c/p\u003e\n\u003ch4 id=\"ch9-s7\"\u003e愈合三阶段\u003c/h4\u003e\n\u003cp\u003e表9-1\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e阶段\u003c/th\u003e\u003cth\u003e时间\u003c/th\u003e\u003cth\u003e特征\u003c/th\u003e\u003cth\u003e运动\u003c/th\u003e\u003cth\u003e禁忌\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI 炎症期\u003c/td\u003e\u003ctd\u003e前3-4天\u003c/td\u003e\u003ctd\u003e发红、肿胀、疼痛、局部发烫\u003c/td\u003e\u003ctd\u003e零负重，主动ROM\u003c/td\u003e\u003ctd\u003e患处疼痛/肿胀时禁止训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eII 修复期\u003c/td\u003e\u003ctd\u003e3天-6周\u003c/td\u003e\u003ctd\u003e瘢痕初步形成\u003c/td\u003e\u003ctd\u003e耐受范围内负重，缓慢无痛运动\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIII 重塑期\u003c/td\u003e\u003ctd\u003e4周-2年\u003c/td\u003e\u003ctd\u003e瘢痕组织力量增加\u003c/td\u003e\u003ctd\u003e循序渐进无痛运动\u003c/td\u003e\u003ctd\u003e—\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e● 急性期标准处理：RICE（休息Rest、冰敷Ice、压迫Compression、抬高Elevation）\u003c/p\u003e\n\u003cp\u003e● 冰敷：间接接触皮肤，每次≤20分钟，前24-48小时冰敷（非热敷）\u003c/p\u003e\n\u003cp\u003e● 压迫：弹性绷带包扎受伤部位，控制肿胀；绷带应扎牢但不可太紧（以免阻碍静脉血回流）\u003c/p\u003e\n\u003cp\u003e● 抬高：至心脏水平以上，有助于静脉血回流\u003c/p\u003e\n\u003ch4 id=\"ch9-s13\"\u003e伤后训练进度\u003c/h4\u003e\n\u003cp\u003e● 训练进度须始终维持保守态度\u003c/p\u003e\n\u003cp\u003e● 与医生/理疗师保持联系，获取禁忌动作建议和推荐运动恢复方案\u003c/p\u003e\n\u003cp\u003e● 严格执行无痛训练课程后，组织重塑可功能完全恢复且无症状\u003c/p\u003e\n\u003cp\u003e● 受伤部位疼痛 = 应立即停止运动\u003c/p\u003e\n\u003ch4 id=\"ch9-s18\"\u003e疼痛管理\u003c/h4\u003e\n\u003cp\u003e● 使用知觉疼痛等级量表（0-10级）\u003c/p\u003e\n\u003cp\u003e● 疼痛超过3级即停止运动（3级尚未引起不适/痛苦）\u003c/p\u003e\n\u003cp\u003e● 训练前及训练中持续评估疼痛等级\u003c/p\u003e\n\u003cp\u003e● 慢性疼痛会造成生物、心理和情绪影响（愤怒、绝望、抑郁、焦虑）\u003c/p\u003e\n\u003cp\u003e● 与客户沟通疼痛管理要点：\u003c/p\u003e\n\u003cp\u003e1. 锻炼前说明可能触及患处\u003c/p\u003e\n\u003cp\u003e2. 解释疼痛等级量表\u003c/p\u003e\n\u003cp\u003e3. 说明超过3级将中止锻炼\u003c/p\u003e\n\u003cp\u003e4. 鼓励客户交流任意程度的疼痛\u003c/p\u003e\n\u003cp\u003e5. 让客户在训练前及全程评估疼痛级别\u003c/p\u003e\n\u003ch4 id=\"ch9-s29\"\u003e预防肌肉骨骼损伤\u003c/h4\u003e\n\u003cp\u003e● 柔韧性和弹性：损伤后瘢痕组织降低弹性；长期不运动、放疗、年龄增长均导致弹性下降；弹性差既是损伤成因也是后果\u003c/p\u003e\n\u003cp\u003e● 热身活动：覆盖所有运动平面，激活本体感受器，增加血流和结缔组织弹性；全方位预备操优先于单平面活动（如步行/骑行）\u003c/p\u003e\n\u003cp\u003e● 恢复：两节训练课之间留出充分修复时间；拉伸和自我肌筋膜放松舒缓僵硬肌肉\u003c/p\u003e\n\u003ch4 id=\"ch9-s33\"\u003e课程设计通用框架\u003c/h4\u003e\n\u003cp\u003e● 热身更为重要（胶原↓、弹性↓），需覆盖所有运动平面\u003c/p\u003e\n\u003cp\u003e● 先解决ROM受限和姿势不良，再进阶\u003c/p\u003e\n\u003cp\u003e● 动力链思维：相邻关节功能障碍会影响远端\u003c/p\u003e\n\u003cp\u003e● 恢复期计划必不可少：组织修复+关节ROM\u003c/p\u003e\n\u003cp\u003e● 静态拉伸放在锻炼结束时（长时间拉伸后神经抑制、力量↓）；\u003c/p\u003e\n\u003cp\u003e● 若需抑制过度活跃肌肉/调整姿势，可在简单热身后先做静态拉伸\u003c/p\u003e\n\u003cp\u003e● 积极恢复计划是成功计划的重要部分\u003c/p\u003e\n\u003ch4 id=\"ch9-s41\"\u003e康复期肌肉和心肺训练注意事项\u003c/h4\u003e\n\u003cp\u003e表9-2\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e损伤类型\u003c/th\u003e\u003cth\u003e可做的肌肉训练\u003c/th\u003e\u003cth\u003e可做的心肺训练\u003c/th\u003e\u003cth\u003e应避免\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e下肢损伤\u003c/td\u003e\u003ctd\u003e上半身：坐位或卧位训练；下半身：按理疗师/医生指示；脊柱和髓核：不涉及患肢的训练\u003c/td\u003e\u003ctd\u003e水中运动；上肢测力计；卧式/固定式自行车\u003c/td\u003e\u003ctd\u003e任何引起疼痛的动作；负重训练（除非获医生/理疗师允许）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e上肢损伤\u003c/td\u003e\u003ctd\u003e下半身：不涉及患肢的训练；上半身：按理疗师/医生指示；脊柱和髓核：不涉及患肢的训练\u003c/td\u003e\u003ctd\u003e步行；卧式/固定式自行车；椭圆机\u003c/td\u003e\u003ctd\u003e任何引起疼痛的动作；跑步（动力链影响可能致患肢疼痛）；需双手保持稳定性的训练\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e背部/脊柱损伤\u003c/td\u003e\u003ctd\u003e理疗师/医生指示的练习和拉伸；可承受范围内的负重训练\u003c/td\u003e\u003ctd\u003e水中运动；步行；卧式/固定式自行车\u003c/td\u003e\u003ctd\u003e任何引起疼痛的动作；高频重复动作组（重复8-10次，避免疲乏）；负重脊柱旋转；需接触地面的运动（条件允许可垫高或用按摩椅）\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch3 id=\"ch9-s43\"\u003e一、急性损伤\u003c/h3\u003e\n\u003ch4 id=\"ch9-s44\"\u003e1.1 肌肉拉伤（Strain）\u003c/h4\u003e\n\u003ch4 id=\"ch9-s45\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 肌肉超限工作→肌纤维撕裂；任何类型的用力都可能发生\u003c/p\u003e\n\u003ch4 id=\"ch9-s47\"\u003e分级\u003c/h4\u003e\n\u003cp\u003e表9-3\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e级别\u003c/th\u003e\u003cth\u003e严重程度\u003c/th\u003e\u003cth\u003e体征\u003c/th\u003e\u003cth\u003e功能\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI级\u003c/td\u003e\u003ctd\u003e轻度\u003c/td\u003e\u003ctd\u003e轻度疼痛/酸痛，微量肿胀\u003c/td\u003e\u003ctd\u003e肌力正常\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eII级\u003c/td\u003e\u003ctd\u003e中度\u003c/td\u003e\u003ctd\u003e疼痛肿胀更严重，ROM↓\u003c/td\u003e\u003ctd\u003e肌力↓，可能跛行\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIII级\u003c/td\u003e\u003ctd\u003e重度\u003c/td\u003e\u003ctd\u003e肌肉完全撕裂，&quot;撕裂/断裂&quot;感，明显变形\u003c/td\u003e\u003ctd\u003e功能丧失\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e● III级拉伤在老年人中更常见（胶原组织失去弹性）\u003c/p\u003e\n\u003cp\u003e● 愈合时间取决于严重程度；轻度损伤愈合各阶段可持续数日至数周；III级可能需要外科干涉\u003c/p\u003e\n\u003cp\u003e● 随年龄增长，即使轻度拉伤也需更长时间愈合\u003c/p\u003e\n\u003ch4 id=\"ch9-s52\"\u003e1.2 韧带扭伤（Sprain）\u003c/h4\u003e\n\u003cp\u003e图9-1\u003c/p\u003e\n\u003ch4 id=\"ch9-s54\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 外力将韧带拉伸至损伤点（接触性或非接触性）\u003c/p\u003e\n\u003cp\u003e● ACL撕裂机制：膝关节过伸和/或扭伤\u003c/p\u003e\n\u003cp\u003e● 接触性：如橄榄球中膝前侧和外侧的撞击产生剪切力\u003c/p\u003e\n\u003cp\u003e● 非接触性：如篮球中踩硬地面同时突然切球和扭动\u003c/p\u003e\n\u003cp\u003e● 包含全方位力量和稳定性训练可降低非接触性损伤风险\u003c/p\u003e\n\u003ch4 id=\"ch9-s60\"\u003e分级\u003c/h4\u003e\n\u003cp\u003e表9-4\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e级别\u003c/th\u003e\u003cth\u003e身体检查\u003c/th\u003e\u003cth\u003e功能损伤\u003c/th\u003e\u003cth\u003e病理\u003c/th\u003e\u003cth\u003e急性护理\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI级\u003c/td\u003e\u003ctd\u003e轻微触痛/肿胀\u003c/td\u003e\u003ctd\u003e轻微\u003c/td\u003e\u003ctd\u003e胶原纤维微观撕裂\u003c/td\u003e\u003ctd\u003eRICE\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eII级\u003c/td\u003e\u003ctd\u003e中度触痛/肿胀，ROM↓，可能不稳定\u003c/td\u003e\u003ctd\u003e中度\u003c/td\u003e\u003ctd\u003e部分胶原纤维完全撕裂\u003c/td\u003e\u003ctd\u003eRICE+医生评估\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIII级\u003c/td\u003e\u003ctd\u003e明显肿胀/触痛/不稳定\u003c/td\u003e\u003ctd\u003e重度\u003c/td\u003e\u003ctd\u003e韧带完全撕裂/破裂\u003c/td\u003e\u003ctd\u003e空气夹板+RICE+立即就医\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e● 客户可能报告听到&quot;砰砰&quot;声后随即出现疼痛和肿胀\u003c/p\u003e\n\u003cp\u003e● II级扭伤出现不稳定、ROM下降和功能丧失\u003c/p\u003e\n\u003ch4 id=\"ch9-s64\"\u003e1.3 软骨损伤\u003c/h4\u003e\n\u003cp\u003e图9-2\u003c/p\u003e\n\u003ch4 id=\"ch9-s66\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 关节受压迫+剪切力→软骨撕裂\u003c/p\u003e\n\u003cp\u003e● 膝关节最易发生（负重+活动自由度大）\u003c/p\u003e\n\u003cp\u003e● 年长者关节软骨已退化，较小的力即可撕裂\u003c/p\u003e\n\u003cp\u003e● 大部分软骨无血管→无法自行愈合，常需手术取出撕裂碎片\u003c/p\u003e\n\u003cp\u003e● 例外：半月板外侧1/3血管丰富，可手术修复（需较长术后零负重状态）\u003c/p\u003e\n\u003cp\u003e症状：关节僵硬、咔嗒/砰砰声、腿软、伸直受限、关节闭锁、疼痛肿胀、肌肉无力\u003c/p\u003e\n\u003ch4 id=\"ch9-s73\"\u003e1.4 骨折\u003c/h4\u003e\n\u003cp\u003e图9-3\u003c/p\u003e\n\u003ch4 id=\"ch9-s75\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 压迫力（如伸直腿踩硬表面）、扭力或直接撞击导致\u003c/p\u003e\n\u003cp\u003e● 骨质疏松/骨癌/感染/放疗/骨量差者风险更高\u003c/p\u003e\n\u003cp\u003e体征：喀嚓声、变形、肿胀、淤青、疼痛触痛\u003c/p\u003e\n\u003ch4 id=\"ch9-s79\"\u003e紧急处理\u003c/h4\u003e\n\u003cp\u003e● 防止骨骼和软组织进一步受伤，必要时急救应对休克\u003c/p\u003e\n\u003cp\u003e● 怀疑骨折应立即启动EMS，控制环境让客户静卧休息\u003c/p\u003e\n\u003cp\u003e● 冰敷可能加剧疼痛\u003c/p\u003e\n\u003cp\u003e● 仅在偏远地区EMS无法到场时，才用急救技能夹住/固定骨折肢\u003c/p\u003e\n\u003ch4 id=\"ch9-s84\"\u003e应力性骨折\u003c/h4\u003e\n\u003cp\u003e● 骨形成/吸收失衡→反复应力→骨头不足以承受压迫力\u003c/p\u003e\n\u003cp\u003e● 所有骨头均可发生，股骨颈时有发生，胫骨最常见（常被误认为外胫夹）\u003c/p\u003e\n\u003cp\u003e● 长跑运动员高风险（骨量未及调整即增加里程）\u003c/p\u003e\n\u003cp\u003e● 特征：骨头某点触痛，疼痛局部且渐进，负重时加重；某些情况下静息/睡觉时也会酸痛，甚至局部肿胀\u003c/p\u003e\n\u003cp\u003e● 继续活动→加重→完全骨折风险\u003c/p\u003e\n\u003cp\u003e● 骨癌症状可能与应力性骨折相似，尽早诊断很重要\u003c/p\u003e\n\u003ch4 id=\"ch9-s91\"\u003e1.5 脑震荡\u003c/h4\u003e\n\u003cp\u003e图9-4\u003c/p\u003e\n\u003ch4 id=\"ch9-s93\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 脑损伤导致精神状态改变（接触性运动、交通事故、跌倒或撞击均可引起）\u003c/p\u003e\n\u003cp\u003e● 可能伴随或没有短暂性意识丧失\u003c/p\u003e\n\u003ch4 id=\"ch9-s96\"\u003e体征\u003c/h4\u003e\n\u003cp\u003e● 精神错乱、定向障碍、记忆丧失（重复提问、无法认人/识别地点）\u003c/p\u003e\n\u003cp\u003e● 言语迟钝/不清、动作不协调、头疼、恶心呕吐\u003c/p\u003e\n\u003cp\u003e● 警觉性降低、平衡感下降、眩晕、惊厥、四肢麻木/失去知觉\u003c/p\u003e\n\u003ch4 id=\"ch9-s100\"\u003e关键风险\u003c/h4\u003e\n\u003cp\u003e● 脑震荡后脑部极脆弱→二次损伤可导致二次撞击综合征（危及生命）\u003c/p\u003e\n\u003cp\u003e● 必须立即停止活动\u003c/p\u003e\n\u003cp\u003e● 获有头部损伤治疗经验的合格医疗保健专业人员书面许可前，禁止任何活动\u003c/p\u003e\n\u003cp\u003e● 许可同时应提供书面活动恢复方案；恢复要循序渐进，私人教练需格外小心防症状复发\u003c/p\u003e\n\u003ch4 id=\"ch9-s105\"\u003e1.6 椎间盘损伤\u003c/h4\u003e\n\u003cp\u003e图9-5\u003c/p\u003e\n\u003ch4 id=\"ch9-s107\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 椎间盘位于两椎骨之间，起减震、支撑和稳定作用，由胶原组成\u003c/p\u003e\n\u003cp\u003e● 压迫+剪切力→纤维环层撕裂→髓核胶状液渗漏→外层形成肿块\u003c/p\u003e\n\u003cp\u003e● 膨胀的外层压迫神经或卡在椎骨间→沿神经走向牵涉痛/剧烈疼痛\u003c/p\u003e\n\u003cp\u003e● Valsalva动作增加受伤风险（打喷嚏/咳嗽同理）\u003c/p\u003e\n\u003cp\u003e● 常见于腰椎\u003c/p\u003e\n\u003ch4 id=\"ch9-s113\"\u003e症状\u003c/h4\u003e\n\u003cp\u003e● 可能出现坐骨神经痛或其他神经根病体征\u003c/p\u003e\n\u003cp\u003e● 沿受累神经走向剧烈刺痛、麻木和/或痛感，可能延伸至足部\u003c/p\u003e\n\u003cp\u003e处理：冰敷缓解疼痛，但需立即就医；客户可能疼到不能走路，需联系EMS转运至急诊室\u003c/p\u003e\n\u003ch3 id=\"ch9-s117\"\u003e二、过度使用症\u003c/h3\u003e\n\u003ch4 id=\"ch9-s118\"\u003e2.1 肌腱炎/滑囊炎/筋膜炎\u003c/h4\u003e\n\u003cp\u003e表9-5\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e病症\u003c/th\u003e\u003cth\u003e定义\u003c/th\u003e\u003cth\u003e成因\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌腱炎\u003c/td\u003e\u003ctd\u003e肌腱炎症（-itis = 炎症）\u003c/td\u003e\u003ctd\u003e过度使用；急性→可转为慢性\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e滑囊炎\u003c/td\u003e\u003ctd\u003e滑囊发炎\u003c/td\u003e\u003ctd\u003e急性外伤有时引起；更多是反复应力/肌肉失衡/肌紧张\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e筋膜炎\u003c/td\u003e\u003ctd\u003e结缔组织（筋膜）发炎\u003c/td\u003e\u003ctd\u003e常见：足底筋膜炎、IT束摩擦综合征\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e● 急性肌腱炎 = 处于损伤愈合炎症阶段的肌腱炎\u003c/p\u003e\n\u003cp\u003e● 处理不当均可转为慢性\u003c/p\u003e\n\u003ch4 id=\"ch9-s122\"\u003e2.2 应力性骨折\u003c/h4\u003e\n\u003cp\u003e图9-6\u003c/p\u003e\n\u003cp\u003e● 骨形成/吸收失衡处发生\u003c/p\u003e\n\u003cp\u003e● 长跑运动员高风险（骨量未及调整即增加里程）\u003c/p\u003e\n\u003cp\u003e● 胫骨最常见，常被误认为外胫夹\u003c/p\u003e\n\u003cp\u003e● 关键鉴别：应力性骨折为骨头某点触痛，疼痛局部、渐进、负重加重\u003c/p\u003e\n\u003cp\u003e● 某些情况下静息/睡觉时酸痛，甚至局部肿胀\u003c/p\u003e\n\u003cp\u003e● 继续活动→症状加重→完全骨折风险\u003c/p\u003e\n\u003cp\u003e● 需转介给医生诊断和治疗（骨癌症状可能类似，需排除）\u003c/p\u003e\n\u003ch3 id=\"ch9-s131\"\u003e三、上肢病症\u003c/h3\u003e\n\u003ch4 id=\"ch9-s132\"\u003e3.1 肩部——肩峰撞击综合征/肩袖损伤\u003c/h4\u003e\n\u003cp\u003e图9-7\u003c/p\u003e\n\u003ch4 id=\"ch9-s134\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 肩关节窝浅→骨稳定性差，靠盂唇+韧带+肩袖加固\u003c/p\u003e\n\u003cp\u003e● 肌肉力量/稳定性不足 + 不良姿势（圆肩/胸椎后凸）→肩胛骨偏离（偏向上侧和前侧）→肩峰下间隙变窄\u003c/p\u003e\n\u003cp\u003e● 冈上肌腱鞘+肩峰下滑囊被压迫→肩峰撞击综合征\u003c/p\u003e\n\u003cp\u003e● 可伴肱二头肌长头肌腱炎\u003c/p\u003e\n\u003cp\u003e● 肩袖弹性↓→肩袖撕裂（发生率随年龄↑）\u003c/p\u003e\n\u003cp\u003e● 肩袖肌肉作用：在过头运动中降低肱骨向前速度并稳定肱骨在关节窝中\u003c/p\u003e\n\u003cp\u003e● 多数人其他软组织可代偿→即使全层肩袖撕裂也可选择保守治疗和物理疗法而非手术\u003c/p\u003e\n\u003ch4 id=\"ch9-s142\"\u003e课程设计四步法\u003c/h4\u003e\n\u003cp\u003e1. 解决不良姿势（圆肩/脊柱后凸）→伸展肩部前侧和前胸（抑制过度活跃肌肉，可在热身时完成）\u003c/p\u003e\n\u003cp\u003e2. 强化肩胛骨稳定肌（下斜方肌、中斜方肌、前锯肌）+肩袖\u003c/p\u003e\n\u003cp\u003e3. 通过受控前推动作改善肩前肌肉和胸大肌\u003c/p\u003e\n\u003cp\u003e4. 最后引入过头运动（在肩胛面——额状面前30°完成，防撞击/挤压）\u003c/p\u003e\n\u003ch4 id=\"ch9-s147\"\u003e关键动作\u003c/h4\u003e\n\u003cp\u003e● 坐姿划船（强化肩胛稳定肌）\u003c/p\u003e\n\u003cp\u003e● 前锯肌推举\u003c/p\u003e\n\u003cp\u003e● 鸟狗式（闭链负重训练，激活肩袖而不使组织恶化）\u003c/p\u003e\n\u003cp\u003e● 农夫行走（开链训练，激活肩袖）\u003c/p\u003e\n\u003ch4 id=\"ch9-s152\"\u003e注意事项\u003c/h4\u003e\n\u003cp\u003e● 应避免需要举过头的训练（稳定性和力量需求超出受损肩关节能力）\u003c/p\u003e\n\u003cp\u003e● 过头动作使肱骨头与肩峰接触更紧密，增加撞击风险\u003c/p\u003e\n\u003cp\u003e● 上半身整体力量、稳定性和ROM训练应纳入常规项目，预防疼痛和功能丧失\u003c/p\u003e\n\u003ch4 id=\"ch9-s156\"\u003e3.2 肘、腕和手\u003c/h4\u003e\n\u003ch4 id=\"ch9-s157\"\u003e背景\u003c/h4\u003e\n\u003cp\u003e● 工作及休闲中长期使用鼠标和键盘→过度使用损伤日渐增多\u003c/p\u003e\n\u003cp\u003e● 归咎于长时间静负荷及不恰当的办公设置\u003c/p\u003e\n\u003ch4 id=\"ch9-s160\"\u003e3.2.1外上髁炎（网球肘）\u003c/h4\u003e\n\u003cp\u003e图9-8\u003c/p\u003e\n\u003cp\u003e● 肱骨外上髁起点附近→腕伸肌肌腱过度使用或反复外伤性损伤\u003c/p\u003e\n\u003cp\u003e● 30-55岁成年人常见\u003c/p\u003e\n\u003ch4 id=\"ch9-s164\"\u003e3.2.2内上髁炎（高尔夫球肘）\u003c/h4\u003e\n\u003cp\u003e图9-9\u003c/p\u003e\n\u003cp\u003e● 肱骨内上髁→腕屈肌肌腱在起始处附近的过度使用或反复外伤性损伤\u003c/p\u003e\n\u003cp\u003e● 30-55岁成年人常见\u003c/p\u003e\n\u003ch4 id=\"ch9-s168\"\u003e3.2.3腕管综合征\u003c/h4\u003e\n\u003cp\u003e图9-10\u003c/p\u003e\n\u003cp\u003e● 屈肌支持带下肌腱发炎→腕骨和屈肌支持带之间狭小间隙内炎症刺痛腕管→压迫正中神经→疼痛和麻木\u003c/p\u003e\n\u003cp\u003e● 建议客户向人力资源部申请工作环境的人体工程学评估\u003c/p\u003e\n\u003ch4 id=\"ch9-s172\"\u003e课程设计注意事项\u003c/h4\u003e\n\u003cp\u003e● 肌腱发炎时应避免增加压力，消除所有可导致疼痛或不适的因素\u003c/p\u003e\n\u003cp\u003e● 需要腕部屈曲、伸展或握紧的训练需进行调整\u003c/p\u003e\n\u003cp\u003e● 腕管综合征适用与肘腱炎相同的注意事项\u003c/p\u003e\n\u003cp\u003e● 训练时使用夹板或矫形器可能有益（尤其持续疼痛的客户），但需由医生定夺\u003c/p\u003e\n\u003cp\u003e● 运动时应穿戴医生推荐和指定的手腕托，并遵从指导\u003c/p\u003e\n\u003ch4 id=\"ch9-s178\"\u003e课程设计四步法\u003c/h4\u003e\n\u003cp\u003e1. 预防过度使用：牵引训练时引入多种手柄增加舒适感，和/或戴手套增加手与手柄/器械之间的摩擦力（减轻受损组织负荷）\u003c/p\u003e\n\u003cp\u003e2. 在各运动平面上缓慢拉伸，增加ROM\u003c/p\u003e\n\u003cp\u003e3. 通过训练改善腕部和手部力量（如俯卧撑、腕部屈伸）\u003c/p\u003e\n\u003cp\u003e4. 取下手柄或手套，在耐受范围内逐步增加牵引训练重量\u003c/p\u003e\n\u003ch4 id=\"ch9-s183\"\u003e3.3 肘/腕/手病症关键记忆点\u003c/h4\u003e\n\u003cp\u003e● 网球肘 = 外上髁 + 伸肌肌腱；高尔夫球肘 = 内上髁 + 屈肌肌腱\u003c/p\u003e\n\u003cp\u003e● 腕管综合征 = 正中神经受压→疼痛麻木；需人体工程学评估\u003c/p\u003e\n\u003cp\u003e● 训练调整：多种手柄/手套/腕带减少握力需求\u003c/p\u003e\n\u003cp\u003e● 调整使腕部处于中间位置的训练项目（如正手窄握支撑架做俯卧撑）\u003c/p\u003e\n\u003ch3 id=\"ch9-s188\"\u003e四、脊柱病症\u003c/h3\u003e\n\u003ch4 id=\"ch9-s189\"\u003e4.1 颈部\u003c/h4\u003e\n\u003cp\u003e图9-11\u003c/p\u003e\n\u003ch4 id=\"ch9-s191\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 胸椎后凸加重→头部前倾姿势→颈部肌肉异常压力\u003c/p\u003e\n\u003cp\u003e● 脊柱通过骨性凸起物和软组织连接→任一位置错位引起连锁反应\u003c/p\u003e\n\u003cp\u003e● 示例：右侧腰骶段的竖脊肌（ace课本为这个骶竖肌，但不符合解剖学规范用语，特此标注。）紧张→右外侧屈曲→右肩抬高→左侧颈痛\u003c/p\u003e\n\u003cp\u003e● 解决动力链全段缩短的组织，不只是患处\u003c/p\u003e\n\u003cp\u003e● 单独强化颈部肌肉不应作为训练课程目标\u003c/p\u003e\n\u003ch4 id=\"ch9-s197\"\u003e课程设计步骤\u003c/h4\u003e\n\u003cp\u003e1. 观察颈部相对胸椎和肩部位置→先矫正脊柱和肩部（圆肩和脊柱后凸尤其常见）\u003c/p\u003e\n\u003cp\u003e2. 教授柔和动作和拉伸（侧向拉伸、旋转拉伸）→客户感到不适时可随时进行\u003c/p\u003e\n\u003cp\u003e3. 疼痛严重或持续→转介给医生\u003c/p\u003e\n\u003ch4 id=\"ch9-s201\"\u003e4.2 下背部\u003c/h4\u003e\n\u003cp\u003e图9-12\u003c/p\u003e\n\u003ch4 id=\"ch9-s203\"\u003e核心机制\u003c/h4\u003e\n\u003cp\u003e● 80%成人会出现下背部疼痛，30%转为慢性\u003c/p\u003e\n\u003cp\u003e● 最常见于30-50岁人群；主要致残原因之一\u003c/p\u003e\n\u003cp\u003e● 常见原因：肌肉拉伤、长期静态姿势不良引起的软组织应激、身体素质差、椎间盘疾病、骨关节炎、类风湿性关节炎、强直性脊柱炎、癌症\u003c/p\u003e\n\u003cp\u003e● 明显脊柱前凸→腰骶段的竖脊肌（ace课本为这个骶竖肌，但不符合解剖学规范用语，特此标注。）+髋屈肌紧张+后侧链无力→下背部僵硬/疼痛\u003c/p\u003e\n\u003cp\u003e● 髋部灵活性不足→腰椎ROM代偿性增加（腰椎应保持不动）\u003c/p\u003e\n\u003cp\u003e● 竖脊肌是稳定肌，不是强大伸肌；臀肌和腘绳肌才是真正的髋伸肌\u003c/p\u003e\n\u003cp\u003e● 椎间盘损伤常发生在腰椎→可能出现坐骨神经痛/神经根病\u003c/p\u003e\n\u003ch4 id=\"ch9-s211\"\u003e关键肌肉对躯干/骨盆稳定性的作用\u003c/h4\u003e\n\u003cp\u003e表9-6\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e肌群\u003c/th\u003e\u003cth\u003e功能\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e臀大肌\u003c/td\u003e\u003ctd\u003e髋伸肌；支撑骨盆和躯干稳定；保持正确骨盆位置\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腘绳肌\u003c/td\u003e\u003ctd\u003e髋伸肌；支撑骨盆和躯干稳定；紧张时抑制髋铰链→骨盆后倾\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腹直肌\u003c/td\u003e\u003ctd\u003e稳定躯干；保持正确骨盆位置\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腹内/外斜肌\u003c/td\u003e\u003ctd\u003e稳定躯干；保持正确骨盆位置\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e背阔肌\u003c/td\u003e\u003ctd\u003e附着胸腰筋膜→为腰椎提供稳定性\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e髋屈肌\u003c/td\u003e\u003ctd\u003e紧张时抑制髋铰链→骨盆前倾\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e髋内旋肌\u003c/td\u003e\u003ctd\u003e紧张时抑制髋铰链→骨盆前倾\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e髋外旋肌\u003c/td\u003e\u003ctd\u003e紧张时抑制髋铰链→骨盆后倾\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003ch4 id=\"ch9-s213\"\u003e课程设计四步法\u003c/h4\u003e\n\u003cp\u003e1. 纠正左右侧不平衡\u003c/p\u003e\n\u003cp\u003e2. 纠正前倾/后倾不良姿势（骨盆前倾或后倾）\u003c/p\u003e\n\u003cp\u003e3. 增加髋关节功能性内/外旋程度（如伐木训练向下=内旋，向上=外旋）\u003c/p\u003e\n\u003cp\u003e4. 强化后侧链肌群（尤其腘绳肌和臀肌）\u003c/p\u003e\n\u003cp\u003e日常脊柱稳定训练（每天都进行最有效）\u003c/p\u003e\n\u003cp\u003e● 猫牛式：有节律动作改善柔韧性并给组织热身；是动作训练非拉伸，重点在动作而非推到极限；猫式呼气，牛式吸气，中立位换气\u003c/p\u003e\n\u003cp\u003e● 改良式卷腹：保持腰椎中立位（手/毛巾垫于腰下）；一只膝弯一只腿伸直，锁定骨盆-腰椎位置；中间点交替弯曲腿\u003c/p\u003e\n\u003cp\u003e● 鸟狗式：双手对肩、双膝对髋→找到脊柱中立位→腹 muscles 保持稳定→对侧手臂和腿同时抬起→每侧保持5-8秒改善肌肉耐力\u003c/p\u003e\n\u003cp\u003e● 侧桥：腰方肌和腹部斜肌实现最佳稳定性；初级=肘+膝支撑→进阶=肘+脚支撑；维持颈部和脊柱中立位；每侧保持5-8秒\u003c/p\u003e\n\u003cp\u003e● 下背部训练：耐力优先于力量（慢缩姿势肌有保护作用）\u003c/p\u003e\n\u003cp\u003e● 重复低难度动作增强姿势耐力和力量\u003c/p\u003e\n\u003ch4 id=\"ch9-s225\"\u003e下蹲动作要点\u003c/h4\u003e\n\u003cp\u003e● 下蹲是ADL中必要的动作模式（坐椅子、进出车辆、使用马桶）\u003c/p\u003e\n\u003cp\u003e● 常见缺陷：髋关节铰链协调性缺乏+后侧链肌群力量缺乏→膝盖向前超过脚趾→膝关节疼痛+下背部承受不必要压力\u003c/p\u003e\n\u003cp\u003e● 调整方案：\u003c/p\u003e\n\u003cp\u003e● 椅式（适合稳定性/力量/ROM不佳者）：握住固定物站在箱子/长凳前，向后向下坐；先屈髋再屈膝，双脚紧踩地面；可垫高座位降低难度；增大难度时减少手臂借力/降低箱子高度\u003c/p\u003e\n\u003cp\u003e● 自重深蹲（适合稳定性/力量/ROM尚可者）：侧重正确髋铰链和膝关节对齐；出现膝外翻时提醒向地面用力激活稳定肌\u003c/p\u003e\n\u003cp\u003e● 弹力带深蹲（适合准备增加后侧链力量但未准备杠铃/哑铃深蹲者）：弹力带抵消部分体重提供支撑；全程需后侧链和脊柱稳定肌对抗向前拉力\u003c/p\u003e\n\u003ch3 id=\"ch9-s232\"\u003e五、下肢病症\u003c/h3\u003e\n\u003ch4 id=\"ch9-s233\"\u003e5.1 髋关节\u003c/h4\u003e\n\u003ch4 id=\"ch9-s234\"\u003e背景\u003c/h4\u003e\n\u003cp\u003e● 球窝关节，可进行多方向运动；髋臼是较深的骨性关节窝\u003c/p\u003e\n\u003cp\u003e● ROM有限，与关节囊和肌肉结构一起产生显著稳定性\u003c/p\u003e\n\u003cp\u003e● 久坐使髋部前侧肌肉缩短、后侧拉长→影响关节铰链能力\u003c/p\u003e\n\u003cp\u003e● 功能障碍可能上移至下背部或下移至膝部\u003c/p\u003e\n\u003ch4 id=\"ch9-s239\"\u003e梨状肌综合征\u003c/h4\u003e\n\u003cp\u003e图9-13\u003c/p\u003e\n\u003cp\u003e● 梨状肌发紧/紧绷/发炎→压迫穿过梨状肌的坐骨神经和孖肌→类似腰椎间盘损伤的神经根病症状\u003c/p\u003e\n\u003cp\u003e● 22%人群坐骨神经隔断（穿过）梨状肌→更易患病\u003c/p\u003e\n\u003cp\u003e● 至少6%&quot;下背痛&quot;患者实际为梨状肌综合征\u003c/p\u003e\n\u003cp\u003e● 梨状肌作用：步行中充当髋外旋肌，稳定股骨头\u003c/p\u003e\n\u003cp\u003e● 评估要点：关注髂脊高度→评估骨盆位置及与股骨相对位置\u003c/p\u003e\n\u003cp\u003e● 示例：左侧骨盆高→左侧股骨相对骨盆内收+内旋→左侧肌肉被拉紧（IT束、外旋肌群、臀大肌）→坐骨神经受压\u003c/p\u003e\n\u003cp\u003e● 课程设计：平衡左右骨盆位置（紧张侧静态拉伸+紧绷侧强化）+髋关节闭链内外旋训练（改善灵活性和稳定性）\u003c/p\u003e\n\u003ch4 id=\"ch9-s248\"\u003e髋关节炎/髋关节置换术\u003c/h4\u003e\n\u003cp\u003e● 关节炎：慢性疾病，关节疼痛和发炎\u003c/p\u003e\n\u003cp\u003e● 稳定性和强化训练可改善动作，提高ADL效率\u003c/p\u003e\n\u003cp\u003e● 保守治疗失败可建议髋关节置换术/全髋关节成形术\u003c/p\u003e\n\u003cp\u003e● 术后前几个月接受常规理疗；理疗结束后ROM可能与非手术侧不等\u003c/p\u003e\n\u003cp\u003e● 卧式自行车：改善心肺+ROM+股四头肌力量（优于固定式自行车，屈曲程度更大，更好挑战ROM）\u003c/p\u003e\n\u003cp\u003e● 固定式自行车：屈曲程度较小，适合努力恢复ROM的客户\u003c/p\u003e\n\u003cp\u003e● 柔和拉伸和动态ROM练习可鼓励进行，但期望须符合实际\u003c/p\u003e\n\u003ch4 id=\"ch9-s256\"\u003e髋关节课程设计四步法\u003c/h4\u003e\n\u003cp\u003e1. 纠正左右侧不平衡\u003c/p\u003e\n\u003cp\u003e2. 改善髋关节内/外旋ROM+单脚站立稳定性\u003c/p\u003e\n\u003cp\u003e3. 改善髋关节铰链灵活性和稳定性\u003c/p\u003e\n\u003cp\u003e4. 改善后侧链肌群力量\u003c/p\u003e\n\u003cp\u003e注意：每一侧训练和伸展不同——一侧紧张肌肉做伸展，对侧较弱肌肉做强化；尽早在锻炼中加入静态拉伸（简单热身后），抑制紧张肌肉、增加ROM\u003c/p\u003e\n\u003ch4 id=\"ch9-s262\"\u003e5.2 膝部\u003c/h4\u003e\n\u003ch4 id=\"ch9-s263\"\u003e背景\u003c/h4\u003e\n\u003cp\u003e● 典型铰链式关节，但有2-3度旋转；由强健韧带和筋膜支撑，灵活性高（可弯曲至130°）\u003c/p\u003e\n\u003cp\u003e● 唯一穿过膝关节的肌腹是腘肌；其他移动/固定膝关节的肌肉以肌腱形式穿过\u003c/p\u003e\n\u003cp\u003e● 软骨损害和韧带扭伤常见\u003c/p\u003e\n\u003ch4 id=\"ch9-s267\"\u003e5.2.1髂胫束（IT束）摩擦综合征\u003c/h4\u003e\n\u003cp\u003e图9-14\u003c/p\u003e\n\u003cp\u003e● IT束远端与股骨外侧上髁反复摩擦→膝外侧烧灼/刺痛（剧痛或刺痛）\u003c/p\u003e\n\u003cp\u003e● 15-50岁活跃人群常见（跑步者、骑行者、排球/举重运动员）\u003c/p\u003e\n\u003cp\u003e● 风险因素：过度使用、装备不当/鞋子不合脚、跑步平面改变、肌力失衡（无力或紧张）、结构异常（扁平足、膝外翻、下肢不等长）\u003c/p\u003e\n\u003cp\u003e● 骨盆失衡→IT束紧绷→增加与股骨外侧上髁接触\u003c/p\u003e\n\u003cp\u003e● 左侧骨盆高→左侧IT束紧绷\u003c/p\u003e\n\u003cp\u003e● 右侧阔筋膜张肌紧张→也可增加IT束与股骨外侧上髁接触\u003c/p\u003e\n\u003cp\u003e● 课程设计：紧张侧自我肌筋膜放松+静态伸展→纠正骨盆失衡→增加ROM和纠正左/右侧失衡\u003c/p\u003e\n\u003ch4 id=\"ch9-s276\"\u003e5.2.2膝部肌腱炎\u003c/h4\u003e\n\u003cp\u003e图9-15\u003c/p\u003e\n\u003cp\u003e● 常见部位：髌腱、鹅足腱、股四头肌腱\u003c/p\u003e\n\u003cp\u003e● 跑步/上下楼梯/下蹲时疼痛\u003c/p\u003e\n\u003cp\u003e● 存在膝关节功能障碍时，关注髋关节、踝关节和足部（膝关节依赖临近关节保持稳定和缓冲地面反作用力）\u003c/p\u003e\n\u003cp\u003e● 足部旋前/旋后静态姿势评估→发现失衡→立即选择适当训练强化ROM或增强训练\u003c/p\u003e\n\u003cp\u003e● 髌骨肌腱炎时：四头肌很可能紧张→增加髌骨与股骨髁间压力→自我肌筋膜放松+伸展解决\u003c/p\u003e\n\u003cp\u003e● 肌肉训练侧重后侧链力量恢复（腓肠肌、腘绳肌、臀肌）\u003c/p\u003e\n\u003cp\u003e● 与客户保持沟通疼痛等级，疼痛限制时停止训练\u003c/p\u003e\n\u003ch4 id=\"ch9-s285\"\u003e5.2.3髌股疼痛综合征（PFPS）\u003c/h4\u003e\n\u003cp\u003e图9-16\u003c/p\u003e\n\u003cp\u003e● 过度使用+生物力学改变+肌肉功能障碍→髌骨轨迹异常→软骨磨损→髌骨软骨软化\u003c/p\u003e\n\u003cp\u003e● 关键机制：膝关节屈曲时股骨内旋失控（膝外翻/X形腿）或IT束紧张将髌骨拉出滑车沟\u003c/p\u003e\n\u003cp\u003e● 下楼/下坡时疼痛加剧\u003c/p\u003e\n\u003cp\u003e● 生物力学异常因素：\u003c/p\u003e\n\u003cp\u003e● 扁平足→改变膝关节排列→胫骨/股骨代偿性内旋→改变髌股关节动力学\u003c/p\u003e\n\u003cp\u003e● IT束紧张→通过筋膜对髌骨产生过度横向力\u003c/p\u003e\n\u003cp\u003e● 腓肠肌/比目鱼肌紧张→代偿性内转+过度后向力→髌股关节压力↑\u003c/p\u003e\n\u003cp\u003e● 相关肌无力：\u003c/p\u003e\n\u003cp\u003e● 髋外展肌和外旋肌无力→活动时股骨内旋+膝外翻→髌股轨迹异常\u003c/p\u003e\n\u003cp\u003e● 需要四头肌减缓膝关节屈曲的活动（下楼梯、步行跑下坡）时，髌骨和股骨间隙变窄→疼痛加剧\u003c/p\u003e\n\u003cp\u003e● 课程设计四步法：\u003c/p\u003e\n\u003cp\u003e1. 纠正左右侧不平衡\u003c/p\u003e\n\u003cp\u003e2. 解决髋部/踝部/足部肌紧张和不稳定（防止股骨内旋）\u003c/p\u003e\n\u003cp\u003e3. 改善髋关节铰链灵活性和稳定性\u003c/p\u003e\n\u003cp\u003e4. 改善后侧链肌群力量\u003c/p\u003e\n\u003cp\u003e● 注意：开链膝关节伸展（坐位膝关节伸展）对单膝疼痛者应避开→选择负重闭链训练\u003c/p\u003e\n\u003ch4 id=\"ch9-s303\"\u003e膝关节炎/膝关节置换术\u003c/h4\u003e\n\u003cp\u003e● 稳定性和强化训练可改善动作，提高ADL效率\u003c/p\u003e\n\u003cp\u003e● 保守治疗失败可建议膝关节置换术/全膝关节成形术\u003c/p\u003e\n\u003cp\u003e● 术后四头肌强化很重要，自行车训练课程有帮助\u003c/p\u003e\n\u003cp\u003e● 全膝关节ROM可能无法完全恢复\u003c/p\u003e\n\u003cp\u003e● 下蹲是重要运动模式，但膝关节ROM可能限制下蹲深度；掌握正确髋铰链节奏后，直腿硬拉可增加后侧链力量\u003c/p\u003e\n\u003ch4 id=\"ch9-s309\"\u003e膝关节课程设计四步法\u003c/h4\u003e\n\u003cp\u003e1. 纠正左右侧不平衡\u003c/p\u003e\n\u003cp\u003e2. 解决髋部/踝部/足部可能造成股骨内旋的肌紧张和不稳定\u003c/p\u003e\n\u003cp\u003e3. 改善髋关节铰链灵活性和稳定性\u003c/p\u003e\n\u003cp\u003e4. 改善后侧链肌群力量\u003c/p\u003e\n\u003cp\u003e共同注意：每一侧训练和伸展不同；尽早加入静态拉伸增加ROM\u003c/p\u003e\n\u003ch4 id=\"ch9-s315\"\u003e5.3 脚踝和小腿\u003c/h4\u003e\n\u003ch4 id=\"ch9-s316\"\u003e5.3.1外胫夹（胫骨内侧压力症候群 MTSS / 前外胫夹）\u003c/h4\u003e\n\u003cp\u003e图9-17\u003c/p\u003e\n\u003cp\u003e● &quot;外胫夹&quot;是描述劳力性小腿疼痛的一般术语\u003c/p\u003e\n\u003cp\u003e● MTSS（后外胫夹）= 骨膜炎（骨膜炎症），影响腿部后关节腔肌肉（胫骨后肌、趾长屈肌、拇长屈肌和腘肌）\u003c/p\u003e\n\u003cp\u003e● 活跃人群的过劳性损伤，运动诱发性疾病，往往由活动突然变化引起\u003c/p\u003e\n\u003cp\u003e● 跑步者、舞蹈员和军人的常见损伤\u003c/p\u003e\n\u003cp\u003e● 前外胫夹 = 前关节腔肌肉受累（胫骨前肌、趾长伸肌、拇长伸肌及筋膜和骨膜内层）\u003c/p\u003e\n\u003cp\u003e● 与劳力性活动有关，病因尚未完全掌握\u003c/p\u003e\n\u003cp\u003e● 与应力性骨折鉴别：外胫夹不需要彻底静休，调整训练课程即可\u003c/p\u003e\n\u003cp\u003e● 课程设计调整：\u003c/p\u003e\n\u003cp\u003e● 提供低冲击力/低里程数项目+交叉训练备选（如停止跑步→改为骑行和游泳）\u003c/p\u003e\n\u003cp\u003e● 各部位有时间休息和愈合\u003c/p\u003e\n\u003cp\u003e● 逐步引入完整动作而不引起症状复发\u003c/p\u003e\n\u003cp\u003e● 小腿肌群（尤其比目鱼肌）无痛拉伸可有效缓解MTSS症状\u003c/p\u003e\n\u003cp\u003e● 静态姿势和动态评估→发现足部/踝关节错位或不稳定→恢复运动需改善足部和踝关节柔韧性和稳定性\u003c/p\u003e\n\u003ch4 id=\"ch9-s331\"\u003e5.3.2脚踝扭伤\u003c/h4\u003e\n\u003cp\u003e图9-18\u003c/p\u003e\n\u003cp\u003e● 每年影响200万美国人（运动和高度活跃人群仅占一半）\u003c/p\u003e\n\u003cp\u003e● 外侧/内翻性扭伤最常见（约75%）→距腓前韧带、跟腓韧带、距腓后韧带\u003c/p\u003e\n\u003cp\u003e● 机制：过度跖屈+内翻\u003c/p\u003e\n\u003cp\u003e● 70%外侧扭伤导致反复性扭伤和慢性症状\u003c/p\u003e\n\u003cp\u003e● 内侧/外翻性少见（外侧腓骨头加固）；内侧三角肌韧带最常受累，损伤常需排除骨折\u003c/p\u003e\n\u003ch4 id=\"ch9-s338\"\u003e恢复训练\u003c/h4\u003e\n\u003cp\u003e● 遵循与其他扭伤一样的运动恢复指导\u003c/p\u003e\n\u003cp\u003e● 负重关节，可能需更长时间恢复\u003c/p\u003e\n\u003cp\u003e● 愈合早期可能需使用拐杖；医生可能要求使用支架\u003c/p\u003e\n\u003cp\u003e● 可继续锻炼非损伤区域（如上半身）；损伤区域始终在运动中受保护\u003c/p\u003e\n\u003cp\u003e● 物理疗法结束后关键第一步：修复本体感受、柔韧性和力量\u003c/p\u003e\n\u003cp\u003e● 韧带是本体感受反馈的主要来源\u003c/p\u003e\n\u003cp\u003e● 渐进式单腿训练促进本体感受\u003c/p\u003e\n\u003cp\u003e● 避免在不平稳表面训练（半泡沫滚筒/微型蹦床）→超负荷本体感受系统（尤其初始阶段）\u003c/p\u003e\n\u003cp\u003e● 侧向运动打开外侧踝关节→可能产生不必要张力→确保客户准备好后再进行冠状面运动\u003c/p\u003e\n\u003ch4 id=\"ch9-s348\"\u003e5.3.3跟腱炎\u003c/h4\u003e\n\u003cp\u003e图9-19\u003c/p\u003e\n\u003cp\u003e● 跟腱炎症→可能发展为II级或III级拉伤（尤其&gt;45岁）\u003c/p\u003e\n\u003cp\u003e● III级拉伤=跟腱断裂，多由慢性跟腱炎引起\u003c/p\u003e\n\u003cp\u003e● 常见损伤机制：突然从站立位启动运动（如垒球比赛离开一垒）\u003c/p\u003e\n\u003cp\u003e● 结构性因素：高弓足、扁平足、腿长不等、外侧踝不稳\u003c/p\u003e\n\u003cp\u003e● 健身相关因素：训练机制不当、鞋子不合脚、肌肉无力、柔韧性差\u003c/p\u003e\n\u003cp\u003e● 课程设计可纳入具体训练项目逐步改善弹性；任何要求多平面反应度和脚趾离地推动的训练均可达成目标\u003c/p\u003e\n\u003cp\u003e● 进阶路径：简单提踵→绳梯操练\u003c/p\u003e\n\u003cp\u003e● 重获小腿柔韧性是关键，但避免过度拉伸跟腱（会刺激肌腱）\u003c/p\u003e\n\u003cp\u003e● 柔和动态拉伸作为热身一部分\u003c/p\u003e\n\u003cp\u003e● 站立位拉伸小腿时脚保持中立位（避免过度旋前/旋后），脚直指前方\u003c/p\u003e\n\u003cp\u003e● 逐步恢复背屈ROM和力量+步行抬脚阶段控制力\u003c/p\u003e\n\u003ch4 id=\"ch9-s361\"\u003e5.3.4足底筋膜炎\u003c/h4\u003e\n\u003cp\u003e图9-20\u003c/p\u003e\n\u003cp\u003e● 足底/跖表面结缔组织发炎\u003c/p\u003e\n\u003cp\u003e● 可运动，但医疗专业人员可能叮嘱限制\u003c/p\u003e\n\u003cp\u003e● 目标：让客户感到具有挑战性但不使足部负荷过度的健身计划\u003c/p\u003e\n\u003cp\u003e● 将特定足部运动整合到一般健身计划中效果最好\u003c/p\u003e\n\u003cp\u003e● 拉伸腓肠肌/比目鱼肌/足底筋膜→缓解症状\u003c/p\u003e\n\u003cp\u003e● 自我肌筋膜放松（足底滚网球/自我肌筋膜放松球/高尔夫球）→提高背屈ROM+缓解疼痛\u003c/p\u003e\n\u003cp\u003e● 对整个后侧链肌群运用自我肌筋膜放松术也可提高背屈ROM\u003c/p\u003e\n\u003cp\u003e● 强化足内在肌→改善足弓稳定性→减少足底筋膜压力\u003c/p\u003e\n\u003ch4 id=\"ch9-s371\"\u003e足/踝/小腿课程设计四步法\u003c/h4\u003e\n\u003cp\u003e1. 解决足部和脚踝灵活性和稳定性\u003c/p\u003e\n\u003cp\u003e2. 改善控制矢状面运动的肌肉力量\u003c/p\u003e\n\u003cp\u003e3. 改善控制横状面和冠状面运动的肌肉力量\u003c/p\u003e\n\u003cp\u003e4. 改善后侧链肌群力量\u003c/p\u003e\n\u003ch4 id=\"ch9-s376\"\u003e日常训练建议\u003c/h4\u003e\n\u003cp\u003e● 拉伸：每日一次或每两天一次最有效；可推荐客户自行完成\u003c/p\u003e\n\u003cp\u003e● 即使存在小腿/足部功能障碍，用网球对足底筋膜自我肌筋膜放松也有益\u003c/p\u003e\n\u003cp\u003e● 平衡练习：每天做无过度使用风险；如刷牙时用患肢单脚站立练习平衡（每天两次1-2分钟本体感受训练）\u003c/p\u003e\n\u003cp\u003e表9-7\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e\u003c/th\u003e\u003cth\u003e各病症关键记忆点总结\u003c/th\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\n\u003cp\u003e表9-8\u003c/p\u003e\n\u003cdiv class=\"book-table-wrap\"\u003e\u003ctable class=\"book-table\"\u003e\u003ctr\u003e\u003cth\u003e病症\u003c/th\u003e\u003cth\u003e关键记忆点\u003c/th\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e愈合三阶段\u003c/td\u003e\u003ctd\u003e炎症期（3-4天）→修复期（~6周）→重塑期（4周-2年）；急性期RICE处理\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e疼痛阈值\u003c/td\u003e\u003ctd\u003e疼痛&gt;3级即停止运动\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肌肉拉伤\u003c/td\u003e\u003ctd\u003eI级轻/II级中/III级重（完全撕裂）；老年人更易III级\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e韧带扭伤\u003c/td\u003e\u003ctd\u003eI级微裂/II级部分撕裂/III级完全断裂；ACL机制=过伸+扭伤\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e软骨损伤\u003c/td\u003e\u003ctd\u003e大部分无血管→无法自愈；半月板外侧1/3例外\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e脑震荡\u003c/td\u003e\u003ctd\u003e二次撞击综合征可致命；必须完全停止直到获医疗许可\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e椎间盘损伤\u003c/td\u003e\u003ctd\u003e压迫+剪切力→纤维环撕裂→髓核渗漏→压迫神经→牵涉痛；Valsalva也增加风险\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肩峰撞击\u003c/td\u003e\u003ctd\u003e肩胛面过头推举（额状面前30°）；先矫正姿势→强化肩胛稳定肌→再过头\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e网球肘\u003c/td\u003e\u003ctd\u003e外上髁=伸肌肌腱；30-55岁常见；避免增加压力/腕部屈曲伸展握紧\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e高尔夫球肘\u003c/td\u003e\u003ctd\u003e内上髁=屈肌肌腱；30-55岁常见；同网球肘注意事项\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e腕管综合征\u003c/td\u003e\u003ctd\u003e屈肌支持带下→压迫正中神经→疼痛麻木；需人体工程学评估\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e肘/腕/手课程四步\u003c/td\u003e\u003ctd\u003e预防过度使用（多手柄/手套）→各平面拉伸增ROM→腕手力量训练→逐步增牵引重量\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e颈部\u003c/td\u003e\u003ctd\u003e脊柱错位引起连锁反应→解决动力链全段，不只是患处；单独强化颈部不应作为目标\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e下背部\u003c/td\u003e\u003ctd\u003e80%成人会发生；30%转慢性；耐力优先于力量；每天训练最有效\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e下背部四步\u003c/td\u003e\u003ctd\u003e纠正左右不平衡→纠正骨盆前/后倾→增加髋旋转ROM→强化后侧链\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e日常脊柱训练\u003c/td\u003e\u003ctd\u003e猫牛式（动作训练非拉伸）+改良卷腹+鸟狗式（5-8秒/侧）+侧桥（5-8秒/侧）\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e梨状肌综合征\u003c/td\u003e\u003ctd\u003e22%坐骨神经穿过梨状肌；≥6%&quot;下背痛&quot;实为梨状肌综合征\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIT束摩擦\u003c/td\u003e\u003ctd\u003e膝外侧疼痛；骨盆失衡→IT束紧绷→摩擦股骨外侧上髁\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e膝部肌腱炎\u003c/td\u003e\u003ctd\u003e髌腱/鹅足腱/股四头肌腱；四头肌紧张→增加髌骨压力→自我肌筋膜放松+伸展\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePFPS\u003c/td\u003e\u003ctd\u003e股骨内旋失控+IT束紧张→髌骨轨迹异常；下楼/下坡痛加剧；扁平足/腓肠肌紧张/髋外展外旋无力均相关\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e膝关节注意\u003c/td\u003e\u003ctd\u003e避开开链膝伸展→选闭链负重训练；全膝ROM可能无法完全恢复\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e外胫夹 vs 应力性骨折\u003c/td\u003e\u003ctd\u003e外胫夹不需完全休息；应力性骨折为某点触痛、局部渐进痛\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e踝扭伤\u003c/td\u003e\u003ctd\u003e75%在外侧；70%导致反复扭伤；机制=过度跖屈+内翻\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e踝扭伤恢复\u003c/td\u003e\u003ctd\u003e修复本体感受→渐进单腿训练；避免不平稳表面；侧向运动确保准备好后再进行\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e跟腱炎\u003c/td\u003e\u003ctd\u003e柔韧性是关键但避免过度拉伸；可进展为跟腱断裂（&gt;45岁高危）；脚保持中立位直指前方\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e足底筋膜炎\u003c/td\u003e\u003ctd\u003e拉伸小腿+足底筋膜；滚球自我肌筋膜放松提高背屈ROM+缓解疼痛；强化足内在肌改善足弓\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e下肢课程通用\u003c/td\u003e\u003ctd\u003e灵活性/稳定性→矢状面→冠状面/横状面→后侧链力量\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e","sections":[{"title":"ACE 教材第9章 · 肌肉骨骼异常客户的注意事项 · 重点总结","anchor":"ch9-s0"},{"title":"跨病症通用原则","anchor":"ch9-s2"},{"title":"一、急性损伤","anchor":"ch9-s43"},{"title":"二、过度使用症","anchor":"ch9-s117"},{"title":"三、上肢病症","anchor":"ch9-s131"},{"title":"四、脊柱病症","anchor":"ch9-s188"},{"title":"五、下肢病症","anchor":"ch9-s232"}],"paragraphCount":382}},"clients":[{"id":"C01","name":"林悦","age":32,"brief":"两次健身卡都在第一个月停用。想改善体能，但常常加班，怕自己“又半途而废”。"},{"id":"C02","name":"周航","age":29,"brief":"两年规律抗阻训练，每周三次；感觉自己“平台期”，想直接上更大的重量。"},{"id":"C03","name":"陈岚","age":51,"brief":"曾经运动，但近两年久坐。希望改善心肺功能；首次访谈透露活动后偶尔胸部不适。"},{"id":"C04","name":"许静","age":46,"brief":"自述患2型糖尿病，近半年运动不规律；想减脂并改善血糖，但不确定运动前需要准备什么。"}],"scenes":[{"day":1,"client":"C01","chapter":"Ch1","source":"第1章｜私人教练职责、职业道德与健康照护联盟","context":"林悦32岁，办公室项目经理；两次办卡均在四周内停止，尚未完成健康筛查。今天是她第一次正式咨询；尚无足够资料决定训练负荷。","objective":"识别私人教练能够承诺的服务、不能承诺的结果，以及需要转介的请求。","questions":[{"quote":"“我只给你21天。如果我每天来，能保证瘦三公斤吗？”","ask":"你如何回应结果保证的要求？写出你会当面说的两至四句话。","guide":"先确认客户目标，再说清可提供的训练与跟踪服务及个体差异；不要保证具体体重结果。","rubric":"承认目标与期待｜不作结果保证｜提出可观察的过程指标及下一步访谈","model":"“我理解你希望三周看到变化。体重变化会受很多因素影响，我不能保证具体数字；我们可以先了解你的健康情况和时间安排，设计可执行的训练计划，再用出勤、运动表现和感受来观察进展。”"},{"quote":"“你顺便按我的体重给我开一个七天减脂食谱吧，越快越好。”","ask":"判断哪些属于私人教练的一般营养教育，哪些需要营养专业人员；给出转介或协作话术。","guide":"不要把一般饮食建议写成治疗性或个体化菜单；依据所在地资质与法规决定可提供的范围。","rubric":"区分一般教育和个体化处方｜说明资质边界｜给出可实施的协作下一步","model":"“我可以和你讨论普遍适用的饮食原则、规律运动与习惯记录。具体的个体化食谱需要由具备相应资质的营养专业人员评估，我可以帮你整理想咨询的问题。”"},{"quote":"“你先安排我跑一跑吧，我身体应该没什么问题，填表太麻烦了。”","ask":"在还没有健康信息的情况下，决定当下能做什么、应暂缓什么，并提出三项下一步问题。","guide":"今天可以解释流程并访谈，不因口头自称健康就直接进入高强度训练；正式筛查工具第4章学习。","rubric":"不凭自述跳过筛查｜暂缓处方化训练｜询问活动经历、症状/病史、药物及目标","model":"“先了解你的运动史、目前有没有运动时不适以及既往健康情况，再完成必要的筛查。信息清楚后我们才决定合适的开始方式；今天先把目标和时间安排谈好。”"}],"carry":"这次咨询结束时，只得到目标和初步期望；健康信息未核实。","safety":"没有筛查结果时，不给出具体训练强度；教练不得保证体重结果或进行医学诊断。"},{"day":2,"client":"C02","chapter":"Ch1","source":"第1章｜职业伦理、能力边界与协作","context":"周航29岁，过去两年每周抗阻训练3次；想突破平台期。他带来朋友推荐的“快速增肌方案”，要求教练保证效果。","objective":"在已有运动经验的客户身上识别商业承诺、专业能力与转介问题。","questions":[{"quote":"“另外一家说六周内卧推必涨二十公斤，你能签这个保证吗？”","ask":"如何处理夸大的成绩承诺？向客户解释哪些因素会影响训练成果。","guide":"提出能控制的交付，例如计划、负荷记录和技术反馈；明确训练效果依个体反应。","rubric":"拒绝必达承诺｜解释训练可控变量与个体差异｜提出评估计划","model":"“我能负责测量现有能力、制定和调整计划、记录训练反应，但无法保证特定日期一定增加某个重量。我们先看你的训练日志和测试方式，再设合理的阶段目标。”"},{"quote":"“朋友拿了处方药说增肌很快，你直接告诉我怎么吃。”","ask":"你如何界定涉及处方药的问题并回应客户？","guide":"不指导处方药选择、用法或剂量；可询问是否已由医生管理并转介合格专业人员。","rubric":"识别药物建议超界｜不提供剂量｜建议咨询医生/药师","model":"“处方药的用途和风险需要由医生或药师评估，我不能指导用药。训练上我们先检查运动量、恢复和饮食习惯，可以把你担心的问题整理给医生。”"},{"quote":"“我的肩以前伤过，不过我觉得已经好了。今天可以直接冲1RM吗？”","ask":"根据当前已知事实，决定训练前还需要核实哪些信息；给出安全的临时行动。","guide":"已有伤病史不等于一律不能训练，也不等于可直接最大负荷；核实症状、治疗和当前功能，必要时转介。","rubric":"指出资料不足｜列出症状/功能/医疗限制问题｜暂停贸然最大强度测试","model":"“我先了解伤病什么时候发生、目前有哪些动作会不适、是否存在医疗建议，再选择合适的训练或评估方式。今天不直接做最大负荷尝试。”"}],"carry":"周航愿意提供过去四周训练日志，但未说明肩部既往伤情。","safety":""},{"day":3,"client":"C01","chapter":"Ch2","source":"第2章｜TTM改变阶段、自我效能与决策平衡","context":"延续 Day 1：林悦尚未开始规律训练。过去一个月偶尔在周末散步20分钟，下个月想开始每周两次。她认为加班是最大的阻碍。","objective":"根据想法、行动频率和持续时间判断TTM阶段，再选择适配的行为支持。","questions":[{"quote":"“我已经想好了下个月开始，每周练两次；但现在只是有空才散步，不算固定。”","ask":"判断林悦目前最可能处于哪个TTM阶段，并指出判断依据及仍需确认的信息。","guide":"TTM第2章用改变意向和实际行为判断；偶发活动和明确近期计划通常支持准备阶段，仍需确认运动是否规律。","rubric":"阶段：准备阶段（暂定）｜引用偶发行为/近期计划｜补问过去六个月运动情况","model":"“暂判断为准备阶段：她愿意近期开始且已有零散散步，但没有规律训练。我会再问过去几个月是否曾持续达到规律运动状态，避免只凭一句‘想开始’下结论。”"},{"quote":"“只要一加班，我就会觉得自己做不到，坚持不了。”","ask":"说明这句话体现了TTM中的哪项心理因素，并写两条能提高信心的具体策略。","guide":"这是对自己能否实施运动行为的信念，即自我效能；优先设计小而可完成的目标。","rubric":"指出自我效能｜提出可在加班周执行的替代方案｜安排成功经验反馈","model":"“这反映她对坚持运动的信心不足。我会邀请她先试每周两次20分钟的可行时段，再准备加班时的10分钟替代方案，并记录每一次完成。”"},{"quote":"“运动好处我知道，可我觉得花时间也会影响工作。”","ask":"识别此处的决策平衡，并给出一个开放式提问和一个可协商的微行动。","guide":"决策平衡是对改变的利与弊的权衡；先探索，不急于说服。","rubric":"同时呈现收益与成本｜开放式提问｜共商低阻力行动","model":"“你觉得运动最值得的收获是什么？什么时段最不容易和工作冲突？”随后让她选择一个本周可试的短时段，记录执行后的真实感受。"}],"carry":"TTM判断仅针对当前身体活动行为，不能用人格标签替代追踪。","safety":""},{"day":4,"client":"C04","chapter":"Ch2","source":"第2章｜TTM、决策平衡与相互教学","context":"许静46岁，自述有2型糖尿病，近半年运动不规律。今日是行为改变讨论，不代替后续第4章健康筛查；用访谈探索愿望和顾虑。","objective":"练习不抢先开处方的动机访谈和行为阶段判断。","questions":[{"quote":"“我也想开始走路，但是一想到血糖和低血糖就害怕，半年都没坚持。”","ask":"先分开处理行为改变障碍与医疗安全问题；教练可以做哪种访谈，哪些问题要医疗协作？","guide":"意愿不等于当前已适合训练；尊重疾病管理顾虑。","rubric":"关注意向/障碍｜提出开放式问题｜明确之后需按健康筛查和医疗建议决策","model":"“你最担心发生什么？医生有没有给你关于活动的具体建议？”先记录情况并安排后续筛查，暂不建议具体强度。"},{"quote":"“医生常说要运动，我知道重要，但到底该从哪里开始？”","ask":"仅依据这段话能确定是思考阶段还是准备阶段吗？还需要哪两条行为信息？","guide":"TTM不能只根据口头意愿下结论；需确认近期计划和实际活动。","rubric":"承认证据不足｜询问过去4周活动及开始时间计划｜再形成暂时判断","model":"“还不能确定。请问近一个月有没有规律活动？你是否准备在接下来一个月实施某个具体计划？”"},{"quote":"“我每次做三天就停了，感觉是自己意志力差。”","ask":"如何给出非评判性反映，并提出一种环境支持策略？","guide":"从工作日程、家庭支持与可达性找出干扰，不贴‘懒’标签。","rubric":"反映情绪｜共同寻找障碍｜给出可验证的小行动","model":"“听起来你很想做成这件事，但过去安排经常被打断。我们一起找出最容易坚持的时间，先试一个你愿意的低门槛安排，并记录困难。”"}],"carry":"许静的健康安全信息未核实，所有训练处方需等筛查与医疗信息。","safety":""},{"day":5,"client":"C01","chapter":"Ch3","source":"第3章｜建立默契关系与探讨阶段","context":"林悦在 Day 3 说担心加班影响训练，教练今天要从关系建立过渡到探讨需求；仍未进入正式评估和处方。","objective":"练习开放式提问、反映式倾听和客户中心的目标理解。","questions":[{"quote":"“上次那个教练一直说我不自律，我一听就不想去了。”","ask":"写一句反映式倾听，避免解释、否定或教育客户。","guide":"先准确复述被批评的感受与合作期待，再征求是否理解正确。","rubric":"感受反映｜不贴标签｜确认理解","model":"“你很在意合作时被尊重，之前的经历让你不愿再去健身房。我理解得对吗？”"},{"quote":"“我其实想下班后没那么累，体重只是顺便的。”","ask":"你如何用两个开放式问题进一步区分她的核心目标和外在期待？","guide":"探讨阶段重在客户视角；不要立刻决定减脂方案。","rubric":"一个围绕日常功能的问题｜一个围绕成功标准的问题｜避免诱导答案","model":"“你觉得下班后的哪种疲惫最影响生活？”“如果一个月以后情况有所改善，你最希望注意到什么变化？”"},{"quote":"“我能留出周二和周四晚上，但周四经常临时开会。”","ask":"如何向客户确认可行的时间安排，并设计备选方案？","guide":"总结已有信息后请客户自己选可执行的安排。","rubric":"总结周二稳定/周四不稳｜邀请客户选择替代时间｜留下可复核记录","model":"“我们先把周二当作固定时段，周四如果临时开会，你更愿意改到周六早上还是安排一个短一点的替代活动？”"}],"carry":"这次沟通确定“减少疲惫感”为优先目标，具体处方等筛查后决定。","safety":""},{"day":6,"client":"C02","chapter":"Ch3","source":"第3章｜计划阶段、SMART目标与协商","context":"周航提交四周训练日志：每周练3次但卧推波动明显，常在计划外加组；过去肩伤细节仍需澄清。","objective":"把模糊愿望转换成可观察、可调整的过程目标。","questions":[{"quote":"“我就是想练强一点，越快越好。”","ask":"把该目标转换为一条具体可追踪的过程目标，写明观察指标和复查时间。","guide":"先让客户认可指标，避免对负荷增幅作保证；训练前仍须确认肩部情况。","rubric":"具体指标｜可记录性｜现实可行性｜复查周期","model":"“在接下来两周，按约定的训练安排记录卧推的负荷、次数和主观用力，每周复盘一次；增重前先核实技术和肩部反应。”"},{"quote":"“我每次状态好就临时加几组，不然总感觉没练够。”","ask":"用一个问题探索行为原因，再提出一个可检验的调整计划。","guide":"探讨阶段先理解其‘练够’标准，计划阶段才协商总量。","rubric":"开放式问题｜计划内与计划外负荷区分｜预设两周回顾","model":"“你通常根据什么判断练够了？”建议先照计划记录两周，标明想临时加组的时点，再一起对照恢复和表现。"},{"quote":"“给我安排每天一次最大重量，我保证照着做。”","ask":"怎样在维护合作关系的同时拒绝不合理的要求？","guide":"训练设计需考虑恢复、当前能力与风险；Day6 先明确协商原则，具体变量第6章处理。","rubric":"尊重自主｜说明安全/恢复条件｜提供合适的替代评估","model":"“我知道你愿意投入很多时间。最大负荷不是每天都适合；我们先核实肩部与近期训练反应，再决定可以安全执行的阶段计划。”"}],"carry":"周航目标从笼统增力转成训练记录和定期复盘；具体抗阻处方留待 Ch6。","safety":""},{"day":7,"client":"C03","chapter":"Ch3","source":"第3章｜行动阶段、教学反馈与理解检验","context":"陈岚51岁、近两年活动减少，咨询时提到走快后胸部不舒服。今天练习教练如何解释下一步、检查理解和处理拒绝。","objective":"通过回授法和建设性反馈传递安全信息，而不进入未经评估的训练。","questions":[{"quote":"“你们是不是都让我先去医院？我只是想上点运动课。”","ask":"写一段不会引起指责感的沟通话术，说明为何需要先评估胸部不适。","guide":"运动相关胸部不适为警示线索，暂停开始训练，及时医疗评估；若症状急性或持续、伴呼吸困难等应寻求紧急医疗帮助。","rubric":"回应情绪｜解释风险与专业边界｜明确暂停训练和适当就医","model":"“我理解你希望尽快开始运动。因为你提到走快时胸部不舒服，我不能确定原因；为了安全，先请医生评估。在明确建议之前，我们暂不做训练。”"},{"quote":"“你刚才说的太复杂，我没听明白。”","ask":"请用两句普通语言重新解释，并设计一个回授问题。","guide":"回授法是邀请客户用自己的话复述下一步安排，不是考试式质问。","rubric":"通俗说明｜关键安全行动｜非评判式回授问题","model":"“现在先暂停运动课，并请医生评估走路快时的不舒服。为了确认我讲清楚了，方便你说说下一步准备怎么安排吗？”"},{"quote":"“可我朋友觉得我就是太久没运动，忍一忍就好。”","ask":"你如何回应不可靠的原因推测，同时避免给出医学诊断？","guide":"承认猜测存在，但不能据此忽略可疑症状；清楚记录描述。","rubric":"不作病因判断｜保留事实记录｜坚持医疗评估","model":"“目前无法凭朋友的判断确定原因，我会把你描述的发生情境记录好，供医生评估；在获得明确建议前不安排运动。”"}],"carry":"陈岚暂时中止训练流程，之后任何处方均以症状评估与医疗意见为前提。","safety":"出现持续或当前急性胸痛、呼吸困难、晕厥等，应立即寻求急救；不等待普通课程反馈。"},{"day":8,"client":"C04","chapter":"Ch4","source":"第4章｜PAR-Q+、健康史与就医协作","context":"许静46岁，自述2型糖尿病，使用降糖药但说不清药名，也未提供最近的血糖管理建议。今天正式进行运动前信息收集。","objective":"按第4章开展筛查、补充病史并明确何时需要医疗沟通。","questions":[{"quote":"“我吃药控制血糖，但药叫什么我忘了。能不能今晚就开始高强度课？”","ask":"在信息不足时怎样安排筛查与下一步？说明暂时不能确定的因素。","guide":"按PAR-Q+及适用的风险评估流程，补充疾病状况、用药、症状、当前活动水平；不要直接安排HIIT。","rubric":"识别信息缺口｜建议补全药物和医生建议｜暂缓高强度安排","model":"“先完成健康问卷，核对药物与医生的运动建议，了解是否有相关症状。信息不完整时，我不会马上安排高强度课。”"},{"quote":"“我平常偶尔会手抖出汗，是不是运动对我不合适？”","ask":"你该如何记录症状并决定是否需要联系医疗专业人员？","guide":"手抖出汗可能有多种原因；正在用降糖药者应将低血糖可能性提交医生/糖尿病团队评估，教练不诊断。","rubric":"记录发生条件｜识别用药相关风险｜建议医疗评估｜避免自行诊断","model":"“我会记录这些症状出现的时间、与进食和用药的关系，建议你向医生确认运动时的注意事项；先不根据症状自行决定强度。”"},{"quote":"“我已经签过知情同意书，为什么还要问健康史？”","ask":"向许静解释知情同意与健康筛查的不同目的，给出具体流程。","guide":"知情同意告知风险与参与选择，筛查帮助识别训练前是否需要进一步评估；两者不能互相替代，具体表格要符合当地法律。","rubric":"区分告知与筛查｜明确资料保密｜解释是否需要医学许可由筛查与情境决定","model":"“知情同意让你知道活动的性质、风险和选择权；健康史帮助我们判断怎样安全开始。两份资料用途不同，我们会按规定保管，必要时与你的医生沟通。”"}],"carry":"Day8 只记录筛查与可能转介决策；不能凭‘签字’或‘医生说要运动’直接确认训练安全。","safety":""},{"day":9,"client":"C03","chapter":"Ch4","source":"第4章｜筛查后决定、转介文件与记录","context":"陈岚在 Day7 被建议就医。今天她带来一张只写“可以适量活动”的门诊便条，未列允许强度、胸部不适评估结果或限制。","objective":"识别模糊的医疗建议能说明什么、不能说明什么，并练习协作沟通。","questions":[{"quote":"“医生写了可以活动，你看我现在能上你们的间歇跑课了吗？”","ask":"判断这张便条是否足以支持高强度运动，写出具体下一步。","guide":"不把模糊“适量活动”解释为高强度许可；核实症状状态及医生对类型/强度的建议。","rubric":"指出许可范围不清｜暂缓高强度｜请求明确医学建议","model":"“这张便条说明医生建议活动，但没有说明高强度间歇跑是否合适。我们先确认症状是否评估完成，以及医生建议的活动类型和强度。”"},{"quote":"“你写一封信给医生就行，你告诉我写什么。”","ask":"起草一段给医生的客观转介问题，避免替客户作诊断。","guide":"只描述事实、目标、拟开展活动和需要确认的信息。","rubric":"客观症状描述｜询问运动类型强度限制｜保留联系授权","model":"“客户报告快走时胸部不适，目前希望参加有氧活动。请协助明确是否需要进一步评估，以及建议的运动类型、强度和限制条件。”"},{"quote":"“我不想所有教练都看到我的健康资料。”","ask":"在小组协作中如何处理健康信息与隐私权限？","guide":"健康资料限需知晓者并经同意使用，案例教学应匿名化。","rubric":"承诺最小必要访问｜解释用途与同意｜不用群聊传播真实健康记录","model":"“你的资料只用于安全评估和约定的服务，必要时经你授权与相关专业人员沟通。我们小组讨论使用去标识化的模拟信息，不公开你的健康细节。”"}],"carry":"在获得清楚意见前不启动陈岚的实际心肺训练；课堂可以练习“假设已获许可”的纸面计划。","safety":""},{"day":10,"client":"C02","chapter":"Ch5","source":"第5章｜心肺生理、强度指标与评估","context":"周航平时专注力量训练，近一次骑车20分钟的记录显示他全程几乎说不出完整句子，但自认为“有氧太轻松没效果”。","objective":"利用主观感受、谈话测试和训练目标解释心肺强度。","questions":[{"quote":"“我骑车时几乎说不出整句话，这不是证明我练得更好吗？”","ask":"如何基于谈话测试解释这一线索的强度含义与局限？","guide":"能否说话是粗略强度线索，不是精确测定；无法完整说话提示强度较高，但需结合其他信息。","rubric":"区分高强度与好效果｜承认测试局限｜询问目标与反应","model":"“说话困难说明这次运动可能比较用力，但不代表每次都需要这样。我们要结合你的目标、恢复和可持续性来安排强度。”"},{"quote":"“我只记了平均心率，不知道最大心率是多少，能算出我有氧区间吗？”","ask":"说明为什么目前不能给出精确个人靶区间，应补哪些数据。","guide":"年龄预测HRmax有误差；药物、心率设备与测试方法影响解释。","rubric":"识别缺少HRmax/静息HR与设备信息｜说明估算误差｜提出RPE/谈话辅助","model":"“仅一个平均心率不能决定你的最佳区间。先核对运动记录、设备、个人健康状况和主观强度；需要时再用合适的测试或估算方法。”"},{"quote":"“我一周就能安排两次骑车，还值得做吗？”","ask":"提出一条可执行的起始频率安排及随访指标，说明其为讨论草案。","guide":"先评估当前体能和健康资料；频率与强度根据目标和反应逐步调整。","rubric":"肯定可达性｜给出逐步安排思路｜记录RPE/恢复/持续时间","model":"“两次规律活动比完全不做更易持续。我们可以先记录每次的持续时间、能否说话和恢复感觉，之后再决定是否增加时间或次数。”"}],"carry":"周航可讨论一般强度原则，但实际心肺测试仍需符合筛查与个人情况。","safety":""},{"day":11,"client":"C01","chapter":"Ch5","source":"第5章｜心肺Workout观察、RPE与谈话测试","context":"在已完成适当筛查且获准参加一般活动的模拟前提下，林悦按课程观察一次15分钟的步行活动，未进行最大负荷测试。","objective":"用训练观察资料描述强度并识别不能推断的结论。","questions":[{"quote":"“走了五分钟还能完整说话，我感觉大概三分累。”","ask":"你如何记录这次主观用力与谈话表现？不能据此推断什么？","guide":"记录统一RPE量表及其刻度、时间、速度/地形和谈话表现；不可当作VO₂max诊断。","rubric":"标注RPE量表｜记录观察条件｜说明不等于精确生理测试","model":"“本次平地步行前5分钟，RPE约3/10，能完整说话。记录为低至中等主观负担的线索；不能据此计算她的VO₂max。”"},{"quote":"“最后五分钟有点喘，但还能说短句，你还让我继续吗？”","ask":"你准备询问哪些主观反应，怎样决定是否调整？","guide":"需核对症状与疲劳，按安全原则调整；若出现异常胸痛、晕厥或明显呼吸困难，应立即停止并寻求医疗帮助。","rubric":"核查症状｜依据个人反应下调或停止｜记录变化","model":"“先问有没有胸痛、头晕或不寻常的不适；若只是正常用力感且安全条件满足，可适度降速并观察，若有警示症状应立即停止。”"},{"quote":"“今天很顺利，那明天能直接跑40分钟吗？”","ask":"如何用逐步进阶原则提出下一次活动方案的商议思路？","guide":"一次完成不能证明已适应大幅增量；遵循逐步增加总量原则。","rubric":"不跳跃进阶｜关注出勤与恢复｜协商下一次可完成的安排","model":"“今天的记录很有价值。下一次先继续一个你能稳定完成的时长，观察第二天恢复和工作安排，再逐步增加活动量。”"}],"carry":"林悦建立了第一次可追踪的心肺观察记录，但还没有足以支持大幅进阶的资料。","safety":""},{"day":12,"client":"C03","chapter":"Ch5","source":"第5章｜FITT-VP、初始心肺处方与进阶","context":"此处使用“假设陈岚已经完成必要医学评估，医生允许在指定低至中等强度范围活动”的纸面模拟；现实中许可细节未获确认，不能据此启动训练。","objective":"在明确条件下写出可复核的FITT-VP处方，说明何时暂停或回诊。","questions":[{"quote":"“如果医生同意我开始轻一点的运动，你会怎么安排一周？”","ask":"请用FITT-VP写出纸面初始处方的六个要素，并明确其前提。","guide":"频率F、强度I、时间T、类型T、总量V、进阶P；实际剂量依许可和评估决定。","rubric":"六要素完整｜写明许可范围条件｜纳入症状监测","model":"“在医生明确许可指定低至中等强度步行的假设下，可先商议每周若干次短时间步行，以谈话表现和RPE记录强度；每周核对耐受再渐进调整。具体剂量需按医生限制确定。”"},{"quote":"“我走十分钟没问题，是不是下周把时间翻倍？”","ask":"如何判断是否可以进阶？你需要查看哪三个指标？","guide":"逐步进阶基于耐受、恢复、症状、出勤和医生限制，不以单次表现判断。","rubric":"查看症状｜恢复/疲劳｜连续完成记录与限制｜避免骤增","model":"“先看过去一周每次的症状、主观强度与恢复，还有是否稳定完成计划。确定在许可范围内后，再讨论小幅增加。”"},{"quote":"“那你能保证这样练会让我的胸闷消失吗？”","ask":"给出区分运动服务和医疗治疗结果的回应。","guide":"胸部症状原因和疗效应由医疗专业人员评估；不可承诺通过运动治愈。","rubric":"不承诺症状治疗｜说明训练目标｜持续协作医生","model":"“我不能保证运动消除胸部不适；相关症状需要医生评估和随访。我们能做的是在确认安全的范围内安排活动、记录反应，遇到异常及时停止和反馈。”"}],"carry":"陈岚的训练处方仅为有明确许可前提的教学模拟；实际应继续医学沟通。","safety":""},{"day":13,"client":"C04","chapter":"Ch4–5","source":"第4章健康筛查＋第5章心肺数据和药物影响","context":"许静补充称医生已建议规律活动，但仍未确认具体降糖药；她提交手机记录，未注明测量时间和设备条件。","objective":"把药物、测量与训练观察整合成带有不确定性的判断。","questions":[{"quote":"“我的手环显示昨天走路平均心率120，我照这个数练不就行了吗？”","ask":"列出这个数字无法告诉我们的三个信息，并说明下一步记录。","guide":"平均心率不提供完整强度分布；设备误差、药物、活动条件影响解读。","rubric":"标注来源/条件｜解释单点数据局限｜建议附RPE、时长及反应","model":"“还需知道记录时长、路线或速度、主观强度以及手环测量条件。单一平均心率不能代表适合你的训练目标。”"},{"quote":"“我药名还没核实，但你先按运动能降血糖来安排强度吧。”","ask":"如何回应“已知训练有益”与“个人风险待核实”同时存在？","guide":"疾病管理获益不能代替个体风险评估；用药对运动安全的影响需医疗协作。","rubric":"承认一般获益｜药物与症状核查｜暂缓个体高强度建议","model":"“规律运动往往有益，但你的药物和出现过的症状还需要核对；我们先把安全问题问清楚，再讨论适合的类型和强度。”"},{"quote":"“我不想测一堆东西，你到底需要我记什么？”","ask":"给出一份三项以内、最低负担的运动观察记录，解释每项用途。","guide":"记录要符合训练目标与医疗建议；不由教练自行调整药物。","rubric":"简短可执行｜覆盖活动量与主观反应｜遵守医疗要求","model":"“先记活动类型和时长、运动时RPE/谈话情况、是否出现不适。与药物和血糖相关的监测请遵循医生给你的方案。”"}],"carry":"未完成药物核实时不进行以心率数值驱动的个体化高强度处方。","safety":""},{"day":14,"client":"C02","chapter":"Ch6","source":"第6章｜肌肉适应、疲劳与基础训练原则","context":"周航的训练日志显示经常在同一动作上增加总组数，次日肩部偶有酸痛，但不清楚其性质与原因。","objective":"区分训练刺激、恢复和潜在不适；避免把疼痛直接解释为有效刺激。","questions":[{"quote":"“练后肩膀酸就是练到位了吧？越酸越有效？”","ask":"如何解释延迟性肌肉酸痛和训练效果的关系，并提出必须进一步确认的症状信息？","guide":"酸痛不能直接等同于适应；运动相关异常关节痛应评估，教练不诊断。","rubric":"否定酸痛=效果的推断｜辨别位置/发生时机/严重程度｜提出调整和必要转介","model":"“酸痛只是训练后的可能反应，不等于效果更好。先确认是肌肉酸感还是肩关节疼痛、什么时候出现、是否影响活动，再决定是否调整或转介。”"},{"quote":"“我一周总共做了二十多组胸推，是不是越多越好？”","ask":"你需要核对哪几项训练负荷和恢复信息，才能判断该总量是否适宜？","guide":"训练变量包括强度、组数、次数、频率、休息等；量越大不一定越好。","rubric":"说明总量并非单独结论｜核对RIR/RPE、负荷、频率和恢复｜提出复查计划","model":"“先看每组次数与接近力竭程度、每周分配、技术质量和恢复，再根据目标和反应调整，不能只用周组数评价。”"},{"quote":"“那我可不可以直接把计划里所有动作都做至力竭？”","ask":"给出基于恢复和技术质量的初步建议，同时说明个体条件。","guide":"具体训练负荷需结合能力和伤病信息；避免把力竭当作普适要求。","rubric":"识别高疲劳风险｜提出技术/恢复边界｜说明需循序调整","model":"“不建议把每个动作都无差别做到力竭。我们先安排能保持动作质量的负荷和余力，观察恢复，再决定哪些训练需要更高努力程度。”"}],"carry":"周航肩部反应仍需澄清，不直接为所有动作增加强度。","safety":""},{"day":15,"client":"C01","chapter":"Ch6","source":"第6章｜抗阻训练变量与计划设计","context":"林悦开始学习抗阻训练。她当前可以参加一般训练的安全条件在模拟中已核实，目标仍是增强体能、改善日常疲惫，时间有限。","objective":"用训练目标决定动作、组数、次数、频率和进阶思路。","questions":[{"quote":"“我只想每天花20分钟，你是不是一定要安排满一小时？”","ask":"为她设计符合限制的训练思路，至少说明频率、主要动作类型和记录方法。","guide":"有限时间的规律训练有价值，负荷和频率需结合经验及恢复。","rubric":"尊重时间限制｜全身主要动作类型｜记录可执行性","model":"“可以从你愿意坚持的短时全身练习开始，选少量基础动作，记录次数、主观用力和完成感；之后再根据适应逐渐调整。”"},{"quote":"“我做深蹲时膝盖会有点不舒服，你是不是看动作就能判断病因？”","ask":"明确教练能够做的观察与调整，以及不能做的医学诊断。","guide":"记录不适位置和诱发动作，评估是否需暂停或转介；不归因具体病因。","rubric":"不作病因诊断｜询问症状/危险信号｜调整或暂停诱发动作","model":"“我能观察哪些动作让你不适，并先暂停或调整这个动作，但不能凭外观判断病因。如果不适持续、加重或伴其他异常，建议找合适专业人员评估。”"},{"quote":"“今天哑铃很轻松，下次我是不是每个动作都翻倍加重量？”","ask":"怎样设定保守、可观测的进阶条件？","guide":"以技术质量、目标次数、主观努力和恢复共同决定进阶；避免骤增。","rubric":"提出进阶判断标准｜不突然翻倍｜保留复查","model":"“先确认动作质量稳定、完成约定次数而且恢复良好；若连续多次如此，再考虑小幅增加负荷。”"}],"carry":"林悦优先考虑出勤与技术学习，练习安全基于事先筛查前提。","safety":""},{"day":16,"client":"C03","chapter":"Ch6","source":"第6章｜Workout、动作教学与反馈","context":"陈岚目前仍使用纸面模拟的安全活动许可，不开展未经确认的实际高负荷训练。小组成员演练“教练—客户—观察者”角色。","objective":"练习用简短、可观察的动作提示和反馈，提高客户理解。","questions":[{"quote":"“我没练过这个动作，你别一下告诉我十个要点。”","ask":"设计一段第一次动作教学指令，包含演示、一个关键提示和理解确认。","guide":"一次聚焦少量动作要点，先示范再观察，避免过多口令。","rubric":"简要演示｜一个关键动作提示｜确认客户理解","model":"“我先给你示范一次，我们先关注脚掌稳定。你做一遍，我看看感受，再一起调整。”"},{"quote":"“你说我刚刚做得不好，可我不知道哪里不好。”","ask":"给出基于可观察行为的建设性反馈，不使用人格评价。","guide":"指出具体动作行为、影响和下一次可尝试的调整。","rubric":"具体观察｜一个可执行修正｜尊重客户感受","model":"“我看到你刚才起身时速度明显变快。下一次我们先用更慢、可控制的节奏试两次，看看能否保持稳定。”"},{"quote":"“你教的我现在能做，但我回家就忘了。”","ask":"提出一个回授与复习办法，说明如何记录教学效果。","guide":"让客户用自己的话复述或示范，再以短练习巩固。","rubric":"回授｜简短练习记录｜下次复核","model":"“你可以用自己的话说说两个关键步骤，或者再示范一次。我会把最重要的提示写在你的练习记录里。”"}],"carry":"小组完成的是模拟教学与观察任务；健康状态未知的成员可用视频/观察替代身体训练。","safety":""},{"day":17,"client":"C02","chapter":"Ch6","source":"第6章｜ACE IFT肌肉训练阶段与进阶","context":"周航希望从常规力量训练转向更系统的计划；目前肩部症状需要持续监测，尚未获得其详细医疗信息。","objective":"把训练水平、动作质量和目标匹配到恰当的训练阶段，不机械套标签。","questions":[{"quote":"“我练两年了，是不是直接跳过基础阶段，所有动作都冲高负荷？”","ask":"解释为什么训练年限不等于每个动作都具备相同能力，提出阶段判断指标。","guide":"IFT分阶段应基于运动能力、技术、目标和耐受，而非仅靠训练年限。","rubric":"区分经验与当前能力｜关注动作质量/恢复｜明确进阶条件","model":"“经验是重要背景，但我们还要看每个动作的稳定性、可承受负荷、恢复和肩部反应，再决定哪些动作适合进阶。”"},{"quote":"“如果我这周重量涨了，能证明计划就是对的吗？”","ask":"设计一个包括多个指标的两周监测方案。","guide":"短期重量变化有噪声，需综合技术、RPE/RIR、恢复和症状。","rubric":"至少三个指标｜同条件比较｜设复盘时点","model":"“连续记录完成次数、主观努力、动作质量及恢复情况，两周后比较相同条件的表现；单次增加重量不足以评价整个计划。”"},{"quote":"“那个肩膀问题我还能忽略吗？反正其他动作也能做。”","ask":"根据不适信息不完整的现状，给出训练调整和专业协作选择。","guide":"不能忽略持续/复发的不适；按症状程度及危险信号考虑暂停、调整和转介。","rubric":"不鼓励硬撑｜界定安全边界｜寻求必要评估","model":"“先找出哪些动作诱发不适并暂停或调整，必要时请医生或物理治疗师评估。在情况明确前避免在不适动作上追求最大负荷。”"}],"carry":"IFT阶段为任务决策框架，不自动代表已获医学许可。","safety":""},{"day":18,"client":"C01","chapter":"Ch1–6","source":"第1–6章｜跨章节客户方案互评","context":"林悦已完成需求访谈、TTM讨论、初步筛查和训练实践模拟。她可能因为忙碌漏课；小组准备评审她的完整初始计划。","objective":"将执业边界、行为策略、筛查、心肺与抗阻计划连成完整逻辑。","questions":[{"quote":"“方案里项目太多，我一加班肯定完不成。”","ask":"作为教练，你如何删减计划并保留最重要的训练目标？","guide":"保留客户优先目标，考虑频率、剂量和备选方案，避免一次给太多任务。","rubric":"贴近客户目标｜说明删减理由｜提供忙碌周备用方案","model":"“我们优先保留两项可持续的核心任务，其他内容先作为可选项；加班周采用约定的简化版，并在下周复盘。”"},{"quote":"“你说我现在是准备阶段，那我已经练了几次，是不是变行动阶段了？”","ask":"根据TTM重新核查规律性和持续时间，明确需追问的事实。","guide":"阶段可变化；不以单次练习决定已建立规律，需核实当前是否规律持续。","rubric":"确认实际频率｜判断是否已规律｜避免仓促更改阶段","model":"“你开始行动是非常好的进展。我想先看最近几周每次活动的频率和稳定性，再判断是否已进入规律行动阶段。”"},{"quote":"“你们三个人给的建议不一样，我听谁的？”","ask":"如何组织小组互评，最终形成可追踪的修改意见？","guide":"先列出共同事实、分歧与证据，交由指定教学负责人处理专业争议。","rubric":"列出分歧｜标注依据和未知｜明确修改责任与复核","model":"“我们先把各自依据和不确定性写清楚，比较哪些建议符合你的目标与安全条件；有专业争议的交给老师复核，再确定最终版本。”"}],"carry":"本次小组活动必须产出一份修改记录，不能只给主观好坏评价。","safety":""},{"day":19,"client":"C04","chapter":"Ch7–9","source":"第7章慢性病／第8章生命阶段／第9章肌骨异常","cont
