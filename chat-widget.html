剂会降低静息、运动及最大心率，因此不宜直接套用常规年龄预测靶心率，应根据医疗建议，结合自感用力度或谈话测试判断强度。\n\n● 类比：好比汽车被限速器锁住，发动机本身没问题，但油门信号被阻断，心率上不去。"], [4, "4.1 降压药", "● 补充：使用β-阻滞剂时，推荐RPE 12-13或说话测试（运动中能说话即为中等强度）。\n\n• 场景：客户在吃β-阻滞剂，你问他运动时心率到多少了。\n\n• ❌ 错误做法：用220-年龄计算靶心率，期望他达到某个数字。\n\n• ✓ 正确做法：了解药物名称、剂量和服用时间，遵循医疗建议，并结合RPE或谈话测试判断强度，不直接套用常规年龄预测靶心率。\n\n• 常见误区：不知道β-阻滞剂客户的心率上限会被\"降低\"，盲目追求数字。\n\nACE抑制剂：\n\n● 不影响心率，但降低静息和运动血压\n\n利尿剂：\n\n● 不主要影响心率\n\n● 导致水分和电解质失衡 → 低钾血症→室性心律失常风险↑，运动中尤其危险 ，可能引发危险性心律不齐\n\n● 损害水合状态 → 降低血容量 → 可能脱水\n\n● 运动前/中/后需充足液体摄入，温暖潮湿环境更需注意\n\n利尿剂会增加水分和电解质排出，应留意水合状态，并遵循医生针对液体和电解质摄入的建议。\n\n● 类比：好比夏天空调排水管，一直在排水，不及时加水就会干涸。\n\n● 补充：利尿剂导致低钾血症是考试高频点，低钾可导致室性心律失常，运动中尤其危险。"], [4, "4.1 降压药（续）", "• 场景：客户服用利尿剂，在炎热夏天户外训练。\n\n• ❌ 错误做法：只关注训练强度，不关注补水。\n\n• ✓ 正确做法：训练前、中、后关注客户的水合状态，在温暖潮湿的环境中更需谨慎；液体或电解质摄入量应遵循客户医生的建议，不由教练给出统一处方。"], [4, "4.2 支气管扩张剂", "● 对受支气管痉挛限制者增加运动能力\n\n● 对静息和运动心率/血压影响很小"], [4, "4.3 感冒药", "● 减充血剂 = 拟交感神经 → 血管收缩 → ↑血压 ↑心率\n\n● 抗组胺药 → 对心率/血压无直接作用，但可能引起困倦\n\n● 大多数感冒药是两者组合，剂量低，对运动能力影响极小\n\n降压药的额外注意事项：\n\n● 许多降压药可能导致体位性低血压(Orthostatic Hypotension) 表现为从坐/卧位快速站起时头晕\n\n● 客户在地板上做腹部练习后不要站起太快\n\n● 口诀：「降压药做完地板动作，站起来要慢三秒」\n\n● 类比：好比蹲久了突然站起来会头晕，降压药会让这种情况更容易发生。\n\n● 补充：ACE教材表4-1注释中明确指出\"许多降压药可能会导致体位性低血压\"，这是考试常见干扰项。\n\n⚠️执业边界提醒：教练的职责是筛查和转介，不是诊断。不能建议客户增减药物、不能解读医学检查结果、不能在客户出现急性症状时继续训练。\n\n药物模块的核心是理解药物如何改变心率对运动的响应。两条逻辑线：\n\n1. β-阻滞剂线：心率被压低 → 传统心率区间法失效 → 必须换工具（RPE/说话测试）\n\n2. 利尿剂线：水分/电解质失衡 → 脱水风险 → 补水是关键"], [4, "4.3 感冒药（续）", "核心逻辑：β-阻滞剂线（心率反应受到影响→RPE）和利尿剂线（脱水风险→补水）是两大核心逻辑。\n\nQ1：服用β-阻滞剂的客户，用什么确定运动强度？\n\nRPE（自感用力度）或说话测试。心率指标因药物影响而不可靠。\n\nQ2：服用利尿剂的客户，需要特别注意什么？\n\n水合状态。利尿剂增加水分和电解质排出，可能导致脱水、电解质失衡、心律不齐。运动前/中/后需充足液体摄入。\n\nQ3：服用降压药的客户从地板上做完腹部练习后，教练应该提醒什么？\n\n慢慢站起来。许多降压药可导致体位性低血压，快速站起可能头晕。\n\nβ阻心低换RPE / 利尿脱水多补水 / 降压药防体位低"], [4, "5 小结", "本模块帮助你高效复盘本章内容，检验学习效果，为考试做准备。\n\n建议完成正文学习后，用复习段做自我检测。"], [4, "一、核心回顾", "运动前健康筛查的核心目的：识别谁需要先看医生，确保在安全的前提下帮助更多人开始并维持运动。"], [4, "二、知识脉络", "详细脉络："], [4, "三、考前必背表", "表4-11\n\n| 定期运动定义\n\n| 过去3个月 + 每周≥3天 + 每次≥30分钟 + 中等强度\n\n| 3-3-30\n\n| 风险三角\n\n| 不习惯 + 已患病 + 接近极限\n\n| 三者齐备才高危\n\n| 症状优先级\n\n| 症状 > 疾病 > 运动史\n\n| 症状永远是老大\n\n| 医学许可触发\n\n| 不定期+有疾病；不定期+有症状；定期+有症状+高强度\n\n| 三种情况要许可 （定期+有疾病无症状+中等强度：可考虑免除）\n\n| PAR-Q+三色\n\n| 绿=放行 / 红=深入 / 黄=等等\n\n| 交通信号灯\n\n| β-阻滞剂应对\n\n| 心率反应受到影响，改用RPE或说话测试\n\n| β阻心低换RPE\n\n| 利尿剂应对\n\n| 补水，补水，补水\n\n| 利尿脱水多补水\n\n| 降压药注意\n\n| 体位性低血压，地板动作后慢站\n\n| 降压药防体位低\n\n| 心脏康复筛查\n\n| AACVPR风险分层\n\n| 临床环境更深\n\n| 四表一审核\n\n| 参与协议+知情同意+健康史+就医授权→律师\n\n| 法律文件要审核"], [4, "四、自检清单", "完成本章学习后，你可以对照以下清单自我检测：\n\n□ 我能解释为什么要进行运动前健康筛查\n\n□ 我能说出\"定期运动\"的精确定义（3个条件）\n\n□ 我能画出ACSM筛查算法的三轴决策树\n\n□ 我能判断任何给定情况下是否需要医学许可\n\n□ 我能解释为什么\"症状\"是触发许可的最强信号\n\n□ 我能用ABC沟通法解释医学许可的必要性\n\n□ 我能说明PAR-Q+的三色判定及对应行动\n\n□ 我能解释PAR-Q+的设计理念\n\n□ 我能说明β-阻滞剂客户为什么不能用靶心率\n\n□ 我能说明利尿剂客户需要特别注意什么\n\n□ 我能说出降压药的体位性低血压风险及应对\n\n□ 我能列举筛查后需要的四张表格"], [4, "六、章末三件事", "完成本章学习后，请确保完成以下三件事：\n\n1️⃣ 理解一件事\n\n筛查的核心目的是 识别谁需要先看医生，确保在安全的前提下帮助更多人开始并维持运动。\n\n2️⃣ 记住一个公式\n\nACSM筛查算法 = 运动史（定期/不定期）× 疾病状态（有/无）× 体征/症状（有/无）\n\n核心原则：症状 > 疾病 > 运动史\n\n3️⃣ 带走一个口诀"], [4, "综合测验", "Q1：筛查算法中，哪个因素是触发医学许可最强的信号？\n\n体征/症状。不论疾病状态和运动水平，有症状就需要医学许可。\n\nQ2：「定期运动」的精确定义是？\n\n过去3个月内，每周至少3天，至少30分钟有计划、有组织的中等强度身体活动。\n\nQ3：PAR-Q+的核心设计目的是什么？\n\n减少不必要的运动障碍（用循证方式让大多数人安全地开始运动）。\n\nQ4：服用β-阻滞剂的客户，为什么不宜直接套用常规年龄预测心率确定运动强度？应该改用什么？\n\nβ-阻滞剂降低静息/运动/最大心率，使心率指标不可靠。改用RPE（自感用力度）或说话测试。\n\nQ5：定期运动 + 已知CVD + 无症状 的客户想做中等强度有氧，需要医学许可吗？\n\n不需要。定期运动 + 有疾病但无症状 + 中等强度 = 不需要医学许可。只有高强度才需要。\n\nQ6：降压药常见的额外风险是什么？在训练中如何应对？\n\n体位性低血压。从坐/卧位快速站起时血压下降导致头晕。应对：地板动作后慢起。\n\nQ7：运动前健康筛查的三个风险调节因素是什么？\n\n①目前身体活动水平 ②是否确诊CVD/代谢/肾脏疾病或有相关体征/症状 ③期望运动强度"], [4, "思考与练习", "以下题目来自本章预习区和章末自测，点击展开参考答案。\n\n作为教练，首先应认真对待客户的问卷回答，\"偶尔头晕\"可能是潜在健康问题的信号（如心血管问题、低血糖等）。处理方式：1）进一步询问头晕的频率、持续时间、诱因；2）了解客户是否有家族病史、是否服药；3）根据筛查算法判断是否需要医学许可。医学许可不是\"不信任客户\"，而是确保客户在安全前提下运动的专业流程，是保护双方执业安全的必要步骤。\n\n答案：B。\"定期运动\"的定义是过去3个月内持续进行的、有一定规律性和时长的运动。B选项满足\"过去3个月\"+\"每周3次\"+\"每次45分钟\"的条件。A选项时间跨度不够（仅1个月），C选项虽然是日常活动但不一定是结构化的定期运动，D选项频率太低（每周仅1次）。\n\n需要的信息：高血压严重程度、是否服药、药物类型、血压控制情况、家族病史等。分析：每周3次×30分钟满足定期运动定义；高血压是疾病但无症状；力量训练强度通常为中等。如果满足定期运动条件，中等强度运动可能不需要医学许可，但建议获取医生许可以更好设计训练方案。"], [4, "思考与练习（续）", "答案：B。本章核心是理解筛查算法的逻辑框架，能根据客户的具体信息确定合适的下一步动作，而非死记硬背具体数据。筛查流程看似繁琐，但核心理念很清楚：在安全的前提下，帮助更多人开始并维持运动。遇到具体案例时，先画三轴，再查算法，最后决定下一步动作。"], [4, "思考与练习", "作为教练，应当认真对待问卷中勾选的任何阳性反应，即使客户口头解释为\"只是睡眠不足\"。\"偶尔头晕\"可能涉及心血管、前庭功能或药物副作用等多方面原因，不能仅凭客户自述排除风险。正确做法是：记录该阳性反应，建议客户先进行医学评估以明确原因，在获得医生许可前暂缓制定训练方案。医学许可和\"不信任客户\"的区别在于：医学许可是标准化的安全流程，适用于所有客户，目的是保护客户安全并明确教练执业边界；它针对的是健康风险本身，而非对客户诚信的质疑。沟通时应强调\"这是标准流程，每个人都一样\"，而非\"我不相信你说的\"。\n\n答案：B。\"定期运动\"的定义要求过去3个月及以上、每周≥3次、每次≥30分钟的规律性运动。A选项时间跨度不足3个月且频率偏低；C选项虽然每日活动量足够，但未明确是持续3个月的规律运动习惯，且步行强度较低；D选项频率不足（每周仅1次）。B选项同时满足频率（每周3次）、持续时间（每次45分钟≥30分钟）和时间跨度（过去3个月）三个条件。"], [4, "思考与练习（续）", "需要补充的信息包括：高血压的分级与严重程度（收缩压/舒张压具体数值）、是否正在服用降压药物及药物类型（如β-阻滞剂、利尿剂等，不同药物对运动反应有不同影响）、血压目前的控制情况、有无心血管疾病家族史、是否有其他合并症（如糖尿病、血脂异常）、既往运动经验特别是力量训练经验。根据已知信息分析：每周3次×30分钟的跑步满足\"定期运动\"的时间条件；高血压属于疾病但客户无症状；力量训练的初始强度通常为中等强度。按照筛查算法，如果该客户能确认过去3个月持续规律运动且为中等强度活动，理论上可不需要医学许可直接开始。但考虑到高血压本身是心血管疾病的标志物，且45岁男性属于风险因素聚集年龄段，建议获取医生许可以更全面地评估风险并制定安全的训练方案。"], [4, "思考与练习", "答案：B。本章的核心目标是让教练掌握筛查算法的逻辑框架，能够根据客户的具体信息（运动史、疾病状态、症状表现等）做出正确的分层判断并确定下一步行动。死记硬背药物列表（A）、症状列表（C）是低效的学习方式，关键是理解背后的决策逻辑；筛查流程是保护客户安全的必要步骤，不应随意跳过（D），理解何时适用简化流程是框架的一部分，但\"跳过\"本身不是学习目标。"], [4, "知识翻卡", "共 8 张知识卡片，点击翻转查看答案\n\n\n##### 运动前健康筛查操作清单\n\n\n- 所有客户填写 PAR-Q+ 问卷\n\n- 健康史问卷（既往病史、用药、手术、家族史）\n\n- 知情同意书签署\n\n- 身体活动准备问卷（PAR-Q+ 阳性 → 医学许可）\n\n- 健康危险分层（低风险/中风险/高风险）\n\n- 静息心率、血压测量\n\n- 体成分评估（体脂率、腰围）\n\n- 确定是否需要医学许可后才能开始运动\n\n- 根据风险分层选择合适的体适能测试\n\n- 记录所有筛查结果，建立客户档案\n\n\n---"], [5, "核心知识", "心血管循环系统为闭合循环系统，分为大循环与小循环，亦称为体循环和肺循环。大循环即体循环，是血液由心脏泵出流经全身的循环路径；小循环即肺循环，全身回流的静脉血汇入心脏后，依次流经右心房、右心室，再进入肺部。\n\n心血管系统是一个精密的闭合循环系统，血液在这个封闭管道中永不停歇地流动。系统分为两条主要回路：\n\n● 大循环（体循环）：血液从心脏出发，流经全身，再返回心脏\n\n左心室 → 大动脉 → 小动脉 → 毛细血管(物质交换) → 静脉 → 右心房\n\n● 小循环（肺循环）：血液从心脏出发，流经肺部，完成气体交换，再返回心脏\n\n右心室-肺（交换气体）-左心房（继而进入左心室进入大循环）\n\n血液在肺部完成气体交换，排出二氧化碳并重新充盈氧气后，回流至左心房，经二尖瓣进入左心室，再由左心室泵送至全身各处。\n\n由心脏泵出的血液称为动脉血，回流至心脏的血液称为静脉血；\n\n● 动脉血 ：动脉里的血（大部分为富氧血）\n\n● 静脉血： 静脉里的血 （大部分为缺氧血）\n\n例外是肺动脉（流的是缺氧血）和肺静脉（流的是富氧血）。\n\n💡 记住\"动出静回\"\n\n大循环中动脉流出的是富氧血，静脉流回的是缺氧血）。"], [5, "核心知识（续）", "小循环（肺循环）则相反：肺动脉流的是缺氧血，肺静脉流的是富氧血\n\n● 想象血液是一场物流配送：\n\n● 动脉是高速公路\n\n● 小动脉是城市道路\n\n● 毛细血管是最后100米配送点（真正的货物交换发生在这里）\n\n● 静脉是返程物流通道\n\n两大循环的核心对比：\n\n表5-5\n\n| 大循环\n\n| 体循环\n\n| 左心室\n\n| 右心房\n\n| 全身供氧、营养输送\n\n| 小循环\n\n| 肺循环\n\n| 右心室\n\n| 左心房\n\n| 肺部充氧、二氧化碳排出\n\n● 记住\"左出右回\"：\n\n● 左心室出发 → 全身跑一圈 → 右心房回来（大循环/体循环）\n\n● 右心室出发 → 肺部跑一圈 → 左心房回来（小循环/肺循环）"], [5, "核心知识", "肺循环的气体交换原理：\n\n缺氧血到达肺部 → 释放CO₂ → 吸收O₂ → 富氧血返回心脏\n\n● 肺部相当于氧气充气站：血液把\"废气\"卸载，留下\"新鲜氧气\"。\n\n心脏解剖结构分为四个腔室，先以上下划分心房与心室，再以左右区分，分别为左心房、左心室、右心房、右心室。\n\n图5-1\n\n心脏四腔室空间定位：\n\n● 上下结构：上方是\"接待室\"（心房），下方是\"发货部\"（心室）\n\n● 左右结构：左心负责全身供氧，右心负责肺部充氧\n\n● 口诀：\"上房下室，左富右贫\"\n\n人体血液输出均由心室完成，全身回流血液先汇入心房，再流入心室。\n\n💡 心脏是单向阀门系统：血液必须按\"心房→心室\"的顺序流动，绝不能倒流。心房是\"中转站\"，心室是\"发动机\"。\n\n左心室泵出的动脉血，从左心室出发为起点，流经全身毛细血管完成物质交换后回流；回流后的缺氧静脉血先汇入右心房，经三尖瓣流入右心室。"], [5, "知识点总结", "核心逻辑：\n\n• 心血管系统是闭合循环，分为体循环（大循环）和肺循环（小循环）\n\n• 心脏四腔室功能：上方心房接收血液，下方心室泵出血液\n\n• 左心系统服务全身供氧，右心系统服务肺部充氧\n\n• 动脉血≠动脉血管里的血，而是含氧量高的血\n\n互动考题：\n\n血液从左心室出发，流经全身后回到心脏，依次经过哪些结构？\n\n● 大循环：左心室→全身→右心房\n\n● 小循环：右心室→肺部→左心房\n\n● 口诀：\"左出右回，环环相扣\"\n\n● 血流方向：心房→心室→动脉，单向不逆流"], [5, "1.2 呼吸系统", "呼吸系统由鼻腔、咽、喉、气管、支气管和肺共同组成。\n\n呼吸系统器官层级：\n\n鼻腔 → 咽 → 喉 → 气管 → 支气管 → 细支气管 → 肺泡\n\n图5-2\n\n● 记住这条\"呼吸道\"就像一棵倒挂的树：\n\n● 树干是气管\n\n● 树枝是支气管\n\n● 树叶是肺泡（气体交换的真正场所）\n\n● 树根是鼻腔（空气过滤加温的第一站）\n\n需掌握核心重点：人体最主要的吸气肌为膈肌，膈肌也是全身骨骼肌中唯一维持生命所需要的 的骨骼肌；其余常规骨骼肌均非维持生命必需，仅有膈肌具备不可替代的生命基础功能。\n\n膈肌的独特地位：\n\n● 膈肌是呼吸的主发动机，● 其他骨骼肌（如肱二头肌、股四头肌）\"罢工\"人还能活\n\n● 膈肌一旦停止工作≈生命终止\n\n● 这就是为什么呼吸训练对健康至关重要\n\n● 口诀：\"膈肌是唯一，没有之一\"\n\n● 类比：膈肌是呼吸系统的\"心脏\"，其他肌肉都是\"辅助员工\"\n\n吸气时膈肌下降，呼气时膈肌上升；膈肌在胸腔内的运动原理，可类比针管活塞的启闭运动。\n\n膈肌运动原理："], [5, "1.2 呼吸系统（续）", "【吸气】膈肌下降 → 胸腔容积增大 → 气压降低 → 空气被\"吸入\"原理类似：注射器活塞向外拉 → 气体被吸入【呼气】膈肌上升 → 胸腔容积减小 → 气压升高 → 气体被\"挤出\"原理类似：注射器活塞向内推 → 气体被挤出\n\n● • 口诀：\"膈肌下行好进气，膈肌上行来吐气\"\n\n● • 类比：膈肌就像注射器的活塞，下拉抽药、上推给药\n\n• 呼吸系统核心是膈肌——唯一对生命至关重要的骨骼肌\n\n• 膈肌下降→胸腔扩大→吸气；膈肌上升→胸腔缩小→呼气\n\n• 类比针管活塞：下拉吸气、上推呼气\n\n为什么说膈肌是\"唯一对生命至关重要的骨骼肌\"？其他肌肉为什么不是？\n\n● 呼吸系统：鼻腔→咽→喉→气管→支气管→肺\n\n● 膈肌：呼吸主肌、生命的唯一、活塞运动"], [5, "2 心肺系统的生理机能", "心肺生理机能可归纳为三大核心过程：摄氧能力、输氧能力、用氧能力。\n\n● 第一和第三个均为\"摄氧能力\"，完整过程为携氧、氧输送与组织氧摄取\n\n● 氧气物流链三环节应为：摄氧(Intake)→输氧(Delivery)→用氧(Usage)\n\n● 口诀：\"一摄二输三用，氧气跑完全程\"\n\n● 类比：摄氧是\"进货\"，输氧是\"物流\"，用氧是\"消费\""], [5, "2.1 携氧能力", "摄氧能力由肺部通气量与血液血红蛋白两大要素构成。\n\n摄氧能力的两大支柱：\n\n表5-6\n\n| 肺部通气量\n\n| 肺、呼吸道\n\n| 空气进入血液的入口\n\n| 呼吸道疾病、肺部疾病\n\n| 血红蛋白\n\n| 血液\n\n| 氧气运输载体\n\n| 贫血、血红蛋白偏低\n\n● 类比：摄氧就像电商进货\n\n● 肺部通气量 = 平台流量（有多少货能进来）\n\n● 血红蛋白 = 配送车辆（有多少车能运货）\n\n● 肺部通气量 = 平台流量（有多少货能进来）；血红蛋白 = 配送车辆（有多少车能运货）\n\n若存在肺部或呼吸道疾病，肺部血氧含量会下降，直接导致运动能力降低。\n\n第一道关卡断裂：\n\n呼吸道/肺部疾病 → 氧气进不去 → 运动能力下降\n\n💡 肺部是氧气进入人体的\"安检口\"，安检口关闭，再好的心脏也白搭。\n\n运动强度过高时，血液二氧化碳浓度升高、氧气供应不足，会迫使运动者即刻停止运动，产生明显缺氧憋闷感。\n\n急性缺氧反应：\n\n● 运动强度超过摄氧极限\n\n● 氧气供不应求\n\n● CO₂堆积\n\n● 身体强制\"停机保护\""], [5, "2.1 携氧能力（续）", "血红蛋白浓度偏低或贫血人群，摄氧能力会受到限制，运动中极易产生疲劳感；运动时骨骼肌酸度上升、局部氧浓度下降，疲劳反应会更加明显。\n\n贫血对运动的影响：\n\n表5-7\n\n| 正常血红蛋白\n\n| 正常\n\n| 良好\n\n| 贫血/血红蛋白低\n\n| 受限\n\n| 疲劳、易喘\n\n● 血红蛋白 = 氧气的\"快递小哥\"\n\n● 小哥数量不够，再近的路也送不完货\n\n• 场景：客户抱怨运动时特别容易疲劳\n\n• 错误做法：认为是客户意志力不足\n\n• 正确做法：建议体检排查贫血或血红蛋白问题\n\n• 常见误区：忽视生理因素对运动能力的限制"], [5, "2.2 氧输送", "图5-3\n\n输氧能力核心公式：\n\n心输出量 = 心率（HR）× 每搏输出量（SV）\n\n即每分钟心脏总泵血量，由心率与单次心跳泵血量共同决定。\n\n心输出量公式：\n\n● 口诀：\"心跳快×每次多 = 泵血多多\"\n\n● 类比：心输出量 = 奶茶店每分钟卖出的杯数 = 客人数量(HR) × 每人买几杯(SV)\n\n心脏功能越强、每搏输出量越高，同等负荷下心率越低；若每搏输出量下降，心率会代偿性升高，以此保证全身组织血液与养分的稳定供应。\n\n心脏的代偿机制：\n\n表5-8\n\n| 训练有素\n\n| 高\n\n| 低\n\n| 心脏较弱\n\n● 训练有素的心脏 = 大排量发动机，每次喷油多，转速可以低\n\n● 较弱的心脏 = 小排量发动机，必须高转速才能维持动力\n\n● 口诀：\"SV高则HR低，训练让心脏更省力\"\n\n• 场景：向客户解释为什么运动员心率低\n\n• 错误做法：说\"运动员心脏有问题\"\n\n• 正确做法：解释\"运动员心脏泵血效率高，安静时不需要跳那么快\"\n\n• 常见误区：客户看到体检报告窦性心率过低会担心，其实这可能是心脏健康的信号"], [5, "2.3 氧摄取", "组织用氧能力，是身体组织利用氧气合成ATP供能的能力。\n\nATP——细胞的能量货币：\n\n葡萄糖 + 氧气 → 线粒体燃烧 → ATP（能量） + CO₂ + H₂O\n\n● ATP = 细胞的\"充电宝\"\n\n● 线粒体 = 充电宝的\"发电机\"\n\n● 有氧代谢 = 最稳定的发电模式（虽然功率不是最高）\n\n影响该能力最关键的因素为：线粒体的密度与体积。\n\n线粒体的核心地位：\n\n表5-9\n\n| 线粒体密度\n\n| 单位肌肉内线粒体数量\n\n| 线粒体体积\n\n| 每个线粒体的大小\n\n| 综合效果\n\n| 有氧氧化供能能力的上限\n\n● 线粒体 = 细胞的\"微型发电厂\"\n\n● 发电厂数量多、规模大 → 供电能力强\n\n● 口诀：\"线粒体多又大，有氧耐力顶呱呱\"\n\n● 核心结论：线粒体的密度与体积是影响组织氧摄取和有氧代谢能力的重要因素\n\n• 心肺生理三环节：摄氧→输氧→用氧，构成完整氧气物流链\n\n• 摄氧能力：肺部+血红蛋白决定氧气进入量\n\n• 输氧能力：心输出量=HR×SV，训练提升SV降低HR\n\n• 用氧能力：线粒体密度与体积决定有氧供能上限\n\n为什么马拉松运动员的静息心率通常比普通人低？"], [5, "2.3 氧摄取（续）", "● 心输出量 = HR × SV\n\n● 训练使SV↑，所以HR↓（代偿机制）\n\n● 线粒体 = 细胞的微型发电厂\n\n● 线粒体密度决定有氧耐力上限"], [5, "3.1 肌肉系统", "长期心肺训练可增加活动肌群的毛细血管密度，促进线粒体的数量、密度与功能改善，并提高肌糖原储备和利用氧的能力。"], [5, "3.2 心血管系统", "急性运动时，心率、每搏输出量和心输出量随工作需求变化。长期训练可使心脏泵血效率提高，并改善活动肌群的血流与氧输送能力。"], [5, "3.3 呼吸系统", "运动时，通气量会随代谢需求上升。心肺适能提高后，客户在相同亚极量工作负荷下往往能以更经济的呼吸反应完成运动。"], [5, "3.4 提高心肺适能所需时间", "训练适应通常在初期改善较快，随着体能提高，改善速率可能逐渐减慢。进程取决于起始体能、训练刺激、恢复、健康状态和个体差异，不应把某一时间点当作所有人的固定平台期。\n\n正式进入ACE IFT模式前，需掌握运动的身体适应原理。\n\n适应原理是训练科学的基础：不了解身体如何适应，就无法设计有效训练计划。\n\n运动学中\"适应\"定义：身体受到运动刺激后，产生的结构性与功能性改变，分为短期适应与长期适应。\n\n适应的时间维度：\n\n表5-10\n\n| 短期适应\n\n| 即刻~数小时\n\n| 可逆，停止训练即消失\n\n| 长期适应\n\n| 数周~数月\n\n| 结构改变，需要持续刺激维持\n\n● 短期适应 = 临时抱佛脚，考完就忘\n\n● 长期适应 = 真正学会的知识，刻进骨子里\n\n图5-4\n\n初次开展运动，心肺系统即刻产生适应性变化；最大摄氧量随运动负荷增加逐步提升，持续训练训练最初数月改善较快，随后改善速率可能逐渐减慢。\n\n适应的时间曲线："], [5, "3.4 提高心肺适能所需时间（续）", "最大摄氧量     ↑     │      ╭───────── plateau (平台期)     │     ╱     │    ╱     │   ╱     │  ╱     │ ╱     │╱     └────────────────────────→ 时间          6个月左右达到平台期（个体差异较大，体能基础越好提升越慢）\n\n同时身体会出现良性适应：毛细血管密度提升、线粒体密度与体积增大、肌肉糖原储存能力增强。\n\n三大适应性改变：\n\n表5-11\n\n| 毛细血管密度\n\n| 密度增加\n\n| 氧气交换效率增加\n\n| 线粒体\n\n| 数量↑ + 体积↑（发电厂扩建）\n\n| 氧化供能效率增强\n\n| 糖原储存\n\n| 肌肉糖原库更大（油箱变大）\n\n| 运动表现，耐力提升\n\n● 毛细血管↑ = 物流网点加密\n\n● 线粒体↑ = 发电厂扩容"], [5, "3.4 提高心肺适能所需时间", "● 糖原↑ = 油箱加大"], [5, "3.5 稳态和间歇性运动的生理适应", "稳态训练和高强度间歇训练都可用于改善心肺适能，但所需恢复、耐受性和适用人群不同。应先根据客户的健康筛查、当前体能和训练经验选择方式，再循序渐进地提高刺激。\n\nHIIT vs 稳态训练：\n\n表5-12\n\n| HIIT\n\n| 效率高、省时间\n\n| 体能良好者\n\n| 稳态有氧\n\n| 稳定、安全\n\n| 所有人，尤其体弱/慢病\n\n● HIIT = 加倍浓缩咖啡，效果猛但需谨慎\n\n● 稳态 =牛奶咖啡，稳定温和\n\n\"HIIT虽好，新手别急，安全第一\"\n\n• 场景：为体弱客户设计训练\n\n• 错误做法：推荐HIIT作为首选\n\n• 正确做法：从稳态有氧开始，逐步评估后再考虑HIIT\n\n• 常见误区：HIIT风靡不代表适合所有人\n\n所有心肺及体能训练，必须遵循渐进超负荷原则，需循序渐进提升训练强度，不可长期维持同一负荷，亦不可骤然加量。\n\n渐进超负荷原则：\n\n表5-13\n\n| 渐进\n\n| 逐步增加，不可一步到位\n\n| 超负荷\n\n| 强度略高于当前耐受水平\n\n| 禁忌\n\n| 不可长期同一负荷（平台期）\n\n| 不可骤然加量（受伤风险）\n\n• 适应是身体对运动刺激的结构性/功能性改变"], [5, "3.5 稳态和间歇性运动的生理适应（续）", "• 长期适应包括：毛细血管↑、线粒体↑、糖原↑\n\n• 渐进超负荷是心肺训练的核心原则\n\n• 6个月左右达到训练适应平台期（个体差异较大）\n\n为什么不能长期保持同一训练强度？\n\n● 适应 = 新刺激 → 新改变\n\n● 无新刺激 = 无新适应 = 停止进步\n\n● 10%法则：进阶幅度应保守，10%可作为部分情境下的参考上限，但不是适用所有客户的固定规则\n\n● 三大适应：毛细血管↑、线粒体↑、糖原↑\n\n● 渐进超负荷是核心原则"], [5, "4.1 在高温下运动健身", "运动中骨骼肌收缩会产生大量热量，身体需依靠体温调节系统维持稳态。\n\n产热与散热平衡：\n\n骨骼肌收缩 → 大量热量产生 → 体温升高                            ↓                    体温调节系统 → 散热\n\n💡 运动时身体是\"高性能引擎\"，必须配套\"散热系统\"才能正常运行。\n\n人体体温调节中枢位于大脑下丘脑；中枢感受器检测到体温升高后，下丘脑发出调节指令，使外周血管与皮肤小动脉扩张，向体表输送更多热量，同时激活小汗腺分泌汗液，通过散热途径带走体内余热。\n\n图5-5\n\n体温调节机制："], [5, "4.1 在高温下运动健身（续）", "体温升高 → 下丘脑检测到 → 下丘脑发出指令                              ↓              ┌───────────────┼───────────────┐              ↓               ↓               ↓        外周血管扩张    皮肤小动脉扩张     汗腺分泌              ↓               ↓               ↓        更多热量输送体表   热量散发      汗液蒸发散热\n\n● 下丘脑 = 体温的\"中央空调遥控器\"\n\n● 口诀：\"热了多散热，冷了少散热，全靠下丘脑\"\n\n人体热量散失有四种形式：辐射、传导、对流、蒸发。\n\n三种散热方式：\n\n图5-6\n\n表5-14\n\n| 辐射\n\n| 红外线形式传递，无需物理接触\n\n| 太阳照射、烤火取暖\n\n| 传导\n\n| 物理接触，热量由高温向低温传递\n\n| 冰敷、触摸冷物体\n\n| 对流\n\n| 依托空气/水流传递热量\n\n| 风吹凉快、游泳\n\n● 辐射 = \"隔空传功\"（无需接触）"], [5, "4.1 在高温下运动健身（续）", "● 传导 = \"贴身传输\"（必须接触）"], [5, "4.1 在高温下运动健身", "● 对流 = \"介质传输\"（风/水作为媒介）\n\n● 蒸发 = \"出汗降温\"（液态→气态带走热量，运动时主要散热方式）\n\n热量传导至皮肤表面后，可通过蒸发散热；汗液聚集足够热量后汽化变为水蒸气，进一步降低体表温度。\n\n蒸发散热原理：\n\n汗液分泌 → 吸收体表热量 → 汽化(液→气) → 带走热量 → 降温\n\n● 汗液 = 人体的\"天然空调\"，出汗即启动制冷模式\n\n● 出汗 = 启动空调制冷模式\n\n● 口诀：\"汗水一蒸发，热量全跑光\"\n\n运动中体温过高，会显著加重心脏负荷、降低运动表现，甚至引发安全风险。因此运动环境需保持凉爽、通风、氧气充足。\n\n高温运动的双重风险：\n\n表5-15\n\n| 心脏负荷↑\n\n| 心率代偿性升高，可能超出安全范围\n\n| 运动表现↓\n\n| 疲劳提前、力量下降\n\n| 安全风险\n\n| 严重时可危及生命\n\n● 高温运动 = 给发动机同时加压又加热\n\n● 危险等级极高\n\n• 场景：夏季户外训练\n\n• 错误做法：忽视环境温度，坚持原计划训练\n\n• 正确做法：选择凉爽时段、注重通风补水\n\n• 常见误区：室内有空调就安全？湿度也是重要因素"], [5, "高温相关疾病的识别与处理", "高温环境下体温异常升高，会引发两类高危急症：热衰竭、中暑，二者均需立即就医处置。\n\n高温急症的两大类型：\n\n表5-16\n\n| 热衰竭\n\n| < 40℃\n\n| 需立即处置+就医\n\n| 中暑\n\n| ≥ 40℃\n\n| 极高\n\n| 危及生命+必须就医\n\n● 口诀：\"衰竭40下，中暑40上\"\n\n● 40℃ = 生命警戒线\n\n● 热衰竭：体温升高但低于40℃，表现为大汗、面色苍白、皮肤湿冷；\n\n● 中暑：核心体温超40℃，表现为身体高热无汗、皮肤干燥潮红。\n\n热衰竭 vs 中暑 鉴别表：\n\n表5-17\n\n| 核心体温\n\n| 出汗\n\n| 大汗淋漓\n\n| 无汗（高热无汗）\n\n| 皮肤\n\n| 湿冷、苍白\n\n| 干燥、潮红\n\n| 意识\n\n| 可能清醒\n\n| 可能意识障碍\n\n| 处理\n\n| 降温+补液\n\n| 立即物理降温+急救\n\n● 热衰竭 = \"出汗过多+水分流失\" → 皮肤湿冷\n\n● 中暑 = \"散热系统崩溃\" → 无汗、干燥、高热\n\n● 口诀：\"热衰竭会出汗，中暑反而干\"\n\n现场急救流程：\n\n1. 立即转移至阴凉通风处；\n\n2. 热衰竭：抬高下肢，适量补充水分电解质；"], [5, "高温相关疾病的识别与处理（续）", "3. 中暑：脱去多余衣物，用湿毛巾、冰袋、风扇等全力物理降温；\n\n4. 无论热衰竭还是中暑，现场急救同时必须拨打急救电话。\n\n高温急症急救流程：\n\n● 热衰竭处理：补液为主（水分流失）\n\n● 中暑处理：降温为主（散热崩溃）\n\n● 口诀：\"衰竭补液，中暑降温，两者都打120\"\n\n• 场景：训练中客户出现中暑迹象\n\n• 错误做法：让客户继续运动\"出出汗就好了\"\n\n• 正确做法：立即停止训练，按流程急救\n\n• 常见误区：以为降温就是给头部冰敷，应该全身降温\n\n高温运动预防原则：\n\n1. 高温环境运动前，设置9～14天热适应期；\n\n2. 穿着透气通风运动服饰；\n\n3. 遵循科学补水方案。\n\n高温运动三大防线：\n\n表5-18"], [5, "高温相关疾病的识别与处理", "| 热适应\n\n| 运动前9-14天热适应训练\n\n| 装备\n\n| 透气、通风、浅色服装\n\n| 补水\n\n| 运动前/中/后科学补水\n\n● 口诀：\"热适应要9到14天，穿透气补水分\"\n\n运动补水标准：\n\n1. 运动前至少4小时：每公斤体重补充5～7ml水分；\n\n2. 运动中：依据实时体重流失量分次补水；\n\n3. 运动后：每丢失1kg体重，补充1.5L水分。\n\n科学补水时间表：\n\n表5-19\n\n| 运动前4小时\n\n| 5-7ml/kg\n\n| 提前储备\n\n| 运动中\n\n| 视体重流失\n\n| 分次少量\n\n| 运动后\n\n| 1.5L/kg\n\n| 重度回血\n\n● 运动前 = \"提前给油箱加油\"\n\n● 运动中 = \"边跑边补，别等没油\"\n\n● 运动后 = \"满油箱才安全\"\n\n● 口诀：\"前5-7ml、中分次、后1.5L\""], [5, "4.2 在低温下运动健身", "空气与水是主要寒冷刺激源；低温会引发血管收缩，升高外周血管阻力与血压，对高血压、心脏病人群风险较高。\n\n低温对心血管的影响：\n\n低温 → 血管收缩 → 外周阻力↑ → 血压↑ → 心脏负荷↑\n\n● 低温 = 血管\"热胀冷缩\"\n\n● 收缩的血管 = 更窄的通道 = 更高血压\n\n• 场景：寒冷天气户外运动\n\n• 错误做法：忽略低温对高血压/心脏病人群的风险\n\n• 正确做法：评估客户病史，寒冷天气减少户外训练\n\n• 常见误区：以为室内运动就不需要注意温度\n\n运动后体表带汗，会加速身体热量散失，极易受凉，该风险多见于户外运动，常规室内健身房影响较小。\n\n出汗后受凉风险：\n\n表5-20\n\n| 户外\n\n| 高（汗水带走大量热量）\n\n| 及时擦干、保暖\n\n| 室内\n\n| 正常即可\n\n● 汗水 = 移动的\"散热器\"\n\n● 运动后带汗在冷风中 = 持续失温"], [5, "4.3 在高海拔地区运动健身", "海拔分级标准：\n\n● 中高海拔：1500～2500m\n\n● 高海拔：2500～4300m\n\n海拔分级表：\n\n表5-21\n\n| 中高海拔\n\n| 1500-2500m\n\n| 中等\n\n| 高海拔\n\n| 2500-4300m\n\n● 口诀：\"1500到2500中高，2500以上算高危\"\n\n高海拔易诱发高原反应，训练遵循原则：\n\n1. 抵达高海拔首日，不安排任何训练；\n\n2. 适当延长热身与放松整理时长；\n\n3. 全程密切监测身体不适反应。\n\n高海拔运动三原则：\n\n表5-22\n\n| 首日休息\n\n| 抵达当天绝对禁止训练\n\n| 延长热身\n\n| 热身+放松时间加倍\n\n| 监测反应\n\n| 密切观察不适症状\n\n● 口诀：\"首日休息保平安，热身延长防意外\""], [5, "4.4 在空气污染环境运动健身", "空气污染可诱发心血管人群心肌缺血、心绞痛发作；可诱发哮喘人群气道炎症与病情急性发作。\n\n空气污染的双重威胁：\n\n表5-23\n\n| 心血管人群\n\n| 心肌缺血、心绞痛\n\n| 哮喘人群\n\n| 气道炎症、急性发作\n\n● 污染空气 = 呼吸系统的\"毒药\"\n\n● 心肺问题人群 = 高危易感人群\n\n需特别注意室内隐蔽污染：室内溜冰场丙烷燃料制冰机，易残留高浓度污染物，即便室内运动，也需关注空气质量，规避污染环境训练。\n\n● 口诀：\"室内不等于安全，空气质量要关注\"\n\n• 场景：为客户选择训练场所\n\n• 错误做法：只关注健身房设备，忽视空气质量\n\n• 正确做法：检查通风系统，避免污染环境\n\n• 常见误区：认为室内=安全，室外=危险\n\n• 环境因素（温度、海拔、污染）直接影响心肺运动安全\n\n• 高温防中暑（热衰竭<40℃ vs 中暑≥40℃）\n\n• 低温防血管收缩，高血压/心脏病人群风险高\n\n• 高海拔首日必须休息，9-14天热适应\n\n• 空气污染对心肺疾病人群威胁极大\n\n客户在高温环境下运动时出现大汗、面色苍白、皮肤湿冷，应如何判断和处理？\n\n● 热衰竭：<40℃、大汗、湿冷 → 补液+降温+120"], [5, "4.4 在空气污染环境运动健身（续）", "● 中暑：≥40℃、无汗、干燥 → 全力降温+120\n\n● 高海拔首日：禁止训练\n\n● 低温：防血管收缩，高血压/心脏病人群风险高\n\n● 运动补水：运动前前5-7ml/kg，运动后根据减少的体重补水，每减少1kg体重，补充1.5L"], [5, "5 出于健康和健身目的的心肺运动一般指南", "首先第一部分，先讲大众心肺运动通用指南，这套指南专门针对18-64岁成年人，先记两个核心重点知识点：\n\n1. 每周至少完成150分钟中等强度心肺训练，才能对身体健康产生明确益处；\n\n2. 坚持身体活动带来的健康收益，远大于运动受伤、突发风险的可能性。\n\n两大核心结论：\"每周150分钟，动比不动强\"\n\n表5-24\n\n| 最低标准\n\n| 每周150分钟中等强度（底线）\n\n| 收益对比\n\n| 运动收益 >> 运动风险\n\n很多人会有顾虑：平时久坐不动，突然开始运动，会不会出现猝死、受伤的情况？其实不必因此拒绝所有运动。依据2018年美国居民身体活动指南（美国公共卫生与公众服务部发布），可以帮助客户更客观地理解运动的获益与风险。"], [5, "一、心肺运动具体建议", "1. 任何活动量，都比完全不运动要好；尽量减少每日久坐时长，把碎片化活动均匀分布在一整天当中。\n\n运动理念：\n\n● 动一点比不动强\n\n● 碎片化活动积少成多\n\n● 均匀分布全天，避免长时间久坐\n\n● 口诀：\"动总比坐强，碎片也能量\"\n\n2. 每周运动标准：\n\n● 150~300分钟中等强度心肺训练；\n\n● 或75~150分钟高强度心肺训练；\n\n● 也可以中等+高强度两者结合；\n\n若运动总量超出以上标准，还能获得额外健康收益。\n\n每周运动标准表：\n\n表5-25\n\n| 中等强度\n\n| 150-300分钟\n\n| 门槛低、易坚持\n\n| 高强度\n\n| 75-150分钟\n\n| 效率高、需体能\n\n| 混合强度\n\n| 灵活组合\n\n| 最灵活\n\n| 超标\n\n| 更多\n\n| 额外收益\n\n● 中等强度 = 150-300分钟\n\n● 高强度 = 75-150分钟\n\n● 换算关系：1分钟高强度 ≈ 2分钟中等强度\n\n3. 每周至少安排2天，进行覆盖全身主要肌群的力量强化训练。\n\n力量训练要求：\n\n表5-26\n\n| 频率\n\n| 每周≥2天\n\n| 覆盖\n\n| 全身主要肌群\n\n● 心肺训练 + 力量训练 = 完整健身方案"], [5, "一、心肺运动具体建议（续）", "● 口诀：\"心肺每周150，力量两日起\""], [5, "二、心肺训练核心框架：FITTVP原则", "分别代表：F频率、I强度、T时长、T运动类型、V运动量、P进阶。\n\n图5-7\n\nFITTVP六大要素：\n\n● 口诀：\"频强时类量进阶，七字真言记心间\""], [5, "5.1 频率", "● 每周≥5天中等强度运动；\n\n● 或每周≥3天高强度运动；\n\n● 也可3~5天进行中高强度混合训练。\n\n运动频率标准：\n\n表5-27\n\n| ≥5天/周\n\n| ≥3天/周\n\n| 混合\n\n| 3-5天/周\n\n● 口诀：\"中等5天起，高强3天行\""], [5, "5.3 持续时间", "● 普通成年人：每天30~60分钟中等强度，或20~60分钟高强度；\n\n● 起步运动量：每周500~1000 MET-min（代谢当量·分钟），日常步数先达到每天≥2000步，循序渐进进阶到每天≥7000步，健康价值极高；\n\n● 单次运动建议持续10分钟以上；零基础、体能偏弱人群，从小于10分钟的短时运动开始，也有健康获益，只要动起来就比久坐好；\n\n● 运动进阶必须循序渐进，不可贸然加量。\n\n运动时长标准：\n\n表5-28\n\n| 普通成人\n\n| 30-60分钟\n\n| 20-60分钟\n\n| 零基础\n\n| <10分钟\n\n| 安全为前提\n\n表5-29\n\n| 2000步/天\n\n| 起步目标\n\n| 7000步/天\n\n| 高健康价值目标\n\n● 口诀：\"中等3060，高强2060，零基础动就够\"\n\n● 步数口诀：\"起步2000，健康7000\""], [5, "5.2 强度", "3.1 心率判定\n\n传统公式：最大心率=220-年龄，这个公式存在±12BPM误差，精准度不高，后续会给到更精准的估算公式。\n\n● 储备心率：最大心率 − 静息心率；\n\n● 靶心率（目标心率）：储备心率×目标强度（如60%） + 静息心率；\n\n按照60%~89%的强度区间，就能算出个人训练的目标心率区间。\n\n心率相关公式：\n\n1. 最大心率估算公式\n\n传统公式：最大心率（MHR）= 220 - 年龄 （误差±12BPM）Tanaka公式①：最大心率（MHR）= 208 - 0.7 × 年龄 （Tanaka公式，误差±7-8BPM）Gellish公式②：最大心率（MHR）= 207 - 0.7 × 年龄 （Gellish公式，适用于常运动人群）\n\n三个公式对比：220-年龄简单好记但误差大；Tanaka公式和Gellish公式都是基于人群数据建立的最大心率估算方法。所有年龄预测公式都存在个体误差，应使用ACE指定的方法，并结合RPE、谈话测试和客户的实际反应判断强度。\n\n2. 储备心率与靶心率公式"], [5, "5.2 强度（续）", "储备心率（HRR）= 最大心率 - 静息心率靶心率 = 储备心率 × 目标强度% + 静息心率\n\n示例计算（35岁，静息心率72BPM）：\n\n表5-30\n\n| 传统220-年龄\n\n| 185 BPM\n\n| 113 BPM\n\n| 140 BPM\n\n| 162 BPM\n\n| Tanaka公式\n\n| 183.5 BPM\n\n| 111.5 BPM\n\n| 139 BPM\n\n| 161 BPM\n\n| Gellish公式\n\n| 182.5 BPM\n\n| 110.5 BPM\n\n| 138 BPM\n\n| 160 BPM\n\n● 口诀：\"220减年龄，储备心率减静息，目标心率加回去\"\n\n● 类比：靶心率 = 保险箱密码，需要三步计算\n\n● 靶心率计算：\n\n● ①计算最大心率"], [5, "5.2 强度", "● ②最大心率-静息心率=储备心率\n\n● ③储备心率×强度%+静息心率=靶心率\n\n• 场景：为客户计算靶心率\n\n• 错误做法：直接用\"220-年龄\"作为靶心率上限\n\n• 正确做法：使用储备心率法，考虑静息心率差异\n\n• 常见误区：忽视±12BPM误差，靶心率应该是区间而非固定值\n\n3.2 RPE 自觉用力程度\n\n图5-8\n\n分两种量表：\n\n1. 经典博格量表 6~20分：数值×10可近似对应当下心率，6分对应静息、20分对应极限心率，但需要对照心率参考，繁琐且不够精准；\n\n2. 0~10分量表：0分完全不吃力，10分力竭极限。\n\nRPE量表对比：\n\n表5-31\n\n| 博格6-20\n\n| 6-20\n\n| 9-11\n\n| 12-13\n\n| 14-20\n\n| 0-10\n\n| 3-4\n\n| 5-6\n\n| 7-10\n\nRPE的局限性：\n\n新手容易低估运动强度；力量训练爱好者容易只关注肌肉酸胀，忽略呼吸频率，同样会低估心肺强度；部分肌肉发达人群做骑行、爬坡时，腿部无明显发力感，但呼吸已超负荷，极易误判强度。\n\n• 场景：客户说\"RPE只有6，很轻松\"\n\n• 错误做法：完全相信RPE，不做调整"], [5, "5.2 强度（续）", "• 正确做法：结合谈话测试、心率综合判断\n\n• 常见误区：把RPE当作唯一标准\n\n3.3 VO₂Max最大摄氧量 & 摄氧量储备\n\n摄氧量储备和心率储备逻辑一致；最大摄氧量可专业测试估算，但跑步机、扶手助力类器械测试结果误差较大。\n\n专业测试注意（需与主人确认）：\n\n● 最大摄氧量需要专业设备测量\n\n● 跑步机测试误差较大\n\n● 扶手助力会虚高结果\n\n● VO₂max = 心肺功能的\"马力\"指标\n\n3.4 MET 代谢当量（梅托）\n\n图5-9\n\n1MET = 人体完全静息状态下的氧气消耗量。\n\n强度划分标准：\n\n● ＜3MET：低强度；\n\n● 3~5.9MET：中等强度；"], [5, "5.2 强度", "● ≥6MET：高强度。\n\nMET强度分级：\n\n表5-32\n\n| <3\n\n| 低强度\n\n| 慢走、站立\n\n| 3-5.9\n\n| 快走、骑行\n\n| ≥6\n\n| 跑步、游泳\n\n● MET = 静息代谢的倍数\n\n● 3MET = 3倍静息代谢\n\n● \"3以下是低，3到6中等，6以上高强度\"\n\nMET实用价值：\n\n可以对照表格替换运动方式，比如没时间跑步机快走（5MET），可以用修剪草坪、搬运木材、打网球、羽毛球、投篮等同等MET值的活动替代。\n\n同时可通过MET精准计算热量消耗：体重(kg)×MET值×3.5×时间（分钟），换算氧气消耗后，除以1000（从毫升换成升）再乘以系数5，即可得出卡路里消耗；健身房有氧器械显示的MET值，可直接用来给会员计算热量。\n\n图5-10\n\nMET热量计算公式：\n\n热量消耗（kcal）≈ MET × 3.5 × 体重（kg）÷ 200 × 时间（分钟）\n\n示例：\n\n● 70kg客户，快走30分钟（5MET）\n\n5 × 3.5 × 70 ÷200 ×30= 183.75 kcal\n\n● 口诀：“MET乘体重乘时间，再乘0.0175。”\n\n• 场景：客户没时间跑步"], [5, "5.2 强度（续）", "• 错误做法：坚持必须跑步\n\n• 正确做法：用同等MET值的活动替代（如修剪草坪、打网球）\n\n• 常见误区：忽略MET替代原则\n\n3.5 换气阈值 VT1、VT2\n\n是运动强度的两个关键转折点，划分三个训练区间：\n\n● 低于VT1：低强度，脂肪主导供能，体内酸性物质堆积少，呼吸平稳；\n\n● VT1~VT2：中高强度，糖分开始大量参与供能，代谢酸性物质逐渐堆积，呼吸微微急促；\n\n● 高于VT2：极高强度，酸性物质堆积速度远超身体清除速度，呼吸急促、喘不上气。\n\n也是IFT训练模式三区划分的核心依据。\n\nVT1/VT2三区间模型："], [5, "5.2 强度", "● 帮助理解：\"VT1以下是轻松区，VT1-VT2是延展区，VT2以上是“恐慌区"], [5, "三、运动强度的6种判定方式（综合表格）", "表5-33\n\n| 代谢指标：VT1 和 VT2（HR 相对于 VT1 和 VT2）\n\n| 低于 VT1（HR < VT1）\n\n| VT1 至略低于 VT2（HR ≥VT1 至 < VT2）\n\n| VT2 及以上（HR ≥VT2）\n\n| • 基于 VT1 和 VT2 测量值• 理想情况下，在实验室利用代谢车和血乳酸测量 VT1 和 VT2• 现场评估相对易于进行，仅需要极少设备，并可提供精确的相应 VT1 和 VT2 HR• 通过利用代谢指标制定计划，可进行个性化计划制定\n\n| 谈话测试\n\n| 可以舒适地谈话；可以说话但不可以唱歌\n\n| 不确定谈话时是否舒适；暂停呼吸才能说出几个词\n\n| 绝对不能舒适地谈话\n\n| • 基于对增加的运动强度的生理适应所致的实际通气变化• 实际测量非常容易• 无需设备• 可以轻松地教给客户• 可进行个性化计划制定\n\n| RPE（术语）\n\n| 极弱至轻松\n\n| \"中等\"至\"有点费力\"\n\n| \"费力\"至\"非常费力\"\n\n| \"非常费力至极其费力至极限\"• 良好的主观强度指标• 与谈话测试、代谢指标和 %V̇O₂max 测量值的相关性良好• 易于教给客户"], [5, "三、运动强度的6种判定方式（综合表格）（续）", "| RPE（0 至 10 分量表）\n\n| 0.5 至 2\n\n| 3 至 4\n\n| 5 至 6\n\n| 7 至 10• 良好的主观强度指标• 与谈话测试、代谢指标和 %V̇O₂max 测量值的相关性良好• 0 至 10 分量表易于教给客户\n\n| RPE（6 至 20 分量表）\n\n| 9 至 11\n\n| 12 至 13\n\n| 14 至 17\n\n| ≥18• 良好的主观强度指标• 与谈话测试、代谢指标和 %V̇O₂max 测量值的相关性良好• 6 至 20 分量表不如 0 至 10 分量表易于教给客户• 注释：RPE 为 20 表示最大力度，不可持续进行此训练强度。\n\n| %V̇O₂R"], [5, "三、运动强度的6种判定方式（综合表格）", "| 30 至 39%\n\n| 40 至 59%\n\n| 60 至 89%\n\n| ≥90%• 需要 V̇O₂max 测量值，以最精确地制定计划• 由于评估设备较为昂贵，因此不切实际• 使用 V̇O₂max 预测值或 MHR 预测值导致误差增加• 计划制定的相对百分比基于人群，而不是特定于个人\n\n| %HRR\n\n| ≥90%• 需要 MHR 和 RHR 测量值，以最精确地制定计划• 对绝大多数教练和客户来说，MHR 测量都不切实际• 相对于严格的 %MHR，使用 RHR 会增加计划制定的个性化• 使用 MHR 预测值可能会引入较大的误差；误差大小取决于所使用的具体公式• 计划制定的相对百分比基于人群，而不是特定于个人\n\n| %MHR\n\n| 57 至 63%\n\n| 64 至 76%\n\n| 77 至 95%\n\n| ≥96%• 需要 MHR 测量值，以精确地制定计划• 对绝大多数教练和客户来说，MHR 测量都不切实际• 使用 MHR 预测值可能会引入较大的误差；误差大小取决于所使用的具体公式• 不包括 RHR，如 %HRR 中使用的那样• 计划制定的相对百分比基于人群，而不是特定于个人\n\n| MET"], [5, "三、运动强度的6种判定方式（综合表格）（续）", "| 2 至 2.9\n\n| 3 至 5.9\n\n| 6 至 8.7\n\n| ≥8.8• 需要 V̇O₂max 测量值，以最精确地制定计划• 与基于 V̇O₂max 的其他强度指标相比，更易于用于计划制定• 由于对给定活动的 MET 和/或得出 MET 估计值的设备的了解而使计划制定受限• 用于计划制定的相对 MET 范围是基于人群的范围，而不是特定于个人的范围（例如，先前久坐少动的客户最初可能感觉 5-MET 活动为剧烈运动）\n\n| %V̇O₂max\n\n| 37 至 45%\n\n| 46 至 63%\n\n| 64 至 90%"], [5, "三、运动强度的6种判定方式（综合表格）", "| ≥91%• 参见 %V̇O₂R• 实际测量是个性化的，并非基于预测"], [5, "四、大众心肺训练时长&核心原则", "1. 永远遵循：练就比不练好；以客户自身需求、体能耐受度、运动可持续性为核心，不一刀切；\n\n2. 运动量可一次性完成、分段完成、累计完成，均有健康价值；\n\n3. 热量消耗标准：每周消耗1000大卡，即可改善血压、胆固醇等基础健康指标；每周≥2000大卡，健康收益翻倍；\n\n4. 进阶增量原则：每周总运动时长，最多在上周基础上增加10%，切忌激进加量；\n\n5. 高强度循环训练、间歇训练，均可计入每日/每周心肺活动总量。\n\n心肺训练五大原则：\n\n表5-34\n\n| 态度原则\n\n| 练比不练好，个性化不一刀切\n\n| 累积原则\n\n| 一次性/分段/累计均可\n\n| 热量原则\n\n| 1000大卡/周=基础收益，2000大卡/周=翻倍收益\n\n| 进阶原则\n\n| 每周增量≤10%\n\n| 计数原则\n\n| HIIT/循环可计入总量\n\n● 口诀：\"练就好、累积算、热量翻、10%增、HIIT算\""], [5, "5.4 类型", "只要满足大肌群参与、有节奏、可持续数分钟以上，都属于心肺训练：\n\n1. 常规类：走路、跑步、骑行、划船、游泳、爬楼梯、椭圆机；\n\n2. 球类：网球、羽毛球（单打跑动更多，心肺训练效果优于双打）；\n\n3. 器械类：跑步机、滑雪机、划船机、椭圆机；注意：跑步机倚靠扶手会让器械消耗估值高于实际，数据有偏差；\n\n4. 循环训练：多站点轮换训练（如Kinrox模式），调动不同肌群，训练效率高；\n\n5. 户外类：健步走、滑雪、攀岩、徒步等。\n\n心肺训练类型图鉴：\n\n表5-35\n\n| 常规类\n\n| 走路/跑步/骑行/游泳\n\n| 最基础、易坚持\n\n| 球类\n\n| 网球/羽毛球\n\n| 单打比双打效果好\n\n| 器械类\n\n| 跑步机/划船机/椭圆机\n\n| 莫倚扶手，数据才准\n\n| 循环训练\n\n| Kinrox等\n\n| 效率高\n\n| 户外类\n\n| 健步走/滑雪/攀岩\n\n| 注意环境安全\n\n● 口诀：\"大肌群有节奏能持续，都是心肺训练\"\n\n● 跑步机避坑：扶手是数据刺客\n\n• 场景：客户在跑步机上扶着扶手跑步\n\n• 错误做法：不纠正，让客户以为消耗很高\n\n• 正确做法：提醒松开扶手，手臂自然摆动"], [5, "5.4 类型（续）", "• 常见误区：跑步机数据显示的消耗可能虚高"], [5, "5.5 运动进阶", "图5-11\n\n1. 超负荷原则（不破不立）：想要身体产生适应和改变，训练强度需略高于当前体能耐受水平；\n\n2. 专项性原则（种瓜得瓜）：训练内容和训练强度和赛事需求必须匹配，\n\n3. 进阶节奏：前4~6周按每周10%增量；养成习惯后，可调整频率、强度，加入间歇训练、法特雷克训练、循环训练等模式。\n\n三大进阶原则：\n\n表5-36\n\n| 强度略高才能适应\n\n| 不破不立\n\n| 专项性\n\n| 训练内容匹配目标\n\n| 种瓜得瓜\n\n| 进阶节奏\n\n| 10%增量，循序渐进\n\n| 稳扎稳打\n\n● 超负荷口诀：\"不破不立\"\n\n● 专项性口诀：\"种瓜得瓜，种豆得豆，连啥补啥\"\n\n● 10%法则：\"进阶幅度应保守，10%可作为部分情境下的参考上限，但不是适用所有客户的固定规则\"\n\n• 场景：客户急于求成要加量\n\n• 错误做法：满足客户要求，快速加量\n\n• 正确做法：坚持10%法则，解释渐进超负荷的重要性\n\n• 常见误区：认为\"练得越多越好\""], [5, "5.6 减少久坐时间的FITT", "积极的“沙发土豆”仍然是土豆---很多人日常有规律运动，但依旧长期久坐，代谢风险依然很高。\n\n久坐的危害：\n\n● 即使每天运动1小时\n\n● 剩余时间久坐\n\n● 代谢风险依然很高\n\n● 类比：每天锻炼1小时，就像每天集中一小时对爱人表达“我爱你”——抵消不了其余时间的冷漠\n\n建议每1~2小时中断一次久坐，起身活动5~10分钟；\n\n低强度活动即可（＜3MET、低于VT1强度）：慢走、拉伸、原地小跑、简单活动；\n\n小技巧：刻意走远路上厕所、工位简单拉伸、接水时原地轻度小跑；\n\n规律打断久坐，能大幅降低代谢类疾病风险。\n\n运动零食处方：\n\n表5-37\n\n| 每1-2小时一次\n\n| 时长\n\n| 5-10分钟\n\n| 强度\n\n| <3MET，低于VT1\n\n● 口诀：\"1-2小时动5分，强度要低\"\n\n● 积分制：走远路上厕所=1分，拉伸=1分，接水小跑=1分\n\n• 场景：上班族客户久坐工作\n\n• 错误做法：只强调每天运动1小时\n\n• 正确做法：推广\"运动零食\"概念，打破久坐\n\n• 常见误区：认为运动只有\"正餐\"才算运动\n\n• 大众心肺指南：每周150分钟中等强度或75分钟高强度"], [5, "5.6 减少久坐时间的FITT（续）", "• FITTVP是心肺训练计划设计的六大要素\n\n• 六种强度判定方式各有优劣，需综合使用\n\n• 短时、分散的低强度活动是打断久坐的实用方式\n\n• 10%可作为某些情境下的保守进阶参考，实际调整应依据客户反应\n\n一名40岁客户静息心率70BPM，使用储备心率法计算其60%~80%强度的靶心率区间。\n\n计算步骤参考：\n\n1. 计算最大心率 (MHR)\n\n公式：使用Gellish 公式：206.9−(0.67×年龄)\n\n计算：206.9−(0.67×40)=206.9−26.8=180.1≈180 BPM\n\n2. 计算储备心率 (HRR)\n\n公式：最大心率 (MHR)−静息心率 (RHR)"], [5, "5.6 减少久坐时间的FITT", "计算：180−70=110 BPM\n\n3.计算靶心率 (THR) 区间\n\n公式：靶心率=(储备心率×强度%)+静息心率\n\n下限 (60% 强度)：(110×60%)+70=66+70=136 BPM\n\n上限 (80% 强度)：(110×80%)+70=88+70=158 BPM\n\n该客户 60%~80% 强度的靶心率区间为 136 - 158 BPM\n\n● FITTVP：频强时类量进阶\n\n● 靶心率：220-年龄-静息心率，再乘强度加回静息\n\n● VT1/VT2：区分三区训练强度\n\n● 运动零食：每1-2小时动5-10分钟"], [5, "6 心肺适能评估", "心肺适能评估用于了解客户当前的有氧工作能力，为运动强度选择、计划起点和后续复测提供依据。评估前必须先完成运动前健康筛查，并根据客户的健康状态、体能水平、运动经验和评估目的选择合适方法。"], [5, "6.1 亚极量评估", "亚极量评估不要求客户达到最大运动能力，而是通过特定的亚极量工作负荷，结合心率、自感用力度、谈话反应和完成情况，估计客户的心肺适能。评估过程中应持续观察客户反应；如出现胸部不适、明显头晕、异常呼吸困难或其他警示体征与症状，应终止评估并按相应程序处理。\n\n亚极量评估的价值在于用可控的负荷了解客户的心肺反应，而不是追求力竭。评估结果应与筛查信息、客户目标和实际运动表现一起解读。"], [5, "7 心肺锻炼课程模块", "一次完整的心肺锻炼课程通常由热身、调节阶段和放松三部分组成。三个模块共同服务于安全、训练效果和课程连续性，不应只关注中间的主训练部分。"], [5, "7.1 热身活动", "热身通过低到中等强度的渐进活动，逐步提高心率、通气量、体温和局部血流，使客户从静息状态平稳过渡到调节阶段。热身的形式应与后续训练相衔接，时间和进阶速度根据环境、训练强度和客户状态调整。"], [5, "7.2 调节阶段", "调节阶段是心肺训练的主要工作部分。教练根据客户当前所处的IFT阶段，按FITT-VP原则设定频率、强度、持续时间、类型、运动量和进阶，并在训练中结合心率、RPE、谈话测试及客户的动作与症状反应进行监测。"], [5, "7.3 放松", "放松阶段将运动强度逐步降低，让心率、血压、呼吸和静脉回流平稳恢复。不宜在高强度运动后突然完全停止，尤其要关注服用降压药、容易头晕或存在体位性低血压风险的客户。\n\n热身负责逐步进入训练，调节阶段承担主要训练刺激，放松负责平稳恢复。这三部分应根据客户和训练情境统一设计。"], [5, "模型概述", "IFT模式依据VT1、VT2阈值，划分为第一区、第二区、第三区。\n\nIFT三区架构：\n\nIFT模式共分三期，每一期分别对应专属训练区域、训练强度标准，同时明确是否需要进阶及进行相应评估。\n\nIFT三期总览：\n\n| 第一期\n\n| 基础训练\n\n| 建立习惯\n\n| 可以连续至少20分钟1区稳态有氧运动\n\n| 稳态\n\n| 无需评估\n\n| RPE3-4 小于vt1\n\n| 第二期\n\n| 健身训练（可终生停留）\n\n| 提升耐力\n\n| 可终生停留，有耐力项目赛事需求的人才需要进阶\n\n| 间歇\n\n| VT1\n\n| 在等于或略高于vt1（2区）和小于vt1（1区）做间歇\n\n| 第三期\n\n| 运动表现（长时间耐力项目赛事需求的人群）\n\n| 专项竞技\n\n| 无\n\n| VT2\n\n| 70%‑80% 的时间处于 ＜VT1（1区）；＜10% 的时间处于 VT1~VT2（2区）；10%‑20% 的时间处于 ≥VT2（3区）\n\n表5-38\n\n关于减脂，很多学习者对心肺训练都存在一定误解，首先IFT模式是用于改善健康直到增加运动表现，并没有哪一期是单独服务于减脂的，只要热量消耗大于摄入，任何一期都可以实现减脂。\n\n重要澄清："], [5, "模型概述（续）", "● IFT没有\"减脂专属期\"\n\n● 任何一期只要热量消耗>摄入，都能减脂\n\n● 减脂的核心是热量差，不是训练类型\n\n第二，IFT心肺训练的运动表现是基于长时间耐力项目中有短暂冲刺和加速的需求。如皮划艇，马拉松，铁人三项等项目。如果单纯的冲刺，加速，属于IFT肌肉训练第三阶段。\n\n运动表现定义澄清：\n\n● IFT的运动表现特指：包含短暂冲刺的长时间耐力项目\n\n● 例如：马拉松、铁人三项、皮划艇\n\n● 不包括：单纯短跑/爆发力（属于抗阻训练范畴）"], [5, "8.1 基础训练", "图5-12\n\n1. 阶段核心定位\n\n本阶段核心为养成中低强度运动习惯、改善基础健康，无需提前评估体能，可直接开始训练。\n\n第一期定位：\n\n● 无需提前评估体能，可直接开始\n\n● 核心：养成中低强度运动习惯\n\n● 目标：改善基础健康\n\n● 训练区间：100% Zone 1（低于VT1）\n\n● 口诀：\"基础训练阶段不要求先完成运动表现评估，先把习惯立\"\n\n2. 进阶判定标准\n\n学员能够连续运动至少分钟，即可满足本阶段进阶基础条件。\n\n第一期进阶条件：\n\n● 标准：连续运动至少20分钟\n\n● 无需考虑速度、强度\n\n● 口诀：\"一期过关卡，30分钟不歇\"\n\n3. 阶段价值意义\n\n本阶段入门门槛低，简单易执行，既能帮助人群改善身体健康状态，也更容易长期坚持、维持运动习惯。\n\n第一期价值：\n\n● 入门门槛低，无需体能基础\n\n● 简单易执行，操作成本小\n\n● 更容易长期坚持，维持运动习惯\n\n● 收益/风险比极高（适合多数已完成筛查且能安全开始运动的人群）\n\n● 类比：第一期是健身的\"新手村\"，安全、简单、练级\n\n4. 理论支撑"], [5, "8.1 基础训练（续）", "运动训练中格外重视低强度基础性训练。卡沃南（Karvonen, 1957）提出基于心率储备的靶心率计算方法，观察到强度低于50% HRR（约60% MHR）的训练难以产生显著训练效果，明确了有效训练的强度范围。\n\n结合现代习惯养成理论，如《原子习惯》中微习惯建立逻辑：微小且易执行的行动，更易养成长期稳定习惯，这也是教练制定基础训练计划的核心依据。\n\n图5-13\n\n5. 训练计划设定\n\n1. 初始训练频次：每周仅需运动2-3次，每次时长10-15分钟。\n\n2. 进阶硬性条件：每周坚持3-5次运动，每次运动时长20分钟及以上，稳定持续即可进阶。\n\n3. 负荷进阶原则：每一次训练进阶，负荷提升幅度不应超过10%。"], [5, "8.1 基础训练", "4. 阶段停留周期：因人而异，部分人群仅需停留两周，体能基础较弱者可停留六周以上，以个人实际体能状况为准。\n\n5. 主观用力等级：本阶段RPE控制在3-4级。\n\n第一期训练参数：\n\n表5-39\n\n| 2-3次/周\n\n| 3-5次/周\n\n| 10-15分钟\n\n| 20+分钟\n\n| RPE\n\n| 3-4级\n\n| -\n\n| 进阶增量\n\n| ≤10%"], [5, "8.2 健身训练", "图5-14\n\n入门条件：\n\n● 必须通过VT1测试\n\n● 教练需掌握测试方法\n\n进入本阶段首要核心：完成VT1第一通气阈测试，人体在该阈值下会出现明显生理拐点，所有专业教练必须熟练掌握VT1测试方法。\n\n● 口诀：\"二期第一关，VT1测试先\"\n\n2. 训练核心逻辑\n\n本阶段训练以VT1阈值为核心，开展区间间歇训练，训练强度围绕高于VT1、略低于VT1交替进行。\n\n第二期训练逻辑：\n\n● 以VT1为核心参照点，训练强度围绕VT1上下波动\n\n● 采用间歇训练模式（略高于/略低于VT1交替）\n\n● 口诀：\"二期围绕VT1，上下波动做间歇\"\n\n3. 阶段适用人群\n\n本阶段是绝大多数运动人群终身停留的训练阶段。\n\n第二期适用性：\n\n● 适用人群：绝大多数人\n\n● 定位：终身训练阶段\n\n● 口诀：\"健身训练阶段能满足大多数客户长期改善心肺适能的需要\"\n\n4. 进阶准入条件\n\n仅针对长时间耐力项目有竞技需求、竞赛参赛需求的客户，可进一步进阶至运动表现阶段。\n\n第二期进阶条件：\n\n● 有长时间耐力项目竞技需求\n\n● 需要比赛/竞赛\n\n● 口诀：\"二期进阶看需求，耐力竞赛才进三\"\n\n5. 概念区分说明"], [5, "8.2 健身训练（续）", "本体系中的运动表现定义，区别于日常泛化的运动表现概念；特指长时间耐力项目的比赛与竞技需求人群。\n\n例：短跑项目不属于本阶段范畴，短跑归属于抗阻训练第三期；本阶段适配耐力项目中存在短暂爆发力需求的人群。\n\n重要区分：\n\n● 短跑 = 抗阻训练第三期（爆发力）\n\n● 马拉松/铁三 = IFT第三期（耐力表现）"], [5, "8.3 运动表现训练", "图5-15\n\n进入第三期门槛：\n\n● 必须通过VT2测试\n\n进入本阶段需完成VT2第二通气阈测试，教练需熟练掌握VT2测试逻辑与判定标准。\n\n2. 训练时间区间占比\n\n● 70%-80% 训练时间：一区训练（强度低于VT1）\n\n● 不足10% 训练时间：二区训练\n\n● 10%-20% 训练时间：三区训练\n\n第三期极化训练比例：\n\n● 核心思想：高质量高强度训练+大量低强度恢复\n\n3. 区间训练底层原理\n\n1. 训练阈值高于VT1，可有效刺激提升VT1能力；\n\n2. 训练阈值高于VT2，可有效刺激提升VT2能力；\n\n3. 运动表现阶段训练核心目标为三区高强度训练，强度需突破VT2。\n\n4. 在运动表现阶段的极化训练设计中，教练通常将大部分训练时间安排在一区，并保留少量高质量三区训练。二区训练量较低是这种特定模型的结构特征，不代表二区训练对所有客户都没有价值。\n\n训练区间与适应效果：\n\n表5-40\n\n| 一区\n\n| <VT1\n\n| 恢复、低强度基础\n\n| 二区\n\n| VT1~VT2\n\n| 极化训练中的中等强度区域（效率低）\n\n| 三区\n\n| >VT2\n\n| 提升运动表现"], [5, "8.3 运动表现训练（续）", "● 极化训练中的中等强度区域口诀：\"二区黑洞坑人狠，累得像三区，效果在二区\"\n\n5. 阶段适配人群\n\n仅适用于耐力项目中需要反复提速、反复加速冲刺的人群；单纯特定爆发力需求的训练，本质归属于肌肉抗阻训练，不纳入本阶段。\n\n第三期适配人群：\n\n● 长时间耐力项目\n\n● 需要反复冲刺/加速的竞技人群\n\n● 注意：单纯爆发力需求属于抗阻训练范畴，不纳入本阶段\n\n6. 训练注意事项\n\n本阶段训练强度高、负荷大，计划设计过程中需重点防范过度训练综合症，合理分配整体训练压力，同步配套科学恢复方案，训练与恢复并重。\n\n第三期安全要点：\n\n● 重点防范过度训练综合症，合理分配整体训练压力"], [5, "8.3 运动表现训练", "● 训练与恢复并重，同步配套科学恢复方案\n\n● 口诀：\"三期强度大，过度训练要防它\""], [5, "三期对比总结", "表5-41\n\n| 核心定位\n\n| 提升有氧耐力\n\n| 前置评估\n\n| VT1测试\n\n| VT2测试\n\n| 主要供能\n\n| 脂肪为主\n\n| 糖+脂肪混合\n\n| 糖+磷酸原\n\n| 训练强度\n\n| RPE 3-4级\n\n| VT1附近波动\n\n| 突破VT2\n\n| 训练模式\n\n| 阈值间歇\n\n| 极化训练\n\n| 强度分配\n\n| 100%一区\n\n| 以一区为主\n\n| 70/10/20\n\n| 进阶标准\n\n| 连续20-30分钟\n\n| 耐力竞技需求\n\n| 预防过度训练\n\n| 负荷原则\n\n| ≤10%增量\n\n| 围绕VT1\n\n| 适用人群\n\n| 所有人\n\n| 大多数人\n\n| 耐力运动员\n\n• IFT模式三期：基础训练→健身训练→运动表现\n\n• 第一期：无评估，建习惯，1区训练\n\n• 第二期：测VT1，围绕阈值间歇，大多数人终点站\n\n• 第三期：测VT2，极化训练（70/10/20），仅限耐力运动员\n\n• 在特定的极化训练设计中，二区训练的占比通常较低，但并不意味着该区域没有训练价值\n\n为什么说IFT第二期是\"大多数客户的终点站\"？什么情况下需要进阶到第三期？\n\n● 一期建习惯（无评估，Zone 1）"], [5, "三期对比总结（续）", "● 二期提耐力（VT1测试，阈值间歇）\n\n● 三期专表现（VT2测试+极化训练70/10/10-20）\n\n● 运动表现阶段中，二区的训练占比应服务于项目和周期目标"], [5, "一、核心回顾", "本章核心：心肺训练的核心是改善人体携氧、输氧和摄取氧的整体能力，IFT模式通过三期进阶设计，从习惯养成到运动表现，循序渐进地提高心肺适能。"], [5, "三、考前必背表", "表5-42\n\n| 解剖\n\n| 心血管循环\n\n| 体循环+肺循环，左心室泵出、右心室泵向肺部\n\n| 呼吸核心\n\n| 膈肌=唯一对生命至关重要的骨骼肌\n\n| 生理\n\n| 心输出量公式\n\n| CO = HR × SV\n\n| 氧气物流链\n\n| 摄氧→输氧→用氧\n\n| 适应\n\n| 三大适应\n\n| 毛细血管↑、线粒体↑、糖原↑\n\n| 环境\n\n| 热衰竭vs中暑\n\n| <40℃/大汗 vs ≥40℃/无汗\n\n| 补水标准\n\n| 前5-7ml/kg，后1.5L/kg\n\n| 指南\n\n| 每周标准\n\n| 150分钟中等 或 75分钟高强度\n\n| FITTVP\n\n| 频强时类量进阶\n\n| IFT\n\n| 三期核心\n\n| 一期RPE3-4，二期VT1，三期VT2+极化"], [5, "四、自检清单", "表5-43\n\n| 1\n\n| 能画出心血管体循环和肺循环的完整路径吗？\n\n| □完全 □部分 □不会\n\n| 2\n\n| 能解释为什么膈肌是唯一对生命至关重要的骨骼肌吗？\n\n| 3\n\n| 能写出并解释心输出量公式吗？\n\n| 4\n\n| 能区分热衰竭和中暑的症状和处理方法吗？\n\n| 5\n\n| 能计算储备心率和靶心率区间吗？\n\n| 6\n\n| 能解释VT1和VT2的生理意义吗？\n\n| 7\n\n| 能区分IFT模式三个阶段的定位和适用人群吗？\n\n| 8\n\n| 能解释什么是\"极化训练中的中等强度区域\"现象吗？"], [5, "六、章末三件事", "表5-44\n\n| 复习\n\n| 背诵心输出量公式CO=HR×SV、靶心率计算方法\n\n| 实践\n\n| 计算自己的靶心率区间，体验IFT Zone 1训练\n\n| 思考\n\n| 设计一份从IFT第一期过渡到第二期的12周计划框架\n\n肌肉训练：基础、益处和计划设计\n\n第6章"], [5, "思考与练习", "以下题目来自本章自测，点击展开参考答案。\n\n计划框架应包含：第1-4周（IFT第一期/基础训练）以低强度稳态有氧为主（RPE 3-4，VT1以下），每周3次，每次20-30分钟，重点建立有氧基础；第5-8周过渡期逐步引入VT1附近的间歇训练，频率维持3-4次/周，单次时长增至30-40分钟；第9-12周（IFT第二期/健身训练）加入VT1-VT2区间的间歇训练，每周安排1-2次高强度间歇课和2次稳态恢复课。全程需包含热身5-10分钟和放松5-10分钟，并根据客户主观疲劳感受动态调整强度。\n\n答案：D。A正确：IFT三期对应脂肪供能→混合供能→糖酵解主导供能；B正确：靶心率=（220-年龄-静息心率）×强度%+静息心率；C正确：VT1是第一通气阈，呼吸开始显著增加；D正确：以上全部正确。"], [5, "知识翻卡", "共 12 张知识卡片，点击翻转查看答案\n\n\n##### 心肺训练处方设计清单\n\n\n- 确定客户心肺训练目标（减脂/耐力/健康维持）\n\n- 选择强度指标：%HRR 或 %VO2R 或 RPE\n\n- 计算靶心率范围（Karvonen公式）\n\n- 确定频率：中等≥5天/周 或 高强度≥3天/周\n\n- 确定时间：≥30分钟中等 或 ≥20分钟高强度\n\n- 选择方式：考虑客户偏好、关节状况、设备可用性\n\n- 制定渐进计划：每1-2周增加不超过10%训练量\n\n- 教授自我监控方法（心率监测、RPE、谈话测试）\n\n- 记录每次训练的心率、时长、RPE、主观感受\n\n- 定期评估并调整处方（每4-6周）\n\n\n---"], [6, "1.1 骨骼系统", "● 成人骨骼由206块骨头组成\n\n● 骨骼的主要功能：支撑身体、保护内脏、提供杠杆系统、储存矿物质、产生血细胞\n\n\n##### 关节类型\n\n\n表6-6\n\n| 滑膜关节\n\n| 可动关节，                       有关节囊和滑液\n\n| 肩关节、膝关节、髋关节\n\n| 软骨关节\n\n| 活动受限，有软骨缓冲\n\n| 椎间盘、耻骨联合\n\n| 纤维关节\n\n| 几乎不可动\n\n| 颅骨缝、胫腓关节"], [6, "1.2 神经系统", "神经系统接收感觉信息、组织运动输出，并通过运动单位募集和发放频率调节肌肉张力。肌肉训练初期的力量提升往往与神经系统适应密切相关。"], [6, "1.3 肌肉系统", "● 骨骼肌（随意肌）：有横纹受意识控制\n\n● 心肌：有横纹但不受意识控制，心脏特有\n\n● 平滑肌（不随意肌）：无横纹，不受个体意识控制"], [6, "2 结缔组织", "表6-7\n\n| 肌腱\n\n| 连接肌肉与骨骼，           传递力量\n\n| 肌肉两端\n\n| 韧带\n\n| 连接骨与骨，稳定关节\n\n| 关节周围\n\n| 软骨\n\n| 减震、减少摩擦\n\n| 关节面、椎间盘\n\n| 筋膜\n\n| 连接、包裹、 分离肌肉和器官\n\n| 全身\n\n【教练提示】\n\n客户抱怨\"膝盖痛\"，但说拍了X光显示骨头没问题。\n\n建议：可能是软骨磨损或韧带问题。软骨没有血管，营养靠关节滑液扩散。关节活动时滑液流动加快，扩散效率更高，所以适度活动反而有利于软骨健康。 这解释了为什么\"休息不动\"不是关节问题的最佳解决方案。"], [6, "3.1 肌肉动作的类型", "表6-8\n\n| 屈曲（Flexion）\n\n| 减小关节角度\n\n| 弯曲肘关节、弯腰\n\n| 伸展（Extension）\n\n| 增大关节角度\n\n| 伸直肘关节、站直\n\n| 外展（Abduction）\n\n| 远离身体中线\n\n| 手臂侧举\n\n| 内收（Adduction）\n\n| 靠近身体中线\n\n| 手臂放下\n\n| 旋转（Rotation）\n\n| 绕骨长轴转动\n\n| 转头"], [6, "3.2 动力链运动", "表6-9\n\n| 矢状面\n\n| 前后分割\n\n| 屈曲/伸展\n\n| 额状面\n\n| 左右分割\n\n| 外展/内收\n\n| 水平面\n\n| 上下分割\n\n| 旋转\n\n● 关节运动方向：\n\n● 屈伸前后矢状面\n\n● 展收左右额状面\n\n● 旋转横切水平面"], [6, "3.3 灵活性和稳定性", "人体动作需要某些环节提供足够活动度，同时需要其他环节提供稳定与控制。教练应根据客户的具体动作表现判断限制来源，不应将所有动作问题简化为“不够柔软”。"], [6, "3.4 平衡和校准", "平衡是在支撑面上管理重心的能力；校准则是身体各节段之间的相对位置关系。两者会影响动作效率、负荷分配和训练技术。"], [6, "4 肌肉训练的益处", "##### 身体成分改善 身体成分\n\n\n● 增加肌肉质量、减少体脂肪，两者共同提高基础代谢率\n\n\n##### 骨骼健康\n\n\n● 增加骨密度\n\n● 降低骨质疏松风险\n\n\n##### 代谢健康\n\n\n● 改善胰岛素敏感性\n\n● 帮助血糖控制\n\n● 改善血脂谱\n\n● 降低慢性炎症水平\n\n\n##### 功能能力\n\n\n● 提高日常生活能力\n\n● 改善平衡和稳定性\n\n● 增强运动表现\n\n\n##### 心理健康\n\n\n● 减轻焦虑和抑郁\n\n● 提高睡眠质量\n\n● 改善自尊和自我形象"], [6, "5 肌肉训练的生理适应：急性适应和长期适应", "##### 急性适应（运动中）\n\n● 心率、血压、每搏输出量增加\n\n● 肌肉血流量重新分配\n\n● 能量物质消耗（ATP、PCr、糖原）\n\n##### 长期适应（训练后）\n\n● 肌纤维肥大（肌肉体积增加）\n\n● 肌纤维增生（肌肉细胞数量增加，在人体中尚无定论，主流观点认为人类肌肉增长主要依靠肌纤维肥大而非增生）\n\n● 神经适应（早期力量提升的主要来源，包括运动单位募集增加、放电频率提高等）\n\n● 结缔组织强化（肌腱、韧带更坚韧）\n\n● 骨密度增加\n\n重要：训练初期的力量提升主要来自神经适应（神经系统更有效地募集、激活肌肉），而不是肌肉变大。肌纤维肥大通常需要更长时间才能显现。\n\n● 早期力量提升来源：\n\n● 初期力量↑ = 主要来自于神经适应\n\n● 后期肌肉↑ = 肌纤维截面积增加，表现为肌肥大\n\n● 【教练提示】\n\n● 场景：客户抱怨\"练了一个月，肌肉没变大，是不是训练没效果？\""], [6, "5 肌肉训练的生理适应：急性适应和长期适应（续）", "● 建议：回应：肌肉外观并不是判断训练效果的唯一指标。训练初期的力量增长通常更多来自神经适应，即身体逐渐学会更有效地完成动作和调动相关运动单位。肌肉肥大通常需要持续、渐进的训练刺激，并受到训练量、营养、睡眠、恢复和个体差异的影响。\n\n力量与肌肉肥大的发展会受训练史、神经适应、训练负荷与运动量、营养与恢复、年龄、性别及个体差异等多种因素共同影响。教练应记录客户的训练负荷、重复次数、动作质量和身体围度，综合判断训练进展，使用客户的实际反应调整计划，不宜以单一变量解释所有训练结果。"], [6, "6 肌肉训练原则", "表6-10\n\n| 渐进超负荷（Progressive Overload）\n\n| 随着身体产生适应，逐步提高训练刺激\n\n| 增加负重、重复次数、组数、动作难度、频率或减少休息间隔；避免同时大幅增加多个变量\n\n| 专一性（Specificity）\n\n| 身体产生的适应与所接受的训练刺激相关\n\n| 根据目标、动作模式、活动需求、速度、负荷和关节活动范围选择训练内容\n\n| 可逆性（Reversibility）\n\n| 长期停止或显著减少训练后，训练适应可能逐渐减弱\n\n| 短期休息不等于退步；长期中断后应根据当前能力逐步恢复训练\n\n| 效果递减（Diminishing Returns）\n\n| 随着训练水平提高，相同刺激产生的改善通常会减小\n\n| 初学者初期使用基础计划即可进步明显；训练经验丰富者需要更精细的计划调整和恢复管理\n\n● 训练原则记忆口诀：\"超专可效个适\"\n\n● 超（超负荷）= 不破不立\n\n● 专（专一性）= 中挂都挂种豆得豆\n\n● 可（可逆性）= 用进废退\n\n● 效（效果递减）= 边际效益递减\n\n● 【注意】个体差异和适应性是训练计划设计的相关概念，ACE教材核心训练原则为上四项。"], [6, "6.1 进阶", "随着客户适应当前刺激，训练需求应循序渐进地调整。"], [6, "6.2 专一性", "训练适应与实际训练的动作、负荷、速度和代谢需求密切相关。"], [6, "6.3 超负荷", "要产生新的适应，训练刺激需适度高于客户当前已适应的水平。"], [6, "6.4 可逆性", "训练刺激显著减少或停止后，已获得的适应可能逐渐减退。"], [6, "6.5 效果递减", "随着体能水平提高，相同训练刺激所带来的额外改善通常会逐渐减少。"], [6, "7 肌肉训练变量和计划设计", "表6-11\n\n| 负荷\n\n| 阻力重量\n\n| 1-RM的50%-100%\n\n| 重复次数（Reps）\n\n| 一次完整的动作\n\n| 1-20+次\n\n| 组数（Sets）\n\n| 一组连续动作\n\n| 1-10+组\n\n| 休息间隔\n\n| 组间恢复时间\n\n| 30秒-5分钟\n\n| 训练频率\n\n| 每周训练次数\n\n| 1-7次\n\n| 训练量\n\n| 负荷×重复×组数\n\n| 综合计算"], [6, "7.1 需求评估", "根据客户目标、健康筛查、训练经验、动作能力和可用资源确定计划起点。"], [6, "7.2 训练频率", "频率需与总运动量、训练经验、客户时间和恢复能力相匹配。"], [6, "7.3 运动选择和顺序", "选择能够服务客户目标且可以安全执行的动作；通常优先安排需要较高技术、速度或多关节协调的动作。"], [6, "7.4 训练量", "训练量综合反映组数、次数和负荷，应与目标及恢复状态一起调整。"], [6, "7.5 训练强度", "强度可用相对于最大能力（1RM）的负荷、可完成次数和自感用力程度等方式表示。"], [6, "7.6 训练节奏", "动作速度和离心、过渡、向心各阶段的时间会改变技术要求和肌肉受力时间。"], [6, "7.7 休息间歇", "组间休息应根据训练目标、负荷、训练量和客户当前的恢复情况设置。"], [6, "8 肌肉训练课程的组成部分", "表6-12\n\n| 热身\n\n| 有氧/动态拉伸/目标肌群激活\n\n| 5-10分钟\n\n| 主体训练\n\n| 主要训练动作和计划\n\n| 20-45分钟\n\n| 冷身\n\n| 整理放松/静态拉伸"], [6, "8.1 热身活动", "通过全身性活动和与主训练相关的渐进练习，使客户过渡到训练状态。"], [6, "8.2 体能训练", "根据评估结果和客户目标完成当日的主要肌肉训练内容，并持续监测动作质量与疲劳反应。"], [6, "8.3 放松", "逐步降低活动强度，整理训练反馈，并根据客户的需要安排适当的恢复性活动。"], [6, "模型总体架构", "ACE整合式健身训练（ACE Integrated Fitness Training®, ACE IFT®）模型是整个ACE-CPT体系的核心框架。肌肉训练部分分为三个递进阶段：\n\n负荷/速度训练（Load/Speed Training）  ← 第三阶段        ↑动作训练（Movement Training）         ← 第二阶段        ↑功能性训练（Functional Training）     ← 第一阶段\n\n核心逻辑：先建立姿势稳定性和动力链灵活性（功能），再训练高效动作模式（动作），最后发展力量/爆发力/耐力（负荷/速度）。\n\n不能跳步。 这是IFT模型最重要的原则： 跳过前面的阶段盲目追求力量和运动表现好比是拔苗助长。\n\n● 「功能 → 动作 → 负荷」三级火箭：\n\n● • 第一级（功能）：\"地基\"打好： 站得稳、关节灵活\n\n● • 第二级（动作）：\"动作\"做好： 屈髋、单腿、推、拉、旋转\n\n● • 第三级（负荷）：“上强度和速度”： 力量、耐力、爆发力"], [6, "模型总体架构（续）", "把\"客户有经验\"等同于\"客户动作正确\"。经验不等于动作模式正确，很多资深训练者可能带着错误的动作模式练了很多年。\n\n【思考】\n\nIFT三阶段的核心逻辑在于 能力递进。 每一阶段都是在前一阶段建立的能力基础上叠加新要求。正所谓循序渐急，客户的训练起点和进阶应由评估结果与实际表现决定，不宜在基础能力未满足时过早增加负荷或速度要求。"], [6, "2.1 IFT抗阻第一期--功能训练 的训练重点", "● 改善姿势稳定性（Postural Stability）和动力链灵活性（Kinetic-Chain Mobility）\n\n● 建立或重建关节功能\n\n● 通过改善以下能力实现目标：\n\n● 姿势稳定相关：核心功能（Core Function）、静态平衡（Static Balance）、动态平衡（Dynamic Balance）\n\n● 关节功能相关：柔韧性（Flexibility）、肌肉耐力（Muscular Endurance）\n\n● 功能性训练 = 站得稳 + 关节活：\n\n● 站得稳 → 姿势稳定性 → 核心功能 + 静态平衡 + 动态平衡\n\n● 关节活 → 动力链灵活性 → 柔韧性 + 关节活动度"], [6, "2.2 对应评估", "图6-1\n\n表6-13\n\n| 静态姿势评估\n\n| 直角规则（前面观/后面观/侧面观）\n\n| 发现姿势偏差和肌肉不平衡\n\n| 姿势偏差识别\n\n| 表10-1至10-4：脊柱前凸/驼背/平背/摇摆背\n\n| 定位紧张/伸长的肌群\n\n| 歪斜评估\n\n| ①距下关节旋前/旋后 ②髋内收 ③骨盆倾斜 ④肩部姿势 ⑤头部姿势\n\n| 逐关节排查动力链问题\n\n| 静态平衡\n\n| 单脚站立测试（睁眼/闭眼）\n\n| 评估跌倒风险、日常生活能力、下背痛风险\n\n| 动态平衡\n\n| Y平衡测试\n\n| 评估双腿对称性，识别下肢损伤风险（前后差异>4cm=高风险）\n\n| 核心耐力\n\n| McGill躯干肌肉耐力测试组合\n\n| 评估核心肌群平衡：屈曲/伸展比<1.0，侧桥比0.95-1.05背痛风险指标\n\n| 柔韧性\n\n| 托马斯试验（髋屈肌）/ 被动直腿抬高（腘绳肌）/ 肩部屈曲伸展\n\n| 评估关键肌群长度是否正常\n\n表6-14\n\n| 足与踝\n\n| 足内翻\n\n| 前面观、后面观\n\n| 足底向内；外侧足缘承重增加；跟骨可能内翻；常伴距下关节旋后、胫骨与股骨外旋\n\n| 胫骨前肌、胫骨后肌；腓肠肌和比目鱼肌可能限制踝背屈"], [6, "2.2 对应评估（续）", "| 腓骨长肌、腓骨短肌及足踝外侧稳定肌群\n\n| 足外翻\n\n| 足底向外；内侧足缘承重增加；足弓可能下降；跟骨外翻；常伴距下关节旋前、胫骨与股骨内旋\n\n| 腓骨肌群；ACE还提示腓肠肌和比目鱼肌复合体的紧张可能影响跟骨位置和踝背屈\n\n| 胫骨后肌、足底内在肌及足踝内侧稳定肌群\n\n| 膝关节\n\n| 膝超伸\n\n| 侧面观\n\n| 膝关节超过中立伸展位置，膝后侧受压；重力作用线通常位于膝关节前方\n\n| 股四头肌、腓肠肌和比目鱼肌可能参与维持过伸姿势\n\n| 腘绳肌、腘肌及膝关节动态稳定肌群可能控制不足\n\n| 髋与骨盆\n\n| 髋内收／髋上提\n\n| 后面观"], [6, "2.2 对应评估", "| 一侧髂嵴高于另一侧；上提侧股骨相对内收；躯干或骨盆可能发生侧移\n\n| 上提侧腰方肌、躯干侧屈肌或髋内收肌可能紧张，应进一步确认\n\n| 上提侧髋外展肌群，尤其臀中肌、臀小肌及外侧髋部稳定肌可能拉长或控制不足\n\n| 骨盆\n\n| 骨盆前倾\n\n| 髂前上棘向下、向前旋转；腰椎前凸通常增加\n\n| 髋关节屈肌、竖脊肌\n\n| 腘绳肌、腹直肌；臀肌和腹部稳定肌也可能控制不足\n\n| 骨盆后倾\n\n| 髂前上棘向上、向后旋转；腰椎前凸通常减小\n\n| 腹直肌、腘绳肌\n\n| 身体区域\n\n| 姿势偏差\n\n| 主要观察姿势\n\n| 关节及身体排列\n\n| 疑似紧张／缩短或活动过度的肌肉\n\n| 疑似拉长／稳定不足或活动不足的肌肉\n\n| 脊柱\n\n| 脊柱前凸\n\n| 腰椎前凸增加，通常伴骨盆前倾；髋关节可能保持屈曲趋势\n\n| 髋关节屈肌、腰椎伸肌／竖脊肌\n\n| 髋关节伸肌、腹直肌、腹外斜肌及腹部稳定肌群\n\n| 脊柱后凸\n\n| 胸椎后凸增加；肩部可能前伸或圆肩；头部可能前移\n\n| 胸部和前肩肌群、背阔肌、颈椎伸肌\n\n| 上背部伸肌、肩胛稳定肌群、颈椎屈肌\n\n| 平背"], [6, "2.2 对应评估（续）", "| 腰椎前凸减小，骨盆通常后倾；胸椎曲线可能变平，头部可能前移\n\n| 腹直肌、上背部伸肌、颈椎伸肌、腘绳肌\n\n| 髂腰肌、腹内斜肌部分纤维、腰椎伸肌、颈椎屈肌\n\n| 摇摆背\n\n| 骨盆向前平移并后倾；髋关节过伸；胸椎后凸增加；躯干上部向后倾斜；头部可能前移\n\n| 腘绳肌、腹内斜肌上部纤维、部分腰椎伸肌和颈椎伸肌\n\n| 髂腰肌、腹外斜肌、上背部伸肌、颈椎屈肌\n\n| 脊柱侧凸\n\n| 脊柱在额状面出现侧向曲线，通常伴椎体旋转；肩、肩胛骨、腰线和骨盆可能不对称\n\n| 凹侧躯干侧屈肌、旋转肌及部分腰方肌可能缩短或活动过度\n\n| 凸侧躯干稳定肌可能拉长或控制不足；具体肌肉取决于侧凸方向和旋转情况\n\n表6-15\n\n| 肩部\n\n| 高低肩"], [6, "2.2 对应评估", "| 一侧肩峰、锁骨或肩胛骨高于另一侧；肩胛骨可能伴随上提或下压\n\n| 高肩侧上斜方肌、肩胛提肌、菱形肌\n\n| 高肩侧下斜方肌和肩胛下压稳定肌可能不足；低肩侧情况需结合侧屈和负重习惯评估\n\n| 肩关节\n\n| 肱骨内旋\n\n| 前面观\n\n| 手背明显朝前，肘窝不朝前；肱骨头内旋，可能伴圆肩\n\n| 胸大肌、背阔肌、肩胛下肌\n\n| 冈下肌、小圆肌等肩外旋肌群\n\n| 肩胛骨\n\n| 肩胛骨前伸\n\n| 后面观、侧面观\n\n| 肩胛骨向外、向前移动；肩胛骨内侧缘远离脊柱；常伴圆肩\n\n| 胸小肌、胸大肌等前侧胸肌群；部分个体可能伴前锯肌活动过度\n\n| 菱形肌、中斜方肌等肩胛后缩稳定肌群\n\n| 翼状肩胛\n\n| 肩胛骨内侧缘或下角明显离开胸廓，呈翼状突出\n\n| 不能单独根据翼状肩胛确定紧张肌；胸小肌紧张可能影响肩胛位置\n\n| ACE明确提示前锯肌可能拉长或稳定能力不足；也应评估下斜方肌和肩胛稳定肌群\n\n| 头颈\n\n| 头部前引／头部前倾姿势\n\n| 头部向前平移，耳垂位于肩锁关节前方；通常表现为上颈椎伸展、下颈椎相对屈曲\n\n| 颈椎伸肌、上斜方肌、肩胛提肌\n\n| 深层颈屈肌及颈椎前侧稳定肌群\n\nY平衡测试关键点："], [6, "2.2 对应评估（续）", "● 测试前部（ANT）、后内侧（PM）、后外侧（PL）三个方向\n\n● 计算双腿对称性差异\n\n● ⚠ 前部差异>4cm（1.6英寸）= 下肢损伤高风险"], [6, "2.3 进阶条件", "● 客户在功能性评估中表现出良好的姿势稳定性和动力链灵活性\n\n● 核心功能达标（McGill比值在正常范围内）\n\n● 平衡能力达到年龄对应的正常水平\n\n● 关键肌群柔韧性正常（无严重紧张限制动作）"], [6, "2.4 对应人群", "● 久坐少动的新手客户\n\n● 存在姿势偏差、肌肉不平衡的客户\n\n● 需要建立基础核心稳定性的客户\n\n● 老年人（重点：平衡+核心+柔韧性）\n\n● 术后/伤后恢复期的客户（需医学许可后）\n\n● 所有新客户均从功能性训练阶段开始"], [6, "2.5 McGill核心耐力比值（必背重点）", "比值公式：\n\n● 屈曲:伸展 < 1.0（例：120s/150s = 0.80 ）\n\n● 右侧桥:左侧桥 在 0.95-1.05 之间（例：88s/92s = 0.96 ）\n\n● 侧桥(任一侧):伸展 < 0.75（例：88s/150s = 0.59 ）\n\n● 屈曲/伸展比 < 1.0 → 屈肌不能比伸肌耐力强太多（伸肌是脊柱的主要稳定肌）\n\n● 侧桥比 0.95-1.05 →（约等于1） 左右要近乎对称\n\n● 侧桥/伸展 < 0.75 → 侧向稳定肌耐力不应超过伸展肌耐力的75%。\n\n● 场景：客户McGill测试结果：屈肌耐力180秒，伸肌耐力100秒，屈伸比=1.80。\n\n● 建议：这个比值明显超出正常范围（>1.0）。说明他的\"腹肌\"（屈肌）比\"后背\"（伸肌）强太多。这种不平衡容易容易导致脊柱长期保持屈曲状态，从而导致下背痛。\n\n● 【常见误区】：看到客户腹肌耐力强觉得很棒，继续加强核心屈曲训练。\n\n● 【建议】：发现比值失衡，优先加强伸肌耐力训练。\n\n● 常见误区：只关注客户\"能做什么\"，不关注\"肌肉平衡\"。"], [6, "2.5 McGill核心耐力比值（必背重点）（续）", "● 【思考】McGill测试评估的核心目标是脊柱稳定肌群的协调能力。下背部健康关键在肌肉力量的均衡。这解释了为什么很多常年训练\"腹肌发达\"的人容易腰痛，很多情况下这些训练者的肌肉力量呈现不均衡。"], [6, "知识点总结", "IFT1期的功能训练，会员的核心，及各关节稳定灵活的功能过关后，将为IFT2期的动作训练做好准备。\n\n互动考题：\n\n● 一位客户Y平衡测试前部差异为6cm，说明什么？应该怎么调整训练计划？               ◦ 答案： 差异>4cm，提示下肢损伤风险。需要加强髋外展肌群（臀中肌）和踝关节稳定性训练，暂缓进阶到动作训练阶段。\n\n● 功能性训练 = 站得稳 + 关节活\n\n● 评估覆盖：姿势、平衡、核心耐力、柔韧性\n\n● McGill比值：屈伸<1.0，左右对称，侧桥<75%（0.75）"], [6, "3.1 训练重点", "● 在功能性训练建立的关节活动度（ROM）的 基础上，教导客户5种主要动作模式（5 Primary Movement Patterns）的高效执行\n\n● 核心目标：在不影响姿势或关节稳定性的前提下，在所有三个运动平面有效地进行5种主要动作\n\n● 训练侧重从\"能不能动\"升级为\"能不能正确地动\""], [6, "3.2 五种主要动作模式", "表6-16\n\n| 屈髋提起（Hinge/Hip Lift）屈髋提起/弯腰提起（Bend and Lift / Hinge）\n\n| 坐椅子/从椅子上站起来/蹲下捡东西\n\n| 深蹲（Squat Pattern)\n\n| 单腿（Single-Leg）\n\n| 步行/上下楼梯/弓箭步\n\n| 高台阶跨步（Step-up）\n\n| 推（Push）\n\n| 推门/俯卧撑/过头推举\n\n| 俯卧撑稳定性（Shoulder push stabilization)\n\n| 拉（Pull）\n\n| 拉车门/引体向上/划船\n\n| 站姿划船(Standing Row)\n\n| 系安全带/高尔夫挥杆/从侧方捡物\n\n| 胸椎灵活性旋转(Thoracic spine mobility)\n\n● 五种动作模式记忆口诀：\n\n● \"屈单推拉旋\"： 弯腰捡东西是屈髋（屈），上下楼梯是单腿（单），推门是推（推），拉车门是拉（拉），转身是旋转（旋）。\n\n● 常见误区：认为\"训练动作\"和\"日常动作\"完全不同。"], [6, "3.2 五种主要动作模式（续）", "● ✓ 正确理解：5种动作模式都是从日常生活提炼出来的。训练动作是日常动作的\"标准化版本\"。客户学会正确的训练动作 = 学会更高效地完成日常动作。"], [6, "3.3 三个运动平面", "表6-17\n\n| 将身体分为左右两半，    运动方向为前后（屈曲/伸展）\n\n| 走路（抬腿）、深蹲上下\n\n| 额状面（冠状面）\n\n| 将身体分为前后两半，   运动方向为左右（外展/内收）\n\n| 侧向跨步、侧平举\n\n| 水平面（横截面）\n\n| 将身体分为上下两半，运动方向为旋转\n\n| 转身、挥杆、                   跑步时躯干扭转\n\n思考：● 为什么要在三个运动平面内训练？\n\n因为日常生活和运动很少只发生在单一平面内。真正的功能性训练需要让身体在所有平面上都能有效地运动和发力。"], [6, "3.4 对应评估", "图6-2\n\n表6-18\n\n| 屈髋提起\n\n| 深蹲模式（5-10次自然深蹲）（Squat Pattern)\n\n| 前面观：足旋前？膝内移？躯干偏移？侧面观：脚跟着地？臀肌/四头肌主导？大腿平行？腰/胸椎过度弯曲？\n\n| 单腿\n\n| 前面观：足稳定性？膝内扣？髋内收>2英寸？侧面观：踝背屈不足？躯干前倾？\n\n| 推\n\n| 侧面观：翼状肩胛？下背部下陷/过度伸展？\n\n| 拉\n\n| 侧面观：腰部过伸？后面观：肩胛抬升/外展？头部前移？\n\n| 躯干能否在双侧各实现45度旋转？是否存在双侧差异？\n\n详细的五大动作 的评估\n\n深蹲模式评估常见代偿表\n\n表6-19\n\n| 足部\n\n| 踝关节向内塌陷、足部外翻或足部向外旋转\n\n| 比目鱼肌、腓肠肌外侧头、腓骨肌群\n\n| 腓肠肌内侧头、胫骨肌群及足踝稳定肌；臀中肌、臀大肌和部分髋部稳定肌也可能控制不足\n\n| 膝盖向内移动，即动态膝外翻\n\n| 髋内收肌群、阔筋膜张肌\n\n| 臀中肌、臀大肌\n\n| 躯干\n\n| 躯干向一侧偏移或旋转\n\n| 可能与单侧主导、关节负荷期下肢稳定性不足或肌肉不平衡有关\n\n| 单侧核心及髋部稳定肌群，需结合其他评估确认"], [6, "3.4 对应评估（续）", "| 脚跟无法保持接触地面\n\n| 比目鱼肌紧张；踝背屈不足\n\n| ACE原表没有为此列出固定的活动不足肌肉\n\n| 髋与膝\n\n| 动作从膝关节开始，膝盖过早向前移动，呈“四头肌主导”\n\n| 股直肌及髋关节屈肌可能处于主导地位\n\n| 臀肌群活动不足\n\n| 无法使大腿顶部接近与地面平行\n\n| 比目鱼肌紧张可能限制踝背屈，使胫骨向前移动受限；也可能存在动作技术或关节活动度限制\n\n| 臀肌、下肢稳定肌可能控制不足，需进一步评估\n\n| 膝后侧\n\n| 腘绳肌明显挤压小腿后侧\n\n| 不能单独归因于腘绳肌紧张，可能与下蹲深度、身体结构和动作策略有关\n\n| 肌力不足或动力学控制不良可能影响下蹲稳定性\n\n| 腰椎"], [6, "3.4 对应评估", "| 背部过度拱起，即腰部主导\n\n| 髋关节屈肌、竖脊肌、背阔肌\n\n| 核心肌群、腹直肌、臀肌群、腘绳肌\n\n| 背部或躯干过度向前倾斜\n\n| 背阔肌、胸大肌、胸小肌；也可能与踝背屈不足、髋活动度或动作策略有关\n\n| 核心肌群、臀肌群、上背部伸肌\n\n| 头部向下\n\n| 髋关节和躯干屈曲程度增加；也可能是视觉或动作控制问题\n\n| 头颈中立位控制不足\n\n| 头部向上\n\n| 颈椎伸肌局部压迫和紧缩\n\n| 深层颈屈肌控制可能不足"], [6, "单腿模式评估——高台阶跨步", "评估时，客户以单腿支撑完成高台阶跨步。分别从正面和侧面观察足、膝、髋、骨盆、躯干及抬高腿的位置。\n\n表6-20\n\n| 支撑足\n\n| 足部稳定性不足，足外旋、足弓下降或踝关节内翻／外翻\n\n| 比目鱼肌、外侧腓肠肌、腓骨肌群\n\n| 内侧腓肠肌、胫骨肌群、臀中肌、臀大肌；必要时检查股薄肌和缝匠肌的控制\n\n| 支撑膝\n\n| 膝关节向内移动，膝盖不能保持与第二脚趾方向一致\n\n| 臀中肌、臀大肌及其他髋外展、外旋肌\n\n| 支撑髋\n\n| 髋部向内移动超过约5.1厘米，或支撑腿明显内旋\n\n| 髋内收肌群、阔筋膜张肌、支撑腿髋内旋肌\n\n| 臀中肌、臀大肌、支撑腿髋外旋肌\n\n| 对侧骨盆下沉、骨盆旋转或支撑侧髋部向外偏移\n\n| 支撑腿髋内收肌及可能限制骨盆控制的髋部肌群\n\n| 支撑侧臀中肌、臀大肌及躯干侧向稳定肌\n\n| 躯干侧倾、前倾或旋转\n\n| 不宜仅凭观察指定某一块紧张肌肉，应进一步检查髋部和躯干两侧的活动度\n\n| 核心稳定肌群、腹斜肌、臀中肌及其他骨盆稳定肌群\n\n| 抬高腿\n\n| 抬高腿偏离矢状面，膝向内或向外移动\n\n| 抬高腿的髋内收肌、髋内旋肌或髋外旋肌，具体取决于偏移方向"], [6, "单腿模式评估——高台阶跨步（续）", "| 抬高腿相反方向的髋部控制肌群\n\n| 抬高腿高度不足\n\n| 踝背屈不足、髋屈不足，或通过抬高骨盆代偿\n\n| 踝跖屈肌、抬高腿的髋伸肌；支撑腿髋屈肌也可能限制髋关节正常运动\n\n| 踝背屈肌、抬高腿髋屈肌、支撑腿髋伸肌\n\n| 腰椎和骨盆\n\n| 躯干前倾并伴骨盆前倾、腰椎伸展增加\n\n| 支撑腿髋屈肌、腰椎伸肌\n\n| 腹直肌、腹斜肌、臀肌及其他核心稳定肌\n\n| 骨盆后倾或躯干过度屈曲\n\n| 腹直肌、髋伸肌\n\n| 支撑腿髋屈肌及躯干伸展稳定肌\n\n观察要点：重点比较左右两侧。若只有一侧出现膝内移、骨盆下沉或躯干侧倾，应优先考虑两侧髋部力量、活动度或动作控制存在差异。"], [6, "推动作评估——俯卧撑稳定性评估", "俯卧撑稳定性评估主要观察闭链推动作中肩胛骨能否稳定贴附于胸廓，以及躯干能否保持中立。\n\n表6-21\n\n| 肩胛胸廓关节\n\n| 推起或下降过程中出现肩胛骨内侧缘、下角翘起，即翼状肩胛\n\n| 肩胛稳定肌不能有效固定肩胛骨，重点检查前锯肌、斜方肌、菱形肌和肩胛提肌之间的协同；胸椎过平也可能影响肩胛骨贴合\n\n| 肩胛骨过度耸起或提前上提\n\n| 上斜方肌、肩胛提肌可能代偿；前锯肌及中、下斜方肌控制不足\n\n| 肘部过度外展、肱骨头向前移动或肩部向前塌陷\n\n| 胸大肌、胸小肌、背阔肌等可能限制肩部位置；肩袖及肩胛稳定肌控制不足\n\n| 腰部下沉、腰椎过度伸展\n\n| 腹部和核心稳定肌群活动不足，不能抵抗腰椎伸展；髋屈肌或腰椎伸肌可能代偿\n\n| 骨盆旋转、身体左右晃动\n\n| 腹斜肌、腹横肌、臀肌及躯干抗旋转能力不足\n\n观察要点：俯卧撑评估的重点不是完成次数，而是肩胛骨是否稳定、头—胸椎—骨盆能否保持整体排列。"], [6, "三、拉动作评估——站姿划船评估", "站姿划船评估用于观察拉动作中肩胛骨回缩、肩关节运动和躯干稳定之间的配合。\n\n表6-22\n\n| 拉动过程中腰椎过度伸展，以身体后仰代替肩关节和肩胛骨运动\n\n| 髋屈肌、脊柱伸肌\n\n| 核心肌群、腹直肌、臀肌、腘绳肌\n\n| 拉动时耸肩，肩胛骨过度上提\n\n| 上斜方肌、肩胛提肌；菱形肌也可能参与不恰当的提肩代偿\n\n| 中斜方肌、下斜方肌及肩胛骨下压稳定肌\n\n| 头颈部\n\n| 下巴前伸或头部向前、向后仰\n\n| 颈部伸肌、上斜方肌、肩胛提肌\n\n| 颈深屈肌\n\n| 拉动结束时肩胛骨仍然外展，不能充分回缩\n\n| 前锯肌、肩前部肌群、上斜方肌可能占优势\n\n| 大、小菱形肌和中斜方肌\n\n| 肱骨向前滑动、肩部内旋或肘部运动轨迹明显偏离\n\n| 胸大肌、胸小肌、背阔肌等可能限制肩关节位置\n\n| 肩袖外旋肌、后束三角肌及肩胛稳定肌\n\n| 身体旋转或左右移动\n\n| 一侧背阔肌、胸肌或躯干旋转肌可能占优势\n\n| 腹斜肌、多裂肌及其他抗旋转稳定肌群\n\n观察要点：拉动作应主要由肩关节伸展和肩胛骨控制完成。如果客户必须耸肩、伸腰或前伸头部才能完成动作，说明负荷可能过大，或局部活动度与稳定性不足。"], [6, "四、旋转评估——坐姿胸椎旋转", "客户跨坐在训练凳上，固定骨盆并保持躯干直立，分别向左、向右旋转。评估重点是胸椎旋转幅度及左右对称性。\n\n表6-23\n\n| 旋转幅度\n\n| 在骨盆保持稳定的情况下，躯干不能完成约45°旋转\n\n| 可能存在胸椎活动度不足；应进一步检查腹内、外斜肌，多裂肌、回旋肌、胸椎伸肌以及背阔肌、胸肌对胸廓运动的影响\n\n| 左右对称性\n\n| 左右旋转幅度存在明显差异\n\n| 可能与单侧优势、脊柱发育或长期姿势差异有关；需要比较两侧躯干旋转肌和髋旋转肌\n\n| 骨盆跟随躯干旋转\n\n| 腹斜肌和深层核心肌群未能稳定骨盆；也可能以髋关节旋转代偿胸椎活动不足\n\n| 腰椎过度旋转或侧屈\n\n| 胸椎旋转受限，腰椎和骨盆代偿；躯干节段控制不足\n\n| 胸廓\n\n| 旋转时身体侧倾、前屈或后仰\n\n| 胸椎侧屈、屈伸与旋转控制不协调；需进一步检查胸椎活动度及躯干两侧肌肉控制\n\n| 以肩关节前伸或手臂摆动增加旋转幅度\n\n| 胸椎活动不足，肩胛胸廓关节和盂肱关节参与代偿\n\n| 头部先于躯干转动，或颈部过度旋转\n\n| 颈部旋转代偿胸椎活动不足；颈部深层稳定肌控制可能不足"], [6, "四、旋转评估——坐姿胸椎旋转（续）", "评估说明：ACE原表主要根据旋转角度和左右差异判断胸椎活动情况，并未为旋转受限规定唯一的“紧张肌—无力肌”组合。因此，旋转评估发现异常后，应继续检查胸椎、肩胛带、骨盆和髋关节，不能仅凭动作表现指定某一块肌肉。"], [6, "3.5 进阶条件", "● 客户在5种动作模式中均能控制良好地完成动作，无明显代偿\n\n● 在深蹲中能控制下蹲阶段、保持膝关节正确对位\n\n● 在Step-up（高台阶跨步） 中能保持髋部稳定、不过度内收\n\n● 俯卧撑中无翼状肩胛或腰部下陷\n\n● 站姿划船中无肩胛抬升或腰部过伸\n\n● 胸椎旋转双侧对称且各达45°"], [6, "3.6 对应人群", "● 已完成功能性训练阶段的客户\n\n● 有一定运动基础但需要纠正动作模式的客户\n\n● 准备开始负重训练的客户\n\n● 想要提升日常动作效率的客户\n\n思考"], [6, "\"膝盖不超过脚趾\"误区", "● 这一说法不应被当作适用所有人的绝对规则\n\n● 过度限制膝关节前移可将更多力矩转移至髋关节和躯干；应结合个体解剖、负荷和动作目标判断\n\n● 正确做法：屈髋主导模式下（髋关节铰链），膝盖自然会随身体下沉前移\n\n● 股骨较长的人在正确动作模式下，膝盖超过脚趾通常是安全的\n\n● 【思考】\n\n● 为什么一个过时的研究能流传这么久？因为它听起来\"符合常识\"。但身体不是简单机械，关节之间相互联动。过度限制一个关节的运动，必然导致其他关节代偿。IFT模型的逻辑正是基于这个原理： 先建立关节的稳定灵活性，在建立正确的动作模式，再安全地进行关节负荷训练。\n\n动作训练的核心要点：在各种姿势下都能正确移动，后续负重训练才有安全的动作基础。\n\n● 客户在俯卧撑评估中出现\"翼状肩胛\"（肩胛骨过度翘起）。你认为问题可能出在哪里？训练中应该如何改善？\n\n● 答案：翼状肩胛提示前锯肌无力/胸小肌紧张 + 中下斜方肌激活不足。训练重点：松解紧张的肌肉（胸小肌）加强前锯肌（推墙俯卧撑、锯齿俯卧撑）和中下斜方肌（肩胛下沉练习）\n\n● 五种动作模式：屈单推拉旋\n\n● 三个运动平面：矢状-前后、额状-左右、水平-旋转"], [6, "\"膝盖不超过脚趾\"误区（续）", "● 评估原则：只观察不纠正，记录代偿"], [6, "训练重点", "● 在动作训练建立的高效动作模式基础上增加外部负荷和发展力量、爆发力和肌肉耐力\n\n● 包含三个子方向：\n\n● 肌肉耐力（Muscular Endurance）：次最大负荷、高重复次数\n\n● 肌肉力量（Muscular Strength）：高负荷、低重复次数\n\n● 肌肉爆发力（Muscular Power）：力×速度，快速产生力的能力\n\n● 三个子方向的类比（不够精准，但可以帮助记忆）\n\n● 肌肉耐力 --“举多少次”\n\n● 肌肉力量 --“ 举多重”\n\n● 肌肉爆发力--“举多快”"], [6, "4.2 对应评估", "图6-3\n\n表6-24\n\n| 肌肉耐力——上肢\n\n| 俯卧撑评估：根据客户能力采用标准俯卧撑或改良俯卧撑\n\n| 记录保持正确动作时连续完成的次数；可依据相应的年龄、性别参考标准评价\n\n| 出现腰椎下沉、头部前伸、肩胛骨明显翘起或动作幅度不足时，不再计入有效次数\n\n| 肌肉耐力——下肢\n\n| 自重深蹲评估\n\n| 记录在规定动作标准下完成的有效次数，同时观察足、膝、髋和躯干排列\n\n| 不能只记录次数。若出现足部失稳、膝内移、躯干过度前倾或腰椎代偿，应终止测试或先改善动作质量\n\n| 最大肌肉力量——上肢\n\n| 1-RM卧推\n\n| 记录在正确动作技术下仅能完成1次的最大负荷\n\n| 适用于完成健康筛查、熟悉抗阻训练且能够保持正确动作的客户；需要保护者和规范的递增负荷程序\n\n| 最大肌肉力量——下肢\n\n| 1-RM深蹲\n\n| 次最大肌肉力量\n\n| 多次重复测试估算1-RM，如选择能够规范完成数次但不能继续完成的负荷，再通过换算表或公式估算1-RM\n\n| 记录负荷和规范完成的重复次数，并采用统一方法估算1-RM\n\n| 适用于不宜或没有必要直接进行1-RM测试的客户；重复次数过多会降低估算最大力量的准确性"], [6, "4.2 对应评估（续）", "| 下肢爆发力\n\n| 纵跳评估\n\n| 记录站立摸高与跳跃摸高的差值；通常完成数次，取最佳有效成绩\n\n| 用于评估下肢垂直爆发力。客户应具备安全起跳和落地能力；存在下肢关节损伤、疼痛、平衡障碍或术后恢复问题者不宜测试"], [6, "4.3 1-RM评估重要规则（必背）", "图6-4\n\n● 仅建议在IFT模型负荷/速度训练阶段进行\n\n● 新手可能不熟悉器材、不了解自身能力，容易在最大极限前放弃\n\n● 以下个体严禁进行1-RM评估：①高血压和/或血管疾病史；②骨科限制（骨折未愈合、严重骨质疏松）；③妊娠晚期；④未控制的代谢疾病；⑤急性损伤期\n\n● 评估前需充分热身，但不要做长时间静态拉伸（会降低表现）\n\n● 避免Valsalva动作（屏气）\n\n● 理想通过3-5组达到1-RM，每组间休息2-5分钟\n\n● 对于大多数客户，不需要1-RM作为基线， 记录训练中的渐进负荷提升即可\n\n● 对于已稳定通过动作训练阶段、动作模式良好的客户，可在过渡期先使用次最大力量估测，不必等到完全进入负荷/速度训练阶段才评估力量水平。\n\n● 1-RM禁忌清单：\n\n● ❌ 新手（不熟悉器材+不了解自身能力）\n\n● ❌ 高血压/血管疾病\n\n● ❌  急性损伤期/骨科限制\n\n● ❌ 未充分热身\n\n● ❌ 2小时之内完成了高强度长时间的静态拉伸\n\n● 口诀：「新高骨未拉伸」（新手/高血压/血管疾病/骨科限制/急性损伤/未充分热身/长时间静态拉伸后）"], [6, "4.4 次最大力量估测法", "图6-5\n\n● 深蹲/腿举系数表与卧推/胸推系数表"], [6, "4.6 对应人群", "● 动作模式已经良好控制、没有代偿的客户\n\n● 想要发展肌肉力量、体积或爆发力的客户\n\n● 运动员或对高级训练形式感兴趣的客户\n\n● ⚠不适用于骨科限制或仍处于损伤恢复期的客户（爆发力评估禁忌）\n\n1-RM评估的替代方案：\n\n1. 次最大力量估测（更安全）：让客户做8-12次，记录重量，查表估算1-RM\n\n2. 记录渐进负荷：不需要1-RM数字，记录每次训练能完成的重量和次数，观察进步曲线\n\n3. 对话式评估：问客户\"这个重量你还能再做几次\"，在\"还能做2-3次\"时停止\n\n爆发力评估的禁忌：\n\n● 骨质疏松客户（骨折风险高）\n\n● 膝关节损伤未完全恢复\n\n● 腰椎间盘突出\n\n● 任何刚做完手术的部位\n\n● 老年人（视情况）\n\n为什么1-RM评估有这么多限制？因为最大力量测试就是在挑战身体极限。挑战极限必然伴随风险： 关节压力、肌肉撕裂、心血管应激等。IFT模型的逻辑是：只有在前面两个阶段建立了足够的功能基础和动作控制能力，身体才能安全地承受这种压力。\n\n正确动作模式是安全负重的前提\n\n● 有位客户之前是举重运动员，现在想重新开始训练。你认为他可以直接进入负荷/速度训练阶段吗？为什么？"], [6, "4.6 对应人群（续）", "● 答案：需要重新评估。即使是举重运动员，如果长时间没有训练，动作模式可能退化，且不了解当前身体状态。应先进行动作评估，确认5种动作模式无代偿后，再进入负荷/速度训练。\n\n● • 三个子方向：耐力-多次、力量-多重、爆发-多快\n\n● • 1-RM禁忌：新高骨未拉伸（新手/高血压/骨科限制/急性损伤/未热身/静态拉伸后）\n\n● • 次大力量估算：完成该次数所使用的负荷×对应系数＝估算1RM\n\n● • 双渐进训练：先加次数，再加5%重量"], [6, "5.1 IFT三阶段整合表", "表6-25\n\n| 核心目标\n\n| 建立姿势稳定性 + 动力链灵活性\n\n| 在3个平面内高效完成5种动作模式\n\n| 增加负荷，发展力量/爆发力/耐力\n\n| 训练重点\n\n| 肌肉耐力、柔韧性、核心功能、静态/动态平衡\n\n| 5种动作模式的质量控制\n\n| 肌肉耐力、肌肉力量、肌肉爆发力\n\n| 5种动作模式\n\n| 不涉及（先打好基础）\n\n| 屈髋提起、单腿、推、拉、旋转\n\n| 在5种动作模式上叠加负荷/速度\n\n| 对应评估\n\n| 静态姿势评估（直角规则）、5大偏斜、                  单脚站立、Y平衡、McGill核心耐力组合、托马斯试验、              被动直腿抬高、          肩部柔韧性\n\n| 深蹲模式评估          高台阶跨步评估       俯卧撑稳定性评估、站姿划船评估、      胸椎旋转评估\n\n| 俯卧撑耐力评估、自重深蹲耐力评估1-RM卧推/深蹲、次最大力量估测、纵跳评估\n\n| 评估目的\n\n| 发现姿势偏差、    肌肉不平衡、        平衡缺陷、            柔韧性不足"], [6, "5.1 IFT三阶段整合表（续）", "| 观察                          动作控制能力、  代偿模式、              关节稳定性\n\n| 量化力量/耐力/爆发力水平，建立基线\n\n| 进阶条件\n\n| 姿势稳定性良好、           核心功能达标、                平衡能力正常、               关键肌群柔韧性正常\n\n| 5种动作模式                   均能无代偿完成、           深蹲控制良好、               推拉稳定、胸椎旋转对称\n\n| 持续渐进超负荷动作模式始终无代偿\n\n| 对应人群\n\n| 所有新客户、久坐少动者、姿势偏差者、老年人、恢复期客户"], [6, "5.1 IFT三阶段整合表", "| 已完成功能性训练阶段者、需纠正动作模式者\n\n| 动作模式良好、想发展力量/爆发力者、运动员\n\n| 阶段颜色\n\n| 黄色\n\n| 橙色\n\n| 红色\n\n| 核心警示\n\n| 不能跳过！所有客户从这开始\n\n| 不能跳过！动作质量是负重的安全前提\n\n| 1-RM有损伤风险，新手不适合"], [6, "5.2 评估的层次逻辑", "功能性评估（能不能稳定站好？关节够不够灵活？）      ↓ 通过动作评估（能不能正确地完成5种动作？有无代偿？）      ↓ 通过负荷/速度评估（能举多重？能跳多高？能做多少次？）\n\n● 评估三问：\n\n● 功能性评估看：每个关节的功能和核心\n\n● 动作评估看：五大动作模式\n\n● 负荷/速度评估看：多少次，多重，多快\n\n● 评估决定训练起点， 这是IFT模型最重要的原则。应先通过必要的评估了解客户当前的功能水平和动作模式，再决定训练起点。客户说\"我有经验\"不等于\"功能没问题\"。"], [6, "一、核心回顾", "ACE IFT模型是ACE-CPT的核心框架：先评估客户功能，再按\"功能→动作→负荷\"三阶段递进训练，应根据评估结果选择起点，并在基础能力满足后再进阶。"], [6, "3.1 IFT三阶段核心对比", "表6-26\n\n| 核心问题\n\n| \"能稳吗？\"\n\n| \"动对吗？\"\n\n| \"能多重？\"\n\n| 稳定性+灵活性\n\n| 动作质量\n\n| 力量+耐力+爆发力\n\n| 代表评估\n\n| Y平衡、McGill\n\n| 深蹲、俯卧撑\n\n| 1-RM、俯卧撑次数、纵跳摸高\n\n| 进阶标志\n\n| 姿势稳定+核心达标\n\n| 5种动作无代偿\n\n| 持续渐进超负荷，无代偿"], [6, "3.2 五大动作模式记忆", "表6-27\n\n| 屈\n\n| 坐椅子/捡东西\n\n| 深蹲中髋关节启动？\n\n| 单\n\n| 走路/上下楼梯\n\n| 高台阶跨步中髋内收？\n\n| 推门/俯卧撑\n\n| 翼状肩胛/腰部下陷？\n\n| 拉车门/划船\n\n| 肩胛抬升/腰部过伸？\n\n| 旋\n\n| 转身/挥杆\n\n| 双侧不对称？\n\n表6-28\n\n| 屈伸\n\n| 深蹲、弓步\n\n| 展收\n\n| 侧平举、侧弓步\n\n| 转身、划船旋转"], [6, "3.4 McGill比值三兄弟", "表6-29\n\n| 屈伸比\n\n| 屈曲时间÷伸展时间\n\n| < 1.0\n\n| 屈肌过强，           背部不稳\n\n| 侧桥对称比\n\n| 左侧÷右侧\n\n| 0.95-1.05\n\n| 一侧髋外展肌弱\n\n| 侧桥伸展比\n\n| 侧桥时间÷伸展时间\n\n| < 0.75\n\n| 侧桥强度异常"], [6, "4.1 基础概念自检", "☐ 能说出IFT三阶段的名称和顺序\n\n☐ 能解释为什么不能跳过前面的阶段\n\n☐ 能说出5种主要动作模式的名称\n\n☐ 能说出3个运动平面的名称和分割方式\n\n☐ 能解释\"功能性训练\"和\"动作训练\"的区别"], [6, "4.2 评估知识自检", "☐ 能说出功能性训练阶段的评估项目\n\n☐ 能说出动作训练阶段的评估项目\n\n☐ 能说出McGill比值的三个正常范围\n\n☐ 能说出Y平衡测试的下肢损伤风险阈值\n\n☐ 能说出1-RM评估的禁忌人群"], [6, "4.3 应用能力自检", "☐ 能根据客户情况判断从哪个阶段开始\n\n☐ 能识别深蹲评估中的常见代偿模式\n\n☐ 能识别俯卧撑评估中的常见问题\n\n☐ 能解释\"膝盖不过脚趾\"为什么是误区\n\n☐ 能解释双渐进式训练的执行方法"], [6, "第一件事：记住核心框架", "今晚睡前，用5分钟回忆IFT三阶段：\"功能→动作→负荷\"，想想每阶段的评估项目和训练重点。"], [6, "第二件事：背熟必背数字", "明天起床后，背诵以下数字：\n\n● McGill屈伸比 < 1.0\n\n● McGill侧桥对称 0.95-1.05\n\n● Y平衡差异 > 4cm\n\n● 胸椎旋转各45°"], [6, "第三件事：完成自检清单", "对照自检清单，检验自己对第6章的掌握程度。有不确定的地方，返回正文段重新学习。"], [6, "综合测验（答案）", "Q1：IFT模型的三个阶段是什么？按顺序排列。\n\n功能性训练 → 动作训练 → 负荷/速度训练\n\nQ2：5种主要动作模式是什么？\n\n屈髋提起、单腿、推、拉、旋转\n\nQ3：三个运动平面是什么？在每个平面中各举一个动作例子。\n\n矢状面（深蹲上下）、额状面（侧平举）、水平面（旋转）\n\nQ4：McGill核心耐力测试中，屈曲:伸展比的正常范围是多少？超过这个范围说明什么？\n\n<1.0。超过说明屈肌耐力相对强于伸肌，提示背部稳定性风险。\n\nQ5：为什么1-RM评估不适合新手客户？（列出至少3个原因）\n\n①仅适用于负荷/速度训练阶段；②新手不熟悉器材、不了解自身能力；③对高血压、心血管风险或其他需要医疗限制的客户，应先根据筛查结果和医疗建议判断是否适合进行1-RM评估；④有损伤风险。\n\nQ6：深蹲中\"膝盖不超过脚趾\"的建议有什么问题？\n\n“膝盖永远不能超过脚趾”不应被当作所有人的绝对规则。深蹲时膝关节和髋关节会共同承担力矩；过度限制膝关节前移可能将更多负荷转移到髋部和躯干。应根据个体解剖、活动度、负荷与动作目标评估蹲法。\n\nQ7：Y平衡测试中，什么情况下提示下肢损伤风险？"], [6, "综合测验（答案）（续）", "前部方向对称性差异超过4厘米（1.6英寸）。\n\nQ8：双渐进式训练方案是什么？如何执行？\n\n先增加重复次数至目标次数，再增加5%重量，然后重复循环。\n\nACEpresso结语：IFT模型是整个ACE-CPT体系的核心框架。记住一个原则：评估为训练起点和计划选择提供依据。完成必要的筛查与评估后，再结合客户目标制订训练计划。不应仅根据客户自述的训练经验判定起点，仍需根据筛查、评估与动作表现做出决定。 很多\"有经验\"的客户实际上带着错误的动作模式在训练。\n\n慢性病客户注意事项\n\n第     7章\n\nACE 教材第7章 · 慢性病客户注意事项\n\n本章节内容按\"核心机制→症状要点→运动改善模式→安全注意\"四段结构组织"], [6, "跨疾病通用原则（所有疾病都适用的原则）", "##### 医学许可与筛查\n\n\n● 所有慢性病客户开始运动前需获得医学许可\n\n● 遵循ACE整合式Fitness训练模型的一般原则，根据疾病特点个性化调整\n\n● 使用SOAP笔记记录客户进展（主观→客观→评估→计划）\n\n\n##### 运动处方通用框架\n\n\n● 心肺：FITT-VP（频率、强度、时间、类型、进阶、变化）\n\n● 肌力：频率、强度、时间、类型、进阶\n\n● 强度监控：HRR%、VO₂R%、RPE、VT1/VT2\n\n\n##### 多学科协作\n\n\n● 私人教练需与治疗医生、理疗师、注册营养师、心理健康专业人员保持沟通\n\n● 多学科方法优于单一药物或单一干预\n\n\n##### 生活方式干预核心\n\n\n● 所有慢性病共同建议：适度（适量营养+热量+运动频率/强度/时间）\n\n● 减重、增加身体活动、健康饮食、戒烟是共性初始策略"], [6, "1.1 冠状动脉疾病（CAD）", "##### 核心机制\n\n● 动脉粥样硬化：血管壁炎症→脂质斑块沉积→管腔狭窄→心肌供血不足\n\n● 心梗（MI）触发：脆弱斑块破裂→血栓形成→动脉完全堵塞\n\n##### 症状要点\n\n● 心绞痛（胸痛/胸闷，运动时加重）\n\n● 呼吸困难\n\n● 运动耐量下降\n\n● 风险因素：家族史、高血压、血脂异常、糖尿病、吸烟、久坐、不良饮食\n\n##### 运动改善模式\n\n表7-1\n\n| 频率\n\n| 心肺：≥3天/周（最好5天+）；肌力：2-3天/周\n\n| 强度\n\n| 心肺：40-80% HRR，RPE 12-13，≤VT1；肌力：RPE 11-13\n\n| 时间\n\n| 心肺：20-60分钟（含5-10分钟热身放松）；肌力：1-3组×10-15次，8-10个动作\n\n| 类型\n\n| 心肺：踏车、椭圆机、划船机、步行；肌力：小重量起始→逐渐过渡到器械\n\n##### 安全红线\n\n● 必须获得医学许可后方可开始训练\n\n● 终止运动的信号：心绞痛、呼吸困难、头晕、面色苍白、心率超目标\n\n● 避免Valsalva动作（憋气）\n\n● 低风险标准：住院过程无并发症、无缺血证据、功能能力>7METs、射血分数>50%"], [6, "1.2 高血压", "图7-1\n\n● 原发性（90-95%）：病因不明，遗传+环境交互\n\n● 继发性（5-10%）：肾脏疾病等可识别原因\n\n● 关键可变风险因素：压力、体脂过多、钠摄入、酒精、久坐、睡眠不足（OSA）\n\n##### 诊断标准（2017 ACC/AHA）\n\n表7-2\n\n| 正常\n\n| <120\n\n| <80\n\n| 偏高\n\n| 120-129\n\n| 1期\n\n| 130-139\n\n| 80-89\n\n| 2期\n\n| ≥140\n\n| ≥90\n\n表7-3\n\n| 大多数/所有天数\n\n| 40-59% HRR，RPE 12-13，<VT1（可舒适交谈）\n\n| ≥30分钟连续或累积（可分10分钟间歇）\n\n| 有节奏大肌群：步行、慢跑、骑车、游泳\n\n| 肌力\n\n| 60-80% 1-RM，2-4组×8-12次，避免Valsalva\n\n##### 关键数据\n\n● 单次运动后血压可降低5-7 mmHg，持续24小时\n\n● 每周≥150分钟运动量降压效果最大\n\n● 生活方式改变（DASH饮食+运动+减重）效果可媲美药物\n\n##### 安全注意\n\n● 服用β受体阻滞剂/钙通道阻滞剂者：用RPE监控强度，缓慢变换体位"], [6, "1.2 高血压（续）", "● 服用利尿剂者：注意补液，防止脱水和运动后低血压\n\n● 体位性低血压者：转介医疗专业人员评估用药"], [6, "1.3 中风", "图7-2\n\n● 缺血性（~80%）：脑血管被血栓/斑块堵塞\n\n● 出血性（~20%）：脑血管破裂\n\n\n##### 警示信号（FAST原则）\n\n\n● Face：面部突然下垂\n\n● Arms：手臂突然无力\n\n● Speech：说话困难/理解障碍\n\n● Time：立即呼叫急救\n\n表7-4\n\n| 心肺：3-5天/周；肌力：2个非连续日\n\n| 心肺：轻-中-剧烈均可，40-70% HRR或RPE 11-14；肌力：50-70% 1-RM\n\n| 心肺：20-60分钟，可分多轮；肌力：1-3组×8-15次\n\n| 心肺：踏车、卧式踏步机、跑步机步行；肌力：器械优先（安全性高）\n\n\n##### 关键要点\n\n\n● 运动可改善CVD风险因素（血压、血脂、胰岛素敏感性）\n\n● 运动可改善平衡/协调/步态\n\n● 即使中风后数年，运动仍能改善运动功能\n\n● 运动指南应来自理疗师/职业治疗师"], [6, "1.4 外周动脉疾病（PAD）", "图7-3\n\n● 下肢动脉粥样硬化→病变远端血流减少→缺血性跛行（运动性下肢疼痛）\n\n● 最常见病变部位：腹主动脉/髂骨、股骨、腘动脉、胫骨动脉\n\n● 跛行：行走一定距离后出现下肢钝痛/酸痛/痉挛\n\n● 休息后缓解，再走再痛\n\n● 重症者静息时也疼痛\n\n\n##### 运动改善模式（核心：间歇步行训练）\n\n\n表7-5\n\n| 3-5天/周\n\n| 中等强度，以疼痛强度为准（非心率）；跛行疼痛量表3-4级（轻-中度）\n\n| 30-45分钟（不含休息），逐步至60分钟；12周为一周期\n\n| 承重步行（间歇性）：走至中度疼痛→坐下休息→疼痛消失→继续\n\n\n##### 关键机制\n\n\n● 步行产生缺血→刺激侧支循环形成+毛细血管/线粒体密度增加→氧气利用改善\n\n● \"高强度\"在此语境指疼痛强度，非能量消耗\n\n● 出现CAD症状（胸痛等）→立即停止，需医学评估\n\n● 足部护理至关重要（尤其合并糖尿病者）\n\n● 穿合适的鞋袜"], [6, "2.1 血脂异常", "图7-4\n\n● 脂质代谢紊乱：总胆固醇↑、LDL↑、TG↑、HDL↓ → 动脉粥样硬化\n\n● 关键脂蛋白：\n\n● LDL（\"坏\"胆固醇）：促进动脉粥样硬化\n\n● HDL（\"好\"胆固醇）：运输脂质至肝脏排泄，与CAD负相关\n\n● 非HDL胆固醇：HDL之外的总胆固醇，识别致动脉粥样硬化颗粒，优于LDL\n\n● TG：独立风险因素，慢性升高→内皮功能障碍\n\n##### 诊断标准\n\n表7-6\n\n| LDL\n\n| <100\n\n| 130-159\n\n| 160-189\n\n| ≥190\n\n| 总胆固醇\n\n| <200\n\n| 200-239\n\n| ≥240\n\n| —\n\n| HDL\n\n| ≥60（高=保护性）\n\n| <40（低=风险）\n\n| TG\n\n| <150\n\n| 150-199\n\n| 200-499\n\n| ≥500\n\n表7-7\n\n| 心肺：≥5天（最大化热量消耗）；肌力：2-3天\n\n| 心肺：40-75% HRR，低于/等于/高于VT1但<VT2；肌力：50-85% 1-RM（力量）或<50%（耐力）"], [6, "2.1 血脂异常（续）", "| 心肺：30-60分钟（减重建议50-60分钟）；肌力：2-4组×8-12次（力量）或12-20次（耐力）\n\n| 心肺：有节奏大肌群；肌力：器械/自由重量/体重\n\n● LDL：单纯运动对LDL改善不一致，需结合减重\n\n● HDL：心肺适能提高→HDL普遍增高；减脂可使HDL增高更多\n\n● TG：心肺训练最有效（TG可作燃料）；肌力训练无效\n\n● 运动量阈值：每周250-300分钟，消耗~2000千卡→多数成年人可降低体重/体脂\n\n● 餐后脂血症（PPL）：单次中等强度运动30-60分钟→TG降低持续12-36小时→建议至少隔天运动一次"], [6, "2.2 糖尿病", "图7-5\n\n##### 1型糖尿病\n\n● 自身免疫攻击胰岛β细胞→胰岛素绝对缺乏\n\n● 需注射/泵入胰岛素调节血糖\n\n● 血糖控制=饮食+运动+胰岛素三者的时间/量协调\n\n##### 运动注意\n\n● 运动前减少胰岛素剂量\n\n● 运动前/中摄取易吸收碳水化合物\n\n● 运动中/后调整胰岛素泵输注量\n\n● 胰岛素水平高→运动时/后低血糖风险\n\n● 胰岛素水平低→高血糖+酮症风险\n\n##### 2型糖尿病（>90%患者）\n\n● 胰岛素抵抗（细胞对胰岛素不敏感）+ β细胞相对不足→高血糖\n\n● 与久坐、热量过剩、肥胖（尤其内脏脂肪）高度相关\n\n● 内脏脂肪→轻度炎症→胰岛素抵抗→糖尿病/代谢综合征\n\n● 多饮、多尿、多食、体重下降（典型但未必要全部出现）\n\n● 长期并发症：心脏、血管、肾脏、眼睛、足部、神经、肌肉骨骼\n\n表7-8\n\n| 心肺：3-7天（避免连续2天不运动！）；肌力：≥2个非连续日（最好3天）\n\n| 中等：40-59% HRR，<VT1；剧烈：60-89% HRR，VT1至<VT2\n\n| 1型：150分钟中等/75分钟剧烈；2型：150分钟中等"], [6, "2.2 糖尿病（续）", "| 50-85% 1-RM，1-3组×8-10次（所有大肌群，8-10个动作，接近疲劳）\n\n● 不可连续2天不运动：运动对胰岛素敏感性的影响24-48小时后消失\n\n● 心肺+肌力结合→肌肉保持更高胰岛素敏感性→更好血糖控制\n\n● 减重5-7%即可逆转胰岛素抵抗（与全身性炎症减少有关）\n\n● 碳水对血糖影响最大→饭后1小时血糖最高，2小时后开始下降\n\n● 碳水化合物类型重要：单糖→血糖快速峰值；复合碳水→释放更慢\n\n● 1型：运动前后监测血糖，调整胰岛素和碳水摄入\n\n● 2型：注意低血糖症状（出汗、颤抖、头晕、意识模糊）"], [6, "2.3 代谢综合征（MetS）", "图7-6\n\n● 不是单一疾病，是一组增加心脏病/糖尿病/中风风险的代谢异常簇集\n\n● 诊断标准（出现≥3项）：\n\n1. 腰围↑：男≥102cm，女≥88cm\n\n4. 血压≥130/85 mmHg（或药物治疗）\n\n5. 空腹血糖≥100 mg/dL（或药物治疗）\n\n表7-9\n\n| 心肺：≥5天（最大化热量消耗）；肌力：≥2天（最好3天）\n\n| 心肺：40-59% HRR，RPE 12-13，<VT1；肌力：50-85% 1-RM\n\n| 心肺：30-60分钟（减重建议50-60分钟）；肌力：1-3组×8-10次\n\n| 心肺：有节奏大肌群；肌力：所有大肌群\n\n● 主要目标是减重（尤其减少内脏脂肪）\n\n● 运动计划参照肥胖症指南设计\n\n● 需同时评估CAD、高血压、血脂异常等共存风险因素\n\n● 持续性运动和间歇性运动均可"], [6, "3.1 哮喘（运动诱发性支气管收缩 EIB）", "图7-7\n\n● 呼吸道慢性炎症→对各种刺激因素过度反应→支气管平滑肌收缩+黏膜肿胀+黏液分泌↑→气道狭窄\n\n● 运动诱发机制：大量干冷空气进入呼吸道→呼吸道水分丢失→支气管收缩物质释放\n\n● 80%哮喘患者运动时/后发作（EIB）\n\n● 喘息、呼吸困难、胸闷、咳嗽（尤其夜间/清晨）\n\n● EIB特征：中-剧烈强度运动后呼吸道暂时变窄\n\n● 症状在运动后5-10分钟达峰，持续20-30分钟\n\n● 部分人运动后2-12小时出现延迟反应\n\n表7-10\n\n| 心肺：3-5天/周；肌力：≥2天（最好3天）\n\n| 心肺：起始<VT1（40-59% HRR），1个月后进阶至60-70%；RPE 12-13\n\n| 逐步至30-40分钟/次\n\n| 心肺：步行、跑步、骑车、无氯泳池游泳；肌力：50-85% 1-RM\n\n● 10-15分钟热身（含剧烈/间歇运动）→诱导不应期→减弱EIB反应\n\n● 约50% EIB者有2小时不应期（期间再次运动不发作或发作减弱）\n\n● 运动调节→减少相同任务所需通气量→呼吸道干燥减少\n\n● 哮喘最佳反应时间：上午中间至晚些时候\n\n● 随身携带急救药物（支气管扩张剂）"], [6, "3.1 哮喘（运动诱发性支气管收缩 EIB）（续）", "● 运动前预防性使用药物（遵医嘱）\n\n● 运动前/中/后充分饮水\n\n● 避免触发因素：极热/极冷、花粉高峰、空气污染\n\n● 低温环境可佩戴口罩保持吸入空气温暖湿润\n\n● 密切观察哮喘发作早期体征→症状加重→降低强度→终止课程\n\n● 药物无效→启动急救系统"], [6, "4.1 癌症", "● 正常细胞DNA受损→突变→细胞不受控增殖\n\n● 约30%癌症死亡与5大行为/饮食风险相关：BMI高、蔬果不足、久坐、吸烟、饮酒\n\n● 癌症幸存者三阶段：治疗期→康复后生活→晚期/临终\n\n表7-11\n\n| 心肺：3-5天/周；肌力：2-3天/周\n\n| 心肺：中等（40-59% HRR，RPE 12-13），可进阶至剧烈；肌力：从<30% 1-RM起始，~5%递增\n\n| 心肺：75分钟剧烈或150分钟中等/周；肌力：≥1组×8-12次\n\n| 心肺：步行、骑车等大肌群长时间有节奏活动；肌力：自由重量+器械+承重功能任务\n\n● 运动可改善：焦虑/抑郁、疲劳、恶心、身体功能、生活质量\n\n● 运动可维持肌肉量、肌肉力量/耐力、心肺适能、柔韧性\n\n● 运动可降低心脏病、骨质疏松症、糖尿病风险\n\n● 化疗/放疗患者可能出现贫血→降低运动强度\n\n● 骨骼完整性受损→减少负重和高强度举重\n\n● 运动计划个体化：癌症类型、治疗方案、当前健康状态\n\n● 建议转介肿瘤专科注册营养师"], [6, "4.2 骨质疏松症", "图7-8\n\n图7-9\n\n● 骨量低+骨微结构破坏→骨骼脆弱→骨折风险↑\n\n● 定义：BMD低于年轻成人平均值2.5个标准差以上\n\n● 骨量减少：BMD低于平均值1.0-2.5个标准差\n\n● 最常见骨折部位：髋关节、脊椎、前臂远端\n\n● 90%+髋骨折由跌倒引起\n\n##### 风险因素\n\n● 不可控：遗传、女性、白种人/亚洲人、绝经后\n\n● 可控：生殖激素、钙/维生素D摄入、身体活动、吸烟、酒精\n\n表7-12\n\n| 心肺：4-5天/周；肌力：1-2天→进阶至2-3天\n\n| 心肺：中等（40-59% HRR）；肌力：调整至最后2次重复有挑战性，高强度者可受益\n\n| 心肺：20分钟→进阶至30-60分钟；肌力：1组×8-12次→2周后增至2组\n\n| 心肺：负重大肌群（步行、爬楼梯）；肌力：骨骼负荷力运动+平衡/步态/功能性站姿运动\n\n● 物理应力→骨骼微变形→刺激骨沉积→骨量/强度↑\n\n● 经常运动→BMD↑、跌倒/骨折风险↓\n\n● 避免：脊柱过度前屈、扭转、压迫动作→增加脊椎骨折风险\n\n● 推荐：躯干伸展+腹部稳定运动\n\n● 避免：光滑表面、绊倒危险环境、快速震动动作"], [6, "4.2 骨质疏松症（续）", "● 肌力训练+负重+冲击运动（跳跃）对刺激骨量最有效\n\n● 强调平衡训练：躯干、髋部、下肢肌肉力量"], [6, "4.3 关节炎", "图7-10\n\n##### 骨关节炎（OA）\n\n● 关节软骨退化（过度使用/创伤/肥胖/年龄）→软骨磨损→骨端直接摩擦→疼痛+炎症\n\n● 最常受累关节：颈椎/腰椎、髋、膝、手指末端关节\n\n● 美国致残主要原因\n\n● 运动时疼痛（随时间/强度加重）\n\n● 局部僵硬（尤其晨起/久坐后）\n\n● 关节肿胀、灵活性下降\n\n● 骨刺/软骨碎片脱落→炎症→进一步软骨损伤\n\n##### 类风湿关节炎（RA）\n\n● 自身免疫性疾病：滑膜组织炎症→关节软骨/骨骼磨损→关节变形\n\n● 全身性疾病：除关节外，还影响皮肤、眼睛、肺、心脏、血管\n\n● 分解代谢特性→肌肉减少（必须增强受累关节周围肌肉）\n\n表7-13\n\n| 心肺：中等（40-59% HRR）至剧烈（≥60% HRR）；身体状况差者30-39% HRR\n\n| ≥150分钟/周低-中强度，或75分钟剧烈，或组合\n\n| 心肺：低冲击有节奏大肌群（步行、骑车、游泳）；肌力：50-80% 1-RM，2-4组×8-12次，无痛ROM内运动\n\n● 运动+减重是控制OA最佳方法（尤其超重/肥胖者）\n\n● 运动可改善：心肺适能、肌力/耐力、关节灵活性、疲劳、日常生活功能"], [6, "4.3 关节炎（续）", "● RA：等长运动优先，避免关节负荷过大\n\n● RA：低冲击、有限ROM、温水运动、发作期避免运动可能有益\n\n● OA：下肢关节炎不建议跑步等高冲击运动\n\n● RA：根据功能限制和基础心肺适能调整计划\n\n● 所有动作在无痛范围内进行\n\n表7-14\n\n表7-15\n\n| 冠状动脉疾病（CAD）\n\n| 避免Valsalva动作（憋气用力）\n\n| 高血压\n\n| 记住三个阈值：120（正常上限）、130（1期起点）、140（2期起点）；生活方式改变可避免药物\n\n| 中风\n\n| 无特殊上下肢区分限制，重点在功能恢复（平衡/协调/步态）\n\n| 外周动脉疾病（PAD）"], [6, "4.3 关节炎", "| 以疼痛强度为准（非运动强度）——走至中等疼痛（跛行量表3-4级）→休息→继续\n\n| 糖尿病\n\n| 运动前减少胰岛素剂量；不可连续2天不运动（胰岛素敏感性24-48h后消失）；运动中注意低血糖症状\n\n| 代谢综合征\n\n| 诊断标准：出现≥3项（腰围↑、TG≥150、HDL↓、血压≥130/85、空腹血糖≥100）\n\n| 哮喘\n\n| 最佳运动时间：上午中间至晚些时候；保持吸入空气温暖湿润；随身携带急救药物\n\n| 骨质疏松症\n\n| 肌力训练+负重+冲击运动（跳跃）；高强度会受益\n\n| 骨关节炎\n\n| 避免疼痛范围外运动；避免高冲击和扭转动作\n\n各个生命阶段的运动注意事项\n\n第     8章\n\nACE 教材第8章 · 各个生命阶段的运动注意事项\n\n本章节按\"核心机制/背景→运动指南（FITT）→安全注意\"结构组织"], [6, "跨人群通用原则", "● 所有特殊人群开始运动前需获得医学许可（尤其合并慢性病者）\n\n● 使用PARmed-X等筛查工具进行运动前健康评估\n\n● 慢性病患者需与医师沟通，了解运动禁忌症和限制\n\n● 肌力：频率、强度、时间、类型\n\n● 强度监控：谈话测试、RPE、VT1/VT2——不同人群适用不同监控方式\n\n\n##### ACE IFT模型适用性\n\n\n● 三大人群均可使用ACE整合式健身训练模型\n\n● 需根据人群特点调整评估方式和计划设计\n\n● 评估本身不必与成年人完全区分，但需注意趣味性和安全性\n\n\n##### 行为改变与社会支持\n\n\n● ACE Mover Method + ABC Approach适用于所有人群\n\n● 社会支持是坚持运动的关键因素（家庭参与、同伴鼓励）\n\n● 运动计划设计应考虑个人目标、能量波动和日常限制"], [6, "一、青少年", "图8-1"], [6, "1.1 背景与现状", "##### 核心问题\n\n\n● 仅20-26%的美国青少年达到身体活动推荐水平（2018年报告卡评分D-）\n\n● 全球青少年身体活动和久坐行为平均得分均为D\n\n● 活动水平随年龄增长而下降：16-19岁仅5%达标\n\n● 女孩活动参与度显著低于男孩\n\n● 原因：学校体育要求降低、屏幕时间增加（45%高中年龄青少年每日>3小时）、社区安全性不足\n\n\n##### 缺乏活动的后果\n\n\n● 儿童期肥胖、高血压、2型糖尿病、骨质疏松症、动脉粥样硬化\n\n● 久坐习惯延续至成年→形成代际恶性循环（父母不运动→子女不运动可能性高6倍）\n\n\n##### 身体素养（Physical Literacy）\n\n\n● 定义：进行身体活动的能力、信心和意愿\n\n● 核心目标：帮助孩子掌握跑、跳、平衡等基本运动能力\n\n● 策略：将提高身体素养作为家庭运动计划基础，强调努力而非成绩"], [6, "1.2 青少年运动指南", "##### 核心原则\n\n● 每天总计≥60分钟中等至高强度身体活动\n\n● 包含心肺活动 + 适合年龄的肌肉强化 + 骨骼强化运动\n\n● 每周累积总量比单一组成部分（频率/强度/持续时间）更重要\n\n● 骨骼强化对青少年尤为重要——骨量最大增长发生在青春期前和青春期\n\n##### 肌肉训练的安全性与有效性\n\n● 误区澄清：青春期前儿童可安全进行肌肉训练（在适当监督下）\n\n● 无证据显示适当监督的渐进式肌肉训练会导致生长迟缓或骨骼损伤\n\n● 研究数据：10个月简单肌肉训练使9岁女孩骨密度增幅达对照组4倍（6.2% vs 1.4%）\n\n● 肌肉训练损伤风险记录优于其他体育活动\n\n##### FITT建议\n\n表8-1\n\n| 每天\n\n| ≥3天/周\n\n| 大多数为中等强度（HR和呼吸明显增加）至高强度（HR和呼吸大幅增加），高强度每周≥3天\n\n| 次极量重复8-15次，达到中度疲劳\n\n| N/A\n\n| 作为每天≥60分钟运动的一部分\n\n| 适合年龄的愉悦活动：跑步、游泳、骑车、跳舞、足球、篮球、网球\n\n| 非结构化（爬树、拔河、 在运动场设备上攀爬）或结构化（自重/阻力带/器械）"], [6, "1.2 青少年运动指南（续）", "| 跑步、跳绳、篮球、网球、抗阻训练、跳格子"], [6, "1.3 安全注意", "##### 肌肉训练安全指南\n\n\n● 始终对儿童进行适当监督，采用正确技术\n\n● 传统健身器材可能不适合孩子的杠杆臂——优先选择自由调节重量器材或自重运动\n\n● 切勿鼓励单纯的大重量托举或爆发性动作\n\n● 教导正确呼吸方式（避免Valsalva）\n\n● 鼓励运动前/中/后充分饮水\n\n● 告诉孩子感到疲劳/乏力/不适/痛苦时立即沟通\n\n\n##### 极端环境防护\n\n\n● 高温风险因素：体表面积/质量比高、出汗能力弱、运动经济性低\n\n● 极冷风险：脱水、低温症、冻伤——保持补水和分层穿衣\n\n● 冷空气湿度低→加重哮喘/运动诱发性支气管痉挛\n\n● 关注气象部门高温/寒冷警告，必要时移至室内\n\n● 佩戴护具的运动更需注意热相关疾病\n\n\n##### 过劳性损伤与体育专业化\n\n\n● 全年单一运动→重复性发力→过劳性损伤风险↑\n\n● 多样化体育活动增强本体感受、多维力量、敏捷性、速度\n\n● 遵循周期化原则——职业运动员不会全年不断比赛，青少年也应如此\n\n● 运动必须适合年龄、强度适当"], [6, "🔑 青少年关键记忆点", "● 每天≥60分钟；骨骼强化特别重要（骨量增长窗口期）\n\n● 肌肉训练安全（有监督）；避免大重量和爆发力\n\n● 避免体育专业化和过劳性损伤；遵循周期化\n\n● 高温/极冷环境需特殊防护"], [6, "2.1 孕期", "图8-2\n\n##### 生理变化\n\n##### 身体结构与重心\n\n● 建议增重：25-35磅（11.4-15.9kg），孕前体重不同则建议不同\n\n● 腹围增长→背部、骨盆、髋部、腿部承受额外压力\n\n● 重心向上向前移→影响平衡和协调性\n\n● 孕前通过深蹲、弓步、硬举增强腿后侧和躯干力量，为增重做准备\n\n##### 激素变化\n\n● 松弛素↑→骨盆增大（利于分娩）但所有关节松弛度增加→旧伤复发风险/关节不稳\n\n● 需要力量和稳定训练增加身体稳定性\n\n● 恶心和疲劳（妊娠早期最常见，但任何阶段都可能发生）\n\n##### 心血管变化\n\n● 心力储备（静息与最大心脏功能之差）减小\n\n● 心率、血容量、心搏量、心输出量↑（孕早期即开始）\n\n● 短暂中等强度运动后可能感觉喘不过气→增加休息时间\n\n● 避免静止姿势（如仰卧），因可导致静脉回流减少和低血压\n\n##### 体温调节\n\n● 散热能力略有提高（皮肤血流↑+潮气量↑）\n\n● 运动前必须知晓环境温度\n\n● 环境温度/湿度升高→显著影响散热→可能导致高热症\n\n● 尚无运动相关高热症引起胚胎/胎儿畸形的报告\n\n##### 运动指南\n\n##### 核心建议"], [6, "2.1 孕期（续）", "● 每周≥150分钟中等强度有氧运动，至少3天\n\n● 不论产前运动经历如何，孕期在医师指导下运动都有益且安全（ACOG 2015）\n\n● 运动可降低：先兆子痫、妊娠期糖尿病、剖腹产、下背痛、焦虑、恶心、胃灼热、失眠、腿痛性痉挛发生率\n\n● 孕前喜爱运动者：可继续原有计划（安全运动强度上限尚未确定）\n\n● 孕前不爱运动者：缓慢开始，进阶至中等强度（可能需从<10分钟间歇性运动起步）\n\n##### 强度监控\n\n● 谈话测试优于心率监控\n\n● 结果<VT1 = 中等强度\n\n● 中等强度：MET 3-5.9，RPE 12-13（6-20量表）"], [6, "2.1 孕期", "● 高强度（MET≥6，RPE 14-17）仅适合孕前已运动或想要提高健康水平的女性\n\n表8-2\n\n| >3-5天/周\n\n| 不连续的2-3天/周\n\n| >2-3天/周（每天最有效）\n\n| 中等（MET 3-5.9，RPE 12-13）；高强度适合孕前已运动者\n\n| 次极量重复8-10次或12-15次，中度疲劳\n\n| 拉伸至紧缩感或轻微不适\n\n| 每天≥30分钟，每周≥150分钟中等或≥75分钟高强度\n\n| 初学者1组；中高级2-3组\n\n| 静态拉伸保持10-30秒\n\n| 负重和非负重均可：徒步、团体运动、游泳（水中运动减轻腰腿压力）\n\n| 器械、自由重量、自重：坐姿推胸、哑铃、弓步\n\n| 静态和动态柔韧性运动，每个肌群\n\n##### 绝对禁忌——终止运动的警示性体征\n\n● 阴道出血\n\n● 宫缩阵痛\n\n● 羊水泄露\n\n● 用力前呼吸困难\n\n● 眩晕或感到昏晕\n\n● 头疼\n\n● 胸痛\n\n● 影响平衡的肌无力\n\n● 小腿疼痛或肿胀\n\n##### 运动禁忌与避免事项\n\n● 避免高风险/可能腹部创伤的运动（接触性项目、滑雪、冲浪）\n\n● 避免极端高温环境（如热瑜伽）\n\n● 避免长时间仰卧姿势"], [6, "2.1 孕期（续）", "● 某些运动可能需要调整或与产科护理者讨论（慢跑、球拍运动等）\n\n##### 营养与补水\n\n● 运动前后充分补水\n\n● 运动前吃小零食避免低血糖（尤其中等强度>45分钟时）\n\n● 平衡热量摄入\n\n##### 腹直肌分离（Diastasis Recti）\n\n● 腹直肌两肌腹分离，可达1-2英寸（2.5-5.1cm）\n\n● 孕期发病率高达45%，产后12个月仍达33%\n\n● 孕前和孕期运动可减少35%发病率\n\n● 推荐运动：腹横肌等长收缩、姿势肌和腹部力量训练\n\n● 注意评估腹直肌分离情况后再设计核心训练"], [6, "2.2 产后", "图8-3\n\n##### 核心要点\n\n##### 恢复原则\n\n● 分娩体验因人而异，产后激素水平继续变化\n\n● 疲劳常见（激素变化+身体需求+睡眠中断）\n\n● 产后贫血常见→与生活质量下降、认知能力减弱、情绪不稳/抑郁相关\n\n● 剖腹产需额外恢复时间（开刀手术）\n\n● 流产和死产的悲痛支持：25%妊娠以流产告终，1%死产\n\n##### 运动恢复指南\n\n● 产后几天/几周内，根据医生建议逐渐增加运动量\n\n● 慢慢开始：先增加持续时间和频率，再增加强度\n\n● ACOG建议每日20-30分钟（步行+简单主要肌群强化）\n\n● 异常疼痛（尤其外阴切开术/剖腹产后）→停止运动并咨询医师\n\n● 比正常月经更重的鲜红阴道流血→停止运动并就医\n\n● 目标：9-12个月回到孕前运动强度水平\n\n##### 哺乳期注意\n\n● 热量和营养需求增加→需同时满足运动和母乳需求\n\n● 充分饮水\n\n● 长时间抱孩子→头部前倾和圆肩风险↑\n\n● 计划设计应包括：后背与后肩运动（坐姿划船）+ 前肩和胸肌拉伸\n\n##### 计划设计重点\n\n● 考虑剖腹产伤口愈合或腹直肌分离情况\n\n● 增加躯干力量和稳定性运动"], [6, "2.2 产后（续）", "● 制定简单的10分钟可完成运动计划（照顾孩子时间有限）\n\n● 鼓励多散步（可带孩子一起）"], [6, "🔑 孕期与产后关键记忆点", "● 孕期：每周≥150分钟中等强度，谈话测试监控（<VT1）\n\n● 孕期：避免仰卧、高温环境、接触性运动\n\n● 孕期：警示性体征9项（见上方清单）\n\n● 松弛素影响所有关节→关节不稳风险↑\n\n● 腹直肌分离：孕期发病率45%，运动可减少35%\n\n● 产后：慢慢开始，9-12个月回到孕前水平\n\n● 产后：关注哺乳期营养补水+圆肩/头部前倾"], [6, "三、老年人", "图8-4"], [6, "3.1 衰老的结构性变化", "##### 肌肉骨骼系统\n\n\n● 肌肉质量↓→力量和耐力↓（生活方式变化+神经肌肉功能减弱）\n\n● 骨骼更脆弱多孔→骨折风险↑\n\n● 钙损失→骨量下降（负重和肌肉训练可维持）\n\n● 约20%髋骨折老年人死于相关并发症\n\n● 瘦体组织↓ + 体脂↑ + 基础代谢率↓\n\n\n##### 平衡与稳定性\n\n\n● 三大平衡系统均受衰老负面影响：\n\n● 视觉系统（最主要的本体感受输入通道）→衰退\n\n● 前庭系统（头部空间位置信息）→功能下降\n\n● 躯体感觉系统（肌肉/关节本体感受器、皮肤/压力感受器）→功能下降\n\n● 平衡和协调性↓→跌倒和相关损伤风险↑\n\n\n##### 认知与心理健康\n\n\n● 认知能力下降→平衡能力、注意力、专注力下降\n\n● 抑郁症和焦虑症风险↑\n\n● 失去家人朋友→社会化程度↓\n\n● 身体活动可预防和减缓认知能力衰退（50岁以上人群，无论初始认知状态）\n\n● 运动为老年人提供社交机会和挑战/目标"], [6, "3.2 老年人运动指南", "● 每周150-300分钟中等强度 或 75-150分钟高强度 或 两者结合\n\n● 最好将时间分散开\n\n● 多做身体活动可获得额外益处——做些运动总比不做的好\n\n● 缺乏定期运动计划时：一天中多动少坐\n\n● 每周≥2次肌力训练（主要肌群），维持或增加力量和耐力\n\n● 平衡训练必须纳入运动计划→提高本体感受，降低跌倒风险\n\n表8-3\n\n| 中等：>5天/周；高等：>3天/周；结合：3-5天/周\n\n| ≥2天/周\n\n| >2天/周\n\n| 0-10量表：中等5-6，高等7-8\n\n| 初学者低强度（40-50% 1-RM）→逐渐过渡至中高等（60-80% 1-RM）；或0-10量表中等(5-6)至高等(7-8)\n\n| 中等30-60分钟/天；高等20-30分钟/天；可多次累计（每次≥10分钟）\n\n| 8-10个动作，1-3组×8-12次\n\n| 保持30-60秒\n\n| 不带来过多压力的运动：散步；负重困难者选水上运动/固定式自行车\n\n| 渐进式训练、负重健美操、爬楼梯\n\n| 慢速静态拉伸，每个肌群"], [6, "3.3 安全注意与计划设计", "##### 评估调整\n\n\n● 关节炎在65岁以上人群中发病率49.6%——极常见\n\n● 评估顺序建议：先做姿势和柔韧性评估→再调整运动评估\n\n● 膝关节炎客户可能不适合自重深蹲→可改用坐下/站起测试\n\n● 平衡评估：安全第一，单脚站立优于Y平衡测试\n\n● 初始可借助墙壁/门框等外部稳定装置→进阶到拐杖/手杖→最终无外力支持\n\n● 热身更重要（胶原含量↓+缔结组织弹性↓）→减少受伤风险\n\n● 放松时间用于静态拉伸（肌肉紧张妨碍灵活性/ADL时）\n\n● 平衡运动应在课程早期引入——此时力量最高、专注度最高、受伤风险最低\n\n● 重点放在功能训练上\n\n● 考虑客户能否正常俯身和起身（按摩床/椅可能有用）\n\n● 负重运动首选（在承受范围内）→强化骨骼\n\n● 固定式/卧式自行车：低中心栏方便上下\n\n● 不要为客户设限——激发冒险精神和成就感\n\n● 慢慢增加持续时间和运动量"], [6, "🔑 老年人关键记忆点", "● 150-300分钟中等强度/周；平衡训练必须纳入\n\n● 20%髋骨折老年人死于并发症；负重运动强化骨骼\n\n● 关节炎发病率49.6%（65岁以上）——先评估姿势和柔韧性\n\n● 热身比以往更重要（胶原↓、弹性↓）\n\n● 平衡训练放在课程早期（专注度最高时）\n\n● 运动可预防认知衰退、改善心理健康"], [6, "各人群关键记忆点总结", "表8-4\n\n| 青少年·活动量\n\n| 每天≥60分钟中等至高强度；骨骼强化在青春期前/青春期尤为重要（骨量增长窗口期）\n\n| 青少年·肌肉训练\n\n| 安全（有监督时）；避免大重量和爆发力；优先自重/阻力带\n\n| 青少年·风险\n\n| 避免体育专业化和过劳性损伤；遵循周期化；高温/极冷环境特殊防护\n\n| 孕期·运动量\n\n| 每周≥150分钟中等强度，至少3天；谈话测试监控（<VT1）\n\n| 孕期·禁忌\n\n| 避免仰卧、高温环境、接触性/高跌落风险运动；注意9项警示性体征\n\n| 孕期·激素\n\n| 松弛素↑→所有关节松弛→关节不稳；力量和稳定训练对抗\n\n| 孕期·腹直肌分离\n\n| 孕期发病率45%；运动可减少35%；推荐腹横肌等长收缩\n\n| 产后·恢复\n\n| 慢慢开始，9-12个月回到孕前水平；剖腹产需额外恢复时间\n\n| 产后·注意\n\n| 哺乳期需更多热量/水分；关注圆肩/头部前倾；加入后背和后肩运动\n\n| 老年人·运动量\n\n| 150-300分钟中等强度/周；平衡训练必须纳入；≥2次/周肌力训练\n\n| 老年人·骨骼\n\n| 20%髋骨折老年人死于并发症；负重运动在承受范围内强化骨骼"], [6, "各人群关键记忆点总结（续）", "| 老年人·关节炎\n\n| 65岁以上发病率49.6%；先评估姿势和柔韧性，再调整运动评估\n\n| 老年人·计划设计\n\n| 热身比以往更重要；平衡训练放在课程早期；重点放在功能训练\n\n| 老年人·认知\n\n| 运动可预防和减缓认知衰退，改善心理健康，提供社交机会\n\n肌肉骨骼异常客户的注意事项\n\n第       9章\n\nACE 教材第9章 · 肌肉骨骼异常客户的注意事项 · 重点总结\n\n本章节按\"核心机制→症状要点→课程设计/安全注意\"结构组织"], [6, "跨病症通用原则", "##### 执业范围\n\n● 私人教练的职责是运动评估，不是损伤评估/诊断\n\n● 客户出现疼痛或受伤，必须转介给医疗保健专业人员\n\n● 与医生/理疗师保持沟通，获取运动限制和恢复方案\n\n##### 愈合三阶段\n\n表9-1\n\n| I 炎症期\n\n| 前3-4天\n\n| 发红、肿胀、疼痛、局部发烫\n\n| 零负重，主动ROM\n\n| 患处疼痛/肿胀时禁止训练\n\n| II 修复期\n\n| 3天-6周\n\n| 瘢痕初步形成\n\n| 耐受范围内负重，缓慢无痛运动\n\n| III 重塑期\n\n| 4周-2年\n\n| 瘢痕组织力量增加\n\n| 循序渐进无痛运动\n\n● 急性期标准处理：RICE（休息Rest、冰敷Ice、压迫Compression、抬高Elevation）\n\n● 冰敷：间接接触皮肤，每次≤20分钟，前24-48小时冰敷（非热敷）\n\n● 压迫：弹性绷带包扎受伤部位，控制肿胀；绷带应扎牢但不可太紧（以免阻碍静脉血回流）\n\n● 抬高：至心脏水平以上，有助于静脉血回流\n\n##### 伤后训练进度\n\n● 训练进度须始终维持保守态度\n\n● 与医生/理疗师保持联系，获取禁忌动作建议和推荐运动恢复方案"], [6, "跨病症通用原则（续）", "● 严格执行无痛训练课程后，组织重塑可功能完全恢复且无症状\n\n● 受伤部位疼痛 = 应立即停止运动\n\n##### 疼痛管理\n\n● 使用知觉疼痛等级量表（0-10级）\n\n● 疼痛超过3级即停止运动（3级尚未引起不适/痛苦）\n\n● 训练前及训练中持续评估疼痛等级\n\n● 慢性疼痛会造成生物、心理和情绪影响（愤怒、绝望、抑郁、焦虑）\n\n● 与客户沟通疼痛管理要点：\n\n1. 锻炼前说明可能触及患处\n\n2. 解释疼痛等级量表\n\n3. 说明超过3级将中止锻炼\n\n4. 鼓励客户交流任意程度的疼痛\n\n5. 让客户在训练前及全程评估疼痛级别\n\n##### 预防肌肉骨骼损伤"], [6, "跨病症通用原则", "● 柔韧性和弹性：损伤后瘢痕组织降低弹性；长期不运动、放疗、年龄增长均导致弹性下降；弹性差既是损伤成因也是后果\n\n● 热身活动：覆盖所有运动平面，激活本体感受器，增加血流和结缔组织弹性；全方位预备操优先于单平面活动（如步行/骑行）\n\n● 恢复：两节训练课之间留出充分修复时间；拉伸和自我肌筋膜放松舒缓僵硬肌肉\n\n##### 课程设计通用框架\n\n● 热身更为重要（胶原↓、弹性↓），需覆盖所有运动平面\n\n● 先解决ROM受限和姿势不良，再进阶\n\n● 动力链思维：相邻关节功能障碍会影响远端\n\n● 恢复期计划必不可少：组织修复+关节ROM\n\n● 静态拉伸放在锻炼结束时（长时间拉伸后神经抑制、力量↓）；\n\n● 若需抑制过度活跃肌肉/调整姿势，可在简单热身后先做静态拉伸\n\n● 积极恢复计划是成功计划的重要部分\n\n##### 康复期肌肉和心肺训练注意事项\n\n表9-2\n\n| 下肢损伤\n\n| 上半身：坐位或卧位训练；下半身：按理疗师/医生指示；脊柱和髓核：不涉及患肢的训练\n\n| 水中运动；上肢测力计；卧式/固定式自行车\n\n| 任何引起疼痛的动作；负重训练（除非获医生/理疗师允许）\n\n| 上肢损伤"], [6, "跨病症通用原则（续）", "| 下半身：不涉及患肢的训练；上半身：按理疗师/医生指示；脊柱和髓核：不涉及患肢的训练\n\n| 步行；卧式/固定式自行车；椭圆机\n\n| 任何引起疼痛的动作；跑步（动力链影响可能致患肢疼痛）；需双手保持稳定性的训练\n\n| 背部/脊柱损伤\n\n| 理疗师/医生指示的练习和拉伸；可承受范围内的负重训练\n\n| 水中运动；步行；卧式/固定式自行车\n\n| 任何引起疼痛的动作；高频重复动作组（重复8-10次，避免疲乏）；负重脊柱旋转；需接触地面的运动（条件允许可垫高或用按摩椅）"], [6, "1.1 肌肉拉伤（Strain）", "● 肌肉超限工作→肌纤维撕裂；任何类型的用力都可能发生\n\n\n##### 分级\n\n\n表9-3\n\n| I级\n\n| 轻度\n\n| 轻度疼痛/酸痛，微量肿胀\n\n| 肌力正常\n\n| II级\n\n| 中度\n\n| 疼痛肿胀更严重，ROM↓\n\n| 肌力↓，可能跛行\n\n| III级\n\n| 重度\n\n| 肌肉完全撕裂，\"撕裂/断裂\"感，明显变形\n\n| 功能丧失\n\n● III级拉伤在老年人中更常见（胶原组织失去弹性）\n\n● 愈合时间取决于严重程度；轻度损伤愈合各阶段可持续数日至数周；III级可能需要外科干涉\n\n● 随年龄增长，即使轻度拉伤也需更长时间愈合"], [6, "1.2 韧带扭伤（Sprain）", "图9-1\n\n● 外力将韧带拉伸至损伤点（接触性或非接触性）\n\n● ACL撕裂机制：膝关节过伸和/或扭伤\n\n● 接触性：如橄榄球中膝前侧和外侧的撞击产生剪切力\n\n● 非接触性：如篮球中踩硬地面同时突然切球和扭动\n\n● 包含全方位力量和稳定性训练可降低非接触性损伤风险\n\n表9-4\n\n| 轻微触痛/肿胀\n\n| 轻微\n\n| 胶原纤维微观撕裂\n\n| RICE\n\n| 中度触痛/肿胀，ROM↓，可能不稳定\n\n| 部分胶原纤维完全撕裂\n\n| RICE+医生评估\n\n| 明显肿胀/触痛/不稳定\n\n| 韧带完全撕裂/破裂\n\n| 空气夹板+RICE+立即就医\n\n● 客户可能报告听到\"砰砰\"声后随即出现疼痛和肿胀\n\n● II级扭伤出现不稳定、ROM下降和功能丧失"], [6, "1.3 软骨损伤", "图9-2\n\n● 关节受压迫+剪切力→软骨撕裂\n\n● 膝关节最易发生（负重+活动自由度大）\n\n● 年长者关节软骨已退化，较小的力即可撕裂\n\n● 大部分软骨无血管→无法自行愈合，常需手术取出撕裂碎片\n\n● 例外：半月板外侧1/3血管丰富，可手术修复（需较长术后零负重状态）\n\n症状：关节僵硬、咔嗒/砰砰声、腿软、伸直受限、关节闭锁、疼痛肿胀、肌肉无力"], [6, "1.4 骨折", "图9-3\n\n● 压迫力（如伸直腿踩硬表面）、扭力或直接撞击导致\n\n● 骨质疏松/骨癌/感染/放疗/骨量差者风险更高\n\n体征：喀嚓声、变形、肿胀、淤青、疼痛触痛\n\n\n##### 紧急处理\n\n\n● 防止骨骼和软组织进一步受伤，必要时急救应对休克\n\n● 怀疑骨折应立即启动EMS，控制环境让客户静卧休息\n\n● 冰敷可能加剧疼痛\n\n● 仅在偏远地区EMS无法到场时，才用急救技能夹住/固定骨折肢\n\n\n##### 应力性骨折\n\n\n● 骨形成/吸收失衡→反复应力→骨头不足以承受压迫力\n\n● 所有骨头均可发生，股骨颈时有发生，胫骨最常见（常被误认为外胫夹）\n\n● 长跑运动员高风险（骨量未及调整即增加里程）\n\n● 特征：骨头某点触痛，疼痛局部且渐进，负重时加重；某些情况下静息/睡觉时也会酸痛，甚至局部肿胀\n\n● 继续活动→加重→完全骨折风险\n\n● 骨癌症状可能与应力性骨折相似，尽早诊断很重要"], [6, "1.5 脑震荡", "图9-4\n\n● 脑损伤导致精神状态改变（接触性运动、交通事故、跌倒或撞击均可引起）\n\n● 可能伴随或没有短暂性意识丧失\n\n\n##### 体征\n\n\n● 精神错乱、定向障碍、记忆丧失（重复提问、无法认人/识别地点）\n\n● 言语迟钝/不清、动作不协调、头疼、恶心呕吐\n\n● 警觉性降低、平衡感下降、眩晕、惊厥、四肢麻木/失去知觉\n\n\n##### 关键风险\n\n\n● 脑震荡后脑部极脆弱→二次损伤可导致二次撞击综合征（危及生命）\n\n● 必须立即停止活动\n\n● 获有头部损伤治疗经验的合格医疗保健专业人员书面许可前，禁止任何活动\n\n● 许可同时应提供书面活动恢复方案；恢复要循序渐进，私人教练需格外小心防症状复发"], [6, "1.6 椎间盘损伤", "图9-5\n\n● 椎间盘位于两椎骨之间，起减震、支撑和稳定作用，由胶原组成\n\n● 压迫+剪切力→纤维环层撕裂→髓核胶状液渗漏→外层形成肿块\n\n● 膨胀的外层压迫神经或卡在椎骨间→沿神经走向牵涉痛/剧烈疼痛\n\n● Valsalva动作增加受伤风险（打喷嚏/咳嗽同理）\n\n● 常见于腰椎\n\n\n##### 症状\n\n\n● 可能出现坐骨神经痛或其他神经根病体征\n\n● 沿受累神经走向剧烈刺痛、麻木和/或痛感，可能延伸至足部\n\n处理：冰敷缓解疼痛，但需立即就医；客户可能疼到不能走路，需联系EMS转运至急诊室"], [6, "2.1 肌腱炎/滑囊炎/筋膜炎", "表9-5\n\n| 肌腱炎\n\n| 肌腱炎症（-itis = 炎症）\n\n| 过度使用；急性→可转为慢性\n\n| 滑囊炎\n\n| 滑囊发炎\n\n| 急性外伤有时引起；更多是反复应力/肌肉失衡/肌紧张\n\n| 筋膜炎\n\n| 结缔组织（筋膜）发炎\n\n| 常见：足底筋膜炎、IT束摩擦综合征\n\n● 急性肌腱炎 = 处于损伤愈合炎症阶段的肌腱炎\n\n● 处理不当均可转为慢性"], [6, "2.2 应力性骨折", "图9-6\n\n● 骨形成/吸收失衡处发生\n\n● 胫骨最常见，常被误认为外胫夹\n\n● 关键鉴别：应力性骨折为骨头某点触痛，疼痛局部、渐进、负重加重\n\n● 某些情况下静息/睡觉时酸痛，甚至局部肿胀\n\n● 继续活动→症状加重→完全骨折风险\n\n● 需转介给医生诊断和治疗（骨癌症状可能类似，需排除）"], [6, "3.1 肩部——肩峰撞击综合征/肩袖损伤", "图9-7\n\n● 肩关节窝浅→骨稳定性差，靠盂唇+韧带+肩袖加固\n\n● 肌肉力量/稳定性不足 + 不良姿势（圆肩/胸椎后凸）→肩胛骨偏离（偏向上侧和前侧）→肩峰下间隙变窄\n\n● 冈上肌腱鞘+肩峰下滑囊被压迫→肩峰撞击综合征\n\n● 可伴肱二头肌长头肌腱炎\n\n● 肩袖弹性↓→肩袖撕裂（发生率随年龄↑）\n\n● 肩袖肌肉作用：在过头运动中降低肱骨向前速度并稳定肱骨在关节窝中\n\n● 多数人其他软组织可代偿→即使全层肩袖撕裂也可选择保守治疗和物理疗法而非手术\n\n##### 课程设计四步法\n\n1. 解决不良姿势（圆肩/脊柱后凸）→伸展肩部前侧和前胸（抑制过度活跃肌肉，可在热身时完成）\n\n2. 强化肩胛骨稳定肌（下斜方肌、中斜方肌、前锯肌）+肩袖\n\n3. 通过受控前推动作改善肩前肌肉和胸大肌\n\n4. 最后引入过头运动（在肩胛面——额状面前30°完成，防撞击/挤压）\n\n##### 关键动作\n\n● 坐姿划船（强化肩胛稳定肌）\n\n● 前锯肌推举\n\n● 鸟狗式（闭链负重训练，激活肩袖而不使组织恶化）\n\n● 农夫行走（开链训练，激活肩袖）\n\n##### 注意事项"], [6, "3.1 肩部——肩峰撞击综合征/肩袖损伤（续）", "● 应避免需要举过头的训练（稳定性和力量需求超出受损肩关节能力）\n\n● 过头动作使肱骨头与肩峰接触更紧密，增加撞击风险\n\n● 上半身整体力量、稳定性和ROM训练应纳入常规项目，预防疼痛和功能丧失"], [6, "3.2 肘、腕和手", "##### 背景\n\n● 工作及休闲中长期使用鼠标和键盘→过度使用损伤日渐增多\n\n● 归咎于长时间静负荷及不恰当的办公设置\n\n##### 3.2.1外上髁炎（网球肘）\n\n图9-8\n\n● 肱骨外上髁起点附近→腕伸肌肌腱过度使用或反复外伤性损伤\n\n● 30-55岁成年人常见\n\n##### 3.2.2内上髁炎（高尔夫球肘）\n\n图9-9\n\n● 肱骨内上髁→腕屈肌肌腱在起始处附近的过度使用或反复外伤性损伤\n\n##### 3.2.3腕管综合征\n\n图9-10\n\n● 屈肌支持带下肌腱发炎→腕骨和屈肌支持带之间狭小间隙内炎症刺痛腕管→压迫正中神经→疼痛和麻木\n\n● 建议客户向人力资源部申请工作环境的人体工程学评估\n\n##### 课程设计注意事项\n\n● 肌腱发炎时应避免增加压力，消除所有可导致疼痛或不适的因素\n\n● 需要腕部屈曲、伸展或握紧的训练需进行调整\n\n● 腕管综合征适用与肘腱炎相同的注意事项\n\n● 训练时使用夹板或矫形器可能有益（尤其持续疼痛的客户），但需由医生定夺\n\n● 运动时应穿戴医生推荐和指定的手腕托，并遵从指导"], [6, "3.2 肘、腕和手（续）", "1. 预防过度使用：牵引训练时引入多种手柄增加舒适感，和/或戴手套增加手与手柄/器械之间的摩擦力（减轻受损组织负荷）\n\n2. 在各运动平面上缓慢拉伸，增加ROM\n\n3. 通过训练改善腕部和手部力量（如俯卧撑、腕部屈伸）\n\n4. 取下手柄或手套，在耐受范围内逐步增加牵引训练重量"], [6, "3.3 肘/腕/手病症关键记忆点", "● 网球肘 = 外上髁 + 伸肌肌腱；高尔夫球肘 = 内上髁 + 屈肌肌腱\n\n● 腕管综合征 = 正中神经受压→疼痛麻木；需人体工程学评估\n\n● 训练调整：多种手柄/手套/腕带减少握力需求\n\n● 调整使腕部处于中间位置的训练项目（如正手窄握支撑架做俯卧撑）"], [6, "4.1 颈部", "图9-11\n\n● 胸椎后凸加重→头部前倾姿势→颈部肌肉异常压力\n\n● 脊柱通过骨性凸起物和软组织连接→任一位置错位引起连锁反应\n\n● 示例：右侧腰骶段的竖脊肌（ace课本为这个骶竖肌，但不符合解剖学规范用语，特此标注。）紧张→右外侧屈曲→右肩抬高→左侧颈痛\n\n● 解决动力链全段缩短的组织，不只是患处\n\n● 单独强化颈部肌肉不应作为训练课程目标\n\n\n##### 课程设计步骤\n\n\n1. 观察颈部相对胸椎和肩部位置→先矫正脊柱和肩部（圆肩和脊柱后凸尤其常见）\n\n2. 教授柔和动作和拉伸（侧向拉伸、旋转拉伸）→客户感到不适时可随时进行\n\n3. 疼痛严重或持续→转介给医生"], [6, "4.2 下背部", "图9-12\n\n● 80%成人会出现下背部疼痛，30%转为慢性\n\n● 最常见于30-50岁人群；主要致残原因之一\n\n● 常见原因：肌肉拉伤、长期静态姿势不良引起的软组织应激、身体素质差、椎间盘疾病、骨关节炎、类风湿性关节炎、强直性脊柱炎、癌症\n\n● 明显脊柱前凸→腰骶段的竖脊肌（ace课本为这个骶竖肌，但不符合解剖学规范用语，特此标注。）+髋屈肌紧张+后侧链无力→下背部僵硬/疼痛\n\n● 髋部灵活性不足→腰椎ROM代偿性增加（腰椎应保持不动）\n\n● 竖脊肌是稳定肌，不是强大伸肌；臀肌和腘绳肌才是真正的髋伸肌\n\n● 椎间盘损伤常发生在腰椎→可能出现坐骨神经痛/神经根病\n\n##### 关键肌肉对躯干/骨盆稳定性的作用\n\n表9-6\n\n| 臀大肌\n\n| 髋伸肌；支撑骨盆和躯干稳定；保持正确骨盆位置\n\n| 腘绳肌\n\n| 髋伸肌；支撑骨盆和躯干稳定；紧张时抑制髋铰链→骨盆后倾\n\n| 腹直肌\n\n| 稳定躯干；保持正确骨盆位置\n\n| 腹内/外斜肌\n\n| 背阔肌\n\n| 附着胸腰筋膜→为腰椎提供稳定性\n\n| 髋屈肌\n\n| 紧张时抑制髋铰链→骨盆前倾\n\n| 髋内旋肌\n\n| 髋外旋肌\n\n| 紧张时抑制髋铰链→骨盆后倾"], [6, "4.2 下背部（续）", "1. 纠正左右侧不平衡\n\n2. 纠正前倾/后倾不良姿势（骨盆前倾或后倾）\n\n3. 增加髋关节功能性内/外旋程度（如伐木训练向下=内旋，向上=外旋）\n\n4. 强化后侧链肌群（尤其腘绳肌和臀肌）\n\n日常脊柱稳定训练（每天都进行最有效）\n\n● 猫牛式：有节律动作改善柔韧性并给组织热身；是动作训练非拉伸，重点在动作而非推到极限；猫式呼气，牛式吸气，中立位换气\n\n● 改良式卷腹：保持腰椎中立位（手/毛巾垫于腰下）；一只膝弯一只腿伸直，锁定骨盆-腰椎位置；中间点交替弯曲腿"], [6, "4.2 下背部", "● 鸟狗式：双手对肩、双膝对髋→找到脊柱中立位→腹 muscles 保持稳定→对侧手臂和腿同时抬起→每侧保持5-8秒改善肌肉耐力\n\n● 侧桥：腰方肌和腹部斜肌实现最佳稳定性；初级=肘+膝支撑→进阶=肘+脚支撑；维持颈部和脊柱中立位；每侧保持5-8秒\n\n● 下背部训练：耐力优先于力量（慢缩姿势肌有保护作用）\n\n● 重复低难度动作增强姿势耐力和力量\n\n\n##### 下蹲动作要点\n\n\n● 下蹲是ADL中必要的动作模式（坐椅子、进出车辆、使用马桶）\n\n● 常见缺陷：髋关节铰链协调性缺乏+后侧链肌群力量缺乏→膝盖向前超过脚趾→膝关节疼痛+下背部承受不必要压力\n\n● 调整方案：\n\n● 椅式（适合稳定性/力量/ROM不佳者）：握住固定物站在箱子/长凳前，向后向下坐；先屈髋再屈膝，双脚紧踩地面；可垫高座位降低难度；增大难度时减少手臂借力/降低箱子高度\n\n● 自重深蹲（适合稳定性/力量/ROM尚可者）：侧重正确髋铰链和膝关节对齐；出现膝外翻时提醒向地面用力激活稳定肌\n\n● 弹力带深蹲（适合准备增加后侧链力量但未准备杠铃/哑铃深蹲者）：弹力带抵消部分体重提供支撑；全程需后侧链和脊柱稳定肌对抗向前拉力"], [6, "5.1 髋关节", "● 球窝关节，可进行多方向运动；髋臼是较深的骨性关节窝\n\n● ROM有限，与关节囊和肌肉结构一起产生显著稳定性\n\n● 久坐使髋部前侧肌肉缩短、后侧拉长→影响关节铰链能力\n\n● 功能障碍可能上移至下背部或下移至膝部\n\n##### 梨状肌综合征\n\n图9-13\n\n● 梨状肌发紧/紧绷/发炎→压迫穿过梨状肌的坐骨神经和孖肌→类似腰椎间盘损伤的神经根病症状\n\n● 22%人群坐骨神经隔断（穿过）梨状肌→更易患病\n\n● 至少6%\"下背痛\"患者实际为梨状肌综合征\n\n● 梨状肌作用：步行中充当髋外旋肌，稳定股骨头\n\n● 评估要点：关注髂脊高度→评估骨盆位置及与股骨相对位置\n\n● 示例：左侧骨盆高→左侧股骨相对骨盆内收+内旋→左侧肌肉被拉紧（IT束、外旋肌群、臀大肌）→坐骨神经受压\n\n● 课程设计：平衡左右骨盆位置（紧张侧静态拉伸+紧绷侧强化）+髋关节闭链内外旋训练（改善灵活性和稳定性）\n\n##### 髋关节炎/髋关节置换术\n\n● 关节炎：慢性疾病，关节疼痛和发炎\n\n● 稳定性和强化训练可改善动作，提高ADL效率\n\n● 保守治疗失败可建议髋关节置换术/全髋关节成形术"], [6, "5.1 髋关节（续）", "● 术后前几个月接受常规理疗；理疗结束后ROM可能与非手术侧不等\n\n● 卧式自行车：改善心肺+ROM+股四头肌力量（优于固定式自行车，屈曲程度更大，更好挑战ROM）\n\n● 固定式自行车：屈曲程度较小，适合努力恢复ROM的客户\n\n● 柔和拉伸和动态ROM练习可鼓励进行，但期望须符合实际\n\n##### 髋关节课程设计四步法\n\n2. 改善髋关节内/外旋ROM+单脚站立稳定性\n\n3. 改善髋关节铰链灵活性和稳定性\n\n4. 改善后侧链肌群力量\n\n注意：每一侧训练和伸展不同——一侧紧张肌肉做伸展，对侧较弱肌肉做强化；尽早在锻炼中加入静态拉伸（简单热身后），抑制紧张肌肉、增加ROM"], [6, "5.2 膝部", "● 典型铰链式关节，但有2-3度旋转；由强健韧带和筋膜支撑，灵活性高（可弯曲至130°）\n\n● 唯一穿过膝关节的肌腹是腘肌；其他移动/固定膝关节的肌肉以肌腱形式穿过\n\n● 软骨损害和韧带扭伤常见\n\n##### 5.2.1髂胫束（IT束）摩擦综合征\n\n图9-14\n\n● IT束远端与股骨外侧上髁反复摩擦→膝外侧烧灼/刺痛（剧痛或刺痛）\n\n● 15-50岁活跃人群常见（跑步者、骑行者、排球/举重运动员）\n\n● 风险因素：过度使用、装备不当/鞋子不合脚、跑步平面改变、肌力失衡（无力或紧张）、结构异常（扁平足、膝外翻、下肢不等长）\n\n● 骨盆失衡→IT束紧绷→增加与股骨外侧上髁接触\n\n● 左侧骨盆高→左侧IT束紧绷\n\n● 右侧阔筋膜张肌紧张→也可增加IT束与股骨外侧上髁接触\n\n● 课程设计：紧张侧自我肌筋膜放松+静态伸展→纠正骨盆失衡→增加ROM和纠正左/右侧失衡\n\n##### 5.2.2膝部肌腱炎\n\n图9-15\n\n● 常见部位：髌腱、鹅足腱、股四头肌腱\n\n● 跑步/上下楼梯/下蹲时疼痛\n\n● 存在膝关节功能障碍时，关注髋关节、踝关节和足部（膝关节依赖临近关节保持稳定和缓冲地面反作用力）"], [6, "5.2 膝部（续）", "● 足部旋前/旋后静态姿势评估→发现失衡→立即选择适当训练强化ROM或增强训练\n\n● 髌骨肌腱炎时：四头肌很可能紧张→增加髌骨与股骨髁间压力→自我肌筋膜放松+伸展解决\n\n● 肌肉训练侧重后侧链力量恢复（腓肠肌、腘绳肌、臀肌）\n\n● 与客户保持沟通疼痛等级，疼痛限制时停止训练\n\n##### 5.2.3髌股疼痛综合征（PFPS）\n\n图9-16\n\n● 过度使用+生物力学改变+肌肉功能障碍→髌骨轨迹异常→软骨磨损→髌骨软骨软化\n\n● 关键机制：膝关节屈曲时股骨内旋失控（膝外翻/X形腿）或IT束紧张将髌骨拉出滑车沟\n\n● 下楼/下坡时疼痛加剧\n\n● 生物力学异常因素："], [6, "5.2 膝部", "● 扁平足→改变膝关节排列→胫骨/股骨代偿性内旋→改变髌股关节动力学\n\n● IT束紧张→通过筋膜对髌骨产生过度横向力\n\n● 腓肠肌/比目鱼肌紧张→代偿性内转+过度后向力→髌股关节压力↑\n\n● 相关肌无力：\n\n● 髋外展肌和外旋肌无力→活动时股骨内旋+膝外翻→髌股轨迹异常\n\n● 需要四头肌减缓膝关节屈曲的活动（下楼梯、步行跑下坡）时，髌骨和股骨间隙变窄→疼痛加剧\n\n● 课程设计四步法：\n\n2. 解决髋部/踝部/足部肌紧张和不稳定（防止股骨内旋）\n\n● 注意：开链膝关节伸展（坐位膝关节伸展）对单膝疼痛者应避开→选择负重闭链训练\n\n\n##### 膝关节炎/膝关节置换术\n\n\n● 保守治疗失败可建议膝关节置换术/全膝关节成形术\n\n● 术后四头肌强化很重要，自行车训练课程有帮助\n\n● 全膝关节ROM可能无法完全恢复\n\n● 下蹲是重要运动模式，但膝关节ROM可能限制下蹲深度；掌握正确髋铰链节奏后，直腿硬拉可增加后侧链力量\n\n\n##### 膝关节课程设计四步法\n\n\n2. 解决髋部/踝部/足部可能造成股骨内旋的肌紧张和不稳定\n\n共同注意：每一侧训练和伸展不同；尽早加入静态拉伸增加ROM"], [6, "5.3 脚踝和小腿", "##### 5.3.1外胫夹（胫骨内侧压力症候群 MTSS / 前外胫夹）\n\n图9-17\n\n● \"外胫夹\"是描述劳力性小腿疼痛的一般术语\n\n● MTSS（后外胫夹）= 骨膜炎（骨膜炎症），影响腿部后关节腔肌肉（胫骨后肌、趾长屈肌、拇长屈肌和腘肌）\n\n● 活跃人群的过劳性损伤，运动诱发性疾病，往往由活动突然变化引起\n\n● 跑步者、舞蹈员和军人的常见损伤\n\n● 前外胫夹 = 前关节腔肌肉受累（胫骨前肌、趾长伸肌、拇长伸肌及筋膜和骨膜内层）\n\n● 与劳力性活动有关，病因尚未完全掌握\n\n● 与应力性骨折鉴别：外胫夹不需要彻底静休，调整训练课程即可\n\n● 课程设计调整：\n\n● 提供低冲击力/低里程数项目+交叉训练备选（如停止跑步→改为骑行和游泳）\n\n● 各部位有时间休息和愈合\n\n● 逐步引入完整动作而不引起症状复发\n\n● 小腿肌群（尤其比目鱼肌）无痛拉伸可有效缓解MTSS症状\n\n● 静态姿势和动态评估→发现足部/踝关节错位或不稳定→恢复运动需改善足部和踝关节柔韧性和稳定性\n\n##### 5.3.2脚踝扭伤\n\n图9-18\n\n● 每年影响200万美国人（运动和高度活跃人群仅占一半）"], [6, "5.3 脚踝和小腿（续）", "● 外侧/内翻性扭伤最常见（约75%）→距腓前韧带、跟腓韧带、距腓后韧带\n\n● 机制：过度跖屈+内翻\n\n● 70%外侧扭伤导致反复性扭伤和慢性症状\n\n● 内侧/外翻性少见（外侧腓骨头加固）；内侧三角肌韧带最常受累，损伤常需排除骨折\n\n##### 恢复训练\n\n● 遵循与其他扭伤一样的运动恢复指导\n\n● 负重关节，可能需更长时间恢复\n\n● 愈合早期可能需使用拐杖；医生可能要求使用支架\n\n● 可继续锻炼非损伤区域（如上半身）；损伤区域始终在运动中受保护\n\n● 物理疗法结束后关键第一步：修复本体感受、柔韧性和力量\n\n● 韧带是本体感受反馈的主要来源\n\n● 渐进式单腿训练促进本体感受"], [6, "5.3 脚踝和小腿", "● 避免在不平稳表面训练（半泡沫滚筒/微型蹦床）→超负荷本体感受系统（尤其初始阶段）\n\n● 侧向运动打开外侧踝关节→可能产生不必要张力→确保客户准备好后再进行冠状面运动\n\n##### 5.3.3跟腱炎\n\n图9-19\n\n● 跟腱炎症→可能发展为II级或III级拉伤（尤其>45岁）\n\n● III级拉伤=跟腱断裂，多由慢性跟腱炎引起\n\n● 常见损伤机制：突然从站立位启动运动（如垒球比赛离开一垒）\n\n● 结构性因素：高弓足、扁平足、腿长不等、外侧踝不稳\n\n● 健身相关因素：训练机制不当、鞋子不合脚、肌肉无力、柔韧性差\n\n● 课程设计可纳入具体训练项目逐步改善弹性；任何要求多平面反应度和脚趾离地推动的训练均可达成目标\n\n● 进阶路径：简单提踵→绳梯操练\n\n● 重获小腿柔韧性是关键，但避免过度拉伸跟腱（会刺激肌腱）\n\n● 柔和动态拉伸作为热身一部分\n\n● 站立位拉伸小腿时脚保持中立位（避免过度旋前/旋后），脚直指前方\n\n● 逐步恢复背屈ROM和力量+步行抬脚阶段控制力\n\n##### 5.3.4足底筋膜炎\n\n图9-20\n\n● 足底/跖表面结缔组织发炎\n\n● 可运动，但医疗专业人员可能叮嘱限制"], [6, "5.3 脚踝和小腿（续）", "● 目标：让客户感到具有挑战性但不使足部负荷过度的健身计划\n\n● 将特定足部运动整合到一般健身计划中效果最好\n\n● 拉伸腓肠肌/比目鱼肌/足底筋膜→缓解症状\n\n● 自我肌筋膜放松（足底滚网球/自我肌筋膜放松球/高尔夫球）→提高背屈ROM+缓解疼痛\n\n● 对整个后侧链肌群运用自我肌筋膜放松术也可提高背屈ROM\n\n● 强化足内在肌→改善足弓稳定性→减少足底筋膜压力\n\n##### 足/踝/小腿课程设计四步法\n\n1. 解决足部和脚踝灵活性和稳定性\n\n2. 改善控制矢状面运动的肌肉力量\n\n3. 改善控制横状面和冠状面运动的肌肉力量\n\n##### 日常训练建议"], [6, "5.3 脚踝和小腿", "● 拉伸：每日一次或每两天一次最有效；可推荐客户自行完成\n\n● 即使存在小腿/足部功能障碍，用网球对足底筋膜自我肌筋膜放松也有益\n\n● 平衡练习：每天做无过度使用风险；如刷牙时用患肢单脚站立练习平衡（每天两次1-2分钟本体感受训练）\n\n表9-7\n\n表9-8\n\n| 愈合三阶段\n\n| 炎症期（3-4天）→修复期（~6周）→重塑期（4周-2年）；急性期RICE处理\n\n| 疼痛阈值\n\n| 疼痛>3级即停止运动\n\n| 肌肉拉伤\n\n| I级轻/II级中/III级重（完全撕裂）；老年人更易III级\n\n| 韧带扭伤\n\n| I级微裂/II级部分撕裂/III级完全断裂；ACL机制=过伸+扭伤\n\n| 软骨损伤\n\n| 大部分无血管→无法自愈；半月板外侧1/3例外\n\n| 脑震荡\n\n| 二次撞击综合征可致命；必须完全停止直到获医疗许可\n\n| 椎间盘损伤\n\n| 压迫+剪切力→纤维环撕裂→髓核渗漏→压迫神经→牵涉痛；Valsalva也增加风险\n\n| 肩峰撞击\n\n| 肩胛面过头推举（额状面前30°）；先矫正姿势→强化肩胛稳定肌→再过头\n\n| 网球肘\n\n| 外上髁=伸肌肌腱；30-55岁常见；避免增加压力/腕部屈曲伸展握紧"], [6, "5.3 脚踝和小腿（续）", "| 高尔夫球肘\n\n| 内上髁=屈肌肌腱；30-55岁常见；同网球肘注意事项\n\n| 腕管综合征\n\n| 屈肌支持带下→压迫正中神经→疼痛麻木；需人体工程学评估\n\n| 肘/腕/手课程四步\n\n| 预防过度使用（多手柄/手套）→各平面拉伸增ROM→腕手力量训练→逐步增牵引重量\n\n| 颈部\n\n| 脊柱错位引起连锁反应→解决动力链全段，不只是患处；单独强化颈部不应作为目标\n\n| 下背部\n\n| 80%成人会发生；30%转慢性；耐力优先于力量；每天训练最有效\n\n| 下背部四步\n\n|
