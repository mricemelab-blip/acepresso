纠正左右不平衡→纠正骨盆前/后倾→增加髋旋转ROM→强化后侧链\n\n| 日常脊柱训练"], [6, "5.3 脚踝和小腿", "| 猫牛式（动作训练非拉伸）+改良卷腹+鸟狗式（5-8秒/侧）+侧桥（5-8秒/侧）\n\n| 梨状肌综合征\n\n| 22%坐骨神经穿过梨状肌；≥6%\"下背痛\"实为梨状肌综合征\n\n| IT束摩擦\n\n| 膝外侧疼痛；骨盆失衡→IT束紧绷→摩擦股骨外侧上髁\n\n| 膝部肌腱炎\n\n| 髌腱/鹅足腱/股四头肌腱；四头肌紧张→增加髌骨压力→自我肌筋膜放松+伸展\n\n| PFPS\n\n| 股骨内旋失控+IT束紧张→髌骨轨迹异常；下楼/下坡痛加剧；扁平足/腓肠肌紧张/髋外展外旋无力均相关\n\n| 膝关节注意\n\n| 避开开链膝伸展→选闭链负重训练；全膝ROM可能无法完全恢复\n\n| 外胫夹 vs 应力性骨折\n\n| 外胫夹不需完全休息；应力性骨折为某点触痛、局部渐进痛\n\n| 踝扭伤\n\n| 75%在外侧；70%导致反复扭伤；机制=过度跖屈+内翻\n\n| 踝扭伤恢复\n\n| 修复本体感受→渐进单腿训练；避免不平稳表面；侧向运动确保准备好后再进行\n\n| 跟腱炎\n\n| 柔韧性是关键但避免过度拉伸；可进展为跟腱断裂（>45岁高危）；脚保持中立位直指前方\n\n| 足底筋膜炎"], [6, "5.3 脚踝和小腿（续）", "| 拉伸小腿+足底筋膜；滚球自我肌筋膜放松提高背屈ROM+缓解疼痛；强化足内在肌改善足弓\n\n| 下肢课程通用\n\n| 灵活性/稳定性→矢状面→冠状面/横状面→后侧链力量"], [6, "自测练习", "以下题目基于本章知识要点，点击展开参考答案。\n\n答案：正确。主流观点认为人类肌肉增长主要依靠肌纤维截面积增加（肥大），肌纤维数量增加（增生）在人体中尚无定论。\n\n答案：错误。训练初期的力量提升主要来自神经适应（neural adaptation），即神经系统更有效地募集和激活运动单位。肌纤维肥大需要更长时间的持续训练才能显现。\n\n答案：错误。软骨确实没有血管，营养靠关节滑液扩散，但关节活动时滑液流动加快、扩散效率更高，适度活动反而有利于软骨健康。\"休息不动\"并非关节问题的最佳解决方案。\n\n答案：正确。IFT模型的核心逻辑是先建立姿势稳定性和动力链灵活性（功能），再训练高效动作模式（动作），最后发展力量/爆发力/耐力（负荷/速度）。不能跳步，所有新客户从功能性训练开始。\n\n答案：正确。Y平衡测试前部差异>4cm（1.6英寸）是下肢损伤高风险的指标，需加强髋外展肌群和踝关节稳定性训练，暂缓进阶。\n\n答案：正确。McGill比值三项标准为：屈伸比<1.0（屈肌不能比伸肌耐力强太多）、左右侧桥比0.95-1.05（近似对称）、侧桥:伸展<0.75（侧向稳定肌耐力不超过伸展肌的75%）。"], [6, "自测练习（续）", "答案：错误。这一说法不应被当作适用所有人的绝对规则。过度限制膝关节前移会将更多力矩转移至髋关节和躯干，导致代偿。股骨较长的人在正确屈髋主导模式下，膝盖超过脚趾通常是安全的。应结合个体解剖、负荷和动作目标判断。\n\n答案：错误。把\"客户有经验\"等同于\"客户动作正确\"是常见误区。即使是有经验的训练者，长时间停训后动作模式可能退化，应先进行动作评估，确认5种动作模式无代偿后，才能进入负荷/速度训练阶段。"], [6, "自测练习", "答案：正确。1-RM评估挑战身体极限，伴随关节压力、心血管应激等风险。禁忌人群包括：新手、高血压/血管疾病、骨科限制（骨折未愈合、严重骨质疏松）、妊娠晚期、未控制的代谢疾病、急性损伤期、未充分热身或2小时内完成长时间静态拉伸者。\n\n答案：正确。动作训练阶段在功能性训练建立的关节活动度基础上，训练客户在矢状面、额状面和水平面内正确执行五种主要动作模式（口诀\"屈单推拉旋\"），核心要求是不影响姿势或关节稳定性的前提下高效完成动作。"], [6, "知识翻卡", "共 12 张知识卡片，点击翻转查看答案\n\n\n##### 肌肉训练处方设计清单\n\n\n- 评估客户力量训练经验和目标\n\n- 选择负荷：初学者 60-70% 1RM / 中级 70-80% / 高级 80-100%\n\n- 确定组数和次数（根据目标：力量/肥大/耐力）\n\n- 选择练习动作（单关节 vs 多关节）\n\n- 确定训练顺序（大肌群→小肌群，多关节→单关节）\n\n- 设定组间休息时间（力量3-5min / 肥大30-90s / 耐力<30s）\n\n- 确定频率：每个肌群每周≥2次\n\n- 制定渐进超负荷计划\n\n- 教授正确动作技术和呼吸模式\n\n- 记录训练日志（重量×次数×组数）\n\n\n---"], [7, "慢性病客户注意事项", "本章节内容按\"核心机制→症状要点→运动改善模式→安全注意\"四段结构组织"], [7, "跨疾病通用原则（所有疾病都适用的原则）", "##### 医学许可与筛查\n\n\n● 所有慢性病客户开始运动前需获得医学许可\n\n● 遵循ACE整合式Fitness训练模型的一般原则，根据疾病特点个性化调整\n\n● 使用SOAP笔记记录客户进展（主观→客观→评估→计划）\n\n\n##### 运动处方通用框架\n\n\n● 心肺：FITT-VP（频率、强度、时间、类型、进阶、变化）\n\n● 肌力：频率、强度、时间、类型、进阶\n\n● 强度监控：HRR%、VO₂R%、RPE、VT1/VT2\n\n\n##### 多学科协作\n\n\n● 私人教练需与治疗医生、理疗师、注册营养师、心理健康专业人员保持沟通\n\n● 多学科方法优于单一药物或单一干预\n\n\n##### 生活方式干预核心\n\n\n● 所有慢性病共同建议：适度（适量营养+热量+运动频率/强度/时间）\n\n● 减重、增加身体活动、健康饮食、戒烟是共性初始策略"], [7, "1.1 冠状动脉疾病（CAD）", "##### 核心机制\n\n● 动脉粥样硬化：血管壁炎症→脂质斑块沉积→管腔狭窄→心肌供血不足\n\n● 心梗（MI）触发：脆弱斑块破裂→血栓形成→动脉完全堵塞\n\n##### 症状要点\n\n● 心绞痛（胸痛/胸闷，运动时加重）\n\n● 呼吸困难\n\n● 运动耐量下降\n\n● 风险因素：家族史、高血压、血脂异常、糖尿病、吸烟、久坐、不良饮食\n\n##### 运动改善模式\n\n表7-1\n\n| 频率\n\n| 心肺：≥3天/周（最好5天+）；肌力：2-3天/周\n\n| 强度\n\n| 心肺：40-80% HRR，RPE 12-13，≤VT1；肌力：RPE 11-13\n\n| 时间\n\n| 心肺：20-60分钟（含5-10分钟热身放松）；肌力：1-3组×10-15次，8-10个动作\n\n| 类型\n\n| 心肺：踏车、椭圆机、划船机、步行；肌力：小重量起始→逐渐过渡到器械\n\n##### 安全红线\n\n● 必须获得医学许可后方可开始训练\n\n● 终止运动的信号：心绞痛、呼吸困难、头晕、面色苍白、心率超目标\n\n● 避免Valsalva动作（憋气）\n\n● 低风险标准：住院过程无并发症、无缺血证据、功能能力>7METs、射血分数>50%"], [7, "1.2 高血压", "图7-1\n\n● 原发性（90-95%）：病因不明，遗传+环境交互\n\n● 继发性（5-10%）：肾脏疾病等可识别原因\n\n● 关键可变风险因素：压力、体脂过多、钠摄入、酒精、久坐、睡眠不足（OSA）\n\n##### 诊断标准（2017 ACC/AHA）\n\n表7-2\n\n| 正常\n\n| <120\n\n| <80\n\n| 偏高\n\n| 120-129\n\n| 1期\n\n| 130-139\n\n| 80-89\n\n| 2期\n\n| ≥140\n\n| ≥90\n\n表7-3\n\n| 大多数/所有天数\n\n| 40-59% HRR，RPE 12-13，<VT1（可舒适交谈）\n\n| ≥30分钟连续或累积（可分10分钟间歇）\n\n| 有节奏大肌群：步行、慢跑、骑车、游泳\n\n| 肌力\n\n| 60-80% 1-RM，2-4组×8-12次，避免Valsalva\n\n##### 关键数据\n\n● 单次运动后血压可降低5-7 mmHg，持续24小时\n\n● 每周≥150分钟运动量降压效果最大\n\n● 生活方式改变（DASH饮食+运动+减重）效果可媲美药物\n\n##### 安全注意\n\n● 服用β受体阻滞剂/钙通道阻滞剂者：用RPE监控强度，缓慢变换体位"], [7, "1.2 高血压（续）", "● 服用利尿剂者：注意补液，防止脱水和运动后低血压\n\n● 体位性低血压者：转介医疗专业人员评估用药"], [7, "1.3 中风", "图7-2\n\n● 缺血性（~80%）：脑血管被血栓/斑块堵塞\n\n● 出血性（~20%）：脑血管破裂\n\n\n##### 警示信号（FAST原则）\n\n\n● Face：面部突然下垂\n\n● Arms：手臂突然无力\n\n● Speech：说话困难/理解障碍\n\n● Time：立即呼叫急救\n\n表7-4\n\n| 心肺：3-5天/周；肌力：2个非连续日\n\n| 心肺：轻-中-剧烈均可，40-70% HRR或RPE 11-14；肌力：50-70% 1-RM\n\n| 心肺：20-60分钟，可分多轮；肌力：1-3组×8-15次\n\n| 心肺：踏车、卧式踏步机、跑步机步行；肌力：器械优先（安全性高）\n\n\n##### 关键要点\n\n\n● 运动可改善CVD风险因素（血压、血脂、胰岛素敏感性）\n\n● 运动可改善平衡/协调/步态\n\n● 即使中风后数年，运动仍能改善运动功能\n\n● 运动指南应来自理疗师/职业治疗师"], [7, "1.4 外周动脉疾病（PAD）", "图7-3\n\n● 下肢动脉粥样硬化→病变远端血流减少→缺血性跛行（运动性下肢疼痛）\n\n● 最常见病变部位：腹主动脉/髂骨、股骨、腘动脉、胫骨动脉\n\n● 跛行：行走一定距离后出现下肢钝痛/酸痛/痉挛\n\n● 休息后缓解，再走再痛\n\n● 重症者静息时也疼痛\n\n\n##### 运动改善模式（核心：间歇步行训练）\n\n\n表7-5\n\n| 3-5天/周\n\n| 中等强度，以疼痛强度为准（非心率）；跛行疼痛量表3-4级（轻-中度）\n\n| 30-45分钟（不含休息），逐步至60分钟；12周为一周期\n\n| 承重步行（间歇性）：走至中度疼痛→坐下休息→疼痛消失→继续\n\n\n##### 关键机制\n\n\n● 步行产生缺血→刺激侧支循环形成+毛细血管/线粒体密度增加→氧气利用改善\n\n● \"高强度\"在此语境指疼痛强度，非能量消耗\n\n● 出现CAD症状（胸痛等）→立即停止，需医学评估\n\n● 足部护理至关重要（尤其合并糖尿病者）\n\n● 穿合适的鞋袜"], [7, "2.1 血脂异常", "图7-4\n\n● 脂质代谢紊乱：总胆固醇↑、LDL↑、TG↑、HDL↓ → 动脉粥样硬化\n\n● 关键脂蛋白：\n\n● LDL（\"坏\"胆固醇）：促进动脉粥样硬化\n\n● HDL（\"好\"胆固醇）：运输脂质至肝脏排泄，与CAD负相关\n\n● 非HDL胆固醇：HDL之外的总胆固醇，识别致动脉粥样硬化颗粒，优于LDL\n\n● TG：独立风险因素，慢性升高→内皮功能障碍\n\n##### 诊断标准\n\n表7-6\n\n| LDL\n\n| <100\n\n| 130-159\n\n| 160-189\n\n| ≥190\n\n| 总胆固醇\n\n| <200\n\n| 200-239\n\n| ≥240\n\n| —\n\n| HDL\n\n| ≥60（高=保护性）\n\n| <40（低=风险）\n\n| TG\n\n| <150\n\n| 150-199\n\n| 200-499\n\n| ≥500\n\n表7-7\n\n| 心肺：≥5天（最大化热量消耗）；肌力：2-3天\n\n| 心肺：40-75% HRR，低于/等于/高于VT1但<VT2；肌力：50-85% 1-RM（力量）或<50%（耐力）"], [7, "2.1 血脂异常（续）", "| 心肺：30-60分钟（减重建议50-60分钟）；肌力：2-4组×8-12次（力量）或12-20次（耐力）\n\n| 心肺：有节奏大肌群；肌力：器械/自由重量/体重\n\n● LDL：单纯运动对LDL改善不一致，需结合减重\n\n● HDL：心肺适能提高→HDL普遍增高；减脂可使HDL增高更多\n\n● TG：心肺训练最有效（TG可作燃料）；肌力训练无效\n\n● 运动量阈值：每周250-300分钟，消耗~2000千卡→多数成年人可降低体重/体脂\n\n● 餐后脂血症（PPL）：单次中等强度运动30-60分钟→TG降低持续12-36小时→建议至少隔天运动一次"], [7, "2.2 糖尿病", "图7-5\n\n##### 1型糖尿病\n\n● 自身免疫攻击胰岛β细胞→胰岛素绝对缺乏\n\n● 需注射/泵入胰岛素调节血糖\n\n● 血糖控制=饮食+运动+胰岛素三者的时间/量协调\n\n##### 运动注意\n\n● 运动前减少胰岛素剂量\n\n● 运动前/中摄取易吸收碳水化合物\n\n● 运动中/后调整胰岛素泵输注量\n\n● 胰岛素水平高→运动时/后低血糖风险\n\n● 胰岛素水平低→高血糖+酮症风险\n\n##### 2型糖尿病（>90%患者）\n\n● 胰岛素抵抗（细胞对胰岛素不敏感）+ β细胞相对不足→高血糖\n\n● 与久坐、热量过剩、肥胖（尤其内脏脂肪）高度相关\n\n● 内脏脂肪→轻度炎症→胰岛素抵抗→糖尿病/代谢综合征\n\n● 多饮、多尿、多食、体重下降（典型但未必要全部出现）\n\n● 长期并发症：心脏、血管、肾脏、眼睛、足部、神经、肌肉骨骼\n\n表7-8\n\n| 心肺：3-7天（避免连续2天不运动！）；肌力：≥2个非连续日（最好3天）\n\n| 中等：40-59% HRR，<VT1；剧烈：60-89% HRR，VT1至<VT2\n\n| 1型：150分钟中等/75分钟剧烈；2型：150分钟中等"], [7, "2.2 糖尿病（续）", "| 50-85% 1-RM，1-3组×8-10次（所有大肌群，8-10个动作，接近疲劳）\n\n● 不可连续2天不运动：运动对胰岛素敏感性的影响24-48小时后消失\n\n● 心肺+肌力结合→肌肉保持更高胰岛素敏感性→更好血糖控制\n\n● 减重5-7%即可逆转胰岛素抵抗（与全身性炎症减少有关）\n\n● 碳水对血糖影响最大→饭后1小时血糖最高，2小时后开始下降\n\n● 碳水化合物类型重要：单糖→血糖快速峰值；复合碳水→释放更慢\n\n● 1型：运动前后监测血糖，调整胰岛素和碳水摄入\n\n● 2型：注意低血糖症状（出汗、颤抖、头晕、意识模糊）"], [7, "2.3 代谢综合征（MetS）", "图7-6\n\n● 不是单一疾病，是一组增加心脏病/糖尿病/中风风险的代谢异常簇集\n\n● 诊断标准（出现≥3项）：\n\n1. 腰围↑：男≥102cm，女≥88cm\n\n4. 血压≥130/85 mmHg（或药物治疗）\n\n5. 空腹血糖≥100 mg/dL（或药物治疗）\n\n表7-9\n\n| 心肺：≥5天（最大化热量消耗）；肌力：≥2天（最好3天）\n\n| 心肺：40-59% HRR，RPE 12-13，<VT1；肌力：50-85% 1-RM\n\n| 心肺：30-60分钟（减重建议50-60分钟）；肌力：1-3组×8-10次\n\n| 心肺：有节奏大肌群；肌力：所有大肌群\n\n● 主要目标是减重（尤其减少内脏脂肪）\n\n● 运动计划参照肥胖症指南设计\n\n● 需同时评估CAD、高血压、血脂异常等共存风险因素\n\n● 持续性运动和间歇性运动均可"], [7, "3.1 哮喘（运动诱发性支气管收缩 EIB）", "图7-7\n\n● 呼吸道慢性炎症→对各种刺激因素过度反应→支气管平滑肌收缩+黏膜肿胀+黏液分泌↑→气道狭窄\n\n● 运动诱发机制：大量干冷空气进入呼吸道→呼吸道水分丢失→支气管收缩物质释放\n\n● 80%哮喘患者运动时/后发作（EIB）\n\n● 喘息、呼吸困难、胸闷、咳嗽（尤其夜间/清晨）\n\n● EIB特征：中-剧烈强度运动后呼吸道暂时变窄\n\n● 症状在运动后5-10分钟达峰，持续20-30分钟\n\n● 部分人运动后2-12小时出现延迟反应\n\n表7-10\n\n| 心肺：3-5天/周；肌力：≥2天（最好3天）\n\n| 心肺：起始<VT1（40-59% HRR），1个月后进阶至60-70%；RPE 12-13\n\n| 逐步至30-40分钟/次\n\n| 心肺：步行、跑步、骑车、无氯泳池游泳；肌力：50-85% 1-RM\n\n● 10-15分钟热身（含剧烈/间歇运动）→诱导不应期→减弱EIB反应\n\n● 约50% EIB者有2小时不应期（期间再次运动不发作或发作减弱）\n\n● 运动调节→减少相同任务所需通气量→呼吸道干燥减少\n\n● 哮喘最佳反应时间：上午中间至晚些时候\n\n● 随身携带急救药物（支气管扩张剂）"], [7, "3.1 哮喘（运动诱发性支气管收缩 EIB）（续）", "● 运动前预防性使用药物（遵医嘱）\n\n● 运动前/中/后充分饮水\n\n● 避免触发因素：极热/极冷、花粉高峰、空气污染\n\n● 低温环境可佩戴口罩保持吸入空气温暖湿润\n\n● 密切观察哮喘发作早期体征→症状加重→降低强度→终止课程\n\n● 药物无效→启动急救系统"], [7, "4.1 癌症", "● 正常细胞DNA受损→突变→细胞不受控增殖\n\n● 约30%癌症死亡与5大行为/饮食风险相关：BMI高、蔬果不足、久坐、吸烟、饮酒\n\n● 癌症幸存者三阶段：治疗期→康复后生活→晚期/临终\n\n表7-11\n\n| 心肺：3-5天/周；肌力：2-3天/周\n\n| 心肺：中等（40-59% HRR，RPE 12-13），可进阶至剧烈；肌力：从<30% 1-RM起始，~5%递增\n\n| 心肺：75分钟剧烈或150分钟中等/周；肌力：≥1组×8-12次\n\n| 心肺：步行、骑车等大肌群长时间有节奏活动；肌力：自由重量+器械+承重功能任务\n\n● 运动可改善：焦虑/抑郁、疲劳、恶心、身体功能、生活质量\n\n● 运动可维持肌肉量、肌肉力量/耐力、心肺适能、柔韧性\n\n● 运动可降低心脏病、骨质疏松症、糖尿病风险\n\n● 化疗/放疗患者可能出现贫血→降低运动强度\n\n● 骨骼完整性受损→减少负重和高强度举重\n\n● 运动计划个体化：癌症类型、治疗方案、当前健康状态\n\n● 建议转介肿瘤专科注册营养师"], [7, "4.2 骨质疏松症", "图7-8\n\n图7-9\n\n● 骨量低+骨微结构破坏→骨骼脆弱→骨折风险↑\n\n● 定义：BMD低于年轻成人平均值2.5个标准差以上\n\n● 骨量减少：BMD低于平均值1.0-2.5个标准差\n\n● 最常见骨折部位：髋关节、脊椎、前臂远端\n\n● 90%+髋骨折由跌倒引起\n\n##### 风险因素\n\n● 不可控：遗传、女性、白种人/亚洲人、绝经后\n\n● 可控：生殖激素、钙/维生素D摄入、身体活动、吸烟、酒精\n\n表7-12\n\n| 心肺：4-5天/周；肌力：1-2天→进阶至2-3天\n\n| 心肺：中等（40-59% HRR）；肌力：调整至最后2次重复有挑战性，高强度者可受益\n\n| 心肺：20分钟→进阶至30-60分钟；肌力：1组×8-12次→2周后增至2组\n\n| 心肺：负重大肌群（步行、爬楼梯）；肌力：骨骼负荷力运动+平衡/步态/功能性站姿运动\n\n● 物理应力→骨骼微变形→刺激骨沉积→骨量/强度↑\n\n● 经常运动→BMD↑、跌倒/骨折风险↓\n\n● 避免：脊柱过度前屈、扭转、压迫动作→增加脊椎骨折风险\n\n● 推荐：躯干伸展+腹部稳定运动\n\n● 避免：光滑表面、绊倒危险环境、快速震动动作"], [7, "4.2 骨质疏松症（续）", "● 肌力训练+负重+冲击运动（跳跃）对刺激骨量最有效\n\n● 强调平衡训练：躯干、髋部、下肢肌肉力量"], [7, "4.3 关节炎", "图7-10\n\n##### 骨关节炎（OA）\n\n● 关节软骨退化（过度使用/创伤/肥胖/年龄）→软骨磨损→骨端直接摩擦→疼痛+炎症\n\n● 最常受累关节：颈椎/腰椎、髋、膝、手指末端关节\n\n● 美国致残主要原因\n\n● 运动时疼痛（随时间/强度加重）\n\n● 局部僵硬（尤其晨起/久坐后）\n\n● 关节肿胀、灵活性下降\n\n● 骨刺/软骨碎片脱落→炎症→进一步软骨损伤\n\n##### 类风湿关节炎（RA）\n\n● 自身免疫性疾病：滑膜组织炎症→关节软骨/骨骼磨损→关节变形\n\n● 全身性疾病：除关节外，还影响皮肤、眼睛、肺、心脏、血管\n\n● 分解代谢特性→肌肉减少（必须增强受累关节周围肌肉）\n\n表7-13\n\n| 心肺：中等（40-59% HRR）至剧烈（≥60% HRR）；身体状况差者30-39% HRR\n\n| ≥150分钟/周低-中强度，或75分钟剧烈，或组合\n\n| 心肺：低冲击有节奏大肌群（步行、骑车、游泳）；肌力：50-80% 1-RM，2-4组×8-12次，无痛ROM内运动\n\n● 运动+减重是控制OA最佳方法（尤其超重/肥胖者）\n\n● 运动可改善：心肺适能、肌力/耐力、关节灵活性、疲劳、日常生活功能"], [7, "4.3 关节炎（续）", "● RA：等长运动优先，避免关节负荷过大\n\n● RA：低冲击、有限ROM、温水运动、发作期避免运动可能有益\n\n● OA：下肢关节炎不建议跑步等高冲击运动\n\n● RA：根据功能限制和基础心肺适能调整计划\n\n● 所有动作在无痛范围内进行\n\n表7-14\n\n表7-15\n\n| 冠状动脉疾病（CAD）\n\n| 避免Valsalva动作（憋气用力）\n\n| 高血压\n\n| 记住三个阈值：120（正常上限）、130（1期起点）、140（2期起点）；生活方式改变可避免药物\n\n| 中风\n\n| 无特殊上下肢区分限制，重点在功能恢复（平衡/协调/步态）\n\n| 外周动脉疾病（PAD）"], [7, "4.3 关节炎", "| 以疼痛强度为准（非运动强度）——走至中等疼痛（跛行量表3-4级）→休息→继续\n\n| 糖尿病\n\n| 运动前减少胰岛素剂量；不可连续2天不运动（胰岛素敏感性24-48h后消失）；运动中注意低血糖症状\n\n| 代谢综合征\n\n| 诊断标准：出现≥3项（腰围↑、TG≥150、HDL↓、血压≥130/85、空腹血糖≥100）\n\n| 哮喘\n\n| 最佳运动时间：上午中间至晚些时候；保持吸入空气温暖湿润；随身携带急救药物\n\n| 骨质疏松症\n\n| 肌力训练+负重+冲击运动（跳跃）；高强度会受益\n\n| 骨关节炎\n\n| 避免疼痛范围外运动；避免高冲击和扭转动作\n\n各个生命阶段的运动注意事项\n\n第     8章"], [7, "判断题", "判断以下说法是否正确，点击展开参考答案。\n\n答案：正确。原文明确指出所有慢性病客户开始运动前需获得医学许可，这是跨疾病通用原则的首要要求。\n\n答案：错误。原文指出原发性高血压占90-95%，病因不明，为遗传+环境交互所致；继发性仅占5-10%。\n\n答案：正确。原文明确报告单次运动后血压可降低5-7 mmHg，持续24小时；每周≥150分钟运动量降压效果最大。\n\n答案：错误。原文指出服用β受体阻滞剂/钙通道阻滞剂者应使用RPE监控强度，而非心率，并需缓慢变换体位。\n\n答案：正确。原文指出缺血性中风约占80%，出血性约占20%。\n\n答案：错误。FAST中A代表Arms（手臂突然无力），F代表Face（面部下垂），S代表Speech（说话困难），T代表Time（立即呼叫急救）。\n\n答案：正确。原文明确PAD的核心运动改善模式为间歇步行训练，通过步行产生缺血刺激侧支循环形成。\n\n答案：错误。原文指出单纯运动对LDL改善不一致，需结合减重才能有效降低LDL。\n\n答案：正确。原文指出心肺训练最有效（TG可作燃料），肌力训练对降低TG无效。"], [7, "判断题（续）", "答案：正确。原文报告餐后脂血症（PPL）单次中等强度运动30-60分钟后TG降低持续12-36小时，建议至少隔天运动一次。\n\n答案：错误。原文指出1型糖尿病患者运动前应减少胰岛素剂量，运动前/中摄取易吸收碳水化合物，以防低血糖。\n\n答案：正确。原文解释PAD间歇步行训练中'高强度'在此语境指疼痛强度，非能量消耗。"], [7, "知识翻卡", "共 12 张知识卡片，点击翻转查看答案\n\n\n##### 慢性病客户安全运动清单\n\n\n- 获取客户医生许可和运动限制说明\n\n- 了解客户用药情况及其对运动的影响\n\n- 根据疾病类型调整运动处方：⚠️高血压：避免瓦尔萨尔瓦动作、头部低于心脏⚠️糖尿病：监测血糖，预防低血糖，注意足部⚠️哮喘：备急救吸入器，充分热身⚠️心血管疾病：心率低于测试心率10-20次⚠️关节炎：无痛范围内训练，低冲击⚠️骨质疏松：避免脊柱屈曲和高冲击\n\n- ⚠️高血压：避免瓦尔萨尔瓦动作、头部低于心脏\n\n- ⚠️糖尿病：监测血糖，预防低血糖，注意足部\n\n- ⚠️哮喘：备急救吸入器，充分热身\n\n- ⚠️心血管疾病：心率低于测试心率10-20次\n\n- ⚠️关节炎：无痛范围内训练，低冲击\n\n- ⚠️骨质疏松：避免脊柱屈曲和高冲击\n\n- 运动前中后监测相关指标\n\n- 教会客户识别危险信号并立即停止运动\n\n- 调整训练环境（温度、湿度、海拔）\n\n- 与客户医疗团队保持沟通\n\n- 记录运动反应和不适症状\n\n\n---"], [8, "各个生命阶段的运动注意事项", "本章节按\"核心机制/背景→运动指南（FITT）→安全注意\"结构组织"], [8, "跨人群通用原则", "##### 医学许可与筛查\n\n\n● 所有特殊人群开始运动前需获得医学许可（尤其合并慢性病者）\n\n● 使用PARmed-X等筛查工具进行运动前健康评估\n\n● 慢性病患者需与医师沟通，了解运动禁忌症和限制\n\n\n##### 运动处方通用框架\n\n\n● 心肺：FITT-VP（频率、强度、时间、类型、进阶、变化）\n\n● 肌力：频率、强度、时间、类型\n\n● 强度监控：谈话测试、RPE、VT1/VT2——不同人群适用不同监控方式\n\n\n##### ACE IFT模型适用性\n\n\n● 三大人群均可使用ACE整合式健身训练模型\n\n● 需根据人群特点调整评估方式和计划设计\n\n● 评估本身不必与成年人完全区分，但需注意趣味性和安全性\n\n\n##### 行为改变与社会支持\n\n\n● ACE Mover Method + ABC Approach适用于所有人群\n\n● 社会支持是坚持运动的关键因素（家庭参与、同伴鼓励）\n\n● 运动计划设计应考虑个人目标、能量波动和日常限制"], [8, "一、青少年", "图8-1"], [8, "1.1 背景与现状", "##### 核心问题\n\n\n● 仅20-26%的美国青少年达到身体活动推荐水平（2018年报告卡评分D-）\n\n● 全球青少年身体活动和久坐行为平均得分均为D\n\n● 活动水平随年龄增长而下降：16-19岁仅5%达标\n\n● 女孩活动参与度显著低于男孩\n\n● 原因：学校体育要求降低、屏幕时间增加（45%高中年龄青少年每日>3小时）、社区安全性不足\n\n\n##### 缺乏活动的后果\n\n\n● 儿童期肥胖、高血压、2型糖尿病、骨质疏松症、动脉粥样硬化\n\n● 久坐习惯延续至成年→形成代际恶性循环（父母不运动→子女不运动可能性高6倍）\n\n\n##### 身体素养（Physical Literacy）\n\n\n● 定义：进行身体活动的能力、信心和意愿\n\n● 核心目标：帮助孩子掌握跑、跳、平衡等基本运动能力\n\n● 策略：将提高身体素养作为家庭运动计划基础，强调努力而非成绩"], [8, "1.2 青少年运动指南", "##### 核心原则\n\n● 每天总计≥60分钟中等至高强度身体活动\n\n● 包含心肺活动 + 适合年龄的肌肉强化 + 骨骼强化运动\n\n● 每周累积总量比单一组成部分（频率/强度/持续时间）更重要\n\n● 骨骼强化对青少年尤为重要——骨量最大增长发生在青春期前和青春期\n\n##### 肌肉训练的安全性与有效性\n\n● 误区澄清：青春期前儿童可安全进行肌肉训练（在适当监督下）\n\n● 无证据显示适当监督的渐进式肌肉训练会导致生长迟缓或骨骼损伤\n\n● 研究数据：10个月简单肌肉训练使9岁女孩骨密度增幅达对照组4倍（6.2% vs 1.4%）\n\n● 肌肉训练损伤风险记录优于其他体育活动\n\n##### FITT建议\n\n表8-1\n\n| 频率\n\n| 每天\n\n| ≥3天/周\n\n| 强度\n\n| 大多数为中等强度（HR和呼吸明显增加）至高强度（HR和呼吸大幅增加），高强度每周≥3天\n\n| 次极量重复8-15次，达到中度疲劳\n\n| N/A\n\n| 时间\n\n| 作为每天≥60分钟运动的一部分\n\n| 类型\n\n| 适合年龄的愉悦活动：跑步、游泳、骑车、跳舞、足球、篮球、网球"], [8, "1.2 青少年运动指南（续）", "| 非结构化（爬树、拔河、 在运动场设备上攀爬）或结构化（自重/阻力带/器械）\n\n| 跑步、跳绳、篮球、网球、抗阻训练、跳格子"], [8, "1.3 安全注意", "##### 肌肉训练安全指南\n\n\n● 始终对儿童进行适当监督，采用正确技术\n\n● 传统健身器材可能不适合孩子的杠杆臂——优先选择自由调节重量器材或自重运动\n\n● 切勿鼓励单纯的大重量托举或爆发性动作\n\n● 教导正确呼吸方式（避免Valsalva）\n\n● 鼓励运动前/中/后充分饮水\n\n● 告诉孩子感到疲劳/乏力/不适/痛苦时立即沟通\n\n\n##### 极端环境防护\n\n\n● 高温风险因素：体表面积/质量比高、出汗能力弱、运动经济性低\n\n● 极冷风险：脱水、低温症、冻伤——保持补水和分层穿衣\n\n● 冷空气湿度低→加重哮喘/运动诱发性支气管痉挛\n\n● 关注气象部门高温/寒冷警告，必要时移至室内\n\n● 佩戴护具的运动更需注意热相关疾病\n\n\n##### 过劳性损伤与体育专业化\n\n\n● 全年单一运动→重复性发力→过劳性损伤风险↑\n\n● 多样化体育活动增强本体感受、多维力量、敏捷性、速度\n\n● 遵循周期化原则——职业运动员不会全年不断比赛，青少年也应如此\n\n● 运动必须适合年龄、强度适当"], [8, "🔑 青少年关键记忆点", "● 每天≥60分钟；骨骼强化特别重要（骨量增长窗口期）\n\n● 肌肉训练安全（有监督）；避免大重量和爆发力\n\n● 避免体育专业化和过劳性损伤；遵循周期化\n\n● 高温/极冷环境需特殊防护"], [8, "2.1 孕期", "图8-2\n\n##### 生理变化\n\n##### 身体结构与重心\n\n● 建议增重：25-35磅（11.4-15.9kg），孕前体重不同则建议不同\n\n● 腹围增长→背部、骨盆、髋部、腿部承受额外压力\n\n● 重心向上向前移→影响平衡和协调性\n\n● 孕前通过深蹲、弓步、硬举增强腿后侧和躯干力量，为增重做准备\n\n##### 激素变化\n\n● 松弛素↑→骨盆增大（利于分娩）但所有关节松弛度增加→旧伤复发风险/关节不稳\n\n● 需要力量和稳定训练增加身体稳定性\n\n● 恶心和疲劳（妊娠早期最常见，但任何阶段都可能发生）\n\n##### 心血管变化\n\n● 心力储备（静息与最大心脏功能之差）减小\n\n● 心率、血容量、心搏量、心输出量↑（孕早期即开始）\n\n● 短暂中等强度运动后可能感觉喘不过气→增加休息时间\n\n● 避免静止姿势（如仰卧），因可导致静脉回流减少和低血压\n\n##### 体温调节\n\n● 散热能力略有提高（皮肤血流↑+潮气量↑）\n\n● 运动前必须知晓环境温度\n\n● 环境温度/湿度升高→显著影响散热→可能导致高热症\n\n● 尚无运动相关高热症引起胚胎/胎儿畸形的报告\n\n##### 运动指南\n\n##### 核心建议"], [8, "2.1 孕期（续）", "● 每周≥150分钟中等强度有氧运动，至少3天\n\n● 不论产前运动经历如何，孕期在医师指导下运动都有益且安全（ACOG 2015）\n\n● 运动可降低：先兆子痫、妊娠期糖尿病、剖腹产、下背痛、焦虑、恶心、胃灼热、失眠、腿痛性痉挛发生率\n\n● 孕前喜爱运动者：可继续原有计划（安全运动强度上限尚未确定）\n\n● 孕前不爱运动者：缓慢开始，进阶至中等强度（可能需从<10分钟间歇性运动起步）\n\n##### 强度监控\n\n● 谈话测试优于心率监控\n\n● 结果<VT1 = 中等强度\n\n● 中等强度：MET 3-5.9，RPE 12-13（6-20量表）"], [8, "2.1 孕期", "● 高强度（MET≥6，RPE 14-17）仅适合孕前已运动或想要提高健康水平的女性\n\n表8-2\n\n| >3-5天/周\n\n| 不连续的2-3天/周\n\n| >2-3天/周（每天最有效）\n\n| 中等（MET 3-5.9，RPE 12-13）；高强度适合孕前已运动者\n\n| 次极量重复8-10次或12-15次，中度疲劳\n\n| 拉伸至紧缩感或轻微不适\n\n| 每天≥30分钟，每周≥150分钟中等或≥75分钟高强度\n\n| 初学者1组；中高级2-3组\n\n| 静态拉伸保持10-30秒\n\n| 负重和非负重均可：徒步、团体运动、游泳（水中运动减轻腰腿压力）\n\n| 器械、自由重量、自重：坐姿推胸、哑铃、弓步\n\n| 静态和动态柔韧性运动，每个肌群\n\n##### 安全注意\n\n##### 绝对禁忌——终止运动的警示性体征\n\n● 阴道出血\n\n● 宫缩阵痛\n\n● 羊水泄露\n\n● 用力前呼吸困难\n\n● 眩晕或感到昏晕\n\n● 头疼\n\n● 胸痛\n\n● 影响平衡的肌无力\n\n● 小腿疼痛或肿胀\n\n##### 运动禁忌与避免事项\n\n● 避免高风险/可能腹部创伤的运动（接触性项目、滑雪、冲浪）\n\n● 避免极端高温环境（如热瑜伽）"], [8, "2.1 孕期（续）", "● 避免长时间仰卧姿势\n\n● 某些运动可能需要调整或与产科护理者讨论（慢跑、球拍运动等）\n\n##### 营养与补水\n\n● 运动前后充分补水\n\n● 运动前吃小零食避免低血糖（尤其中等强度>45分钟时）\n\n● 平衡热量摄入\n\n##### 腹直肌分离（Diastasis Recti）\n\n● 腹直肌两肌腹分离，可达1-2英寸（2.5-5.1cm）\n\n● 孕期发病率高达45%，产后12个月仍达33%\n\n● 孕前和孕期运动可减少35%发病率\n\n● 推荐运动：腹横肌等长收缩、姿势肌和腹部力量训练\n\n● 注意评估腹直肌分离情况后再设计核心训练"], [8, "2.2 产后", "图8-3\n\n##### 核心要点\n\n##### 恢复原则\n\n● 分娩体验因人而异，产后激素水平继续变化\n\n● 疲劳常见（激素变化+身体需求+睡眠中断）\n\n● 产后贫血常见→与生活质量下降、认知能力减弱、情绪不稳/抑郁相关\n\n● 剖腹产需额外恢复时间（开刀手术）\n\n● 流产和死产的悲痛支持：25%妊娠以流产告终，1%死产\n\n##### 运动恢复指南\n\n● 产后几天/几周内，根据医生建议逐渐增加运动量\n\n● 慢慢开始：先增加持续时间和频率，再增加强度\n\n● ACOG建议每日20-30分钟（步行+简单主要肌群强化）\n\n● 异常疼痛（尤其外阴切开术/剖腹产后）→停止运动并咨询医师\n\n● 比正常月经更重的鲜红阴道流血→停止运动并就医\n\n● 目标：9-12个月回到孕前运动强度水平\n\n##### 哺乳期注意\n\n● 热量和营养需求增加→需同时满足运动和母乳需求\n\n● 充分饮水\n\n● 长时间抱孩子→头部前倾和圆肩风险↑\n\n● 计划设计应包括：后背与后肩运动（坐姿划船）+ 前肩和胸肌拉伸\n\n##### 计划设计重点\n\n● 考虑剖腹产伤口愈合或腹直肌分离情况\n\n● 增加躯干力量和稳定性运动"], [8, "2.2 产后（续）", "● 制定简单的10分钟可完成运动计划（照顾孩子时间有限）\n\n● 鼓励多散步（可带孩子一起）"], [8, "🔑 孕期与产后关键记忆点", "● 孕期：每周≥150分钟中等强度，谈话测试监控（<VT1）\n\n● 孕期：避免仰卧、高温环境、接触性运动\n\n● 孕期：警示性体征9项（见上方清单）\n\n● 松弛素影响所有关节→关节不稳风险↑\n\n● 腹直肌分离：孕期发病率45%，运动可减少35%\n\n● 产后：慢慢开始，9-12个月回到孕前水平\n\n● 产后：关注哺乳期营养补水+圆肩/头部前倾"], [8, "三、老年人", "图8-4"], [8, "3.1 衰老的结构性变化", "##### 肌肉骨骼系统\n\n\n● 肌肉质量↓→力量和耐力↓（生活方式变化+神经肌肉功能减弱）\n\n● 骨骼更脆弱多孔→骨折风险↑\n\n● 钙损失→骨量下降（负重和肌肉训练可维持）\n\n● 约20%髋骨折老年人死于相关并发症\n\n● 瘦体组织↓ + 体脂↑ + 基础代谢率↓\n\n\n##### 平衡与稳定性\n\n\n● 三大平衡系统均受衰老负面影响：\n\n● 视觉系统（最主要的本体感受输入通道）→衰退\n\n● 前庭系统（头部空间位置信息）→功能下降\n\n● 躯体感觉系统（肌肉/关节本体感受器、皮肤/压力感受器）→功能下降\n\n● 平衡和协调性↓→跌倒和相关损伤风险↑\n\n\n##### 认知与心理健康\n\n\n● 认知能力下降→平衡能力、注意力、专注力下降\n\n● 抑郁症和焦虑症风险↑\n\n● 失去家人朋友→社会化程度↓\n\n● 身体活动可预防和减缓认知能力衰退（50岁以上人群，无论初始认知状态）\n\n● 运动为老年人提供社交机会和挑战/目标"], [8, "3.2 老年人运动指南", "● 每周150-300分钟中等强度 或 75-150分钟高强度 或 两者结合\n\n● 最好将时间分散开\n\n● 多做身体活动可获得额外益处——做些运动总比不做的好\n\n● 缺乏定期运动计划时：一天中多动少坐\n\n● 每周≥2次肌力训练（主要肌群），维持或增加力量和耐力\n\n● 平衡训练必须纳入运动计划→提高本体感受，降低跌倒风险\n\n表8-3\n\n| 中等：>5天/周；高等：>3天/周；结合：3-5天/周\n\n| ≥2天/周\n\n| >2天/周\n\n| 0-10量表：中等5-6，高等7-8\n\n| 初学者低强度（40-50% 1-RM）→逐渐过渡至中高等（60-80% 1-RM）；或0-10量表中等(5-6)至高等(7-8)\n\n| 中等30-60分钟/天；高等20-30分钟/天；可多次累计（每次≥10分钟）\n\n| 8-10个动作，1-3组×8-12次\n\n| 保持30-60秒\n\n| 不带来过多压力的运动：散步；负重困难者选水上运动/固定式自行车\n\n| 渐进式训练、负重健美操、爬楼梯\n\n| 慢速静态拉伸，每个肌群"], [8, "3.3 安全注意与计划设计", "##### 评估调整\n\n\n● 关节炎在65岁以上人群中发病率49.6%——极常见\n\n● 评估顺序建议：先做姿势和柔韧性评估→再调整运动评估\n\n● 膝关节炎客户可能不适合自重深蹲→可改用坐下/站起测试\n\n● 平衡评估：安全第一，单脚站立优于Y平衡测试\n\n● 初始可借助墙壁/门框等外部稳定装置→进阶到拐杖/手杖→最终无外力支持\n\n● 热身更重要（胶原含量↓+缔结组织弹性↓）→减少受伤风险\n\n● 放松时间用于静态拉伸（肌肉紧张妨碍灵活性/ADL时）\n\n● 平衡运动应在课程早期引入——此时力量最高、专注度最高、受伤风险最低\n\n● 重点放在功能训练上\n\n● 考虑客户能否正常俯身和起身（按摩床/椅可能有用）\n\n● 负重运动首选（在承受范围内）→强化骨骼\n\n● 固定式/卧式自行车：低中心栏方便上下\n\n● 不要为客户设限——激发冒险精神和成就感\n\n● 慢慢增加持续时间和运动量"], [8, "🔑 老年人关键记忆点", "● 150-300分钟中等强度/周；平衡训练必须纳入\n\n● 20%髋骨折老年人死于并发症；负重运动强化骨骼\n\n● 关节炎发病率49.6%（65岁以上）——先评估姿势和柔韧性\n\n● 热身比以往更重要（胶原↓、弹性↓）\n\n● 平衡训练放在课程早期（专注度最高时）\n\n● 运动可预防认知衰退、改善心理健康"], [8, "各人群关键记忆点总结", "表8-4\n\n| 青少年·活动量\n\n| 每天≥60分钟中等至高强度；骨骼强化在青春期前/青春期尤为重要（骨量增长窗口期）\n\n| 青少年·肌肉训练\n\n| 安全（有监督时）；避免大重量和爆发力；优先自重/阻力带\n\n| 青少年·风险\n\n| 避免体育专业化和过劳性损伤；遵循周期化；高温/极冷环境特殊防护\n\n| 孕期·运动量\n\n| 每周≥150分钟中等强度，至少3天；谈话测试监控（<VT1）\n\n| 孕期·禁忌\n\n| 避免仰卧、高温环境、接触性/高跌落风险运动；注意9项警示性体征\n\n| 孕期·激素\n\n| 松弛素↑→所有关节松弛→关节不稳；力量和稳定训练对抗\n\n| 孕期·腹直肌分离\n\n| 孕期发病率45%；运动可减少35%；推荐腹横肌等长收缩\n\n| 产后·恢复\n\n| 慢慢开始，9-12个月回到孕前水平；剖腹产需额外恢复时间\n\n| 产后·注意\n\n| 哺乳期需更多热量/水分；关注圆肩/头部前倾；加入后背和后肩运动\n\n| 老年人·运动量\n\n| 150-300分钟中等强度/周；平衡训练必须纳入；≥2次/周肌力训练\n\n| 老年人·骨骼\n\n| 20%髋骨折老年人死于并发症；负重运动在承受范围内强化骨骼"], [8, "各人群关键记忆点总结（续）", "| 老年人·关节炎\n\n| 65岁以上发病率49.6%；先评估姿势和柔韧性，再调整运动评估\n\n| 老年人·计划设计\n\n| 热身比以往更重要；平衡训练放在课程早期；重点放在功能训练\n\n| 老年人·认知\n\n| 运动可预防和减缓认知衰退，改善心理健康，提供社交机会\n\n肌肉骨骼异常客户的注意事项\n\n第       9章"], [8, "判断题", "判断以下说法是否正确，点击展开参考答案。\n\n答案：正确。原文引用2018年报告卡评分D-，仅20-26%的美国青少年达到推荐水平。\n\n答案：错误。原文指出久坐习惯延续至成年，形成代际恶性循环——父母不运动→子女不运动可能性高6倍。\n\n答案：错误。原文明确澄清：青春期前儿童可安全进行肌肉训练（在适当监督下），无证据显示适当监督的渐进式肌肉训练会导致生长迟缓或骨骼损伤。\n\n答案：正确。原文引用研究数据：10个月简单肌肉训练使9岁女孩骨密度增幅达对照组4倍（6.2% vs 1.4%）。\n\n答案：正确。原文核心原则明确青少年每天总计≥60分钟中等至高强度身体活动，包含心肺活动+肌肉强化+骨骼强化运动。\n\n答案：错误。原文指出孕妇的谈话测试优于心率监控，结果<VT1即为中等强度。\n\n答案：正确。原文明确运动可降低先兆子痫、妊娠期糖尿病、剖腹产、下背痛、焦虑、恶心等多种不良结局的发生率。\n\n答案：正确。原文指出腹直肌分离孕期发病率高达45%，产后12个月仍达33%，孕前和孕期运动可减少35%发病率。"], [8, "判断题（续）", "答案：错误。原文指出孕妇应避免极端高温环境（如热瑜伽），因环境温度/湿度升高可显著影响散热，可能导致高热症。\n\n答案：正确。原文建议产后慢慢开始，先增加持续时间和频率再增加强度，目标9-12个月回到孕前运动强度水平。\n\n答案：正确。原文指出约20%髋骨折老年人死于相关并发症，强调骨骼健康和防跌倒的重要性。\n\n答案：错误。原文明确平衡训练必须纳入老年人运动计划，以提高本体感受、降低跌倒风险。每周≥2次肌力训练同样必须纳入。\n\n答案：正确。原文指出身体活动可预防和减缓认知能力衰退，适用于50岁以上人群，无论初始认知状态。"], [8, "知识翻卡", "共 12 张知识卡片，点击翻转查看答案\n\n\n##### 特殊人群运动调整清单\n\n\n- 儿童青少年：关注动作技能发展，避免过度训练力量训练从轻负荷开始，注重正确技术避免高温环境\n\n- 关注动作技能发展，避免过度训练\n\n- 力量训练从轻负荷开始，注重正确技术\n\n- 避免高温环境\n\n- 孕妇：获取医生许可避免仰卧位（孕中期后）、接触性运动注意补水和体温控制产后逐步恢复（顺产数天/剖宫产6-8周）\n\n- 获取医生许可\n\n- 避免仰卧位（孕中期后）、接触性运动\n\n- 注意补水和体温控制\n\n- 产后逐步恢复（顺产数天/剖宫产6-8周）\n\n- 老年人：重点：预防跌倒（平衡训练）力量训练保持独立生活能力关注心血管安全性柔韧性维持关节活动度\n\n- 重点：预防跌倒（平衡训练）\n\n- 力量训练保持独立生活能力\n\n- 关注心血管安全性\n\n- 柔韧性维持关节活动度\n\n- 更年期女性：抗阻训练预防骨质流失有氧运动保护心血管\n\n- 抗阻训练预防骨质流失\n\n- 有氧运动保护心血管\n\n- 根据年龄调整强度和进阶速度\n\n\n---"], [9, "肌肉骨骼异常客户的注意事项 · 重点总结", "本章节按\"核心机制→症状要点→课程设计/安全注意\"结构组织"], [9, "跨病症通用原则", "##### 执业范围\n\n● 私人教练的职责是运动评估，不是损伤评估/诊断\n\n● 客户出现疼痛或受伤，必须转介给医疗保健专业人员\n\n● 与医生/理疗师保持沟通，获取运动限制和恢复方案\n\n##### 愈合三阶段\n\n表9-1\n\n| I 炎症期\n\n| 前3-4天\n\n| 发红、肿胀、疼痛、局部发烫\n\n| 零负重，主动ROM\n\n| 患处疼痛/肿胀时禁止训练\n\n| II 修复期\n\n| 3天-6周\n\n| 瘢痕初步形成\n\n| 耐受范围内负重，缓慢无痛运动\n\n| —\n\n| III 重塑期\n\n| 4周-2年\n\n| 瘢痕组织力量增加\n\n| 循序渐进无痛运动\n\n● 急性期标准处理：RICE（休息Rest、冰敷Ice、压迫Compression、抬高Elevation）\n\n● 冰敷：间接接触皮肤，每次≤20分钟，前24-48小时冰敷（非热敷）\n\n● 压迫：弹性绷带包扎受伤部位，控制肿胀；绷带应扎牢但不可太紧（以免阻碍静脉血回流）\n\n● 抬高：至心脏水平以上，有助于静脉血回流\n\n##### 伤后训练进度\n\n● 训练进度须始终维持保守态度\n\n● 与医生/理疗师保持联系，获取禁忌动作建议和推荐运动恢复方案"], [9, "跨病症通用原则（续）", "● 严格执行无痛训练课程后，组织重塑可功能完全恢复且无症状\n\n● 受伤部位疼痛 = 应立即停止运动\n\n##### 疼痛管理\n\n● 使用知觉疼痛等级量表（0-10级）\n\n● 疼痛超过3级即停止运动（3级尚未引起不适/痛苦）\n\n● 训练前及训练中持续评估疼痛等级\n\n● 慢性疼痛会造成生物、心理和情绪影响（愤怒、绝望、抑郁、焦虑）\n\n● 与客户沟通疼痛管理要点：\n\n1. 锻炼前说明可能触及患处\n\n2. 解释疼痛等级量表\n\n3. 说明超过3级将中止锻炼\n\n4. 鼓励客户交流任意程度的疼痛\n\n5. 让客户在训练前及全程评估疼痛级别\n\n##### 预防肌肉骨骼损伤"], [9, "跨病症通用原则", "● 柔韧性和弹性：损伤后瘢痕组织降低弹性；长期不运动、放疗、年龄增长均导致弹性下降；弹性差既是损伤成因也是后果\n\n● 热身活动：覆盖所有运动平面，激活本体感受器，增加血流和结缔组织弹性；全方位预备操优先于单平面活动（如步行/骑行）\n\n● 恢复：两节训练课之间留出充分修复时间；拉伸和自我肌筋膜放松舒缓僵硬肌肉\n\n##### 课程设计通用框架\n\n● 热身更为重要（胶原↓、弹性↓），需覆盖所有运动平面\n\n● 先解决ROM受限和姿势不良，再进阶\n\n● 动力链思维：相邻关节功能障碍会影响远端\n\n● 恢复期计划必不可少：组织修复+关节ROM\n\n● 静态拉伸放在锻炼结束时（长时间拉伸后神经抑制、力量↓）；\n\n● 若需抑制过度活跃肌肉/调整姿势，可在简单热身后先做静态拉伸\n\n● 积极恢复计划是成功计划的重要部分\n\n##### 康复期肌肉和心肺训练注意事项\n\n表9-2\n\n| 下肢损伤\n\n| 上半身：坐位或卧位训练；下半身：按理疗师/医生指示；脊柱和髓核：不涉及患肢的训练\n\n| 水中运动；上肢测力计；卧式/固定式自行车\n\n| 任何引起疼痛的动作；负重训练（除非获医生/理疗师允许）\n\n| 上肢损伤"], [9, "跨病症通用原则（续）", "| 下半身：不涉及患肢的训练；上半身：按理疗师/医生指示；脊柱和髓核：不涉及患肢的训练\n\n| 步行；卧式/固定式自行车；椭圆机\n\n| 任何引起疼痛的动作；跑步（动力链影响可能致患肢疼痛）；需双手保持稳定性的训练\n\n| 背部/脊柱损伤\n\n| 理疗师/医生指示的练习和拉伸；可承受范围内的负重训练\n\n| 水中运动；步行；卧式/固定式自行车\n\n| 任何引起疼痛的动作；高频重复动作组（重复8-10次，避免疲乏）；负重脊柱旋转；需接触地面的运动（条件允许可垫高或用按摩椅）"], [9, "1.1 肌肉拉伤（Strain）", "##### 核心机制\n\n\n● 肌肉超限工作→肌纤维撕裂；任何类型的用力都可能发生\n\n\n##### 分级\n\n\n表9-3\n\n| I级\n\n| 轻度\n\n| 轻度疼痛/酸痛，微量肿胀\n\n| 肌力正常\n\n| II级\n\n| 中度\n\n| 疼痛肿胀更严重，ROM↓\n\n| 肌力↓，可能跛行\n\n| III级\n\n| 重度\n\n| 肌肉完全撕裂，\"撕裂/断裂\"感，明显变形\n\n| 功能丧失\n\n● III级拉伤在老年人中更常见（胶原组织失去弹性）\n\n● 愈合时间取决于严重程度；轻度损伤愈合各阶段可持续数日至数周；III级可能需要外科干涉\n\n● 随年龄增长，即使轻度拉伤也需更长时间愈合"], [9, "1.2 韧带扭伤（Sprain）", "图9-1\n\n● 外力将韧带拉伸至损伤点（接触性或非接触性）\n\n● ACL撕裂机制：膝关节过伸和/或扭伤\n\n● 接触性：如橄榄球中膝前侧和外侧的撞击产生剪切力\n\n● 非接触性：如篮球中踩硬地面同时突然切球和扭动\n\n● 包含全方位力量和稳定性训练可降低非接触性损伤风险\n\n表9-4\n\n| 轻微触痛/肿胀\n\n| 轻微\n\n| 胶原纤维微观撕裂\n\n| RICE\n\n| 中度触痛/肿胀，ROM↓，可能不稳定\n\n| 部分胶原纤维完全撕裂\n\n| RICE+医生评估\n\n| 明显肿胀/触痛/不稳定\n\n| 韧带完全撕裂/破裂\n\n| 空气夹板+RICE+立即就医\n\n● 客户可能报告听到\"砰砰\"声后随即出现疼痛和肿胀\n\n● II级扭伤出现不稳定、ROM下降和功能丧失"], [9, "1.3 软骨损伤", "图9-2\n\n● 关节受压迫+剪切力→软骨撕裂\n\n● 膝关节最易发生（负重+活动自由度大）\n\n● 年长者关节软骨已退化，较小的力即可撕裂\n\n● 大部分软骨无血管→无法自行愈合，常需手术取出撕裂碎片\n\n● 例外：半月板外侧1/3血管丰富，可手术修复（需较长术后零负重状态）\n\n症状：关节僵硬、咔嗒/砰砰声、腿软、伸直受限、关节闭锁、疼痛肿胀、肌肉无力"], [9, "1.4 骨折", "图9-3\n\n● 压迫力（如伸直腿踩硬表面）、扭力或直接撞击导致\n\n● 骨质疏松/骨癌/感染/放疗/骨量差者风险更高\n\n体征：喀嚓声、变形、肿胀、淤青、疼痛触痛\n\n\n##### 紧急处理\n\n\n● 防止骨骼和软组织进一步受伤，必要时急救应对休克\n\n● 怀疑骨折应立即启动EMS，控制环境让客户静卧休息\n\n● 冰敷可能加剧疼痛\n\n● 仅在偏远地区EMS无法到场时，才用急救技能夹住/固定骨折肢\n\n\n##### 应力性骨折\n\n\n● 骨形成/吸收失衡→反复应力→骨头不足以承受压迫力\n\n● 所有骨头均可发生，股骨颈时有发生，胫骨最常见（常被误认为外胫夹）\n\n● 长跑运动员高风险（骨量未及调整即增加里程）\n\n● 特征：骨头某点触痛，疼痛局部且渐进，负重时加重；某些情况下静息/睡觉时也会酸痛，甚至局部肿胀\n\n● 继续活动→加重→完全骨折风险\n\n● 骨癌症状可能与应力性骨折相似，尽早诊断很重要"], [9, "1.5 脑震荡", "图9-4\n\n● 脑损伤导致精神状态改变（接触性运动、交通事故、跌倒或撞击均可引起）\n\n● 可能伴随或没有短暂性意识丧失\n\n\n##### 体征\n\n\n● 精神错乱、定向障碍、记忆丧失（重复提问、无法认人/识别地点）\n\n● 言语迟钝/不清、动作不协调、头疼、恶心呕吐\n\n● 警觉性降低、平衡感下降、眩晕、惊厥、四肢麻木/失去知觉\n\n\n##### 关键风险\n\n\n● 脑震荡后脑部极脆弱→二次损伤可导致二次撞击综合征（危及生命）\n\n● 必须立即停止活动\n\n● 获有头部损伤治疗经验的合格医疗保健专业人员书面许可前，禁止任何活动\n\n● 许可同时应提供书面活动恢复方案；恢复要循序渐进，私人教练需格外小心防症状复发"], [9, "1.6 椎间盘损伤", "图9-5\n\n● 椎间盘位于两椎骨之间，起减震、支撑和稳定作用，由胶原组成\n\n● 压迫+剪切力→纤维环层撕裂→髓核胶状液渗漏→外层形成肿块\n\n● 膨胀的外层压迫神经或卡在椎骨间→沿神经走向牵涉痛/剧烈疼痛\n\n● Valsalva动作增加受伤风险（打喷嚏/咳嗽同理）\n\n● 常见于腰椎\n\n\n##### 症状\n\n\n● 可能出现坐骨神经痛或其他神经根病体征\n\n● 沿受累神经走向剧烈刺痛、麻木和/或痛感，可能延伸至足部\n\n处理：冰敷缓解疼痛，但需立即就医；客户可能疼到不能走路，需联系EMS转运至急诊室"], [9, "2.1 肌腱炎/滑囊炎/筋膜炎", "表9-5\n\n| 肌腱炎\n\n| 肌腱炎症（-itis = 炎症）\n\n| 过度使用；急性→可转为慢性\n\n| 滑囊炎\n\n| 滑囊发炎\n\n| 急性外伤有时引起；更多是反复应力/肌肉失衡/肌紧张\n\n| 筋膜炎\n\n| 结缔组织（筋膜）发炎\n\n| 常见：足底筋膜炎、IT束摩擦综合征\n\n● 急性肌腱炎 = 处于损伤愈合炎症阶段的肌腱炎\n\n● 处理不当均可转为慢性"], [9, "2.2 应力性骨折", "图9-6\n\n● 骨形成/吸收失衡处发生\n\n● 胫骨最常见，常被误认为外胫夹\n\n● 关键鉴别：应力性骨折为骨头某点触痛，疼痛局部、渐进、负重加重\n\n● 某些情况下静息/睡觉时酸痛，甚至局部肿胀\n\n● 继续活动→症状加重→完全骨折风险\n\n● 需转介给医生诊断和治疗（骨癌症状可能类似，需排除）"], [9, "3.1 肩部——肩峰撞击综合征/肩袖损伤", "图9-7\n\n● 肩关节窝浅→骨稳定性差，靠盂唇+韧带+肩袖加固\n\n● 肌肉力量/稳定性不足 + 不良姿势（圆肩/胸椎后凸）→肩胛骨偏离（偏向上侧和前侧）→肩峰下间隙变窄\n\n● 冈上肌腱鞘+肩峰下滑囊被压迫→肩峰撞击综合征\n\n● 可伴肱二头肌长头肌腱炎\n\n● 肩袖弹性↓→肩袖撕裂（发生率随年龄↑）\n\n● 肩袖肌肉作用：在过头运动中降低肱骨向前速度并稳定肱骨在关节窝中\n\n● 多数人其他软组织可代偿→即使全层肩袖撕裂也可选择保守治疗和物理疗法而非手术\n\n##### 课程设计四步法\n\n1. 解决不良姿势（圆肩/脊柱后凸）→伸展肩部前侧和前胸（抑制过度活跃肌肉，可在热身时完成）\n\n2. 强化肩胛骨稳定肌（下斜方肌、中斜方肌、前锯肌）+肩袖\n\n3. 通过受控前推动作改善肩前肌肉和胸大肌\n\n4. 最后引入过头运动（在肩胛面——额状面前30°完成，防撞击/挤压）\n\n##### 关键动作\n\n● 坐姿划船（强化肩胛稳定肌）\n\n● 前锯肌推举\n\n● 鸟狗式（闭链负重训练，激活肩袖而不使组织恶化）\n\n● 农夫行走（开链训练，激活肩袖）\n\n##### 注意事项"], [9, "3.1 肩部——肩峰撞击综合征/肩袖损伤（续）", "● 应避免需要举过头的训练（稳定性和力量需求超出受损肩关节能力）\n\n● 过头动作使肱骨头与肩峰接触更紧密，增加撞击风险\n\n● 上半身整体力量、稳定性和ROM训练应纳入常规项目，预防疼痛和功能丧失"], [9, "3.2 肘、腕和手", "##### 背景\n\n● 工作及休闲中长期使用鼠标和键盘→过度使用损伤日渐增多\n\n● 归咎于长时间静负荷及不恰当的办公设置\n\n##### 3.2.1外上髁炎（网球肘）\n\n图9-8\n\n● 肱骨外上髁起点附近→腕伸肌肌腱过度使用或反复外伤性损伤\n\n● 30-55岁成年人常见\n\n##### 3.2.2内上髁炎（高尔夫球肘）\n\n图9-9\n\n● 肱骨内上髁→腕屈肌肌腱在起始处附近的过度使用或反复外伤性损伤\n\n##### 3.2.3腕管综合征\n\n图9-10\n\n● 屈肌支持带下肌腱发炎→腕骨和屈肌支持带之间狭小间隙内炎症刺痛腕管→压迫正中神经→疼痛和麻木\n\n● 建议客户向人力资源部申请工作环境的人体工程学评估\n\n##### 课程设计注意事项\n\n● 肌腱发炎时应避免增加压力，消除所有可导致疼痛或不适的因素\n\n● 需要腕部屈曲、伸展或握紧的训练需进行调整\n\n● 腕管综合征适用与肘腱炎相同的注意事项\n\n● 训练时使用夹板或矫形器可能有益（尤其持续疼痛的客户），但需由医生定夺\n\n● 运动时应穿戴医生推荐和指定的手腕托，并遵从指导"], [9, "3.2 肘、腕和手（续）", "1. 预防过度使用：牵引训练时引入多种手柄增加舒适感，和/或戴手套增加手与手柄/器械之间的摩擦力（减轻受损组织负荷）\n\n2. 在各运动平面上缓慢拉伸，增加ROM\n\n3. 通过训练改善腕部和手部力量（如俯卧撑、腕部屈伸）\n\n4. 取下手柄或手套，在耐受范围内逐步增加牵引训练重量"], [9, "3.3 肘/腕/手病症关键记忆点", "● 网球肘 = 外上髁 + 伸肌肌腱；高尔夫球肘 = 内上髁 + 屈肌肌腱\n\n● 腕管综合征 = 正中神经受压→疼痛麻木；需人体工程学评估\n\n● 训练调整：多种手柄/手套/腕带减少握力需求\n\n● 调整使腕部处于中间位置的训练项目（如正手窄握支撑架做俯卧撑）"], [9, "4.1 颈部", "图9-11\n\n● 胸椎后凸加重→头部前倾姿势→颈部肌肉异常压力\n\n● 脊柱通过骨性凸起物和软组织连接→任一位置错位引起连锁反应\n\n● 示例：右侧腰骶段的竖脊肌（ace课本为这个骶竖肌，但不符合解剖学规范用语，特此标注。）紧张→右外侧屈曲→右肩抬高→左侧颈痛\n\n● 解决动力链全段缩短的组织，不只是患处\n\n● 单独强化颈部肌肉不应作为训练课程目标\n\n\n##### 课程设计步骤\n\n\n1. 观察颈部相对胸椎和肩部位置→先矫正脊柱和肩部（圆肩和脊柱后凸尤其常见）\n\n2. 教授柔和动作和拉伸（侧向拉伸、旋转拉伸）→客户感到不适时可随时进行\n\n3. 疼痛严重或持续→转介给医生"], [9, "4.2 下背部", "图9-12\n\n● 80%成人会出现下背部疼痛，30%转为慢性\n\n● 最常见于30-50岁人群；主要致残原因之一\n\n● 常见原因：肌肉拉伤、长期静态姿势不良引起的软组织应激、身体素质差、椎间盘疾病、骨关节炎、类风湿性关节炎、强直性脊柱炎、癌症\n\n● 明显脊柱前凸→腰骶段的竖脊肌（ace课本为这个骶竖肌，但不符合解剖学规范用语，特此标注。）+髋屈肌紧张+后侧链无力→下背部僵硬/疼痛\n\n● 髋部灵活性不足→腰椎ROM代偿性增加（腰椎应保持不动）\n\n● 竖脊肌是稳定肌，不是强大伸肌；臀肌和腘绳肌才是真正的髋伸肌\n\n● 椎间盘损伤常发生在腰椎→可能出现坐骨神经痛/神经根病\n\n##### 关键肌肉对躯干/骨盆稳定性的作用\n\n表9-6\n\n| 臀大肌\n\n| 髋伸肌；支撑骨盆和躯干稳定；保持正确骨盆位置\n\n| 腘绳肌\n\n| 髋伸肌；支撑骨盆和躯干稳定；紧张时抑制髋铰链→骨盆后倾\n\n| 腹直肌\n\n| 稳定躯干；保持正确骨盆位置\n\n| 腹内/外斜肌\n\n| 背阔肌\n\n| 附着胸腰筋膜→为腰椎提供稳定性\n\n| 髋屈肌\n\n| 紧张时抑制髋铰链→骨盆前倾\n\n| 髋内旋肌\n\n| 髋外旋肌\n\n| 紧张时抑制髋铰链→骨盆后倾"], [9, "4.2 下背部（续）", "1. 纠正左右侧不平衡\n\n2. 纠正前倾/后倾不良姿势（骨盆前倾或后倾）\n\n3. 增加髋关节功能性内/外旋程度（如伐木训练向下=内旋，向上=外旋）\n\n4. 强化后侧链肌群（尤其腘绳肌和臀肌）\n\n日常脊柱稳定训练（每天都进行最有效）\n\n● 猫牛式：有节律动作改善柔韧性并给组织热身；是动作训练非拉伸，重点在动作而非推到极限；猫式呼气，牛式吸气，中立位换气\n\n● 改良式卷腹：保持腰椎中立位（手/毛巾垫于腰下）；一只膝弯一只腿伸直，锁定骨盆-腰椎位置；中间点交替弯曲腿"], [9, "4.2 下背部", "● 鸟狗式：双手对肩、双膝对髋→找到脊柱中立位→腹 muscles 保持稳定→对侧手臂和腿同时抬起→每侧保持5-8秒改善肌肉耐力\n\n● 侧桥：腰方肌和腹部斜肌实现最佳稳定性；初级=肘+膝支撑→进阶=肘+脚支撑；维持颈部和脊柱中立位；每侧保持5-8秒\n\n● 下背部训练：耐力优先于力量（慢缩姿势肌有保护作用）\n\n● 重复低难度动作增强姿势耐力和力量\n\n\n##### 下蹲动作要点\n\n\n● 下蹲是ADL中必要的动作模式（坐椅子、进出车辆、使用马桶）\n\n● 常见缺陷：髋关节铰链协调性缺乏+后侧链肌群力量缺乏→膝盖向前超过脚趾→膝关节疼痛+下背部承受不必要压力\n\n● 调整方案：\n\n● 椅式（适合稳定性/力量/ROM不佳者）：握住固定物站在箱子/长凳前，向后向下坐；先屈髋再屈膝，双脚紧踩地面；可垫高座位降低难度；增大难度时减少手臂借力/降低箱子高度\n\n● 自重深蹲（适合稳定性/力量/ROM尚可者）：侧重正确髋铰链和膝关节对齐；出现膝外翻时提醒向地面用力激活稳定肌\n\n● 弹力带深蹲（适合准备增加后侧链力量但未准备杠铃/哑铃深蹲者）：弹力带抵消部分体重提供支撑；全程需后侧链和脊柱稳定肌对抗向前拉力"], [9, "5.1 髋关节", "● 球窝关节，可进行多方向运动；髋臼是较深的骨性关节窝\n\n● ROM有限，与关节囊和肌肉结构一起产生显著稳定性\n\n● 久坐使髋部前侧肌肉缩短、后侧拉长→影响关节铰链能力\n\n● 功能障碍可能上移至下背部或下移至膝部\n\n##### 梨状肌综合征\n\n图9-13\n\n● 梨状肌发紧/紧绷/发炎→压迫穿过梨状肌的坐骨神经和孖肌→类似腰椎间盘损伤的神经根病症状\n\n● 22%人群坐骨神经隔断（穿过）梨状肌→更易患病\n\n● 至少6%\"下背痛\"患者实际为梨状肌综合征\n\n● 梨状肌作用：步行中充当髋外旋肌，稳定股骨头\n\n● 评估要点：关注髂脊高度→评估骨盆位置及与股骨相对位置\n\n● 示例：左侧骨盆高→左侧股骨相对骨盆内收+内旋→左侧肌肉被拉紧（IT束、外旋肌群、臀大肌）→坐骨神经受压\n\n● 课程设计：平衡左右骨盆位置（紧张侧静态拉伸+紧绷侧强化）+髋关节闭链内外旋训练（改善灵活性和稳定性）\n\n##### 髋关节炎/髋关节置换术\n\n● 关节炎：慢性疾病，关节疼痛和发炎\n\n● 稳定性和强化训练可改善动作，提高ADL效率\n\n● 保守治疗失败可建议髋关节置换术/全髋关节成形术"], [9, "5.1 髋关节（续）", "● 术后前几个月接受常规理疗；理疗结束后ROM可能与非手术侧不等\n\n● 卧式自行车：改善心肺+ROM+股四头肌力量（优于固定式自行车，屈曲程度更大，更好挑战ROM）\n\n● 固定式自行车：屈曲程度较小，适合努力恢复ROM的客户\n\n● 柔和拉伸和动态ROM练习可鼓励进行，但期望须符合实际\n\n##### 髋关节课程设计四步法\n\n2. 改善髋关节内/外旋ROM+单脚站立稳定性\n\n3. 改善髋关节铰链灵活性和稳定性\n\n4. 改善后侧链肌群力量\n\n注意：每一侧训练和伸展不同——一侧紧张肌肉做伸展，对侧较弱肌肉做强化；尽早在锻炼中加入静态拉伸（简单热身后），抑制紧张肌肉、增加ROM"], [9, "5.2 膝部", "● 典型铰链式关节，但有2-3度旋转；由强健韧带和筋膜支撑，灵活性高（可弯曲至130°）\n\n● 唯一穿过膝关节的肌腹是腘肌；其他移动/固定膝关节的肌肉以肌腱形式穿过\n\n● 软骨损害和韧带扭伤常见\n\n##### 5.2.1髂胫束（IT束）摩擦综合征\n\n图9-14\n\n● IT束远端与股骨外侧上髁反复摩擦→膝外侧烧灼/刺痛（剧痛或刺痛）\n\n● 15-50岁活跃人群常见（跑步者、骑行者、排球/举重运动员）\n\n● 风险因素：过度使用、装备不当/鞋子不合脚、跑步平面改变、肌力失衡（无力或紧张）、结构异常（扁平足、膝外翻、下肢不等长）\n\n● 骨盆失衡→IT束紧绷→增加与股骨外侧上髁接触\n\n● 左侧骨盆高→左侧IT束紧绷\n\n● 右侧阔筋膜张肌紧张→也可增加IT束与股骨外侧上髁接触\n\n● 课程设计：紧张侧自我肌筋膜放松+静态伸展→纠正骨盆失衡→增加ROM和纠正左/右侧失衡\n\n##### 5.2.2膝部肌腱炎\n\n图9-15\n\n● 常见部位：髌腱、鹅足腱、股四头肌腱\n\n● 跑步/上下楼梯/下蹲时疼痛\n\n● 存在膝关节功能障碍时，关注髋关节、踝关节和足部（膝关节依赖临近关节保持稳定和缓冲地面反作用力）"], [9, "5.2 膝部（续）", "● 足部旋前/旋后静态姿势评估→发现失衡→立即选择适当训练强化ROM或增强训练\n\n● 髌骨肌腱炎时：四头肌很可能紧张→增加髌骨与股骨髁间压力→自我肌筋膜放松+伸展解决\n\n● 肌肉训练侧重后侧链力量恢复（腓肠肌、腘绳肌、臀肌）\n\n● 与客户保持沟通疼痛等级，疼痛限制时停止训练\n\n##### 5.2.3髌股疼痛综合征（PFPS）\n\n图9-16\n\n● 过度使用+生物力学改变+肌肉功能障碍→髌骨轨迹异常→软骨磨损→髌骨软骨软化\n\n● 关键机制：膝关节屈曲时股骨内旋失控（膝外翻/X形腿）或IT束紧张将髌骨拉出滑车沟\n\n● 下楼/下坡时疼痛加剧\n\n● 生物力学异常因素："], [9, "5.2 膝部", "● 扁平足→改变膝关节排列→胫骨/股骨代偿性内旋→改变髌股关节动力学\n\n● IT束紧张→通过筋膜对髌骨产生过度横向力\n\n● 腓肠肌/比目鱼肌紧张→代偿性内转+过度后向力→髌股关节压力↑\n\n● 相关肌无力：\n\n● 髋外展肌和外旋肌无力→活动时股骨内旋+膝外翻→髌股轨迹异常\n\n● 需要四头肌减缓膝关节屈曲的活动（下楼梯、步行跑下坡）时，髌骨和股骨间隙变窄→疼痛加剧\n\n● 课程设计四步法：\n\n2. 解决髋部/踝部/足部肌紧张和不稳定（防止股骨内旋）\n\n● 注意：开链膝关节伸展（坐位膝关节伸展）对单膝疼痛者应避开→选择负重闭链训练\n\n\n##### 膝关节炎/膝关节置换术\n\n\n● 保守治疗失败可建议膝关节置换术/全膝关节成形术\n\n● 术后四头肌强化很重要，自行车训练课程有帮助\n\n● 全膝关节ROM可能无法完全恢复\n\n● 下蹲是重要运动模式，但膝关节ROM可能限制下蹲深度；掌握正确髋铰链节奏后，直腿硬拉可增加后侧链力量\n\n\n##### 膝关节课程设计四步法\n\n\n2. 解决髋部/踝部/足部可能造成股骨内旋的肌紧张和不稳定\n\n共同注意：每一侧训练和伸展不同；尽早加入静态拉伸增加ROM"], [9, "5.3 脚踝和小腿", "##### 5.3.1外胫夹（胫骨内侧压力症候群 MTSS / 前外胫夹）\n\n图9-17\n\n● \"外胫夹\"是描述劳力性小腿疼痛的一般术语\n\n● MTSS（后外胫夹）= 骨膜炎（骨膜炎症），影响腿部后关节腔肌肉（胫骨后肌、趾长屈肌、拇长屈肌和腘肌）\n\n● 活跃人群的过劳性损伤，运动诱发性疾病，往往由活动突然变化引起\n\n● 跑步者、舞蹈员和军人的常见损伤\n\n● 前外胫夹 = 前关节腔肌肉受累（胫骨前肌、趾长伸肌、拇长伸肌及筋膜和骨膜内层）\n\n● 与劳力性活动有关，病因尚未完全掌握\n\n● 与应力性骨折鉴别：外胫夹不需要彻底静休，调整训练课程即可\n\n● 课程设计调整：\n\n● 提供低冲击力/低里程数项目+交叉训练备选（如停止跑步→改为骑行和游泳）\n\n● 各部位有时间休息和愈合\n\n● 逐步引入完整动作而不引起症状复发\n\n● 小腿肌群（尤其比目鱼肌）无痛拉伸可有效缓解MTSS症状\n\n● 静态姿势和动态评估→发现足部/踝关节错位或不稳定→恢复运动需改善足部和踝关节柔韧性和稳定性\n\n##### 5.3.2脚踝扭伤\n\n图9-18\n\n● 每年影响200万美国人（运动和高度活跃人群仅占一半）"], [9, "5.3 脚踝和小腿（续）", "● 外侧/内翻性扭伤最常见（约75%）→距腓前韧带、跟腓韧带、距腓后韧带\n\n● 机制：过度跖屈+内翻\n\n● 70%外侧扭伤导致反复性扭伤和慢性症状\n\n● 内侧/外翻性少见（外侧腓骨头加固）；内侧三角肌韧带最常受累，损伤常需排除骨折\n\n##### 恢复训练\n\n● 遵循与其他扭伤一样的运动恢复指导\n\n● 负重关节，可能需更长时间恢复\n\n● 愈合早期可能需使用拐杖；医生可能要求使用支架\n\n● 可继续锻炼非损伤区域（如上半身）；损伤区域始终在运动中受保护\n\n● 物理疗法结束后关键第一步：修复本体感受、柔韧性和力量\n\n● 韧带是本体感受反馈的主要来源\n\n● 渐进式单腿训练促进本体感受"], [9, "5.3 脚踝和小腿", "● 避免在不平稳表面训练（半泡沫滚筒/微型蹦床）→超负荷本体感受系统（尤其初始阶段）\n\n● 侧向运动打开外侧踝关节→可能产生不必要张力→确保客户准备好后再进行冠状面运动\n\n##### 5.3.3跟腱炎\n\n图9-19\n\n● 跟腱炎症→可能发展为II级或III级拉伤（尤其>45岁）\n\n● III级拉伤=跟腱断裂，多由慢性跟腱炎引起\n\n● 常见损伤机制：突然从站立位启动运动（如垒球比赛离开一垒）\n\n● 结构性因素：高弓足、扁平足、腿长不等、外侧踝不稳\n\n● 健身相关因素：训练机制不当、鞋子不合脚、肌肉无力、柔韧性差\n\n● 课程设计可纳入具体训练项目逐步改善弹性；任何要求多平面反应度和脚趾离地推动的训练均可达成目标\n\n● 进阶路径：简单提踵→绳梯操练\n\n● 重获小腿柔韧性是关键，但避免过度拉伸跟腱（会刺激肌腱）\n\n● 柔和动态拉伸作为热身一部分\n\n● 站立位拉伸小腿时脚保持中立位（避免过度旋前/旋后），脚直指前方\n\n● 逐步恢复背屈ROM和力量+步行抬脚阶段控制力\n\n##### 5.3.4足底筋膜炎\n\n图9-20\n\n● 足底/跖表面结缔组织发炎\n\n● 可运动，但医疗专业人员可能叮嘱限制"], [9, "5.3 脚踝和小腿（续）", "● 目标：让客户感到具有挑战性但不使足部负荷过度的健身计划\n\n● 将特定足部运动整合到一般健身计划中效果最好\n\n● 拉伸腓肠肌/比目鱼肌/足底筋膜→缓解症状\n\n● 自我肌筋膜放松（足底滚网球/自我肌筋膜放松球/高尔夫球）→提高背屈ROM+缓解疼痛\n\n● 对整个后侧链肌群运用自我肌筋膜放松术也可提高背屈ROM\n\n● 强化足内在肌→改善足弓稳定性→减少足底筋膜压力\n\n##### 足/踝/小腿课程设计四步法\n\n1. 解决足部和脚踝灵活性和稳定性\n\n2. 改善控制矢状面运动的肌肉力量\n\n3. 改善控制横状面和冠状面运动的肌肉力量\n\n##### 日常训练建议"], [9, "5.3 脚踝和小腿", "● 拉伸：每日一次或每两天一次最有效；可推荐客户自行完成\n\n● 即使存在小腿/足部功能障碍，用网球对足底筋膜自我肌筋膜放松也有益\n\n● 平衡练习：每天做无过度使用风险；如刷牙时用患肢单脚站立练习平衡（每天两次1-2分钟本体感受训练）\n\n表9-7\n\n表9-8\n\n| 愈合三阶段\n\n| 炎症期（3-4天）→修复期（~6周）→重塑期（4周-2年）；急性期RICE处理\n\n| 疼痛阈值\n\n| 疼痛>3级即停止运动\n\n| 肌肉拉伤\n\n| I级轻/II级中/III级重（完全撕裂）；老年人更易III级\n\n| 韧带扭伤\n\n| I级微裂/II级部分撕裂/III级完全断裂；ACL机制=过伸+扭伤\n\n| 软骨损伤\n\n| 大部分无血管→无法自愈；半月板外侧1/3例外\n\n| 脑震荡\n\n| 二次撞击综合征可致命；必须完全停止直到获医疗许可\n\n| 椎间盘损伤\n\n| 压迫+剪切力→纤维环撕裂→髓核渗漏→压迫神经→牵涉痛；Valsalva也增加风险\n\n| 肩峰撞击\n\n| 肩胛面过头推举（额状面前30°）；先矫正姿势→强化肩胛稳定肌→再过头\n\n| 网球肘\n\n| 外上髁=伸肌肌腱；30-55岁常见；避免增加压力/腕部屈曲伸展握紧"], [9, "5.3 脚踝和小腿（续）", "| 高尔夫球肘\n\n| 内上髁=屈肌肌腱；30-55岁常见；同网球肘注意事项\n\n| 腕管综合征\n\n| 屈肌支持带下→压迫正中神经→疼痛麻木；需人体工程学评估\n\n| 肘/腕/手课程四步\n\n| 预防过度使用（多手柄/手套）→各平面拉伸增ROM→腕手力量训练→逐步增牵引重量\n\n| 颈部\n\n| 脊柱错位引起连锁反应→解决动力链全段，不只是患处；单独强化颈部不应作为目标\n\n| 下背部\n\n| 80%成人会发生；30%转慢性；耐力优先于力量；每天训练最有效\n\n| 下背部四步\n\n| 纠正左右不平衡→纠正骨盆前/后倾→增加髋旋转ROM→强化后侧链\n\n| 日常脊柱训练"], [9, "5.3 脚踝和小腿", "| 猫牛式（动作训练非拉伸）+改良卷腹+鸟狗式（5-8秒/侧）+侧桥（5-8秒/侧）\n\n| 梨状肌综合征\n\n| 22%坐骨神经穿过梨状肌；≥6%\"下背痛\"实为梨状肌综合征\n\n| IT束摩擦\n\n| 膝外侧疼痛；骨盆失衡→IT束紧绷→摩擦股骨外侧上髁\n\n| 膝部肌腱炎\n\n| 髌腱/鹅足腱/股四头肌腱；四头肌紧张→增加髌骨压力→自我肌筋膜放松+伸展\n\n| PFPS\n\n| 股骨内旋失控+IT束紧张→髌骨轨迹异常；下楼/下坡痛加剧；扁平足/腓肠肌紧张/髋外展外旋无力均相关\n\n| 膝关节注意\n\n| 避开开链膝伸展→选闭链负重训练；全膝ROM可能无法完全恢复\n\n| 外胫夹 vs 应力性骨折\n\n| 外胫夹不需完全休息；应力性骨折为某点触痛、局部渐进痛\n\n| 踝扭伤\n\n| 75%在外侧；70%导致反复扭伤；机制=过度跖屈+内翻\n\n| 踝扭伤恢复\n\n| 修复本体感受→渐进单腿训练；避免不平稳表面；侧向运动确保准备好后再进行\n\n| 跟腱炎\n\n| 柔韧性是关键但避免过度拉伸；可进展为跟腱断裂（>45岁高危）；脚保持中立位直指前方\n\n| 足底筋膜炎"], [9, "5.3 脚踝和小腿（续）", "| 拉伸小腿+足底筋膜；滚球自我肌筋膜放松提高背屈ROM+缓解疼痛；强化足内在肌改善足弓\n\n| 下肢课程通用\n\n| 灵活性/稳定性→矢状面→冠状面/横状面→后侧链力量"], [9, "判断题", "判断以下说法是否正确，点击展开参考答案。\n\n答案：错误。原文指出私人教练的职责是运动评估，不是损伤评估/诊断。客户出现疼痛或受伤，必须转介给医疗保健专业人员。\n\n答案：正确。原文指出急性期标准处理为RICE（休息Rest、冰敷Ice、压迫Compression、抬高Elevation），前24-48小时冰敷。\n\n答案：错误。原文指出冰敷应间接接触皮肤，每次≤20分钟。直接冰敷可能造成冻伤。\n\n答案：正确。原文明确疼痛超过3级即停止运动（3级尚未引起不适/痛苦），训练前及训练中需持续评估疼痛等级。\n\n答案：错误。原文指出静态拉伸放在锻炼结束时，因为长时间拉伸后会导致神经抑制和力量下降。\n\n答案：正确。原文指出III级拉伤在老年人中更常见（胶原组织失去弹性），愈合时间取决于严重程度。\n\n答案：错误。原文指出ACL撕裂机制包括接触性（如橄榄球撞击）和非接触性（如篮球踩硬地面同时突然切球和扭动）两种。\n\n答案：正确。原文指出大部分软骨无血管→无法自行愈合，常需手术取出撕裂碎片；例外是半月板外侧1/3血管丰富，可手术修复。"], [9, "判断题（续）", "答案：正确。原文指出脑震荡后脑部极脆弱，二次损伤可导致二次撞击综合征（危及生命），必须立即停止活动。\n\n答案：正确。原文指出Valsalva动作增加椎间盘受伤风险，打喷嚏/咳嗽同理。\n\n答案：错误。原文指出所有骨头均可发生应力性骨折，股骨颈时有发生，胫骨最常见（常被误认为外胫夹）。\n\n答案：正确。原文明确包含全方位力量和稳定性训练可降低非接触性损伤风险。"], [9, "知识翻卡", "共 12 张知识卡片，点击翻转查看答案\n\n\n##### 损伤客户安全训练清单\n\n\n- 了解客户损伤史和当前状态\n\n- 获取医生/物理治疗师的运动许可和限制\n\n- 肩部损伤：避免过头大重量推举强化肩袖肌群和肩胛稳定肌注意肩峰下撞击的体征\n\n- 避免过头大重量推举\n\n- 强化肩袖肌群和肩胛稳定肌\n\n- 注意肩峰下撞击的体征\n\n- 下背痛：核心稳定性训练（McGill三大练习）避免腰椎过度屈曲/旋转/侧屈逐步恢复日常活动\n\n- 核心稳定性训练（McGill三大练习）\n\n- 避免腰椎过度屈曲/旋转/侧屈\n\n- 逐步恢复日常活动\n\n- ACL重建术后：遵循康复阶段protocol注意移植物类型的训练差异\n\n- 遵循康复阶段protocol\n\n- 注意移植物类型的训练差异\n\n- 膝部问题（PFPS）：避免深蹲>90°和膝外翻强化股四头肌（尤其VMO）\n\n- 避免深蹲>90°和膝外翻\n\n- 强化股四头肌（尤其VMO）\n\n- 踝关节：注意ATFL损伤史加强本体感觉训练\n\n- 注意ATFL损伤史\n\n- 加强本体感觉训练\n\n- 记录训练中的疼痛评分（0-10）\n\n- 疼痛>3分立即调整或停止\n\n\n---"], [9, "ACE 认证私人教练学习导览", "ACE CPT Exam Study Guide — 汉化版\n\n基于 ACE Personal Trainer Manual 考试学习指南，提炼 18 章核心要点。本导览为学习参考概览，帮助快速掌握每章关键概念，配合正文章节深入学习。"], [9, "快速导航", "- 运动健康益处：每周至少 150 分钟中等强度有氧运动可降低全因死亡风险；规律运动改善心血管、代谢、骨骼及心理健康\n\n- 健康专业人员协作：物理治疗师（康复）、注册营养师（营养）、心理咨询师、替代医学从业者\n\n- 执业范围（Scope of Practice）：不诊断疾病、不开处方、不设计矫形方案、不治疗损伤\n\n- 转介网络：身心教练、戒烟项目、水中运动项目、饮食障碍专家\n\n- 动机类型：内在动机（intrinsic）——真正享受运动过程；外在动机（extrinsic）——减重、社交、奖励\n\n- 自我效能（Self-efficacy）：个体对自身完成特定任务能力的信念。来源包括：过往经验、替代经验、言语说服、情绪/生理状态\n\n- 社会支持：训练伙伴、家人鼓励、团体训练增加归属感\n\n- 坚持的影响因素：个人特征（年龄、性别、健康状态）、环境因素（气候、设施）、运动因素（强度、趣味性）\n\n- 客户关系四阶段：融洽关系（Rapport）→ 调查（Investigation）→ 计划（Planning）→ 行动（Action）"], [9, "快速导航（续）", "- 有效倾听五要素：鼓励（Encouraging）、释义（Paraphrasing）、开放式提问（Open-ended questions）、反映（Reflecting）、总结（Summarizing）\n\n- SMART 目标：Specific 具体、Measurable 可测量、Attainable 可达成、Relevant 相关、Time-bound 有时限\n\n- 运动学习三阶段：认知阶段（Cognitive）→ 关联阶段（Associative）→ 自主阶段（Autonomous）"], [9, "快速导航", "- 健康信念模型（Health Belief Model）：感知健康威胁的严重性（perceived severity）和易感性（perceived susceptibility）是行为改变的前提\n\n- 跨理论模型（TTM）：前沉思（Precontemplation）→ 沉思（Contemplation）→ 准备（Preparation）→ 行动（Action）→ 维持（Maintenance）\n\n- 行为改变原则：操作性条件反射（Operant conditioning）、刺激控制（Stimulus control）、塑造（Shaping）、观察学习（Observational learning）\n\n- 行为改变策略：目标设定、反馈、自我监控（Self-monitoring）、日记记录\n\n- FITT-VP 原则：Frequency、Intensity、Time、Type、Volume、Progression，用于制定运动处方"], [9, "快速导航（续）", "- ACE IFT 模型四阶段：稳定与灵活性（Stabilization & Mobility）→ 动作训练（Movement）→ 负荷训练（Load）→ 表现训练（Performance）\n\n- 心肺训练四阶段：有氧基础（Base）→ 有氧效率（Aerobic Efficiency）→ 无氧耐力（Anaerobic Endurance）→ 无氧功率（Anaerobic Power）\n\n- 训练分区：Zone 1VT1 以下（低强度）/Zone 2VT1–VT2 之间（中强度）/Zone 3VT2 以上（高强度）\n\n- 融洽关系三要素：共情（Empathy）、温暖（Warmth）、真诚（Genuineness）"], [9, "快速导航", "- 沟通风格：说教式（Authoritative）→ 教育式（Educator）→ 咨询式（Counselor，最有效）→ 指导式（Director）\n\n- 健康风险评估：PAR-Q+体力活动准备问卷\n\n- 风险分层：根据阳性/阴性风险因素判定风险等级，决定是否需要医学转介或医学监督下运动\n\n- 静态姿势评估：脊柱后凸（Kyphosis）、脊柱前凸（Lordosis）、扁平背（Flat-back）、摇摆背（Sway-back）\n\n- 五种基本动作：弯曲/抬起（Bend & Lift）、单腿（Single-leg）、推（Push）、拉（Pull）、旋转（Rotation）\n\n- 灵活性评估：Thomas Test髋屈肌紧张度、被动直腿抬高（Passive SLR）、肩部 ROM\n\n- 平衡测试：Sharpened Romberg测试、Stork单腿站立测试\n\n- 体成分测量：水下称重（Hydrostatic weighing）、皮褶厚度（Skinfold）、BMI、腰臀比（WHR）\n\n- 心肺适能测试：GXT运动负荷测试、VO₂max最大摄氧量、Rockport 步行测试、1.5 英里跑测试"], [9, "快速导航（续）", "- 肌肉适能测试：俯卧撑测试（Push-up test）、卷腹测试（Curl-up test）、1RM单次最大重复测试\n\n- 运动技能测试：纵跳（Vertical jump）、敏捷性测试（Agility tests）\n\n- 关节交互原则：相邻关节交替承担稳定与灵活功能（Joint-by-joint approach）\n\n- 近端稳定：核心激活，深层核心肌群包括腹横肌（Transversus abdominis）、多裂肌（Multifidus）、盆底肌\n\n- 近端灵活：髋关节活动度和胸椎旋转灵活性"], [9, "快速导航", "- 肩部稳定性：肩胛胸廓区域（Scapulothoracic region）——斜方肌中下束、前锯肌\n\n- 平衡训练：静态平衡 → 动态平衡，从稳定平面过渡到不稳定平面\n\n- 训练变量：频率（Frequency）、动作选择（Exercise selection）、训练量（Volume）、强度（Intensity）、节奏（Tempo）、休息间隔（Rest interval）\n\n- 训练原则：渐进超负荷（Progressive overload）、特异性（Specificity）、可逆性（Reversibility）、递减收益（Diminishing returns）\n\n- 周期化模型：大周期（Macrocyle）→ 中周期（Mesocycle）→ 小周期（Microcycle）；线性周期化 vs 每日波动周期化（DUP）\n\n- 高级方法：超级组（Superset）、复合组（Compound set）、递减组（Drop set）、辅助训练（Accessory work）\n\n- 生理适应：线粒体密度增加、毛细血管网络扩展、每搏输出量和心输出量增大"], [9, "快速导航（续）", "- ACE-IFT 心肺四阶段：Base → Aerobic Efficiency → Anaerobic Endurance → Anaerobic Power\n\n- Karvonen 法：靶心率 = (HRmax − HRrest) × 强度% + HRrest，即储备心率百分比法\n\n- 特殊人群考量：青少年心肺训练需关注骨骺板和体温调节；老年人关注最大心率下降和合并用药\n\n- 心血管疾病：冠心病、高血压（≥140/90 mmHg 需医学监督）、中风后运动方案\n\n- 糖尿病：1 型（胰岛素依赖）和 2 型（胰岛素抵抗）；运动前中后血糖监控；低血糖预防"], [9, "快速导航", "- 骨骼与关节：骨质疏松症（低冲击、抗阻训练为主）、骨关节炎（关节保护策略）\n\n- 生命阶段人群：老年人（防跌倒、肌少症）、青少年（骨骺安全）、孕产期（ACOG 指南、避免仰卧位和高冲击）\n\n- 肌肉拉伤分级：1 级（轻微纤维撕裂）→ 2 级（部分撕裂）→ 3 级（完全断裂）\n\n- 韧带扭伤分级：1 级（轻微拉伸）→ 2 级（部分撕裂）→ 3 级（完全断裂）\n\n- 过度使用损伤：肌腱炎（Tendinitis）、滑囊炎（Bursitis）、筋膜炎（Fasciitis）\n\n- 骨骼与软骨：软骨损伤、应力性骨折（Stress fracture）\n\n- 常见运动损伤：ACL损伤、肩袖损伤（Rotator cuff）、网球肘（Lateral epicondylitis）、髌股疼痛综合征（PFPS）\n\n- 评估流程：ABC（Airway → Breathing → Circulation）→ 二次评估（Secondary assessment）→ 拨打急救电话\n\n- CPR / AED：心肺复苏术和自动体外除颤器使用"], [9, "快速导航（续）", "- 紧急情况处理：窒息（Heimlich 手法）、心绞痛（停止运动、舌下硝酸甘油）、晕厥、中风（FAST 识别）、低血糖（口服葡萄糖）\n\n- 热相关疾病：热衰竭（Heat exhaustion）vs 中暑（Heat stroke，体温 > 40°C，需立即降温并呼叫急救）\n\n- 商业结构：独资企业（Sole proprietorship）、合伙企业（Partnership）、公司（Corporation）\n\n- 过失四要素：责任（Duty）、违反责任（Breach of duty）、损害（Damages）、因果关系（Proximate cause）\n\n- 替代责任（Vicarious liability）：雇主对雇员工作范围内的过失承担责任"], [9, "快速导航", "- 贡献过失（Contributory negligence）：原告自身行为对损害有贡献时可减少赔偿\n\n- 风险管理：责任保险（Liability insurance）、知情同意书、健康筛查文件、急救预案\n\n- 直接雇员（Employee）模式：健身房提供客户、场地、保险；教练获得固定薪资或时薪，自主权较低\n\n- 独立承包商（Independent contractor）模式：教练自主经营，承担自身保险和税务；自主权高但风险自担\n\n- 商业计划要素：执行摘要（Executive summary）、财务规划、营销策略（Marketing strategy）\n\n- 品牌建设：个人品牌定位、目标市场选择、线上与线下获客渠道"]]}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f5f5f5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.chat-header{background:#2d5016;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);flex-shrink:0}
.chat-header .avatar{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.chat-header .info h3{font-size:15px;font-weight:600}
.chat-header .info p{font-size:11px;opacity:.8}
.chat-header .close-btn{margin-left:auto;width:32px;height:32px;border:none;background:rgba(255,255,255,.15);border-radius:50%;color:#fff;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center}
.chat-header .close-btn:hover{background:rgba(255,255,255,.3)}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.message{display:flex;gap:8px;max-width:88%;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.ai{align-self:flex-start}
.message.user{align-self:flex-end;flex-direction:row-reverse}
.message .bubble{padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.65;word-break:break-word}
.message.ai .bubble{background:#fff;color:#333;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.message.user .bubble{background:#2d5016;color:#fff;border-bottom-right-radius:4px}
.message .msg-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.message.ai .msg-avatar{background:#e8f5e9}
.message.user .msg-avatar{background:#e0e0e0}
.suggestions{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.suggestion-chip{background:#fff;border:1px solid #e0ddd8;border-radius:18px;padding:5px 12px;font-size:12px;color:#2d5016;cursor:pointer;transition:all .2s}
.suggestion-chip:hover{background:#e8f5e9;border-color:#2d5016}
.chat-input{padding:12px 16px;background:#fff;border-top:1px solid #e0ddd8;display:flex;gap:8px;align-items:center;flex-shrink:0}
.chat-input input{flex:1;border:1px solid #e0ddd8;border-radius:22px;padding:9px 16px;font-size:13.5px;outline:none;transition:border-color .2s}
.chat-input input:focus{border-color:#2d5016}
.chat-input button{width:36px;height:36px;background:#2d5016;border:none;border-radius:50%;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.chat-input button:hover{background:#1b3a0e}
.chat-input button:disabled{background:#999;cursor:not-allowed}
.typing{display:none;align-self:flex-start;padding:10px 14px;background:#fff;border-radius:14px;border-bottom-left-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-left:38px}
.typing.show{display:flex;gap:4px;align-items:center}
.typing span{width:5px;height:5px;background:#999;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.bubble h1,.bubble h2,.bubble h3{margin:6px 0 4px;font-size:14px}
.bubble ul,.bubble ol{margin:4px 0 4px 18px}
.bubble li{margin:2px 0}
.bubble strong{font-weight:600}
.bubble code{background:rgba(0,0,0,.06);padding:1px 4px;border-radius:3px;font-size:12px}
.bubble p{margin:4px 0}
.source-tag{display:inline-block;background:#e8f5e9;color:#2d5016;font-size:11px;padding:2px 8px;border-radius:10px;margin-top:6px}
</style>
</head>
<body>

<div class="chat-header">
  <div class="avatar">🎓</div>
  <div class="info">
    <h3>ACE 教材 AI 助教</h3>
    <p>基于教材内容的智能答疑</p>
  </div>
  <button class="close-btn" id="closeBtn" onclick="if(window.parent!==window)window.parent.document.getElementById('ace-chat-overlay').style.display='none'">✕</button>
</div>

<div class="chat-messages" id="messages">
  <div class="message ai">
    <div class="msg-avatar">🎓</div>
    <div class="bubble">你好！我是 ACE 教材 AI 助教。你可以问我任何关于课程内容的问题。</div>
  </div>

// ========== Improved Chinese Tokenizer (Dictionary-based) ==========
function tokenize(text) {
  text = text.toLowerCase();
  const tokens = [];
  // English words (may include trailing digits like vt1, vo2max)
  const enMatches = text.match(/[a-z][a-z0-9_-]*/g);
  if (enMatches) tokens.push(...enMatches);
  // Numbers: mask out English-word regions first to avoid extracting digits from tokens like "vt1"
  const masked = text.replace(/[a-z][a-z0-9_-]*/g, ' ');
  const nums = masked.match(/\d+\.?\d*%?/g);
  if (nums) tokens.push(...nums);
  const zhSegments = text.match(/[\u4e00-\u9fff]+/g);
  if (zhSegments) {
    for (const seg of zhSegments) {
      let i = 0;
      while (i < seg.length) {
        let matched = false;
        const maxLen = Math.min(seg.length - i, 6);
        for (let len = maxLen; len > 1; len--) {
          const candidate = seg.substring(i, i + len);
          if (ACE_DICT.has(candidate)) {
            tokens.push(candidate);
            i += len;
            matched = true;
            break;
          }
        }
        if (!matched) {
          tokens.push(seg[i]);
          if (i < seg.length - 1) tokens.push(seg.substring(i, i + 2));
          i++;
        }
      }
    }
  }
  return tokens;
}

// ========== Query Preprocessing ==========
function preprocessQuery(query) {
  const queryLower = query.toLowerCase();
  const chapterMatch = queryLower.match(/第(\d+)[章节]/);
  const chapterHint = chapterMatch ? parseInt(chapterMatch[1]) : null;
  let queryClean = queryLower.replace(/请问|帮我|我想问|我想知道|请告诉我|告诉一下|一下|能不能|请问一下/g, '');
  const baseTokens = tokenize(queryClean);
  const expandedSet = new Set(baseTokens);
  for (const tok of baseTokens) {
    if (SYNONYM_MAP[tok]) {
      expandedSet.add(SYNONYM_MAP[tok]);
      const synTokens = tokenize(SYNONYM_MAP[tok]);
      synTokens.forEach(t => expandedSet.add(t));
    }
  }
  return { tokens: Array.from(expandedSet), chapterHint };
}

// ========== IDF Pre-computation ==========
const N = blocks.length;
const df = {};
for (const b of blocks) {
  const content = (b[2] + ' ' + b[1]).toLowerCase();
  const seen = new Set();
  const toks = tokenize(content);
  for (const t of toks) {
    if (!seen.has(t)) { seen.add(t); df[t] = (df[t] || 0) + 1; }
  }
}
const idf = {};
for (const t in df) {
  idf[t] = Math.log((N + 1) / (df[t] + 1)) + 1;
}

// ========== Improved TF-IDF Search with Dictionary Scoring ==========
function searchKnowledge(query, topK) {
  topK = topK || 6;
  const { tokens: qTokens, chapterHint } = preprocessQuery(query);
  if (!qTokens.length) return [];

  const scores = [];
  for (let i = 0; i < blocks.length; i++) {
    const b = blocks[i];
    const content = (b[2] + ' ' + b[1]).toLowerCase();
    const title = (b[1] || '').toLowerCase();
    const cTokens = tokenize(content);
    const tf = {};
    for (const t of cTokens) tf[t] = (tf[t] || 0) + 1;
    const cLen = cTokens.length || 1;

    let score = 0;
    for (const qt of qTokens) {
      const isDictWord = ACE_DICT.has(qt) || qt.length >= 3;
      const weight = isDictWord ? 3.0 : 1.0;
      if (tf[qt] && idf[qt]) {
        score += (tf[qt] / cLen) * idf[qt] * weight;
      }
      if (!tf[qt] && content.includes(qt)) {
        score += 0.5 * (idf[qt] || 1.0) * weight;
      }
    }
    if (score > 0 && title) {
      for (const qt of qTokens) {
        if (title.includes(qt)) {
          score *= 1.5;
          break;
        }
      }
    }
    if (chapterHint && b[0] === chapterHint) {
      score *= 2.0;
    }
    if (score > 0) scores.push({ idx: i, score: score });
  }

  scores.sort((a, b) => b.score - a.score);
  return scores.slice(0, topK).map(s => s.idx);
}

// ========== Build Context with Source Annotations ==========
function buildContext(indices) {
  if (!indices || indices.length === 0) {
    return '【未找到直接相关的教材段落】\n建议在对话中引导学生回顾教材目录，或提出更具体的问题。';
  }
  const parts = [];
  const seen = new Set();
  for (const idx of indices) {
    const b = blocks[idx];
    const key = b[0] + '|' + b[2].substring(0, 50);
    if (seen.has(key)) continue;
    seen.add(key);
    const chName = chapters[b[0]] || ('第' + b[0] + '章');
    let ctx = '【第' + b[0] + '章 - ' + chName;
    if (b[1]) ctx += ' · ' + b[1];
    ctx += '】\n' + b[2];
    parts.push(ctx);
  }
  return parts.join('\n\n---\n\n');
}

// ========== Simple Markdown Renderer ==========
function renderMarkdown(text) {
  if (!text) return '';
  let html = text;
  // Escape HTML
  html = html.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Headers
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  // Unordered list
  html = html.replace(/^[•·\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, function(m) { return '<ul>' + m + '</ul>'; });
  // Numbered list
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Paragraphs
  html = html.replace(/\n\n/g, '</p><p>');
  html = html.replace(/\n/g, '<br>');
  html = '<p>' + html + '</p>';
  // Clean empty tags
  html = html.replace(/<p><\/p>/g, '');
  html = html.replace(/<p>(<h[23]>)/g, '$1');
  html = html.replace(/(<\/h[23]>)<\/p>/g, '$1');
  html = html.replace(/<p>(<ul>)/g, '$1');
  html = html.replace(/(<\/ul>)<\/p>/g, '$1');
  return html;
}

    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message ' + type;
    const avatar = type === 'ai' ? '🎓' : '👤';
    const content = type === 'ai' ? renderMarkdown(text) : text.replace(/\n/g, '<br>');
    div.innerHTML = '<div class="msg-avatar">' + avatar + '</div><div class="bubble">' + content + '</div>';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  };

  async function callDeepSeek(userQuestion) {
    // 1. Search knowledge base
    const indices = searchKnowledge(userQuestion, 5);
    const context = buildContext(indices);

    // 2. Build messages
    const sysContent = SYSTEM_PROMPT + '\n\n## 教材内容（相关段落）\n' + (context || '（未找到相关内容）');
    
    conversationHistory.push({ role: 'user', content: userQuestion });
    
    const messages = [
      { role: 'system', content: sysContent },
      ...conversationHistory.slice(-6)
    ];

    // 3. Call API
    const resp = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer sk-372c38675f5e45ed8db9d8cde2136356'
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: messages,
        max_tokens: 1024,
        temperature: 0.3
      })
    });

    if (!resp.ok) {
      throw new Error('API error: ' + resp.status);
    }

    const data = await resp.json();
    const reply = data.choices[0].message.content;
    conversationHistory.push({ role: 'assistant', content: reply });
    
    // Keep history manageable
    if (conversationHistory.length > 10) {
      conversationHistory.splice(0, conversationHistory.length - 8);
    }
    
    return reply;
  }


  // ========== Follow-up Suggestion Generator ==========
  function generateFollowUps(reply, originalQuery) {
    const container = document.getElementById('suggestions');
    if (!container) return;
    container.innerHTML = '';
    
    const suggestions = [];
    const replyLower = reply.toLowerCase();
    
    const chapterTopics = {
      1: ['执业范围具体案例', '健康照护联盟协作', 'ACE续证要求'],
      2: ['跨理论模型各阶段特点', '自我效能如何提升', '动机访谈实操'],
      3: ['蛋白质摄入推荐量', '宏量营养素分配', '能量平衡计算'],
      4: ['肌肉收缩类型', '力矩与杠杆原理', '运动平面分类'],
      5: ['VT1和VT2区别', 'EPOC的应用', '心肺训练处方设计'],
      6: ['体适能评估流程', 'FMS评分标准', '血压测量注意事项'],
      7: ['FITT原则应用', '周期化训练设计', '渐进超负荷实施'],
      8: ['妊娠期训练注意事项', '高血压客户训练方案', '老年人跌倒预防'],
      9: ['HIPAA隐私保护', '道德准则案例', '转介流程']
    };
    
    const chapterRefs = reply.match(/第(\d+)[章节]/g);
    let detectedChapters = [];
    if (chapterRefs) {
      detectedChapters = [...new Set(chapterRefs.map(r => parseInt(r.match(/\d+/)[0])))];
    }
    
    for (const ch of detectedChapters) {
      if (chapterTopics[ch]) {
        const topics = chapterTopics[ch].filter(t => !replyLower.includes(t.toLowerCase()));
        suggestions.push(...topics.slice(0, 2));
      }
    }
    
    if (suggestions.length === 0) {
      const keywordSuggestions = {
        'vt1': ['VT2的定义和应用', '如何利用VT1设计训练', '通气阈值的测试方法'],
        'vt2': ['VT1和VT2的区别', 'VT2在间歇训练中的应用', '如何判断客户达到VT2'],
        '高血压': ['高血压客户的运动禁忌', '有氧训练对血压的影响', '客户筛查流程'],
        '深蹲': ['深蹲常见错误', '深蹲的肌肉激活顺序', '如何教客户正确深蹲'],
        '执业范围': ['执业范围具体案例', '什么情况下需要转介', '道德准则核心内容'],
        '续证': ['CEC学分要求', '继续教育方向推荐', '认证到期怎么办'],
        '蛋白质': ['每日蛋白质推荐量', '蛋白质来源对比', '蛋白质与肌肥大的关系'],
        '周期化': ['线性周期化设计', '板块周期化特点', '如何为客户制定周期计划'],
      };
      
      for (const [keyword, sugs] of Object.entries(keywordSuggestions)) {
        if (replyLower.includes(keyword) || originalQuery.toLowerCase().includes(keyword)) {
          suggestions.push(...sugs.slice(0, 2));
          break;
        }
      }
    }
    
    if (suggestions.length === 0) {
      suggestions.push('这个知识点在考试中的重点', '能举一个实际案例吗', '还有其他相关内容吗');
    }
    
    const finalSuggestions = suggestions.slice(0, 3);
    for (const sug of finalSuggestions) {
      const chip = document.createElement('div');
      chip.className = 'suggestion-chip';
      chip.textContent = sug;
      chip.onclick = function() { sendSuggestion(this); };
      container.appendChild(chip);
    }
    container.style.display = 'flex';
  }

  window.sendMessage = async function() {
    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    const sendBtn = document.getElementById('sendBtn');
    const typing = document.getElementById('typing');

    addMessage(text, 'user');
    input.value = '';
    input.disabled = true;
    sendBtn.disabled = true;

    document.getElementById('suggestions').style.display = 'none';
    typing.classList.add('show');

    const messages = document.getElementById('messages');
    messages.scrollTop = messages.scrollHeight;

    try {
      const reply = await callDeepSeek(text);
      typing.classList.remove('show');
      addMessage(reply, 'ai');
      generateFollowUps(reply, text);
    } catch (err) {
      typing.classList.remove('show');
      addMessage('抱歉，AI 服务暂时不可用。请稍后再试。\n\n错误信息：' + err.message, 'ai');
    }

    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
  };

  window.sendSuggestion = function(el) {
    document.getElementById('userInput').value = el.textContent;
    document.getElementById('suggestions').style.display = 'none';
    sendMessage();
  };

  // Show close button if in iframe
  if (window.parent !== window) {
    document.getElementById('closeBtn').style.display = 'flex';
  }
})();
</script>
