<script type="application/json" id="knowledge-base">{"chapters": {"1": "私人教练的角色和执业范围", "2": "行为改变的基础", "3": "营养基础", "4": "人体运动科学", "5": "运动生理学", "6": "体适能评估", "7": "训练计划设计", "8": "特殊人群训练", "9": "法律与职业道德"}, "blocks": [[1, "本章导读", "本章介绍ACE认证私人教练的角色、执业范围和职业责任，并说明私人教练在健康照护联盟中的协作位置以及职业发展路径。清楚这些内容，是安全、合规地开展私人教练服务的基础。\n\n学完本章，你应当能够： 解释ACE认证私人教练的角色和执业范围；② 区分私人教练可以提供的服务与需要转介的事项；③ 说明私人教练在健康照护联盟中的协作位置；④ 说明持续教育、学位和专业资质对职业发展的作用。\n\nACE 私人教练的专业性，由四件事共同定义： 在法定执业范围内服务；② 遵守 ACE（American Council on Exercise，美国运动委员会）职业道德准则；③ 在健康照护联盟中找到自己的协作位置；④ 通过持续教育保持职业长期发展。"], [1, "本章内容概览", "| 1. 法定执业范围\n\n| 我合法能做什么、不能做什么\n\n| 5 件禁止：不诊断、不开菜单、不治疗、不主导康复、不开药\n\n| 2. 职业道德准则\n\n| 法律允许的事里，应该怎么做\n\n| HIPAA 隐私 / 2年20小时2.0 CECs / 安全优先：消除＞告知\n\n| 3. 健康照护联盟\n\n| 我和医生、营养师、康复师的关系\n\n| 医师=看门人 / NCCA 质量标准 / 双向转介\n\n| 4. 职业发展\n\n| 持证之后往哪儿走\n\n| 深耕专项 / 学历深造 / 跨界资质（如 RD、SNC）"], [1, "关键数字", "| 4 + 1\n\n| NCD 可变危险因素：身体活动不足 + 吸烟 + 营养不良 + 过度饮酒 + 久坐行为\n\n| 2年 / 20小时 / 2.0 CECs\n\n| ACE 续证周期 + 每周期最低继续教育时长 + 继续教育学分\n\n| 2030\n\n| WHO 全球降低成年人和青少年久坐不动比例的目标年\n\n| 122,007\n\n| Mandsager et al. 2018 心肺适能与全因死亡率研究样本量（克利夫兰诊所）\n\n| 10%\n\n| 健身教练预期就业增长率（2016-2026，BLS），高于所有职业平均 7%\n\n| ≥5\n\n| ACE 道德准则核心条目数"], [1, "执业范围速览", "| 1. 诊断病症/病因\n\n| 1. 健康筛查+风险评估\n\n| 2. 开个性化饮食菜单\n\n| 2. 一般性营养科普\n\n| 3. 治疗/主导康复\n\n| 3. 康复结束后的运动支持\n\n| 4. 监测临床康复指标\n\n| 4. 客观记录+转介报告\n\n| 5. 心理治疗/超出资质提供补充剂或药物建议\n\n| 5. 行为改变指导"], [1, "学习路线", "| 第一站\n\n| 理解行业大背景（板块 1）\n\n| 第二站\n\n| 明确法律红线（板块 2）\n\n| 第三站\n\n| 守住道德规范（板块 3）\n\n| 第四站\n\n| 找到协作位置（板块 4）\n\n| 第五站\n\n| 规划职业路径（板块 5）\n\n每一站后面都配小节回顾与练习，每节读完即时自测，章末有完整收口总结。"], [1, "名词与缩写", "| ACE\n\n| American Council on Exercise\n\n| 美国运动委员会\n\n| NCCA\n\n| National Commission for Certifying Agencies\n\n| 美国国家认证机构委员会\n\n| NCD\n\n| Non-Communicable Diseases\n\n| 非传染性疾病\n\n| HIPAA\n\n| Health Insurance Portability and Accountability Act\n\n| 美国健康保险流通与责任法案\n\n| BLS\n\n| Bureau of Labor Statistics\n\n| 美国劳工统计局\n\n| CPR\n\n| Cardiopulmonary Resuscitation\n\n| 心肺复苏\n\n| AED\n\n| Automated External Defibrillator\n\n| 自动体外除颤器\n\n| CEC\n\n| Continuing Education Credit\n\n| 继续教育学分\n\n| RD\n\n| Registered Dietitian\n\n| 注册营养师\n\n| SNC"], [1, "名词与缩写（续）", "| Senior Nutrition Coach\n\n| 高级营养教练\n\n| GTO\n\n| Golgi Tendon Organ\n\n| 高尔基腱器官\n\n| ROM\n\n| Range of Motion\n\n| 关节活动度\n\n| NMSC\n\n| Non-Melanoma Skin Cancer\n\n| 非黑色素瘤皮肤癌"], [1, "导入：身体活动的健康价值与公共健康背景", "在进入执业规则前，先通过表 1-4 身体活动相关的健康益处，奠定了私人教练的行业价值，这里有两个核心知识点，也是 ACE 对行业的核心定位：\n\n##### 1. 两大全覆盖原则：\n\n身体活动的益处覆盖全生命周期+全人群，从儿童、青少年、成年人到老年人，无一例外；益处不仅局限于身材改变，身体功能、认知能力和情绪状态的全面改善，从降低慢性疾病风险，到全面提升生活质量，都和规律的身体活动直接相关。（PA（身体活动）= 3岁到老的\"全龄全益\"运动）\n\n身体活动的益处覆盖全人群、全生命周期，没有谁不需要它。当客户问\"我练这个能瘦吗？\"时，应当告知规律运动不仅能改善体重，还能提升睡眠质量、减轻焦虑、改善认知功能，降低多种慢性病风险。表1-4是ACE对私人教练行业价值的官方背书，运动的好处从3岁到老年全覆盖。将私人教练的价值局限于\"塑形教练\"，是对这一职业定位的严重窄化。\n\n##### 定期身体活动相关的健康益处\n\n表1-4\n\n| 改善骨骼健康（3-17岁）\n\n| 降低全因死亡风险\n\n| 改善体重状态（3-17岁）\n\n| 降低心血管疾病死亡风险\n\n| 改善心肺和肌肉健康（6-17岁）"], [1, "导入：身体活动的健康价值与公共健康背景（续）", "| 降低心血管疾病风险（心脏病和中风）\n\n| 改善心脏代谢健康（6-17岁）\n\n| 降低高血压风险\n\n| 改善认知能力（6-13岁）*\n\n| 降低Ⅱ型糖尿病风险\n\n| 降低抑郁风险（6-13岁）\n\n| 降低不良血脂状态风险\n\n| 降低多种癌症风险（膀胱癌、乳腺癌、结肠癌等）\n\n| 改善认知能力*\n\n| 降低患痴呆症风险（含阿尔茨海默症）\n\n| 改善生活质量\n\n| 减少焦虑\n\n| 降低抑郁风险\n\n| 改善睡眠\n\n| 减慢或降低体重增长\n\n| 减肥（结合低卡路里摄入时）\n\n| 预防初次减肥后体重反弹\n\n| 改善骨骼健康状况\n\n| 改善身体机能\n\n| 降低跌倒风险（老年人）"], [1, "导入：身体活动的健康价值与公共健康背景", "| 降低跌倒受伤风险（老年人）\n\n注释:咨询委员会将身体活动的健康益处的证据分为有力证据、中等证据、有限证据或不可分级证据。此表中仅包含具有有力证据成中等证据的结果。\n\n*有关认知和大脑健康的其他组成部分,请参见《美国居民身体活动指南》(第2版)(Physical Activity Guidelines for Americons(2nd ed.)的表2-3。\n\n转自美国卫生和公众服务部(2018年)发布的《美国居民身体活动指南》(第2版)(Physical Activily Guidelines for Amerkons [2nd ed.ttos/Mhatgoaguidelineslecond-edinpdfPhysicol Activity Guidelines2ndeditionpdf)（老中青三代，健身八大益：心脑代谢骨骼肌，跌倒失眠焦虑郁（压））\n\n##### 3. 非传染性疾病（NCD）的核心诱因——\"四加一\" 风险因素："], [1, "导入：身体活动的健康价值与公共健康背景（续）", "身体活动不足、吸烟、营养不良、过度饮酒，是导致非传染性疾病（NCD）的四大可变危险因素；久坐行为正被学界提议作为第五个独立风险因素纳入，形成\"四加一\"模型。 据WHO数据，非传染性疾病每年导致约4100万人死亡，\n\n占全球死亡总数的71%，远超传染性疾病， 其中心血管疾病、癌症、糖尿病、慢性呼吸道疾病是主要致死病因。（NCD 四加一：动少、烟、酒、吃错 + 久坐行为（Sedentary Behavior））"], [1, "导入：身体活动的健康价值与公共健康背景", "NCD四大可变危险因素全部和生活方式相关，这是私人教练存在的意义。例如当客户问\"我为什么会得糖尿病？\"时，需要理解NCD是可变危险因素共同作用的结果。教练可以帮助干预其中可改变的因素，如身体活动不足，但病因分析需要医疗专业人士。一个常见的误区是教练承担\"诊断者\"角色，直接告诉客户病因或做过度假设如\"你不运动导致的\"，这是对病因的过度简化。\n\n可将非传染性疾病的可变危险因素看作多条相互作用的路径。身体活动不足、吸烟、有害使用酒精和不健康饮食均会提高风险，久坐行为还可能进一步增加健康负担。\n\n##### 4. 公共健康危机与权威指南\n\n世卫组织数据：身体活动不足是 21 世纪最严重的公共健康问题，心肺功能低下引发的死亡率，远高于我们熟知的肥胖、吸烟、高胆固醇、糖尿病。与之相反心肺功能极高的个体具有最低的全因死亡率。\n\n图1-1"], [1, "导入：身体活动的健康价值与公共健康背景（续）", "Steven Blair(2009年)将身体活动不足称为21世纪最大的公共健康问题。与肥胖、吸烟、高胆固醇和糖尿病相比,心肺适能低下导致的死亡率要高得多。克利夫兰诊所的研究人员对122.007名患者进行了一项回顾性研究,以评估心肺适能与全因死亡率之间的关系,并评估与适度心肺适能水平相比,极度心肺适能的相对益处或危害。他们发现,经风险调整的全因死亡率与心肺适能之间存在负相关关系,其中较低心肺适能的调整后死亡率风险大于或等于心血管疾病、糖尿病和吸烟的死亡率风险(Mandsager等人,2018年)。此外，Mandsager和同事(2018年)发现,具有极度心肺适能的个体(被归类为心肺健康比年龄和性别平均值高2个标准差)具有最低的经风险调整的全因死亡率,并且益处扩展到高血压或70岁及以上的患者。这项研究支持Blair(2009年)报告的发现,并为实现和维持高水平心肺适能的重要性(Mandsager等人,2018年)提供了支持)"], [1, "导入：身体活动的健康价值与公共健康背景", "一句话总结：要活着，就不能”没心没肺“。心肺功能的好坏和死亡率直接相关。（122,007：克利夫兰诊所大样本研究，心肺适能2SD极高，全因死亡风险最低）\n\n较低心肺适能的死亡风险≥糖尿病和吸烟的死亡风险，这就是为什么教练要把心肺训练放在首位。2030年前降低久坐比例是WHO的全球目标，私人教练可以在这个目标中发挥推动作用。\n\n● 同时参照2018 年美国居民身体活动指南，该指南针对儿童、成年人、老年人、妊娠期 / 产后女性、慢性疾病人群，制定了改善心肺功能、肌肉健康、骨骼强度、平衡力与柔韧性的运动方案，核心目标是 2030 年前全球降低成年人和青少年久坐不动的比例。（2030：全球健身目标年，久坐比例要降低）\n\n全球行动目标如同一张共同的路线图，为各国制定政策、建设环境和评估身体活动促进工作提供方向。\n\n结合教材逻辑我们可以思考：\n\n如果健身行业的定位是为全人群、全生命周期提供身心一体化健康服务，那这个行业具备极强的可持续性，不存在所谓 \"行业冬天\"；但如果仅局限于局部增肌、减脂的单一需求。服务人群、方案空间都会极度受限。\n\n图1-2"], [1, "1.1 “执业范围”的定义", "执业范围界定了特定专业人员可以提供的服务。ACE认证私人教练应在表1-5所列范围内工作，并同时遵守所在地法规和机构规定。超出执业范围可能产生法律、伦理和职业责任。（执业范围 = \"法律围墙\"，围墙内是教练的合法服务区，围墙外是其他专业人士的专属领地）\n\n执业范围是私人教练的专业边界。超出范围提供受监管的医疗、营养或心理健康服务，可能违反当地法律和ACE职业规范。教练不对疼痛原因作医学诊断；应根据筛查结果、客户反应和必要的医学许可，决定调整训练或转介。会转介的教练才是合格的教练。\n\n执业范围如同道路的车道与护栏，使不同专业人员在各自职责范围内安全协作。\n\n表1-5\n\n| 诊断病症或疾病\n\n| 遵循由适当管理机构（如美国妇产科医师学会和美国糖尿病协会）提出的关于疾病和紊乱的运动规划的公认准则评估运动受限情况通过健康筛查和健身评估确定潜在的危险因素根据需要，将客户转介给相应的医疗保健专业人员遵守由客户的医生或其他医疗保健专业人员提供的免责就医授权书中列出的指导和限制\n\n| 规定饮食或营养补充剂"], [1, "1.1 “执业范围”的定义（续）", "| 将客户转介给注册营养师，以进行膳食计划或特定饮食计划提供关于健康的循证营养的一般信息（例如《美国居民膳食指南》Dietary Guidelines for Americans）\n\n| 治疗受伤或疾病患者，或在客户受伤后帮助客户康复\n\n| 使用运动计划来帮助客户改善整体健康状况帮助客户遵从医生或理疗师的建议在客户的康复治疗结束后，设计一个运动计划根据需要，将客户转介给相应的医疗保健专业人员\n\n| 监督医疗转介绍客户的临床进展\n\n| 记录进展情况，并在获得客户许可后向相应的医疗保健专业人员或医生报告遵循医生、理疗师、注册营养师或其他医疗保健专业人员的建议\n\n| 咨询客户"], [1, "1.1 “执业范围”的定义", "| 使用指导技巧，支持客户改变行为习惯（例如，增加身体活动和采用健康的饮食习惯）提供一般健康和保健信息根据需要，将客户转介给相应的医疗保健专业人员"], [1, "1.2 ACE认证私人教练的执业范围", "这些行为是教材明确的执业红线，私人教练无资质开展，对应专业人员分别为：\n\n1. 禁止诊断任何疾病（专属执业医师）（诊断 = 医生的活，教练：做好医生的小帮手）\n\n当客户说\"我膝盖疼，你帮我看看是什么问题\"时，正确的做法是说\"膝盖疼痛的原因需要专业医生诊断，我可以帮你做筛查，必要时转介\"。根据经验判断\"可能是半月板损伤\"属于越界诊断行为。需要警惕的误区是把\"评估\"当成\"诊断\"——评估是教练的执业内容，但诊断病因属于医疗专业人员。\n\n私人教练可以把客户目标、医学许可和运动原则转化为可执行的训练安排，但不负责医学诊断。\n\n2.禁止开具个性化饮食菜单（专属注册营养师）（开菜单 ：营养师的的活。教练只做“传道人“。）\n\n教练可以推荐\"ChooseMyPlate.gov\"等官方工具，讲解基础营养知识，但不能开菜单，也不能推荐补充剂剂量。美国居民膳食指南和MyPlate是教练可以使用的官方工具。营养服务的执业边界受当地法规管理，超出一般营养教育的服务，应由当地认可的合资格专业人员提供。\n\n3. 禁止治疗受伤客户、主导客户康复（专属康复治疗师）（治疗康复 ：物理治疗时的活，教练只做康复师的好帮手：）"], [1, "1.2 ACE认证私人教练的执业范围（续）", "4.禁止监测医疗转介客户的病情恢复进度（专属临床医师）（临床监测 ：医生的活，教练只做记录\"运动相关进展\"）\n\n教练应客观记录训练表现和运动反应；不应将记录解释为医学诊断或临床康复评定。记录内容只涉及运动表现、功能状态，不涉及临床医学指标。\n\n5. 禁止提供专业（如心理）咨询（专属持证咨询师）（心理咨询 = 心理咨询师的活，教练只能：\"倾听+保密+转介\"）\n\n教练可以共情倾听，但解决方案要转介给专业人士。教练的行为改变技术是循证的，但仅限于支持性辅助，不能代替心理健康问题的诊断和治疗。\n\n私人教练可以倾听、共情并提供一般性支持，但心理评估和治疗应由合资格的心理健康专业人员完成。"], [1, "1.3 ACE认证私人教练的知识、技能和能力", "很多同学在看以上那么多”不能做“的时候都会觉得气馁，感觉被命运掐住了喉咙，不能大展身手。但”不以规矩，不能成方圆“，执业规范的核心是划定专业边界，明确各行业分工：教练不得开展医学诊断，正如医生不会教会员做深蹲和硬拉。跨执业范围服务，将带来安全与法律风险。但确实，在工作实践中，单纯以职责边界回绝客户的问题和诉求，容易造成较差的服务体验。恪守执业边界，并不等同于专业价值受限，在许可范围内，仍存在大量核心工作：\n\n1.评估客户健康危险因素，并及时转介绍 （医生的好帮手）（转介 = 教练的核心技能之一，是专业能力的体现）\n\n私人教练需要保持风险识别意识，发现超出执业范围或需要进一步评估的情况时及时转介。\n\n2.提供营养知识普及（营养师的好帮手）（科普 = 可以，处方 = 不行）\n\n私人教练可以讲解公开的健康饮食指南，但个体化治疗性膳食应由具备相应资质的营养专业人员制定。\n\n3. 辅助客户遵从理疗师、康复师制定的运动计划，或在客户康复期后执行配套运动方案；（物理治疗师的好帮手）\n\n（在医学许可和明确限制内开展运动指导；诊断和治疗由相应的合资格专业人员负责。）"], [1, "1.3 ACE认证私人教练的知识、技能和能力（续）", "客户从物理治疗师那里\"毕业\"后，才能来找教练做功能性训练。康复期客户的运动方案遵循医生出方向、教练执行细节的协作模式。\n\n对于获得医学许可的客户，私人教练应在医疗人员给出的限制和建议范围内设计并实施运动计划。\n\n4.客观记录客户的身体、伤情发展状况（记录\"练了多少\"，不记录\"好了多少\"）\n\n私人教练记录运动表现和训练反应，不根据这些记录作出医学诊断。\n\n5.运用运动指导技巧、基础行为改变技巧辅助客户（行为改变 = 教练的专业，深度心理干预 = 咨询师的专业）\n\n行为改变方法可以支持客户建立运动习惯，但不能代替心理健康问题的诊断和治疗。"], [1, "1.3 ACE认证私人教练的知识、技能和能力", "● 因此，教练的角色是医疗团队（医师、营养师、康复师、心理咨询师）的辅助者与转介枢纽。教练需要判断客户是否需要马上转介绍，并接收由上述医疗保健专业人士转介绍而来的客户，为其设计训练方案。\n\n##### 执业范围的核心原则\n\n1. 绝不跨界从事其他医疗健康保健专业人士的专属服务；\n\n2. 为客户制定的运动方案，不得与客户的健康照护团队建议相悖，必须严格配合医疗团队的要求。（执业范围两原则：不越界 + 遵医嘱）\n\n教练必须遵守医疗专业人员提出的运动限制和注意事项；若限制不清，应在训练前请客户进一步确认。\n\n私人教练是健康照护联盟中的协作者，需要尊重其他专业人员的职责和建议。\n\n本章严格规定了教练的职业范围（法律）和道德准则（合规持证+安全，隐私，转介绍）\n\n那为什么要严格规定教练的执业范围？\n\n法律风险：职业范围划定了私人教练可以提供的服务。超出资质提供医疗诊断、治疗或治疗性营养处方，可能违反当地法律、导致职业责任，并触发ACE纪律程序。\n\n专业边界：教练的核心职能是帮助健康大众及被医疗专业人士治疗后允许参与运动的人群进行运动训练，而非疾病诊断、治疗或心理干预，越界不仅不专业，还可能误导客户。"], [1, "1.3 ACE认证私人教练的知识、技能和能力（续）", "客户安全：让客户接受专业医师 / 治疗师的诊疗，再由教练配合做运动支持，是最安全、最有效的路径。"], [1, "1.4 职业责任和道德规范", "拓展知识\n\nACE道德准则\n\nACE道德准则管理ACE认证的专业人员在与客户、公众或其他健康和运动专业人员合作时应遵守的道德和专业标准。注册参加ACE认证考试的每个人都必须同意在整个考试过程中遵守ACE道德准则，并且在获得ACE认证后作为专业人员遵守该准则。考试应试者和ACE认证的私人教练必须全面了解该准则以及违反每项原则可能造成的后果以及潜在的公众伤害。\n\n道德准则是法律允许范围内，保障职业存续的核心规范，从考试阶段到持证执业全程遵守，也是 ACE 考试的高频考点，核心要求如下：（道德准则 = 法律的\"温柔补充\"：法律告诉你不能做什么，道德告诉你应该怎么做）\n\n道德准则让从业者从\"合法\"走向\"专业\"。持续教育是进入健康照护联盟的\"准入门槛\"。\n\n执业范围回答“可以做什么”，道德规范进一步说明“应当怎样做”。合法是最低要求，专业人员还应承担伦理责任。\n\n##### 1. 考试与继续教育规范\n\n1）必须诚信的参与认证考试；\n\n2）持证后每两年需完成至少 20 小时 ACE 认可的继续教育，获取 2.0 个继续教育学分，同时必须保持CPR 证书持续有效、按时更新。"], [1, "1.4 职业责任和道德规范（续）", "例如当证书快到期但忙于工作忘了续证时，正确的做法是立即查看ACE官网，了解续证截止日期和CECs要求，制定补学分计划。\"没事，先用过期证书顶着\"是严重的违规行为。证书过期后不可继续执业，这是一个需要警惕的常见误区。\n\n执照期和续期\n\nACE认证的有效期为两年，从获得该认证之日起计算，于当月最后一天到期。要进行新两年周期的认证续期，ACE认证的专业人员必须完成至少20小时的ACE批准的持续教育学分（2.0 CEC），并持有当前的心肺复苏（CPR）证书，且如果持证人生活在北美，则必须能够正确使用自动外部除颤器（AED）。"], [1, "1.4 职业责任和道德规范", "持续教育是医疗保健联盟的标准要求，有助于确保专业人员与各自领域内的最新研究保持同步，以保护公众。鉴于健身行业的动态性和运动科学的快速发展研究，运动专业人员必须定期完成持续教育。通过完成持续教育，ACE认证的专业人员可以了解运动科学的最新发现，并确保其服务与最新的健身和医疗保健指南保持一致。（续证\"222\"：2年周期 + 20小时 + 2.0 CECs + CPR有效 + AED合规（北美））\n\n取得认证是职业起点。持续教育和续证用于更新知识、保持能力，并证明专业人员持续履行职业责任。\n\n##### 2. 客户隐私保护（HIPAA 法案）\n\n私人教练应将客户健康与训练信息视为敏感信息并严格保护，参照HIPAA（美国《健康保险携带和责任法案》）的隐私保护原则进行管理。除客户适当授权、法律要求或紧急安全需要外，不应向无关第三方披露。HIPAA是否直接适用于某位教练，取决于其工作场景和法律身份。（客户信息默认应保密；披露前应确认授权、法律依据和必要范围。）"], [1, "1.4 职业责任和道德规范（续）", "客户的健康信息是\"最高机密\"，宁可多保密，不可多透露。例如当客户配偶打电话询问妻子的训练进展和健康状况时，正确做法是告知\"对不起，没有您妻子的授权，我不能透露她的训练信息。如果有训练方面的疑问，麻烦让她本人直接和我沟通会更合适。\"\"她最近减重效果不错\"这样的回应属于泄露隐私的错误做法。客户表现好并不意味着信息可以公开——这属于隐私保护的常见误区。\n\n客户健康信息应像其他敏感健康资料一样受到严格保护，只能在获得适当授权或法律要求的情况下披露。\n\n##### 3. 客户安全保障（最高优先级原则）\n\n私人教练需不计代价、最大限度降低客户运动风险，这是 ACE 道德准则的核心：\n\n○ 保证训练设施设备完好维护，地面与器械保持清洁、干燥；\n\n○ 必备应急计划与急救用品，这是执业基础配置；"], [1, "1.4 职业责任和道德规范", "○ 精准识别高风险客户并及时转介，合理设定运动强度避免运动损伤；\n\n○ 考试答题逻辑重点：若题目中多个选项均符合安全要求，需选择能最大程度消除风险的答案。例如跑步机故障，\"搬走故障跑步机\" 优于 \"张贴故障提示\"，考点核心是考察我们 \"极致保障客户安全\" 的执业理念。\n\n(安全：所有运动专业人员都应尽可能地减少每个人在健身设施中面临的风险。这包括配备具有适当间隔和良好工作状态的设备;有适用于便携式设备(包括稳定球、哑铃和壶铃)的机架、架子、挂钩或其他放置点;并确保地板和设备已经过清洁和维护且整洁干燥。运动专业人员还应注意设施的清洁度,包括使用后可使用擦拭巾或其他灭菌器来清洁设备。在发生伤害或事故时,应急计划、AED和适当的急救用品至关重要。"], [1, "1.4 职业责任和道德规范（续）", "私人教练具有额外的客户特定风险管理责任,从第一次会议开始时,其应进行健康历史访谈,以便在运动前确定是否需要将客户转介绍给医生或客户是否存在针对某些运动的限制条件或禁忌症。私人教练还需要为初始运动计划的设计以及运动计划修改确定适当的运动及强度级别。然后,通过帮助客户以安全有效的方式进行运动且适当进阶,私人教练可以最大限度地降低客户受伤的风险,并提高服务质量。即使有最好的风险管理计划,也可能发生伤害和事故。因此,ACE建议所有ACE认证的专业人员购买职业责任保险,以便当客户在训练期间受伤时提供保护(见第16章)。)（安全铁律——Eliminate（消除） > Inform（告知））\n\n跑步机故障时，搬走优于贴告示——这就是ACE的安全哲学：极致的安全意识。例如发现弹力带有轻微裂痕但还能用时，正确做法是立即移出训练区域。贴个告示\"请小心使用\"是错误的应对方式。\"还能用就先凑合\"是最大的安全隐患。安全铁律的核心是消除风险，而非仅仅提示风险。\n\n风险管理的重点是消除危险或有效隔离危险。仅提醒客户注意，通常不能替代实际的风险控制措施。"], [1, "1.4 职业责任和道德规范", "##### 4. 及时转介原则\n\n当服务内容超出自身执业边界、专业能力，或客户训练目标远超自身执教范围时，必须转介至医生、营养师、康复师，或更适配的专业私人教练。\n\n转介绍\n\n医疗保健专业人员（包括私人教练）务必要了解他们的专业资格和界限，并且始终将所需服务超出其执业范围的客户转介绍给适当的合格医疗保健专业人员。这样做可确保客户得到合格医护人员的适当护理，并防止医疗保健专业人员提供在其教育、培训、证书和/或法律权利范围之外的服务。有时，私人教练需要进一步调查，以确定是否需要转介绍。例如，如果客户想要以比安全减肥建议快得多的速度减肥，私人教练可以首先解释健康的减肥率，并与其一起确定一个安全可行的目标。如果客户对这个新目标感到满意，则私人教练可以设计一个计划来帮助客户实现目标。然而，如果客户仍然希望实现原来的减肥目标和时间线，则私人教练应该将其转介绍给RD、医生或其他相应的医疗保健专业人员。"], [1, "1.4 职业责任和道德规范（续）", "其他医疗保健专业人员也可将客户转介绍给私人教练。例如，医生可向患者提供运动指南，然后将其转介绍给ACE认证的私人教练，根据医生的指导制定个性化的运动计划。在这种情况下，私人教练应根据双方约定的频率，向医生定期提供有关客户进度和计划方向的最新信息。在获得客户的书面许可的前提下，务必要将客户转介绍给适当的医疗保健专业人员，且涉及的所有医疗保健专业人员务必定期回复每名客户的进展。（转介 = 专业能力，不是\"没本事\"）"], [1, "1.4 职业责任和道德规范", "转介是双向的。教练发现超出执业范围的问题时应及时转介，也可在获得适当医学许可和限制信息后，接收医疗专业人员转介的客户。例如当客户希望每周减重3斤（远超健康减重速度）时，直接答应并拼命给客户安排高强度训练是错误的。正确做法是先解释健康减重速率（每周0.5-1kg），协商可行目标；若客户坚持极端目标，则转介RD或医生。担心转介显得\"没本事\"是常见误区——转介恰恰是最专业的做法。\n\n健康照护联盟如同接力团队。私人教练既要完成自身职责，也要知道何时转介以及如何接收其他专业人员转介的客户。\n\n##### 5. 运动补剂规范\n\n私人教练可以就补充剂提供一般性教育，包括标签信息、证据局限和潜在风险，但不应超出自身资质进行个体化推荐，也不应解释药物与补充剂的个体化相互作用。涉及客户疾病、用药、妊娠或特殊营养需求时，应转介给医师或合资格的营养专业人员。\n\n补充剂和其他营养相关问题"], [1, "1.4 职业责任和道德规范（续）", "美国食品和药物管理局（FDA）对补充剂的监管方式与传统食品和药物产品的监管方式不同，FDA无权在补充剂上市前评估其有效性或安全性。与上市前需要确定安全性的药物不同，在证明不安全之前，补充剂被视为是安全的。因此，它们的强度、纯度和效果都无法保证。一些补充剂可能导致与其他处方药的不良相互作用和并发症或先天性问题。然而，补充剂市场构成了一个价值数百万美元的行业。这种有利可图的收入来源的诱惑以及消费者对于速成法的兴趣促使一些健身机构销售营养补充剂。健身机构出售商业营养补充剂并不违法，但在没有具备提供此类建议所需的专业知识和法定资格的工作人员（如RD或医生）的情况下，提供补充剂建议是一种不负责任的行为。如果会员对无相关资格的工作人员推荐的补充剂产生不良反应，则销售膳食补充剂的机构承担责任风险（见第6章和16章）。"], [1, "1.4 职业责任和道德规范", "一些私人教练积累了关于膳食补充剂的丰富知识。但是，他们仅有资格向客户推荐这些补充剂，而没有资格推荐药物或开具药物。除非私人教练也持有适当的营养相关证书（如RD或医生资格证书），否则其没有推荐补充剂所需的专业知识或法律资格。关于私人教练营养执业范围的ACE立场声明，请参见第6章。\n\n私人教练应该对自己进行补充剂方面的教育。客户经常向私人教练询问关于补充剂的问题，认为补充剂是实现健身、减肥或其他目标所必需的。私人教练可以帮助客户了解没有补充剂也可以实现健身目标，且补充剂可能会产生负面和可能有害的副作用。如果客户坚持使用膳食补充剂，则私人教练应将客户转介绍给合格的医生或RD以获得恰当指导。"], [1, "1.4 职业责任和道德规范（续）", "私人教练不仅可以与客户分享一般的非医疗营养信息，还应当与客户分享此类信息。私人教练可以向客户、行业和整个社区提供必要的服务，此时他们能够在其专业执业范围内提供可靠、实用且相关的营养信息。所有健康和运动专业人员都可以分享联邦政府认可或制定的饮食建议，包括《美国居民膳食指南》（Dietary Guidelines for Americans）（www.health.gov/dietaryguidelines）和 MyPlate 建议（www.ChooseMyPlate.gov）。所有ACE认证的私人教练均必须了解其与营养相关的执业范围，如第6章所定义。（可以讲解一般信息和风险；是否适合某位客户，应由具备相应资质的专业人员评估。）\n\n补充剂建议必须符合当地法规和本人资质范围；不确定时应提供一般信息并转介。例如当客户问\"我练完应该喝蛋白粉吗？\"时，\"当然喝！我这里有卖……\"是错误的。正确做法是告知\"蛋白粉只是蛋白质的便捷来源，通过均衡饮食完全可以满足。如果你想确认是否需要，可以咨询注册营养师\"。因为\"有提成\"就推荐是职业道德红线。教练可以发膳食指南链接，但不能写一日三餐食谱。"], [1, "1.4 职业责任和道德规范", "私人教练可以提供一般性教育，帮助客户理解补充剂信息，但不应超出资质进行个体化推荐或销售误导。\n\n##### 6. 在教学过程中的恰当与不恰当行为：\n\n表1-6\n\n| 脊柱前凸姿势站立\n\n| 诊断客户脊柱前凸的原因\n\n| 实施核心调理计划，改善臀部和脊柱肌肉的力量、柔韧性不平衡\n\n| 尝试商业饮食减肥\n\n| 帮助客户 \"选用 / 制定\" 减肥饮食\n\n| 提供膳食指南与工具（如 ChooseMyPlate.gov），帮助客户做健康选择\n\n| 肩袖物理治疗后\n\n| 继续物理治疗运动 / 治疗肩部撞击\n\n| 进行运动提高肩部稳定性，巩固物理治疗效果\n\n| 髂胫束（IT 带）紧张\n\n| 提供深层组织按摩缓解紧张\n\n| 教客户使用泡沫轴做 IT 带肌筋膜自我放松\n\n| 运动后肌肉酸痛\n\n| 推荐非处方抗炎药物\n\n| 讨论轻量动态拉伸技术，缓解不适\n\n| 因配偶问题感到郁闷\n\n| 倾听并提供改善建议\n\n| 共情倾听、保密，必要时转介心理咨询师\n\n（表1-6的关键是区分一般性教育与受监管的诊断、处方和治疗；遇到后者应转介。）"], [1, "1.4 职业责任和道德规范（续）", "表1-6可以作为执业边界检查表。遇到类似情境时，应先判断是否属于私人教练的职责，再决定指导、暂停或转介。\n\n● 表格讲解：核心执业红线（ACE 明确禁止的行为）\n\n● ACE 教练的执业底线，也是所有教练必须遵守的准则：\n\n1. 不诊断：不能判断客户脊柱前凸、疼痛等问题的 \"病因\"，这是医疗行为，只有执业医师可做。（诊断 = 找原因 = 医生的活）\n\n2. 不开菜单：不能制定 / 推荐减肥饮食方案、给客户 \"配餐\"，只能提供通用膳食指南，不能做个性化营养处方。（开菜单 = 写处方 = 营养师的活）\n\n3. 不代替治疗：不代替物理治疗师实施治疗。客户在治疗期间或结束后参加训练时，教练应遵守医疗团队给出的运动限制和注意事项。（治疗性运动 = 康复治疗师的活）"], [1, "1.4 职业责任和道德规范", "4. 不越界提供手法治疗：未另行取得相应资质时，不提供深层组织按摩或徒手治疗；可在能力范围内教授客户自我筋膜放松（如泡沫轴）。（手法治疗属于相应合资格专业人员的执业范围。）\n\n5. 不心理咨询 / 开药：不能提供心理问题解决方案、推荐药物，只能倾听、保密并转介专业人士。（心理问题 + 药物建议 = 咨询师/医生的活）\n\n遇到问题先想\"我能不能做\"，再做决定。教练可以说\"这个姿势会导致核心力量不平衡\"，但不能说\"你的疼痛是因为XX\"。客户在物理治疗期间或结束后是否适合参加训练，应依据医疗团队的建议、运动限制和客户当前状态判断，教练不承担物理治疗职责。教授自我放松与直接实施按摩或徒手治疗属于不同服务，应按本人资质和当地法规区分。教练是\"情绪倾听者\"，不是\"心理医生\"。\n\n1. 法律风险：超出资质提供受监管的医疗、营养或其他专业服务，可能带来法律责任、职业责任和ACE纪律后果。具体边界还应结合所在地法规和本人持有的其他资质判断。\n\n2. 专业边界：教练的核心职能是帮助健康大众及被医疗专业人士治疗后允许参与运动的人群进行运动训练，而非疾病诊断、治疗或心理干预，越界不仅不专业，还可能误导客户。"], [1, "1.4 职业责任和道德规范（续）", "3. 客户安全：让客户接受专业医师 / 治疗师的诊疗，再由教练配合做运动支持，是最安全、最有效的路径。"], [1, "2 健康照护联盟", "ACE 将大健康行业定义为健康照护联盟，这是我们理解执业边界、行业协作的关键："], [1, "2.1 健康照护联盟中的运动专业人员", "健康照护联盟由多类专业人员组成。医师和护士负责相应的医疗照护与协调；其他成员可包括脊椎按摩师、针灸师、按摩治疗师、心理健康专业人员、康复专业人员、注册营养师、私人教练和团体健身指导员。各专业人员依据自身资质和执业范围协作。\n\n医师是统筹者，教练是运动专家，各司其职、不跨界。例如当教练想和本地医疗专业人士建立转介关系时，直接去医院门口发名片是错误的方式。正确做法是通过参加医疗健康展会、加入专业协会、主动拜访诊所等方式建立联系。以为转介是\"单方面付出\"是常见误区——双向转介对双方都有价值。教练不是单打独斗，是联盟作战。\n\n私人教练处于健康照护联盟的一员。医师是联盟的“看门人”。NCCA认证是证书质量的保障标准，也是参与健康照护联盟协作的基础。双向转介中，教练不仅是接收者，更是识别风险、将客户送回医疗系统的“第一哨兵”。\n\n图1-3（健康照护联盟涵盖医疗、护理、康复、营养、心理健康和运动等专业；联盟协作不改变各自的执业边界。）\n\n##### 专业边界与协作"], [1, "2.1 健康照护联盟中的运动专业人员（续）", "联盟内各职业相互关联但执业范围不交叉，私人教练可搭建自身的健康照护资源网络，实现双向转介（如将异常客户转介至医师，医师也可将康复期客户转介至教练）。（协作逻辑 = \"你中有我，我中有你，但各管各的边界\"）"], [1, "2.2 运动专业人员认证项目的鉴定", "ACE和健身行业的其他顶级认证机构为运动专业人员认证项目申请NCCA第三方鉴定。NCCA是鉴定协会（ICE）的鉴定机构，依据《NCCA认证项目鉴定标准》审查认证项目。ACE的私人教练、团体健身指导员、健康教练和医学运动专家等认证项目获得NCCA鉴定。（NCCA鉴定的是认证项目是否符合规范的质量标准，而不是对个人进行排名。）\n\n教练不是单打独斗，是联盟作战。考取ACE证书意味着获得NCCA认证体系内的专业资质，这是参与健康照护联盟协作的基础。例如向客户解释自己的资质时，\"我是美国认证的私人教练，很厉害的\"是模糊且不专业的表述。正确做法是说明\"我持有ACE认证，该认证项目通过了NCCA第三方鉴定。\"只看证书名称、不认识背后的认证体系是常见误区。\n\n职业认证用于确认个人达到能力标准；项目鉴定则由独立机构审查认证项目是否符合质量标准。"], [1, "2.3 健康与健身行业的认可", "ACE和其他健身专业组织通过推动NCCA鉴定、专业标准和合作倡议，提高运动专业人员在健康照护联盟中的认可度。职业认证用于验证个人是否达到特定岗位的能力标准；NCCA鉴定则评估认证项目的质量。"], [1, "2.4 教育界的认可", "联合健康教育计划鉴定委员会（CAAHEP）等机构通过对运动科学相关教育项目设立标准，促进专业教育与职业能力要求的衔接。完成获鉴定的教育项目不等同于自动取得职业认证；学位、认证和执照分别承担不同功能。"], [1, "私教的未来", "美国劳工部（DOL）劳工统计局（BLS）（2018年）将健身行业的专业人员称为“健身教练和指导员”，将私人教练归类为“私人健身教练”。BLS（2018年）描述了该工作角色，称私人健身教练“设计并执行特定于客户需求的日常训练程序。他们可以训练单个客户，也可以教授集体课程。在大型机构，私人教练经常把他们"], [1, "私教工作机会的预期增长", "根据BLS（2018年）的推测，2016年至2026年，健身教练和指导员的就业机会预计将增长10%。此预期增长速度高于所有职业的7%平均增长速度，这归因于多种因素，其中包括：\n\n企业和保险公司为员工的身体活动提供支持；持续关注身体活动以改善健康和对抗肥胖；生育高峰时期出生的人继续积极预防伤害、疾病和慢性病；老年人寻求低强度运动以缓解关节炎和其他疾病。\n\n私人教练可以帮助那些看起来很健康的客户，以及慢性病患者和其他获得医学许可的患者，帮助他们改善健身和健康状况。接受过高级教育和培训且拥有证书的私人教练通常会具有必要的技能，可与接受损伤或疾病治疗后对运动计划有特殊需求的客户合作。在更多的临床环境中，高级运动专业人员可以在医生、理疗师或其他医疗保健专业人员的监督下工作。\n\n图1-4"], [1, "3.1 持续教育", "持证后持续精进，聚焦体重管理、青少年体适能、运动表现提升、高级健身指导等专项，打造专业差异化。（专项深耕 = 成为某一领域的\"专家\"，不是\"万金油\"）\n\n差异化竞争的核心是专项能力。学历加证书构成专业度的双保险。\n\n私人教练可以根据服务人群和职业目标形成专业方向，并通过相应的继续教育提升能力。"], [1, "3.2 学位", "攻读运动科学、运动康复、营养学、公共健康等相关学位，可以帮助私人教练建立更系统的理论基础和研究素养。（学历深造 = 打牢\"地基\"，上面才能盖更高的楼）\n\n职业认证验证特定岗位的能力标准，相关学位则提供更系统的科学基础；两者作用不同，也不能替代受监管职业的执照。"], [1, "3.3 健康照护联盟的新专业领域", "若想进入健康照护联盟中的其他职业领域，应按当地法规完成相应的学位、专业教育、认证或执照要求。进修课程可以增加知识，但不会自动扩大法律规定的执业范围。（跨界 = \"双证多能\"，但每个领域都要有对应资质）"], [1, "思考与练习", "以下题目来自各节末尾的即时自测，点击展开参考答案。"], [1, "板块 1 · 行业背景与执业范围", "答案：B"], [1, "板块 1 续 · NCD与心肺适能", "答案：C\n\n心肺适能与全因死亡率呈负相关，极度心肺适能（全因死亡率最低）定义为比同年龄同性别的均值高 2 个标准差。这说明提升客户的心肺适能是最重要的健康干预之一。"], [1, "板块 2 · 执业范围与法律红线", "答案：D\n\n答案：①-A ②-B ③-C ④-D ⑤-E"], [1, "板块 4-5 · 健康照护联盟与职业发展", "教练是客户最频繁接触的健康专业人员之一，能够通过健康筛查、训练观察等及时发现客户的健康警示信号，并向上游（医师）转介。"], [1, "知识翻卡", "共 12 张知识卡片，点击翻转查看答案\n\n\n##### 私人教练执业边界清单\n\n\n- ✅评估客户健康危险因素（PAR-Q+、健康史问卷）\n\n- ✅提供基础营养知识普及（非个性化饮食方案）\n\n- ✅辅助客户遵从理疗师建议（在许可范围内执行训练）\n\n- ✅客观记录客户身体变化和训练数据\n\n- ✅运用运动指导技巧（示范、反馈、激励）\n\n- ❌不得提供心理咨询或治疗\n\n- ❌不得设计矫形/康复方案\n\n- ❌不得提供按摩治疗\n\n- ❌不得开具处方或诊断\n\n- ❌不得制定个性化营养/膳食计划\n\n- ⚠️饮食紊乱/抑郁/焦虑客户 → 转介专业人士\n\n- ⚠️慢性疼痛客户 → 转介物理治疗师\n\n\n---"], [2, "总述", "本章核心讲的是：如何帮一个人告别久坐少动、不健康的旧生活方式，建立从开始运动到坚持运动的全新模式。一个人的改变，靠的是实实在在的具体行为。一名成功的私人教练，不光要会制定运动计划、教运动技巧，还要会指导客户完成健康行为的改变，并创造产生运动动机的条件。本章通过三大核心模块，把行为改变的方法、原理和坚持运动的关键系统梳理。"], [2, "行为理论模型概览", "这部分是帮客户改变行为的基础方法，主要包含三个核心模型：\n\n健康信念模型\n\n图2-1\n\n自我决定理论\n\n图2-2\n\n行为改变的跨理论模型，也叫TTM\n\n图2-3"], [2, "行为改变原理概览", "知道了方法模型，还要懂背后的道理，才能真正用起来，核心分为以下内容：\n\n1. 操作性条件反射\n\n人的行为出现，要么是被前因刺激产生的，也就是刺激控制法；要么是被事情的结果反馈影响，结果的好坏会决定人要不要继续做这个行为，这就是操作性条件反射的核心。\n\n图2-4\n\n2 认知与行为\n\n教练不光要了解客户对运动的看法，更要引导客户看清自己的想法：首先要帮客户找出自我责备、妄下结论这类非理性想法；其次要教客户正确设定目标，目标设定是最常用、最直接的行为改变方法，关键是要科学设定，避免立完目标就放弃。\n\n图2-5\n\n3. 自我监测\n\n自我监测是对目标相关的行为、情境和反应进行系统记录与观察。客户可以通过训练日志、步数、运动时间、主观用力程度或情绪反应等信息，了解自己的行为模式，并为后续目标调整提供依据。自我监测是自我调节的一部分，但不等同于单纯依靠自律。"], [2, "身体活动与坚持概览", "让人下定决心开始运动、刚开始尝试都很简单，最难的是长期坚持。书中把影响坚持运动计划的因素分为三大类，也可以理解为天时、地利、人和：\n\n1. 个人特质\n\n2. 环境因素\n\n3. 身体活动因素\n\n总结\n\n本章整体逻辑清晰易懂，先给出了客户行为改变的方法论（三大理论模型），再讲解了行为改变背后的科学原理（操作性条件反射、认知行为、自我监测），最后说明了影响客户坚持运动的关键因素。整体围绕\"让人产生行为改变、并长期坚持运动\"展开，以上为全章框架概览。\n\n第一部分："], [2, "1 行为理论模型", "一 总述\n\n本节讲解行为理论模型，首先要明确为什么会诞生这些行为理论模型，原ACE教材第61页给出了三个关键原因，也正是基于这些原因，私人教练不能只设计训练计划，更要帮客户养成终身运动的习惯，由此衍生出三大行为改变模型，以下先讲解健康信念模型和自我决定理论这两大核心模型，帮大家掌握指导客户行为改变的基本原理。"], [2, "一、行为理论模型的存在原因（3个关键要点）", "环境影响是健康行为改变的重大因素\n\n外界的身体环境、社会环境等，都是推动行为改变的重要因素，比如整个社会崇尚运动、自身身体感受到运动需求，都会促使人做出行为改变。\n\n行为改变是持续过程，而非单一过程\n\n短暂的改变没有任何意义，一个人想要真正变好，需要长期、持续地发生行为改变，而非一时兴起。\n\n人的行为意向和行为通常不统一\n\n行为意向与实际行动之间常存在差距。客户可能真诚地想要运动，却因为环境障碍、能力感不足、动机质量或计划不适配而未能持续行动。\n\n基于这些特点，私人教练的工作不应局限于设计单次训练。教练还需要帮助客户逐步建立稳定的身体活动习惯。下文首先介绍健康信念模型。"], [2, "1.1 健康信念模型", "模型核心定义\n\n人们对疾病预防、治疗的看法和潜在情绪，会直接影响自身的健康行为，也会决定是否改变不健康的行为，简单说就是：一个人对自身健康状况的认知，决定了他要不要运动、要不要保持现状。\n\n核心判断逻辑：两大核心变量\n\n健康信念模型认为，行为改变与个人对健康威胁的感知，以及对行动益处和障碍的判断有关。当个人感知到足够的易感性和严重性，并认为行动益处足以克服障碍时，采取行动的可能性通常会提高。\n\n● 变量一：健康威胁性\n\n这是改变的前提，分为两个维度：\n\n① 自觉罹患性：自己感觉患上疾病的可能性大小；\n\n② 自觉严重性：自己感觉疾病的严重程度（短期或长期）。\n\n当客户觉得自己有可能有健康问题、并感觉严重，感知到的健康受威胁越大。\n\n对潜在问题的健康筛查可能让客户意识到此前未意识到的问题，从而促进改变\n\n● 变量二：健康行为的益处与障碍\n\n光有健康威胁还不够，还要看客户对运动等健康行为的认知：\n\n① 自觉益处：认为采取运动、调整饮食等健康行为是有效的；\n\n② 自觉障碍：认为执行健康行为会遇到的困难，比如觉得改变饮食很痛苦、没时间运动。\n\n教练的核心作用"], [2, "1.1 健康信念模型（续）", "帮客户树立健康行为的信念与信心，放大健康行为的益处，降低客户对执行障碍的感知，推动客户主动做出改变。\n\n💡 威胁大 + 益处多 + 障碍少 = 改变自然来\n\n● 想象一个天平：左边是\"健康威胁感\"，右边是\"运动利弊\"。只有左边够重、右边够轻，天平才会倾斜，你才会行动。\n\n威胁是油门，益处是方向盘，障碍是刹车——三样配合好，车才能开走。\n\n过度夸大健康威胁（比如用极端案例吓唬客户），短期可能有效果，但容易引发焦虑抵抗，长期适得其反。"], [2, "1.2 自我决定理论", "人们通常只愿意做自己感兴趣、自身认同的事，不喜欢被他人强迫，除非自己主动寻求指导，这一理论核心围绕动机展开，分为自主动机和受控动机。\n\n图2-6\n\n两种核心动机（内在+外在）\n\n● 自主动机（内在动力）--“运动很有趣”：出于自身自由意愿，因为运动本身的体验、愉悦感去运动，单纯喜欢运动这件事，参与运动的目的更积极纯粹；\n\n● 受控动机（外在动力）--“运动很有用”：行为主要由外部要求、奖励、惩罚或内在压力驱动，个人感到自己“不得不做”。减重、健康或社交等目标本身并不必然属于受控动机；关键在于客户对目标的内化程度和自主体验。\n\n绝大多数人都是内在动机和外在动机混合存在，因此教练设计训练计划，既要让运动本身充满乐趣，也要让客户获得成就感，做到既有趣又有用，坚持的可能性才会更高。\n\n提升内在动力的三大核心需求\n\n内在动力在满足三个需求时会大幅提升，这里的能力指客户的自我感知能力，而非真实能力：\n\n● 能力感知——“我能行：客户自我感觉能成功完成训练任务，正面反馈会增强这种感知，负面反馈则会削弱；\n\n● 自主性---”我自己的选择“：客户感觉运动行为是自己决定的，遵循\"我觉得\"而非\"你觉得\"；"], [2, "1.2 自我决定理论（续）", "● 社群性（归属感）——”我们是一伙的“：在运动群体中找到归属感，不感到孤单。\n\n教练对应做法：给予正面反馈提升能力感知；和客户共同设计目标提升自主性；促进客户间建立友情提升社群性。\n\n图2-7\n\n运动中的动机氛围营造\n\n● 如果外部奖励让客户感到被控制，可能削弱自主动机；肯定进步、提供选择并帮助客户发现运动本身的意义和乐趣，更有利于动机内化。\n\n● 教练要营造任务相关氛围，而非自我相关氛围：任务相关氛围能让客户更有信心、有连接感；自我相关氛围易让客户陷入竞争、对环境陌生尴尬，降低坚持度。"], [2, "1.2 自我决定理论", "ACE教材68页实操方法：强调过程目标而非结果目标（比如一周去4次健身房，而非一个月减多少斤）；不把客户与他人比较；及时庆祝客户的成就，增进归属感\n\n关键社交策略：社会支持\n\n社会支持是提升运动坚持度的重要因素，核心是让客户\"不是一个人在战斗\"，具体做法包括：\n\n● 邀请客户的朋友、家人一同加入运动计划；\n\n● 让亲友提醒训练目标、预约训练；\n\n● 和朋友开展趣味良性竞赛；\n\n● 训练计划中加入社交元素，定期开展社交互动；\n\n●  开展小团体私教、成立运动俱乐部或团体活动。\n\n💡 内在动机三件套——：我能、我选、我归属\n\n● 想象你在玩一个游戏：\n\n● 我能（能力感知）：每一关都设计得刚好有点挑战但能过\n\n● 我选（自主性）：游戏规则是你和设计师一起定的\n\n● 我归属（社群性）：你和一帮志同道合的玩家在一起\n\n● 当能力感、自主性和归属感得到支持时，客户更可能形成质量较高的自主动机。\n\n自主动机体现为“我选择做”，受控动机体现为“我不得不做”。教练应通过支持自主性、能力感和归属感，促进动机内化。\n\n客户刚开始很有热情，两周后明显消退\n\n\"你要坚持啊！加油！\""], [2, "1.2 自我决定理论（续）", "1. 先排查：消退是因为能力感知受挫（太难了）？自主性被剥夺（感觉被教练逼着练）？还是缺乏社群支持（一个人练很无聊）？\n\n2. 针对能力感知：降低难度，增加成功体验，哪怕只是做一个深蹲也要肯定\n\n3. 针对自主性：问\"你想练什么？\"\"你觉得这个强度OK吗？\"把决定权还给客户\n\n4. 针对社群性：介绍他认识同期训练的学员，约着一起练\n\n过度依赖外在奖励（\"坚持一个月奖励你一节课\"），短期有效但会削弱内在动机。奖励要聚焦在体验感上，而非物质上。\n\n至此，两个模型的核心内容已经明确。HBM关注客户对健康威胁、行动益处与障碍的感知；SDT关注动机质量以及能力感、自主性和归属感的支持。"], [2, "1.2 自我决定理论", "健康信念模型主要解释客户如何判断健康威胁、行动益处与障碍；自我决定理论则强调动机质量以及自主性、能力感和归属感。健康风险认知可以促进行动意愿，但单纯依靠恐惧或压力通常不利于长期坚持。教练应将风险教育与自主支持结合起来。\n\n✍小节回顾与练习第一部分：行为理论模型（HBM + SDT）\n\n基本原理\n\n● HBM的关键变量包括感知易感性、感知严重性、感知益处和感知障碍。这些感知共同影响客户采取行动的可能性。\n\n● SDT 的核心是区分\"我要做\"（自主动机）和\"要我做\"（受控动机）：满足能力感知、自主性、社群性三大需求，才能将外在动机内化。\n\n● 两个模型的衔接：HBM 解决\"为什么变\"，SDT 解决\"怎么变才能持续\"——，即威胁促发改变，自主维持习惯。\n\n互动考题\n\nQ：一名客户知道自己血压偏高，也清楚运动能改善，但总觉得\"太忙了没时间运动\"。根据健康信念模型，该客户最需要干预的变量是：\n\n● HBM 两大变量：健康威胁性（自觉罹患性 + 自觉严重性）+ 健康行为益处与障碍（自觉益处 + 自觉障碍）\n\n● SDT 三需求：能力感知 + 自主性 + 社群性（归属感）"], [2, "1.2 自我决定理论（续）", "● 任务相关氛围 vs 自我相关氛围：前者提升信心与连接感，后者引发竞争与尴尬\n\n● 社会支持的五种做法：家人加入 / 亲友提醒 / 良性竞赛 / 社交元素 / 团体活动\n\n核心要义凝练\n\n行为改变不是一次性的情绪激励，而是个人在收益、障碍、能力和环境之间持续调整的过程。\n\n● 健康信念模型（HBM）：客户对健康威胁的感知，以及对行动益处和障碍的判断，会影响其采取健康行为的可能性。\n\n● 自我决定理论 (SDT)：区分自主动机（我想要）与受控动机（要我做）。核心在于满足能力感知、自主性与社群归属感。"], [2, "1.2 自我决定理论", "● 跨理论模型 (TTM)：行为改变是分阶段的阶梯。从\"没想法\"到\"规律运动6个月以上（维持阶段）\"，教练必须识别客户所处的特定位置，进行非线性干预。\n\n思考与练习\n\n● 思考题：一个客户因体检报告显示重度脂肪肝而走进健身房，但半个月后因工作繁忙想放弃。请结合HBM模型，分析其\"自觉严重性\"与\"自觉障碍\"的变化逻辑。\n\n● 选择题：根据SDT理论，以下哪项策略最能提升客户的内在动力？"], [2, "1.3 行为改变的跨理论模型", "行为改变的跨理论模型简称TTM，也叫改变阶段模型，无论是教练实际工作中还是考试，都是重中之重的核心考点。\n\n这个模型一共由四个核心部分组成：改变阶段（含5个细分阶段）、改变过程、自我效能、决策平衡。\n\n简单理解四者的定位：\n\n改变阶段是客户当下的现状；\n\n改变过程是客户从当前阶段进阶到下一阶段的方法；\n\n自我效能是客户对自己能做出健康改变的信念；\n\n决策平衡是客户衡量运动这件事的利弊，只有利大于弊，才会真正做出改变。"], [2, "一、改变阶段（TTM第一部分，5个核心阶段）", "改变阶段是判断客户当下运动状态的依据，可通过「想法+行动」两个维度区分，也是最容易记忆的方式：\n\n思考前阶段：没想法、没行动，完全没准备好进行运动\n\n思考阶段：有想法、没行动，考虑6个月内会多运动，但始终未开始\n\n准备阶段：有想法、不定期行动，会偶尔运动但没有常性，未形成规律\n\n行动阶段：有想法、有行动，规律运动时长小于6个月\n\n维持阶段：有想法、有行动，规律运动时长大于等于6个月\n\n表2-5\n\n| 思考前阶段\n\n| 无\n\n| 无行动，完全未准备好进行运动\n\n| 思考阶段\n\n| 有\n\n| 无行动，计划 6 个月内运动，但尚未开始\n\n| 准备阶段\n\n| 不定期行动，偶尔运动但无常性，未形成规律\n\n| 行动阶段\n\n| 有规律行动，规律运动时长＜6 个月\n\n| 维持阶段\n\n| 有规律行动，规律运动时长≥6 个月\n\n唯一没想法的只有思考前阶段；从思考阶段开始，客户对运动的益处都有意识，核心区别在行动的规律度和持续时长；只有维持阶段，运动才成为固定长期的习惯。"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）", "改变不是线性过程，很多人会在两个阶段间停摆好几年，教练不能急于求成；\n\n改变并非简单的线性过程。客户可能向前进展、停留，也可能退回早期阶段。教练应通过开放式提问和倾听识别客户当前阶段，再选择与其准备程度相匹配的干预策略。\n\n举例：不同阶段的进阶目标与干预方式：\n\n● 思考前阶段→思考阶段：核心目标是让客户认知运动的好处，建立运动想法\n\n● 准备阶段→行动阶段：核心目标是帮客户掌握持续运动的基本技能，扫除运动障碍\n\n● 行动阶段→维持阶段：核心目标是增加社会支持、提高自我效能，防止客户退训\n\n改变过程分为认知过程和行为过程：\n\n表2-6\n\n| 没意识到问题 / 低估问题，认为 \"我不需要运动\"\n\n| 唤醒改变意识，让学员开始考虑改变\n\n| 1. 用低压力沟通传递事实：\"很多和你同年龄、同久坐习惯的客户，3 个月规律运动后腰颈不适都有改善，你要不要了解下？\"<br/>2. 不推销课程，只提供 1-2 条低成本信息（比如办公室拉伸图、10 分钟居家动作），降低抵触<br/>3. 探索学员的个人价值（比如想陪孩子打球、想改善睡眠），关联运动的好处"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）（续）", "| 知道自己需要运动，但纠结利弊、怕麻烦，计划 \"6 个月内再说\"\n\n| 降低改变顾虑，强化改变动机\n\n| 1. 帮学员梳理 \"运动 vs 不运动\" 的具体利弊，比如 \"每周 3 次 30 分钟快走，和不运动比，1 年后心肺功能差多少？\"<br/>2. 提供超简单的行动选项，比如 \"先从每周 1 次、15 分钟散步开始，试试水？\"<br/>3. 用真实案例强化积极预期：\"之前有个客户和你一样，从每周 1 次开始，3 个月就爱上了运动\"\n\n| 有想法、偶尔运动，想尝试规律训练\n\n| 建立信心，制定可执行的第一步计划"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）", "| 1. 帮学员拆解目标：不喊 \"每周练 3 次\"，而是定 \"每周 2 次，每次 20 分钟，从自重深蹲 + 拉伸开始\"<br/>2. 识别障碍并解决：比如 \"你下班晚，那我们把训练时间定在周末上午 + 周三晚上，19 点开始？\"<br/>3. 帮学员建立支持系统：比如拉他进同节奏的训练群，或和朋友约好一起打卡\n\n| 规律运动＜6 个月，习惯未稳定，易反弹\n\n| 固化新习惯，应对倒退风险\n\n| 1. 用行为矫正策略：比如把训练日设成固定时间，训练前 1 小时发提醒，训练后立刻给正向反馈<br/>2. 帮学员建立 \"倒退预案\"：比如 \"这周加班没时间练，允许你只做 10 分钟拉伸，不算失败\"<br/>3. 建立自我监督：比如打卡表、训练日志，每周复盘 1 次，及时调整计划\n\n| 规律运动≥6 个月，有动力但怕厌倦\n\n| 巩固长期习惯，避免倦怠与反复"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）（续）", "| 1. 调整训练计划，加入趣味元素：比如把跑步换成骑行、徒步，或尝试新的动作组合<br/>2. 强化内在动机：引导学员关注 \"运动后精力变好、睡眠改善\" 等内在感受，而非只盯体重数字<br/>3. 帮学员建立 \"终身运动\" 的思维，比如教他如何根据工作、生活变化调整训练节奏\n\n技巧策略：每个阶段的下一阶段，是当前阶段的\"改变\"目标：即了解下一阶段的特点，就可以基本清楚本阶段改变过程的手段。\n\n改变过程又分为认知过程和行为过程，是推动阶段进阶的两大抓手：\n\n认知过程（思想层面改变）\n\n核心是扭转客户的认知，从思想上认可运动：包括改变自我认知、重燃运动动力、意识到自身行为能影响家人、树立健康运动的自我形象等。（注：「和志同道合的运动人群建立联系」对应「辅助性关系」，属于行为过程，已移至行为过程部分）\n\n行为过程（行动层面改变）"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）", "核心是用实际行动替换旧的不健康习惯：比如用户外散步、健康午餐替代周末喝酒放松；搭建社会支持体系，让家人监督监督；设置个性化奖励，达成目标后奖励自己等，具体方法如下：\n\n表2-7\n\n| 意识提高\n\n| 增加关于不健康行为原因、后果及补救措施的各类信息摄入。\n\n| 认知重组： 通过获取高质量证据（如流行病学数据），打破\"知识盲区\"，削弱对旧习惯的认知偏见。\n\n| 向客户讲解关于\"久坐行为与全因死亡率相关性\"的Meta分析文献。\n\n| 情感唤起\n\n| 对不健康行为带来的负面后果产生深刻的情感体验，并由决定改变带来的宽慰感驱动。\n\n| 情感驱动： 利用情绪（如恐惧或希望）作为行动催化剂，将抽象的健康风险具象化为个体的情绪波动。\n\n| 客户在体检报告中看到高血糖指标后产生的焦虑，通过建立训练计划将其转化为\"行动即缓解\"的动力。\n\n| 自我重新评价\n\n| 对自我形象进行认知和情感上的评估，衡量旧习惯与个人核心价值观之间的冲突。\n\n| 身份认同重塑： 评估\"不健康的自我\"与\"理想化的自我\"之间的差距，触发身份转变的内在动机。"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）（续）", "| 客户意识到\"目前的肥胖状态与我作为职业管理者的精明、自律形象不符\"，从而确立改变意志。\n\n| 环境重新评价\n\n| 评估个人行为对社会环境（尤其是人际关系）产生的正面或负面影响。\n\n| 社会责任感知： 将行为后果从个体扩展到系统，利用社会联结感增强改变的道德义务感。\n\n| 父亲意识到自己的吸烟或缺乏运动习惯正在给孩子传递负面的生活方式范式。\n\n| 自我解放\n\n| 相信自己具备改变的能力，并做出坚定的改变承诺（意志力）。\n\n| 自我效能与自主选择： 确认个体具备改变的代理权（Agency），通过公开承诺增加背弃成本。\n\n| 训练营学员在开营仪式上签署《健康行为契约》，并在社交平台公布为期12周的训练目标。\n\n| 辅助性关系"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）", "| 利用社会支持系统获取信任、关心和接纳，辅助行为坚持。\n\n| 外部杠杆效应： 构建防御性的社会网络，通过情感支持和技术指导降低维持新行为的认知负荷。\n\n| 建立\"1对1导师制\"或\"运动小组\"，利用教练的专业支持和同伴的归属感减少训练流失率。\n\n| 反向调节\n\n| 学习用健康的行为、思考方式来替代原有的不健康习惯。\n\n| 习惯替代： 基于经典条件反射理论，通过建立新的神经通路来竞争并覆盖旧有的条件反射。\n\n| 用周末和家人一起做饭露营替代外出饮酒聚餐。\n\n| 强化管理\n\n| 针对健康行为的进步给予正向奖励，或减少对不健康行为的强化。\n\n| 结果预期调节： 利用操作性条件反射原理，通过即时反馈机制（内源性或外源性）固化目标行为。\n\n| 达成月度减脂目标后奖励自己一套专业训练装备，或记录训练后的多巴胺分泌带来的心理愉悦感。\n\n| 刺激控制\n\n| 移除诱发旧习惯的提示物，并增加能触发新行为的视觉或环境提示。\n\n| 环境预设（Nudging）： 改变微观环境中的选择架构，降低做出正确决策所需的认知能量损耗。\n\n| 睡觉前将运动服放在床头；卸载手机内的外卖APP，将健身应用放在首屏醒目位置。"], [2, "二、改变过程：进阶到下一个阶段（TTM第二部分，阶段进阶的核心）（续）", "| 社会解放\n\n| 意识到社会规范和环境机会正在向支持健康行为的方向转变。\n\n| 社会常模同化： 利用宏观环境的变革（政策、文化）来降低个体改变的社会阻力。\n\n| 意识到公司健身房的建立或城市慢行步道的完善，利用这些公共设施让运动变得触手可及。"], [2, "自我效能（TTM第三部分，改变的核心信念）", "图2-8\n\n定义：自我效能就是一个人对自己能成功完成某项健康任务的信念，它和行为改变是双向影响的关系。自我效能决定是否参与运动，参与运动的经历又会反过来影响自我效能，二者互为因果。\n\n自我效能的6个来源（影响信念的关键因素，来源：ACE 6th Ed, p.78, Warner等, 2014; Bandura, 1997）：\n\n① 过往经验（既往运动经历，对自我效能影响最大）\n\n② 替代性经验（看到和自己相似的人成功运动，提升信心）\n\n③ 口头说服（业界大咖、专业人士的鼓励与引导）\n\n④ 生理评价（自身身体疲劳度、身体状态）\n\n⑤ 情感/情绪评价（运动时的情绪是积极还是焦虑沮丧）\n\n⑥ 想象经验（预想坚持运动后全新的自己，激发信念）\n\n教练的核心作用：优秀的教练不应注重在教学中展示自己的优秀，而应该聚焦挖掘客户潜能、提升客户的能力与信心，强化客户的自我主体意识和自我觉察。自我效能低的客户，容易选轻松任务、轻易放弃，因此提升自我效能是教练的核心工作之一。"], [2, "四、决策平衡（TTM第四部分，改变的利弊权衡）", "定义：客户决定是否运动，核心是权衡这件事的利与弊，利大于弊才会主动改变，且决策平衡是动态变化的过程。\n\n不同阶段的利弊认知：\n\n● 思考前、思考阶段客户：通常认为运动的弊大于利，所以迟迟不开始\n\n● 行动、维持阶段客户：普遍认为运动的利大于弊，所以能坚持\n\n教练的实操方法：\n\n① 用开放式提问、积极倾听，了解客户心中的运动自觉收益（好处）和自觉损失（坏处），不急于给答案、不嘲讽客户\n\n② 帮客户放大运动收益，同时最大程度降低自觉损失\n\n③ 结合短期+长期益处引导客户，既着眼当下改变，也放眼未来效果，避免只强调长期益处打击客户积极性（该技巧会在第四章动机性访谈中重点运用）\n\n表2-8\n\n| 1. _____\n\n| 2. _____\n\n| 3. _____\n\n| 4. _____\n\n| 最大程度增加获得收益的可能性的策略\n\n| 最大程度降低遭受自觉损失的可能性的策略\n\n| 与接受期望行为相关的自觉收益\n\n| 与接受期望行为相关的自觉损失\n\n| 1. 肩颈 / 腰背酸痛明显缓解，久坐后僵硬感减轻\n\n| 1. 每周需要安排 3 个固定时段，挤占部分休闲 / 刷手机时间"], [2, "四、决策平衡（TTM第四部分，改变的利弊权衡）（续）", "| 2. 体脂率下降，腰围减少 2-3cm，裤子更合身\n\n| 2. 初期训练后肌肉酸痛，影响次日上下楼 / 搬东西等日常活动\n\n| 3. 入睡时间缩短，夜间翻身减少，早上起床不疲惫\n\n| 3. 需要购买基础运动装备 / 私教课程，产生一定花费\n\n| 4. 下午犯困情况减少，工作 / 学习精力更集中\n\n| 4. 可能因加班 / 出差 / 聚会中断计划，产生 \"半途而废\" 的挫败感\n\n| 1. 每次训练固定安排 10 分钟肩颈 / 腰背针对性放松训练\n\n| 1. 优先选择早起 30 分钟或午休时段训练，不占用晚上休息时间\n\n| 2. 搭配每日 1500-1800ml 饮水 + 减少高糖零食，放大减脂效果"], [2, "四、决策平衡（TTM第四部分，改变的利弊权衡）", "| 2. 训练后安排 5 分钟泡沫轴放松 + 静态拉伸，缓解延迟性肌肉酸痛\n\n| 3. 每周日复盘睡眠质量，用手机睡眠 APP 记录，可视化改善效果\n\n| 3. 先从平价自重训练 / 团课入手，或利用居家无器械训练降低成本\n\n| 4. 训练日当天安排 1 次 10 分钟短休息 + 轻度活动，提升下午精力\n\n| 4. 制定 \"容错计划\"：每周允许 1 次临时调整，中断后次日恢复即可，不算失败\n\nTTM行为改变跨理论模型的四大要点环环相扣，是教练指导客户运动行为改变的核心逻辑：先通过5个改变阶段定位客户现状，再用认知+行为的改变过程帮客户稳步进阶，通过六大来源提升客户的自我效能信念，最后优化决策平衡让客户认可运动利大于弊，最终帮客户从无运动想法，一步步实现长期维持运动的目标\n\nTTM 四个部分是一条完整的诊断—干预链：改变阶段告诉你\"客户在哪里\"，改变过程告诉你\"怎么推他走\"，自我效能告诉你\"他信不信自己能走\"，决策平衡告诉你\"他觉得值不值走\"。四个部分缺一不可。只看阶段不看效能，可能推不动；只看效能不看决策平衡，客户觉得\"我能但我不值\"。教练的任务是四个维度同时评估、同步干预。"], [2, "四、决策平衡（TTM第四部分，改变的利弊权衡）（续）", "✍️小节回顾与练习第二部分：跨理论模型（TTM）\n\n● 改变阶段是诊断工具：用\"想法 + 行动\"两个维度定位客户当前位置，是所有干预的起点。\n\n● 阶段匹配：教练应先识别客户当前的改变阶段，再选择与其准备程度相匹配的干预策略，并对停留或倒退保持预期。\n\n● 自我效能是动力开关：过往经验是自我效能最强的来源，提升自我效能是教练的核心工作之一。\n\n● 决策平衡是变化的：思考前/思考阶段客户认为弊大于利，行动/维持阶段客户认为利大于弊。\n\nQ：一名客户已经每周运动 3 次、持续了 4 个月，但最近因出差中断了两周，担心自己\"前功尽弃\"。根据 TTM，该客户当前最可能处于哪个阶段？"], [2, "四、决策平衡（TTM第四部分，改变的利弊权衡）", "● TTM 五阶段：思考前（无想法无行动）→ 思考（有想法无行动，6 个月内）→ 准备（有想法不定期行动）→ 行动（规律 < 6 月）→ 维持（规律 ≥ 6 月）\n\n● 改变过程两大抓手：认知过程（思想层面改变）+ 行为过程（行动层面改变）\n\n● 自我效能 6 来源：过往经验（影响最大）/ 替代性经验 / 口头说服 / 生理评价 / 情感评价 / 想象经验\n\n● 决策平衡动态变化：思考前/思考阶段  弊 > 利；行动/维持阶段  利 > 弊\n\n● 改变通常是循环而非直线的；干预策略应与客户当前阶段相匹配"], [2, "2 行为改变的原理", "本部分核心讲解行为改变的底层原理，\n\n很多专业教练能长期坚持运动，很难理解从不运动到开始运动的客户面临的巨大困难与挑战，这也体现出前一章行为改变理论模型的重要性。运用这些理论模型的核心价值，是把运动当作一项复杂的健康行为养成过程，而非简单的动作训练，需要教练依托科学原理，持续为客户提供行为指导，逐步扶持客户完成行为改变。这部分原理主要分为操作性条件反射（含先行条件）、认知与行为（非理性想法、目标设定、自我监测）两大核心内容。"], [2, "2.1 操作性条件反射", "核心逻辑\n\n后果影响行为，一件事做完之后的结果，会直接决定一个人是否会再次做出这个行为，这是操作性条件反射的核心。\n\n图2-9\n\n四种核心类型\n\n表2-9\n\n| 强化类（行为再次发生概率提升）\n\n| 正强化\n\n| 行为后增加喜爱的正向刺激，促使行为重复\n\n| 客户坚持训练，教练及时给予肯定、鼓励\n\n| 负强化\n\n| 行为后消除厌恶的负面刺激，促使行为重复\n\n| 坚持运动后，身体不适、体检异常指标得到改善\n\n| 弱化类（行为再次发生概率降低）\n\n| 消退\n\n| 行为后不再提供期望的正向刺激，行为再次发生概率下降\n\n| 客户坚持到店训练，教练完全忽视该行为，从不表扬\n\n| 惩罚\n\n| 行为后施加厌恶的负面刺激，行为再次发生概率大幅降低\n\n| 客户正常到场训练，却因动作质量不佳或饮食管理未达到要求被批评、指责\n\n强化类（行为再次发生的概率提升）\n\n● 正强化：行为发生后，增加客户喜欢的正向刺激，让客户感到愉悦，行为会重复发生。"], [2, "2.1 操作性条件反射（续）", "● 负强化：\"负\"是减号的意思，并非负面，指行为发生后，消除了客户不喜欢的厌恶刺激，结果让客户满意，行为也会重复发生。比如坚持运动后，体检异常指标改善、身体脂肪减少，就是典型的负强化。\n\n弱化类（行为再次发生的概率降低）：\n\n● 消退：行为发生后，没有出现客户想要的正向刺激，行为发生概率降低。比如新客户坚持来健身房，教练却从未表扬，忽略\"到场运动\"这个核心行为，属于消退，会降低客户再来的意愿。\n\n● 惩罚：行为发生后，出现了客户不想要的厌恶刺激，行为发生概率大幅降低。比如客户坚持到场却被当众批评，就是惩罚+消退的双重负面效果。\n\n🤔思考题\n\n客户迟到、穿拖鞋和宽松衣物来健身房，\n\n作为教练的你将如何应对\n\n提示：应对方式方式会决定客户下次是否依旧如此；想要减少这类不当行为，可通过消退（去掉阳性刺激）或合理的\"惩罚\"（增加厌恶刺激）实现。"], [2, "2.1 操作性条件反射", "💡 强化让行为变多，弱化让行为变少\n\n● 强化 = 让行为重复\n\n● 正强化 = 加好东西（口头表扬、鼓励）\n\n● 负强化 = 减坏东西（解除痛苦、消除不适）\n\n● 弱化 = 让行为减少\n\n● 消退 = 不给好东西\n\n● 惩罚 = 加坏东西\n\n正向刺激是\"胡萝卜\"，厌恶刺激是\"大棒\"——。\n\n客户完成了一次训练，你想强化他的行为\n\n\"这次表现不错\"（太笼统）\n\n——：真正实践中有效的增加正向刺激和去掉厌恶刺激的手段\n\n即时反馈：训练结束当场肯定，而不是下次见面才说（正向刺激，正强化）\n\n具体化：\"你今天的深蹲控制比上周稳多了，核心收紧的感觉找到了\"（增加正向刺激，正强化）\n\n关联价值：把表现和客户的个人目标联系起来——。\"你坚持训练，上周说的腰背不适是不是缓解了？\"（去掉厌恶刺激，负强化）\n\n视觉化：记录进步（训练日志、体测数据、照片对比），让客户看到自己的改变（增加正向刺激，正强化）"], [2, "2.1 操作性条件反射（续）", "把\"自认为的严格\"和\"为他好\"用做了消退和惩罚。客户按时来上课，也努力在学习，你却对这些行为毫无反应（消退）只盯着他某个动作没做好，不断的批评（惩罚），这就是消退+惩罚的“王炸”——，会打击客户的到场意愿。\n\n先行条件（前因）与刺激控制\n\n先行条件是行为出现之前的刺激因素，也就是\"前因\"，前因诱发行为的方式被称为刺激控制，是行为矫正的重要工具。比如锻炼前设闹钟、写训练笔记、手机设屏保、车内放置运动服，这些前因都能有效触发客户的运动行为。\n\n操作性条件反射的核心启示是：教练要少用惩罚、多用强化。惩罚看似有效，但会产生两个问题：一是让客户把训练与负面体验绑定（消退 + 惩罚叠加），二是客户可能\"表面服从、实际逃避\"。好的教练永远优先用正强化（即时、具体、关联价值），只在涉及安全的底线问题上才用惩罚逻辑。这也是第一章\"消除风险 > 告知风险\"原则在行为层面的延伸。"], [2, "2.2 认知与行为", "一个人的行为（个体行为）会受自身看法直接影响，因此认知层面的引导是行为改变的关键，主要包含以下内容：\n\n取代非理性想法\n\n大多数人都存在不同程度的认知扭曲，比如极端思想（要么不做、要么做最好）、以偏概全（吃一块巧克力就彻底放纵）、责备他人（加班没管好饮食都怪老板）、固有偏见（女生天生力气小不用练力量）、忽视健康（高血压多年觉得无所谓）等，这些认知扭曲会阻碍客户建立健康的思维方式。\n\n教练不要直接指责客户认知扭曲（这不礼貌也不专业），而是通过开放式提问，和客户共同思考，引导客户自行意识到自身的非理性状态，逐步建立健康认知。\n\n表2-10\n\n| 极端化思维\n\n| 极端思想（非黑即白）\n\n| 把事情看成 \"要么完美、要么彻底失败\"，没有中间地带\n\n| \"我吃了一块饼干，节食就毁了，干脆把整包都吃了\"\n\n| 变形镜\n\n| 放大化（灾难化）/ 最小化\n\n| 要么把小事灾难化放大，要么把严重问题刻意淡化\n\n| \"不喝几杯酒，压力根本缓解不了\" / \"高血压没什么大不了，我没感觉\"\n\n| 片面化思维\n\n| 以偏概全\n\n| 用单次 / 局部事件，概括出 \"永远、总是\" 的绝对结论"], [2, "2.2 认知与行为（续）", "| \"从来没有好事发生在我身上\"\n\n| \"透视眼\"和\"千里眼\"\n\n| 妄下结论\n\n| 无依据地猜别人想法（读心），或武断预判坏结果（占卜）\n\n| \"我家人觉得我跑不完 5 公里\" / \"就算瘦了几斤，也一定会反弹\"\n\n| 标签化 /\n\n| 贴标签\n\n| 用一件事，给自己 / 他人贴永久性负面标签\n\n| \"我总忘带运动鞋，真是个白痴\"\n\n| 归因偏差\n\n| 自责 / 责备他人\n\n| 要么把所有错揽在自己身上，要么把问题全推给别人\n\n| \"都是我的错\" / \"老板催我工作，我压力大才抽烟，都是她的错\"\n\n极：极端思想（非黑即白）\n\n放：放大 / 灾难化 + 最小化\n\n偏：以偏概全"], [2, "2.2 认知与行为", "断：妄下断论（读心 + 占卜）\n\n标：贴标签\n\n责：自责/ 责备他人\n\n💡 认知扭曲六兄弟——：极、放、偏、断、标、责\n\n● 想象这六个认知扭曲是一个犯罪团伙：\n\n● 极端思想：要么最好，要么最差，没有中间地带\n\n● 放大/灾难化：把小事变大，或把大事缩小\n\n● 偏以概全：用一次失败否定全部\n\n● 断妄下结论：读心术（猜别人怎么想）和占卜术（预言坏事）\n\n● 标贴标签：给自己贴负面永久标签\n\n● 责责备他人：都是别人的错\n\n遇到\"全或无\"、\"永远/从不\"的句式，就要警惕可能是认知扭曲在作祟。\n\n客户说：\"我昨晚没忍住吃了一顿火锅，我这周的努力全白费了，我果然不适合健身。\"这属于哪种认知扭曲？\n\n拓展一下，遇到以上问题，作为教练的你将如何应对呢？\n\n直接反驳：\"一顿火锅不会长胖的\"\n\n不要否定情绪：先共情：\"能感觉到你对自己要求很高\"\n\n用提问引导：问\"一顿火锅真的等于全毁吗？你能帮我算算热量吗？\"\n\n重建认知：引导客户意识到这是\"极端思想\"：\"吃了一顿不代表整个计划失败，明天正常吃回来就好\"\n\n设定弹性规则：提前告诉客户\"允许自己每周有1次'欺骗餐'，这不算失控，而是人性\""], [2, "2.2 认知与行为（续）", "教练急于纠正客户的认知扭曲，结果变成说教，客户防御心理更强。记住：引导比纠正更有效。\n\n目标设定\n\n目标设定是目前应用最广泛、最直接的行为改变策略，但多数人设定目标后很快放弃，核心是方法错误。教练在目标设定中需遵循三个要点：\n\n● 目标必须由教练和客户共同制定，教练可提供制定目标所需的信息，但不能替代客户做决定\n\n● 目标遵循SMART原则（第四章详细讲解）；\n\n● 教练全程辅导客户完成目标设定，帮助其掌握制定有效目标的方法。\n\n💡 目标设定三步走——：共同定、SMART、持续陪\n\n● 共同定：目标不是你给客户拍脑袋定的，是你们一起商量的\n\n● SMART：具体、可测量、可达成、相关、有时限"], [2, "2.2 认知与行为", "● 持续陪：设定只是开始，辅导完成才是教练的价值\n\n目标不是定完就结束，定目标只是开始，陪客户完成才是本事。\n\n客户说\"我要减肥，三个月瘦20斤\"\n\n直接接受这个目标，开始制定计划\n\n63. 先问\"为什么\"：减肥是为了什么？找到更深层的动机（穿得下婚礼礼服/体检指标正常/陪孩子跑步不喘）\n\n64. 拆解成过程目标：定\"每周3次训练，每次50分钟\"。过程目标比结果目标更能坚持\n\n66. 设置检查点：每周复盘一次，根据进展调整\n\n67. 庆祝小胜：达成阶段性目标就庆祝，不等最后\n\n🥵 常见误区：目标太大、太远，客户看不到进步就放弃了。把大目标拆成小里程碑，让客户持续有成就感。\n\n自我监测\n\n自我监测属于自我调节的认知过程，反映一个人对自身想法、感受的评价，以及如何用这些信息影响目标和行为，通俗来说就是自律的核心部分，包含自我控制、抵制冲动行为，做出符合自身愿景与价值观的选择。\n\n行为改变靠的是科学方法。教练不要通过说教解决客户问题，而是用开放式问题辅助客户自我监测，让客户清晰自身进度、意识到潜在障碍，主动调整计划，提升自我认知。\n\n💡 自我监测三步骤——：记录、对比、调整"], [2, "2.2 认知与行为（续）", "● 记录：把训练、饮食、睡眠、体重等数据写下来\n\n● 对比：和上周、上个月对比，看看进步在哪里\n\n● 调整：根据数据调整下一阶段的计划\n\n没有记录的进步都是感觉，有记录的进步才是证据。\n\n客户说\"我感觉没什么进步\"\n\n\"你要坚持，时间会证明一切\"\n\n翻出记录：把客户之前的数据（训练日志、体测报告、训练视频）调出来\n\n量化进步：说\"你的深蹲重量从40公斤提到50公斤，这就是10公斤的进步\"\n\n引导自我监测：问\"你自己觉得，和刚来的时候比，有什么不一样？\"\n\n制造可视反馈：定期拍照、量围度、测体成分，让客户看到肉眼可见的改变\n\n教练替客户监测，而不让客户学会自己监测。"], [2, "2.2 认知与行为", "好的教练是让自己\"失业\"，让客户自己能管自己，建立自我主体性。\n\n看到这里，作为教练和准教练的你们或许会有疑问：那我岂不是要失业了？我们可以用心理学中的\"脚手架理论\"（Scaffolding Theory）来帮助你理解：随着学员能力的提升，脚手架必须主动拆除，否则就会阻碍主体性的发展。拆除脚手架不代表建筑工人的失业，而是意味着一座新建筑或者一个阶段的工程的落成，工人可以开始下一阶段和更多新的工程的开始，直至完成教练生涯更多的摩天大楼的建造。\n\n不要追求\"学员对我的依赖\"，要转换为追求“学员的自我成就感”乃至\"行业对我的专业口碑\"。当一个教练能不断让新手\"毕业\"并成为能够自我管理的高水平训练者时，他的专业声誉会带来更多的源头活水，根本无需担心失业。好的教练目标是让客户实现自我管理，而非持续依赖教练。客户能独立时，恰恰说明你的专业能力。\n\n行为改变原理的核心在两层：底层是操作性条件反射塑造行为，上层是认知干预纠正偏差。目标设定和自我监测是可操作的干预抓手。\n\n✍小节回顾与练习第三部分：行为改变的原理\n\n● 行为是被后果塑造的：强化让行为增多，弱化让行为减少。教练要少用惩罚、多用强化。"], [2, "2.2 认知与行为（续）", "● 认知扭曲是行为改变的隐形障碍：教练要引导而非指责，通过开放式提问让客户自行觉察。\n\n● 行为改变靠科学而非意志力：目标设定（共同制定 + SMART + 全程辅导）和自我监测（记录 → 对比 → 调整）是可操作的干预抓手。\n\n● 四种操作性条件反射：正强化（加好）/ 负强化（减坏）/ 消退（不给好）/ 惩罚（加坏）\n\n● 认知扭曲六类口诀：极（极端思想）/ 放（放大化 + 最小化）/ 偏（以偏概全）/ 断（妄下结论）/ 标（贴标签）/ 责（自责 / 责备他人）\n\n● 目标设定三要点：共同制定 + SMART 原则 + 全程辅导"], [2, "2.2 认知与行为", "● 自我监测 = 自律核心：自我控制 + 抵制冲动 + 做出符合愿景的选择\n\n● 刺激控制：用前因（闹钟/运动服/屏保）诱发运动行为"], [2, "行为改变的原理 (Principles)", "行为是被后果塑造的。该板块基于行为主义心理学的硬核逻辑，强调环境前因与反馈结果的调控。\n\n● 操作性条件反射：\n\n○ 强化：旨在增加行为概率（正强化加奖励，负强化撤厌恶）。\n\n○ 弱化：旨在降低行为概率（消退是撤奖励，惩罚是加厌恶）。\n\n● 认知干预：识别并重构\"非理性想法\"（如非黑即白的极端思想、以偏概全的归因偏差），利用刺激控制（前因管理）降低行为启动的认知损耗。\n\n● 思考题：客户坚持训练一个月后，发现长期的偏头痛消失了。从操作性条件反射角度看，这属于哪种机制？为什么这种机制比单纯的口头表扬更能促进长期依从性？"], [2, "3 身体活动与坚持", "我们要明白一个核心事实：让人开始运动很简单，让人长期坚持运动，才是最难的事。\n\n绝大多数客户，心里都清楚规律训练、坚持运动对身体有益，甚至很多人会反复尝试运动，但最终都无法长期坚持。\n\n所以，一名专业私人教练的核心能力，不只是会排训练动作、带客户完成单次训练，更要依靠沟通能力、行为改变知识、科学的计划设计能力，制定全面且适配的运动方案。\n\n既要让客户收获健康、身材变好，还要提升运动过程中的体验感、愉悦感与成就感。\n\n我们的工作重心，不能只放在「让客户开始运动」「关注初期训练积极性」，更要聚焦如何让客户长久坚持运动。\n\n决定一个人能否长期坚持运动，一共有三个关键因素：\n\n1. 个人特质（主观因素）\n\n2. 环境因素（客观因素）\n\n3. 身体活动因素（训练方案本身）"], [2, "3.1 个人特质", "指客户自身自带的个人特点，分为五大类：\n\n1. 人口统计变量\n\n图2-10\n\n包含年龄、受教育程度、收入情况等个人基础条件。\n\n研究表明：年龄和运动坚持度几乎没有关系；整体来看，男性运动坚持度普遍高于女性，但该规律不能套用在每一个个体身上。\n\n2. 健康状况\n\n患有慢性病、身体基础偏弱的人群，运动时长、运动坚持度，普遍低于身体健康的普通人群。\n\n3. 运动史（核心重点）\n\n运动史是影响个人特质当中最重要的变量。\n\n教练必须了解客户过往的运动经历、运动基础，同时掌握客户的运动喜好。贴合客户喜好去设计训练，才能大幅提升参与感和坚持度。\n\n4. 心理特质\n\n图2-11\n\n人的情绪、想法，会直接影响运动坚持度。\n\n压力越大、长期抑郁、易怒的人，运动坚持度越差；\n\n如果客户本身不喜欢当下的训练计划，也会主动放弃运动。\n\n因此，教练必须和客户共同制定训练方案，打造愉悦、可持续、贴合自身生活方式的训练模式，这就是非常关键的运动依从性。\n\n5. 认知、态度与信念\n\n每个人对运动的理解、看法、信念完全不同。\n\n自我健康认知差、缺乏健康信念的人，很难长期坚持运动；"], [2, "3.1 个人特质（续）", "如果客户只为‘减重’“变美”单一目标运动，一旦遇到减脂平台期，就会瞬间丧失动力、放弃训练。\n\n所以教练要引导客户建立长期健康思维，树立终身运动的认知，不局限于短期身材目标。\n\n口诀：个人特质三问：过去怎样？现在怎样？想要啥？\n\n● 过去：运动史是最强的预测因子\n\n● 现在：心理状态、认知态度\n\n● 将来：个人目标与动机\n\n一句话记牢：了解一个人过去怎么运动，比问他\"你想要什么\"更能预测他将来会不会坚持。\n\n新客户第一次见面，评估个人特质\n\n标准问诊流程：\n\n90. 运动史：\"你以前有运动习惯吗？做过什么运动？为什么停了？\"\n\n91. 健康状况：\"有没有慢性病、旧伤、体检异常？\""], [2, "3.1 个人特质", "92. 心理状态：\"最近压力大吗？睡眠怎么样？\"\n\n93. 动机来源：\"你为什么现在决定开始运动？\"\n\n94. 障碍预判：\"你觉得开始运动最大的困难是什么？\"\n\n只问目标，不问过去。很多人会说\"我要减肥\"，但如果你知道他过去尝试过3次都放弃了，你应该更关注\"是什么让你放弃了\"而不是\"这次你要减多少\"。"], [2, "3.2 环境因素", "可以通俗理解为：天时、地利、人和。\n\n1. 天时：时间因素\n\n「没有时间」是客户放弃运动、无法坚持的最常见原因。\n\n教练要结合客户的空余时间，灵活安排课程，适当设计短时高效的训练；同时和客户沟通，挖掘一天当中可利用的碎片运动时间。\n\n2. 地利：设施便利性\n\n运动场地、健身设施越方便到达，客户的运动坚持度就越高。\n\n3. 人和：社会支持\n\n家人、朋友的正向鼓励与陪伴，是坚持运动的重要助力。\n\n其中，伴侣、配偶的支持，是维持运动计划最可靠的因素；如果家人可以一起参与运动，坚持效果会大幅提升。\n\n若客户缺乏身边人的支持，教练需要主动为客户搭建运动社交、社群氛围，制造正向的社会支持网络。\n\n● 有时间：天时\n\n● 有地方：地利（设施便利）\n\n● 有人陪：人和（社会支持）\n\n再强的意志力也扛不住\"没时间、设施远、没人陪\"三连击。\n\n客户说\"最近太忙了，实在没时间运动\"\n\n\"你要挤时间！鲁迅说过时间像海绵里的水\"\n\n1.不要否定：客户确实可能很忙，先认可\n\n2.挖掘碎片时间：问\"你每天通勤多久？午休有多长？晚上孩子睡觉后你有时间吗？\"\n\n3. 降低门槛：说\"每天10分钟的训练要不要尝试一下？\""], [2, "3.2 环境因素（续）", "4. 改变环境：如果客户总说忙，帮他把运动环境搬到最近的地方。在家练比去健身房更容易坚持\n\n社会支持与承诺：可邀请客户与可信任的亲友共同约定训练时间或进度检查方式。这类安排应以支持和鼓励为主，避免羞辱性惩罚或过度施压。\n\n认为\"没时间\"是借口。实际上很多客户是真的忙。教练不应拆穿借口，要帮客户找到他真正能用的时间窗口。\n\n💡 社会支持三层次——：家人、朋友、团队\n\n● 核心层：家人/伴侣（最可靠的坚持因素）\n\n● 中间层：朋友、同事（陪伴和监督）\n\n● 外围层：教练、团队（专业支持和社群归属）\n\n一个人走得快，一群人走得远——。运动这件事，社交元素越多，坚持越久。"], [2, "3.2 环境因素", "客户说\"家人不支持我健身，说我浪费时间\"\n\n\"他们不懂，你坚持自己的\"\n\n86. 理解立场：先问\"他们担心的是什么？\"：可能是怕你受伤、花钱、没时间陪家人\n\n87. 关联家人利益：帮客户找到运动的\"家庭价值\"：\"你精力好了，陪孩子更有耐心；你体态好了，一家人拍照都好看\"\n\n88. 邀请参与：能不能带家人一起？哪怕只是周末散步\n\n89. 建立替代支持：如果家人真的不支持，帮客户在健身房或线上找到支持社群\n\n把家人当敌人。教练不应挑拨客户和家庭的关系，要帮客户找到运动和家庭利益的结合点。"], [2, "3.3 身体活动因素", "也就是我们给到客户的训练计划内容，核心包含两大关键点：\n\n1. 训练强度\n\n很多教练固有认知：新手只能做低强度训练。\n\n研究提示，部分参与者对间歇性较高强度训练的愉悦感和时间效率评价较高；近年来HYROX等高强度体能赛事的火热也反映了这一点，但这类反应存在明显个体差异，不能据此认为较高强度训练适合所有初学者。\n\n与中等强度持续训练相比，高强度间歇训练在某些研究中对心血管代谢和身体成分指标呈现相近或较好的效果。训练方式应依据健康筛查、体适能水平、偏好、恢复能力和风险进行选择，不应把任何单一强度模式视为通用方案。\n\n初期客户应依据筛查结果、当前能力和训练反应循序渐进。如适合加入较高强度间歇内容，应逐步调整工作时间、恢复时间和总训练量。\n\n2. 运动损伤\n\n运动损伤是可能中断训练、降低运动坚持度的重要因素。\n\n运动损伤会干扰正常训练，并可能降低运动坚持度。因此，计划设计应重视负荷管理、恢复和及时调整。\n\n因此训练计划必须遵循循序渐进原则，科学进阶、合理负荷，规避损伤风险。\n\n💡 训练刺激要与客户能力和目标匹配，同时通过循序渐进和恢复管理降低损伤风险。"], [2, "3.3 身体活动因素（续）", "● 强度要与客户目标、能力、偏好和恢复状态相匹配\n\n● 损伤防控：通过筛查、技术指导、负荷进阶和恢复管理维持训练连续性\n\n训练方案好不好，看客户愿不愿意明天还来。\n\n客户抱怨\"训练太累了，我坚持不下来\"\n\n\"坚持就是胜利！\"\n\n1. 区分疲劳和无聊：客户可能只是\"无聊\"。如果是无聊，换换训练形式\n\n2. 调整强度：训练强度过大，或客户无法恢复时，适当降低强度，增加恢复时间\n\n3. 增加变化：每周换一个训练主题（力量日、有氧日、灵活性日），让训练有新鲜感\n\n4. 设定小目标：每次训练要求\"完成今天的30分钟\"，不要求\"坚持一辈子\"\n\n5. 关注恢复：疲劳感太强可能是睡眠、营养没跟上，帮客户找原因而不是逼他继续"], [2, "3.3 身体活动因素", "将过度疲劳或强烈不适视为训练有效的证据。有效的计划应当安全、符合目标，并且能够长期执行。"], [2, "3.4 计划设计", "设计运动计划时，应将客户的个人特质、环境条件和对身体活动的反应综合起来。\n\n结合客户的个人特质、生活环境、空余时间、运动经验、消费顾虑、场地便利性、个人喜好等全部条件，设计安全、有效、适配的专属方案。\n\n✍️小节回顾与练习第四部分：身体活动与坚持\n\n● 运动坚持受多种因素共同影响，包括过往运动经历等个人特质、社会支持和设施可及性等环境条件，以及训练强度、体验和损伤风险等计划因素。\n\n● 年龄与坚持度无显著相关性，运动史是关键。了解客户\"过去怎么运动\"比\"现在想减多少\"更能预测未来。\n\n● 配偶 / 伴侣的支持是维持运动计划最可靠的因素，教练要善用而非对抗家庭关系。\n\nQ：在环境因素中，以下哪项被认为是维持运动计划最可靠、最强力的支持来源？\n\n● 个人特质五类：人口统计变量 / 健康状况 / 运动史（最重要）/ 心理特质 / 认知态度信念\n\n● 环境三要素：时间（天时）/ 设施便利性（地利）/ 社会支持（人和）\n\n● 训练方案两关键：训练强度 / 运动损伤防控\n\n● 运动史 = 个人特质中最重要的变量\n\n● 配偶支持 = 维持运动计划最可靠的因素"], [2, "3.4 计划设计（续）", "● HIIT与中等强度持续训练都可以作为计划选项；具体选择应依据筛查、能力、偏好、目标和恢复状态。\n\n坚持依赖的是系统性变量的优化。\n\n● 个人特质：运动史是预测未来坚持度的最强变量（过去练得好，未来更易坚持）；年龄与坚持度无显著相关性。\n\n● 环境因素：时间（没时间是最常见的理由），社会支持（尤其是配偶）和设施便利性。\n\n● 身体活动因素：强度、愉悦感、偏好、时间效率和损伤风险都会影响坚持。HIIT对部分客户可能具有吸引力，但不是通用选择。\n\n● 思考题：为什么\"只为了减重\"而来的客户，在遇到平台期时最容易退训？请从个人特质中的\"认知与态度\"维度进行分析。\n\n● 损伤风险管理是维持训练连续性的重要条件"], [2, "思考与练习", "以下题目来自本章末尾的即时自测，点击展开参考答案。\n\n结合本章三大板块分析：1）健康信念模型角度——客户可能感知到的健康威胁不够强烈（觉得\"不动也没事\"），或感知到的运动障碍（如懒惰、时间不够）超过了感知到的益处，导致行动意愿不足；2）自我决定理论角度——客户的动机可能是受控动机（\"别人让我动\"）而非自主动机（\"我选择动\"），缺乏内在驱动力，需要支持其自主性、能力感和归属感来促进动机内化；3）行为改变阶段角度——客户可能处于\"思考前阶段\"（还没意识到问题严重性）或\"思考阶段\"（知道需要但还没准备好行动），需要针对不同阶段采取相应干预策略。\n\n答案：B。根据自我决定理论，归属感是三大基本心理需求之一（能力感、自主性、归属感）。找一个志同道合的训练搭档，既满足了归属感需求，又能通过同伴支持增强自主动机，最有利于建立长期运动习惯。A选项是外在物质奖励，可能削弱内在动机；C选项虽有自我监控价值但缺乏社会支持维度；D选项可能削弱自主性。"], [2, "知识翻卡", "共 15 张知识卡片，点击翻转查看答案\n\n\n##### 行为改变教练操作清单\n\n\n- 评估客户处于变化模型的哪个阶段（前/中/行动/维持）\n\n- 使用动机性访谈（MI）激发内在动机\n\n- 帮助客户设定 SMART 目标\n\n- 建立行为契约（书面协议：做什么/何时/频率/时长）\n\n- 运用\"如果-那么\"计划（Implementation Intention）\n\n- 使用控制刺激法（移除不良线索，增加健康线索）\n\n- 帮助客户建立外部支持系统（团体/伙伴/社区）\n\n- 使用决策平衡表帮助客户看清利弊\n\n- 通过成功体验提升自我效能\n\n- 正确看待复发：视为学习机会而非失败\n\n\n---"], [3, "章节总述", "ACE教材第四章核心内容，聚焦私人教练与客户合作的四大关系阶段。学习本章内容，能够帮助教练清晰判定与客户当下所处的合作阶段，并依据阶段核心要求，完成对应工作内容，匹配专属沟通方式与服务逻辑。\n\n教练与客户的四大合作阶段依次为：建立默契、探讨、计划、行动。\n\n该相处逻辑适用于所有人际交往，如同日常交友、相亲、恋爱的相处规律。\n\n• 建立默契：合作初期，教练与客户初次相识的阶段；\n\n● 探讨阶段：制定训练计划之前，全面采集客户个人信息的阶段；\n\n● 计划阶段：正式开展训练前，定制专属运动方案的筹备阶段；\n\n● 行动阶段：训练方案落地执行，开展实操教学的阶段。（详见下表）\n\n四个阶段对于教练的沟通技能要求各有差异：\n\n1. 建立默契阶段：核心为理解与信任；\n\n2. 探讨阶段：核心为主动倾听，全面收集信息；\n\n3. 计划阶段：核心为双向合作，共同制定训练方案；\n\n4. 行动阶段：核心为教学技能，高效开展实操指导。\n\n且默契关系并非只存在于初期，会全程贯穿探讨、计划、行动三大后续阶段，是长期合作的基础。\n\n图3-2\n\n默契贯穿始终，探讨收集信息，计划共创方案，行动教学落地\n\n●"], [3, "章节总述（续）", "● 类比：四大阶段就像追对象的四个阶段：先是互相有好感（建立默契），然后深入了解对方（探讨），接着规划未来（计划），最后步入正轨（行动）\n\n默契是贯穿整个合作关系的\"氧气\"，需要持续供给\n\n向新学员介绍四大阶段\n\n• \"我们今天先填个表，然后我给你做个计划，之后开始训练\"\n\n• 冷漠地按流程走，不解释原因\n\n• \"我会先和你聊聊，了解你的想法和顾虑，然后我们一起制定适合你的训练方案，最后开始实际练习\"\n\n• 让客户了解整个合作流程，建立预期"], [3, "1 建立默契关系阶段", "关键字：贯穿教学关系始终的信任与理解"], [3, "一、默契关系核心定义", "默契关系，是私人教练主动与客户搭建起来的双向信任与理解，是一切训练合作的前提与根基。\n\n默契是根基，信任是桥梁，理解是钥匙\n\n类比：默契关系就像建筑的地基（看不见但最重要，决定了上层建筑能盖多高）\n\n没有默契，所有的专业技能都是空中楼阁\n\n初次与客户见面\n\n• 直接开始讲解专业知识、展示自己多厉害\n\n• 表现得像在完成销售任务\n\n• 先花5分钟聊聊客户为什么来、有什么顾虑\n\n• 表现出对客户的真诚兴趣"], [3, "二、建立默契的核心：同理心", "同理心区别于同情心，同理心是教练能够站在客户角度理解其想法、感受和经历，并以此调整沟通方式。\n\n教练永远无法百分之百体会客户的真实感受，但只要愿意站在客户视角共情，就能快速拉近关系，建立良好沟通基础。\n\n现实中，教练常常难以理解：为何客户无法坚持运动，连简单的基础动作都难以完成。可通过自我类比实现共情：每个人都有不擅长的领域，如同教练会因为\"坚持运动\"而难以理解学员的无法坚持，但是教练们可以回忆和假想一下自己学习英语，高等数学，所体验到的困难和难以长期坚持，面对老师觉得轻而易举自己却觉得难如天书的语法知识、微积分 方程式，理解困难、学习吃力的感受，或许更能理解普通会员在学习运动、掌握动作、克服身体短板时的难处与压力。\n\n同情站着看，同理蹲下来\n\n类比：同情心是\"我在岸上看溺水的人\"，同理心是\"我跳进水里感受水的温度\"\n\n同理心不是\"我理解你\"，而是\"我想象我在你的处境中\"\n\n客户抱怨动作太难想放弃\n\n• \"这动作很简单啊，你怎么学不会？\"\n\n• \"你不努力怎么会有效果？\"\n\n• \"我能理解这个动作确实有难度，让我回忆一下我当初学这个动作时的感受……\""], [3, "二、建立默契的核心：同理心（续）", "• \"我当初学高等数学时也是这种感觉，我懂你的挫折感。我们可以把它拆解成更小的步骤。\"\n\n• ⚠️把同理心当成同情心（居高临下的\"我理解你\"）\n\n• ⚠️过度共情，变成在说自己（\"我当年也是这样的\"）\n\n• ⚠️假装理解，实际在想着怎么给建议\n\n为何同理心如此困难？\n\n教练作为运动专家，在专业领域具有\"知识诅咒\"——我们的大脑已经自动化处理运动信息，而客户的大脑还在挣扎于最基础的动作。当教练说\"深蹲时重心在足中点\"，客户听到的是\"恐惧、关节脆响、怕练粗腿\"。我们难以跳出自己的视角去理解他人。\n\n教练的突破方法：\n\n1. 强制自己停顿3秒，用\"如果我是刚加完班、体能很差的人……\"来模拟客户视角"], [3, "二、建立默契的核心：同理心", "2. 主动确认：\"听起来你现在担心的是……对吗？\""], [3, "1.1 建立默契关系的核心要素", "图3-3\n\n##### 1.1.1 文化素养\n\n文化素养不等同于学历，其核心定义为：拥有与不同年龄、性别、种族、民族、体型、社会经济状况、教育背景、运动能力、身体素质的人群，建立信任、高效沟通的综合能力。\n\n多数人会本能倾向于和自身相似、观念契合的人交流，而专业私人教练，必须具备和各类差异化客户沟通相处的能力。\n\n注意：年龄最不影响坚持度\n\n● 实操要求：主动花时间了解客户的信仰、处事态度、价值观；\n\n● 核心禁忌：摒弃主观偏见与刻板印象；\n\n● 常见刻板偏见举例：默认老年人身体虚弱、肥胖人群懒惰、口音较重人群素养偏低、协调性差的学员学习能力弱、沟通方式不同的客户难以相处等；\n\n● 负面影响：一旦被刻板印象与主观预判束缚，便无法客观了解客户，难以制定合理训练方案，直接阻碍默契关系建立。\n\n文化素养不是学历，是与谁都能聊得来的能力\n\n● 类比：文化素养就像调味料（能让不同的\"食材\"变成美味的\"菜肴\"）\n\n能和你认为\"最难搞\"的客户打交道，才是真正的专业\n\n面对不同类型的客户\n\n• 对年长客户：\"您这个年纪，能动一动就很好了\"\n\n• 对肥胖客户：\"您就是吃太多动太少\""], [3, "1.1 建立默契关系的核心要素（续）", "• 对年轻客户：\"年轻人恢复快，可以加大强度\"\n\n• 了解每位客户的个人价值观和目标，而不是套用刻板印象\n\n• 主动询问：\"您对这次训练的期望是什么？有什么特别关心的吗？\"\n\n刻板印象自检清单：\n\n☐ \"年纪大的客户学不会新动作\"\n\n☐ \"胖客户都是因为懒\"\n\n☐ \"女性客户不需要练力量\"\n\n☐ \"年轻客户恢复快，可以加大强度\"\n\n☐ \"有运动基础的客户不需要详细讲解\"\n\n##### 1.1.2 第一印象\n\n第一印象是默契关系的开端，也是初次合作的关键契机。\n\n教练在初次接触客户时，展现出专业的职业素养、礼貌尊重的处事态度、清晰流畅的沟通能力，能够提升客户的舒适感与好感度，为长期合作奠定基础。"], [3, "1.1 建立默契关系的核心要素", "第一印象只有一次机会，错过了就是错过了\n\n● 类比：第一印象就像书的封面（决定别人有没有兴趣翻开内容）\n\n专业形象是信任的\"入门票\"\n\n第一印象检查清单：\n\n☐ 仪容仪表干净整洁\n\n☐ 准时到达约定的会面地点\n\n☐ 主动自我介绍，态度热情但不油腻\n\n☐ 眼神交流自然，避免飘忽或紧盯\n\n☐ 语速适中，避免太快显得急躁\n\n☐ 倾听时身体微微前倾，表现出专注\n\n##### 1.1.3 言语和非言语沟通\n\n沟通分为语言沟通与非语言沟通两大板块，在表达情绪、态度和建立关系时，非语言沟通会显著影响客户对教练的感受。\n\n● 语言沟通：仅指代语言文字本身的内容；\n\n● 非语言沟通：包含声音质量、眼神交流、面部表情、手势动作、身体姿态与位置。\n\n说什么不重要，怎么说才重要（在表达情感和态度时，非语言信号的影响力远超语言内容）\n\n● 类比：非语言沟通就像音乐的伴奏（歌词一样，伴奏不同，感觉完全不同）\n\n客户记住的是你说话时的样子，比你说了什么更关键\n\n（1）声音质量\n\n声音质量属于非语言沟通范畴，交谈时音量需适中，避免过高或过低；等流行不适配教练职业场景的发声习惯。"], [3, "1.1 建立默契关系的核心要素（续）", "教练可通过录音、录像、双人模拟对话的方式，反复练习，优化自身发声与表达状态。\n\n声音是教练的\"乐器\"，需要调校才能演奏出好听的曲子\n\n类比：教练的声音质量就像餐厅的背景音乐（太吵让人烦躁，太轻让人听不清）\n\n清晰、友善、稳定的音量是你的\"标准配置\"\n\n日常与客户沟通\n\n• 声音过高显得有攻击性，或过低显得没自信\n\n• 语速过快，客户跟不上你的节奏\n\n• 保持适中的音量，比正常对话稍大一点\n\n• 语速适中，给客户消化信息的时间\n\n• 练习方法：录下自己与客户的对话，回听并改进\n\n（2）眼神交流\n\n与客户沟通时，保持直视、温和友好，避免直勾勾紧盯对方；全程专心专注、心无旁骛，正视交流对象。"], [3, "1.1 建立默契关系的核心要素", "眼神是心灵的窗户，别把你的窗户关上了\n\n类比：眼神交流就像跳舞（需要你来我往，而不是一方盯着另一方）\n\n温和的注视=尊重+关注；直勾勾的盯视=压力+不适\n\n倾听客户表达时\n\n• 眼神飘忽，看向别处或看手机\n\n• 直勾勾盯着客户，让对方感到压力\n\n• 保持自然的眉眼微笑，温和注视\n\n• 偶尔点头，表示在认真倾听\n\n（3）面部表情\n\n保持真诚自然的面部状态，拒绝刻意假笑、假意礼貌。客户能够敏锐察觉虚假的态度，真诚是沟通的核心关键。\n\n假笑可以骗人三分钟，骗不了一辈子\n\n类比：面部表情是教练的\"情绪翻译器\"（翻译得真不真，客户感受得到）\n\n真诚的表情比完美的表演更有力量\n\n面对客户的不同情绪表达\n\n• 客户沮丧时，自己表情轻松\n\n• 客户兴奋时，自己面无表情\n\n• 让自己的表情与客户的情绪产生共鸣\n\n• 真诚地表达关心和支持\n\n（4）手势动作\n\n倾听客户表达时，双手保持相对静止，避免随意摆动肢体、摇晃身体、指指点点等失礼行为。\n\n手势太多=不自信，手势适当=有活力，完全没有=太僵硬\n\n类比：手势就像说话时的\"标点符号\"（适当停顿有力量，太多反而干扰理解）\n\n倾听时，双手静止；表达时，手势辅助"], [3, "1.1 建立默契关系的核心要素（续）", "与客户对话中\n\n• 双手乱动，显得紧张\n\n• 用手指点客户，显得有攻击性\n\n• 交叉双臂，显得有防备\n\n• 双手自然放松在身体两侧或放在桌上\n\n• 适度使用手势辅助表达\n\n• 倾听时保持双手相对静止\n\n（5）身体姿态\n\n杜绝含胸驼背，该姿态容易传递出疲惫、厌烦的负面情绪；避免双手叉腰、身体僵硬，易产生挑衅感与距离感。\n\n日常沟通保持开放、舒展的身体姿态，也可适度模仿客户的肢体姿态，营造轻松舒适的交流氛围。\n\n表3-4\n\n| 双臂交叉\n\n| 愤怒、反抗或无兴趣（除非客户的确觉得冷）\n\n| 脚尖指向门的方向、频繁看表\n\n| 感到无聊或急于离开\n\n| 咬嘴唇\n\n| 紧张或不安"], [3, "1.1 建立默契关系的核心要素", "| 把指关节弄响\n\n| 安慰性习惯动作\n\n| 使用屏障物（比如手提袋、背包或公文包）\n\n| 个人空间被侵犯\n\n身体是情绪的扩音器（驼背放大疲惫，舒展放大自信）\n\n类比：身体姿态就像你的\"个人品牌logo\"（站立姿势代表你的专业形象）\n\n开放舒展=欢迎靠近，封闭僵硬=请保持距离\n\n初次见面的站姿/坐姿\n\n• 含胸驼背，显得疲惫\n\n• 双手叉腰，显得有攻击性\n\n• 身体后仰，显得傲慢\n\n• 站立时双脚与肩同宽，重心稳定\n\n• 坐姿时背部挺直但不僵硬\n\n• 适度模仿客户的姿态（镜像效应），拉近距离\n\n##### 1.1.4 专业界限\n\n教练与客户之间必须保持清晰的边界感，维持纯粹的职业合作关系。\n\n● 关系禁忌与核心原则：若与客户发展为亲密好友、恋爱关系，会丧失教学客观性，无法开展标准化专业指导；若双方产生恋爱关系，需立即终止教学合作；尽责不私，人际关系越亲近，越难维持训练教学的秩序与专业性。\n\n● 私下沟通边界：尊重客户个人习惯，区分客户偏好，适配文字、语音、微信、邮件等不同沟通方式，全程保持职业分寸。\n\n专业界限就像\"球场边线\"（踩线一时爽，越位就麻烦）"], [3, "1.1 建立默契关系的核心要素（续）", "类比：教练和客户的关系就像医生和病人（太熟了就难\"下刀\"了）\n\n保持专业距离不是冷漠，是为了让教学更客观\n\n与客户发展出超出工作关系的感觉时\n\n• 假装没发现，继续正常教学\n\n• 觉得客户\"应该不会吧\"，回避处理\n\n• 如果感觉不对劲，及时与店长或主管沟通\n\n• 必要时转介绍给其他教练\n\n• 记住：恋爱关系必须立即终止合作\n\n日常边界检查：\n\n☐ 与客户的沟通保持职业化\n\n☐ 不在非工作时间频繁联系客户\n\n☐ 不在社交媒体上与客户过于亲密互动\n\n☐ 了解健身房关于师生关系的规定"], [3, "1.2 与难以合作的客户打交道", "图3-4\n\n##### 1. 困难客户核心成因\n\n沟通不顺畅、配合度低、抵触情绪强的困难客户，大多源于过往负面经历：曾有运动受伤史、糟糕的健身体验，因此对运动训练、私人教练存在固有偏见，初期信任度不足。\n\n困难客户不是\"难搞\"，而是\"有故事\"\n\n类比：困难客户就像受过伤的小动物（不是不想靠近你，是曾经被伤害过）\n\n客户的抵触背后，往往藏着恐惧和伤痛\n\n面对不配合的客户\n\n• \"你怎么这么不配合？\"\n\n• 表现出不耐烦或沮丧\n\n• 理解抵触背后可能有过去的负面经历\n\n• 保持耐心，给客户适应的时间\n\n• 用专业能力一点点建立信任\n\n##### 2. 核心应对原则\n\n全程保持同理心，持续输出专业能力，耐心接纳客户的抵触情绪。\n\n同理心+专业能力+耐心=困难客户的解药\n\n面对困难客户，你的气场决定客户的反应\n\n##### 3. 落地解决方法\n\n1. 精准提问引导：主动询问客户抵触的核心卡点、想要深入了解的内容；\n\n2. 挖掘核心诉求：探寻客户对运动的真实看法，了解其心中运动的阻碍、运动的优势与顾虑；\n\n3. 专业客观解答：依托专业知识，针对性解答客户的疑问与担忧；"], [3, "1.2 与难以合作的客户打交道（续）", "4. 强化客户信任：分享同类问题客户的成功改善案例，即替代经验；结合自身专业资质、从业背景，提升客户自我效能，逐步建立信任。\n\n问清楚→挖诉求→答专业→建信任\n\n类比：这四个步骤就像\"解锁手机\"（一步步输入密码，才能打开心门）\n\n没有建立信任之前，所有的专业建议都是空话\n\n客户表示\"我以前也请过私教，没什么用\"\n\n• \"那是那个教练不行，我不一样\"\n\n• 立刻开始证明自己的能力\n\n• \"能理解，您之前一定有不愉快的经历。能和我说说是什么问题吗？\"\n\n• 了解客户的过去经历，再针对性地展示你能提供的不同价值\n\n##### 4. 阶段禁忌"], [3, "1.2 与难以合作的客户打交道", "在默契建立阶段，严肃说教、强行纠正客户观念、争辩反驳都毫无意义。教练需放下偏见，以了解、倾听、接纳为核心，客观看待客户的所有想法与顾虑。\n\n建立默契阶段（少说多听，像个记者而不是老师）\n\n在这个阶段，你的首要任务是\"听\"，而不是\"教\"\n\n阶段禁忌清单：\n\n避免行为：\n\n• 严肃说教：\"你应该……\"\n\n• 强行纠正：\"你的想法不对……\"\n\n• 争辩反驳：\"不是这样的……\"\n\n• 急于给建议\n\n正确态度：\n\n• 了解 > 纠正\n\n• 倾听 > 说服\n\n• 接纳 > 评判\n\n• 引导 > 强迫"], [3, "✍️小节回顾 | 第一阶段：建立默契关系", "##### 基本原理\n\n\n建立默契是整个合作关系的前提。教练需运用同理心理解客户，以专业形象赢得信任，以真诚态度建立连接。注意警惕刻板印象、保持专业界限、耐心应对困难客户。\n\n\n##### 互动考题\n\n\nQ：一位客户说\"我之前请的私教总是推销课程，我不太相信你们了\"，你应该怎么回应？\n\n参考答案：\n\n• 首先共情：\"我能理解您的顾虑，被推销的感觉确实不舒服\"\n\n• 然后了解：\"能告诉我之前是什么情况吗？\"\n\n• 最后展示不同：\"我在这里会专注帮您解决问题，而不是推销课程\"\n\n\n##### 记忆小本\n\n\n表3-5\n\n| 核心\n\n| 同理心\n\n| 设身处地，不是居高临下\n\n| 素养\n\n| 文化素养\n\n| 能与任何人建立信任\n\n| 形象\n\n| 第一印象\n\n| 专业、礼貌、清晰\n\n| 沟通\n\n| 非语言\n\n| 在情感态度传递场景中，非语言信号影响显著\n\n| 界限\n\n| 专业边界\n\n| 恋爱关系立即终止"], [3, "2 探讨阶段", "关键字\"听\""], [3, "本板块主题：探讨阶段", "探讨阶段的定义：这是私人教练与客户初步接触后，收集客户隐私信息（医疗、健康、运动史等）、了解客户内心见解、建立深入默契关系的基石阶段。\n\n重点内容：\n\n1. 听什么：收集信息\n\n2. 怎么听：积极倾听技巧\n\n3. 怎么交谈：动机式访谈 (Motivational Interviewing, MI) 的要素与技巧\n\n4. 困难时刻如何交谈：会员交谈中透露出个人困境时的交谈技巧\n\n唯有让客户建立安全感，主动提供有效信息，才能为后续个性化训练计划制定，提供极大支撑与便利。\n\n探讨阶段的核心在于\"听\"\n\n● 类比：探讨阶段就像医生问诊（问得越清楚，诊断越准确）\n\n在这个阶段，教练的嘴要\"懒\"，耳朵要\"勤\""], [3, "2.1 收集信息", "明确倾听的核心内容，由教练指导客户填写生活方式与健康史问卷，全方位梳理客户信息。\n\n图3-5\n\n图3-6\n\n图3-7"], [3, "通过结合表格我们需要了解如下信息", "##### 1. 当下现状\n\n了解客户目前的健康状态、体能水平；个人运动喜好与排斥项，以及选择运动、抗拒运动的底层原因。\n\n了解现状是\"拍照\"，拍下客户现在的样子\n\n不知道客户现在在哪，怎么带他去想去的地方？\n\n##### 2. 过往经历\n\n梳理客户过往运动史，区分能够助力长期坚持运动的正向因素，以及阻碍运动执行的负面因素，过往运动计划中可坚持或失败的原因；明确有效执行部分与失效问题所在\n\n了解过去是\"查地图\"，看客户走过哪些路、哪些路上有坑\n\n重复过去的成功，避免过去的失败\n\n##### 3. 运动好恶\n\n掌握客户运动习惯偏好，如晨间运动或晚间运动、独自训练或结伴训练以此深度理解客户个体特质。\n\n了解好恶是\"配钥匙\"，找到打开客户心门的正确钥匙\n\n让客户做喜欢的事，更容易坚持\n\n收集信息时的提问技巧\n\n• \"你平时运动吗？\"（简单的是非问，无法获取深度信息）\n\n• \"你有没有病史？\"（冰冷的问法，让客户有压力）\n\n• 开放式问题：\"你能和我聊聊你对运动的看法吗？\"\n\n• 先建立安全感：\"我问你这些问题，是为了更好地帮助你，这些信息我们会保密的\""], [3, "通过结合表格我们需要了解如下信息（续）", "• 追问细节：\"你提到之前尝试过运动，能说说那次经历吗？是什么让你停止的？\""], [3, "2.2 积极倾听", "积极倾听是教练必备核心能力，贯穿客户沟通全流程。\n\n##### 1. 基础环境要求\n\n沟通环境保持安静、私密，营造舒适的交流氛围。\n\n##### 2. 核心心态要求\n\n全程保持同理心，换位思考，深入了解客户全貌，为后续给出合理有效建议打下基础。\n\n##### 3. 行业普遍短板\n\n多数私人教练未接受过系统沟通训练，普遍存在表达欲过强、随意打断客户表述的问题。而积极倾听，需要高度专注力与专业沟通技巧。\n\n积极倾听 = 全神贯注 + 不打断 + 记重点\n\n● 类比：积极倾听就像\"调频\"（调到客户的频道，才能接收到他的信号）\n\n听是为了理解，不是为了准备回应\n\n客户在说话时\n\n• 客户还没说完就插嘴：\"你说的我懂……\"\n\n• 眼神飘忽，在想下一句怎么回\n\n• 假装在听，实际上在刷手机\n\n• 保持眼神接触，微微点头\n\n• 记录关键信息（不是用手机，是用脑子或笔记本）\n\n• 等客户说完再回应\n\n• 安静，真诚，避免\"爹\"味\n\n##### 4. 积极倾听行为准则\n\n切勿假装倾听，刻意敷衍会被客户察觉，既会遗漏关键信息，也会降低客户信任；不要提前构思回话内容，更不要思绪游离、精神涣散。"], [3, "2.2 积极倾听（续）", "我们要将自己定位为专业的信息收集者，围绕前文梳理的倾听核心内容，主动引导客户表达，系统梳理、整合有效信息。\n\n假装倾听三秒钟，客户能感受十分钟\n\n真诚是最好的倾听技巧\n\n积极倾听检查清单：\n\n☐ 手机静音或放在一边\n\n☐ 身体面向客户，微微前倾\n\n☐ 不打断客户\n\n☐ 用点头、\"嗯\"等反馈表示在听\n\n☐ 客户说完后，复述确认关键信息\n\n☐ 不提前构思回话"], [3, "2.3 动机式访谈", "日常沟通中，常有一类客户：因家人、医生催促被动运动，自身运动意愿薄弱，对于是否开启训练充满矛盾。即便清楚运动的各项益处，依旧难以付诸行动。\n\n面对此类人群，不能强硬催促、单向说服，这时就需要用到动机式访谈。\n\n动机式访谈最初专为成瘾行为矫正、心理干预场景设计，适用于人们面临高难度、高挑战的行为改变场景，完全适配健身教练的工作场景，且与行为改变模型TTM中思考阶段高度契合。\n\n动机式访谈 = 引导，不是说服\n\n● 类比：动机式访谈就像“点燃火种”，帮助客户发现自身改变动力。\n\n让人改变的永远是他自己的动机，而非外部的道理\n\n面对犹豫不决的客户\n\n• \"你应该运动，对身体好\"\n\n• \"你看你这体重，不运动怎么行\"\n\n• \"我这是为你好，你怎么不听\"\n\n• \"运动对你来说意味着什么？\"\n\n• \"你身边有没有通过运动改变很大的人？\"\n\n• \"如果有一天你开始运动了，你希望自己的生活有什么不同？\""], [3, "（一）动机式访谈核心逻辑", "传统沟通模式中，教练如同手握方向盘，直接告知客户该做什么、怎么做，属于指令式沟通；但真正能长久践行的选择，往往是自我主观决定的结果。他人强行要求的事，很难长期坚持；\n\n动机式访谈为引导式沟通，不直接灌输结论、下达指令，依托默契的信任关系，通过鼓励、支持与正向协助，循序渐进引导客户自主思考。\n\n我们可以思考：动机式访谈的核心理念：对抗式沟通、强硬说教、道德绑架、专制灌输，大多毫无作用。健身教练普遍缺乏该板块专业学习，也是日常客户沟通中普遍缺失的关键能力。\n\n指令式 = 推车，推一下动一下；引导式 = 铺路，让客户自己跑起来\n\n强推无效，引导才有效\n\n无效预警：别成为你最讨厌的人\n\n禁用方式：\n\n• 对抗式沟通：\"你不运动就会怎样怎样\"\n\n• 强硬说教：\"你应该/必须/不得不\"\n\n• 道德绑架：\"你都花了钱，不练对不起谁\"\n\n• 专制灌输：\"听我的没错\"\n\n正确方式：\n\n• 提问引导\n\n• 协作解决\n\n• 肯定支持"], [3, "（二）动机式访谈核心框架", "##### 1. 四项核心精神：合作、接纳、关怀与唤出\n\n● 协作：教练与客户是双向共舞的合作关系。客户是训练计划的最终执行者，必须全程参与方案制定与沟通。一旦客户丧失主体意识，完全依赖教练，不仅沟通效率低下，教学推进也会举步维艰。\n\n● 接纳：教练保持同理心与尊重，承认客户的个体差异和自主选择，不以自己的价值观评判或强迫客户。\n\n● 关怀（compassion）：以客户的福祉为出发点，理解其处境和困难，避免把教练本人的价值观强加给客户。这里的compassion强调积极关怀，不等同于居高临下的怜悯。\n\n● 唤出：引导客户自主说出改变的想法与诉求，而非直接告知答案、强行灌输理念。过度指点与说教，只会引发抵触心理。\n\n图3-8\n\n合作是共同工作，接纳是尊重自主选择，关怀是以客户福祉为先，唤出是引导客户说出自己的改变理由。\n\n● 类比：四大要素就像\"四轮驱动\"（四个轮子一起转，车才能跑起来）\n\n动机式访谈以合作、接纳、关怀和唤出为基础，通过沟通帮助客户明确自己的改变理由与方向。\n\n四大要素自检：\n\n协作检查：\n\n☐ 我是在问问题让客户思考，不是在给答案\n\n☐ 客户有参与对话，不是只听我说"], [3, "（二）动机式访谈核心框架（续）", "认同检查：\n\n☐ 我尊重客户的价值观和选择\n\n☐ 我没有评判客户的犹豫\n\n同情检查：\n\n☐ 我站在客户的角度思考\n\n☐ 我没有把自己的想法强加给客户\n\n唤出检查：\n\n☐ 改变的想法来自客户自己\n\n☐ 我没有直接告诉客户应该怎么做\n\n##### 2. 四大核心技巧：OARS\n\n即开放式问题(Open questions)、肯定认可(Affirmations)、印证式倾听(Reflections)、内容总结(Summaries)。\n\n● 开放式问题：不设置简单是非类问答，提问需要引导客户输出详细内容，从中挖掘高价值信息。\n\n开放式问题 = 问答题，封闭式问题 = 是非题"], [3, "（二）动机式访谈核心框架", "● 类比：开放式问题是\"打开的门\"，封闭式问题是\"关上的门\"\n\n多问\"什么\"和\"怎么\"，少问\"是不是\"\n\n开放式 vs 封闭式对比：\n\n封闭式（避免）：\n\n• \"你今天感觉怎么样？\"（是/否回答）\n\n• \"你有运动习惯吗？\"（是/否回答）\n\n• \"你确定要开始训练吗？\"（是/否回答）\n\n开放式（推荐）：\n\n• \"你今天感觉怎么样？能和我多说说吗？\"\n\n• \"你能告诉我你之前尝试运动时的经历吗？\"\n\n• \"对于开始训练，你心里在想什么？\"\n\n● 肯定认可：关注客户行为的积极面，给予正向肯定。摒弃\"打着为你好\"的打压式沟通，避免负面否定，保护客户自我认同感。\n\n肯定认可 = 给客户\"加油\"，不是\"泼冷水\"\n\n客户需要被鼓励，不被否定\n\n客户分享了尝试运动但失败的经历\n\n错误回应：\n\n• \"那你为什么没坚持下来？\"\n\n• \"失败了你还想再试？\"\n\n正确回应：\n\n• \"我注意到你之前有尝试过，这说明你有想要改变的心\"\n\n• \"你已经迈出了第一步，这需要勇气\"\n\n● 印证式倾听：单一连续提问会形成审讯感，容易引发反感。提问后，及时复述、梳理、确认客户的表述内容，让客户感受到被理解、被尊重。"], [3, "（二）动机式访谈核心框架（续）", "印证式倾听 = \"我听到了+我理解了\"\n\n● 类比：印证式倾听就像\"回声\"（你说，我重复确认）\n\n复述让客户感到\"你真的在听\"\n\n印证式倾听话术示例：\n\n客户说：\"我之前请过私教，但感觉他总是很忙，每次课都匆匆忙忙的，我问的问题也没时间回答……\"\n\n印证回应：\"听起来，你之前有过一次不太愉快的私教体验（教练太忙，没有给你足够的关注和解答。这让你对教练有了更高的期待，也更谨慎了）。对吗？\"\n\n● 内容总结：沟通尾声，整合多段印证内容，对整场对话信息进行归纳梳理，统一核心共识。\n\n总结 = 收尾 + 确认 + 共识\n\n好的总结让客户感觉\"被理解了\"\n\n总结话术示例："], [3, "（二）动机式访谈核心框架", "\"让我们来梳理一下今天聊的内容：你之前有过不愉快的私教经历，所以现在更看重教练的关注度；你希望在减重的同时，不影响日常工作；你每天早上有时间运动，但担心强度太大。坚持方面你之前失败过，主要是因为目标太激进。我们今天的发现，对你接下来制定计划会有帮助。\"\n\n图3-9\n\n图3-10"], [3, "（三）动机式访谈执行步骤", "第一步，建立默契与信任关系；\n\n第二步，逐步引导客户锁定一个或多个改变目标；\n\n第三步，深度诱发动机，激发客户自主改变的内在意愿，引导客户主动表达改变需求；\n\n第四步，结合诉求，共同制定专属执行计划。\n\nMI四步 = 建信任→定目标→诱动机→定计划\n\n动机源于客户自身，教练的作用是唤出"], [3, "（四）访谈核心价值与教练认知", "动机式访谈是教练的高阶必备技能，能够让客户获得尊重感。很多教练习惯直接输出专业知识、给出训练建议，看似高效，实则欲速则不达。\n\n单纯分享专业知识，是沟通中的\"偷懒行为\"。合格的教练，需要刻意克制自我表达欲与分享欲，耐心引导会员自主表达诉求、梳理想法，帮助客户重塑主体意识，这也是推动客户长期坚持改变的关键。因此，教练需主动深耕学习沟通技巧。\n\n给答案 = 偷懒，引导思考 = 专业\n\n最省事的教练，是最无效的教练"], [3, "2.4 对难以处理的披露的回应", "沟通中可能出现伤病、人生变故、情绪困扰或其他难以处理的披露。教练应在同理回应的同时判断信息是否涉及即时安全、医疗或心理健康风险，并按执业范围采取相应措施。\n\n##### 1. 同理回应：专注倾听，反映客户的感受和重点，不以好奇心追问无关细节。若涉及即时危险、自伤他伤风险或需要专业评估的问题，应优先采取安全措施并转介。\n\n##### 2. 确认下一步：在客户愿意且安全风险已得到妥善处理的前提下，再将沟通平稳带回运动目标。超出教练执业范围的问题应由合资格专业人员接手。\n\n补充转介原则：若客户存在严重基础疾病、重大医学隐患、重度情绪问题、饮食失调、抑郁症等特殊情况，教练不可擅自干预，需及时做好专业转介，规避风险。\n\n负面信息处理 = 共情+简短+转话题+必要时转介\n\n教练是健身专家，不是心理医生\n\n负面信息应对话术：\n\n客户说：\"我最近离婚了，真的没心情运动……\"\n\n• \"那更要运动啊，运动能改善心情！\"\n\n• \"我理解你，我也有这种情况……\"（变成在说你自己）\n\n• \"那你今天先休息吧\"（过度照顾，放任客户逃避）"], [3, "2.4 对难以处理的披露的回应（续）", "• \"我能理解这种感受一定很不容易……（共情停顿）如果你愿意的话，我们可以先从很轻松的内容开始，不用给自己太大压力。你觉得呢？\"\n\n为何动机式访谈对教练如此困难？\n\n教练具备专业知识，因此很容易直接给出答案。然而，单向说教可能引发抵触，也不利于客户建立自主动机。动机式访谈强调唤出客户自身的改变语句，再在获得允许后提供相关信息或建议。\n\n1. 刻意练习\"闭嘴\"：问完问题后，忍住不给建议\n\n2. 把\"给建议\"改成\"问问题\"\n\n3. 记住：客户的改变动机，是他自己的，不是你给的"], [3, "✍️小节回顾 | 第二阶段：探讨阶段", "探讨阶段的核心是\"听\"和\"引导\"。教练通过积极倾听收集信息，通过动机式访谈引导客户自主思考和表达。改变的动力来自客户内心，教练负责激发而非推动。\n\nQ：一位客户说\"我知道运动好，但是我就是懒得动\"，请使用动机式访谈技巧设计一段沟通。\n\n• 开放式问题：\"你能和我说说'懒得动'具体是什么感觉吗？\"\n\n• 肯定：\"我注意到你其实知道运动好，这说明你对健康是有关注的\"\n\n• 印证倾听：\"听起来，你不是不想运动，而是找不到动力，对吗？\"\n\n• 唤出：\"如果有一天你开始想动了，你希望生活会有什么不同？\"\n\n表3-6\n\n| 积极倾听\n\n| 专注+不打断\n\n| 假装倾听会被识破\n\n| 动机式访谈\n\n| 引导+协作\n\n| 动机源于客户自身，教练负责唤出\n\n| OARS\n\n| 问+肯+听+总\n\n| 开放式、肯定、印证、总结\n\n| MI四要素\n\n| 协作、认同、同情、唤出\n\n| 四轮驱动缺一不可\n\n| 负面信息\n\n| 共情+转话题\n\n| 教练不是心理医生"], [3, "3 计划阶段", "完成信息采集后，正式进入计划阶段，此时客户即将准备开启训练。\n\n本阶段核心为双向合作，教练不可单方面制定训练方案，需与客户充分沟通、协同配合，结合客户的身体基础、目标诉求、接受程度，共同定制个性化、可落地、适配性强的运动训练计划，保障计划的合理性与执行性。\n\n计划阶段是承上启下的关键阶段，衔接前期沟通准备与后期正式行动。在这一阶段，教练可发挥更积极的作用，但积极性需建立在持续倾听、主动获取客户意见、与客户共同设计计划的基础上。核心要求是，计划需由教练与客户协同完成，以此提升客户的计划坚持度，为后续行动落地奠定基础。\n\n计划阶段 = 双向共舞，不是独角戏\n\n● 类比：计划就像婚礼策划（新郎新娘一起定，不能只有一方说了算）\n\n客户参与制定的计划，才是客户愿意执行的计划"], [3, "计划阶段的核心步骤", "计划阶段主要包含四个核心步骤，依次为：设定目标、讨论备选方案、制定计划、评估计划。各步骤环环相扣，需结合客户实际情况灵活推进。\n\n图3-11"], [3, "3.1 设定目标", "设定目标是行为改变的核心过程，也是所有计划的核心组成部分，直接影响客户的行动动力与坚持度。设定目标需遵循以下五个核心要点：\n\n1. 避免目标过多，聚焦核心目标，避免多目标分散精力，影响执行效果；\n\n2. 避免设定负向目标，以正向引导为主，引导客户树立积极的行动导向；\n\n3. 短期目标与长期目标相结合，让客户在每次锻炼中都能实现短期小目标，积累成功体验，逐步向长期目标推进；\n\n4. 引导客户主动参与目标设定，充分尊重客户意愿，最大化实现理想效果；\n\n5. 定期重审目标，这是提升客户坚持度的关键，目标需根据客户实际情况动态调整，确保其合理性与可行性。\n\n目标设定五要点：不多、不丧、长短合、双方定、定期审\n\n好目标是灯塔，照亮方向；坏目标是枷锁，压垮动力\n\n帮助客户设定目标\n\n• \"你的目标是什么？减重？好，那就每天跑步1小时\"\n\n• 设定的目标太多，一次性全压给客户\n\n• 问清楚背后的原因：\"减重是为了什么？是为了健康，还是为了穿衣服好看？\"\n\n• 一次聚焦1-2个核心目标\n\n• 设定正向目标：\"每周完成3次30分钟的中等强度运动\"而不是\"不要偷懒\"\n\n##### 目标设定理论"], [3, "3.1 设定目标（续）", "一个有效的目标能带来好的4个正向结果\n\n心理学家Advanelok与Gary Lanthom的研究表明，有效的目标设定通过四个核心机制提高个体的行为，这为教练开展目标设定工作提供了理论支撑：\n\n1. 引导注意力：目标能让个体在特定时期聚焦核心任务，并预留固定时间用于与训练相关的活动，避免精力分散；\n\n2. 激发动力：具有适度挑战性的目标，短期内可有效激发个体的努力程度，提升行动积极性；\n\n3. 提升坚持度：明确的目标能让个体在追求目标的过程中保持更久的行动力，减少半途而废的情况；\n\n4. 促进策略优化：目标会驱动客户主动探索实现目标的有效策略与方法，提升目标达成效率。"], [3, "3.1 设定目标", "目标四作用：引注意力、激动力、提坚持、促优化\n\n目标就像GPS（没它不知道往哪走，有它才知道每一步对不对）\n\n##### 个体差异\n\n个体差异会影响目标作用的发挥效果。在与客户设定目标时，需重点关注以下五类个体差异，确保目标设定的针对性：\n\n1. 目标投入度：客户对目标的投入程度越高，目标的激励作用越显著（可结合第二章自我决定理论理解）；\n\n2. 目标重要性：客户认为目标越重要，其受到的激励效果越强，行动的主动性也越高；\n\n3. 自我效能：即个体对自身能否达成目标的信念度，信念度越高，个体的坚持性越强，目标的激励作用越明显；\n\n4. 反馈机制：能及时获取目标进展反馈的客户，更易持续追求目标，因此私教在训练期间，可通过定期检查进度、借助穿戴设备等方式，帮助客户实现自我监控；\n\n5. 任务复杂性：任务难度越高，客户越需要多元策略支撑，此时教练可与客户协作，同时建立过程目标与结果目标（又称成绩目标），实现目标设定的科学性与艺术性结合。\n\n个体差异五维度：投入度、重要感、自我效、反馈、任务难\n\n同样的目标，对不同人的激励效果不同\n\n##### 目标设定的核心原则：SMART原则"], [3, "3.1 设定目标（续）", "SMART原则是目标设定的核心原则，包含五个维度，即具体（Specific）、可测量（Measurable）、可实现（Attainable）、相关（Relevant）、有时限（Time-bound），具体要求如下：\n\n1. 具体性：目标需清晰明确，避免模糊化表述，例如避免\"明年成为更好的人\"这类无法落地的目标，需明确具体行为与方向；\n\n2. 可测量性：目标需可追踪、可量化，便于判断进展情况，需注意，衣服尺寸因品牌、款式标准不同，不属于可测量指标；\n\n3. 可实现性：目标需贴合现实，确保在客户能力范围内可达成，避免设定过高或过低的目标；"], [3, "3.1 设定目标", "4. 相关性：目标需与客户的个人兴趣、实际需求及自身能力高度相关，避免出现\"教练苦心制定计划，客户却不愿执行\"的情况，核心原因往往是计划与客户需求脱节；\n\n5. 时限性：目标需明确预计完成期限，为定期监测进展提供依据，避免无时限目标导致执行拖沓。\n\nSMART原则（S具体、M可测、A可实现、R相关、T有时限\n\n● 类比：SMART目标就像精确的导航（起点、终点、路线、时间都清清楚楚）\n\n模糊目标=许愿，SMART目标=承诺\n\nSMART目标示例：\n\n模糊目标：\n\n• \"我要变瘦一点\"（不具体、不可测量）\n\n• \"我想更有力量\"（模糊）\n\n• \"我尽量多运动\"（没有时限）\n\n• \"我要变得健康\"（无法衡量）\n\nSMART目标：\n\nSpecific：减重5kg\n\nMeasurable：体重变化\n\nAttainable：12周合理\n\nRelevant：符合客户目标\n\nTime-bound：12周\n\n• \"未来12周，通过每周3次力量训练，使体重下降5kg。\"（具体、可测量、有时限、符合客户目标、可实现）\n\n• \"12周后能够完成连续10个标准俯卧撑\"（具体、可测量、可实现、有时限）"], [3, "3.1 设定目标（续）", "【注意】 衣服尺寸不属于可测量指标！\n\n##### 【实践建议】\n\n初期目标可适度保守，尤其在与客户合作初期、客户处于行为改变的早期阶段。远大目标虽能鼓舞人心，但一旦遭遇挫折，易让客户产生失望情绪，因此，让客户在目标推进过程中持续获得\"获得感\"至关重要。同时，需结合过程目标与结果目标：过程目标聚焦客户的具体行动，例如每周完成150分钟有氧训练、每天10分钟身体活动度改善；结果目标聚焦行动带来的实际成果，例如减脂重量、力量提升幅度，两者结合可全面保障目标落地。\n\n过程目标=做行为，结果目标=看成果，两个都要有\n\n没有过程目标，结果目标就是空谈\n\n表3-7\n\n| 心理健康指标"], [3, "3.1 设定目标", "| 运动后，客户在心情、精力水平和睡眠质量方面发生显著改善，且压力感和烦躁感有所降低。\n\n| 静息心率\n\n| 许多私人教练会要求客户测量静息心率，作为早上第一件事或在晚上睡觉前进行。没有运动经验的客户经过数月锻炼后静息心率通常会有所降低。\n\n| 给定次最大锻炼负荷期间的心率\n\n| 进行心肺运动的客户在一台设备上以标准锻炼负荷进行与适应能力测试期间所做的运动类型相似的运动时，其运动心率也有可能下降。客户每次进行测试时，次最大负荷必须保持一致。\n\n| 肌肉力量和耐力\n\n| 在运动计划的前几个月，肌肉力量和耐力的增加速度相当快。客户所用阻力强度或所进行重复次数的增加易于测量。\n\n| 步行测试\n\n| 如果客户数周以来一直将步行作为运动计划的一部分，那么利用某类计时步行测试来衡量身体素质改善通常会得到积极的结果。\n\n| 柔韧性\n\n| 柔韧性提高速度非常缓慢，并且只有在运动计划包括定期拉伸或关节活动度锻炼时才应将柔韧性包括在评估中。\n\n| 平衡\n\n| 平衡测量结果的最大改善出现在参加某种平衡训练计划的成年人中，这些训练计划越来越受欢迎，特别是在老年人中。\n\n| 技能水平"], [3, "3.1 设定目标（续）", "| 参加需要技能的活动（例如，攀岩、网球和高尔夫）的客户将会很高兴看到他们的运动技能水平有所提高。技能提高可通过运动技能测试或活动/比赛表现来衡量。\n\n| 静息血压、血脂水平或血糖水平等医疗指标\n\n| 如果上述任一项是客户运动计划的重点，则客户应按照医护人员制定的时间定期接受这些测量。这些变量可能受到许多其他因素的影响，包括饮食或体重变化，而且在评估运动结果时应将这些因素考虑在内。\n\n| 体重"], [3, "3.1 设定目标", "| 体重易于测量，但不是身体组成变化的良好指标。即使身体组成发生积极变化，体重也可能保持不变；或者由于水合作用的变化，体重可能会发生几磅或几千克的变化。不过，减重计划中超重几磅或几千克的客户可能会观察到体重下降。客户应进行慢速且持续的减重计划，这种计划更有可能长期维持减重效果。\n\n| 体型大小\n\n| 目标是减重几磅的客户体重可能不会有太大变化。身体组成变化（脂肪减少肌肉量增加）仍可导致体型变化。由于瘦组织的密度较大，所占空间要小于脂肪组织。许多人会因为裙腰或裤腰变宽松而感到高兴。许多私人教练鼓励客户观察衣服合身度的变化。\n\n| 身体组成\n\n| 如果测量身体组成，应始终使用相同的测试。一些私人教练记录胸围或皮褶厚度，但不预测身体组成。这些测量值的变化可指示脂肪减少或肌肉大小增加。"], [3, "3.2 产生想法并讨论选择", "明确目标后，教练进入与客户讨论想法、筛选备选方案的环节，这个阶段的核心原则是：每位客户的最终目标应是长期坚持运动，而非单纯激发短期运动热情。\n\n在第二章中我们提出：时间不足是客户退出运动最常见原因之一。若客户有因时间问题退出运动的过往经历，教练应引导其接受适度的运动计划：若客户设定的目标过于宏大，需投入大量时间与精力才能实现，结合其过往经历，需对目标进行合理调整与管理。相较于\"宏大但无法执行\"的计划，经过科学调整的计划更具可靠性与长效性。\n\n计划设计需结合客户合作周期，体现差异化：若客户仅计划短期合作，运动计划应设计得简洁易懂、便于客户独立执行；若为长期维护，计划可适当复杂化，提升针对性与持续性。\n\n因此，教练需根据客户的购买需求与训练需求，灵活制定差异化的训练计划与目标。\n\n在与客户共同制定评估方案时，应鼓励客户自主判断计划的可行性，重点考量时间分配的合理性。待双方充分讨论、达成共识后，进入计划制定环节。\n\n备选方案 = 给选择，不是给命令\n\n客户参与选择的方案，才会认真执行\n\n讨论训练方案选项\n\n• \"你的计划是这样的：每周一三五训练……\"\n\n• 不给客户选择的机会"], [3, "3.2 产生想法并讨论选择（续）", "• \"我们可以有两个方案：方案A是每周3次，适合时间充裕的你；方案B是每周2次，适合你工作较忙的时候。你觉得哪个更适合？\"\n\n• 鼓励客户说出顾虑：\"你之前说过时间是个问题，那你觉得哪个方案更现实？\""], [3, "3.3 制订计划", "制定计划是计划阶段的核心执行环节，需遵循两大核心要点，确保计划的可行性与客户的接受度：\n\n一是保障客户的自主权，客户最了解自身的目标、需求与运动偏好，计划制定需充分尊重客户意愿，双方达成一致后，可将计划形成书面形式，增强仪式感与执行力，便于后续落地与监测；\n\n二是帮助客户做好运动准备，教练可提供针对性建议，例如训练时的着装、所需装备，譬如：未来两周的主要训练区域，该区域固定器械的使用方法、场地礼仪及良好训练习惯等。这些建议能帮助客户快速适应健身环境，减少陌生感与尴尬感。健身房对教练而言是熟悉场景，但对新人而言，可能存在尴尬甚至畏惧心理，因此，帮助客户熟悉环境、提供关键指导，是提升客户体验、保障计划执行的重要环节。\n\n计划两要点（给自主权，帮做热身）\n\n书面计划更有仪式感，也更容易执行\n\n帮助客户做好运动准备\n\n• 假设客户知道健身房怎么用\n\n• 直接开始训练，不管客户是否准备好\n\n• \"我们先花10分钟熟悉一下器械，你会感觉更自在\"\n\n• 介绍训练区域的使用方法\n\n• 说明基本的健身房礼仪"], [3, "3.4 评估运动计划", "计划制定后，并非一成不变，需在课程开展期间定期评估、动态调整，确保计划贴合客户实际情况，保障目标落地。\n\n评估核心是判断目标进展速度（过快或过慢），并根据评估结果及时调整训练计划。若客户的计划坚持度下降，需及时排查原因（如目标难度过高、时间分配不合理等）并优化计划。评估重点主要包括两个方面：\n\n1. 计划的挑战性：判断目标设定过高或过低，确保挑战性与客户能力匹配，既不过于轻松导致动力不足，也不过于困难导致挫折感；\n\n2. 客户的坚持度：针对坚持度过低的情况，精准定位原因并解决，例如调整目标难度、优化时间分配、强化正向激励等。\n\n计划写在沙子上，需要随时调整\n\n定期评估是计划成功的保障\n\n评估计划话术：\n\n\"我们已经执行了两周计划，我想和你一起回顾一下进展。你觉得这个强度怎么样？有没有觉得太累或者太轻松？\"\n\n为何双向合作比单方面制定更有效？\n\n1. 承诺一致性：人们更愿意执行自己参与制定的计划\n\n2. 信息完整性：客户了解自己的实际情况，教练了解专业知识，两者结合才完整\n\n3. 责任感：当客户参与制定计划，他会觉得自己对计划有责任，而不是\"教练强加的\""], [3, "3.4 评估运动计划（续）", "4. 适配性提升：客户能预判时间、精力等现实约束，帮助教练制定更贴合实际的方案"], [3, "✍️小节回顾 | 第三阶段：计划阶段", "计划阶段的核心是\"双向合作\"。教练角色为引导者和专业顾问，非命令者。SMART原则是目标设定标准，需让客户参与目标设定，使计划成为双方共识。\n\nQ：一位客户说\"我的目标是一年瘦50斤，每周只能训练2次，每次1小时\"，请分析这个目标的SMART原则适用情况，并帮助客户优化目标设定。\n\n• 分析：\"目标具体但时间紧，需要拆分\"\n\n• 优化后：\"3个月减掉10斤，每周2次训练，每次1小时，包含力量训练和有氧训练。第一个月目标是适应训练节奏，第二个月逐步增加强度。\"\n\n表3-8\n\n| 目标设定\n\n| 五要点\n\n| 不多、不丧、长短合、双方定、定期审\n\n| SMART原则\n\n| 五维度\n\n| 具体、可测、可实现、相关、时限\n\n| 过程目标\n\n| 做行为\n\n| 每周3次，每次30分钟\n\n| 结果目标\n\n| 看成果\n\n| 3个月减10斤\n\n| 评估计划\n\n| 调难度、提坚持\n\n| 计划不是死的，要动态调整"], [3, "4 行动阶段", "行动阶段是训练方案落地执行的最终环节。\n\n本阶段核心重点为教学技能，专业的教育学能力、动作讲解能力、动作纠错能力、训练引导能力至关重要。教练需依靠标准化教学技巧，指导客户正确完成训练动作，规避运动损伤，循序渐进推进训练目标落地。\n\n行动阶段 = 教+学+练\n\n● 类比：行动阶段就像教练的\"主战场\"（所有前期的铺垫，都是为了这一刻）\n\n教学技能是教练吃饭的本事，必须扎实"], [3, "4.1 自我监测", "##### 自我监测\n\n\n自我监测是行动阶段的核心任务之一，也是支持行为改变的最有效方式之一，尤其适用于解决坚持运动、改善饮食这两大世界级难题。教练需引导客户建立完善的自我监测体系，具体可通过以下方式推进：\n\n1. 监测工具与内容：引导客户借助手机应用、专属App或小程序，全面记录训练相关信息，包括抗阻训练的重复次数、强度，心肺训练的时间、强度、心率等核心指标；同时，善用AI工具，不仅实现数字记录，当下教练更要学习通过AI进行数据化分析，帮助客户清晰掌握自身训练进展。\n\n2. 自我监测的核心价值：一方面，能够显著提高客户的自我意识，强化其行动主体性，让客户更清晰地感知自身变化；另一方面，可强化教练与客户之间的沟通，每次教练询问、交流监测记录时，都是开启有效讨论、了解客户需求、优化训练方案的重要契机。\n\n自我监测 = 让自己看见自己的进步\n\n看得见的进步，才是持续的动力\n\n引导客户建立自我监测习惯\n\n• \"你回家自己练就行，不用记录\"\n\n• 认为记录是客户自己的事\n\n• 推荐适合的App或小程序\n\n• 定期回顾监测数据\n\n• 用数据帮助客户看到进步"], [3, "4.2 有效的教学技巧", "行动阶段中，教练的核心职责之一是向客户传授运动技能、讲解健康知识，需掌握科学有效的教学技巧，确保客户能够正确掌握动作、规范使用器械，同时提升学习效率与行动坚持度。教学过程可分为\"学\"与\"教\"两个维度，具体要求如下：\n\n图3-12\n\n##### 学习的三个阶段\n\nFitts & Posner（1967）提出，个体学习运动技能的过程通常分为三个阶段，教练需根据不同阶段的特点调整教学策略，具体如下：\n\n1. 认知阶段（Cognitive stage）：此阶段客户的动作表现为不协调、不流畅，对动作要领的理解较为模糊。教练需采用\"整体讲解、逐步示范、独立实践\"的教学方式，做到言传身教，同时给予客户充足的练习时间。此阶段是教练最费心的阶段，需遵循KISS原则（Keep It Simple and Short，即简洁明了原则），避免教授过多、过复杂的内容，防止给客户造成负担。"], [3, "4.2 有效的教学技巧（续）", "2. 联想阶段（Associative stage）：此阶段客户已能完成大部分正确动作，仅存在少量细节偏差。教练的核心任务是提供具体、精准、定向的反馈，避免过量反馈造成客户混乱，重点针对动作偏差进行纠正，帮助客户逐步完善动作技能。\n\n3. 自主阶段：此阶段客户已能流畅、自然、正确地运用各类运动技能。教练的反馈需从外部反馈转向内部反馈，角色从\"教学者\"转变为\"观察者\"，同时准备引入新的运动技能，引导客户持续提升。\n\n【注意】 该模型存在一定局限性，不适用于运动员或复杂运动技巧（如滑雪等）的教学。整体而言，这三个阶段可理解为客户从\"运动小白\"到\"熟练掌握技能\"的成长过程，教练的教学重点需逐步从详细指导转向定向监督。\n\n学习三阶段：认知期（手忙脚乱）、联想期（逐步稳定）、自主期（形成习惯）\n\n● 类比：学习就像学骑自行车（先是摇摇晃晃，然后慢慢稳定，最后不用想就会骑）\n\n不同阶段用不同的教法，不能一套方法用到底"], [3, "4.2 有效的教学技巧", "阶段判断与策略：\n\n认知阶段（判断）：\n\n☐ 动作不协调\n\n☐ 需要看着示范\n\n☐ 记不住动作顺序\n\n策略：多示范、多讲解、多练习、遵循KISS原则（简洁明了）\n\n联想阶段（判断）：\n\n☐ 动作基本正确\n\n☐ 只有细节问题\n\n☐ 能独立完成\n\n策略：定向反馈、纠正细节、避免过量反馈\n\n自主阶段（判断）：\n\n☐ 动作流畅自然\n\n☐ 能自己发现问题\n\n☐ 注意力可放在其他事上\n\n策略：观察者角色、引入新技能、准备进阶"], [3, "学习三阶段对照表", "表3-9\n\n| 认知阶段（认知定向阶段）\n\n| 动作不协调、不流畅，对动作要领理解模糊\n\n| 1. 采用\"整体讲解、逐步示范、独立实践\"方式，做到言传身教；2. 给予充足练习时间；3. 遵循KISS原则（简洁明了），避免教授过多过复杂内容\n\n| 联想阶段\n\n| 大部分动作正确，仅存在少量细节偏差\n\n| 提供具体、精准、定向的反馈，重点纠正动作偏差，避免过量反馈造成混乱\n\n| 自主阶段\n\n| 能流畅、自然、正确地运用各类运动技能\n\n| 1. 反馈从外部转向内部；2. 角色从\"教学者\"转变为\"观察者\"；3. 准备引入新的运动技能\n\n##### 5.1.2.2 学习的三种方式\n\n教学中可以结合视觉示范、言语说明和身体实践三种信息通道。客户可能对某种方式表现出偏好，但不应被固定地归类为单一“学习类型”。教练应依据学习任务和客户的实际反应，灵活组合多种教学方式：\n\n1. 视觉型客户：这类客户善于观察，常反馈\"我看清楚了\"\"我没看清楚\"。针对此类客户，教练的核心策略是\"做给他看\"，通过规范的动作示范，让客户直观掌握动作要领。"], [3, "学习三阶段对照表（续）", "2. 听觉型客户：这类客户喜欢倾听，常反馈\"我听到了\"\"我没听到\"。针对此类客户，教练的核心策略是\"说给他听\"，通过清晰、细致的语言讲解，传递动作要领与健康知识。\n\n3. 身体实践：通过分解动作、反复练习、外部提示和客户自身感受，帮助客户理解动作。若需使用触觉提示，必须先征得客户明确同意，说明目的和接触位置，并遵守专业界限。\n\n视觉型：看；听觉型：听；动觉型：摸\n\n● 类比：学习就像吃饭（有人喜欢看菜单，有人喜欢听介绍，有人喜欢先尝一口）\n\n了解客户的学习类型，让教学事半功倍\n\n快速判断学习类型：\n\n• 问\"你之前是怎么学的？\"\n\n• 观察客户最先问什么：\"怎么做？\"vs\"为什么？\"vs直接动手试\n\n针对性教学：\n\n• 视觉型：多示范，少说话"], [3, "学习三阶段对照表", "• 听觉型：多讲解，多解释\n\n• 动觉型：多给机会实操，手把手引导"], [3, "学习三类型对照表", "表3-10\n\n| 视觉型\n\n| 善于观察，常反馈\"我看清楚了\"\"我没看清楚\"\n\n| \"做给他看\"，通过规范的动作示范，让客户直观掌握动作要领\n\n| 听觉型\n\n| 喜欢倾听，常反馈\"我听到了\"\"我没听到\"\n\n| \"说给他听\"，通过清晰、细致的语言讲解，传递动作要领与健康知识\n\n| 动觉型\n\n| 喜欢触摸、实操，常反馈\"我感觉到了\"\"我感觉不到\"\n\n| \"手把手指导\"，通过手把手教学，让客户在实操中感知动作细节与发力方式\n\n##### 核心教学技巧\n\n结合认知阶段的教学要求，教练需掌握以下核心教学技巧，确保教学效果与安全性：\n\n1. 言传身教，强调练习：\"言传\"\"身教\"是教练的核心职责，而\"练习\"的主体是客户。教练需明确告知客户，运动技能并非天生，天赋仅影响学习兴趣与基础技能掌握速度，真正的技能提升、成为专家，需要日复一日的持续练习。\n\n教练言传身教，客户勤加练习\n\n技能的提升靠的是练习，不是天赋"], [3, "学习三类型对照表（续）", "1. 讲解清晰，兼顾\"是什么、为什么、怎么做\"：引入新动作、新技能时，讲解需缓慢、清晰，向客户明确说明\"做什么\"（动作目标）、\"为什么做\"（训练意义）、\"怎么做\"（动作要领），同时重点强调如何有效执行、如何预防损伤。\n\n讲动作 = 是什么（目标）+ 为什么（意义）+ 怎么做（要领）+ 怎么做对（避免损伤）\n\n讲清楚，才能做明白\n\n1. 先整体后细节，避免细节过载：讲解动作时，优先描述动作的整体目标，再逐步补充细节，避免一开始就堆砌大量细节让客户产生困惑。例如，讲解椭圆机使用时，首先强调\"以平滑、稳定的速度移动\"，再逐步讲解发力细节，而非一开始就强调脚趾抓地、核心绷紧等细节（此类教学方式并非错误，而是效率较低）。\n\n先整体后细节，先框架后填充\n\n细节是加分项，不是开场白\n\n教授新动作\n\n• \"首先脚平行与肩同宽，然后屈髋屈膝，膝盖朝向脚尖，核心收紧，脊椎中立……\""], [3, "学习三类型对照表", "• 一次性灌输大量细节\n\n• \"先试着做一个完整的深蹲，不用担心细节\"\n\n• 观察后：\"整体不错，现在我们来调整一个关键点：膝盖朝向脚尖方向\"\n\n1. 优先强调安全与高效细节：教授动作时，需优先讲解与安全性、目标达成相关的细节，简洁明了地告知客户如何避免损伤、如何高效达成训练目标。例如，高位下拉时，提醒客户避免颈后下拉，减少肩部损伤风险；硬拉时，强调腰部保持相对中立位，预防腰部损伤。\n\n安全第一，效率第二\n\n错误的细节可以慢慢改，受伤了就全完了\n\n1. 提供充足实践机会：讲解与示范完成后，需为客户提供集中的训练机会，教练全程观察，及时提供有用的反馈，帮助客户在实践中巩固动作技能。\n\n听一遍会忘，做三遍才熟\n\n实践出真知\n\n【实操建议】 核心教学技巧的运用需结合客户学习阶段与学习偏好，例如对视觉型客户，可多增加动作示范频次；对动觉型客户，可提前预留实操时间，避免单纯理论讲解，提升教学针对性。\n\n##### 5.1.2.4 反馈的分类与应用\n\n向客户提供反馈是教练的核心任务之一，缺乏反馈会显著降低客户的行动坚持度。反馈主要分为内部反馈与外部反馈，两者协同作用，共同提升客户的训练效果与坚持度："], [3, "学习三类型对照表（续）", "1. 反馈的分类：外部反馈是教练提供给客户的相关信息，包括强化、纠错与鼓励；内部反馈是客户自身通过听觉、触觉等感觉系统获得的体验与感知。需注意，外部反馈虽能提供直接指导，但决定客户长期坚持度的始终是内部反馈（这与内在动力、外在动力的原理一致，向内的自我感知能更有效地强化客户的行动主体性，提升坚持度，可结合第二章自我决定理论理解）。\n\n外部反馈 = 教练给的，内部反馈 = 客户自己感觉到的\n\n最终让客户靠自己的感觉走，而不是一直靠教练的口哨"], [3, "学习三类型对照表", "外部反馈的有效应用：三明治法则：为提升外部反馈的效果，可采用\"三明治法则\"，具体流程为：首先，强化客户的良好表现；其次，针对性地纠正客户的动作偏差；最后，激励客户持续练习。将纠错这一相对负面的反馈放在强化与鼓励之间，可减少客户的抵触情绪，提升反馈的接受度。\n\n图3-13\n\n三明治法则 = 上层（肯定）+ 中层（纠错）+ 下层（鼓励）\n\n● 类比：就像三明治（两片面包夹着肉，好吃又健康）\n\n批评要包着表扬说\n\n三明治法则话术示例：\n\n\"首先，你今天的深蹲整体节奏很好，保持得很稳定（肯定）。其次，我注意到你下蹲时膝盖有点内扣，这是需要注意的，下次注意膝盖朝向脚尖（纠错）。继续保持这个状态，你会越来越好的（鼓励）！\"\n\n1. 纠错的核心要点：一是优先纠正最严重的错误，此类错误通常与动作安全性、动作顺序相关（如动作起始阶段的错误），需第一时间纠正，避免损伤发生；二是采用积极反馈替代消极反馈，例如用\"记住保持呼吸\"替代\"不要憋气\"；三是如需与客户进行身体接触纠正动作，需提前征得客户同意。\n\n纠错三要点（先抓安全、用正向说、接触要同意）\n\n纠错是为了帮助，不是为了批评\n\n积极反馈替代消极反馈："], [3, "学习三类型对照表（续）", "消极：\"不要弓背\"\n\n积极：\"记住挺直胸部\"\n\n消极：\"别耸肩\"\n\n积极：\"放松肩膀，让它们自然下垂\"\n\n消极：\"不要憋气\"\n\n积极：\"在推起时呼气\"\n\n【实操建议】 反馈需控制频率，避免在客户实操过程中频繁打断，可在客户完成一组动作后，集中给出1-2个核心反馈，优先肯定良好表现，再针对性纠错，减少客户抵触情绪。"], [3, "5.1.3 树立榜样", "教练自身的行为表现是影响客户行动的重要因素，树立良好的健康榜样，能显著提升教练的可信度，同时增强客户的行动信心与动力，具体要求如下：\n\n1. 践行健康生活方式：教练自身需保持积极的训练态度与健康的生活习惯，若教练自身消极对待训练、有抽烟、酗酒等不良习惯，会大幅削弱榜样作用，影响客户的信任度与行动意愿。\n\n教练自己都做不到，凭什么让客户做？\n\n榜样的力量是无声的，但效果是巨大的\n\n1. 强化客户的自我效能：教练的榜样行为能为客户提供\"替代性经验\"（可结合自我效能相关理论理解），让客户意识到\"教练工作繁忙、压力大，仍能坚持训练，自己也可以做到\"，从而增强行动信心。反之，若教练声称\"自己没时间训练\"，会让客户质疑\"自己再忙也能挤出时间训练\"的可行性，丧失行动动力。\n\n教练的状态 = 客户的信心值\n\n你是客户的\"可能性证明\"\n\n1. 传递积极的运动理念：教练需传递\"运动是为了提升舒适感、减轻压力、改善身体状态\"的积极理念，而非单纯为了保持身材而进行过量运动或导致饮食失调。通过自身践行，让客户感受到运动的多元益处，而非仅关注力量提升、体脂减少。\n\n运动是为了更好的生活，不是为了痛苦地活着"], [3, "5.1.3 树立榜样（续）", "让客户享受运动，而不是忍受运动\n\n【实操建议】 教练可在日常沟通中，自然分享自身的运动体验与健康收获，避免刻意说教，让客户潜移默化接受积极的运动理念，增强榜样的感染力。"], [3, "5.1.4 行为合约", "行为合约是一种著名的行为矫正策略，可用于辅助客户开启行动，具体实施要点如下：\n\n1. 合约核心：与客户签订行为合约，明确约定训练目标、执行计划，同时设置合理的奖励机制，当客户达成约定目标时，给予相应奖励。\n\n行为合约 = 承诺 + 奖励\n\n让承诺看得见，让奖励摸得着\n\n1. 注意事项：外在激励（合约奖励）可有效帮助客户启动运动，但研究表明，长期坚持运动的人，核心动力来自内在激励。因此，行为合约更适用于刚开始训练的客户，帮助其建立行动习惯；同时，合约中的目标设定不宜过高（可回顾前文目标设定的相关要求），奖励需贴合客户的个人需求，确保对客户具有实际意义。\n\n行为合约是\"启动器\"，不是\"永动机\"\n\n奖励是引子，内在动力才是根本"], [3, "行为合约范本", "行为合约范本 (时间) (频率)_ (运动量) 本人有多大信心会这样做?--分为1至10级,1表示完全没有信心,10表示完 全有信心) 如果截至_本人成功完成了这一积极生活方式的改变,本人会奖励自己 如果本人未能成功完成这一积极生活方式的改变,将失去这种奖励。 本人, ,已审阅了该合约并且本人同意在 与 讨论完成或未完成该 健康行为改善过程中的体验。 签名(客户): 签名(私人教练):)\n\n【实操建议】 行为合约可采用书面形式，明确双方权利与约定，奖励可选择非物质奖励（如运动计划优化、额外指导时间），避免过度依赖物质奖励，逐步引导客户建立内在动力。\n\n为何教学技能是教练的核心能力？\n\n不管前面三个阶段做得多好，如果在行动阶段无法有效教学，客户学不会动作、产生挫败感、坚持不下去，一切努力都会白费。教学技能是教练\"最后一公里\"的能力，决定了客户能否真正从训练中获益。"], [3, "✍️小节回顾 | 第四阶段：行动阶段", "行动阶段的核心是\"教学\"。教练需理解学习三阶段和三类型，采用差异化教学策略。反馈遵循三明治法则，同时引导客户建立自我监测能力。教练自身也是教学工具，榜样力量影响客户的信心和坚持度。\n\nQ：一位客户在认知阶段总是记不住动作细节，作为教练你会如何调整教学策略？\n\n• 判断原因：是视觉型？听觉型？还是动觉型？\n\n• 视觉型：增加示范次数，让客户多看\n\n• 听觉型：换一种讲解方式，用不同的比喻\n\n• 动觉型：手把手引导，让客户多感受\n\n表3-11\n\n| 学习三阶段\n\n| 认知、联想、自主\n\n| 不同阶段，不同策略\n\n| 学习三类型\n\n| 视觉、听觉、动觉\n\n| 因材施教\n\n| 三明治法则\n\n| 肯定+纠错+鼓励\n\n| 批评要包着表扬说\n\n| 自我监测\n\n| 记录+反馈\n\n| 让进步看得见\n\n| 行为合约\n\n| 承诺+奖励\n\n| 启动器不是永动机"], [3, "知识脉络图", "图3-14"], [3, "建立默契阶段自检", "☐ 我能用同理心理解客户的感受\n\n☐ 我没有刻板印象地对待客户\n\n☐ 我的仪容仪表、肢体语言传递出专业形象\n\n☐ 我与客户保持了适当的职业界限"], [3, "探讨阶段自检", "☐ 我在倾听而不是在给建议\n\n☐ 我使用开放式问题收集信息\n\n☐ 我运用了动机式访谈的OARS技巧\n\n☐ 我处理好了客户的负面信息披露"], [3, "计划阶段自检", "☐ 我帮助客户设定了SMART目标\n\n☐ 我让客户参与了计划制定\n\n☐ 我设定了过程目标和结果目标\n\n☐ 我安排了定期评估计划"], [3, "行动阶段自检", "☐ 我能判断客户处于哪个学习阶段\n\n☐ 我能判断客户属于哪种学习类型\n\n☐ 我使用了三明治法则给反馈\n\n☐ 我引导客户建立了自我监测习惯\n\n☐ 我以身作则树立了健康榜样"], [3, "全章核心概念速查表", "表3-13\n\n| 建立默契\n\n| 同理心、文化素养、第一印象、非语言沟通、专业边界\n\n| 探讨阶段\n\n| 积极倾听、动机式访谈、OARS技巧、四要素（协作、认同、同情、唤出）\n\n| 计划阶段\n\n| SMART原则、过程目标与结果目标、双向合作\n\n| 行动阶段\n\n| 学习三阶段、学习三类型、三明治法则、自我监测、行为合约"], [3, "自测练习", "以下题目基于本章知识要点，点击展开参考答案。\n\n答案：正确。原文指出默契是贯穿整个合作关系的“氧气”，需要持续供给。没有默契，所有的专业技能都是空中楼阁。\n\n答案：错误。同理心不是“我理解你”，而是“我想象我在你的处境中”。同理心要求教练真正站在客户的角度去感受，而非简单地口头表达理解。\n\n答案：错误。客户记住的是你说话时的样子，比你说了什么更关键。在表达情感和态度时，非语言信号的影响力远超语言内容。\n\n答案：正确。眼神接触需要适度。温和的注视代表尊重和关注，但过度凝视会造成压力。真诚的表情比完美的表演更有力量。\n\n答案：错误。保持专业距离不是冷漠，是为了让教学更客观。专业界限就像“球场边线”，保持距离有助于更清晰地观察和指导。\n\n答案：正确。困难客户不是“难搞”，而是“有故事”。客户的抵触背后往往藏着恐惧和伤痛，需要用同理心和专业能力去应对。\n\n答案：错误。在建立默契阶段，你的首要任务是“听”，而不是“教”。应该少说多听，像个记者而不是老师。没有建立信任之前，所有的专业建议都是空话。"], [3, "自测练习（续）", "答案：正确。听是为了理解，不是为了准备回应。积极倾听需要全神贯注、不打断、记重点。假装倾听三秒钟，客户能感受十分钟。\n\n答案：错误。动机式访谈是引导，不是说服。让人改变的永远是他自己的动机，而非外部的道理。强推无效，引导才有效。教练应多问“什么”和“怎么”，少问“是不是”。\n\n答案：正确。动机式访谈以合作、接纳、关怀和唤出为基础。合作是共同工作，接纳是尊重自主选择，关怀是以客户福祉为先，唤出是引导客户说出自己的改变理由。\n\n答案：错误。教练是健身专家，不是心理医生。遇到超出能力范围的心理问题，应及时转介给专业人士。负面信息处理的原则是共情、简短、转话题、必要时转介。"], [3, "自测练习", "答案：正确。SMART原则包含五个要素：S（Specific，具体）、M（Measurable，可测量）、A（Achievable，可实现）、R（Relevant，相关）、T（Time-bound，有时限）。模糊目标等于许愿，SMART目标等于承诺。\n\n答案：错误。过程目标和结果目标两个都要有。没有过程目标，结果目标就是空谈。过程目标关注具体行为，结果目标关注最终成果。\n\n答案：错误。正确的教学顺序是先整体后细节，先框架后填充。细节是加分项，不是开场白。错误的细节可以慢慢改，受伤了就全完了，安全第一。\n\n答案：正确。三明治法则的结构是：上层（肯定）+ 中层（纠错）+ 下层（鼓励）。批评要包着表扬说，纠错是为了帮助，不是为了批评。"], [3, "知识翻卡", "共 15 张知识卡片，点击翻转查看答案\n\n\n##### 沟通与教学操作清单\n\n\n- 首次面谈：建立融洽关系，使用积极倾听\n\n- 非语言沟通：保持眼神接触、开放姿态、适当距离\n\n- 动作示范：正面→侧面→背面，慢速→正常速度\n\n- 给予反馈：先肯定正确动作，再纠正错误（三明治法）\n\n- 目标设定：将长期目标拆解为短期可量化里程碑\n\n- 使用多种教学策略适应不同学习风格（视觉/听觉/动觉）\n\n- 记录每次训练的客户反馈和进展\n\n- 定期回顾目标进度，调整训练计划\n\n\n---"], [4, "核心知识", "● 规律运动降低心血管疾病(CVD)、肺部疾病、代谢性疾病、某些癌症、焦虑抑郁和过早死亡风险\n\n● 但运动存在固有风险：对健康个体，中等强度运动不会引发心血管或肌肉骨骼危险事件\n\n● 风险升高的三类人群：①运动习惯不佳 ②已患病个体（已诊断CVD/代谢/肾脏疾病）③计划进行接近极限强度运动的个体\n\n● 有潜在CVD的个体进行不习惯的剧烈身体活动时，运动相关的急性心肌梗死(AMI)和心源性猝死(SCD)风险最高\n\n● 无症状个体即使高强度运动，心血管不良事件风险仍极低\n\n不习惯运动、已患相关疾病与突然进行接近极限的活动同时出现时，急性心血管事件的风险最值得警惕。这个“风险三角”用于帮助理解风险来源，不代替正式筛查。\n\n理解类比：火灾风险会随燃料、氧气和点火源的组合而改变。同样，运动风险也取决于客户状态与运动暴露的组合，不能只根据某一项信息作出结论。\n\n● • • 补充理解：风险最高的场景 = 有潜在CVD + 突然进行不习惯的剧烈运动（如久坐多年的中年人突然参加篮球比赛）。\n\n• 场景：第一次见新客户，他精力充沛地说\"我准备好了，给我上强度！\""], [4, "核心知识（续）", "• ❌ 错误做法：热情响应，立刻安排高强度训练跳过筛查。\n\n• ✓ 正确做法：先筛查问卷了解情况。把筛查当成\"给他一个安全运动的环境\"，而不是\"刁难他\"。\n\n• 常见误区：把筛查当成对客户健康的质疑。其实筛查是标准流程，保护双方。\n\n风险≠不运动。核心逻辑是：运动有益，但不习惯的剧烈运动对已患病/有症状个体确实危险。 筛查的目标是识别谁需要先看医生。"], [4, "知识点总结", "核心逻辑：运动整体有益，但\"不习惯的剧烈运动 + 已患病/有症状个体\"这个组合确实存在风险。 筛查用于识别风险，不用于拒绝客户。\n\n互动考题：\n\n运动相关心血管事件风险最高的人群是？\n\n● A. 长期规律运动的无症状个体\n\n● B. 有潜在CVD、进行不习惯剧烈运动的个体 ✅\n\n● C. 每周运动5次的健康个体\n\n风险三角——不习惯+已患病+接近极限，三者齐备才高危。"], [4, "2 运动前健康筛查", "筛查基于三个风险调节因素：（注：本节基于ACSM 2018更新版筛查算法，与2014版相比有重大变化）：\n\n1. 个人目前身体活动水平\n\n2. 是否确诊CVD/代谢/肾脏疾病，或有无相关体征/症状\n\n3. 期望运动强度\n\n「定期运动」的定义：\n\n过去3个月内，每周至少3天，至少30分钟有计划、有组织的中等强度身体活动\n\n● • 口诀：「3-3-30」= 3个月，每周3天，每天30分钟。\n\n● • 类比：类比\"定期存款\"：有固定\"存款记录\"才能享受更低\"利率\"（筛查门槛）。\n\n● • 一句话记牢：定期运动是客户的\"信用记录\"，有记录者门槛更低。\n\n筛查算法—— 不参加定期运动的人：\n\n注：以下表格中\"疾病\"特指CVD（心血管疾病）、代谢性疾病和肾脏疾病三类\n\n表4-5\n\n| 无CVD/代谢/肾脏疾病 + 无体征/症状\n\n| 不需要\n\n| 轻度→中等→逐步提高到高强度\n\n| 已知患有CVD/代谢/肾脏疾病但无症状\n\n| 需要\n\n| 轻度→中等→根据许可逐步提高\n\n| 有CVD/代谢/肾脏疾病的体征/症状（不论疾病状态）\n\n| 先获许可，再轻度→中等→逐步提高\n\n筛查算法—— 参加定期运动的人："], [4, "2 运动前健康筛查（续）", "表4-6\n\n| 继续中等或高强度\n\n| 中等强度不需要；高强度需要\n\n| 中等强度继续；获许可后逐步提高到可接受强度\n\n| 中断运动，需要医学许可\n\n| 获许可后继续\n\n●  口诀：「症状是老大，有病看强度，无病随便动」。症状永远第一，有病看强度，无病直接放行。\n\n●  类比： 定期运动者相当于拿到了\"通行证\"，同等条件下比不定期运动者多了\"中等强度自由行\"这一项权益。\n\n● 考试提示：定期运动+有疾病无症状+中等强度=可考虑免除许可，这是定期运动的\"福利\"。注意ACSM原文用的是\"may consider\"（可考虑），不是\"不需要\"。"], [4, "2 运动前健康筛查", "• 场景：客户勾选了\"运动时偶尔胸闷\"，但他说\"可能是我吃太饱了\"。\n\n• ❌ 错误做法：跟客户辩论他的症状原因，试图判断是否\"真的\"需要许可。\n\n• ✓ 正确做法：不要诊断，转介优先。\"这种情况我们需要医生确认一下，排除心脏方面的顾虑，对你对我都是保护。\"症状触发许可，不需要你判断真假。\n\n• 常见误区：把\"不需要医学许可\"误解为\"不需要筛查问卷\"。所有客户都要填问卷，结果决定后续动作。\n\n需警惕的体征/症状（必背）：\n\n● 可能因心肌缺血导致的胸、颈、颌、手臂等部位疼痛/不适\n\n● 休息或轻度用力时呼吸急促（呼吸困难）\n\n● 端坐呼吸 / 阵发性夜间呼吸困难\n\n● 眩晕或晕厥\n\n● 踝水肿\n\n● 心悸或心动过速\n\n● 间歇性跛行\n\n● 已知的心杂音\n\n● 日常活动时异常疲劳或呼吸急促\n\n● 口诀：「胸颈颌臂疼、呼吸休息急、晕眩踝肿悸、跛行杂音疲」——首字连成记忆链。\n\n理解类比：体征或症状像仪表盘上的警示灯，它不能告诉教练具体故障是什么，却提醒教练暂缓或中断运动，并按筛查流程获得医学许可。\n\n● 一句话记牢：心脏缺血样疼痛+呼吸困难+晕眩 = 立刻停，三大红灯。"], [4, "2 运动前健康筛查（续）", "• 场景：客户说\"我爬楼梯有点喘，这是不是正常？\"\n\n• ❌ 错误做法：凭经验判断\"应该没事\"，继续训练。\n\n• ✓ 正确做法：将\"喘\"记录下来，结合其他症状综合判断。如果休息时也喘，或日常活动就喘，这是危险信号。\n\n• 常见误区：认为客户年轻就\"肯定没事\"。任何年龄段出现这些症状都需要认真对待。\n\n运动强度分级（注释6-8）：\n\n表4-7\n\n| 低\n\n| <40%\n\n| 2-2.9\n\n| 9-11\n\n| 中\n\n| 40-59%\n\n| 3-5.9\n\n| 12-13\n\n| 高\n\n| ≥60%\n\n| ≥6\n\n| 14-17\n\n● 口诀：「低39中59高60」——记住三个关键百分数。"], [4, "2 运动前健康筛查", "● 类比：强度好比烧水火力：低火（<40%）不沸腾，中火（40-59%）慢炖，高火（≥60%）快煮。\n\n● 一句话记牢：RPE 12-13 = 中等强度 = 说话测试能说句子但不能唱歌。\n\nACSM筛查算法是一个三叉决策树，两个入口（不定期 vs 定期运动），三个出口（无需许可 / 需要许可 / 中断+需要许可）。关键区分点：\n\n• 「有无疾病」和「有无症状」是两件事 ，有症状不论疾病状态都要医学许可• 定期运动者比不定期运动者门槛低：同是有疾病但无症状，定期运动者做中等强度 可考虑免除（ACSM原文\"may consider\"）许可\n\n• 「体征/症状」是最强的触发器 ，不管有没有疾病、有没有在运动，有症状就停\n\n核心逻辑：筛查算法 = 运动史（定期/不定期）× 疾病状态（有/无）× 体征/症状（有/无）。 症状是\"总开关\"，有症状即触发许可。\n\nQ1：一位客户每周散步2天、每次15分钟，患有2型糖尿病但无症状。根据筛查算法，需要医学许可吗？\n\n需要。她不满足「定期运动」定义（至少3月/每周3天/每次30分钟中等强度），且有代谢性疾病，需要医学许可。"], [4, "2 运动前健康筛查（续）", "Q2：一位客户过去6个月每周跑步4天、每次40分钟，有高血压但控制良好、无症状，想做中等强度有氧。需要医学许可吗？\n\n可考虑免除。定期运动 + 有疾病但无症状 + 中等强度 = ACSM建议可考虑免除医学许可（原文\"may consider\"）。\n\nQ3：定期运动的客户，已知患有CVD但无症状，想做高强度有氧运动，过去12个月体征/症状没有变化。需要医学许可吗？\n\n需要。定期运动 + 有CVD + 无症状 + 高强度 = 建议获得医学许可。\n\n「运动 × 疾病 × 症状」三轴 → 症状 > 疾病 > 运动史"], [4, "运动前健康筛查问卷", "图4-1\n\n● 问卷分3步：①症状（6项）→ ②目前活动（是否定期运动）→ ③身体状况（9项疾病勾选）\n\n● 第1步有任何勾选 = 停止，需医学许可\n\n● 第2步：是否满足定期运动定义\n\n● 第3步：心脏病发作/心脏手术/起搏器/心脏瓣膜疾病/心力衰竭/心脏移植/先天性心脏病/糖尿病/肾脏疾病\n\n● 口诀：「三步走：先问症状（停），再问运动（定性），最后问病（定位）」\n\n● 类比： 好比医院分诊台：先问哪里疼（症状），再问运动史（活动），最后做检查（疾病）。\n\n● 补充：问卷中第1步的6项症状对应ACSM列出的劳累性体征/症状，与图4-1注释4一致。\n\n• 场景：客户在第1步全部勾\"否\"，第2步勾\"否\"（不定期运动），第3步勾了\"糖尿病\"。\n\n• ❌ 错误做法：松一口气，觉得至少症状没问题了，直接开始训练。\n\n• ✓ 正确做法：确认他需要医学许可。用ABC沟通法，温和地解释为什么，同时鼓励他保持目前的活动水平。\n\n• 常见误区：跳过问卷直接开始训练。问卷是标准流程，跟客户健不健康没关系。"], [4, "运动前健康筛查问卷（续）", "参前问卷三步对应筛查算法三个关键信息：症状触发许可（第一步）、运动史调节门槛（第二步）、疾病状态决定强度限制（第三步）。三步环环相扣，缺一不可。\n\n核心逻辑：问卷是标准化信息收集工具，三步对应算法三个输入。第一步阳性就停止，后两步决定许可级别。\n\n问卷第1步全部没有勾选，第2步客户回答\"否\"（不定期运动），第3步勾选了糖尿病。 此时 怎么做？\n\n根据筛查算法：不定期运动 + 有代谢性疾病（糖尿病）+ 无症状 = 需要医学许可。建议轻度至中等强度运动，根据许可逐步提高。\n\n症状→活动→疾病，三步走，一步阳就停。"], [4, "筛查结果的沟通", "当筛查结果指向需要医学许可时，用ACE ABC Approach（而非面试式）与客户沟通：\n\n● A — 提问（Ask）：开放性问题了解客户目标与需求\n\n● B — 打破障碍（Break Barriers）：发现阻碍客户参与计划的潜在问题\n\n● C — 协作（Collaborate）：共同努力实现目标\n\n关键原则：\n\n● 医学许可不是拒绝帮助，是为了提供正确的帮助\n\n● 不能让医学许可要求成为运动的障碍\n\n● 客户获医生签字同意后再开始正式训练\n\n● 口诀：ABC = Ask需求 → Break障碍 → Collaborate协作\n\n● 类比： 沟通的定位是\"邀请\"而非\"通知\"，和客户一起解决问题。好比教练和客户组队完成健康挑战，医学许可是路上的补给站，不是终点线。\n\n● 补充：ACE教材原文用ABC Approach描述这一对话式沟通流程，强调\"类似对话而非面试\"。\n\n• 场景：客户听到\"需要医学许可\"后脸色变了，说\"医生肯定说不要运动\"。\n\n• ❌ 错误做法：直接说\"那你去看医生吧\"，结束对话。\n\n• ✓ 正确做法：\n\n1.  解释这是为了让他更安全地运动"], [4, "筛查结果的沟通（续）", "2. 提供医学许可表格模板，上面写清楚你计划的运动类型，让医生有据可依\n\n3. 告诉他，即使在等待许可期间，也可以从低强度的活动开始（走路、拉伸等）\n\n• 常见误区：把医学许可当成\"甩锅\"工具。医学许可是保护客户安全的手段，不是你推卸责任的借口。\n\n医学许可是起点，不是终点。 核心心态：把客户当队友，把医生当顾问。等待许可期间可以保持低强度活动，避免\"全有或全无\"的思维。\n\n核心逻辑：ABC沟通法是\"邀请\"而非\"通知\"。 医学许可的目的是提供正确的帮助。\n\n客户说\"我这么健康，为什么要我看医生？\"你怎么回应？"], [4, "筛查结果的沟通", "参考：不是怀疑您的健康，而是为了确保我们的计划对您是安全有效的。您的医生最了解您的糖尿病控制情况，有了他的建议，我能为您设计更好的方案。\n\nABC = 问需求→解障碍→一起干，医学许可不是拒绝。"], [4, "2.1 抗阻训练", "● 目前尚没有充分证据证实低到中等强度抗阻训练需要进行正式的预先筛查（ACSM, 2018）\n\n● 关于这个话题的现有资料有限，但并发症风险似乎较低\n\n● 口诀：「抗阻训练 = 证据不足，风险较低」\n\n理解要点：“暂无足够证据支持额外筛查”不等于“无需筛查”。所有客户仍应完成通用的运动前健康筛查。\n\n● 补充：ACSM 2018原文措辞为\"currently there is insufficient evidence\"，注意\"证据不足\"≠\"不需要\"。\n\n• 场景：客户说\"我只做力量训练，不做有氧，应该不用填那些表格吧？\"\n\n• ❌ 错误做法：同意跳过筛查，认为力量训练不需要了解健康状况。\n\n• ✓ 正确做法：解释\"力量训练本身风险不高，但为了全面了解您的身体状况，标准筛查还是要做的。通用筛查是所有客户都要做的，这是另一回事。\"\n\n• 常见误区：认为抗阻训练筛查宽松就完全不做筛查。记住：通用筛查（模块2）是所有客户都要做的。\n\n\"不额外要求筛查\"和\"不需要筛查\"是两回事。抗阻训练筛查宽松是因其固有风险低，通用健康筛查仍适用于所有客户。"], [4, "2.1 抗阻训练（续）", "核心逻辑：低到中等强度抗阻训练的并发症风险较低，目前证据不足以支持额外筛查要求。但通用运动前健康筛查（ACSM算法）仍适用于所有客户。\n\n客户只想做抗阻训练，不需要做运动前健康筛查吗？\n\n仍需要。抗阻训练不额外要求筛查，但通用的运动前健康筛查（ACSM算法）仍适用。\n\n抗阻筛查宽松 ≠ 不做通用筛查，两者不是一回事。"], [4, "2.2 自我筛查", "图4-2\n\n图4-3\n\n图4-4\n\n图4-5\n\n图4-6\n\n● PAR-Q+ = 身体活动准备程度问卷(Physical Activity Readiness Questionnaire-Plus)\n\n● 既是客户的自我筛查工具，又是私教获取更多信息的额外筛查要素\n\n● 编制目的：减少不必要的运动障碍（循证方式）\n\n● 分4页：第1页7个一般健康问题 → 第2-3页后续深入问题（按疾病类别分支）→ 第4页结果判定\n\nPAR-Q+三色判定：\n\n表4-8\n\n| 绿色（全否）\n\n| 可以进行更多身体活动\n\n| 建议慢慢开始，逐步加强，目标每周150分钟中等强度\n\n| 红色（有是）\n\n| 需进一步评估\n\n| 完成ePARmed-X+和/或咨询运动专业人员\n\n| 黄色（延迟）\n\n| 暂时不宜增加活动\n\n| 感冒/发烧→等好转；怀孕→告知医生； 暂时性健康问题→先咨询医生\n\n● 口诀：「绿 = 放行 / 红 = 深入 / 黄 = 等等」\n\n● 类比：类比交通信号灯：绿灯直接走，红灯需要等信号，黄灯观察路况再决定。"], [4, "2.2 自我筛查（续）", "● 补充：PAR-Q+由加拿大开发，定期更新（当前版本2020），可在www.eparmedx.com获取。\n\n• 场景：客户PAR-Q+结果全绿，兴奋地问\"我可以开始做HIIT了吗？\"\n\n• ❌ 错误做法：立刻安排高强度训练。\n\n• ✓ 正确做法： 先肯定他的运动基础，问卷全绿说明他可以安全地开始运动。但也要提醒：\"您现在可以开始了，但建议从低强度逐步增加，给身体适应时间。每周150分钟中等强度是目标，不是一周就要达到。\"\n\n• PAR-Q+使用提醒：\n\n◦ 客户健康状况变化时要重新填写\n\n◦ 全绿不等于\"零风险\"  ， 这只是说明目前不需要进一步评估\n\n◦ PAR-Q+不能替代医学检查"], [4, "2.2 自我筛查", "PAR-Q+的设计哲学是\"默认安全，例外排除\"，假设大多数人是安全的，只排除明确有问题的少数人。 这与ACSM筛查算法\"默认谨慎，逐级审查\"的哲学形成互补。\n\n核心逻辑：PAR-Q+ = 减少不必要的运动障碍，三色判定对应不同行动级别。绿=默认安全，红=需要专业介入，黄=暂时等待。\n\nPAR-Q+的设计目的是什么？\n\nPAR-Q+ = 绿灯放行，红灯深入，黄灯等待。"], [4, "2.3 心脏康复与健康机构中的患者", "● 在心脏康复等临床环境中，应使用比通用筛查更深入的工具\n\n● 建议使用AACVPR（美国心血管和肺康复协会）的风险分层标准\n\n● 必须让客户的私人医生注意任何提示冠状动脉疾病的体征或症状\n\n● 口诀：「临床环境 = 更深筛查」\n\n理解类比：通用健身环境与心脏康复环境就像不同级别的医疗场景，服务对象、专业团队和风险管理深度不同，因而需要匹配相应的筛查与风险分层工具。\n\n●补充：AACVPR分层基于运动能力（MET水平）、左室射血分数（LVEF）、心律失常类型等多维度评估。\n\n• 场景：你在一个心脏康复中心工作，有客户刚做完心脏支架手术想来训练。\n\n• ❌ 错误做法：使用普通健身房的筛查流程。\n\n• ✓ 正确做法：使用AACVPR风险分层标准，并且客户的私人医生必须参与。未经医生明确许可，不能开始任何正式训练。\n\n表4-9\n\n| 普通健身房\n\n| ACSM算法 + PAR-Q+\n\n| 心脏康复中心\n\n| AACVPR风险分层（更深 ，基于运动能力、心功能、心律失常等多维度）\n\n● 常见误区：混淆普通健身房和临床环境的筛查标准。临床环境需要更深的评估。"], [4, "2.3 心脏康复与健康机构中的患者（续）", "筛查深度与风险环境匹配。普通场所用通用工具，高风险场所用专业工具。 筛查深度匹配风险环境即可。\n\n核心逻辑：临床环境（心脏康复等）需要比通用筛查更深入的工具。AACVPR比ACSM算法更专业、更严格。\n\n在心脏康复机构工作的私教，应该使用哪种筛查工具？\n\nAACVPR风险分层标准（比通用筛查更深入）。\n\n临床环境筛查更深，普通健身房用ACSM，心脏康复用AACVPR。"], [4, "3 附加表格", "筛查完成后、客户获批可运动，还需要以下表格：\n\n1. 参与协议\n\n2. 知情同意书/\"风险承担\"表格\n\n3. 生活方式和健康史问卷\n\n● 收集：过往/当前运动信息、药物和补充剂、近期疾病或损伤、手术和损伤史、家族病史、生活方式（营养/压力/工作/睡眠）\n\n4. 医学许可表格\n\n● 客户医生签署，说明运动类型/频率/持续时间/强度\n\n● 标注药物对运动能力或心率反应的影响\n\n● 医生确定建议或限制\n\n法律提醒： 所有表格需当地法律专业人士审核\n\n● 口诀：「四表一审核」= 参与协议 + 知情同意书 + 健康史问卷 + 就医授权书 → 律师审核后使用\n\n● 类比： 好比入职前的全套体检：筛查是\"体检\"，这些表格是\"入职材料\"，法律审核是\"HR确认\"。\n\n● 补充：医学许可表格须由客户医生签署，偏离授权书内容需重新获得医生批准。\n\n• 场景：客户抱怨\"又要填表格，太麻烦了\"。\n\n• ❌ 错误做法：直接说\"这是规定，必须填\"。"], [4, "3 附加表格（续）", "• ✓ 正确做法：把表格当成\"给他自己看的健康档案\"来介绍。告诉他：\"这些信息帮我更了解您，比如您提到的睡眠问题、家族病史，都可能影响训练计划的设计。表格是为您服务的，不是为难您。\"\n\n• 医学许可表格的关键信息：运动类型/频率/持续时间/强度；药物对运动能力的影响；医生的建议或限制。\n\n四张表格构建完整的法律保护链。筛查是\"技术关\"，文件是\"法律关\"，两关都过才能正式开展训练。\n\n核心逻辑：四表一审核 = 技术筛查完成后 + 法律文件保障 = 完整的服务启动流程。\n\n医学许可表格需要谁签署？包含什么关键信息？\n\n客户的私人医生签署。包含：运动类型/频率/持续时间/强度；药物对运动能力/心率的影响；医生的建议或限制。\n\n四表：参与协议+知情同意+健康史+就医授权 → 律师审核"], [4, "4.1 降压药", "● 心脏 → 降低收缩力\n\n● 周围血管 → 扩张增加血流\n\n● 大脑 → 减少交感神经兴奋\n\n● 肾脏 → 排出更多液体减少血容量\n\n关键药物速查表（表4-1精简版）：\n\n表4-10\n\n| β-阻滞剂\n\n| ↓\n\n| ↓（急性/慢性）；VO₂max：急性↓/慢性训练后可改善\n\n| 剂量相关；需改用RPE/说话测试定强度\n\n| ARB + CCB\n\n| ↓或⇄\n\n| ⇄\n\n| 个体差异大\n\n| 其他降压药\n\n| 不定\n\n| 通常⇄\n\n| 多种联用，反应可变\n\n| 抗组胺药\n\n| ⇄（部分第一代抗组胺药可致心率↑）\n\n| —\n\n| 抗抑郁/抗焦虑药\n\n| ↑或⇄\n\n| 兴奋剂\n\n| ↑\n\n| 咖啡因\n\n| ↑耐久性\n\n| 支气管扩张剂\n\n| ⇄（COPD患者↑或⇄）\n\n| 对受支气管痉挛限制者↑运动能力\n\n| 酒精\n\n| 受酒精影响时禁止运动\n\n| 尼古丁替代疗法\n\n| ⇄或↓\n\n| NSAID\n\n| ⇄或↑\n\n● 口诀：「β阻心低换RPE / 利尿脱水多补水 补电解质 / 降压药防体位低」\n\nβ-阻滞剂会降低心率反应；利尿剂可影响水合与电解质平衡；多种降压药可能导致体位性低血压。"], [4, "4.1 降压药（续）", "●  一句话记牢：β-阻滞剂、利尿剂、降压药是三大高频考点，其他药物了解即可。\n\nβ-阻滞剂（最高频考点）：\n\n● 阻断β-肾上腺素能受体 → 限制交感神经刺激 → 降低静息/运动/最大心率\n\n● 常规年龄预测心率法可能不再适用；应根据医疗建议，结合RPE或谈话测试确定运动强度\n\n● 剂量相关反应\n\nβ-阻滞
