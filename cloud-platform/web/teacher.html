<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACEpresso｜组长批改</title><style>:root{--bg:#f7f6f1;--ink:#242320;--muted:#6b6962;--edge:#dcd9d1}*{box-sizing:border-box}body{margin:0;padding:50px 5vw;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,'PingFang SC',sans-serif}main{max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}header strong{color:#326e48;font-size:24px;font-style:italic}a{color:inherit}h1{font-size:36px;margin:35px 0}article{border-top:1px solid var(--edge);padding:28px 0}pre{font:14px/1.9 system-ui,'PingFang SC',sans-serif;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid var(--edge);padding:18px;max-height:300px;overflow:auto}textarea,input{width:100%;padding:10px;margin:5px 0 10px;border:1px solid var(--edge);background:white;font:inherit}textarea{min-height:80px}button{padding:11px 20px;border:0;background:#303a31;color:#fff;cursor:pointer;border-radius:3px}.muted{color:var(--muted)}.toast{color:#326e48}</style></head><body><main><header><strong>3HFIT</strong><span><a href="/study">返回学员站</a></span></header><h1>小组作业批改</h1><p class="muted">系统只显示本组学员已提交的案例作业。请依据当日教材范围与评分要点给出具体反馈。</p><section id="my-group-panel" hidden style="border:1px solid #dedbd2;background:#fffdfa;padding:24px;margin:25px 0 30px">
  <h2 style="font-size:24px;margin:0 0 8px">我的学习小组</h2>
  <p class="muted" style="margin:0 0 15px">首次登录后可以为分配给你的学习小组命名。已发放的本组学员邀请码仍然有效，学生会自动归入这里。</p>
  <p id="current-group">正在读取小组……</p>
  <form id="group-form">
    <label for="group-name" style="display:block;margin:14px 0 6px">小组名称</label>
    <input id="group-name" type="text" minlength="2" maxlength="32" placeholder="例如 第一小组" required style="max-width:400px">
    <button id="save-group" type="submit">创建 / 保存小组名称</button>
  </form>
  <div id="my-group-status" role="status" aria-live="polite" class="toast" style="margin-top:9px"></div>
  <p id="my-group-members" class="muted" style="font-size:13px"></p>
</section><div id="list" aria-live="polite">读取待批改作业……</div></main><script>(()=>{const $=id=>document.getElementById(id);const create=(tag,txt,cls)=>{const n=document.createElement(tag);if(txt!==null)n.textContent=txt;if(cls)n.className=cls;return n};const list=$('list');fetch('/api/teacher/submissions',{credentials:'same-origin'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.detail);return d}).then(d=>{list.textContent='';if(!d.submissions.length){list.append(create('p','当前没有提交的作业。'));return;}for(const entry of d.submissions){const art=create('article'),h=create('h2',`${entry.student}　Day ${String(entry.day).padStart(2,'0')}`),pre=create('pre',JSON.stringify(entry.answers,null,2)),lbl=create('label','评分（0–15）'),score=create('input'),feedback=create('textarea'),btn=create('button','保存批改意见'),status=create('span','','toast');score.type='number';score.min='0';score.max='15';score.value='12';feedback.placeholder='请写明确的专业判断反馈、需要补充的内容及教材依据';btn.addEventListener('click',async()=>{try{const r=await fetch('/api/teacher/reviews',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({student_id:entry.student_id,day:entry.day,score:Number(score.value),comment:feedback.value})});const x=await r.json();if(!r.ok)throw Error(x.detail);status.textContent=' 已保存，学员下次登录可查看';}catch(e){status.textContent=' '+e.message}});art.append(h,pre,lbl,score,feedback,btn,status);list.append(art)}}).catch(e=>{list.textContent='载入失败：'+e.message})})();</script>
<script>
(async()=>{
 const panel=document.getElementById('my-group-panel');
 const status=document.getElementById('my-group-status');
 async function updateInfo(){
  const res=await fetch('/api/leader/my-group',{credentials:'same-origin'});
  const data=await res.json();
  if(!res.ok)throw Error(data.detail||'无法读取小组');
  panel.hidden=false;
  document.getElementById('current-group').textContent='已分配：'+data.cohort+' / '+data.title+'　·　已注册学员 '+data.student_count+' 人';
  document.getElementById('group-name').value=data.title;
  document.getElementById('my-group-members').textContent=data.students?.length?'本组成员：'+data.students.join('、'):'本组暂无已注册学员';
 }
 try{
  const response=await fetch('/api/me',{credentials:'same-origin'});
  const me=await response.json();
  if(!response.ok||me.role!=='leader')return;
  await updateInfo();
  document.getElementById('group-form').addEventListener('submit',async e=>{
   e.preventDefault();
   const btn=document.getElementById('save-group');
   btn.disabled=true;status.textContent='';
   try{
    const r=await fetch('/api/leader/my-group',{
     method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({title:document.getElementById('group-name').value.trim()})
    });
    const d=await r.json();if(!r.ok)throw Error(d.detail||'保存失败');
    await updateInfo();status.textContent='小组名称已保存；本组学员和邀请码归属不会改变';
   }catch(err){status.textContent=err.message;status.style.color='#a23636'}
   finally{btn.disabled=false}
  });
 }catch(err){panel.hidden=false;status.textContent=err.message;status.style.color='#a23636'}
})();
</script>
</body></html>
