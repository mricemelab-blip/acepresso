<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACEpresso｜邀请码管理</title><style>body{font:15px/1.6 system-ui,'PingFang SC',sans-serif;background:#f7f6f1;color:#242320;margin:0;padding:48px 24px}main{max-width:750px;margin:auto}h1{font-size:36px}section{background:#fff;border:1px solid #ddd;padding:25px;margin:20px 0}label{display:block;margin:14px 0 5px}select,input{padding:12px;width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:4px}button{margin-top:18px;padding:13px 20px;background:#29392f;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;background:#f3f1ec;padding:16px;line-height:2}small{color:#666}</style></head><body><main><p>3HFIT / ACEPRESSO</p><h1>邀请码管理</h1><p>管理员专用。邀请码仅在生成时显示一次；建议一位学员发放一个邀请码。</p><section><h2>生成邀请码</h2><label>学习小组</label><select id="group"></select><label>生成数量</label><input id="count" type="number" min="1" max="30" value="5"><label>有效期（天）</label><input id="days" type="number" min="1" max="90" value="14"><label>邀请身份</label><select id="role"><option value="student">学员</option><option value="leader">组长</option></select><button id="create">生成邀请码</button><pre id="codes">尚未生成。</pre><button id="copy" style="display:none">复制邀请码</button><p><small>任何代码都不写进网页源码。密码、注册信息和学习记录由服务端保存。</small></p></section><p><a href="/study">返回学员学习站</a></p><section><h2>创建学习小组</h2><label>班期</label><input id="newCohort" value="第一期" maxlength="50"><label>小组名称</label><input id="newGroup" placeholder="例如 B组" maxlength="50"><button id="addGroup">创建小组</button><p id="groupMsg"></p></section><section><h2>修改管理员密码</h2><p><small>请先输入当前登录密码，再设置新密码。无需把密码发送给任何人。</small></p><label for="oldPass">当前登录密码</label><input type="password" id="oldPass" autocomplete="current-password" required><label for="newPass">新密码（12—128个字符）</label><input type="password" id="newPass" autocomplete="new-password" minlength="12" maxlength="128" required><p><small id="passLength">新密码长度：0个字符（至少12个）</small></p><label for="confirmPass">再次输入新密码</label><input type="password" id="confirmPass" autocomplete="new-password" required><button id="changePass" type="button">确认修改密码</button><p id="passMsg" role="status" aria-live="polite"></p></section></main><script>(()=>{const $=id=>document.getElementById(id);const j=(p,opt={})=>fetch(p,{credentials:'same-origin',...opt}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d});j('/api/admin/groups').then(d=>{$('group').innerHTML=d.groups.map(g=>`<option value="${g.id}">${g.cohort} / ${g.title}</option>`).join('')}).catch(e=>{$('codes').textContent=e.message});let codes=[];$('create').onclick=async()=>{try{const d=await j('/api/admin/invitations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_id:Number($('group').value),valid_days:Number($('days').value),count:Number($('count').value),role:$('role').value})});codes=d.codes;$('codes').textContent=codes.join('\n');$('copy').style.display='inline-block'}catch(e){$('codes').textContent=e.message}};$('copy').onclick=()=>navigator.clipboard.writeText(codes.join('\n'));$('addGroup').onclick=async()=>{try{const r=await j('/api/admin/groups',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cohort:$('newCohort').value,title:$('newGroup').value})});$('groupMsg').textContent='已创建小组，刷新页面可选择';}catch(e){$('groupMsg').textContent=e.message}};$('newPass').addEventListener('input',()=>{$('passLength').textContent='新密码长度：'+[...$('newPass').value].length+'个字符（至少12个）'});$('changePass').onclick=async()=>{const msg=$('passMsg');msg.style.color='#a32f2f';msg.textContent='';const old=$('oldPass').value,newPassword=$('newPass').value,confirm=$('confirmPass').value;if(!old){msg.textContent='请填写当前登录密码';return}if([...newPassword].length<12){msg.textContent='新密码不足12个字符';return}if([...newPassword].length>128){msg.textContent='新密码超过128个字符';return}if(newPassword!==confirm){msg.textContent='两次输入的新密码不一致';return}const btn=$('changePass');btn.disabled=true;try{await j('/api/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:old,new_password:newPassword})});msg.style.color='#215e3a';msg.textContent='密码已修改。下次登录请使用新密码。';$('oldPass').value='';$('newPass').value='';$('confirmPass').value='';$('passLength').textContent='新密码长度：0个字符（至少12个）';}catch(e){msg.textContent=e.message}finally{btn.disabled=false}};})();</script></body></html>
