<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACEpresso｜邀请码管理</title><style>body{font:15px/1.6 system-ui,'PingFang SC',sans-serif;background:#f7f6f1;color:#242320;margin:0;padding:48px 24px}main{max-width:750px;margin:auto}h1{font-size:36px}section{background:#fff;border:1px solid #ddd;padding:25px;margin:20px 0}label{display:block;margin:14px 0 5px}select,input{padding:12px;width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:4px}button{margin-top:18px;padding:13px 20px;background:#29392f;color:white;border:0;cursor:pointer}pre{white-space:pre-wrap;word-break:break-all;background:#f3f1ec;padding:16px;line-height:2}small{color:#666}</style></head><body><main><p>3HFIT / ACEPRESSO</p><h1>邀请码管理</h1><p>管理员专用。邀请码仅在生成时显示一次；建议一位学员发放一个邀请码。</p><section><h2>生成邀请码</h2><label>学习小组</label><select id="group"></select><label>生成数量</label><input id="count" type="number" min="1" max="30" value="5"><label>有效期（天）</label><input id="days" type="number" min="1" max="90" value="14"><label>邀请身份</label><select id="role"><option value="student">学员</option><option value="leader">组长</option></select><button id="create">生成邀请码</button><pre id="codes">尚未生成。</pre><button id="copy" style="display:none">复制邀请码</button><p><small>任何代码都不写进网页源码。密码、注册信息和学习记录由服务端保存。</small></p></section><p><a href="/study">返回学员学习站</a></p></main><script>(()=>{const $=id=>document.getElementById(id);const j=(p,opt={})=>fetch(p,{credentials:'same-origin',...opt}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.detail||'请求失败');return d});j('/api/admin/groups').then(d=>{$('group').innerHTML=d.groups.map(g=>`<option value="${g.id}">${g.cohort} / ${g.title}</option>`).join('')}).catch(e=>{$('codes').textContent=e.message});let codes=[];$('create').onclick=async()=>{try{const d=await j('/api/admin/invitations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({group_id:Number($('group').value),valid_days:Number($('days').value),count:Number($('count').value),role:$('role').value})});codes=d.codes;$('codes').textContent=codes.join('\n');$('copy').style.display='inline-block'}catch(e){$('codes').textContent=e.message}};$('copy').onclick=()=>navigator.clipboard.writeText(codes.join('\n'))})();</script></body></html>
