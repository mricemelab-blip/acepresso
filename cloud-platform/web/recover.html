<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACEpresso｜管理员密码恢复</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f1ec;color:#282923;font:16px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:620px;margin:9vh auto;padding:44px 46px;background:#fffdfa;border:1px solid #d8d5cc}
.small{font-size:12px;letter-spacing:.12em;color:#74776c}h1{font-size:31px;font-weight:700;margin:20px 0 8px;line-height:1.3}
p{color:#5b5c55;margin:8px 0 20px}
label{display:block;font-size:14px;font-weight:650;margin-top:18px}
input{width:100%;margin-top:7px;border:1px solid #bcbab1;background:#fff;color:#242521;padding:13px 15px;border-radius:4px;font:inherit}
input:focus{outline:2px solid #3f5143;outline-offset:1px}
button{border:0;background:#30443a;color:#fff;padding:13px 22px;font:inherit;font-weight:650;cursor:pointer;margin-top:23px}
button:disabled{opacity:.6;cursor:default}
a{color:#30443a;text-underline-offset:3px}
#status{margin:15px 0 0;min-height:25px;font-size:14px}
footer{border-top:1px solid #d9d7d1;margin-top:28px;padding-top:20px}
@media(max-width:640px){main{margin:15px;padding:30px 24px}h1{font-size:26px}}
</style>
</head>
<body>
<main>
<div class="small">3HFIT / ACEPRESSO</div>
<h1>恢复管理员登录</h1>
<p>仅用于这次管理员密码恢复。恢复码限时有效、使用一次后自动失效。你可以在本页面设置新密码，不需要把密码发送给任何人。</p>
<form id="form">
<label for="code">一次性恢复码</label>
<input id="code" type="text" autocomplete="off" spellcheck="false" required placeholder="ACE-REC-…">
<label for="password">新密码（12—128个字符）</label>
<input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="confirm">再次输入新密码</label>
<input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button id="submit" type="submit">确认重设密码</button>
</form>
<div id="status" role="status" aria-live="polite"></div>
<footer><a href="/">返回登录</a></footer>
</main>
<script>
document.getElementById('form').addEventListener('submit',async function(e){
 e.preventDefault();
 const btn=document.getElementById('submit'),status=document.getElementById('status');
 const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 if(password!==confirm){status.style.color='#a23232';status.textContent='两次输入的新密码不一致';return;}
 btn.disabled=true;status.textContent='正在验证恢复码…';status.style.color='#333';
 try{
  const response=await fetch('/api/recover-admin',{
   method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({code:document.getElementById('code').value,password,confirm})
  });
  const data=await response.json();
  if(!response.ok)throw Error(data.detail||'恢复失败，请重试');
  status.style.color='#285e43';
  status.textContent='密码重设成功。请返回登录页面，使用 ace-director 和刚设置的新密码登录。';
  document.getElementById('form').reset();
  btn.textContent='已完成';
 }catch(err){status.style.color='#a23232';status.textContent=err.message;btn.disabled=false;}
});
</script>
</body></html>
