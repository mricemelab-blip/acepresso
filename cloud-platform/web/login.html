<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACEpresso｜学员登录</title>
<style>:root{--bg:#f7f6f1;--ink:#242320;--muted:#706f68;--line:#dedcd5;--red:#b9232d;--green:#326e48}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{border-bottom:1px solid var(--line);padding:21px clamp(20px,5vw,70px);display:flex;align-items:center;justify-content:space-between}header strong{font-size:25px;letter-spacing:-1.5px;color:var(--green);font-style:italic}header span{font-size:11px;letter-spacing:1px;color:var(--muted)}main{max-width:1050px;margin:clamp(40px,7vh,90px) auto;padding:0 25px;display:grid;grid-template-columns:1fr 400px;gap:clamp(40px,7vw,110px);align-items:start}h1{font-size:clamp(48px,7vw,94px);letter-spacing:-.065em;line-height:1.1;font-weight:650;margin:0 0 28px;color:var(--red)}.lead{font-size:22px;margin:0 0 18px}.desc{max-width:380px;color:var(--muted)}.stats{display:flex;gap:28px;border-top:1px solid var(--line);margin-top:44px;padding-top:18px;font-size:13px;color:var(--muted)}.stats b{font-size:20px;color:var(--ink);display:block}section{background:#fffefa;border:1px solid var(--line);padding:32px;border-radius:8px;box-shadow:0 12px 35px #22222208}h2{margin:0 0 20px;font-size:24px}label{display:block;font-size:13px;margin:14px 0 6px;font-weight:600}input{width:100%;border:1px solid #c9c8c2;background:white;border-radius:5px;padding:13px;font-size:15px;min-height:46px}input:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}button{cursor:pointer;border-radius:5px;font:inherit}.primary{width:100%;background:#2b332d;border:1px solid #2b332d;color:white;min-height:46px;margin-top:22px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:18px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 0 12px;color:var(--muted)}.tabs button[aria-selected=true]{border-color:var(--red);color:var(--ink);font-weight:700}.hidden{display:none}.error{margin-top:14px;min-height:25px;color:#a31624;font-size:13px}.fine{font-size:12px;color:var(--muted);margin:18px 0 0}footer{padding:35px 5vw;text-align:center;color:var(--muted);font-size:11px}@media(max-width:720px){main{display:block;margin:40px auto}main aside{margin-bottom:40px}h1{font-size:60px}section{padding:24px}}</style></head>
<body><header><strong>3HFIT</strong><span>ACEPRESSO / STUDENT</span></header><main><aside><h1>ACEpresso.</h1><p class="lead">21天专业研习营</p><p class="desc">学员登录后，按日期查看课程、教材、复习卡和客户案例，学习记录保存在个人账号中。</p><div class="stats"><div><b>21</b>天安排</div><div><b>12</b>场直播</div><div><b>09</b>章教材</div></div></aside><section><div class="tabs"><button id="tab-login" type="button" aria-selected="true">已有账号登录</button><button id="tab-register" type="button" aria-selected="false">邀请码注册</button></div><h2 id="form-title">学员登录</h2><form id="form"><div id="register-fields" class="hidden"><p class="fine" style="margin:0 0 12px">组长请选择“邀请码注册”，输入收到的组长邀请码。姓名可以填写中文；登录账号由你自己设置。身份由邀请码自动确定，无需填写“组长”。</p><label for="invite">邀请码（只用于首次注册）</label><input id="invite" maxlength="70" autocomplete="off" placeholder="请输入组长或课程管理员发放的邀请码"><label for="name">姓名或学习昵称</label><input id="name" maxlength="50" autocomplete="name" placeholder="用于课程和组长批改"></div><label for="username">登录账号（自己创建，以后就用它登录）</label><input id="username" minlength="2" maxlength="50" autocomplete="username" required placeholder="例如 张老师01 或 leader01"><label for="password">密码（自己设置，至少10个字符）</label><input id="password" type="password" minlength="10" maxlength="128" autocomplete="current-password" required placeholder="请输入自己的密码"><label style="font-size:12px;font-weight:400;margin-top:8px"><input id="showPassword" type="checkbox" style="width:15px;min-height:auto;vertical-align:middle;margin:0 7px 0 0">显示密码</label><div id="confirm-fields" class="hidden"><label for="confirmPassword">再次输入注册密码</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="请再次输入相同密码"></div><button id="submit" class="primary" type="submit">登录学习站</button><p id="message" class="error" role="status" aria-live="polite"></p><p class="fine" id="recovery-help">管理员账号无法登录？<a href="/recover-admin" style="color:#326e48;text-underline-offset:3px">打开管理员密码恢复页面</a></p><p class="fine">邀请注册仅需一次。以后使用账号和密码登录；邀请码用后失效。</p></form></section></main><footer>3HFIT EDUCATION · ACEPRESSO</footer>
<script>(()=>{'use strict';let mode='login';const $=x=>document.getElementById(x);const setMode=m=>{mode=m;$('tab-login').setAttribute('aria-selected',String(m==='login'));$('tab-register').setAttribute('aria-selected',String(m==='register'));$('register-fields').classList.toggle('hidden',m!=='register');$('confirm-fields').classList.toggle('hidden',m!=='register');$('confirmPassword').required=(m==='register');$('form-title').textContent=m==='login'?'账号登录':'邀请码注册';$('submit').textContent=m==='login'?'登录学习站':'注册并进入学习站';$('password').autocomplete=m==='login'?'current-password':'new-password';$('message').textContent=''};$('tab-login').onclick=()=>setMode('login');$('tab-register').onclick=()=>setMode('register');$('showPassword').onchange=()=>{$('password').type=$('showPassword').checked?'text':'password';$('confirmPassword').type=$('showPassword').checked?'text':'password'};if(new URLSearchParams(location.search).get('register')==='1')setMode('register');$('form').addEventListener('submit',async e=>{e.preventDefault();$('message').textContent='';$('submit').disabled=true;const p={login:$('username').value.trim(),password:$('password').value};if(mode==='register'){p.name=$('name').value.trim();p.invite=$('invite').value.trim();if(p.password!==$('confirmPassword').value){$('message').textContent='两次输入的密码不一致';$('submit').disabled=false;return}}try{const r=await fetch(mode==='register'?'/api/register':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(p)});const d=await r.json();if(!r.ok)throw Error(d.detail||'登录失败');location.replace(d.user?.role==='admin'?'/manage':d.user?.role==='leader'?'/teacher':'/study')}catch(err){$('message').textContent=err.message||'请稍后再试';$('submit').disabled=false}});})();</script></body></html>
