<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ACEpresso｜组长密码恢复</title>
<style>
:root{--bg:#f5f4ef;--paper:#fffefa;--ink:#292c29;--muted:#666861;--edge:#ddd9d0;--accent:#35453b;--terracotta:#af5649}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);margin:0;font:15px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:610px;margin:8vh auto;padding:44px 46px;background:var(--paper);border:1px solid var(--edge)}
small{color:var(--muted);letter-spacing:.12em}h1{font-size:32px;margin:22px 0 10px;font-weight:650;line-height:1.3}
p{color:var(--muted);margin:8px 0 22px}label{display:block;margin:17px 0 5px;font-weight:650}
input{width:100%;background:#fff;border:1px solid #c9c9c1;padding:12px 13px;color:#222;font:inherit;border-radius:3px}
input:focus-visible,button:focus-visible{outline:2px solid #53695a;outline-offset:2px}
button{background:var(--accent);color:#fff;font:inherit;font-weight:620;padding:13px 22px;border:none;cursor:pointer;margin-top:22px}
button:disabled{opacity:.6}a{color:#425648;text-underline-offset:4px}
#message{min-height:28px;margin:14px 0 0;font-size:14px;color:#a53a35}
hr{border:0;border-top:1px solid var(--edge);margin:28px 0 15px}
@media(max-width:650px){main{margin:15px;padding:27px 23px}h1{font-size:27px}}
</style>
</head>
<body><main>
<small>3HFIT / ACEPRESSO</small>
<h1>组长密码恢复</h1>
<p>请使用管理员单独发送给你的恢复码，重新设置自己的组长账号密码。恢复码仅对应一个账号，24小时内有效，使用一次即失效。原有小组和作业记录会保留。</p>
<form id="reset-form">
<label for="login">原登录账号</label>
<input id="login" name="login" type="text" autocomplete="username" required placeholder="填写第一次注册时自己创建的登录账号">
<label for="code">一次性密码恢复码</label>
<input id="code" name="code" type="text" autocomplete="off" spellcheck="false" required placeholder="ACE-RST-…">
<label for="password">设置新密码（至少10个字符）</label>
<input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
<label for="confirm">再次输入新密码</label>
<input id="confirm" type="password" autocomplete="new-password" minlength="10" maxlength="128" required>
<button id="submit" type="submit">确认重设组长密码</button>
<p id="message" role="status" aria-live="polite"></p>
</form>
<hr>
<a href="/">返回 ACEpresso 登录页</a>
</main>
<script>
document.getElementById('reset-form').addEventListener('submit',async function(event){
 event.preventDefault();
 const submit=document.getElementById('submit'),message=document.getElementById('message');
 const login=document.getElementById('login').value.trim(),code=document.getElementById('code').value.trim();
 const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;
 message.textContent='';message.style.color='#a53a35';
 if(password!==confirm){message.textContent='两次输入的新密码不一致';return}
 submit.disabled=true;
 try{
  const r=await fetch('/api/recover-leader',{method:'POST',credentials:'same-origin',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({login,code,password,confirm})});
  const result=await r.json();if(!r.ok)throw Error(result.detail||'恢复失败');
  message.style.color='#2e6943';
  message.textContent='密码重设成功。请使用原登录账号和新密码重新登录组长工作台。';
  document.getElementById('code').value='';
  document.getElementById('password').value='';
  document.getElementById('confirm').value='';
  submit.textContent='重设完成';
 }catch(err){message.textContent=err.message||'请求失败，请再试';submit.disabled=false}
});
</script>
</body></html>
